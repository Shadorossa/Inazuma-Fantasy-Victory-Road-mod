schema = "CharacterReforged.duplicate_rules/1"
# New Recruitment › its policy for Character Reforged's duplicate-players hook:
# when a save is duplicated into
# another slot («X: duplicar» of the slot screen), the copy keeps ONE copy per card; with apply_on_load, the same on
# every load of a player slot. Rules merge key by key across mods: No More Rarities declares the normal card's rarity
# (its content\duplicate_rules\no_more_rarities.toml), this module the one-card limit. Was No More Rarities' (1.0.0-1.0.13)
# and before that Inazuma Fantasy's «Ajustar save al mod» rule `one_card`.

[CharacterReforged.DuplicateRules.new_recruitment]
# "card": one copy per chara_param id. Two cards of one character or one name (a normal card and its miximax form) are
# two players and both stay
one_card_per = "card"
# which copy stays: the first of these that tells two copies apart decides; the other copies are merged into it (his
# team slots, captain, team aura, dock bits and bank lists) and leave the club
keep_first = ["in_a_fusion", "highest_level", "most_experience", "most_special_move_uses", "in_a_team", "oldest", "lowest_handle"]
# element spirits (the story's «fichas» of the player's element) given back for each copy that leaves
element_spirits_per_released_card = 3
# also on every load of a player slot: one copy per card,
# the other copies merged into the kept one and removed from the save and from every team. Before the first rewrite of
# a save a durable copy of its file is kept (Character Reforged's scripts\duplicate_players.lua «slot_load», blob
# save-backup-slot<N>-<stamp>-before-duplicate-rules.bin); the locked retail slot and reserved slots are never touched
apply_on_load = true
