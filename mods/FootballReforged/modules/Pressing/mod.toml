id = "Pressing"
# name / description: the English fallback; the card shows the text keys mod_name / mod_description (text\keys.toml)
name = "Team pressing"
version = "0.2.4"
author = "Fantasy Team"
author_steam = "76561199013321372"
description = "Without the ball, L2 becomes a press button instead of the focus field: hold it and 2 to 4 of your teammates nearest to the ball carrier sprint at him (never the keeper); release it or win the ball back and they play as before. The CPU presses with the same rules. With a stamina mod, a winded player does not press. With the ball, L2 is the game's."
priority = 0
tags = ["Gameplay"]
updated = "2026-11-03"
# This mod's own names (Lua Pressing.X); never VRFW.
prefix = "Pressing"
folder = "Pressing"
# Replaces the off-ball L2 focus field with a press button, for the user and the CPU. Standard mod layout:
#   config.toml             [pressing]: who presses (count, distance band, range), the sprint, the sprint bar rule,
#                           the focus field gate, your press button, the CPU's rules; [pressing.ai]: the AI's own press
#   scripts\pressing.lua    the run time: every match frame, who presses and when
#   text\keys.toml          the mod's name / description and the L2 guide's word (press_hud_label), 9 languages
#   content\images\hud\     the L2 guide's word as a sprite of soccer08_17, 9 languages (made from press_hud_label by
#                           research/scripts/vrfw_action_label_build.py)
# The framework provides the mechanisms (VRFW.ai.move / release, VRFW.ai.focus_field_gate,
# VRFW.input.on, VRFW.ai.arrow, VRFW.hud.go_ahead_guide); this module only declares the rules. Aura Points (Character
# Reforged, 1.2.0+) is optional: its sprint bar (role key VRFW.sprint) limits who presses when it is on.
requires = ["VRFW>=0.2.4", "FootballReforged>=0.2.4"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
# no native permission: the script's effects (VRFW.ai.move / release / focus_field_gate) are the script default
permissions = []

[exports]
functions = []
keys = []
tables = []

# A MODULE of Football Reforged: shown inside Football Reforged's entry on the Mods
# screen; switching Football Reforged off switches it off too. On by default.
[module]
of = "FootballReforged"
order = 100
