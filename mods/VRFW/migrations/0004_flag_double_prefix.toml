# Flag names already carry their mod's prefix, so the framework's key <mod>.<name> held it twice. The key is now
# vrfw_engine_base::ids::own_key: the saves' maps and the flag registry follow, every flag keeps its bit and its value.
# keep_source: the number the saves hold wins over any number a build gave the new key.
schema = "VRFW.migration/1"
id = "VRFW.flag_double_prefix"
description = "Flag keys written with the mod's prefix twice lose the second one; every flag keeps its bit in each save"
phase = "data"
after = ["VRFW.vrfw_prefix_data"]

[[step]]
kind = "rename_flag"
from = "CharacterReforged.CharacterReforged.AliusStoneUnlocked"
to = "CharacterReforged.AliusStoneUnlocked"
if_target = "keep_source"

