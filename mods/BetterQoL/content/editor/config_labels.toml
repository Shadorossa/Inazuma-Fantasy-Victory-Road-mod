  Of = "string"
  Label = { es = "Idiomas sin cambio en equipos", en = "Languages without team change" }
  Help = { es = "Idiomas de texto en los que los nombres de equipo nunca cambian (ahí ya son los japoneses).", en = "Text languages where team names never change (they are already the Japanese ones)." }
