[it.new]
option_duel_auras = "Aure nei duelli liberi"
option_duel_auras_help = "In un duello, un'aura (keshin, totem, armatura, Mix-Max...) non risponde mai alla supertecnica avversaria: il duello va in pausa, l'aura si attiva e il duello riprende con la scelta ancora aperta. Per entrambe le squadre, anche la CPU. Vale al riavvio del gioco."
option_technical_combo = "Combo tecnica"
option_technical_combo_help = "La Combo tecnica del gioco: vincere i duelli di concentrazione con le supertecniche aumenta la potenza del tiro successivo fino a 3 livelli e riduce il costo di tensione delle supertecniche. Disattivata: non si accumula nessuna combo. Si applica al riavvio del gioco."
option_move_cooldown = "Ricarica delle supertecniche"
option_move_cooldown_help = "Attivato: una supertecnica attende il suo tempo di ricarica prima di poter essere riutilizzata, come nel gioco. Disattivato: le supertecniche si possono riutilizzare subito, in entrambe le squadre; costano comunque tensione e le aure mantengono la loro ricarica. Vale da subito; una tecnica già in ricarica finisce il suo tempo."
mod_name = "Football Reforged"
mod_description = "Meccaniche di gioco in moduli che attivi o disattivi in Mods: barriera del portiere, furore, stadio di casa, pressing, tempo di recupero e una CPU leggendaria. Aggiunge anche i formati Calcio a 7, Inazuma Street e 5 contro 5, i duelli di abilità, le aure nei duelli aperti e le sfide di partita."
ruleset_football_7 = "Calcio a 7 (7 contro 7)"
