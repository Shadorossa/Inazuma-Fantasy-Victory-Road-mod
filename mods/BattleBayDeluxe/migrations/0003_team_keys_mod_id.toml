# The Battle Bay copies of the teams were keyed bbcr_<name>_bb (the old mod id bb_chronicle_teams); a team id is crc32(key).
schema = "VRFW.migration/1"
id = "BattleBayDeluxe.team_keys_mod_id"
description = "Saved Battle Bay runs and careers keep their teams after the team keys took the mod id (battlebaydeluxe_<name>_bb)"
phase = "saves"

# Team ids are numbers in the slot blobs and, in a career, also the keys of the per-club tables (economy, training, market).
[[step]]
