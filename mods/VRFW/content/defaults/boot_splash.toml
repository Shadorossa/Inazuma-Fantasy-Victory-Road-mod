# The launcher screen at each game start (docs/framework/auto-update.md).
[launcher]
connect_timeout_ms = 8000
receive_timeout_ms = 30000
max_manifest_bytes = 16777216
max_logged_paths = 50
# Tools that write the cache: Clear cache refuses while one runs.
cache_build_processes = ["vrfw-prebuild.exe"]
# Play after a mods change starts the game again; that start skips the launcher when it comes within this time.
play_on_start_seconds = 120
repaint_ms = 100

