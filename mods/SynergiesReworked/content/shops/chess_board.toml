schema = "VRFW.shop/2"

# Synergies Reworked › in the retail synergy shop (0x5B032CEA, the Mercado de fichas that sells
# the synergies for the cards of their members: here 10 cards each of the white King, Queen, Rook and Knight, rarity 4;
# the shop shows at most 4 card costs).
[[edit]]
target = "0x5B032CEA"
  [[edit.entry]]
  item = "chess_board"
  stock = 1
  costs = [
    { currency = "quentin_cinquedea_card", count = 10 },
    { currency = "aime_quintet_card", count = 10 },
    { currency = "eljas_viisi_card", count = 10 },
    { currency = "ferdinand_delafunfe_card", count = 10 },
  ]

# Inazuma Fantasy's training shop also sells it, at the price of every other synergy there (1 Punto de pasión, stock 1);
# only while Inazuma Fantasy is active.
[[edit]]
target = "InazumaFantasy.training_shop"
if_mod = "InazumaFantasy"
  [[edit.entry]]
  item = "chess_board"
  price = 1
  currency = "tk_bb000001"
  stock = 1
