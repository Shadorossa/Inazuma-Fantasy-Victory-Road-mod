mode = "set"
saturation = 1.1

# ---------------------------------------------------------------- the new pooled effects and the trigger

[[effect]]
name = "furor_fire_0"
from = "ega0550a"
object = "egr0550a"

[[effect]]
name = "furor_fire_1"
from = "ega0551a"
object = "egr0551a"

[[effect]]
name = "furor_fire_2"
from = "ega0552a"
object = "egr0552a"

[[effect]]
name = "furor_fire_3"
from = "ega0553a"
object = "egr0553a"

# body_auras: the body aura shell ega0550a (pink colour plate effAuraTex_05) -> the retail body aura 0x293ACB8C, the
# same shell with the orange colour plate effAuraTex_08 (luminance 4 instead of 2)
[[chr_trigger]]
name = "furor_phase_fire"
like = "0x9627F4F7"
effects = { ega0550a = "furor_fire_0", ega0551a = "furor_fire_1", ega0552a = "furor_fire_2", ega0553a = "furor_fire_3" }
body_auras = { ega0550a = "0x293ACB8C" }

