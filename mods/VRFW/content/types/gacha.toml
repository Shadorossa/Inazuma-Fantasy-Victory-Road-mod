# Declaration schema of the gacha service (content\gacha\*.toml, docs/framework/gacha.md): [[VRFW.GachaPool]] entries.
schema = "VRFW.decl_schema/1"
kind = "VRFW.gacha/1"
folder = "content/gacha"
# v2 words, read beside the v1 ones until the switch: the type, its kind folder and its format version.
v2_type = "VRFW.Shop.Gacha"
v2_kind_folder = "Shop/Gacha"
v2_version = 1
label = "Gacha pools"
label_es = "Fondos de gacha"
doc = "A gacha pool: it draws one card at random among the cards the club can sign, for a cost."
doc_es = "Un fondo de gacha: saca una carta al azar entre las que el club puede fichar, a cambio de un coste."

[entry.GachaPool]
doc = "a gacha pool: each command row of its node draws its number of cards at random (equal odds, no repeats) among the cards the club can sign (a card already in the club is left out), takes the cost of those cards and signs them like any recruitment"
name = { type = "name", required = true, doc = "key <mod>.<name> (a-z 0-9 _)" }
cards = { type = "strings", ref = "player", required = true, doc = "the cards: chara_param ids (0x…) or a mod's character <mod>.<name> (its card)" }
node = { type = "name", doc = "the [[VRFW.RouteNode]] Name of the Chronicle board node that opens the pool (its piece runs the gacha instead of the command menu); none = opened only by VRFW.gacha.run" }
cost_item = { type = "string", ref = "item", default = "", doc = "an item a draw takes (a name or 0x…): none = free" }
cost_count = { type = "int", min = 0, max = 9999, default = 0, doc = "how many of cost_item each drawn player takes" }
no_cost_text = { type = "string", default = "vrfw_gacha_no_cost", doc = "the window shown when the player has less of cost_item than the row costs (no draw): a text key or id" }
count_text = { type = "string", default = "", doc = "the command row's second line: a text key or id with %d = how many of cost_item the player has; none = no second line" }
level = { type = "int", min = 1, max = 999, default = 1, doc = "the drawn player's level" }
command = { type = "string", default = "vrfw_gacha_command", doc = "the node panel's command row (replaces the battle rows) when draw_commands names none: a text key or id" }
draws = { type = "ints", min = 1, max = 12, default = [1], doc = "the node panel's command rows: how many players each row draws, in order (the result screen holds at most 12)" }
draw_commands = { type = "strings", default = [], doc = "each row's text, in the order of draws: a text key or id; %d in the text = what the row costs; a row without one uses command" }
banner = { type = "string", default = "", doc = "the node panel's banner picture instead of the team's: a VRFW image name of the mod (content/images); none = the retail banner" }
extensible = { type = "bool", default = false, doc = "other mods may add cards with [[VRFW.GachaAdd]] (the mod also lists <name> in mod.toml [exports] keys)" }
when = { type = "when", doc = "conditions on the declaring mod's config: all must hold, else the declaration is left out" }

[entry.GachaAdd]
doc = "cards added to another mod's extensible pool; a pool that is not declared (its mod off) or not extensible = nothing added (info line)"
pool = { type = "string", required = true, doc = "the pool's key <mod>.<name>" }
cards = { type = "strings", ref = "player", required = true, doc = "the cards: chara_param ids (0x…) or a mod's character <mod>.<name> (its card)" }
when = { type = "when", doc = "conditions on the declaring mod's config: all must hold, else the declaration is left out" }
