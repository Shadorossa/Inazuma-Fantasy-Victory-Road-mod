# New Recruitment › the pachanga list of a Chronicle board zone: the
# framework's pose row screen with the zone's pachangas; the selected one's 5 players pose
# in 3D. Pages: scripts\pachangas.lua (CMND_CLASSICRECRUITMENT_PACHANGA_MENU). Opened by the
# board's ClassicRecruitment.PachangaMenu.Open (assets\lua\vs_route_town_menu\new_recruitment_pachangas.lua).
schema = "VRFW.pose_row/1"
if_mod = "FootballReforged"

[[VRFW.PoseRow]]
name = "pachangas"
source = "CMND_CLASSICRECRUITMENT_PACHANGA_MENU"
models = 5
title = "new_recruitment_pachangas_title"
decide = "new_recruitment_pachangas_play"
# the Chronicle board's node panel look: the zone's pachangas as its rows, the blue side panel with
# the players posing (5 a page: every player of the pachanga), Y «Plantilla de equipo»
style = "node_panel"
banner = "new_recruitment_pachangas_title"
panel_title = "new_recruitment_pachangas_players"
team = "new_recruitment_pachangas_team_dock"
page = "new_recruitment_pachangas_page"
