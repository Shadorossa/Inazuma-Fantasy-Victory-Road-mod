schema = "VRFW.option/2"
# Option rows of the framework in the mod options tab; values are stored under mod_options.<id>.

# Opening movie shown by the title.

# Group: game settings.
[[option]]
id = "game_settings"
type = "toggle"
label = "game_settings"
help = "game_settings_help"
default = 1
group = true
order = 100

# Group: custom style.
[[option]]
id = "custom_style"
visual = true
type = "toggle"
label = "custom_style"
help = "custom_style_help"
default = 1
group = true
order = 120

[[option]]
id = "opening"
visual = true
type = "list"
hook = "title_opening"
parent = "mod_options.custom_style"
label = "opening"
help = "opening_help"
values = [
    { value = 0, name = "opening_retail", text = "Retail" },
]
default = 0
# First child of the custom style group; a child's order only places it among its siblings.
order = 121

# Background of the title screen and the save slot list. Mods add values with [[VRFW.TitleBackground]] (image type);
# the value is read when the game starts. It has no parent row: the group above does not switch it.
[[option]]
id = "title_background"
visual = true
type = "list"
label = "title_background"
help = "title_background_help"
values = [
    { value = 0, name = "title_background_default", text = "Default" },
]
default = 0
restart = true
# After the custom style group and its children.
order = 126
