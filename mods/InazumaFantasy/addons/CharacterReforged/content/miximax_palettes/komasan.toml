# Komasan's miximax colours: his own model has no game character to lend him colour keys, so this mod declares them.
# His whole fur is one cream, so it is his hair colour on the head and on the face patches alike; the black pupil is his iris.
# The yellow eye ring, the nose, the cheek swirls and the blue ears are never recoloured.
schema = "VRFW.miximax_palette/1"

[[VRFW.MiximaxPalette]]
character = "c90640000"
head = "_face/90_FANTASY/c90640000/c90640000.g4tx"
hair = "#ECE0D0"
face = "#ECE0D0"
iris = "#000000"
skin = "#ECE0D0"
# The painted zones of his head: the cream fur only, as the hair colour on both textures, so the face patches match the head.
zones = { face = "assets/images/miximax_zones/c90640000_face.png", hair = "assets/images/miximax_zones/c90640000_hair.png" }
