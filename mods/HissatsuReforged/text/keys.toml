[es.new]
mod_name = "Hissatsu Reforged"
mod_description = "Reequilibra 683 supertécnicas con nueva potencia, coste de tensión y tiempo de recarga. Las supertécnicas con dos propiedades muestran los dos iconos en todas las listas, y pueden lograr golpes críticos. Las supertécnicas suben de nivel a la manera clásica: cada técnica crece con las veces que el jugador la usa en los partidos, y un aviso dice cuándo sube. El último nivel necesita el Cuaderno de evolución definitiva de la Tienda general, y un jugador ya no puede llevar la misma supertécnica dos veces."
option_power_changes = "Cambios de poder"
option_power_changes_help = "Activado: la nueva potencia de las supertécnicas del mod. Desactivado: cada técnica usa la potencia del juego. Se aplica al reiniciar el juego."
