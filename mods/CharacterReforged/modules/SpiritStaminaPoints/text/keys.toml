schema = "VRFW.text_key/1"
# Texts of «Aura Points»:
# the «Mods» screen's name and description and the option rows of options.toml. A
# language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Spirit & Stamina Points"
mod_description = "Keshin, keshin armours and totems run on points instead of time, as in Chrono Stone and Galaxy. Summoning is free and unlimited; the spirit's special move costs its fighting-spirit points (PEG, or SP for totems) instead of tension, an armour drains them while worn, and an empty pool sends the spirit away. Every player also has a stamina bar (GP): running and dashing spend it, Physical makes it last, half-time gives some back, and an exhausted player slows down. Each part can be switched off in settings."
option_peg = "Keshin spend points, not time"
option_peg_help = "On: keshin and armours run on PEG pools. Off: the game's timers. Applies after restarting the game."
option_sp = "Totems spend points, not time"
option_sp_help = "On: totems run on SP bars. Off: the game's timers. Applies after restarting the game."
option_pe = "Stamina bar for every player"
option_pe_help = "On: every player has GP for the whole match. Off: no GP, as in the game. Applies after restarting the game."

[es.new]
mod_name = "Puntos de espíritu y aguante"
mod_description = "Los espíritus guerreros, sus armaduras y los tótems funcionan con puntos en lugar de tiempo, como en Chrono Stone y Galaxy. Invocar es gratis y sin límite; la supertécnica del espíritu gasta sus puntos de espíritu guerrero (PEG, o SP en los tótems) en lugar de tensión, una armadura los drena mientras se lleva y una reserva vacía hace que el espíritu se marche. Cada jugador tiene además una barra de aguante (GP): correr y esprintar la gastan, el Físico la hace durar, el descanso devuelve algo y un jugador agotado se ralentiza. Cada parte se puede desactivar en los ajustes."
option_peg = "Keshin: gastan puntos, no tiempo"
option_peg_help = "Activado: keshin y armaduras usan PEG. Desactivado: el tiempo del juego. Se aplica al reiniciar el juego."
option_sp = "Tótems: gastan puntos, no tiempo"
option_sp_help = "Activado: los tótems usan SP. Desactivado: el tiempo del juego. Se aplica al reiniciar el juego."
option_pe = "Barra de resistencia de cada jugador"
option_pe_help = "Activado: cada jugador tiene PE todo el partido. Desactivado: sin PE, como el juego. Se aplica al reiniciar el juego."

[fr.new]
mod_name = "Points d'esprit et d'endurance"
mod_description = "Les keshin, leurs armures et les totems fonctionnent avec des points au lieu du temps, comme dans Chrono Stone et Galaxy. Invoquer est gratuit et sans limite ; la technique de l'esprit coûte ses points d'esprit guerrier (PG, ou SP pour les totems) au lieu de la tension, une armure les draine tant qu'elle est portée, et une réserve vide fait partir l'esprit. Chaque joueur a aussi une barre d'endurance (GP) : courir et sprinter la dépensent, le Physique la fait durer, la mi-temps en rend un peu et un joueur épuisé ralentit. Chaque partie peut être désactivée dans les réglages."
option_peg = "Points de keshin (PG)"
option_peg_help = "Activé : keshin et armures utilisent des PG. Désactivé : le temps du jeu. Appliqué au redémarrage du jeu."
option_sp = "Points de totem (SP)"
option_sp_help = "Activé : les totems utilisent des SP. Désactivé : le temps du jeu. Appliqué au redémarrage du jeu."
option_pe = "Endurance (PE)"
option_pe_help = "Activé : chaque joueur a des PE pour tout le match. Désactivé : pas de PE. Appliqué au redémarrage du jeu."

[de.new]
mod_name = "Geist- und Ausdauerpunkte"
mod_description = "Keshin, Keshin-Rüstungen und Totems laufen mit Punkten statt mit Zeit, wie in Chrono Stone und Galaxy. Beschwören ist gratis und unbegrenzt; die Spezialtechnik des Geistes kostet seine Kampfgeist-Punkte (KGP, bei Totems SP) statt Spannung, eine Rüstung verbraucht sie, solange sie getragen wird, und ein leerer Vorrat schickt den Geist fort. Jeder Spieler hat außerdem eine Ausdauerleiste (GP): Laufen und Sprinten verbrauchen sie, Physis lässt sie länger halten, die Halbzeit gibt etwas zurück, und ein erschöpfter Spieler wird langsamer. Jeder Teil lässt sich in den Einstellungen ausschalten."
option_peg = "Keshin-Punkte (KGP)"
option_peg_help = "An: Keshin und Rüstungen nutzen KGP. Aus: die Zeit des Spiels. Gilt nach einem Neustart des Spiels."
option_sp = "Totem-Punkte (SP)"
option_sp_help = "An: Totems nutzen SP. Aus: die Zeit des Spiels. Gilt nach einem Neustart des Spiels."
option_pe = "Ausdauer (GP)"
option_pe_help = "An: jeder Spieler hat GP für das ganze Spiel. Aus: keine GP. Gilt nach einem Neustart des Spiels."

[it.new]
mod_name = "Punti spirito e resistenza"
mod_description = "Keshin, armature keshin e totem funzionano a punti invece che a tempo, come in Chrono Stone e Galaxy. Evocare è gratis e illimitato; la tecnica dello spirito costa i suoi punti spirito guerriero (PSG, o SP per i totem) invece della tensione, un'armatura li consuma finché è indossata e una riserva vuota fa andare via lo spirito. Ogni giocatore ha anche una barra di resistenza (GP): correre e scattare la consumano, il Fisico la fa durare, l'intervallo ne restituisce un po' e un giocatore esausto rallenta. Ogni parte si può disattivare nelle impostazioni."
option_peg = "Punti keshin (PSG)"
option_peg_help = "Attivo: keshin e armature usano PSG. Disattivo: il tempo del gioco. Si applica al riavvio del gioco."
option_sp = "Punti totem (SP)"
option_sp_help = "Attivo: i totem usano SP. Disattivo: il tempo del gioco. Si applica al riavvio del gioco."
option_pe = "Resistenza (PE)"
option_pe_help = "Attivo: ogni giocatore ha PE per tutta la partita. Disattivo: niente PE. Si applica al riavvio del gioco."

[pt.new]
mod_name = "Pontos de espírito e resistência"
mod_description = "Keshin, armaduras de keshin e totens funcionam com pontos em vez de tempo, como em Chrono Stone e Galaxy. Invocar é grátis e sem limite; a técnica do espírito gasta os seus pontos de espírito guerreiro (PEG, ou SP nos totens) em vez de tensão, uma armadura drena-os enquanto é usada e uma reserva vazia faz o espírito partir. Cada jogador tem ainda uma barra de resistência (GP): correr e esprintar gastam-na, o Físico faz com que dure mais, o intervalo devolve um pouco e um jogador exausto fica mais lento. Cada parte pode ser desativada nas definições."
option_peg = "Pontos de keshin (PEG)"
option_peg_help = "Ligado: keshin e armaduras usam PEG. Desligado: o tempo do jogo. Aplica-se ao reiniciar o jogo."
option_sp = "Pontos de totem (SP)"
option_sp_help = "Ligado: os totens usam SP. Desligado: o tempo do jogo. Aplica-se ao reiniciar o jogo."
option_pe = "Resistência (PE)"
option_pe_help = "Ligado: cada jogador tem PE para toda a partida. Desligado: sem PE. Aplica-se ao reiniciar o jogo."

[ja.new]
mod_name = "スピリット＆スタミナポイント"
mod_description = "化身・化身アームド・ソウルが、クロノ・ストーンやギャラクシーのように時間ではなくポイントで動きます。召喚は無料で時間制限なし。化身やソウルの必殺技はテンションの代わりにファイティングスピリット（FSP、ソウルはSP）を消費し、アームド中は消費され続け、空になると退場します。各選手にはスタミナゲージ（GP）もあり、走る・ダッシュすると減り、フィジカルが高いと長持ちし、ハーフタイムで少し回復し、疲れた選手は遅くなります。各機能は設定でオフにできます。"
option_peg = "化身ポイント（FSP）"
option_peg_help = "オン：化身とアームドはFSPで動く。オフ：ゲーム本来の時間制。ゲーム再起動後に反映。"
option_sp = "ソウルポイント（SP）"
option_sp_help = "オン：ソウルはSPで動く。オフ：ゲーム本来の時間制。ゲーム再起動後に反映。"
option_pe = "スタミナ（GP）"
option_pe_help = "オン：全選手が試合を通してGPを持つ。オフ：GPなし。ゲーム再起動後に反映。"

[zh_hans.new]
mod_name = "精神与体力点数"
mod_description = "化身、化身铠甲与灵魂改用点数而非时间运作，如同《时空之石》和《银河》。召唤免费且没有时间限制；灵魂的必杀技消耗斗志点数（FSP，灵魂为SP）而非气势，穿着铠甲时会持续消耗，点数用尽灵魂便会离场。每名球员还有体力条（GP）：跑动和冲刺会消耗，体格越高越持久，中场休息会恢复一些，力竭的球员会变慢。各部分都能在设置中关闭。"
option_peg = "化身点数（FSP）"
option_peg_help = "开启：化身与铠甲使用FSP。关闭：游戏原本的计时。重启游戏后生效。"
option_sp = "灵魂点数（SP）"
option_sp_help = "开启：灵魂使用SP。关闭：游戏原本的计时。重启游戏后生效。"
option_pe = "体力（GP）"
option_pe_help = "开启：每名球员整场比赛拥有GP。关闭：没有GP。重启游戏后生效。"

[zh_hant.new]
mod_name = "精神與體力點數"
mod_description = "化身、化身鎧甲與靈魂改用點數而非時間運作，如同《時空之石》和《銀河》。召喚免費且沒有時間限制；靈魂的必殺技消耗鬥志點數（FSP，靈魂為SP）而非氣勢，穿著鎧甲時會持續消耗，點數用盡靈魂便會離場。每名球員還有體力條（GP）：跑動和衝刺會消耗，體格越高越持久，中場休息會恢復一些，力竭的球員會變慢。各部分都能在設定中關閉。"
option_peg = "化身點數（FSP）"
option_peg_help = "開啟：化身與鎧甲使用FSP。關閉：遊戲原本的計時。重啟遊戲後生效。"
option_sp = "靈魂點數（SP）"
option_sp_help = "開啟：靈魂使用SP。關閉：遊戲原本的計時。重啟遊戲後生效。"
option_pe = "體力（GP）"
option_pe_help = "開啟：每名球員整場比賽擁有GP。關閉：沒有GP。重啟遊戲後生效。"
