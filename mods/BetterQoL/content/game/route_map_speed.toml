schema = "VRFW.game/2"

[[VRFW.Function]]
name = "RouteTownUpdate"
game = "Route.TownUpdate"

# CVSRouteTownMenu ctor 0x1222050: lea r11, [rip + vftable]; mov [rcx], r11 (shorter prefix also matches 0x1156F30).
[[VRFW.Hook]]
name = "RouteMapUpdate"
game = "Route.MapUpdate"
kind = "vtable"
expect_fn = "RouteTownUpdate"

# CMouseScrollBaseMenu (base of the route map menu): the free cursor moves by direction x dt x cursor_speed x 50.
[[VRFW.Struct]]
name = "RouteMapMenu"
size = 0x298
fields = { cursor_speed = { at = 0x290, type = "f32" } }

[[VRFW.Command]]
name = "CMND_BETTERQOL_ROUTE_MAP_SPEED"
handler = "BetterQoL.RouteMapSpeedOn"
