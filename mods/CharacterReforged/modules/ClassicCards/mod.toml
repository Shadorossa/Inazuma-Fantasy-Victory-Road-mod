id = "ClassicCards"
former_ids = ["NoMoreRarities"]
key_id = "ClassicCards"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "Classic Cards"
version = "0.2.4"
author = "Fantasy Team"
author_steam = "76561199013321372"
description = "Every normal player is a 5★ Legend, as in the classic Inazuma Eleven games: no 1★-4★ rarities, rarity bonuses, rarity-up or fusion, and saves are converted to 5★ cards. Normal cards are coloured by position: goalkeeper gold, defender green, midfielder blue, forward red. Only the basic rarities lose their rarity look: Hero and Diamond cards keep theirs."
priority = 0
tags = ["Characters", "Gameplay"]
updated = "2026-11-06"
# Comment links to existing docs
# content/album/hidden_rarities.toml: BetterQoL's player album leaves out the Ídolo / Diamante cards this
# module's config removes.
# This mod's own names (TOML keys [ClassicCards.X], Lua ClassicCards.X, commands CMND_CLASSICCARDS_*); never VRFW.
prefix = "ClassicCards"
folder = "ClassicCards"
# A plugin of Character Reforged: its duplicate-players hook
# runs this mod's policy (content\duplicate_rules\). 1.0.14:
# the one-card-per-character limit and the spirit-free recruitment
# (duplicate merge, owned players out of the drops, spirit drop = the player, no spirit screen / «!», the spirit purge of
# a duplicated save and its save adjust action, the team planner's owned rule) moved to the module New Recruitment;
#this mod keeps the rarity removal and the position look.
# Standard mod layout:
#   content\duplicate_rules\no_more_rarities.toml   [CharacterReforged.DuplicateRules.no_more_rarities]: every normal
#                                     card -> rarity 4 on a duplicated save; apply_on_load: the same on every load of a
#                                     player slot (a backup of the save first, once per save; Character Reforged >= 1.7.8)
#   content\save_adjust\no_more_rarities.toml + text\rows\save_tools.toml   Options › «Ajustar save» › «Igualar la
#                                     rareza de los jugadores», run by Character Reforged's scripts\save_tools.lua: the
#                                     normal cards and the special tiers the config removes -> rarity 4
#                                     (duplicate rule key normalize_special_rarities)
#   content\rarities\rarity.toml      the rarity set without the 1★-4★ rarities (normal, growing, advanced, top)
#   content\params\rarity_removal.toml  no rarity stat bonus, the spirit weights on the 5★ card (GENERATED)
#   content\base_tables\**            every spirit source gives the 5★ card: drops, fixed rewards, gifts, Players
#                                     Universe, the spirit shop (GENERATED by research/scripts/no_more_rarities_build.py
#                                     from the game's rows)
#   content\card_types\hidden_rarities.toml  the «Rareza» tab of the filter windows lists from config.toml
#                                     [rarity_filter] first_listed_rarity on (default 5: the normal cards always
#                                     pass, graft no_more_rarities_filter), through the VR-Framework's card-type
#                                     service (the rarities below it are card types with filter = false)
#   content\team_planner\rule.toml    Utilities' team planner: the cards drawn as the 5★ card
#   config.toml [removed_rarities] + scripts\removed_rarities.lua + content\game\removed_rarities.toml
#                                     tiers: which tiers lose their rarity look (basic
#                                     always; Ídolo 5-7 and Diamante 8 by the choice), read only through the one
#                                     function ClassicCards.RarityRemoved(rarity) (card look, plates, titles,
#                                     header band and title, drop-list bands, the filter graft)
#   content\images\** + assets\lua\_all\no_more_rarities_card_look.lua   the normal cards coloured by POSITION
#                                     (1.0.7;: the
#                                     position colours are this mod's), chosen at run time outside a reserved slot (a
#                                     mode's own save: INAROGUE keeps its rarities exactly as in the game): a rarity 0-4
#                                     card is drawn with its position's frame 16 GK / 17 DF / 18 MF / 19 FW (NEW sprites
#                                     derived from the game's gold *_04, blue *_02, plain green *_01 and element-fire red
#                                     *_type_*03 cards; on the formation layers the slot's position), the status / personal
#                                     plates with the game's plate of the position (the FW personal plate
#                                     status_chr_plate01_19 is NEW), the rarity titles 0-4 with a transparent sprite; one
#                                     shared helper ClassicCards.PositionColour(card) (POSITION_LOOKS); the game's own
#                                     rarity sprites are never repainted (GENERATED by research/scripts/no_more_rarities_build.py);
#                                     1.0.11: the staff cards (Inazuma Fantasy's staff colours): the coach card white (frame
#                                     20), the managers' pink (frame 21), the leader card commands too (STAFF_LOOKS; art
#                                     derived from the game's blue card at build); the filter goes on when the engine
#                                     registers the menu command (before the first card draw's
#                                     callbacks are redefined by a later patch, so the OnInit install never ran there)
#   content\menus\player_header.toml + assets\lua\_all\no_more_rarities_header.lua   the player page's header band
#                                     in the player's POSITION colour (a band colour of Character Reforged's host
#                                     CharacterReforged.header_band; special cards keep their rarity look; without
#                                     this mod the band keeps the retail rarity look); the header's rarity title only
#                                     for Ídolo and the rarities other mods declare (host CharacterReforged.header_rarity)
#   assets\lua\vs_route_town_drop_rate_list_menu\no_more_rarities_drop_list.lua + content\images\menu\10_win\**
#                                     the drop-rate list's spirit rows in the player's POSITION colour (1.0.8; the FW
#                                     band GENERATED by research/scripts/no_more_rarities_build.py)
# Grafts (research/grafts, mod = ClassicCards): rar_dock,
# rar_menus (no fusion / rarity-up on the spirit and summon menus), no_more_rarities_filter
# (the filter windows' normal cards).
# VRFW 2.4.24: VRFW_ListRows
requires = ["VRFW>=0.2.4", "CharacterReforged>=0.2.4"]
# optional: its album and team planner read this module's rules; Universe Reforged's added rows get the rarity rule, so it loads first
optional = ["BetterQoL", "UniverseReforged"]
conflicts = []
loader_modules = ["lua_bridge"]
# loader 1.7.0: patches of INCLUDE'd scripts (the filter includes)
loader_min = "1.7.0"
# its script answers a game Lua command (content\game\removed_rarities.toml)
permissions = ["command"]

# its own content\ folders read by other mods' scripts: Character Reforged's duplicate hook (duplicate_rules) and
# Utilities' team planner (team_planner); vrfw check's layout lint accepts them
[layout]
script_folders = ["duplicate_rules", "team_planner"]

# A MODULE of Character Reforged: the Mods screen, the
# ModManager and `vrfw list` show it inside Character Reforged's entry («Módulos y ajustes»: on / off) instead of as a mod
# of its own; switching Character Reforged off switches it off too. Its name there: its mod_name (text\keys.toml).
[module]
of = "CharacterReforged"
order = 70

# game_lua: ClassicCards.HeaderBandColour = the header band's position colour (assets\lua\_all\
# no_more_rarities_header.lua), called by Character Reforged's CharacterReforged.Header.BandColour;
# ClassicCards.HeaderShowsRarity = the header's rarity title rule (Ídolo and mod-declared rarities only);
# ClassicCards.RarityRemovalApplies = whether the removal applies to the loaded save (never a reserved slot);
# ClassicCards.PositionColour(card) / PositionLookOfType(type) = the one position look (card frame, plates, rgb) of a
# normal card, nil = the retail look (assets\lua\_all\no_more_rarities_card_look.lua; card look, header band, drop lists);
# ClassicCards.RarityRemoved(rarity) = the config's rule: this rarity loses its rarity look (assets\lua\_all\
# no_more_rarities_card_look.lua);
# ClassicCards.NormalCardRarity() = the rarity every normal card has (4) while the removal applies, else nil (read by
# New Recruitment's spirit recruit);
# ClassicCards.ShownRarity(rarity) = the rarity a look is drawn with (a removed one -> NormalCardRarity())
[exports]
game_lua = ["ClassicCards.HeaderBandColour", "ClassicCards.HeaderShowsRarity", "ClassicCards.RarityRemovalApplies",
  "ClassicCards.PositionColour", "ClassicCards.PositionLookOfType", "ClassicCards.NormalCardRarity",
  "ClassicCards.RarityRemoved", "ClassicCards.ShownRarity"]
