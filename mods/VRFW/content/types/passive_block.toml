# VRFW › the block types of the passive engine (kind VRFW.passive_block/1).
schema = "VRFW.decl_schema/1"
kind = "VRFW.passive_block/1"
folder = "content/passive_blocks"
former_kinds = ["SignaturePassives.passive_block/1"]

# ------------------------------------------------------------------------------------------------ when / stacks / reset

[entry.Trigger]
provides = "block"
role = "trigger"
text = "ev_default"
doc = "the event that turns the passive on: a behaviour-rule trigger (VRFW content\\rules\\catalog\\triggers.toml) whose player is `by`, seen from the carrier"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
on = { type = "string", required = true, ref = "rule_trigger", doc = "the event (goal, keeper_save, ball_stopped, block_won, duel_won, possession, foul…), or one of the engine's own events: `carried` (the carrier starts carrying the passive: his spirit is summoned, a grant is given), `half_start` (a half starts: its clock runs again), `interval` (every `arg` seconds of play while he is on the pitch); tension_gain (his team earns tension from play: duels, scrambles, keeper battles, set plays; `by` = the player who earned it) and foul_suffered (`by` = the fouled player) are behaviour-rule triggers too" }
arg = { type = "string", default = "", ref = "rule_trigger_arg", doc = "only this argument of the event (goal:user, duel_won:move…); empty = any" }
by = { type = "string", default = "self", values = ["self", "teammate", "team", "opponent", "anyone"], words = "by", doc = "whose event: the carrier, a teammate, anyone of his team, an opponent, anyone" }
wording = { type = "string", default = "", values = ["when", "each_time"], words = "wording", doc = "the description says «when» or «each time» (empty: «each time» with a Stack block, else «when»)" }

[entry.Stack]
provides = "block"
role = "stack"
text = "sentence_max"
doc = "each trigger adds one stack (the effects × the stacks)"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
max = { type = "int", default = 0, min = 0, max = 99, doc = "the most stacks (0 = no limit)" }
duration_s = { type = "int", default = 0, min = 0, max = 5400, doc = "the stacks end this many seconds after the last one (0 = they stay)" }
per_half = { type = "bool", default = false, doc = "the stacks go back to 0 at each half" }

[entry.Reset]
provides = "block"
role = "reset"
text = "sentence_reset"
doc = "the event that nullifies the passive: its stacks back to 0"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
on = { type = "string", required = true, ref = "rule_trigger", doc = "the event" }
arg = { type = "string", default = "", ref = "rule_trigger_arg", doc = "only this argument of the event; empty = any" }
by = { type = "string", default = "team", values = ["self", "teammate", "team", "opponent", "anyone"], words = "by", doc = "whose event" }

# ------------------------------------------------------------------------------------------------ conditions

[entry.MoveElement]
provides = "block"
role = "condition"
text = "block_move_element"
needs = "move"
doc = "the element of the move used, as the game answers for that slot"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
elements = { type = "strings", default = [], values = ["wind", "forest", "fire", "mountain", "void"], words = "element", doc = "any of these elements (empty = any, with same_as_carrier)" }
same_as_carrier = { type = "bool", default = false, doc = "the move's element is the carrier's own element" }

[entry.CarrierElement]
provides = "block"
role = "condition"
text = "block_carrier_element"
needs = "actor"
doc = "the element of the carrier's card"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
elements = { type = "strings", required = true, values = ["wind", "forest", "fire", "mountain", "void"], words = "element", doc = "any of these elements" }

[entry.Move]
provides = "block"
role = "condition"
text = "block_move"
needs = "move"
doc = "the move used is one of these"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
moves = { type = "strings", required = true, ref = "move", doc = "moves: an internal key (whs00010) or a mod move <mod>.<name>" }

[entry.MoveKind]
provides = "block"
role = "condition"
text = "block_move_kind"
needs = "move"
doc = "the kind of the move of the event (skill table category and flags: [move_kinds])"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
kinds = { type = "strings", required = true, values = ["shoot", "long_shoot", "chain_shoot", "dribble", "block", "shoot_block", "catch", "punch"], words = "move_kind", doc = "any of these kinds" }

[entry.MoveFamily]
provides = "block"
role = "condition"
text = "block_move_family"
needs = "move"
doc = "the move used belongs to one of these technique families ([[VRFW.TechniqueFamily]], the moves' `families`)"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
families = { type = "strings", required = true, ref = "technique_family", doc = "family ids <mod>.<Name> (MyMod.Dragon)" }

[entry.Wears]
provides = "block"
role = "condition"
text = "block_wears"
needs = "actor"
carrier = "equipment"
doc = "the carrier wears one of these equipment items (the user's own players). A passive with a Wears or WearsSet block is carried by every player who meets it"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
items = { type = "strings", required = true, ref = "item", doc = "items: an internal name (eq_sh110001) or a mod item <mod>.<name>" }

[entry.WearsSet]
provides = "block"
role = "condition"
text = "block_wears_set"
needs = "actor"
carrier = "equipment"
doc = "the carrier wears at least `pieces` pieces of an equipment set ([[VRFW.EquipmentSet]]: one piece per equip slot)"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
set = { type = "string", required = true, ref = "equipment_set", doc = "the set: <mod>.<Name>" }
pieces = { type = "int", default = 2, min = 1, max = 4, doc = "the least pieces worn" }

[entry.Outcome]
provides = "block"
role = "condition"
text = "block_outcome"
doc = "how the event ended: the argument of its trigger (technique_result won / lost, keeper_scene saved / beaten…; [outcomes])"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
result = { type = "string", required = true, values = ["succeeds", "fails"], words = "outcome", doc = "succeeds or fails" }

[entry.CarriesPassive]
provides = "block"
role = "condition"
text = "block_carries_passive"
needs = "actor"
doc = "the carrier carries one of these game passives: in an unlocked team passive slot or in his own passive slot"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
passives = { type = "strings", required = true, ref = "passive", doc = "passive keys (ps10001, a mod passive's key)" }

[entry.Side]
provides = "block"
role = "condition"
text = "block_side"
needs = "actor"
doc = "the carrier plays for this side"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
side = { type = "string", required = true, values = ["user", "rival"], words = "side", doc = "user = the player's team, rival = the other team" }

[entry.HasBall]
provides = "block"
role = "condition"
text = "block_has_ball"
needs = "actor"
doc = "the carrier holds the ball (or, with holds = false, does not)"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
holds = { type = "bool", default = true, doc = "true: he holds the ball; false: he does not" }

[entry.Score]
provides = "block"
role = "condition"
text = "block_score"
doc = "the score of the carrier's team"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
states = { type = "strings", required = true, values = ["leading", "level", "trailing"], words = "score", doc = "any of these" }

[entry.Half]
provides = "block"
role = "condition"
text = "block_half"
doc = "the current half"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
halves = { type = "ints", required = true, min = 1, max = 5, doc = "any of these: 1-2, 3-4 extra time, 5 shootout" }

[entry.Clock]
provides = "block"
role = "condition"
text = "block_clock"
doc = "the clock of the current half: game minutes, or parts of the half's real length (half_fraction_from / half_fraction_to)"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
from_minute = { type = "int", default = 0, min = 0, max = 90, doc = "from this minute of the half" }
until_minute = { type = "int", default = 0, min = 0, max = 90, doc = "before this minute of the half (0 = to the end)" }
half_fraction_from = { type = "string", default = "", doc = "from this part of the half's real length on: a fraction \"a/b\" or a number 0-1 (\"2/3\" = the last third); with it the minutes are ignored" }
half_fraction_to = { type = "string", default = "", doc = "before this part of the half's real length (\"1\" = to the end, added time included); empty = to the end" }
last_minutes = { type = "int", default = 0, min = 0, max = 90, doc = "only the last this many game minutes of the half's regular length, added time included (0 = not asked)" }
added_time = { type = "bool", default = false, doc = "only in the added time (the clock past the half's regular length)" }

[entry.Chance]
provides = "block"
role = "condition"
text = "block_chance"
doc = "it counts this often (checked when the trigger happens)"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
percent = { type = "int", required = true, min = 1, max = 100, doc = "the chance in %" }

[entry.Zone]
provides = "block"
role = "condition"
text = "block_zone"
needs = "actor"
doc = "the carrier stands in an area of the pitch (metres, match coordinates; the rule engine's zone convention)"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
x = { type = "numbers", default = [], doc = "[from, to] across the pitch (empty = any)" }
z = { type = "numbers", default = [], doc = "[from, to] along the pitch (empty = any); with frame = team, from the halfway line toward the goal his team attacks: negative = his own half" }
frame = { type = "string", default = "team", values = ["team", "pitch"], words = "zone_frame", doc = "team: z follows his team's attack direction (the game's ends), so one area fits both sides and both halves; pitch: as is" }

[entry.SpiritsOut]
provides = "block"
role = "condition"
scale = "count"
text = "block_spirits_out"
needs = "actor"
doc = "counts the players with one of these spirits out (summoned without armour: a [[VRFW.Spirit]] aura); the passive's effects × that count, off at 0"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
auras = { type = "strings", default = [], ref = "aura", doc = "these auras (internal key wko00010 or a mod aura <mod>.<name>)" }
family = { type = "string", default = "", ref = "spirit_family", doc = "or every aura of this family ([[VRFW.SpiritFamily]], <name> or <mod>.<name>)" }
who = { type = "string", default = "teammates", values = ["teammates", "team", "opponents"], words = "target", doc = "whose spirits count, seen from the carrier" }
max = { type = "int", default = 3, min = 1, max = 10, doc = "the count stops here" }

[entry.Near]
provides = "block"
role = "condition"
filter = "target"
text = "block_near"
needs = "actor"
doc = "the passive's effects reach only targets within this distance of the carrier"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
metres = { type = "number", required = true, min = 1, max = 60, doc = "the distance in metres" }

[entry.TargetZone]
provides = "block"
role = "condition"
filter = "target"
text = "block_target_zone"
needs = "actor"
doc = "the passive's effects reach only targets standing in an area of the pitch, each one checked at his own position (metres, match coordinates)"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
x = { type = "numbers", default = [], doc = "[from, to] across the pitch (empty = any)" }
z = { type = "numbers", default = [], doc = "[from, to] along the pitch (empty = any); with frame = team, from the halfway line toward the goal the target's team attacks: negative = his own half" }
frame = { type = "string", default = "team", values = ["team", "pitch"], words = "zone_frame", doc = "team: z follows the target's team's attack direction (the game's ends), so one area fits both sides and both halves; pitch: as is" }

# ------------------------------------------------------------------------------------------------ traits (who)

[entry.Trait]
provides = "block"
role = "trait"
text = "block_trait"
doc = "a set of players, named by the Present / Count / By / Holder blocks and by the `trait` key of the effects. Every key given must hold (empty = not asked). The relative keys compare the player with the passive's carrier (the holder)"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
characters = { type = "strings", default = [], ref = "character", doc = "any of these characters (chara_base key or <mod>.<name>): specific players" }
tags = { type = "strings", default = [], ref = "passive_tag", doc = "any of these archetype tags ([[VRFW.Tag]] names; a character's tags: [[VRFW.CharacterTags]])" }
elements = { type = "strings", default = [], values = ["wind", "forest", "fire", "mountain", "void"], words = "element", doc = "any of these elements (the card's)" }
positions = { type = "strings", default = [], values = ["gk", "fw", "mf", "df"], words = "position", doc = "any of these positions (the card's main position)" }
gender = { type = "string", default = "", values = ["male", "female"], words = "gender", doc = "the character's gender (empty = any)" }
series = { type = "strings", default = [], ref = "series", doc = "any of these source series (the framework's series names: ie1, ie2, ie3, go1, go2, go3, galaxy, ares, orion, victory_road, aliases of content\\defaults\\series_names.toml)" }
team_groups = { type = "strings", default = [], ref = "synergy_pool", doc = "the character is in one of these team groups: [[VRFW.SynergyPool]] keys <mod>.<name> (their teams / series / gender / characters)" }
families = { type = "strings", default = [], ref = "technique_family", doc = "he carries a move of one of these technique families in his move slots" }
moves = { type = "strings", default = [], ref = "move", doc = "he carries one of these moves in his move slots (internal key or <mod>.<name>)" }
keshin = { type = "bool", default = false, doc = "he has a keshin (his aura plate holds a keshin this match)" }
miximax = { type = "bool", default = false, doc = "he has a miximax (his mix plate holds one this match)" }
same_team_as_holder = { type = "bool", default = false, doc = "he shares a belong team with the carrier" }
same_team_group_as_holder = { type = "bool", default = false, doc = "he is in a team group ([[VRFW.SynergyPool]] with `teams`) the carrier is in, or shares a belong team with him" }
same_saga_as_holder = { type = "bool", default = false, doc = "his source series is the carrier's" }
same_element_as_holder = { type = "bool", default = false, doc = "his element is the carrier's" }

[entry.Present]
provides = "block"
role = "condition"
text = "block_present"
needs = "actor"
doc = "at least `min` players of a Trait are on the pitch"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
trait = { type = "string", required = true, ref = "block", doc = "the Trait block" }
side = { type = "string", default = "team", values = ["team", "opponents", "any"], words = "side_of", doc = "whose players, seen from the carrier" }
min = { type = "int", default = 1, min = 1, max = 11, doc = "at least this many" }
others = { type = "bool", default = true, doc = "the carrier himself does not count" }

[entry.Count]
provides = "block"
role = "condition"
scale = "count"
text = "block_count"
needs = "actor"
doc = "counts the players of a Trait on the pitch: the passive's effects × that count, off at 0"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
trait = { type = "string", required = true, ref = "block", doc = "the Trait block" }
side = { type = "string", default = "team", values = ["team", "opponents", "any"], words = "side_of", doc = "whose players, seen from the carrier" }
max = { type = "int", default = 3, min = 1, max = 11, doc = "the count stops here" }
others = { type = "bool", default = true, doc = "the carrier himself does not count" }

[entry.By]
provides = "block"
role = "condition"
text = "block_by"
needs = "event"
doc = "the trigger counts only when its player belongs to a Trait (with the trigger's own `by`)"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
trait = { type = "string", required = true, ref = "block", doc = "the Trait block" }

[entry.Holder]
provides = "block"
role = "condition"
text = "block_holder"
needs = "actor"
doc = "a player of a Trait holds the ball"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
trait = { type = "string", required = true, ref = "block", doc = "the Trait block" }
side = { type = "string", default = "team", values = ["team", "opponents", "any"], words = "side_of", doc = "whose players, seen from the carrier" }
others = { type = "bool", default = false, doc = "the carrier himself does not count" }

[entry.Absent]
provides = "block"
role = "condition"
text = "block_absent"
needs = "actor"
doc = "no player of a Trait is on the pitch (the zero count of Present / Count): «the only <trait> of his team» = side team, others true"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
trait = { type = "string", required = true, ref = "block", doc = "the Trait block" }
side = { type = "string", default = "team", values = ["team", "opponents", "any"], words = "side_of", doc = "whose players, seen from the carrier" }
others = { type = "bool", default = true, doc = "the carrier himself does not count" }

[entry.SetPiece]
provides = "block"
role = "condition"
text = "block_set_piece"
needs = "actor"
doc = "the carrier took the last restart of these kinds (behaviour-rule trigger set_piece) and no other player has had the ball since (possession): his own set piece's play (a direct free kick, a corner kicked into the box…)"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
kinds = { type = "strings", default = ["free_kick", "corner", "penalty"], values = ["throw_in", "corner", "goal_kick", "free_kick", "offside", "penalty"], words = "set_piece", doc = "the restart kinds (the set_piece trigger's words)" }

[entry.Carrier]
provides = "block"
role = "condition"
text = "block_carrier"
label = "label_carrier"
help = "help_carrier"
group = "player"
needs = "actor"
doc = "the carrier himself belongs to a Trait (specific characters, tags, element, position, series, team group…)"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
trait = { type = "string", required = true, ref = "block", doc = "the Trait block" }

[entry.PlayerLevel]
provides = "block"
role = "condition"
text = "block_player_level"
label = "label_player_level"
help = "help_player_level"
group = "player"
needs = "actor"
doc = "the carrier's player level (his record, read once per match)"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
from = { type = "int", default = 1, min = 1, max = 999, doc = "at least this level" }
to = { type = "int", default = 999, min = 1, max = 999, doc = "at most this level" }

[entry.AuraActive]
provides = "block"
role = "condition"
text = "block_aura_active"
label = "label_aura_active"
help = "help_aura_active"
group = "player"
needs = "actor"
doc = "players with an aura out now: keshin, armour (armed), miximax, totem or mode change (the unit's aura bits, [aura_bits])"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
kinds = { type = "strings", default = ["keshin", "armour", "miximax", "totem"], values = ["keshin", "armour", "miximax", "totem", "mode_change"], words = "aura_kind", doc = "any of these aura kinds" }
who = { type = "string", default = "self", values = ["self", "teammates", "team", "opponents", "anyone"], words = "aura_who", doc = "whose aura, seen from the carrier" }
min = { type = "int", default = 1, min = 1, max = 11, doc = "at least this many such players" }

[entry.Resource]
provides = "block"
role = "condition"
text = "block_resource"
label = "label_resource"
help = "help_resource"
group = "player"
needs = "actor"
doc = "the carrier's value of a match resource a mod declares ([[VRFW.MatchResource]]: stamina, spirit points, a team gauge…), in % of its maximum"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
resource = { type = "string", required = true, ref = "match_resource", doc = "the resource, <mod>.<name>" }
from_percent = { type = "int", default = 0, min = 0, max = 100, doc = "at least this % of its maximum" }
to_percent = { type = "int", default = 100, min = 0, max = 100, doc = "at most this % of its maximum" }

[entry.TensionLevel]
provides = "block"
role = "condition"
text = "block_tension"
label = "label_tension"
help = "help_tension"
group = "team"
doc = "a team's tension gauge (the HUD's tension points), seen from the carrier"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
side = { type = "string", default = "team", values = ["team", "opponents"], words = "side_of", doc = "whose gauge: his team's or the opponents'" }
from = { type = "number", default = 0, min = 0, max = 10000, doc = "at least this many tension points" }
to = { type = "number", default = 0, min = 0, max = 10000, doc = "at most this many tension points (0 = no limit)" }
from_percent = { type = "int", default = 0, min = 0, max = 100, doc = "at least this % of the gauge's maximum" }
to_percent = { type = "int", default = 100, min = 0, max = 100, doc = "at most this % of the gauge's maximum" }
full = { type = "bool", default = false, doc = "only when the gauge is full" }
versus = { type = "string", default = "", values = ["ahead", "level", "behind"], words = "versus", doc = "compared with the other team's gauge (empty = not asked)" }

[entry.ScoreMargin]
provides = "block"
role = "condition"
text = "block_score_margin"
label = "label_score_margin"
help = "help_score_margin"
group = "match"
doc = "the goals of the carrier's team: the difference, the goals scored, conceded and in total"
name = { type = "name", required = true, doc = "the block's name (a-z 0-9 _), unique in its mod" }
margin_from = { type = "int", default = -99, min = -99, max = 99, doc = "goal difference at least this (his goals minus theirs)" }
margin_to = { type = "int", default = 99, min = -99, max = 99, doc = "goal difference at most this" }
scored_from = { type = "int", default = 0, min = 0, max = 99, doc = "his team has scored at least this many" }
scored_to = { type = "int", default = 99, min = 0, max = 99, doc = "his team has scored at most this many" }
conceded_from = { type = "int", default = 0, min = 0, max = 99, doc = "his team has conceded at least this many" }
conceded_to = { type = "int", default = 99, min = 0, max = 99, doc = "his team has conceded at most this many" }
total_from = { type = "int", default = 0, min = 0, max = 99, doc = "goals of both teams, at least" }
total_to = { type = "int", default = 99, min = 0, max = 99, doc = "goals of both teams, at most (with a goal trigger: 1 = the match's first goal)" }

[entry.Headcount]
provides = "block"
role = "condition"
text = "block_headcount"
label = "label_headcount"
help = "help_headcount"
group = "team"
needs = "actor"
doc = "how many players a team has on the pitch (after a red card, in a small match…), seen from the carrier"
