#                                Suerte is derived (stats_curve.lua derived_luck)
#   scripts\stats.lua + lib\stats_curve.lua / chara_view.lua, content\game\stats.toml / chara_records.toml
#                                the stats' curve and the game's stat reads (config.toml [stats]); exports StatsReady /
#                                HasStats / StatCard / StatAt / Libertad / CharaStat / LevelCap / StatCurve /
#                                LevelFactor / StatTotalMax (no PE: that stat is the mod Stamina Points')
#   scripts\moveset.lua            CharacterReforged.Moveset(card): 4 moves, aura, mix (content\movesets\*.toml)
#   content\menus\level_digits.toml  the level numbers with 3 digits
#   scripts\pairing.lua          CharacterReforged.PairRules / PairCheck / PairValidity / Card / BoardItems / BoardSlotOf /
#                                BoardPlace (the creation flows' shared rules and board helpers)
#   content\pairing\defaults.toml  [CharacterReforged.PairRules.default]: the pairing rules every system starts from
#   content\game\board.toml      the game's board placement (Board.PlaceByHandle, CanEquip, SkillPieces)
#   scripts\board_slots.lua      the skill table's aura slot (board slot 8) without Inazuma Fantasy's board service:
#                                CMND_CHARACTERREFORGED_BOARD_PIECE / _PLACE / _CLEAR (IF's CMND_EVT_BOARD_* arguments
#                                and answers)
#   content\menus\skill_table_hold_ring.toml  the skill table's V / Y hold ring (tap Restablecer, held Eliminar)
#   scripts\lib\create.lua + content\game\create.toml   the base game's «Crear …» entry on the skill board: one row per
