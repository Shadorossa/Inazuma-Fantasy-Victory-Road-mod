schema = "VRFW.text_key/1"
# Texts of «Aura Reworked»: new texts get the id
# crc32("AuraOverhaul.<name>"). The «Mods» screen's name and description, the Mods options rows (options.toml), then
# each part's texts: Souls Rework's reel labels and level texts and the totems' names on the reel (between the «totem
# names» lines of [en.new] / [es.new]: written by research/scripts/souls_rework_build.py), Custom Change Mode's and All
# Miximaxed's create rows and partner plates. The part names are not translated. A language missing here falls back to
# English.
default_lang = "en"

# The four mods merged into this one: their ids are this mod's.
[[alias]]
old = "souls_rework"
new = "AuraOverhaul"

[[alias]]
old = "all_changed"
new = "AuraOverhaul"

[[alias]]
old = "all_miximaxed"
new = "AuraOverhaul"

[[alias]]
old = "all_keshin_armed"
new = "AuraOverhaul"

[en.new]
mod_name = "Aura Overhaul"
mod_description = "Four aura reworks in one mod, each switched on or off in its settings. Souls Rework: totems level up during the match and spin a skill reel. Custom Change Mode: any player gets his own Change Mode into any of your characters, swapped with RB+B. All Miximaxed: a miximax between any two of your players, as in Chrono Stone. All Keshin Armed: every keshin with its armour, for every player."
part_souls_rework = "Totems level up during the match"
part_souls_rework_help = "Totems of both teams gain levels during the match like the souls of GO Galaxy and spin a skill reel with their own move. Applies after restarting the game."
souls_top_level = "Totems at max level from the start"
souls_top_level_help = "Every totem is at level 5 from the start of the match: no level system."
souls_reel = "Skill reel when a totem is used"
souls_reel_help = "Shows the skill carousel at the top of the screen during the cut-in of a totem's own move. Off: the skill still applies, without the carousel."
part_custom_change_mode = "Own change mode for every player"
part_custom_change_mode_help = "Any player can get his own «Modo cambio» into any of your characters and swap with RB+B (60 s between two swaps). Applies after restarting the game."
change_aura = "Green aura during the change mode"
change_aura_help = "A green aura around the player while a created change runs."
part_all_miximaxed = "Miximax between any two players"
part_all_miximaxed_help = "A miximax between any two of your players, as in Chrono Stone («Create Miximax» on the skill board). Applies after restarting the game."
miximax_stats = "Miximax adds the partner's stats"
miximax_stats_help = "While the miximax runs the player gains part of the partner's stats (Chrono Stone)."
part_all_keshin_armed = "Every keshin with its armour"
part_all_keshin_armed_help = "Every keshin with its armour, for every player (the keshin piece's armour slot on the skill board). Applies after restarting the game."
