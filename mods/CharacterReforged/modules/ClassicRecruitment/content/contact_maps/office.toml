schema = "VRFW.contact_map/1"
# The recruitment office on the framework's contact map; no menu opens it while players are signed in the album.

[[VRFW.ContactSet]]
Name = "office"
Title = "classic_recruitment_office_title"
# the hub: the free-match team list; choosing a team opens its page
Hub = "free_match"
# prices in element spirits («fichas») of the player's element
ElementCurrency = { wind = "0xC35FFA3C", forest = "0x90B639BB", fire = "0x86503F3A", mountain = "0x81274E23" }
ElementCurrencyTitle = { wind = "classic_recruitment_office_fichas_wind", forest = "classic_recruitment_office_fichas_forest", fire = "classic_recruitment_office_fichas_fire", mountain = "classic_recruitment_office_fichas_mountain" }
ElementCurrencyUnit = { wind = "classic_recruitment_office_ficha_wind", forest = "classic_recruitment_office_ficha_forest", fire = "classic_recruitment_office_ficha_fire", mountain = "classic_recruitment_office_ficha_mountain" }
# fichas a released player gives back
ReleaseRefund = 3
JoinRarity = 4
TrialFriendly = "classic_recruitment_office_trial"
TrialFriendlyActiveTeam = "classic_recruitment_office_trial_active_team"
Requirements = { config = "office.requirements", default = false }

  # rules of every team page of the set
  [VRFW.ContactSet.Teams]
  Staff = true
  OnePagePerCharacter = true       # a character is sold on one page only
  HomePage = "earliest"
  MergeSameName = true

  [[VRFW.ContactSet.Teams.Price]]
  Tier = "superstar"
  Special = true
  Base = 15
  PerLevel = 0.2

  [[VRFW.ContactSet.Teams.Price]]
  Tier = "star_captain"            # «Estrella»: captain of his page's team
  Captain = true
  Base = 8
  PerLevel = 0.125

  [[VRFW.ContactSet.Teams.Price]]
  Tier = "star"                    # «Estrella»: plays for 4 teams of the office or more
  MinTeams = 4
  Base = 8
  PerLevel = 0.125

  [[VRFW.ContactSet.Teams.Price]]
  Tier = "featured"                # «Destacado»: plays for 2-3 teams
  MinTeams = 2
  Base = 4
  PerLevel = 0.0833

  [[VRFW.ContactSet.Teams.Price]]
  Tier = "normal"
  Base = 2
  PerLevel = 0.05

  [[VRFW.ContactSet.Teams.Place]]
  Team = 0x68FEB138                # Equipo Ogro / Team Ogre
  After = 0x061540B2               # Dark Team / Devil Army Z

  [[VRFW.ContactSet.Teams.Place]]
  Team = 0xE13FDAEC
  After = 0xFAB717E2

  [[VRFW.ContactSet.Teams.Place]]
  Team = 0x63356893                # Sallys / Street Sally's
  After = 0x640E03F2               # Inazuma Kids FC

[[VRFW.ContactMap]]
Set = "office"
Name = "routes"
Order = 10
Title = "classic_recruitment_office_route"   # shown when a route's series cannot be named
  [VRFW.ContactMap.Teams]
  Source = "chronicle_routes"

# the other free-match teams and the pages on no route, after the routes
[[VRFW.ContactMap]]
Set = "office"
Name = "story"
Order = 90
Title = "classic_recruitment_office_story"
  [VRFW.ContactMap.Teams]
  Source = "free_match"
