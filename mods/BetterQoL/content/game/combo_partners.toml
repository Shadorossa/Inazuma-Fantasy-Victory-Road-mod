schema = "VRFW.game/2"

# bool IsActorOnPitch(actor, 0) 0x15B3210
[[VRFW.Function]]
name = "IsActorOnPitch"
game = "Match.IsActorOnPitch"

# [g_gameRoot] + Game.RootSkillTable = the skill table SkillInfoFind takes
[[VRFW.Global]]
name = "skill_table"
base = "game_root"
chain = ["Game.RootSkillTable"]

# SKILL_INFO record (engine copy): skill id, partnerType (2-4 = performers), the three named partners (character ids)
[[VRFW.Struct]]
name = "SkillInfo"
size = 0x48
fields = { skill = { at = 0x00, type = "u32" }, partner_type = { at = 0x38, type = "u8" }, partner1 = { at = 0x3C, type = "u32" }, partner2 = { at = 0x40, type = "u32" }, partner3 = { at = 0x44, type = "u32" } }

# soccer actor ([g_soccerActors] + (hdl & 0xFF) * 0x570): handle, character handle, team, character id
[[VRFW.Struct]]
name = "Actor"
size = 0x570
fields = { handle = { at = 0x94, type = "u32" }, chara = { at = 0x9C, type = "u32" }, team = { at = 0xD0, type = "u8" }, chara_id = { at = 0xD8, type = "u32" } }

[[VRFW.Hook]]
name = "BuildEventCast"
game = "Battle.BuildEventCast"
kind = "function"
order = 0

# skill -> performers, free, named1, named2, named3
[[VRFW.Command]]
name = "CMND_BETTERQOL_COMBO_INFO"
handler = "BetterQoL.ComboInfo"

# charaStHdl, skill -> ok, p1, p2, p3
[[VRFW.Command]]
name = "CMND_BETTERQOL_COMBO_GET"
handler = "BetterQoL.ComboGet"

# charaStHdl, skill, p1[, p2, p3] -> ok
[[VRFW.Command]]
name = "CMND_BETTERQOL_COMBO_SET"
handler = "BetterQoL.ComboSet"

# charaStHdl[, skill] -> ok
[[VRFW.Command]]
name = "CMND_BETTERQOL_COMBO_CLEAR"
handler = "BetterQoL.ComboClear"

# mask[, vk …] -> seconds held (0 = not held, -1 = no input source)
[[VRFW.Command]]
name = "CMND_BETTERQOL_PAD_HELD"
handler = "BetterQoL.PadHeld"
