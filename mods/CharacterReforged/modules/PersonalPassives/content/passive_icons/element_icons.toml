schema = "PersonalPassives.passive_icon/1"
# Signature Passives › the own passive card's icon of a passive whose effect improves the moves of one element (the
# `element` of its [[PassiveIcon]]): one icon per element, without the scope / condition marks. The card draws a saga
# passive's series icon first, then this one, else the buff icon of its game passive.

[[PersonalPassives.ElementIcon]]
element = "wind"
icon = "signature_passives_icon_wind_self"

[[PersonalPassives.ElementIcon]]
element = "forest"
icon = "signature_passives_icon_forest_self"

[[PersonalPassives.ElementIcon]]
element = "fire"
icon = "signature_passives_icon_fire_self"

[[PersonalPassives.ElementIcon]]
element = "mountain"
icon = "signature_passives_icon_mountain_self"

[[PersonalPassives.ElementIcon]]
element = "void"
icon = "signature_passives_icon_void_self"
