# The player page in pages (PERFIL with the 3D model, ATRIBUTOS gauges, SUPERTÉCNICAS), declared to VRFW.player_pages,
# and the item detail card; layout in content/menus/player_page_layout.toml.
name = "plate_pages"
mod = "CharacterReforged"
order = 975
module = "lua_bridge"
requires = ["plate_hiper_plate", "ss2_menus"]
conflicts = []
wraps = ["ChangePersonalPlatePageByCharaHdl", "ChangePersonalPlatePageByCharaParamId", "UpdateCharaParameterGraphByCharaStHdl", "SwapPersonalPlateTexture", "PostStep", "OnCloseLayer", "SetPersonalPlateType", "OnSetupPersonalPlateLayer", "ChangeActiveUI", "OpenPersonalPlate", "ClosePersonalPlate", "SetNameSearchInputEnabled", "SetupEquipInfoWindow", "GetEquipParamText", "GetEquipParamTextOneLine", "SetVisibleEquipInfoWindow", "OnBack", "OnInit", "SetupItemPositionIcon", "ClearItemPositionIcon", "Step", "PreStep", "OnChangeLayerGroup"]
description = "Player page: PERFIL / ATRIBUTOS (gauges) / SUPERTÉCNICAS pages, header band as a 2D copy"

[[files]]
stem = "personal_plate_menu"

  [[files.ops]]
  type = "append_block"
  source = "plate_pages.lua"
  marker = "plate_pages plate"

    [files.ops.include]   # the block's own pieces (parts\*.lua) after the host's
    "@COMMON@" = "plate_pages_common.lua"
    "@HOST@" = "host_plate.lua"
    "@PP_BAND@" = "parts/band.lua"
    "@PP_DOTS@" = "parts/dots.lua"
    "@PP_MOVES@" = "parts/moves.lua"
    "@PP_PASSIVES@" = "parts/passives.lua"
    "@PP_MOD_PAGES@" = "parts/mod_pages.lua"
    "@PP_HOST_CHART@" = "parts/host_chart.lua"
    "@PP_EMPTY_EQUIPMENT_HIPER@" = "parts/empty_equipment_hiper.lua"
    "@PP_STAT_ROWS@" = "parts/stat_rows.lua"
    "@PP_FORMS@" = "parts/forms.lua"
    "@PP_GAUGE_COPIES@" = "parts/gauge_copies.lua"
    "@PP_POINTER@" = "parts/pointer.lua"
    "@PP_ITEM_CARD@" = "parts/item_card.lua"
    "@PP_ITEM_CARD_LAYERS@" = "parts/item_card_layers.lua"
    "@PP_ITEM_CARD_EFFECT@" = "parts/item_card_effect.lua"
    "@PP_ITEM_CARD_STAT_ROWS@" = "parts/item_card_stat_rows.lua"
    "@PP_ITEM_CARD_SHOW@" = "parts/item_card_show.lua"

