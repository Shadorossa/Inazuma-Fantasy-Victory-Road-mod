id = "LegendaryAI"
name = "Legendary AI"
version = "0.3.0"
author = "Fantasy Team"
description = "Offline matches, except Chronicle battles, are played against a «Legendary» CPU: the rival reacts at once in duels, picks the move that beats your element, learns the moves you use, shoots as soon as a zone opens and presses tired players. In free matches the rival also comes trained for his position, with his best passives."
priority = 0
tags = ["AI difficulty", "Gameplay"]
updated = "2026-11-09"
# This mod's own names: TOML keys LegendaryAI.X (profile and class names); never VRFW.
prefix = "LegendaryAI"
folder = "LegendaryAI"
requires = ["VRFW>=0.3.0", "FootballReforged>=0.3.0"]
optional = ["CharacterReforged", "Furor"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
permissions = ["memory", "hook", "state"]
# Always loaded: its card's switch acts from the next match, with no restart (docs/framework/hot-reload.md section 8).
live_toggle = true
not_in_match_modes = ["chronicle", "chronicle_small"]
# starts switched ON (the player can turn it off on its card)
default_enabled = true

[exports]
functions = []
keys = []
tables = []

[module]
of = "FootballReforged"
order = 30
