
[critical]
# The critical hit of a special move (docs/game/match/critical-chrono-stone.md): the chance comes from the players' Suerte
# (Character Reforged [stat_effects]) and from the passives; this mod gives the hit's power and the «Crítico» team build.
base_chance = 0
# on a critical hit the move's power × this (after every other power rule); 2 = Inazuma Eleven GO Chrono Stone
multiplier = 2.0
# the highest critical chance in percent, whatever adds up (other mods' passives included)
cap = 40
# the team build that is «Crítico» (the game's build 0)
archetype_build = 0
# the skill table category of the keepers' moves (keeper_levels / keeper_per_rank apply to them)
keeper_move_category = 4

# The build's charge, for the whole team while its build is «Crítico»: rank 1 at kick-off, +1 per rank_up_seconds
# without a team critical, -rank_down_on_crit on each one.
rank_up_seconds = 15
rank_down_on_crit = 4
# per rank 1-5: the team's critical chance × (1 + this %)
levels = [0, 10, 20, 30, 40]
# per rank 1-5: its keepers' moves, the chance × (1 + this %) more
keeper_levels = [0, 0, 0, 0, 0]
# ps10113: its keepers' moves, the chance × (1 + this % × rank)
keeper_per_rank = 10
# ps10057: the critical multiplier + this % per rank
power_per_rank = 2

[ranks]
thresholds = [10, 25, 50, 120]
mode = "uses"
recast_per_grade = 0.025
# the «<move> sube a Nv.N» banner in the match when a move levels up (text HissatsuReforged.RankUpSuffix)
popup = true
# one log line per counted use (loader.log)
log_uses = true
# The move-rank items (item keys = the item's key string, crc32 = its id; "" = none).
raise_item = "abl_000001"
last_grade_item = "abl_ue000001"
last_grade_item_only = true

[duplicates]
block = true
