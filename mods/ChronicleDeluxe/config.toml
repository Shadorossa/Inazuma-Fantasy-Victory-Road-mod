# The heroic player rules.
[heroic.players]
ramp_start = 1
ramp_end = 7
ramp_exponent = 1.0
cap_after_first_game = false
max_per_series = 0

[heroic.required]
character = "c11600010"
positions = []
until_first_clear = true

[heroic.auras]
ie1 = ["own_mode_change"]
ie2 = ["own_mode_change"]
ie3 = ["own_mode_change"]
go1 = ["keshin", "own_mode_change"]
go2 = ["keshin", "armour", "miximax", "own_mode_change"]
go3 = ["keshin", "armour", "miximax", "totem", "own_mode_change"]
ares = ["own_mode_change"]
orion = ["own_mode_change"]

# The aura kinds no team may start in any match of a game's chapter: every difficulty, both teams, also after the first win.
[chapter_auras_refused]
ie1 = ["miximax"]
ie2 = ["miximax"]
ie3 = ["miximax"]
go1 = ["miximax"]

# The short names the match info uses for the games (series names of chara_base's in_<name> columns).
[heroic.players.short_names]
ie1 = "IE1"
ie2 = "IE2"
ie3 = "IE3"
go1 = "GO"
go2 = "CS"
go3 = "Galaxy"
ares = "Ares"
orion = "Orion"
