id = "BetterQoL"
# name / description: English fallback of the text keys mod_name / mod_description (text\keys.toml)
name = "BetterQoL"
version = "0.3.0"
author = "Fantasy Team"
description = "Everyday conveniences for any save: Team Dock pages, home and away kits, extra formations, a shop filter and technique search, a Player album and Club stats in the Clubroom, a team planner and career stats on each player."

priority = 0
tags = ["Gameplay", "Interface"]
updated = "2026-11-09"
requires = ["VRFW>=0.3.0", "VRFW.text", "VRFW.menu"]
optional = ["BetterUI", "CharacterReforged"]
conflicts = []
folder = "BetterQoL"
prefix = "BetterQoL"
permissions = ["memory", "call", "patch", "command", "state", "hook"]
lua_early = true
loader_modules = ["lua_bridge", "lua_patch"]
loader_min = "1.7.0"
# word that names this mod's byte edits in the game profile (research/scripts/profile_extract.py)
profile_edit_word = "Skip"

[exports]
functions = ["Career.Params", "TeamTemplatesMembers", "TeamTemplatesRepair", "TemplateOfDock", "TopBarOn", "TopBarOnBoard", "RunningEvent", "VrmodFilesReference", "VrmodFilesNeed", "VrmodFilesWrite", "VrmodFilesList", "VrmodFilesEntry", "VrmodFilesRead", "VrmodFilesResolve"]
game_lua = ["BetterQoL.view_forms", "BetterQoL.album_actions"]

# content folders read only by the mod's scripts
[layout]
script_folders = ["original_names", "passive_config"]
