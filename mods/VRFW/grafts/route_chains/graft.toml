# VRFW chain boards on the Chronicle board: a [[VRFW.RouteNode]] with `chain = …` (a "C" piece) opens the framework's chain board screen
# (vrfw_chain_board_menu) instead of its command menu, the match tile picked there is launched by the board as the
# piece's match (its own game and difficulty), and the result is the chain's (VRFW.chain progress + rank; the piece
# clears when every match of the chain is won). Generic (every mod's chain nodes, no list). A framework graft: a mod's chain works without any other mod. The rank of a chain match is
# route_board's VRFW.route_board.match_rank (the framework's S / A / B score rule VRFW.match_rank); the "C" crest's badge is route_board's VRFW.route_board.badge, VRFW.route_chains.rank_of its default rank.
# Order after route_nodes (160: VRFW.route_nodes.load); route_board (190) adds the hook points and the host call after it.
name = "route_chains"
mod = "VRFW"
order = 180
module = ""
requires = ["route_nodes"]
conflicts = []
wraps = []
description = "Chronicle board: chain nodes open the framework's chain board"

[[files]]
stem = "vs_route_town_menu"

  [[files.ops]]
  type = "insert_before"
  point = "vs_route_town_menu.OpenCommandSelect.RouteChains"
  source = "rch_common.lua"

  # a chain node opens the chain board (its chain index handed over) instead of the command menu; the board is a full
  # screen: the board's own footer (button guides) and the piece's title banner are hidden under it (they showed
  # through, overlapping the chain board's own guide and header) and shown again when it closes (VRFW.route_chains.picked)
  [[files.ops]]
  type = "replace"
  point = "vs_route_town_menu.OpenCommandSelect.RouteChainsReplace"
  text = '''
  local vrfw_route_chain_menu = VRFW.route_chains.menu_for(a1) -- VRFW route_chains
  if (VRFW.route_board ~= nil and VRFW.route_board.piece_open ~= nil) and VRFW.route_board.piece_open(a1) then -- VRFW route_board: the piece ran its own flow (a gacha node)
    vrfw_route_chain_menu = nil
  else
    funcLuaCommand(433545986 --[[CMND_OPEN_MENU_OBJECT]], vrfw_route_chain_menu)
    VRFW.route_chains.parent_ui(vrfw_route_chain_menu, false)
  end
'''
  crc = "none"

  [[files.ops]]
  type = "replace"
  point = "vs_route_town_menu.OpenCommandSelect.RouteChains2"
  text = '''
    return vrfw_route_chain_menu ~= nil and funcLuaMenuCommand(2231168902 --[[CMND_IS_EXIST_MENU_OBJECT?]], vrfw_route_chain_menu) -- VRFW route_chains
'''
  crc = "none"

  # a match tile picked: launch it as this piece's match (OpenVsTeamMenu + CheckStartSoccerBattle with the tile's own
  # game and difficulty; state 3 reserves the match, state 2 closes the board)
  [[files.ops]]
  type = "insert_before"
  point = "vs_route_town_menu.OpenCommandSelect.RouteChainsBefore"
  text = '''
  if (VRFW.route_board ~= nil and VRFW.route_board.menu_closed ~= nil) then
    VRFW.route_board.menu_closed(a1) -- VRFW route_board: a mod's command row that wrote no retail result (the gacha's draw)
  end
  local vrfw_rch_g, vrfw_rch_d = VRFW.route_chains.picked(a1) -- VRFW route_chains
  if vrfw_rch_g ~= nil then
    funcLuaMenuCommand(2171393651, 1138543975 --[[mainmenu01_06_base_button_guide]], false)
    funcLuaMenuCommand(2323943931 --[[CMND_CLOSE_LAYER_ARRAY?]], 1423637364 --[[rpg00_05_menu_button_guide]])
    funcLuaMenuCommand(2323943931 --[[CMND_CLOSE_LAYER_ARRAY?]], 9396745 --[[mainmenu01_07_button_guide]])
    funcLuaMenuCommand(1273612389 --[[CMND_CLOSE_LAYER]], 3905678584)
    funcLuaMenuCommand(1273612389 --[[CMND_CLOSE_LAYER]], 139522149)
    n7 = vrfw_rch_d
    n8 = 0
    n25 = vrfw_rch_g
    funcLuaCommand(2565779025, 2437536560, n25)
    funcLuaCommand(2565779025, 2950461036, n7)
    funcLuaCommand(2565779025, 808875126, 0)
    funcLuaCommand(2565779025, 514031480, 0)
    funcLuaCommand(667984508 --[[CMND_SET_TEMP_BYTE_FLAG]], 3576447329, n8)
    flag16 = true
    if n21 ~= 2 then
      n21 = 3
    end
    DeleteNewRouteEffect()
    flag2 = false
    funcLuaMenuCommand(1558704558, n9, false)
    flag6 = false
    return
  end
'''
  crc = "none"

  # a chain node's balloon: its name only, no player face over it. The face is dropped before the
  # retail face call (chara 0: the retail "no face" branch, as the story pieces): hiding the face meshes and still
  # drawing the face flashed the placeholder team's player on the first hover, since the face draw shows
  # the mesh once it is built and a later draw of the same face is a cache hit
  [[files.ops]]
  type = "insert_after"
  point = "vs_route_town_menu.UpdatePieceAtcBalloon.RouteChains"
  text = '''
  if not VRFW.route_chains.balloon_face(a3) then -- VRFW route_chains
    town_map_resource_team_and_c2 = 0
  end
'''
  crc = "none"

  # the retail "new" badge (the red "!" top left) stays hidden on the whole Chronicle board; each
  # instance's own visibility is put back when the board closes
  [[files.ops]]
  type = "insert_after"
  point = "vs_route_town_menu.Step.RouteChains"
  text = '''
  VRFW.route_chains.new_icon_step() -- VRFW route_chains
'''
  crc = "none"

  [[files.ops]]
  type = "insert_after"
  point = "vs_route_town_menu.FinalizeMenu.RouteNodes"
  text = '''
  VRFW.route_chains.new_icon(true) -- VRFW route_chains
'''
  crc = "none"

  # back on the board after a match (state 8), before the retail result handling: a chain match's result
  [[files.ops]]
  type = "insert_after"
  point = "vs_route_town_menu.PreStep.RouteChains"
  text = '''
    VRFW.route_chains.after_match() -- VRFW route_chains
'''
  crc = "none"
