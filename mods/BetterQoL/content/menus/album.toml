schema = "VRFW.menu/2"
# Draw priorities 741-744: over the Caseta's art and VRFW prompts (700), under the game's keyboard (875-885).

[[object]]
name = "betterqol_alb_plate"
from = "cmn01_10_new_icon"
set = [
    { parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 741 } },
]

[[object]]
name = "betterqol_alb_icon"
from = "cmn01_10_new_icon"
set = [
    { parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 742 } },
]

[[object]]
name = "betterqol_alb_face"
from = "team00_01_chara_card_for_list"
priority = 743

[[object]]
name = "betterqol_alb_text"
from = "cmn03_01_cmd_back"
remove_block = ["MenuCollisionSetting", "MenuAnchorComponent"]
set = [
    { parameter = "m_drawPriority", match = { 1 = 301 }, values = { 1 = 744 } },
]

# a team crest: the emblem list row (team06_02), only its emblem quad shown; no hit zone; its atlas named
[[object]]
name = "betterqol_alb_crest"
from = "team06_02_emblem_list_item"
remove_block = ["MenuCollisionSetting", "CMenuAttachLocator"]
priority = 743
add = [{ block = "gmdMenuObj", parameter = "Texture", values = ["#/menu/102_team/team06/team06_02/team06_02.g4tx"] }]

# the filter window's layers, above the page
[[object]]
name = "betterqol_alb_fw_plate"
from = "cmn01_10_new_icon"
set = [
    { parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 745 } },
]

[[object]]
name = "betterqol_alb_fw_icon"
from = "cmn01_10_new_icon"
set = [
    { parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 746 } },
]

[[object]]
name = "betterqol_alb_fw_text"
from = "cmn03_01_cmd_back"
remove_block = ["MenuCollisionSetting", "MenuAnchorComponent"]
set = [
    { parameter = "m_drawPriority", match = { 1 = 301 }, values = { 1 = 747 } },
]

# page background in the BACKGROUND pass (m_drawType 1), so the plate's 3D model draws over it.
[[object]]
name = "betterqol_alb_backdrop"
from = "mainmenu90_00_background_draw_type_before"
set = [
    { parameter = "m_drawPriority", match = { 1 = 450 }, values = { 1 = 200 } },
]

[[screen]]
name = "betterqol_album_menu"
like = "scene_archive_menu"
base = "scene_archive_menu"
script = "assets/lua/screens/betterqol_album_menu.lua"

[screen.rows]
layer = [
    { layer = "save01_02_list_item", from = "savedata_management_menu", count = 1 },
    { layer = "mainmenu90_05_content_guide_line01" },
    { layer = "betterqol_alb_plate", object = "betterqol_alb_plate", count = 132, scale = 0.01 },
    { layer = "betterqol_alb_icon", object = "betterqol_alb_icon", count = 136, scale = 0.01 },
