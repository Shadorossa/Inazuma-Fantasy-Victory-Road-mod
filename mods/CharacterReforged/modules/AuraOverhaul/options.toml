# Aura Reworked › its rows in Opciones › «Opciones de mods» and on the Mods screen's «Ajustes».
# Values: <data dir>\mod_options\aura_reworked.json.
# One switch per part (its id = the id the part had as a mod of its own: mod.toml [[merged]] option). A part that is
# off loads nothing of its own: its content files, commands and scripts are left out.
# restart = true: a part switched on or off applies after restarting the game. Each
# part's own settings are child rows of its switch (greyed while the part is off).

# ---------------------------------------------------------------- Souls Rework

[[option]]
id = "souls_rework"                           # row key AuraOverhaul.souls_rework
type = "toggle"
label = "part_souls_rework"
help = "part_souls_rework_help"
default = 1
restart = true
order = 150

# every totem at its top level (5) from the start of each match: no level points, no level-up (read at every match start)
[[option]]
id = "souls_top_level"
type = "toggle"
label = "souls_top_level"
help = "souls_top_level_help"
default = 0
parent = "AuraOverhaul.souls_rework"
order = 151

# the skill carousel over the totem move's cut-in (off: the rolls apply without it; config.toml [souls.reel])
[[option]]
id = "souls_reel"
type = "toggle"
label = "souls_reel"
help = "souls_reel_help"
default = 1
parent = "AuraOverhaul.souls_rework"
order = 152

# ---------------------------------------------------------------- Custom Change Mode

[[option]]
id = "all_changed"                            # row key AuraOverhaul.all_changed
type = "toggle"
label = "part_custom_change_mode"
help = "part_custom_change_mode_help"
default = 1
restart = true
order = 160

# the green aura while a created change runs (read at every swap)
[[option]]
id = "change_aura"
type = "toggle"
label = "change_aura"
help = "change_aura_help"
default = 1
parent = "AuraOverhaul.all_changed"
order = 161

# ---------------------------------------------------------------- All Miximaxed

[[option]]
id = "all_miximaxed"                          # row key AuraOverhaul.all_miximaxed
type = "toggle"
label = "part_all_miximaxed"
help = "part_all_miximaxed_help"
default = 1
restart = true
order = 170

# the Chrono Stone stat transfer: the base gains part of the partner's stats while the miximax runs
# (content\stat_transfer\miximax.toml; read at every fusion start and every gains query)
[[option]]
id = "miximax_stats"
type = "toggle"
label = "miximax_stats"
help = "miximax_stats_help"
default = 1
parent = "AuraOverhaul.all_miximaxed"
order = 171

# ---------------------------------------------------------------- All Keshin Armed

[[option]]
id = "all_keshin_armed"                       # row key AuraOverhaul.all_keshin_armed
type = "toggle"
label = "part_all_keshin_armed"
help = "part_all_keshin_armed_help"
default = 1
restart = true
order = 180

