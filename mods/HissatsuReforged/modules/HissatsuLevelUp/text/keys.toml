schema = "VRFW.text_key/1"
# Texts of «Hissatsu Level Up» (format: docs/framework/types/text.md): the «Mods» screen's name and description. A
# language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Hissatsu Level Up"
mod_description = "Special moves level up the classic way: each player's move grows with the times he uses it in matches, and a banner says when it levels up. The last level needs the Ultimate Evolution Manual from the general shop, and a game item becomes the Technique Upgrade (+1 level). A player can no longer carry the same special move twice. From G5 on, some moves play the cut-in of their evolution."

[es.new]
mod_name = "Subida de nivel de supertécnicas"
mod_description = "Las supertécnicas suben de nivel como en los juegos clásicos: la técnica de cada jugador crece con las veces que la usa en los partidos, y un aviso lo dice cuando sube. El último nivel necesita el Cuaderno de evolución definitiva, de la Tienda general, y el objeto «Nuevas posibilidades» pasa a ser la Mejora de supertécnica (+1 nivel). Un jugador ya no puede llevar la misma supertécnica dos veces. Desde G5, algunas supertécnicas muestran la animación de su evolución."

[fr.new]
mod_name = "Montée de niveau des supertechniques"
mod_description = "Les supertechniques montent de niveau comme dans les jeux classiques : la technique de chaque joueur progresse avec le nombre de fois qu'il l'utilise en match, et un message l'annonce. Le dernier niveau demande le Livre d'évolution ultime, vendu à la boutique générale, et un objet du jeu devient l'Amélioration de technique (+1 niveau). Un joueur ne peut plus porter deux fois la même supertechnique. Dès G5, certaines supertechniques montrent l'animation de leur évolution."

[de.new]
mod_name = "Spezialtechnik-Aufstieg"
mod_description = "Spezialtechniken steigen wie in den klassischen Spielen auf: Die Technik jedes Spielers wächst mit jeder Anwendung im Spiel, und eine Meldung zeigt den Aufstieg an. Die letzte Stufe braucht das Buch der ultimativen Evolution aus dem allgemeinen Laden, und ein Gegenstand des Spiels wird zur Technik-Verbesserung (+1 Stufe). Ein Spieler kann dieselbe Spezialtechnik nicht mehr doppelt tragen. Ab G5 zeigen manche Techniken die Animation ihrer Evolution."

[it.new]
mod_name = "Salita di livello delle supertecniche"
mod_description = "Le supertecniche salgono di livello come nei giochi classici: la tecnica di ogni giocatore cresce con le volte che la usa in partita, e un avviso lo segnala. L'ultimo livello richiede il Libro dell'evoluzione suprema, in vendita nel negozio generale, e un oggetto del gioco diventa il Potenziamento tecnica (+1 livello). Un giocatore non può più avere la stessa supertecnica due volte. Da G5, alcune supertecniche mostrano l'animazione della loro evoluzione."

[pt.new]
mod_name = "Subida de nível das supertécnicas"
mod_description = "As supertécnicas sobem de nível como nos jogos clássicos: a técnica de cada jogador cresce com as vezes que a usa nas partidas, e um aviso mostra quando sobe. O último nível precisa do Livro da evolução suprema, da loja geral, e um objeto do jogo passa a ser a Melhoria de técnica (+1 nível). Um jogador já não pode levar a mesma supertécnica duas vezes. A partir de G5, algumas supertécnicas mostram a animação da sua evolução."

[ja.new]
mod_name = "必殺技レベルアップ"
mod_description = "必殺技が昔のシリーズのように成長する：選手ごとの必殺技は試合で使った回数で進化し、進化するとお知らせが出る。最終段階には、よろず屋で売っている究極進化の書が必要。ゲームのアイテムの1つが必殺技強化（1段階進化）になる。同じ必殺技を2つ装備することはできなくなる。G5からは、一部の必殺技が進化版の演出で発動する。"

[zh_hans.new]
mod_name = "必杀技升级"
mod_description = "必杀技像经典系列一样成长：每名球员的必杀技随比赛中使用的次数进化，进化时会有提示。最终阶段需要在杂货店出售的究极进化之书；游戏中的一个道具变为必杀技强化（进化一个阶段）。同一名球员不能再装备两个相同的必杀技。从G5起，部分必杀技会以进化版的演出发动。"

[zh_hant.new]
mod_name = "必殺技升級"
mod_description = "必殺技像經典系列一樣成長：每名球員的必殺技隨比賽中使用的次數進化，進化時會有提示。最終階段需要在雜貨店出售的究極進化之書；遊戲中的一個道具變為必殺技強化（進化一個階段）。同一名球員不能再裝備兩個相同的必殺技。從G5起，部分必殺技會以進化版的演出發動。"
