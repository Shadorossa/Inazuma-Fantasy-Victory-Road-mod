mod_description = "Gleicht 683 Spezialtechniken mit neuer Stärke, Spannungskosten und Wiederaufladezeit aus. Techniken mit zwei Eigenschaften zeigen in allen Listen beide Symbole, und Spezialtechniken können kritische Treffer landen. Spezialtechniken steigen auf klassische Weise auf: Jede Technik wächst mit den Einsätzen des Spielers in Spielen, und eine Meldung zeigt den Aufstieg an. Die letzte Stufe braucht das Buch der ultimativen Evolution aus dem allgemeinen Laden, und ein Spieler kann dieselbe Spezialtechnik nicht mehr doppelt tragen."
