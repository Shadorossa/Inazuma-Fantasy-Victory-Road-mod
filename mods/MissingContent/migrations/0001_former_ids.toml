schema = "VRFW.migration/1"
id = "MissingContent.former_ids"
description = "The chosen DS opening and menu theme keep their choice after their ids moved from the Inazuma Fantasy / Extra Openings names to MissingContent_"
phase = "data"
after = ["VRFW.no_compat_names"]

# The «Opening» row stores the movie id of the chosen opening row (<key>_<lang>).
[[step]]
kind = "rehash_name"
files = ["{data}/mod_options/mod_options.json"]
key = "values.opening"
from = "if_op_ie1_ja"
to = "MissingContent_op_ie1_ja"

[[step]]
kind = "rehash_name"
files = ["{data}/mod_options/mod_options.json"]
key = "values.opening"
from = "if_op_ie2_ja"
to = "MissingContent_op_ie2_ja"

