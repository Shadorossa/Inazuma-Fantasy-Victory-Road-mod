# Engine limits a mod can raise; the effective value is the maximum over the framework and all active mods.

[limits]
# Rows per tab of the CPU opponent list (retail 256, maximum 32767).
opponent_rows = 256

# sort_no capacity of the match clear bits (retail 2560, maximum 32768; larger values are clamped with a warning).
clear_bits = 32768

# Records of an inventory list (docs/framework/inventory-capacity.md). Whole blocks of the game's own capacity are used; the most is 8192.
# Team kits, save list invFashion (retail 200).
inventory_kits = 8000
# Outfits, save list invCostume (retail 200).
inventory_outfits = 8000
# Emblems, formations, tactics and synergies, save list invTeamItem (retail 500).
inventory_team_items = 8000
# Titles, save list invTitle (retail 200).
inventory_titles = 8000

# --- squad: card-type limits (a count or "unlimited"; any value above retail lifts the limit) ---
[limits.squad]
max_per_card_type = { hero = 2, diamond = 1 }

# Game profile edits that stop the game counting a card type (`counter` = framework hook counting mod card types).
[limits.squad.native.hero]
skip = [
    "Squad.CountHeroCards.Skip",
    "Squad.HeroCardsInTeamTest.Skip",
    "Squad.HeroCardsValidate.Skip",
    "Squad.HeroCardsInMatchTest.Skip",
    "Squad.HeroCardsInMatchValidate.Skip",
    "Squad.HeroCardsInSwap.Skip",
]

[limits.squad.native.diamond]
skip = [
    "Squad.CountDiamondCards.Skip",
    "Squad.CountDiamondStaff.Skip",
    "Squad.CountDiamondStaffInSwap.Skip",
    "Squad.DiamondCardsInTeamTest.Skip",
    "Squad.DiamondCardsValidate.Skip",
    "Squad.DiamondCardsInMatchTest.Skip",
    "Squad.DiamondCardsInMatchValidate.Skip",
    "Squad.DiamondCardsInSwap.Skip",
]
counter = "LimitsDiamondCounter"

# --- lists: native lists whose row count follows rows added by Lua via CMND_VRFW_LIST_ROWS(name, extra) ---
[limits.lists.formation_picker]
getter = "Team.FormationCount"
max_extra = 248

