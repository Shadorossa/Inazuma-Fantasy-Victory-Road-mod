mod_description = "Ogni giocatore ha una passiva propria, definita per personaggio dai mod, al posto di una che equipaggi tu: lo slot la mostra sempre, non si può cambiare e le partite la usano. Aggiunge anche le passive elementali generiche (Vento, Foresta, Fuoco, Montagna, Vuoto), che rendono del 15 % più forti le tecniche proprie del giocatore di quell'elemento. Le passive sono costruite con blocchi riutilizzabili che i mod possono modificare per personaggio, e lo stesso sistema muove le passive che altri mod danno agli spiriti. Richiede Character Reforged."
