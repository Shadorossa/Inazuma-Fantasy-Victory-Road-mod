[en.new]
mod_name = "BetterUI"
mod_description = "A cleaner match HUD and game menus: a compact translucent top bar, fewer markers and guides in matches, compact player cards and shop shortcuts (L2 / R2). Shirt numbers and AI roles can be set for the whole team. Rules, data and saves are untouched."
