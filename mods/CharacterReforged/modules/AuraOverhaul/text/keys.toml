part_custom_change_mode = "Modo cambio propio para cada jugador"
part_custom_change_mode_help = "Cualquier jugador puede tener su propio «Modo cambio» a cualquiera de tus personajes y cambiar con RB+B (60 s entre dos cambios). Se aplica al reiniciar el juego."
change_aura = "Aura verde durante el modo cambio"
change_aura_help = "Un aura verde alrededor del jugador mientras dura un cambio creado."
part_all_miximaxed = "Miximax entre cualquier pareja"
part_all_miximaxed_help = "Un miximax entre dos jugadores cualesquiera, como en Chrono Stone («Crear miximax» en el tablero de habilidades). Se aplica al reiniciar el juego."
miximax_stats = "El miximax suma las stats del compañero"
miximax_stats_help = "Mientras dura el miximax el jugador gana parte de las estadísticas del compañero (Chrono Stone)."
