# The partner plate on the player bank's cards.
schema = "VRFW.menu/2"

# ---- the plate's layout
[[layout]]
file = "common/menu/102_team/team11/character_reforged_partner_badge/character_reforged_partner_badge.g4pkm"
from = "common/menu/102_team/team11/team11_05/team11_05.g4pkm"

[[layout]]
file = "common/menu/102_team/team11/character_reforged_partner_badge/character_reforged_partner_badge.g4pkm"
joint = "_kizuna_base01"
translate = [-40.0, 65.0, 0.0]
scale = [80.0, 26.0, 1.0]

[[layout]]
file = "common/menu/102_team/team11/character_reforged_partner_badge/character_reforged_partner_badge.g4pkm"
joint = "_text_plate01"
translate = [-36.0, 64.0, 0.0]
scale = [72.0, 24.0, 1.0]

# ---- the plate object
[[object]]
name = "character_reforged_partner_badge"
from = "team11_05_kizuna_trans_plate"
priority = 654
set = [
    { parameter = "SkeletonAnime", match = { 1 = "common/menu/102_team/team11/team11_05/team11_05.g4pkm" }, values = { 1 = "common/menu/102_team/team11/character_reforged_partner_badge/character_reforged_partner_badge.g4pkm" } },
    { parameter = "_text_plate01", values = { 1 = 0x73C0E406 } },
]
add = [
    { block = "gmdMenuObj", parameter = "Texture", values = ["#/menu/102_team/team11/team11_05/team11_05.g4tx"], after = { parameter = "SkeletonAnime", match = { 1 = "common/menu/102_team/team11/character_reforged_partner_badge/character_reforged_partner_badge.g4pkm" } } },
]

# ---- card instance i carries plate instance i (the check mark's attach row, copied: attach id, joint, layer)
[[object_set]]
object = "team00_01_chara_card_for_list"
copy = [{ parameter = "NullLayerIndexName", match = { 3 = 0x01D1DDB0 }, values = { 1 = 0x8FCDC34A, 3 = 0x8FCDC34A } }]

[[patch]]
menu = "chara_bank_menu"
add_layer = { name = "character_reforged_partner_badge", object = "character_reforged_partner_badge", count = 72, after = "team00_01_p4_check_mark", groups = [{ group = "chara_bank_menu", flags = [0, 0, 0, 0, 1, 0], after = "team00_01_p4_check_mark" }] }

[[patch]]
menu = "chara_bank_menu_for_search"
add_layer = { name = "character_reforged_partner_badge", object = "character_reforged_partner_badge", count = 72, after = "team00_01_p4_check_mark", groups = [{ group = "chara_bank_menu_for_search", flags = [0, 0, 0, 0, 1, 0], after = "team00_01_p4_check_mark" }] }
