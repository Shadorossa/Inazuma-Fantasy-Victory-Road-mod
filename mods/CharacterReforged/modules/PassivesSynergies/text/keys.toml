[ja.new]
mod_name = "パッシブとシナジー"
mod_description = "各選手は、入れ替えできない専用パッシブを1つ持ちます（オプション「専用パッシブ」でオフにできます）。さらに、同じ属性の必殺技を強化する汎用の属性パッシブも加わります。チームシナジーは特定のキャラではなくチームやグループを条件にし、新しいシナジーには専用アイコンが付きます。パネルで足りない選手も確認できます。"
