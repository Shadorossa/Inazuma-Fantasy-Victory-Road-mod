# The transformation cross at the bottom left of the match HUD (docs/game/hiper/transform-cross.md): both
# soccer_command_action_menu scripts append hiper_btn_block.lua and show the CMND_VRFW_XSLOT_ENTRIES entries.
name = "hiper_btn"
mod = "CharacterReforged"
order = 100
module = "lua_bridge"
requires = []
conflicts = []
wraps = ["UpdateVisibleAttachButtonGuide"]
description = "hiper_btn: the transformation cross in the command action menus"

[[files]]
stem = "soccer_command_action_menu"

  [[files.ops]]
  type = "insert_after"
  point = "soccer_command_action_menu.OnInit.HiperBtn"
  text = '''
  CharacterReforged.hyper_button_init() -- EVT
'''
  crc = "none"

  [[files.ops]]
  type = "insert_after"
  point = "soccer_command_action_menu.OnSetupLayer.HiperBtn"
  text = '''
  CharacterReforged.hyper_button_setup_layer(a1, a2) -- EVT
'''
  crc = "none"

  [[files.ops]]
  type = "insert_after"
  point = "soccer_command_action_menu.PostStep.HiperBtn"
  text = '''
  CharacterReforged.hyper_button_step() -- EVT
'''
  crc = "none"

  [[files.ops]]
  type = "append_block"
  source = "hiper_btn_block.lua"

  # the card portrait rules CharacterReforged.hyper_card (shared with the player page and the skill table): the aura's portrait at the
  # plate's right end, layer cr_hiper_chr_icon (content\menus\hyper_plates.toml)
  [[files.ops]]
  type = "append_block"
  source = "../plate_hiper_plate/character_reforged_hiper_card.lua"
  marker = "hiper_card"

[[files]]
