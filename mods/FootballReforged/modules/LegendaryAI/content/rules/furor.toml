schema = "VRFW.behaviour/1"
# Legendary AI › when the rival starts its «Fase de furor» (the Furor module of Football Reforged).

# ------------------------------------------------------------------------------------------------ the CPU's start is ours

[[rule]]
id = "furor_cpu_driven_on"
on = "match:start"
[rule.do]
set_flag = "Furor.cpu_driven"

[[rule]]
id = "furor_cpu_driven_off"
on = "match:end"
[rule.do]
clear_flag = "Furor.cpu_driven"

# ------------------------------------------------------------------------------------------------ when it starts it

[[rule]]
id = "furor_attack"
on = "match:possession"
[rule.when]
team = "rival"
flag = "Furor.gauge.rival.full"
zone = { z = ["${config.furor.attack_from_z}", 60.0], frame = "team" }
[rule.do]
signal = "Furor.gauge.start"
log = "legendary furor: attack (shooting range)"

[[rule]]
id = "furor_zone_running_on"
on = "match:state_enter:16"
[rule.do]
set_flag = "LegendaryAI.zone_running"

[[rule]]
id = "furor_zone_running_off"
on = "match:state_leave:16"
[rule.do]
clear_flag = "LegendaryAI.zone_running"

[[rule]]
id = "furor_zone"
on = "match:state_enter:16"
[rule.when]
flag = "Furor.gauge.rival.full"
[rule.do]
signal = "LegendaryAI.furor_zone"
log = "legendary furor: its shoot zone starts"

[[rule]]
id = "furor_zone_gauge_full"
on = "script:signal:Furor.gauge.full"
[rule.when]
team = "rival"
flag = "LegendaryAI.zone_running"
[rule.do]
signal = "LegendaryAI.furor_zone"
log = "legendary furor: gauge full during a shoot zone"

# Behind late: from the second half's middle on, while trailing, at its next ball anywhere on the pitch.
[[rule]]
id = "furor_comeback"
on = "match:possession"
[rule.when]
team = "rival"
flag = "Furor.gauge.rival.full"
score = "trailing"
half = { min = "${config.furor.comeback_from_half}" }
half_fraction_from = "${config.furor.comeback_half_fraction}"
[rule.do]
signal = "Furor.gauge.start"
log = "legendary furor: comeback (trailing late)"

# The gauge fills while it is behind late: at once, not at its next ball (actor = one of its players).
[[rule]]
id = "furor_comeback_gauge_full"
on = "script:signal:Furor.gauge.full"
[rule.when]
team = "rival"
score = "trailing"
half = { min = "${config.furor.comeback_from_half}" }
half_fraction_from = "${config.furor.comeback_half_fraction}"
[rule.do]
signal = "Furor.gauge.start"
log = "legendary furor: comeback (gauge full while trailing late)"

[[rule]]
id = "furor_defend"
on = "match:possession"
[rule.when]
team = "user"
flag = "Furor.gauge.rival.full"
zone = { z = ["${config.furor.defend_from_z}", 60.0], frame = "team" }
[rule.do]
signal = "LegendaryAI.furor_defend"
log = "legendary furor: defence (your carrier near its goal)"

[[rule]]
id = "furor_no_waste"
on = "match:possession"
[rule.when]
team = "rival"
flag = "Furor.gauge.rival.full"
half = { max = "${config.furor.no_waste_half_max}" }
half_fraction_from = "${config.furor.no_waste_half_fraction}"
[rule.do]
signal = "Furor.gauge.start"
log = "legendary furor: end of half (no waste)"

# The gauge fills in the last part of a half: used at once.
[[rule]]
id = "furor_no_waste_gauge_full"
on = "script:signal:Furor.gauge.full"
[rule.when]
team = "rival"
half = { max = "${config.furor.no_waste_half_max}" }
half_fraction_from = "${config.furor.no_waste_half_fraction}"
[rule.do]
signal = "Furor.gauge.start"
log = "legendary furor: end of half (gauge full late)"
