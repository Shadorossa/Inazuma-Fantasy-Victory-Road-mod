schema = "VRFW.game/2"

# The match info block [[g_gameRoot] + Game.RootMatch]: the two team records.
[[VRFW.Global]]
name = "missing_content_match"
base = "game_root"
chain = ["Game.RootMatch"]

# A substitution or position change reloads a match model with the keeper flag set or cleared.
[[VRFW.Hook]]
name = "MissingContent.KeeperLookRefresh"
game = "Render.RefreshMatchCharaLook"
kind = "function"
arguments = ["ptr", "u32"]
