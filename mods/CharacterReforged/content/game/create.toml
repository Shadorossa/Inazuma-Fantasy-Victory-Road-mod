schema = "VRFW.game/2"

# (charaHdl) -> n, create item 1 ..
[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_CREATE_BEGIN"
handler = "CharacterReforged.Create.Begin"

# () -> n, create item 1 ..
[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_CREATE_ITEMS"
handler = "CharacterReforged.Create.Items"

[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_CREATE_ROW"
handler = "CharacterReforged.Create.Row"

# (charaHdl) -> row (0 = no create item picked), board slot, the system's store command id
[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_CREATE_PICKED"
handler = "CharacterReforged.Create.Picked"

[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_CREATE_MOVES"
handler = "CharacterReforged.Create.Moves"

# (row, k) -> the system's carrier item id (k = the store's carrier index)
[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_CREATE_CARRIER"
handler = "CharacterReforged.Create.Carrier"

# (charaHdl, slot, carrierInv) -> ok: the carrier on that board slot (the game's placement)
[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_CREATE_PLACE"
handler = "CharacterReforged.Create.Place"

[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_CREATE_RESTORE"
handler = "CharacterReforged.Create.Restore"

# (row, code) -> labelId, reasonId, labelText, reasonText: the refusal window's texts (code 0 = none, -4 = the avatar)
[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_CREATE_REFUSAL"
handler = "CharacterReforged.Create.Refusal"

# (step, values…) -> true: one loader.log line per step of the graft («create: board <step> …»)
[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_CREATE_LOG"
handler = "CharacterReforged.Create.Log"
