name = "LevelSync.ShownUseChara"
game = "Menu.UseCharaLevelCall"
kind = "call"
arguments = ["ptr", "ptr"]
returns = "u16"
apply = "script"

# only the user's players: saved characters and their match copies
[[VRFW.Hook.answer]]
