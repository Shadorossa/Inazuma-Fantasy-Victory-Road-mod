schema = "VRFW.game/2"
# Character Reforged › partner locks: a card used as the
# partner of another card's pair (a Mix-Max, a mode change, …) stays in the player bank and wears the system's plate.

# () -> { { card, base, sprite, textId, text }, … }: every locked card (the bank's hook file, graft cr_partner_lock)
[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_PARTNER_LOCKS"
handler = "CharacterReforged.PartnerLock.List"

# () -> { { card, statusSprite, order, isPartner, system }, … }: every card a system uses, partner or base (the
# «Crear …» partner bank's corner badges, bank_create_moves_hooks.lua of graft character_reforged_board)
[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_PARTNER_USES"
handler = "CharacterReforged.PartnerLock.Uses"

# (card) -> statusSprite, inTeamSprite: the badge of the system whose aura type his mix slot's move has (the player
# bank's corner badge, partner_lock_bank_hooks.lua of graft cr_partner_lock)
[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_MIX_BADGE"
handler = "CharacterReforged.PartnerLock.MixBadge"

# (card) -> base (0 = free), sprite, textId, text
[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_PARTNER_LOCK"
handler = "CharacterReforged.PartnerLock.Get"

# The game's place check 1730898405(hdl, toSet, pos, fromSet, team) -> ok, code and place / move 193693077(toSet, pos,
# fromSet, hdl, team): a locked partner taken from the bank (set 16) into a team set is refused before the game's
# handler (every team screen, the bank's «Añadir al equipo», drags and the mouse go through them).
[[VRFW.CommandFilter]]
name = "CharacterReforged.PartnerPlaceCheck"
command = 1730898405
handler = "CharacterReforged.PartnerLock.PlaceCheck"

[[VRFW.CommandFilter]]
name = "CharacterReforged.PartnerMoveChara"
command = 193693077
handler = "CharacterReforged.PartnerLock.MoveChara"
