# Pressing: its settings (read by scripts\pressing.lua at the start; restart the game after a change).

[pressing]
# WHO PRESSES.
min_players = 2
max_players = 4
band_m = 14.0
range_m = 32.0
sprint = true
sprint_speed = 1.0
sprint_drain = 0.9
# how long one press order lasts without a refresh (ms); the script refreshes it every frame while the press holds.
order_ms = 300
chase = true

sprint_resource = "VRFW.sprint"
winded_state = "winded"
min_sprint = 0.0

# THE FOCUS FIELD.
focus_field_gate = "off_ball"

# YOUR PRESS: while one of these input commands is on (their names in the game's input_ctrl).
hold_commands = ["CMD_GO_AHEAD_HOLD", "CMD_GO_AHEAD", "CMD_CATCH_BOMB"]

# THE CPU'S PRESS (the rival team, and your team when it plays on auto).
cpu = true
decide_ms = 500
press_ms = 2500
rest_ms = 1500

# THE HUD.
hud_sprite = "pressing_gtxt_action_press01"
arrows = "user"

[pressing.ai]
enabled = true
radius_m = 10.0
ranks = 2
chance = 0.3
press_ms = 2000
cooldown_ms = 6000
decide_ms = 600

# The carrier is near the CPU's goal.
[[pressing.cpu_rule]]
carrier_to_own_goal_max_m = 30.0
chance = 0.8

# The carrier is in the CPU's half and a CPU player is close to him.
[[pressing.cpu_rule]]
carrier_in_own_half = true
nearest_within_m = 8.0
chance = 0.6

# Anywhere: three CPU players are close to the carrier.
[[pressing.cpu_rule]]
ready_within_m = 12.0
ready_count = 3
chance = 0.35
