# Transformation Items: a mod in the standard layout.
#   content\items\    the transforming items
#   text\             texts (9 languages): the mod's name and description (keys.toml), the items' refusal texts (rows\)
# A data mod: no plugin, no Lua of its own. The framework builds the pairs, the equip gate and the refusal window, and
# draws the new look (match and menu models, face icons, the other version's stats and moves). A module of Character
# Reforged: it requires it.
id = "TransformationItems"
former_ids = ["TransformingItems"]
key_id = "TransformationItems"
# the English fallback; the Mods screen shows the text keys mod_name / mod_description (text\keys.toml)
name = "Transformation Items"
version = "0.2.2"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Items that change a player's look while he wears them. The Alius Crystal lets a player who took the Alius stone (the Dark Emperors, Royal Academy Redux and the Alius Academy players, classic version) equip it and take his Alius look, with that version's stats and moves; take it off and he is back to normal. It unlocks once you beat the Dark Emperors in the Chronicle."
# this mod's own names: TOML keys [[TransformationItems.X]], Lua TransformationItems.X (never VRFW)
prefix = "TransformationItems"
folder = "TransformationItems"
priority = 0
tags = ["Characters", "Gameplay"]
updated = "2026-11-03"
# [[VRFW.ItemTransform]] families / base_series (2.8.75); unlock.cleared sets unlock.flag on a won match (2.8.83)
# the unlock is the save flag TransformationItems.AliusStoneUnlocked (content\flags\)
# the flag declared by name only; its bit is given by the framework (2.8.86)
# an embedded
# module of Character Reforged (research/mods/CharacterReforged/modules/TransformationItems/)
requires = ["VRFW>=0.2.2", "CharacterReforged>=0.2.2"]
conflicts = []

# A MODULE of Character Reforged: shipped in
# CharacterReforged\modules\TransformationItems\; the Mods screen, the ModManager and `vrfw list` show it inside
# Character Reforged's entry («Módulos y ajustes»: on / off); switching Character Reforged off switches it off too.
# Its name there: its mod_name (text\keys.toml).
[module]
of = "CharacterReforged"
order = 85
