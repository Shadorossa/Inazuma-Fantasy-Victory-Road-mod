schema = "VRFW.game/2"

# (pieceId) -> handler name, node name, menu key (nothing = the piece opens no mod menu)
[[VRFW.Command]]
name = "CMND_VRFW_NODE_MENU_OF_PIECE"
handler = "NodeMenu.OfPiece"

# (pieceId) -> {handler, node, key, banner, rows = {{text, unlock, level, min, max, game}, …}} (nothing = no rows)
[[VRFW.Command]]
name = "CMND_VRFW_NODE_MENU_ROWS"
handler = "NodeMenu.Rows"
