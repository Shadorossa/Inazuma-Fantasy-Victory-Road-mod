schema = "VRFW.game/2"

[[VRFW.Global]]
name = "game_settings"
base = "game_root"
chain = ["Game.RootSettings"]

[[VRFW.Command]]
name = "CMND_BETTERQOL_NAMES_RELOAD"
handler = "BetterQoL.OriginalNames.Reload"

# () -> the label text id of the names row (false: the row is not extended)
[[VRFW.Command]]
name = "CMND_BETTERQOL_NAMES_ROW"
handler = "BetterQoL.OriginalNames.Row"

# (lang code) -> pages (series), current page (1-based), reopen after each tick; 0 = no picker
[[VRFW.Command]]
name = "CMND_BETTERQOL_NAMES_PICK_OPEN"
handler = "BetterQoL.OriginalNames.PickOpen"

[[VRFW.Command]]
name = "CMND_BETTERQOL_NAMES_PICK_GRID"
handler = "BetterQoL.OriginalNames.PickGrid"

# () -> the team grid's layout ([original_names.team_grid]): cols, rows, pitch x, pitch y, centre x, centre y
[[VRFW.Command]]
name = "CMND_BETTERQOL_NAMES_PICK_TEAM_GRID"
handler = "BetterQoL.OriginalNames.PickTeamGrid"

# (dir) -> page (1-based), the series' name, its players chosen, its players, its team rows; false = no picker
[[VRFW.Command]]
name = "CMND_BETTERQOL_NAMES_PICK_TAB"
handler = "BetterQoL.OriginalNames.PickTab"

# (i) -> team row i of the page: its name, players chosen, players, emblem (item_emblem id, 0 = none); false = none
[[VRFW.Command]]
name = "CMND_BETTERQOL_NAMES_PICK_ITEM"
handler = "BetterQoL.OriginalNames.PickItem"

# (i) -> opens team row i for the grid: players, players chosen, the team's name; false = none
[[VRFW.Command]]
name = "CMND_BETTERQOL_NAMES_PICK_TEAM"
handler = "BetterQoL.OriginalNames.PickTeam"

# (j) -> player j of the open team: chara_base key (face icon), chosen, dub name, original name; false = none
[[VRFW.Command]]
name = "CMND_BETTERQOL_NAMES_PICK_PLAYER"
handler = "BetterQoL.OriginalNames.PickPlayer"

# (j) (0 = every player of the team) -> the new state, players chosen, players; false = none
[[VRFW.Command]]
name = "CMND_BETTERQOL_NAMES_PICK_TOGGLE"
handler = "BetterQoL.OriginalNames.PickToggle"

# () -> changed, the row's new draft index (-1 = unchanged), its value text id, is it the last value
[[VRFW.Command]]
name = "CMND_BETTERQOL_NAMES_PICK_CLOSE"
handler = "BetterQoL.OriginalNames.PickClose"

# void SettingRowRead(menu, Row* row) 0x1184700: row value from the game settings (type 63: index = (+0x7D != 0)).
[[VRFW.Hook]]
name = "SettingRowRead"
game = "Option.SettingRowRead"
kind = "function"

# void SettingRowWrite(menu, Row* row) 0x1184220: type 63 stores +0x7D = (value != 0).
[[VRFW.Hook]]
name = "SettingRowWrite"
game = "Option.SettingRowWrite"
kind = "function"
