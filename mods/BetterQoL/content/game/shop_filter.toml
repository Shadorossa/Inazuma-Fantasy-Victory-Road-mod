schema = "VRFW.game/2"

# Shop filter: the retail item filter window over shop tabs; rows the engine's own item test rejects are dropped.

[[VRFW.Function]]
name = "ItemTestSeriesStat"
game = "Item.TestSeriesStat"

[[VRFW.Function]]
name = "ItemTestSkill"
game = "Transform.AbilityItemFilterPass"

[[VRFW.Function]]
name = "ItemFilterBlockFill"
game = "Technique.FilterBlockFill"

# Shop tab builder 0x118A100 (CMenuListViewShop, 320 rows a tab): call 0x118BCA0 (category, sub -> tab).
[[VRFW.Hook]]
name = "ShopTabOf"
game = "Shop.TabOf"
kind = "call"
needs = ["ItemTestSeriesStat", "ItemTestSkill"]

[[VRFW.Hook.answer]]
phase = "post"
when = [{ value = "args[2]", equals = 160 }, { value = "args[3]", equals = 178 }]
value = "17"

# The same answer for the tab list (0x118BEF0) and the «new» marks (0x118A330).
[[VRFW.Hook]]
name = "ShopTabListOf"
game = "Shop.TabListOf"
kind = "call"

[[VRFW.Hook.answer]]
phase = "post"
when = [{ value = "args[2]", equals = 160 }, { value = "args[3]", equals = 178 }]
value = "17"

[[VRFW.Hook]]
name = "ShopNewMarkTabOf"
game = "Shop.NewMarkTabOf"
kind = "call"

[[VRFW.Hook.answer]]
phase = "post"
when = [{ value = "args[2]", equals = 160 }, { value = "args[3]", equals = 178 }]
value = "17"

# slot, inv, t1, v1, o1, … -> ok (no triples = that slot's filter removed)
[[VRFW.Command]]
name = "CMND_BETTERQOL_SHOP_FILTER_SET"
handler = "BetterQoL.ShopFilterSet"

# value 1, count 1, item 1, …, value 2, … -> true: rows a mod adds to the equipment window; no arguments = none
[[VRFW.Command]]
name = "CMND_BETTERQOL_SHOP_FILTER_ROWS"
handler = "BetterQoL.ShopFilterRows"

# inv, t1, v1, o1, … -> shown, total over the rows of the tab built last
[[VRFW.Command]]
name = "CMND_BETTERQOL_SHOP_FILTER_COUNT"
handler = "BetterQoL.ShopFilterCount"

# -> live, cleared (every slot's filter dropped)
[[VRFW.Command]]
name = "CMND_BETTERQOL_SHOP_FILTER_RESET"
handler = "BetterQoL.ShopFilterReset"

# -> n, id1, …: the engine's «new» list of the shop list view built last
[[VRFW.Command]]
name = "CMND_BETTERQOL_SHOP_NEW_LIST"
handler = "BetterQoL.ShopNewList"

# id -> true, isNew
[[VRFW.Command]]
name = "CMND_BETTERQOL_SHOP_NEW_STATE"
handler = "BetterQoL.ShopNewState"

# Technique name search (shop side) over the same hook.
[[VRFW.Command]]
name = "CMND_BETTERQOL_SHOP_NAME_ITEMS"
handler = "BetterQoL.ShopNameItems"

# id1, … -> live: only these items stay in the tab built last; no ids = no search
[[VRFW.Command]]
name = "CMND_BETTERQOL_SHOP_NAME_SET"
handler = "BetterQoL.ShopNameSet"
