schema = "Equipment.rules/1"
# Rules every item follows (no power tiers: every item nets the same; its penalty tier follows its passive).

[scale]
cap = 1.0

[budget]
net = 1.0
# no raise passes the largest bonus (scale_stats are fractions of it, -1..1): the excess goes to the next raised stat
max_raise = 1.0
display_s = 70

[shape]
total = 1.0
display_s = 70
lowered = 0.143
min_raise = 0.143
third_share = 0.4
single_ratio = 1.5
by_tier = { none = "two", small = "three", big = "trade" }

[penalty]
# the lowered stat per tier, as a fraction of S (at S = 70: none 0 / small −10 / big −20; raises 70 / 80 / 90)
tiers = { none = 0.0, small = 0.143, big = 0.286 }
strong_kinds = ["family_power", "tension_on", "tension_cost", "recast"]
strong_identity = ["L"]
off_pitch_kinds = ["match_exp", "match_money"]
multi_set = 2

[splits]                        # the primary raise's share of the raises
balanced = 0.50
soft = 0.54
mild = 0.57
concentrated = 0.59
leaning = 0.62
strong = 0.65
extreme = 0.68
# the order items of one slot and raised pair take them (natural, then inverted; balanced once)
variant_order = ["concentrated", "extreme", "soft", "leaning", "strong", "mild", "balanced"]

# the stat a pair lowers: first choice, then the second; the other stats follow in stat order
[[pair_penalty]]
pair = ["kick", "control"]
lower = ["pressure", "agility"]
[[pair_penalty]]
pair = ["kick", "technique"]
lower = ["physical", "pressure"]
[[pair_penalty]]
pair = ["kick", "pressure"]
lower = ["intelligence", "technique"]
[[pair_penalty]]
pair = ["kick", "physical"]
lower = ["intelligence", "technique"]
[[pair_penalty]]
pair = ["kick", "intelligence"]
lower = ["physical", "pressure"]
[[pair_penalty]]
pair = ["kick", "agility"]
lower = ["intelligence", "technique"]
[[pair_penalty]]
pair = ["control", "technique"]
lower = ["pressure", "physical"]
[[pair_penalty]]
pair = ["control", "pressure"]
lower = ["kick", "technique"]
[[pair_penalty]]
pair = ["control", "physical"]
lower = ["intelligence", "kick"]
[[pair_penalty]]
pair = ["control", "intelligence"]
lower = ["physical", "pressure"]
[[pair_penalty]]
pair = ["control", "agility"]
lower = ["kick", "physical"]
[[pair_penalty]]
pair = ["technique", "pressure"]
lower = ["kick", "intelligence"]
[[pair_penalty]]
pair = ["technique", "physical"]
lower = ["intelligence", "kick"]
[[pair_penalty]]
pair = ["technique", "intelligence"]
lower = ["physical", "pressure"]
[[pair_penalty]]
pair = ["technique", "agility"]
lower = ["kick", "physical"]
[[pair_penalty]]
pair = ["pressure", "physical"]
lower = ["intelligence", "technique"]
[[pair_penalty]]
pair = ["pressure", "intelligence"]
lower = ["control", "technique"]
[[pair_penalty]]
pair = ["pressure", "agility"]
lower = ["kick", "control"]
[[pair_penalty]]
pair = ["physical", "intelligence"]
lower = ["technique", "kick"]
[[pair_penalty]]
pair = ["physical", "agility"]
lower = ["intelligence", "control"]
[[pair_penalty]]
pair = ["intelligence", "agility"]
lower = ["physical", "kick"]

[affinity]
one = 0.15
both = 0.25
# an item's position: the one of its primary raise (items.toml `position` overrides, e.g. keeper gloves)
position_by_stat = { kick = "FW", technique = "FW", control = "MF", intelligence = "MF", pressure = "DF", physical = "DF", agility = "GK" }

[passives]
family_mod = "HissatsuReforged"

[card]
element_icon_files = ["content/images/menu/200_icon/15_icon_common/icon_common.toml"]
element_icon = { wind = "[$gaiji_cmd_type01]", forest = "[$gaiji_cmd_type02]", fire = "[$gaiji_cmd_type03]", mountain = "[$gaiji_cmd_type04]", void = "[$gaiji_cmd_type00]" }

[optimizer]
passive = 6.0
set_effect = 6.0
keep_current = 0.5
max_plans = 4000

[optimizer.weights.FW]
kick = 1.0
technique = 0.7
control = 0.6
agility = 0.5
physical = 0.4
intelligence = 0.2
pressure = 0.1

[optimizer.weights.MF]
control = 1.0
technique = 0.8
intelligence = 0.7
agility = 0.6
kick = 0.5
pressure = 0.4
physical = 0.3

[optimizer.weights.DF]
pressure = 1.0
physical = 0.9
intelligence = 0.6
agility = 0.5
control = 0.4
technique = 0.2
kick = 0.1

[optimizer.weights.GK]
intelligence = 1.0
physical = 0.8
pressure = 0.6
agility = 0.4
control = 0.2
technique = 0.1
kick = 0.1
