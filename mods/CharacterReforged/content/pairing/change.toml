schema = "CharacterReforged.pairing/1"

[CharacterReforged.PairRules.change]
# The match gives no swap to a base whose partner card is in his team, so the partner is picked out of every team.
partner_may_be_in_team = false
[CharacterReforged.Create.change]
item = "wmc_character_reforged_create"
label = "CharacterReforged.change_create_label"
store = "CMND_CHARACTERREFORGED_CHANGE_CREATE"
carrier = "wmc_evt{k}"
pair_codes = 10
order = 20
# the mode change glyph between the base's and the partner's cards of the pair windows (icon_common sprite)
confirm_icon = "icon_sp_area11"

# CMND_CHARACTERREFORGED_CHANGE_CREATE's own codes (scripts\custom_change_mode.lua: MC_ADD's) -> the refusal window's text
[CharacterReforged.Create.change.refusals]
"1" = "CharacterReforged.create_refused_off"
"3" = "CharacterReforged.create_refused_1"
"4" = "CharacterReforged.create_refused_2"
"5" = "CharacterReforged.create_refused_4"
"7" = "CharacterReforged.create_refused_store"
"21" = "CharacterReforged.create_refused_2"
"22" = "CharacterReforged.create_refused_5"
"23" = "CharacterReforged.create_refused_4"
"24" = "CharacterReforged.create_refused_8"
"25" = "CharacterReforged.create_refused_card_used"

[CharacterReforged.PartnerLock.change]
badge_sprite = "custom_change_mode_partner_badge"
badge_text = "CharacterReforged.change_partner_badge"
order = 20
status_badge = "character_reforged_status_change"
status_badge_in_team = "character_reforged_status_change_team"
status_aura_type = 6
