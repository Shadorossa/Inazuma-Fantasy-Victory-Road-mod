# Training level: the class row's own level (INAZUMA Nv. 50, ZONA LETAL Nv. 99, Nv. 200, the daily Nv. 250).
schema = "VRFW.rival_players/1"

[[rule]]
name = "free_match"
difficulties = ["Class1", "Class2", "Class3", "Class4"]
play_mode = 1
training_level = "class"
archetypes = ["counter", "tension", "justice", "bond", "foul_play"]
team_focus = 0.15
keep_special = true
position_passives = "best_by_position"

# Contraataque, the strongest team effect (team DF +60 % with no charges).
[[archetype]]
name = "counter"
element_bonus = { wind = 0.02 }
GK = { stats = ["agility", "physical", "pressure", "luck"], passives = ["ps10075_04", "ps10077_04"] }           # keeper PP 5, AT / DF 6 after a recovery
FW = { stats = ["kick", "control", "agility", "physical"], passives = ["ps10069_04", "ps10073_04"] }            # team shot AT 4, team focus 1 per rank
MF = { stats = ["technique", "agility", "pressure", "intelligence"], passives = ["ps10073_04", "ps10077_04"] }  # team focus 1 per rank, AT / DF 6
DF = { stats = ["pressure", "intelligence", "agility", "luck"], passives = ["ps10077_04", "ps10073_04"] }       # AT / DF 6, team focus 1 per rank

[[archetype]]
name = "tension"
element_bonus = { fire = 0.02 }
GK = { stats = ["agility", "physical", "pressure", "luck"], passives = ["ps10127_04", "ps10063_04"] }           # tension 2 per rank, tension 6 on a win
FW = { stats = ["kick", "control", "luck", "physical"], passives = ["ps10067_04", "ps10127_04"] }               # team shot AT 6 at full tension, tension 2 per rank
MF = { stats = ["technique", "kick", "intelligence", "pressure"], passives = ["ps10065_04", "ps10063_04"] }     # team focus 2, tension 6 on a win
DF = { stats = ["pressure", "intelligence", "agility", "luck"], passives = ["ps10063_04", "ps10127_04"] }    # tension 6 on a win, tension 2 per rank

# Justicia.
[[archetype]]
name = "justice"
element_bonus = { mountain = 0.02 }
GK = { stats = ["agility", "physical", "pressure", "luck"], passives = ["ps10098_04", "ps10100_04"] }           # wall DF 2, team AT / DF 0.4 per rank
FW = { stats = ["kick", "control", "agility", "intelligence"], passives = ["ps10100_04", "ps10096_04"] }        # team AT / DF 0.4 per rank, affinity 8
MF = { stats = ["technique", "kick", "physical", "pressure"], passives = ["ps10100_04", "ps10096_04"] }         # the same
DF = { stats = ["pressure", "physical", "agility", "luck"], passives = ["ps10100_04", "ps10098_04"] }           # team AT / DF 0.4 per rank, wall DF 2

[[archetype]]
name = "bond"
element_bonus = { forest = 0.02 }
GK = { stats = ["agility", "physical", "pressure", "luck"], passives = ["ps10119_04", "ps10081_04"] }       # team AT / DF per affinity, team duel 5 per rank
FW = { stats = ["kick", "control", "luck", "intelligence"], passives = ["ps10083_04", "ps10119_04"] }           # direct shot AT 4, team AT / DF per affinity
MF = { stats = ["technique", "kick", "intelligence", "pressure"], passives = ["ps10081_04", "ps10119_04"] }       # team duel 5 per rank, team AT / DF per affinity
DF = { stats = ["pressure", "intelligence", "agility", "luck"], passives = ["ps10081_04", "ps10119_04"] }          # the same

# Juego sucio.
[[archetype]]
name = "foul_play"
element_bonus = { void = 0.02 }
GK = { stats = ["agility", "physical", "pressure", "luck"], passives = ["ps10086_04", "ps10088_04"] }           # team foul rate -4 sprinting / outside the area
FW = { stats = ["kick", "control", "agility", "physical"], passives = ["ps10092_04", "ps10090_04"] }           # hard attack 1 per rank, tension 4 when fouled
MF = { stats = ["technique", "kick", "physical", "luck"], passives = ["ps10092_04", "ps10086_04"] }             # hard attack 1 per rank, foul rate -4
DF = { stats = ["pressure", "physical", "agility", "luck"], passives = ["ps10092_04", "ps10086_04"] }        # the same

[[position_passives]]
name = "best_by_position"
GK = ["ps10112_04", "ps10112_04", "ps10112_04"]   # team PP +3.5 %
FW = ["ps10039_04", "ps10039_04", "ps10039_04"]   # own shot AT +8 % in the rival half
MF = ["ps10022_04", "ps10022_04", "ps10022_04"]   # own focus value +8 %, a same-element player nearby
DF = ["ps10024_04", "ps10024_04", "ps10024_04"]   # own duel value +20 %, a same-element player nearby
