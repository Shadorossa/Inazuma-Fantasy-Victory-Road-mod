schema = "VRFW.passive_pool/1"
# The keshin PEG and totem SP bars (content\match_resources\) as the special passives' spirit pools:
#PoolRestore refills them, PoolCost writes SpiritStaminaPoints.cost_pct.<handle>, which
# scripts\aura_points.lua reads for that player's costs.

[[VRFW.PassivePool]]
name = "peg"
resource = "SpiritStaminaPoints.peg"
cost_flag = "SpiritStaminaPoints.cost_pct"

[[VRFW.PassivePool]]
name = "sp"
resource = "SpiritStaminaPoints.sp"
cost_flag = "SpiritStaminaPoints.cost_pct"
