schema = "VRFW.option/2"
# Legendary AI › its row on the Mods screen's «Ajustes» and in Options › «Mod options».

# «Difficulty»: the rival's AI rules only (never its stats, passives, level or class).
[[option]]
id = "difficulty"                             # row key LegendaryAI.difficulty
type = "list"
label = "option_difficulty"                   # text\keys.toml, 9 languages
help = "option_difficulty_help"
values = [{ value = 0, name = "difficulty_novice", text = "Novice" }, { value = 1, name = "difficulty_amateur", text = "Amateur" }, { value = 2, name = "difficulty_professional", text = "Professional" }, { value = 3, name = "difficulty_world_class", text = "World class" }, { value = 4, name = "difficulty_hell", text = "Hell" }]
default = 4
order = 230
restart = false

# «Canon Chronicle battles»: Legendary AI also in the Chronicle battles the game gives a story team for (mod.toml not_in_match_modes_unless_option), read at each match setup.
[[option]]
id = "canon_chronicle_battles"                # row key LegendaryAI.canon_chronicle_battles
type = "toggle"
label = "option_canon_chronicle_battles"      # text\keys.toml, 9 languages
help = "option_canon_chronicle_battles_help"
default = 0
order = 231
restart = false
