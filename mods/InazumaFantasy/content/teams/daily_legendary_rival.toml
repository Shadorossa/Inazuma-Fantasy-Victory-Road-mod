schema = "VRFW.team/2"
# The SLOT TEAM of the «Daily Legendary Rival» row of the Inazuma Fantasy free-match section
# (content\teams\free_match_section.toml): an ordinary team with 16 player rows (placeholders, only played when the
# free-match list has no eligible team) and a coach row. The list shows only «Rival del día», a «?» crest and empty cards.
# When the match is reserved, assets\lua\_all\280_daily_legendary_rival.lua makes it stand in for the day's rival
# (CMND_VRFW_TEAM_STAND_IN: its name, crest, kit, formation, squad; CMND_VRFW_TEAM_STAND_IN_LOOK: its coach) and sets
# every member to the row's level (CMND_VRFW_TEAM_MEMBER_LEVELS). The day's rival:
# scripts\daily_legendary_rival.lua (config.toml [daily_legendary_rival]).

[[team]]
name = "ct_ft_daily_legendary_rival"
key = "evt_ct_ft_daily_legendary_rival"
level = 1
formation = 0xBA9D367C                    # placeholder (the stand-in takes the rival's)
kit = 0xC68FF352
roster = "exact"
member = [
