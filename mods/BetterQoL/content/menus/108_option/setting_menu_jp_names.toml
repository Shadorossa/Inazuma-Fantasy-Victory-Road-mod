# Player grid of the original-names picker (graft betterqol_original_names).
schema = "VRFW.menu/2"

[[object]]
name = "betterqol_jpn_face"
from = "team00_01_chara_card_for_list"
priority = 700

[[patch]]
menu = "setting_menu"
add_layer = { name = "betterqol_jpn_face", object = "betterqol_jpn_face", count = 40, groups = [{ group = "setting_menu", flags = [0, 0, 0, 0, 1, 0] }] }

# Team grid: the framework's emblem grid (VRFW.emblem_grid), 24 tiles with two labels each (name, «chosen/players»).
[[patch]]
menu = "setting_menu"
add_layer = { name = "betterqol_jpn_emblem", object = "vrfw_emblem_tile", count = 24, groups = [{ group = "setting_menu", flags = [0, 0, 0, 0, 1, 0] }] }

[[patch]]
menu = "setting_menu"
add_layer = { name = "betterqol_jpn_label", object = "vrfw_tile_label", count = 48, groups = [{ group = "setting_menu", flags = [0, 0, 0, 0, 1, 0] }] }

[[object]]
name = "betterqol_jpn_panel"
from = "mainmenu90_00_background"
set = [{ parameter = "m_drawPriority", match = { 1 = 450 }, values = { 1 = 653 } }]

[[patch]]
menu = "setting_menu"
add_layer = { name = "betterqol_jpn_panel", object = "betterqol_jpn_panel", count = 1, groups = [{ group = "setting_menu", flags = [0, 0, 0, 0, 1, 0] }] }
