schema = "VRFW.game/2"

# ------------------------------------------------------------------------------------------------ globals / structs

# CSceneSoccer* [0x21F6350] (a new scene object = a new match), from the scene driver's update call 0x1423EA5
[[VRFW.Global]]
name = "sp_scene"
rip = { pattern = "48 8B 0D ?? ?? ?? ?? 48 85 C9 74 09 41 0F 28 C8 E8 ?? ?? ?? ?? 4C 8D 9C 24 A0 00 00 00", disp_off = 3, next_ip_off = 7, rva = 0x1423EA5, target_rva = 0x21F6350 }

# the controlled-player manager [g_ctrlChara 0x21F6948] (+0x60 + team x 4 = the handle the user controls)
[[VRFW.Global]]
name = "sp_ctrl"
rip = { pattern = "48 8B 05 ?? ?? ?? ?? 48 85 C0 0F 84 ?? ?? ?? ?? F6 40 79 01", disp_off = 3, next_ip_off = 7, rva = 0x1570169, target_rva = 0x21F6948 }

# The match info block [[g_gameRoot]+0x6A58] (+0x1C the half length, +0x2BFB the half, +0x2C29 the user's team)
[[VRFW.Global]]
name = "sp_match"
base = "game_root"
chain = ["ROOT_MATCH"]

[[VRFW.Struct]]
name = "SpActor"
size = 0x570
fields = { hdl = { at = 0x94, type = "u32" }, team = { at = 0xD0, type = "u8" }, pend_skill = { at = 0x188, type = "u32" }, pend_skill2 = { at = 0x18C, type = "u32" }, pend_kind = { at = 0x190, type = "u8" }, pend_cost = { at = 0x198, type = "i32" }, pend_flags = { at = 0x1A0, type = "u32" }, pend_armed = { at = 0x1A8, type = "u8" }, summon_skill = { at = 0x358, type = "u32" }, summon_full = { at = 0x360, type = "f32" }, summon_left = { at = 0x370, type = "f32" }, summon_state = { at = 0x374, type = "u8" }, meta_skill = { at = 0x380, type = "u32" }, meta_full = { at = 0x388, type = "f32" }, meta_left = { at = 0x39C, type = "f32" }, meta_state = { at = 0x3A0, type = "u8" }, in_play = { at = 0x497, type = "u8" } }

[[VRFW.Struct]]
name = "SpUnit"
size = 0x380
fields = { fisico = { at = 0x0C, type = "u16" }, member = { at = 0x28, type = "ptr" }, attr = { at = 0x2B4, type = "u8" }, chara = { at = 0x370, type = "u32" }, param = { at = 0x374, type = "u32" } }

# [[g_gameRoot] + Game.RootCharaContainers]: the character containers (container of kind k = [this + 8 + k * 8])
[[VRFW.Global]]
name = "stamina_character_containers"
base = "game_root"
chain = ["Game.RootCharaContainers"]

# ------------------------------------------------------------------------------------------------ the cost check

# bool AuraCostCheck(req{u32 hdl, u8 slot, u8 flag}) 0x16710F0: the engine's «the gauge / the tension covers this slot».
[[VRFW.Hook]]
name = "Ap_StaminaCostCheck"
game = "Stamina.AuraCostCheck"
kind = "function"
order = 4

[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }]
value = "lookup(CharacterReforged.PointsStaminaAura:waived, [unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32) * lookup(CharacterReforged.PointsStaminaTeam:cost, [actor([args[1]]:u32) + 0xD0]:u8)"

# ------------------------------------------------------------------------------------------------ the start pay

[[VRFW.Hook]]
name = "Ap_StaminaPendingPay"
game = "Duel.ProcessPending"
kind = "function"
order = 15

# ------------------------------------------------------------------------------------------------ match retry

# MatchRetryReset 0x16CAF50: every battery-out bit is cleared first (scripts\stamina.lua).
[[VRFW.Hook]]
name = "Ap_StaminaMatchRetry"
kind = "function"
pattern = "48 8B C4 55 48 8D 68 A1 48 81 EC A0 00 00 00 48 89 58 18"
rva = 0x16CAF50
steal = 19
arguments = ["ptr"]

# ------------------------------------------------------------------------------------------------ HUD commands

[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_POINTS_STAMINA"
handler = "CharacterReforged.PointsStamina"

[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_POINTS_STAMINA_MAX"
handler = "CharacterReforged.PointsStaminaMax"

# CMND_CHARACTERREFORGED_POINTS_HUD_HIDDEN_LAYERS() -> ok, layer hash...
[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_POINTS_HUD_HIDDEN_LAYERS"
handler = "CharacterReforged.PointsHudHiddenLayers"

[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_POINTS_HYPER_GAIN_OFF"
handler = "CharacterReforged.PointsHyperGainOff"

[[VRFW.Patch]]
name = "Ap_HyperGainSkill"
kind = "stub"
pattern = "0F B6 41 01 3C ?? 0F 83 ?? ?? ?? ?? 48 8D 0D ?? ?? ?? ?? 0F 57 ?? F3 0F 10 ?? 81 0F 2F ?? ?? ?? ?? ?? ?? ??"
rva = 0x16FCF0D
offset = 0x1E
expect = "0F 86 ?? ?? ?? ??"
code = "E9 ?? ?? ?? ??"
refs = [{ at = 1, branch = 0x1E }]
tail = false
apply = "script"

[[VRFW.Patch]]
name = "Ap_HyperGainScriptA"
pattern = "?? 53 48 83 EC 30 83 7A 08 01 48 8B D9 0F B7 42"
rva = 0x16FBEE0
expect = "40"
bytes = "C3"
apply = "script"

[[VRFW.Patch]]
name = "Ap_HyperGainScriptB"
pattern = "?? 53 48 83 EC 30 41 83 78 08 01 48 8B DA 41 0F"
rva = 0x16FBF90
expect = "40"
bytes = "C3"
apply = "script"

# The module bit the mods' Lua reads (CMND_VRFW_LOADER_VERSION): 8 = «stamina» while the PE commands are on.
[[VRFW.ModuleMask]]
bit = 8
needs = ["CMND_CHARACTERREFORGED_POINTS_STAMINA", "CMND_CHARACTERREFORGED_POINTS_STAMINA_MAX"]
