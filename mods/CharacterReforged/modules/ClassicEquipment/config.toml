# New sets: a group of classic items that only exists together (one motif, two equip slots). Bonus as Better
# Equipment's two-slot sets (Youth, Prism, Nimbus, Exotic): one tier at 2 pieces, two stats at 0.0571 of S (+4 / +4 at
# S = 70), the stats its members raise. `members` = 3DS item ids, `retail` = retail members (an item may be in
# several sets). Names: text\keys.toml (set_<name in lower case>).
