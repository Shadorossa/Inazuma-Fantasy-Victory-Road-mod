# () -> chara_base, card, handle of the save's avatar, 0 when unknown.
[[VRFW.Command]]
name = "CMND_VRFW_MENU_SCENE_AVATAR"
handler = "MenuScene.Avatar"

[[VRFW.Command]]
name = "CMND_VRFW_MENU_SCENE_STATE"
handler = "MenuScene.State"

# (state, arg) -> 1 | 0, state.
[[VRFW.Command]]
name = "CMND_VRFW_MENU_SCENE_SET"
handler = "MenuScene.Set"

# (action) -> 1: an action that ends in a menu opened after the leave's reset waits for it (chronicle_map); "" = none.
[[VRFW.Command]]
name = "CMND_VRFW_MENU_SCENE_PENDING"
handler = "MenuScene.Pending"

[[VRFW.Command]]
name = "CMND_VRFW_MENU_SCENE_TAKE"
handler = "MenuScene.Take"

[[VRFW.Command]]
name = "CMND_VRFW_MENU_SCENE_RETURN"
handler = "MenuScene.Return"

# (camera name, on) -> 1 | 0: another engine camera (e.g. "MenuCamera") takes the running shot's pose too while on.
[[VRFW.Command]]
name = "CMND_VRFW_MENU_SCENE_FOLLOW_CAMERA"
handler = "MenuScene.FollowCamera"

[[VRFW.Command]]
name = "CMND_VRFW_MENU_SCENE_REFRAME"
handler = "MenuScene.Reframe"

[[VRFW.Command]]
name = "CMND_VRFW_MENU_SCENE_SHOT_POSE"
handler = "MenuScene.ShotPose"

[[VRFW.Command]]
name = "CMND_VRFW_MENU_SCENE_NPC_READ"
handler = "MenuScene.NpcRead"

# (why) -> text: a probe of the NPC manager's live entries, logged (VRFW.map_npcs.entries).
[[VRFW.Command]]
name = "CMND_VRFW_MENU_SCENE_NPC_ENTRIES"
handler = "MenuScene.NpcEntries"

[[VRFW.Command]]
name = "CMND_VRFW_MENU_SCENE_ACTORS"
handler = "MenuScene.Actors"

[[VRFW.Command]]
name = "CMND_VRFW_MENU_SCENE_COME_BACK"
handler = "MenuScene.ComeBack"

# (key, text | nil) -> text (see above)
[[VRFW.Command]]
name = "CMND_VRFW_MENU_SCENE_ACTOR_HANDLES"
handler = "MenuScene.ActorHandles"

# (handle, motion set) -> true | false, why: the set's NPC pack loaded onto a scene character (VRFW.map_npcs).
[[VRFW.Command]]
name = "CMND_VRFW_SCN_CHARA_FACE_HOLD"
handler = "MenuScene.CharaFaceHold"

# (handle, on, r, g, b, a, pixel) -> text | nil, why (see above)
[[VRFW.Command]]
name = "CMND_VRFW_SCN_CHARA_EDGE"
handler = "MenuScene.CharaEdge"

# (handle, motion set) -> true | false, why (see above)
[[VRFW.Command]]
name = "CMND_VRFW_SCN_CHARA_MOTION_PACK"
handler = "MenuScene.CharaMotionPack"

# (handle, why) -> text | false, why: a read-only probe of a scene character's face (VRFW.map_npcs.face_probe).
[[VRFW.Command]]
name = "CMND_VRFW_SCN_CHARA_FACE_PROBE"
handler = "MenuScene.CharaFaceProbe"

# (handle) -> lip motion | false, why: the facial component's default face again (VRFW.map_npcs.facial_default).
[[VRFW.Command]]
name = "CMND_VRFW_SCN_CHARA_FACIAL_DEFAULT"
handler = "MenuScene.CharaFacialDefault"
