schema = "VRFW.item/2"
default_lang = "en"

[[edit]]
target = "tk_bb000001"
max_stack = 999999
  [edit.text.es]
  name = "Puntos de pasión"
  [edit.text.en]
  name = "Passion Points"
  [edit.text.fr]
  name = "Points de passion"
  [edit.text.de]
  name = "Leidenschaftspunkte"
  [edit.text.it]
  name = "Punti passione"
  [edit.text.pt]
  name = "Pontos de paixão"
  [edit.text.ja]
  name = "情熱ポイント"
  [edit.text.zh_hans]
  name = "热情点数"
  [edit.text.zh_hant]
  name = "熱情點數"

# Goal drops are paid at the end of the match: win = the sum of the rolls, draw = one roll, loss = nothing.
[VRFW.EndOfMatchRewards]
HeldDrops = ["tk_bb000001"]

# An in-match drop of a retail shop currency gives Puntos de amistad instead (same count and weight).
[[VRFW.DropFilter]]
Exclude = "shop_currencies"
Keep = [
    "tk_hr000008",                                # Puntos de amistad
    "tk_bb000001",
]
ReplaceWith = "tk_hr000008"

[[VRFW.DropFilter]]
Sources = ["chests"]
Exclude = "shop_currencies"
Keep = [
    "tk_hr000008",                                # Puntos de amistad
    "tk_bb000001",
    "tk_si000001", "tk_si000002", "tk_si000003", "tk_si000004", "tk_si000005", "tk_si000006", "tk_si000007",
]
Fallback = "tk_hr000008"                    # Puntos de amistad

[[VRFW.MatchDropRemove]]
Items = ["tk_hr000009"]
AllSources = true

[[VRFW.MatchDropExtra]]
Item = "tk_bb000001"
Win = 2
Draw = 1
Loss = 0
PerGoal = 0
PerGoalMargin = 1                           # a win by 3 goals: +3
MarginMax = 5                               # no more than +5 (no farming of weak rivals)
Config = "match_drops.passion"
  [VRFW.MatchDropExtra.Difficulty]          # the multiplier by the played difficulty (declared Ids)
  Cronica = 1.0
  RouteOpen = 1.25
  RareItems = 1.5
  Heroica = 1.75
  HeroicaPlus = 2.0
  Legendaria = 2.5
  Class1 = 1.0                              # free match Lv 50
  Class2 = 1.5                              # Lv 99
  Class3 = 2.0
  Class4 = 2.5                              # Lv 200

[VRFW.DropList]
First = ["tk_bb000001"]
Hide = ["tk_hr000008"]                      # Puntos de amistad
