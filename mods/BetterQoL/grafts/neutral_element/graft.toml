# BetterQoL: neutral element sprites for element 0 / 5 characters and element 5 skills in the element icon mappers.
name = "neutral_element"
mod = "BetterQoL"
order = 300
module = "lua_patch"
requires = []
conflicts = []
wraps = ["GetElementIconTextureName", "GetCharaElementIconName", "GetElementIcon"]
description = "BetterQoL: neutral element icon for element 0 / 5 characters and element 5 skills"

# card / plate / list drawers
[[files]]
stem = "soccer_common"

  [[files.ops]]
  type = "bytecode_child"
  source = "ne_soccer_common.lua"
  marker = "neutral_element"
  crc = "braces"

# shop / office / bank lists: retail GetElementIconTexture returns nil for 0 / 5 (stale icon in reused rows)
[[files]]
stem = "shop_inc"

  [[files.ops]]
  type = "bytecode_child"
  source = "ne_shop_inc.lua"
  marker = "neutral_element shop"
  crc = "braces"

# match command menus
[[files]]
stem = "soccer_command_battle_menu_inc"

  [[files.ops]]
  type = "bytecode_child"
  source = "ne_command_battle_inc.lua"
  marker = "neutral_element command"
  crc = "braces"

[[files]]
stem = "chara_pack_probability_list_menu"

  [[files.ops]]
  type = "append_block"
  source = "ne_param_icon_name.lua"
  marker = "neutral_element"

[[files]]
stem = "players_universe_menu"

  [[files.ops]]
  type = "append_block"
  source = "ne_param_icon_name.lua"
  marker = "neutral_element"

[[files]]
stem = "soccer_battle_setting_flow_formation_menu"

  [[files.ops]]
  type = "append_block"
  source = "ne_flow_formation.lua"
  marker = "neutral_element"

[[files]]
stem = "item_use_menu"

  [[files.ops]]
  type = "append_block"
  source = "ne_item_use.lua"
  marker = "neutral_element"

# club join card: retail draws icon_cmd_type05 (missing from icon_common) for element 0 / >4
[[files]]
stem = "join_club_menu"

  [[files.ops]]
  type = "replace"
  point = "join_club_menu.OnSetupLayer.NeutralElement"
  text = '''
    else
      n7 = (n6 == 0 or n6 == 5) and @crc:icon_cmd_type00@ or 3470924407
    end
'''
