# Declaration schema of CharacterReforged.skill_set/1 (content\skill_set): fields read from the records the mods ship. `vrfw check` validates the files with it and the ModManager draws their forms from it.
schema = "VRFW.decl_schema/1"
kind = "CharacterReforged.skill_set/1"
folder = "content/skill_set"
# v2 words, read beside the v1 ones until the switch: the type and its kind folder.
v2_type = "CharacterReforged.Skill.Set"
v2_kind_folder = "Skills/Sets"
label = "Skill set"
label_es = "Conjunto de habilidades"

[entry.SkillSet]
single = true
moves_refuse_auras = { type = "bool" }
aura_types = { type = "ints" }
mix_types = { type = "ints" }
mix_stat_types = { type = "ints" }
moveset_export = { type = "string" }

[entry.PlaceRule]
doc = "one placement rule: a command that answers whether a move may be placed in a slot"
name = { type = "name", required = true, doc = "the rule's name; a later mod's rule of the same name merges over it" }
command = { type = "string", required = true, doc = "the CMND_* command asked (charaHdl, slot, move) -> ok, reason" }
slot = { type = "string", default = "board", values = ["board", "set"], doc = "the slot number the command receives" }
off = { type = "bool", default = false, doc = "turns this rule off" }
