# (docs/framework/trophy.md). Native data (schema VRFW.game/1, docs/internal/native.md).
schema = "VRFW.game/1"

[[VRFW.Global]]
# [[g_gameRoot]+Game.RootMatch]: +0 the match's rule word (bit 24 = the tournament-final end), +0x2C29 the user's side
name = "trophy_match"
base = "game_root"
chain = ["Game.RootMatch"]

[[VRFW.Global]]
# [[g_gameRoot]+Game.RootParty]: the match setup's two teams at +0x1E0 (stride 0x4A8), +0 = the team id
name = "trophy_party"
base = "game_root"
chain = ["Game.RootParty"]
