schema = "VRFW.decl_schema/1"
kind = "VRFW.protected_attribute/1"
folder = "content/protected_attributes"
# v2 words, read beside the v1 ones until the switch: the type, its kind folder and its format version.
v2_type = "VRFW.Character.ProtectedAttribute"
v2_kind_folder = "Characters/ProtectedAttributes"
v2_version = 1
label = "Protected attributes"
label_es = "Atributos protegidos"
doc = "A bit of a saved player's attribute word that framework services never change."
doc_es = "Un bit de la palabra de atributos de un jugador guardado que los servicios del framework nunca cambian."

[entry.ProtectedAttribute]
doc = "a bit of a saved player record's attribute word that framework services never change on that record"
name = { type = "name", required = true, doc = "the bit's name (key <mod>.<name>)" }
bit = { type = "int", min = 1, max = 4294967295, required = true, doc = "the bit's value (one bit: 0x10000000)" }
