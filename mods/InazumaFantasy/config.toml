
[match_drops.passion]
win = 2
draw = 1
loss = 0
per_goal = 0
per_goal_margin = 1

# The mod serves its own title art (content/images/menu/50_title/title_art.toml), so the framework's stays off.
[VRFW.TitleArt]
own = true

[daily_legendary_rival]
salt = "InazumaFantasy.DailyLegendaryRival"
version = 1
min_players = 11
exclude = []
# the row's game (content/teams/free_match_section.toml Game), its class and its level (every rival player)
game = "inazuma_fantasy_daily_legendary_rival"
class = 9
level = 250
# days of beaten records kept in the save blob
keep_days = 60
# beating the day's rival pays `reward` of `reward_item` once per day (0 = none)
reward = 10
reward_item = "tk_bb000001"
chronicle_prefix = "fbtl_cro"

# The level orbs (scripts/level_orbs.lua): levels one orb gives, up to the player's cap.
[level_orbs.levels]
ex0001 = 1                                 # small
ex0002 = 5                                 # medium
ex0003 = 10                                # large
