page3_title_any = "Conjunto {set} ({count})"
mod_name = "Mejor equipamiento"
mod_description = "Todo el equipamiento vale lo mismo: sus bonos, contando también lo que baja, suman siempre el mayor bono del equipamiento del juego (40 en el juego base, más si un mod añade objetos más fuertes): unos suben una estadística, otros dos o tres, y los objetos con una pasiva fuerte bajan una, así que se distinguen por su forma, no por su potencia. Un jugador cuya posición o elemento coincide con el objeto recibe +15 % de sus subidas (+25 % con ambos). 67 conjuntos dan estadísticas y efectos con 2 a 4 piezas puestas (un objeto puede estar en varios; cada pieza cuenta para uno). Los objetos temáticos o con nombre tienen una pasiva: +5 % de potencia a su familia de supertécnicas, a las de su elemento, coste de tensión, recarga, velocidad, tensión por duelo, parada o gol, estadísticas yendo por detrás o por delante. Necesita Character Reforged; una pasiva que nombra una familia de supertécnicas solo funciona con el mod que declara esa familia activo."
# los conjuntos ([[VRFW.EquipmentSet]], content\items\equipment_sets.toml)
