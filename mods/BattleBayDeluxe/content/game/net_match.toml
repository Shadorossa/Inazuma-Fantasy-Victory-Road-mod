# The «Sala privada» match as native data (schema VRFW.game/1, docs/internal/native.md).
schema = "VRFW.game/1"

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_NET_PICK_ARM"
handler = "BattleBayDeluxe.NetPickArm"

[[VRFW.Command]]
# -> the team hash the armed pick took (0 = none yet)
name = "CMND_BATTLEBAYDELUXE_NET_PICKED"
handler = "BattleBayDeluxe.NetPicked"

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_NET_PREPARE"
handler = "BattleBayDeluxe.NetPrepare"
needs = ["session"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_NET_RESTORE"
handler = "BattleBayDeluxe.NetRestore"
needs = ["session"]

[[VRFW.Command]]
# team -> leader chara, crest, level of the room screen's team frame
name = "CMND_BATTLEBAYDELUXE_NET_TEAM"
handler = "BattleBayDeluxe.NetTeam"
needs = ["enjoy", "EnjoyTable", "EnjoyRow"]
