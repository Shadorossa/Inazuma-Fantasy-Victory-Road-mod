# Declaration schema of VRFW.table/1 (content\tables): fields read from the records the mods ship. `vrfw check` validates the files with it and the ModManager draws their forms from it.
schema = "VRFW.decl_schema/1"
kind = "VRFW.table/1"
folder = "content/tables"
# v2 words, read beside the v1 ones until the switch: the type, its kind folder and its format version.
v2_type = "VRFW.Game.TableEdit"
v2_kind_folder = "Game/TableEdits"
v2_version = 1
label = "Game table edits"
label_es = "Ediciones de tablas del juego"
doc = "Adds, sets or deletes rows of a game table."
doc_es = "Añade, cambia o borra filas de una tabla del juego."

[entry.Add]
entry_table = "add"
key = { type = "any", required = true }
from = { type = "any", required = true }
cells = { type = "table", required = true }

[entry.Delete]
entry_table = "delete"
key = { type = "int", required = true }

[entry.Set]
entry_table = "set"
key = { type = "string" }
cells = { type = "table" }

[entry.File]
file_root = true
list = { type = "string" }
table = { type = "string" }
key_columns = { type = "strings" }
