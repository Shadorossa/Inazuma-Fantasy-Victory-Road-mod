# Character Reforged: the own passive card's element bands (research/grafts/plate_pages parts/passives.lua
# EVT_PPG.PassiveCardFill swaps evt_cr_card_band<element> into the card window's band, element 1 wind .. 4 mountain,
# 0 any other). Made at the first start (and after a game update) from the PLAYER'S own game files by the image type's
# recipes: the retail gate bands of team00_25 (844 x 80) without their rounded
# ends, cut to the card's slanted band by the mod's own mask (evt_cr_card/band_mask.png); never a Level-5 pixel in
# the mod.
schema = "VRFW.image/1"

[[texture]]
atlas = "#/menu/102_team/team11/evt_cr_card/evt_cr_card.g4tx"
name = "evt_cr_card"
size = [756, 300]

[[recipe]]
name = "mask"
png = "evt_cr_card/band_mask.png"

# neutral (no element or void): the grey patterned band
[[recipe]]
name = "band0"
game = "#/menu/102_team/team00/team00_25/team00_25.g4tx"
sprite = "gate_base07"
ops = [{ op = "crop", box = [10, 6, 834, 74] }, { op = "resize", size = [756, 60] }, { op = "alpha_from", image = "mask" }]

[[sprite]]
atlas = "#/menu/102_team/team11/evt_cr_card/evt_cr_card.g4tx"
