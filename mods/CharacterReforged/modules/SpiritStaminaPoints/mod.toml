id = "SpiritStaminaPoints"
former_ids = ["AuraPoints"]
key_id = "SpiritStaminaPoints"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "Spirit & Stamina Points"
version = "0.2.4"
author = "Fantasy Team"
author_steam = "76561199013321372"
description = "Keshin, keshin armours and totems run on points instead of time, as in Chrono Stone and Galaxy. Summoning is free and unlimited; the spirit's special move costs its fighting-spirit points (PEG, or SP for totems) instead of tension, an armour drains them while worn, and an empty pool sends the spirit away. Every player also has a stamina bar (GP): running and dashing spend it, Physical makes it last, half-time gives some back, and an exhausted player slows down. Each part can be switched off in settings."
priority = 0
tags = ["Gameplay"]
updated = "2026-11-05"
# the sprint bar always fills to its own max (sprint.toml, no cap_by), whatever PE is left;
# dashing still spends PE and the «exhausted» state still stops the dash
# the sprint bar never above the PE share (sprint.toml cap_by = SpiritStaminaPoints.pe, VRFW 2.10.0):
# it refills only up to the PE fill and drops with it
# the sprint strip drawn in front of the PE fill over the whole bar (full = the bar's width,
# from its left end); empty = «winded», a 5 s cooldown (state min_seconds, VRFW 2.9.0) shown dimmed while it refills
# the sprint bar drawn as a translucent yellow segment from the end of the PE fill (the frame quad,
# not the masked fill: the 1.2.0 strip never showed)
# the sprint bar inside the PE bar (features\pe\content\match_resources\sprint.toml: empty =
# no dash until 30 %), the PE dash drain x0.70, half-time 30 % / extra time 25 %
# one rule «nothing pays with the hyper gauge» (SpiritStaminaPoints.HyperUnused in
# features\pe\scripts\stamina.lua: PE, PEG and SP on, every aura covered) hides the gauge and turns its gains off at the
# source (three script patches: no gain, no «+N»; CMND_SPIRITSTAMINAPOINTS_HYPER_GAIN_OFF); mode change, kizuna trans and
# awakening power start free and without the gauge check while it holds; the rival always plays by the same point
# systems ([points] cpu and [pe] cpu removed)
# This mod's own names (TOML keys [SpiritStaminaPoints.X], Lua SpiritStaminaPoints.X, commands CMND_SPIRITSTAMINAPOINTS_*, tables SpiritStaminaPoints.*;
# game Lua SpiritStaminaPoints_Hud / SpiritStaminaPoints_Stamina); never VRFW.
prefix = "SpiritStaminaPoints"
folder = "SpiritStaminaPoints"
# The keshin PEG / totem SP pools, their costs and the HUD bar; the match PE is its part «pe». Standard mod layout:
#   options.toml                        the rows «peg», «sp», «pe»: which point systems run (restart = true)
#   config.toml                         [points]: the pool rules (cost model, armour drain / refill, which moves pay,
#                                       CPU); [pe], [pe.trait.*], [tired_motion], [hud_hidden_layers]: the PE rules
#   content\match_resources\            peg.toml / sp.toml: the pools per keshin / totem (generated from the wiki
#                                       export by research/scripts/peg_table_build.py / soul_table_build.py)
#   content\game\aura_points.toml       the cost points' providers (cost check, start pay, tension pay), structs, commands
#   content\menus\peg_bar.toml          the HUD bar's layers; content\images\…\btl06_13\aura_points_bars.toml its sprites
#   scripts\aura_points.lua (+ lib\)    the run time; graft research/grafts/aura_points_hud: the HUD bar
#   content\menus\buff_row.toml         the buff row's aura entries: one per player on the pitch (the row shows up to the
#                                       framework's team aura limit, graft aura_points_buff_bar)
#   content\menus\buff_bar.toml         the layer of the PEG / SP bars on the buff row's keshin / armour / totem
#                                       entries (graft research/grafts/aura_points_buff_bar: in place of the stopwatch)
#   content\menus\buff_digits.toml      the «current / max» glyph layer under every bar and the totem level label layer
#                                       (GENERATED by research/scripts/aura_points_buff_num_build.py, with the glyph
#                                       sprites content\images\...\btl06_13\aura_points_buff_num.toml; same graft)
#   content\extra_slots\skill_set_points.toml   the pool rules on Character Reforged's RB plates (start by the pool,
#                                       never by the hyper gauge; empty pool = refused; the spirit move's PEG / SP cost)
#   features\pe\                        the match PE: an option feature (evt_modfmt::layout::feature_switch), read only
#                                       while the option row «pe» is on; off = no PE (retail)
#     content\match_resources\pe.toml   the PE: drains, Físico, half-time, «exhausted» (resource SpiritStaminaPoints.pe, alias
#                                       stamina_points.pe); pe_max.toml the max PE of every character (generated by
#                                       research/scripts/pe_per_player_build.py)
#     content\params\pe_no_dash_gauge.toml  no team dash fuel (PE is the only limit of a dash)
#     content\resource_rules\off_pitch.toml the battery out's «off the pitch without a red card» (Resource.OffPitch)
#     content\rules\field_clips\        the tired locomotion (CS clips in assets\anims\field_clips\) and the battery
#                                       out's held kneel
#     content\game\stamina.toml         the PE's cost-point providers (cost check, start pay), structs, commands
#     content\extra_slots\skill_set_pe.toml the miximax start at any hyper gauge on Character Reforged's RB plates
#     content\menus\pe_bar.toml + content\images\…\btl06_13\stamina_points_bars.toml   the HUD bar's layers / sprites
#                                       (graft research/grafts/aura_points_stamina_hud)
#     content\menus\pe_plate.toml + pe_plate_header.toml + content\images\…\btl06_13\stamina_points_pe_num.toml
#                                       the max PE in the player header: a piece of Character Reforged's header slot
#                                       (entry «pe» of the host CharacterReforged.header), drawn by
#                                       assets\lua\_all\aura_points_stamina_plate.lua
#     scripts\stamina.lua (+ lib\stamina\)  the PE's run time
#   graft research/grafts/aura_points_hyper_gauge + config [hud_hidden_layers]: with PE and the PEG or SP points on, the
#                                       retail hyper gauge hidden (CMND_SPIRITSTAMINAPOINTS_HUD_HIDDEN_LAYERS)
# VRFW 2.4.174: merged mods ([[merged]], 2.4.172), option features (features\<x>\ switched by an option row)
# and match resource aliases. CharacterReforged 1.5.0: the shared base of the character / aura mods
#  and its player header slot (the max PE).
# VRFW 2.10.0: the match resource keys state min_seconds (the sprint bar's cooldown) and cap_by (sprint <= PE).
requires = ["VRFW>=0.2.4", "CharacterReforged>=0.2.4"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
permissions = ["memory", "call", "command", "hook", "patch"]

# The mod Stamina Points (stamina_points 1.2.3) is this mod's part «pe»:
# `requires` / `if_mod` on stamina_points follow the part, an old installed stamina_points folder is replaced, the
# ModLoader's boot turns `stamina_points` into `SpiritStaminaPoints` in enabled.toml / load_order.toml / family_state.toml and
# starts the option «pe» as the old mod was. Its content is the option feature features\pe\. Its old names keep
# working: the resource stamina_points.pe (alias), the commands CMND_STAMINAPOINTS_* (aliases), the rule flags
# stamina_points.cost_pct / armour_free (read too) and its ids (`[[alias]]` of
# features\pe\content\rules\field_clips\tired.toml).
[[merged]]
id = "stamina_points"
version = "1.2.3"
option = "pe"

# Other mods read the pools and the PE through the framework (VRFW.resource.* on SpiritStaminaPoints.peg / SpiritStaminaPoints.sp /
# SpiritStaminaPoints.pe, the answers' resource()), the tables below in their native answers / extra slot rules
# (`SpiritStaminaPoints/SpiritStaminaPoints.Pair`…), the commands CMND_SPIRITSTAMINAPOINTS_PEG / _PEG_INFO / _STAMINA / _STAMINA_MAX /
# _ACTIVE_PARTS from their game Lua, add their PE drain factors (VRFW.resource.set_mult) and half-time bonuses
# (resource:SpiritStaminaPoints.pe:half_time), and give their inputs as rule flags (SpiritStaminaPoints.free_peg / free_sp /
# cost_pct.<hdl> / exempt.<hdl> / armour_free.<hdl> / sp_start.<aura id>: scripts\aura_points.lua,
# features\pe\scripts\stamina.lua). Resource.OffPitch: the battery-out players for the framework's OffPitch rule.
[exports]
functions = []
keys = []
tables = ["SpiritStaminaPoints.Aura", "SpiritStaminaPoints.Player", "SpiritStaminaPoints.Pair", "SpiritStaminaPoints.Team", "SpiritStaminaPoints.StaminaAura", "SpiritStaminaPoints.StaminaPlayer", "SpiritStaminaPoints.StaminaTeam", "Resource.OffPitch"]
# the PE HUD graft keeps the EVT_PE_* globals of Inazuma Fantasy's stamina_hud (the PEG / SP bar sits under it by them)
# game_lua: SpiritStaminaPoints_Stamina = the player header's PE piece, its table Plate and function PlatePe
# (assets\lua\_all\aura_points_stamina_plate.lua)
game_lua = ["SpiritStaminaPoints_Hud", "SpiritStaminaPoints_Stamina"]

# A MODULE of Character Reforged: the Mods screen, the
# ModManager and `vrfw list` show it inside Character Reforged's entry («Módulos y ajustes»: on / off) instead of as a mod
# of its own; switching Character Reforged off switches it off too. Its name there: its mod_name (text\keys.toml).
[module]
of = "CharacterReforged"
order = 40
