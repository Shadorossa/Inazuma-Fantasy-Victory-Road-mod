# Texts of Skill Duel, a module of Football Reforged: the name and description of its card
# on Football Reforged's page in Mods.
schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Skill Duel"
mod_description = "Focus duels are won by reading the side, not by the stats. If the attacker runs into the defender (his body, arm or hand), the defender wins; go past the hand and the attacker wins. The stats set the defender's reach and hand size. Both teams, the CPU too. Special move against special move keeps its power duel."

[es.new]
mod_name = "Duelo de habilidad"
mod_description = "Los duelos de enfoque se ganan leyendo el lado, no con las estadísticas. Si el atacante choca con el defensa (su cuerpo, brazo o mano), gana el defensa; si pasa más allá de la mano, gana el atacante. Las estadísticas deciden el alcance y el tamaño de las manos del defensa. Para los dos equipos, también la CPU. Supertécnica contra supertécnica sigue siendo un duelo de poder."

[fr.new]
mod_name = "Duel d'adresse"
mod_description = "Les duels de concentration se gagnent en lisant le côté, pas avec les statistiques. Si l'attaquant percute le défenseur (son corps, son bras ou sa main), le défenseur gagne ; s'il passe au-delà de la main, l'attaquant gagne. Les statistiques fixent la portée et la taille des mains du défenseur. Pour les deux équipes, le CPU aussi. Technique spéciale contre technique spéciale reste un duel de puissance."

[de.new]
mod_name = "Geschicklichkeitsduell"
mod_description = "Fokusduelle gewinnt man, indem man die Seite liest, nicht mit den Werten. Läuft der Angreifer in den Verteidiger (Körper, Arm oder Hand), gewinnt der Verteidiger; kommt er an der Hand vorbei, gewinnt der Angreifer. Die Werte bestimmen Reichweite und Handgröße des Verteidigers. Für beide Teams, auch für die CPU. Spezialtechnik gegen Spezialtechnik bleibt ein Stärkeduell."

[it.new]
mod_name = "Duello di abilità"
mod_description = "I duelli di concentrazione si vincono leggendo il lato, non con le statistiche. Se l'attaccante va addosso al difensore (corpo, braccio o mano), vince il difensore; se passa oltre la mano, vince l'attaccante. Le statistiche decidono la portata e la dimensione delle mani del difensore. Per entrambe le squadre, anche la CPU. Supertecnica contro supertecnica resta un duello di potenza."

[pt.new]
mod_name = "Duelo de habilidade"
mod_description = "Os duelos de foco ganham-se lendo o lado, não com as estatísticas. Se o atacante chocar com o defesa (corpo, braço ou mão), ganha o defesa; se passar além da mão, ganha o atacante. As estatísticas definem o alcance e o tamanho das mãos do defesa. Para as duas equipas, também o CPU. Supertécnica contra supertécnica continua a ser um duelo de poder."

[ja.new]
mod_name = "テクニック勝負"
mod_description = "フォーカスバトルはステータスではなく、サイドを読んで勝つ。攻撃側がディフェンダー（体・腕・手）にぶつかればディフェンダーの勝ち、手の先を抜ければ攻撃側の勝ち。ステータスはディフェンダーのリーチと手の大きさを決める。両チーム、CPUも対象。必殺技同士はパワー勝負のまま。"

[zh_hans.new]
mod_name = "技巧对决"
mod_description = "专注对决靠读对方向取胜，而不是靠数值。进攻方撞上防守方（身体、手臂或手），防守方获胜；越过手的范围，进攻方获胜。数值决定防守方的覆盖范围和手的大小。双方队伍都适用，包括电脑。必杀技对必杀技仍是力量对决。"

[zh_hant.new]
mod_name = "技巧對決"
mod_description = "專注對決靠讀對方向取勝，而不是靠數值。進攻方撞上防守方（身體、手臂或手），防守方獲勝；越過手的範圍，進攻方獲勝。數值決定防守方的覆蓋範圍和手的大小。雙方隊伍都適用，包括電腦。必殺技對必殺技仍是力量對決。"
