schema = "VRFW.game/2"

# The handler gets ev.regs.rax (the match info).

# Match info fields the decision reads.
[[VRFW.Struct]]
name = "MatchInfo"
size = 0x58
fields = { flags = { at = 0x00, type = "u32" }, match_type = { at = 0x16, type = "u8" }, observer = { at = 0x54, type = "u8" } }

[[VRFW.Hook]]
name = "PrematchEditor"
game = "Menu.PrematchEditor"
kind = "mid"
needs = ["Net.IsSession", "MatchInfo"]

# config.toml skip_prematch_editor = false (developer kill switch): the handler answers nothing (retail editor).
