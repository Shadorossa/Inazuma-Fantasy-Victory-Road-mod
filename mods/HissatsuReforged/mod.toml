id = "HissatsuReforged"
name = "Hissatsu Reforged"
prefix = "HissatsuReforged"
folder = "HissatsuReforged"
version = "0.3.0"
author = "Fantasy Team"
description = "Rebalances 683 special moves with new power, tension cost and recast time. Moves with two properties show both icons in every list, and special moves can now land critical hits. Each move also levels up with the times a player uses it in matches, and a banner says when it levels up. The last level needs the Ultimate Evolution Manual from the general shop, and a player can no longer carry the same special move twice."
priority = 0
tags = ["Gameplay", "Techniques"]
updated = "2026-11-09"
requires = ["VRFW>=0.3.0"]
optional = ["BetterQoL", "CharacterReforged", "InazumaFantasy"]
conflicts = []
permissions = ["command", "state", "memory", "call", "hook"]
loader_modules = ["lua_patch", "lua_bridge"]
loader_min = "1.7.0"

# What other mods call: CanPlace(hdl, slot, item) -> ok, reason   may item go on board slot `slot` (0..8) of card `hdl`?
[exports]
functions = ["CanPlace", "Uses", "Grade", "Items", "StoreBlob", "StoreBlobWrite"]
# [HissatsuReforged.Rules] in any mod's content\hissatsu_level_up\*.toml (schema HissatsuReforged.rules/1)
keys = ["Rules"]
game_lua = ["HissatsuReforged.skill_table_rank_item"]

[layout]
script_folders = ["skill_set", "hissatsu_level_up", "universe_prizes"]
