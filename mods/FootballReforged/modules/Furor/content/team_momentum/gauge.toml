# Furor › how each team's furor gauge fills and is spent ( the VRFW team momentum service).
schema = "VRFW.team_momentum/1"

[[VRFW.TeamMomentum]]
name = "gauge"                            # key Furor.gauge
resource = "Furor.gauge"                  # content\match_resources\gauge.toml (0..100)
fill_per_s = 0.30
behind_per_s = 0.30
levels = 2                                # flags .level1 at 50 %, .level2 at 100 %
start_at = 1.0                            # the phase can start when the gauge is full
phase_seconds = 24
gains_in_phase = false
drain_only_in_play = true
button = "CMD_FUROR_PHASE"                # synced matches: each team's own L3 (offline the HUD's button read starts it)

# small gains from actions (to = actor: the actor's team; goal: the team that scored)
[[VRFW.MomentumGain]]
momentum = "gauge"
on = "match:goal"
to = "other"                              # the team that conceded (Strikers' comeback spirit)
amount = 8

[[VRFW.MomentumGain]]
momentum = "gauge"
on = "match:goal"
to = "actor"
amount = 3

[[VRFW.MomentumGain]]
momentum = "gauge"
on = "match:keeper_save"
amount = 4

[[VRFW.MomentumGain]]
momentum = "gauge"
on = "match:duel_won"
amount = 1.5

[[VRFW.MomentumGain]]
momentum = "gauge"
on = "match:block_won"
amount = 1

[[VRFW.MomentumGain]]
momentum = "gauge"
on = "match:hissatsu_result:won"
amount = 2
