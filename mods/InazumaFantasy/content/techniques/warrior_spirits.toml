schema = "VRFW.technique/3"
# Four warrior spirits on the game's unused keshin models. Cloned from wks02010 (summon event ev80_00020); no owner; k002011 keeps the move of wks02010 (whs10200).

[[aura_command]]
key = "wks_fantasy_k002011"
from = "wks02010"
manual = true
cells = { name_text = 0xEC078783, desc_text = 0xB99155D1, aura_chara = 0x584CAA78, order = 107 }
charas = []

# This warrior spirit is off for this version, and removing the comment marks brings it back.
# ```
# [[aura_command]]
