# The first-start window (crates/vrfw-loader/src/boot_splash): shown while the early phase really builds.

threshold_ms = 1500
default_weight = 100
default_word = "data"
fallback_language = "en"

# Each type's typical first-start time in ms: the bar gives it that share.
