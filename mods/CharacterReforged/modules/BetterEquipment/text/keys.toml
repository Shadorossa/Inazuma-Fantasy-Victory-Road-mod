[fr.new]
page_name_stats = "Statistiques"
page_name_effect = "Effet"
page_name_set = "Ensemble"
page3_title_any = "Ensemble {set} ({count})"
mod_name = "Meilleur équipement"
mod_description = "Chaque équipement vaut autant que les autres : ses bonus, en comptant aussi ce qu'il baisse, totalisent toujours le plus gros bonus de l'équipement du jeu (40 dans le jeu de base, plus si un mod ajoute des objets plus forts) : certains augmentent une statistique, d'autres deux ou trois, et les objets à passif fort en baissent une, donc les objets se distinguent par leur profil, pas par leur puissance. Un joueur dont le poste ou l'élément correspond à l'objet reçoit +15 % de ses hausses (+25 % avec les deux). 67 ensembles donnent des statistiques et des effets pour 2 à 4 pièces portées (un objet peut appartenir à plusieurs ensembles ; une pièce portée compte pour un seul). Les objets thématiques et nommés ont une passive : +5 % de puissance pour leur famille de techniques spéciales, les techniques de leur élément, coût de tension, recharge, vitesse, tension par duel, arrêt ou but, statistiques en étant mené ou en menant. Nécessite Character Reforged ; une passive qui nomme une famille de techniques ne s'applique que si le mod qui déclare cette famille est actif."
