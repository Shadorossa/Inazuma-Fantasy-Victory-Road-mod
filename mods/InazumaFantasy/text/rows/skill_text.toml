# Names and descriptions of the four moves first shipped by a former mod (merged here) whose technique files pin the
# download's text ids (skillNameId / skillDescId). Spanish names = the download's (accent fixed: «Dispersíon»);
# descriptions written for the mod (the download had placeholders). Same texts as _names.toml. Line break: \n.
schema = "VRFW.text/2"

[[row]]
id = 0x6B5E606A  # whs90208 name
kind = "noun"
es = "Golpe del abismo"
en = "Abyss Strike"
fr = "Frappe abyssale"
de = "Abgrundschlag"
it = "Colpo dell'abisso"
pt = "Golpe do abismo"
ja = "アビスストライク"
zh_hans = "深渊之击"
zh_hant = "深淵之擊"

[[row]]
id = 0x3EC8B238  # whs90208 description
kind = "text"
es = "Tiro demoledor que carga el balón con la\nenergía del abismo y lo lanza desde el aire."
en = "A crushing shot that charges the ball with\nthe abyss's energy and fires it from the air."
fr = "Un tir dévastateur qui charge le ballon\nde l'énergie de l'abîme, lancé depuis les airs."
de = "Ein vernichtender Schuss, der den Ball mit der\nKraft des Abgrunds lädt und aus der Luft feuert."
it = "Un tiro devastante che carica il pallone con\nl'energia dell'abisso e lo scaglia dall'alto."
pt = "Remate demolidor que carrega a bola com a\nenergia do abismo e a lança desde o ar."
ja = "深淵のエネルギーをボールに込め\n空中から放つ破壊的なシュート！"
zh_hans = "将深渊之力注入球中，\n从空中轰出的毁灭射门。"
zh_hant = "將深淵之力注入球中，\n從空中轟出的毀滅射門。"

