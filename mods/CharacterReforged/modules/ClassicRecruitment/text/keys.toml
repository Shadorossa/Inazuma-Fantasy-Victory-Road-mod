schema = "VRFW.text_key/1"
# Classic Recruitment's texts: the Mods screen's name, description and option rows.
default_lang = "en"

[en.new]
mod_name = "Classic Recruitment"
mod_description = "One card per character, as in the classic games: players no longer drop as spirits, so you sign them in the Clubroom's Player album with Friendship Points earned in every match. Needs BetterQoL."
option_classic_recruitment = "Classic recruitment"
option_classic_recruitment_help = "Off: players are obtained the game's own way again. Spirits drop from matches, rewards and shops, duplicates are kept, the «Universo del jugador» gacha is open and the album signs no one. Your players and Friendship Points are kept. Applies after restarting the game."
option_players_universe = "«Universo del jugador» gacha"
option_players_universe_help = "On: the «Universo del jugador» gacha is open: its Chronicle menu row, the board's Tab shortcut and the hub map's point. Off: all three are gone. Applies at once; the hub map's point changes after restarting the game."
option_spirit_section = "Spirit section"
option_spirit_section_help = "On: spirits show everywhere: the «Espíritu» row of the Team Dock and the Chronicle team dock, the player spirit tabs of a match's reward list and the new spirit marks; spirits still do not drop, so the reward tabs are empty. A +1 copy of a character the club has can be obtained. Off: all of those places are hidden (the rows below move up) and duplicate players are off: a character the club has is not summoned or pulled again, and duplicates a save already holds stay. The spirit screen (summon, rarity-up and fusion of Ídolo and Diamante cards) has no other way in. Applies after restarting the game."

[es.new]
mod_name = "Fichajes clásicos"
mod_description = "Una carta por personaje, como en los juegos clásicos: los jugadores ya no caen como espíritus, así que se fichan en el Álbum de jugadores de la Caseta con los Puntos de Amistad que ganas en cada partido. Necesita BetterQoL."
option_classic_recruitment = "Fichajes clásicos"
option_classic_recruitment_help = "Desactivado: los jugadores se consiguen otra vez como en el juego original. Los espíritus caen en partidos, recompensas y tiendas, los repetidos se conservan, el gacha «Universo del jugador» queda abierto y el álbum no ficha a nadie. Tus jugadores y Puntos de amistad se conservan. Se aplica al reiniciar el juego."
option_players_universe = "Universo del jugador"
option_players_universe_help = "Activado: el gacha «Universo del jugador» está abierto: su fila del menú de la Crónica, el atajo Tab del tablero y el punto del mapa central. Desactivado: los tres desaparecen. Se aplica al momento; el punto del mapa central cambia al reiniciar el juego."
option_spirit_section = "Sección Espíritu"
option_spirit_section_help = "Activado: los espíritus se ven en todos sus sitios: la fila «Espíritu» de la Plantilla de equipo y del equipo de Crónica, las pestañas de espíritus de jugadores de la lista de recompensas de un partido y las marcas de espíritu nuevo; los espíritus siguen sin caer, así que las pestañas de recompensas salen vacías. Se puede conseguir una copia +1 de un personaje que ya tiene el club. Desactivado: todos esos sitios se ocultan (las filas de debajo suben) y no hay jugadores repetidos: un personaje que ya tiene el club no se vuelve a invocar ni a sacar, y los repetidos que ya hay en la partida se conservan. La pantalla de espíritus (invocar, subir rareza y fusionar cartas Ídolo y Diamante) no tiene otra entrada. Se aplica al reiniciar el juego."

[fr.new]
mod_name = "Recrutement classique"
mod_description = "Une carte par personnage, comme dans les jeux classiques : les joueurs ne tombent plus sous forme d'esprits, on les recrute donc dans l'Album des joueurs du club-house avec les Points d'Amitié gagnés à chaque match. Nécessite BetterQoL."
option_classic_recruitment = "Recrutement classique"
option_classic_recruitment_help = "Désactivé : les joueurs s'obtiennent à nouveau comme dans le jeu d'origine. Les esprits tombent en match, en récompense et en boutique, les doublons sont conservés, le gacha « Univers du joueur » est ouvert et l'album ne recrute personne. Tes joueurs et tes Points d'amitié sont conservés. Appliqué au redémarrage du jeu."
option_players_universe = "Univers du joueur"
option_players_universe_help = "Activé : le gacha « Univers du joueur » est ouvert : sa ligne du menu de la Chronique, le raccourci Tab du plateau et le point de la carte centrale. Désactivé : les trois disparaissent. Appliqué immédiatement ; le point de la carte centrale change au redémarrage du jeu."
option_spirit_section = "Section Esprit"
option_spirit_section_help = "Activé : les esprits s'affichent partout : la ligne «Espíritu» de l'équipe et de l'équipe de la Chronique, les onglets d'esprits de joueurs de la liste de récompenses d'un match et les marques de nouvel esprit ; les esprits ne tombent toujours pas, donc les onglets de récompenses sont vides. Une copie +1 d'un personnage que le club possède peut être obtenue. Désactivé : tous ces endroits sont masqués (les lignes en dessous remontent) et les doublons sont désactivés : un personnage que le club possède n'est plus invoqué ni tiré, et les doublons déjà présents dans la sauvegarde sont conservés. L'écran des esprits (invocation, hausse de rareté et fusion des cartes Idole et Diamant) n'a pas d'autre accès. Appliqué au redémarrage du jeu."

[de.new]
mod_name = "Klassische Verpflichtung"
mod_description = "Eine Karte pro Charakter, wie in den klassischen Spielen: Spieler fallen nicht mehr als Geister an, du verpflichtest sie im Spieleralbum des Clubraums mit Freundschaftspunkten, die jedes Spiel einbringt. Benötigt BetterQoL."
option_classic_recruitment = "Klassisches Anwerben"
option_classic_recruitment_help = "Aus: Spieler erhält man wieder wie im Originalspiel. Geister fallen in Spielen, Belohnungen und Läden, Duplikate bleiben erhalten, der Gacha «Universo del jugador» ist offen und das Album wirbt niemanden an. Deine Spieler und Freundschaftspunkte bleiben erhalten. Gilt nach einem Neustart des Spiels."
option_players_universe = "Gacha «Universo del jugador»"
option_players_universe_help = "An: Der Gacha «Universo del jugador» ist offen: seine Zeile im Chronik-Menü, die Tab-Abkürzung des Spielbretts und der Punkt der Zentralkarte. Aus: Alle drei fehlen. Gilt sofort; der Punkt der Zentralkarte ändert sich nach einem Neustart des Spiels."
option_spirit_section = "Geist-Bereich"
option_spirit_section_help = "An: Geister werden überall gezeigt: die Zeile «Espíritu» im Team und im Chronik-Team, die Spielergeister-Reiter der Belohnungsliste eines Spiels und die Markierungen für neue Geister; Geister fallen weiterhin nicht, daher sind die Belohnungsreiter leer. Eine +1-Kopie einer Figur, die der Verein hat, ist erhältlich. Aus: Alle diese Stellen sind ausgeblendet (die Zeilen darunter rücken nach oben) und Duplikate sind aus: Eine Figur, die der Verein hat, wird nicht erneut beschworen oder gezogen, und Duplikate, die ein Spielstand schon hat, bleiben erhalten. Der Geister-Bildschirm (Beschwören, Seltenheit erhöhen und Fusion von Idol- und Diamant-Karten) hat keinen anderen Zugang. Gilt nach einem Neustart des Spiels."

[it.new]
mod_name = "Ingaggi classici"
mod_description = "Una carta per personaggio, come nei giochi classici: i giocatori non cadono più come spiriti, quindi si ingaggiano nell'Album dei giocatori della sala del club con i Punti Carisma guadagnati in ogni partita. Richiede BetterQoL."
option_classic_recruitment = "Reclutamento classico"
option_classic_recruitment_help = "Disattivato: i giocatori si ottengono di nuovo come nel gioco originale. Gli spiriti si ottengono in partite, ricompense e negozi, i doppioni restano, il gacha «Universo del giocatore» è aperto e l'album non ingaggia nessuno. I tuoi giocatori e i Punti Carisma restano. Si applica al riavvio del gioco."
option_players_universe = "Universo del giocatore"
option_players_universe_help = "Attivato: il gacha «Universo del giocatore» è aperto: la sua riga del menu della Cronaca, la scorciatoia Tab del tabellone e il punto della mappa centrale. Disattivato: spariscono tutti e tre. Si applica subito; il punto della mappa centrale cambia al riavvio del gioco."
option_spirit_section = "Sezione Spirito"
option_spirit_section_help = "Attivato: gli spiriti si vedono ovunque: la riga «Espíritu» della squadra e della squadra della Cronaca, le schede degli spiriti dei giocatori della lista delle ricompense di una partita e i segni di nuovo spirito; gli spiriti continuano a non cadere, quindi le schede delle ricompense sono vuote. Si può ottenere una copia +1 di un personaggio che il club ha già. Disattivato: tutti questi punti sono nascosti (le righe sotto salgono) e i doppioni sono disattivati: un personaggio che il club ha già non viene più evocato né estratto, e i doppioni già presenti nel salvataggio restano. La schermata degli spiriti (evocazione, aumento di rarità e fusione delle carte Idolo e Diamante) non ha altro accesso. Si applica al riavvio del gioco."

[pt.new]
mod_name = "Contratação clássica"
mod_description = "Uma carta por personagem, como nos jogos clássicos: os jogadores já não caem como espíritos, por isso contratam-se no Álbum de jogadores da sala do clube com os Pontos de Amizade ganhos em cada partida. Precisa de BetterQoL."
option_classic_recruitment = "Recrutamento clássico"
option_classic_recruitment_help = "Desativado: os jogadores obtêm-se de novo como no jogo original. Os espíritos caem em jogos, recompensas e lojas, os repetidos mantêm-se, o gacha «Universo do jogador» fica aberto e o álbum não contrata ninguém. Os teus jogadores e Pontos de amizade mantêm-se. Aplica-se ao reiniciar o jogo."
option_players_universe = "Universo do jogador"
option_players_universe_help = "Ativado: o gacha «Universo do jogador» está aberto: a sua linha do menu da Crónica, o atalho Tab do tabuleiro e o ponto do mapa central. Desativado: os três desaparecem. Aplica-se de imediato; o ponto do mapa central muda ao reiniciar o jogo."
option_spirit_section = "Secção Espírito"
option_spirit_section_help = "Ativado: os espíritos aparecem em todo o lado: a linha «Espíritu» da equipa e da equipa da Crónica, os separadores de espíritos de jogadores da lista de recompensas de um jogo e as marcas de espírito novo; os espíritos continuam sem cair, por isso os separadores de recompensas ficam vazios. Pode obter-se uma cópia +1 de uma personagem que o clube já tem. Desativado: todos esses sítios ficam ocultos (as linhas de baixo sobem) e não há jogadores repetidos: uma personagem que o clube já tem não volta a ser invocada nem tirada, e os repetidos que o jogo guardado já tem mantêm-se. O ecrã de espíritos (invocar, subir raridade e fundir cartas Ídolo e Diamante) não tem outra entrada. Aplica-se ao reiniciar o jogo."

[ja.new]
mod_name = "クラシック勧誘"
mod_description = "昔のシリーズのように、キャラクター1人につきカード1枚。選手はスピリットとしてドロップしなくなり、毎試合もらえるフレンドシップポイントを使って、クラブルームの選手アルバムで獲得します。BetterQoLが必要です。"
option_classic_recruitment = "クラシックスカウト"
option_classic_recruitment_help = "オフ：選手の入手方法が元のゲームと同じに戻ります。試合・報酬・ショップでスピリットが手に入り、重複も残り、「選手ユニバース」のガチャが開き、アルバムではスカウトできません。選手と友情ポイントはそのまま残ります。ゲームの再起動後に反映。"
option_players_universe = "選手ユニバース"
option_players_universe_help = "オン：「選手ユニバース」のガチャが使えます：クロニクルメニューの項目、ボードのTabショートカット、ハブマップのポイント。オフ：この3つがなくなります。すぐに反映されます。ハブマップのポイントはゲームの再起動後に変わります。"
option_spirit_section = "スピリットの項目"
option_spirit_section_help = "オン：スピリットがすべての場所に表示されます：チームドックとクロニクルのチームドックの「Espíritu」の項目、試合の報酬リストの選手スピリットのタブ、新しいスピリットのマーク。スピリットは引き続き手に入らないので、報酬のタブは空です。クラブにいるキャラの+1コピーを入手できます。オフ：これらはすべて隠れ（下の項目が上に詰まります）、重複する選手はなくなります：クラブにいるキャラは再び召喚・入手されず、セーブにすでにある重複はそのまま残ります。スピリット画面（アイドル・ダイヤモンドカードの召喚、レアリティアップ、合成）には他の入口がありません。ゲームの再起動後に反映されます。"

[zh_hans.new]
mod_name = "经典招募"
mod_description = "如同经典作品，每个角色只有一张卡。球员不再以灵魂形式掉落，需要用每场比赛获得的友情点数，在社团活动室的球员图鉴中签约。需要 BetterQoL。"
option_classic_recruitment = "经典招募"
option_classic_recruitment_help = "关闭：球员的获得方式恢复为原版游戏。比赛、奖励和商店会掉落灵魂，重复球员会保留，「球员宇宙」扭蛋开放，图鉴无法签约。你的球员和友情点数会保留。重启游戏后生效。"
option_players_universe = "球员宇宙"
option_players_universe_help = "开：「球员宇宙」扭蛋开放：编年史菜单中的一行、棋盘的Tab快捷键和中心地图上的地点。关：这三处都会消失。立即生效；中心地图上的地点在重启游戏后改变。"
option_spirit_section = "灵魂栏目"
option_spirit_section_help = "开：灵魂在所有地方显示：球队名单和编年史球队名单中的「Espíritu」一行、比赛奖励列表中的球员灵魂标签和新灵魂标记；灵魂仍然不会掉落，所以奖励标签是空的。可以获得俱乐部已有角色的+1副本。关：这些地方全部隐藏（下面的行会上移），并且没有重复球员：俱乐部已有的角色不会再被召唤或抽到，存档中已有的重复球员保留。灵魂画面（偶像和钻石卡的召唤、稀有度提升和融合）没有其他入口。重启游戏后生效。"

[zh_hant.new]
mod_name = "經典招募"
mod_description = "如同經典作品，每個角色只有一張卡。球員不再以靈魂形式掉落，需要用每場比賽獲得的友情點數，在社團活動室的球員圖鑑中簽約。需要 BetterQoL。"
option_classic_recruitment = "經典招募"
option_classic_recruitment_help = "關閉：球員的獲得方式恢復為原版遊戲。比賽、獎勵和商店會掉落靈魂，重複球員會保留，「球員宇宙」扭蛋開放，圖鑑無法簽約。你的球員和友情點數會保留。重啟遊戲後生效。"
option_players_universe = "球員宇宙"
option_players_universe_help = "開：「球員宇宙」扭蛋開放：編年史選單中的一行、棋盤的Tab快捷鍵和中心地圖上的地點。關：這三處都會消失。立即生效；中心地圖上的地點在重啟遊戲後改變。"
option_spirit_section = "靈魂欄目"
option_spirit_section_help = "開：靈魂在所有地方顯示：球隊名單和編年史球隊名單中的「Espíritu」一行、比賽獎勵列表中的球員靈魂標籤和新靈魂標記；靈魂仍然不會掉落，所以獎勵標籤是空的。可以獲得俱樂部已有角色的+1副本。關：這些地方全部隱藏（下面的行會上移），並且沒有重複球員：俱樂部已有的角色不會再被召喚或抽到，存檔中已有的重複球員保留。靈魂畫面（偶像和鑽石卡的召喚、稀有度提升和融合）沒有其他入口。重啟遊戲後生效。"
