schema = "VRFW.editor/1"
# Names and descriptions of this mod's config.toml settings, shown in ModManager > Parametros del juego. Read only by ModManager.

[[Shape]]
Id = "settings"
For = "config"
  [[Shape.Field]]
  Key = "points"
  Type = "table"
  Label = { es = "Puntos PEG y SP", en = "PEG and SP points" }
  Help = { es = "Reservas de puntos de espíritu de lucha (PEG) y de espíritu (SP) del partido.", en = "Fighting-spirit (PEG) and spirit (SP) point pools in a match." }
  [[Shape.Field]]
  Key = "points.move_tension_free"
  Type = "bool"
  Label = { es = "Supertécnicas sin tensión", en = "Moves cost no tension" }
  Help = { es = "El rival (CPU) usa siempre los mismos sistemas de puntos que el jugador y las técnicas no gastan tensión.", en = "The CPU team plays by the same point systems as the player; moves spend no tension." }
  [[Shape.Field]]
  Key = "points.cost_model"
  Type = "string"
  Label = { es = "Modelo de coste de armadura", en = "Armour cost model" }
  Help = { es = "«cs» usa las reglas de Chrono Stone (costes por cs_scale); «if» las reglas antiguas.", en = "\"cs\" uses Chrono Stone rules (costs times cs_scale); \"if\" the older rules." }
  [[Shape.Field]]
  Key = "points.cs_scale"
  Type = "float"
  Label = { es = "Escala de coste (CS)", en = "Cost scale (CS)" }
  Help = { es = "Multiplicador de todos los costes del modelo «cs».", en = "Multiplier of every cost in the \"cs\" model." }
  [[Shape.Field]]
  Key = "points.armour_boost"
  Type = "float"
  Label = { es = "Aumento al ponerse armadura (IF)", en = "Armour boost (IF)" }
  Help = { es = "Modelo «if»: la reserva se multiplica por esto cada vez que se pone la armadura.", en = "\"if\" model: the pool is multiplied by this each time the armour goes on." }
  [[Shape.Field]]
  Key = "points.armour_drain_per_s"
  Type = "float"
  Label = { es = "Gasto de armadura por segundo (IF)", en = "Armour drain per second (IF)" }
  Help = { es = "Modelo «if»: PEG que se gastan por segundo de juego con armadura.", en = "\"if\" model: PEG spent per second of live play under armour." }
  [[Shape.Field]]
  Key = "points.cs_armour_drain_k"
  Type = "float"
  Label = { es = "Factor de gasto de armadura (CS)", en = "Armour drain factor (CS)" }
  Help = { es = "Modelo «cs»: PEG por segundo = (reserva + ATK) por este factor y por la escala.", en = "\"cs\" model: PEG per second = (pool + ATK) times this factor and the scale." }
  [[Shape.Field]]
  Key = "points.cs_armour_gk_zone_mult"
  Type = "float"
  Label = { es = "Gasto de armadura en zona de portero (CS)", en = "Armour drain in keeper zone (CS)" }
  Help = { es = "Multiplicador del gasto de armadura mientras el jugador está en su zona de portería.", en = "Armour drain multiplier while the player is in his goal zone." }
  [[Shape.Field]]
  Key = "points.default_atk"
  Type = "int"
  Label = { es = "ATK por defecto", en = "Default ATK" }
  Help = { es = "ATK de un keshin que no figura en la tabla.", en = "ATK of a keshin missing from the table." }
  [[Shape.Field]]
  Key = "points.cs_armour_first_refill"
  Type = "float"
  Label = { es = "Recarga de la primera armadura (CS)", en = "First armour refill (CS)" }
  Help = { es = "La primera armadura del partido restaura esta fracción del PEG máximo; las siguientes nada.", en = "The first armour of the match restores this share of max PEG; later ones nothing." }
  [[Shape.Field]]
  Key = "points.cs_armour_moves_free"
  Type = "bool"
  Label = { es = "Técnicas gratis con armadura (CS)", en = "Free moves under armour (CS)" }
  Help = { es = "Las supertécnicas bajo la armadura no cuestan PEG.", en = "Special moves under the armour cost no PEG." }
  [[Shape.Field]]
  Key = "points.cs_keshin_moves_cost"
  Type = "string"
  Label = { es = "Coste de técnicas con keshin (CS)", en = "Keshin move cost (CS)" }
  Help = { es = "Con el keshin fuera sin armadura, «own» cobra PEG solo por las técnicas de su espíritu guerrero.", en = "With the keshin out and no armour, \"own\" charges PEG only for moves of his warrior spirit." }
  [[Shape.Field]]
  Key = "points.cs_armour_keshin_move"
  Type = "bool"
  Label = { es = "Técnica del keshin con armadura (CS)", en = "Keshin move under armour (CS)" }
  Help = { es = "Permite al jugador con armadura usar la técnica propia de su keshin.", en = "Lets the armoured player use his keshin's own move." }
  [[Shape.Field]]
  Key = "pe"
  Type = "table"
  Label = { es = "Costes de transformación (PE)", en = "Transformation costs (PE)" }
  Help = { es = "Cuánta PE cuestan las transformaciones; el miximax paga mientras dura.", en = "How much PE transformations cost; miximax pays while it runs." }
  [[Shape.Field]]
  Key = "pe.enabled"
  Type = "bool"
  Label = { es = "PE activada", en = "PE enabled" }
  Help = { es = "Activa el sistema de PE.", en = "Turns the PE system on." }
  [[Shape.Field]]
  Key = "pe.cost_model"
  Type = "string"
  Label = { es = "Modelo de coste de PE", en = "PE cost model" }
  Help = { es = "«cs» usa el modelo de PE de Chrono Stone; «if» las reglas antiguas.", en = "\"cs\" uses Chrono Stone's PE model; \"if\" the older rules." }
  [[Shape.Field]]
  Key = "pe.cs_scale"
  Type = "float"
  Label = { es = "Escala de coste de PE (CS)", en = "PE cost scale (CS)" }
  Help = { es = "Multiplica todos los costes de PE de Chrono Stone (0,75 = un 25 % más baratos).", en = "Multiplies every Chrono Stone PE cost (0.75 = 25 % cheaper)." }
  [[Shape.Field]]
  Key = "pe.cs_pe_free_while_out"
  Type = "bool"
  Label = { es = "PE gratis con keshin fuera (CS)", en = "Free PE while out (CS)" }
  Help = { es = "Mientras hay un keshin o armadura fuera, la PE del jugador no se gasta.", en = "While a keshin or armour is out the player's PE does not drain." }
  [[Shape.Field]]
  Key = "pe.cs_end_pe_k"
  Type = "float"
  Label = { es = "Factor de PE al terminar (CS)", en = "End PE factor (CS)" }
  Help = { es = "Al terminar, la PE se cobra una vez: este factor por la reserva, reducido por el Físico.", en = "At the end PE is charged once: this factor times the pool, reduced by Physical." }
  [[Shape.Field]]
  Key = "pe.cs_end_stat_k"
  Type = "float"
  Label = { es = "Reducción por Físico al terminar (CS)", en = "End Physical reduction (CS)" }
  Help = { es = "Cuánto reduce cada punto de Físico el cobro final de PE.", en = "How much each Physical point reduces the final PE charge." }
  [[Shape.Field]]
  Key = "pe.cs_end_armour_mult"
  Type = "float"
  Label = { es = "Multiplicador final con armadura (CS)", en = "End armour multiplier (CS)" }
  Help = { es = "Multiplica el cobro final de PE cuando había armadura.", en = "Multiplies the final PE charge when there was armour." }
  [[Shape.Field]]
  Key = "pe.cs_end_grace_ms"
  Type = "int"
  Label = { es = "Margen antes del cobro final (ms)", en = "End charge grace (ms)" }
  Help = { es = "Milisegundos de margen antes de cobrar la PE final.", en = "Milliseconds of grace before the final PE charge." }
  [[Shape.Field]]
  Key = "pe.cs_end_follows_level"
  Type = "bool"
  Label = { es = "Cobro final según nivel", en = "End charge follows level" }
  Help = { es = "El cobro final sigue la proporción de barra del nivel del jugador.", en = "The end charge follows the share of the player's level bar." }
  [[Shape.Field]]
  Key = "pe.kp_default"
  Type = "int"
  Label = { es = "Reserva por defecto", en = "Default pool size" }
  Help = { es = "Tamaño de reserva PEG que se usa si el keshin no tiene uno propio.", en = "PEG pool size used when the keshin has none." }
  [[Shape.Field]]
  Key = "pe.cs_miximax_pe_mult"
  Type = "float"
  Label = { es = "Multiplicador de PE del miximax (CS)", en = "Miximax PE multiplier (CS)" }
  Help = { es = "Multiplica todos los costes de PE con miximax, con o sin armadura.", en = "Multiplies every PE cost under miximax, with or without armour." }
  [[Shape.Field]]
  Key = "pe.drain_log_s"
  Type = "float"
  Label = { es = "Intervalo del registro de gasto (s)", en = "Drain log interval (s)" }
  Help = { es = "Cada cuántos segundos se anota el gasto de PE en el registro (depuración).", en = "Seconds between PE drain log lines (debug)." }
  [[Shape.Field]]
  Key = "pe.free_activation"
  Type = "list"
  Of = "string"
  Label = { es = "Activaciones sin gasto de hiper", en = "Free activations" }
  Help = { es = "Tipos de transformación cuyo inicio no gasta el indicador de hiper.", en = "Transformation kinds whose start spends no hyper gauge." }
  [[Shape.Field]]
  Key = "pe.no_start_check"
  Type = "list"
  Of = "string"
  Label = { es = "Activaciones sin requisito de hiper", en = "No start check" }
  Help = { es = "Tipos de transformación que no necesitan indicador de hiper para empezar.", en = "Transformation kinds that need no hyper gauge to start." }
  [[Shape.Field]]
  Key = "pe.miximax_untimed"
  Type = "bool"
  Label = { es = "Miximax sin límite de tiempo", en = "Untimed miximax" }
  Help = { es = "El miximax no tiene límite y termina al llegar la PE a 0.", en = "Miximax has no time limit and ends at 0 PE." }
  [[Shape.Field]]
  Key = "pe.miximax_end_pe"
  Type = "float"
  Label = { es = "PE final del miximax", en = "Miximax end PE" }
  Help = { es = "PE con la que termina el miximax.", en = "PE at which miximax ends." }
  [[Shape.Field]]
  Key = "pe.miximax_pe_mult"
  Type = "float"
  Label = { es = "Multiplicador de PE del miximax (IF)", en = "Miximax PE multiplier (IF)" }
  Help = { es = "Modelo «if»: multiplica el gasto de PE mientras dura el miximax.", en = "\"if\" model: multiplies PE drain during miximax." }
  [[Shape.Field]]
  Key = "pe.miximax_armour_pe_mult"
  Type = "float"
  Label = { es = "Multiplicador de PE miximax con armadura (IF)", en = "Miximax plus armour PE multiplier (IF)" }
  Help = { es = "Modelo «if»: multiplicador de PE con miximax y armadura a la vez.", en = "\"if\" model: PE multiplier with miximax and armour together." }
  [[Shape.Field]]
  Key = "pe.armour_pe_mult"
  Type = "float"
  Label = { es = "Multiplicador de PE de armadura (IF)", en = "Armour PE multiplier (IF)" }
  Help = { es = "Modelo «if»: multiplica el gasto de PE con armadura.", en = "\"if\" model: multiplies PE drain under armour." }
  [[Shape.Field]]
  Key = "pe.clip_gauge_end"
  Type = "string"
  Label = { es = "Animación al agotar la pila", en = "Battery-out clip" }
  Help = { es = "Animación al quedarse sin batería cuando la regla del rasgo no indica ninguna.", en = "Clip played when the battery runs out and the trait names none." }
  [[Shape.Field]]
  Key = "pe.miximax_carriers"
  Type = "list"
  Of = "string"
  Label = { es = "Auras con miximax", en = "Miximax carriers" }
  Help = { es = "Auras de otros mods que empiezan con un miximax aunque su fila diga otra cosa.", en = "Aura rows from other mods that start as a miximax whatever their row says." }
  [[Shape.Field]]
  Key = "pe.trait"
  Type = "table"
  Label = { es = "Rasgos de PE", en = "PE traits" }
  Help = { es = "Reglas especiales de PE para androides y robots.", en = "Special PE rules for androids and robots." }
  [[Shape.Field]]
  Key = "pe.trait.android"
  Type = "table"
  Label = { es = "Androides", en = "Androids" }
  Help = { es = "Reglas de PE de los androides con keshin.", en = "PE rules of androids with keshin." }
  [[Shape.Field]]
  Key = "pe.trait.android.keshins"
  Type = "list"
  Of = "int"
  Label = { es = "Keshins androides", en = "Android keshins" }
  Help = { es = "Identificadores de los keshins que cuentan como androides.", en = "Ids of the keshins counted as androids." }
  [[Shape.Field]]
  Key = "pe.trait.android.gauge_drain"
  Type = "bool"
  Label = { es = "Gasto de hiper", en = "Gauge drain" }
  Help = { es = "Si el androide gasta el indicador de hiper.", en = "Whether the android spends the hyper gauge." }
  [[Shape.Field]]
  Key = "pe.trait.android.pe_mult"
  Type = "float"
  Label = { es = "Multiplicador de PE", en = "PE multiplier" }
  Help = { es = "Multiplica el gasto de PE del androide.", en = "Multiplies the android's PE drain." }
  [[Shape.Field]]
  Key = "pe.trait.android.battery_out"
  Type = "string"
  Label = { es = "Cuándo se agota la batería", en = "Battery-out rule" }
  Help = { es = "Cuándo se queda sin batería al llegar a 0 PE.", en = "When the battery runs out at 0 PE." }
  [[Shape.Field]]
  Key = "pe.trait.android.battery_keep_armour"
  Type = "bool"
  Label = { es = "Conservar armadura sin batería", en = "Keep armour on battery out" }
  Help = { es = "La armadura se mantiene al agotarse la batería.", en = "The armour stays when the battery runs out." }
  [[Shape.Field]]
  Key = "pe.trait.android.battery_clip"
  Type = "string"
  Label = { es = "Animación sin batería", en = "Battery-out clip" }
  Help = { es = "Animación que se reproduce al agotarse la batería.", en = "Clip played when the battery runs out." }
  [[Shape.Field]]
  Key = "pe.trait.android.battery_hold"
  Type = "string"
  Label = { es = "Pose sin batería", en = "Battery-out hold" }
  Help = { es = "Conjunto de movimiento que mantiene al jugador sin batería.", en = "Motion set that holds the player with no battery." }
  [[Shape.Field]]
  Key = "pe.trait.android.battery_hold_after_ms"
  Type = "int"
  Label = { es = "Retraso de la pose (ms)", en = "Hold delay (ms)" }
  Help = { es = "Milisegundos tras la animación antes de mantener la pose.", en = "Milliseconds after the clip before the hold starts." }
  [[Shape.Field]]
  Key = "pe.trait.robot"
  Type = "table"
  Label = { es = "Robots", en = "Robots" }
  Help = { es = "Reglas de PE de los robots.", en = "PE rules of robots." }
  [[Shape.Field]]
  Key = "pe.trait.robot.battery_out"
  Type = "string"
  Label = { es = "Cuándo se agota la batería", en = "Battery-out rule" }
  Help = { es = "Cuándo se queda sin batería: «always» al llegar a 0 PE.", en = "When the battery runs out: \"always\" at 0 PE." }
  [[Shape.Field]]
  Key = "pe.trait.robot.battery_clip"
  Type = "string"
  Label = { es = "Animación sin batería", en = "Battery-out clip" }
  Help = { es = "Animación que se reproduce al agotarse la batería.", en = "Clip played when the battery runs out." }
  [[Shape.Field]]
  Key = "pe.trait.robot.battery_hold"
  Type = "string"
  Label = { es = "Pose sin batería", en = "Battery-out hold" }
  Help = { es = "Conjunto de movimiento que mantiene al robot sin batería.", en = "Motion set that holds the robot with no battery." }
  [[Shape.Field]]
  Key = "pe.trait.robot.battery_hold_after_ms"
  Type = "int"
  Label = { es = "Retraso de la pose (ms)", en = "Hold delay (ms)" }
  Help = { es = "Milisegundos tras la animación antes de mantener la pose.", en = "Milliseconds after the clip before the hold starts." }
  [[Shape.Field]]
  Key = "tired_motion"
  Type = "table"
  Label = { es = "Movimiento de cansancio", en = "Tired motion" }
  Help = { es = "Cómo corren y se quedan quietos los jugadores con la PE casi vacía.", en = "How players run and idle with nearly empty PE." }
  [[Shape.Field]]
  Key = "tired_motion.enabled"
  Type = "bool"
  Label = { es = "Activado", en = "Enabled" }
  Help = { es = "Activa el movimiento de cansancio.", en = "Turns tired motion on." }
  [[Shape.Field]]
  Key = "tired_motion.run_below"
  Type = "float"
  Label = { es = "Cansado por debajo de", en = "Tired below" }
  Help = { es = "Fracción de PE por debajo de la cual el jugador corre cansado.", en = "PE share below which the player runs tired." }
  [[Shape.Field]]
  Key = "tired_motion.run_recover"
  Type = "float"
  Label = { es = "Recuperado por encima de", en = "Recovered above" }
  Help = { es = "Fracción de PE por encima de la cual vuelve a correr normal.", en = "PE share above which he runs normally again." }
  [[Shape.Field]]
  Key = "tired_motion.run_sets"
  Type = "list"
  Of = "string"
  Label = { es = "Estilos de carrera cansada", en = "Tired run styles" }
  Help = { es = "Conjuntos de movimiento; se sortea uno al empezar el cansancio.", en = "Motion sets; one is drawn when tiredness starts." }
  [[Shape.Field]]
  Key = "tired_motion.run_weights"
  Type = "list"
  Label = { es = "Pesos de los estilos", en = "Style weights" }
  Help = { es = "Probabilidad relativa de cada estilo de carrera cansada.", en = "Relative chance of each tired run style." }
  [[Shape.Field]]
  Key = "tired_motion.reroll"
  Type = "string"
  Label = { es = "Nuevo sorteo", en = "Reroll" }
  Help = { es = "Cuándo se vuelve a sortear el estilo (por ejemplo cada episodio).", en = "When the style is drawn again (for example each episode)." }
  [[Shape.Field]]
  Key = "tired_motion.idle_set"
  Type = "string"
  Label = { es = "Pose cansada parado", en = "Tired idle set" }
  Help = { es = "Conjunto de movimiento del jugador cansado cuando está parado.", en = "Motion set of the tired player when standing." }
  [[Shape.Field]]
  Key = "tired_motion.idle_at"
  Type = "float"
  Label = { es = "PE para pose parada", en = "Idle PE threshold" }
  Help = { es = "Fracción de PE por debajo de la cual aparece la pose parada.", en = "PE share below which the idle pose appears." }
  [[Shape.Field]]
  Key = "tired_motion.idle_every_s"
  Type = "list"
  Label = { es = "Cada cuánto jadea (s)", en = "Idle interval (s)" }
  Help = { es = "Rango en segundos entre dos poses cansadas.", en = "Range in seconds between two tired idle poses." }
  [[Shape.Field]]
  Key = "tired_motion.idle_for_s"
  Type = "list"
  Label = { es = "Duración de la pose (s)", en = "Idle duration (s)" }
  Help = { es = "Rango en segundos que dura cada pose cansada.", en = "Range in seconds each tired idle pose lasts." }
  [[Shape.Field]]
  Key = "tired_motion.idle_speed"
  Type = "float"
  Label = { es = "Velocidad máxima parado", en = "Idle speed limit" }
  Help = { es = "Velocidad máxima del jugador para considerarlo parado.", en = "Top speed at which the player counts as standing." }
  [[Shape.Field]]
  Key = "tired_motion.idle_states"
  Type = "list"
  Of = "int"
  Label = { es = "Estados de juego válidos", en = "Idle game states" }
  Help = { es = "Estados del partido en los que puede aparecer la pose parada.", en = "Match states in which the idle pose may appear." }
  [[Shape.Field]]
  Key = "tired_motion.keepers"
  Type = "bool"
  Label = { es = "Incluir porteros", en = "Include keepers" }
  Help = { es = "Aplica el cansancio también a los porteros.", en = "Applies tiredness to keepers too." }
  [[Shape.Field]]
  Key = "tired_motion.cpu"
  Type = "bool"
  Label = { es = "Incluir al rival", en = "Include CPU" }
  Help = { es = "Aplica el cansancio también al equipo rival (CPU).", en = "Applies tiredness to the CPU team too." }
  [[Shape.Field]]
  Key = "hud_hidden_layers"
  Type = "table"
  Label = { es = "Capas de HUD ocultas", en = "Hidden HUD layers" }
  Help = { es = "Capas del HUD del partido que se ocultan mientras nada se paga con el indicador de hiper.", en = "Match HUD layers hidden while nothing pays with the hyper gauge." }
  [[Shape.Field]]
  Key = "hud_hidden_layers.hidden_layers"
  Type = "list"
  Of = "string"
  Label = { es = "Lista de capas", en = "Layer list" }
  Help = { es = "Capas del HUD que se ocultan.", en = "HUD layers that are hidden." }
