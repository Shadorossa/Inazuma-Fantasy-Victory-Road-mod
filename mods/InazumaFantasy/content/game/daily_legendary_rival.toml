# The Daily Legendary Rival's commands, handled by scripts\daily_legendary_rival.lua.
schema = "VRFW.game/1"

[[VRFW.Command]]
name = "CMND_INAZUMAFANTASY_DAILY_RIVAL"
handler = "InazumaFantasy.DailyRival"

[[VRFW.Command]]
name = "CMND_INAZUMAFANTASY_DAILY_RIVAL_STADIUM"
handler = "InazumaFantasy.DailyRivalStadium"

[[VRFW.Command]]
name = "CMND_INAZUMAFANTASY_DAILY_RIVAL_REWARD"
handler = "InazumaFantasy.DailyRivalReward"

[[VRFW.Command]]
# day -> true: the day's reward marked paid (the menu added it to the bag)
name = "CMND_INAZUMAFANTASY_DAILY_RIVAL_PAID"
handler = "InazumaFantasy.DailyRivalPaid"
