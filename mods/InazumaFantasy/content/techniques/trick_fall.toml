  description = "Abre uma armadilha sob o adversário\ne rouba a bola na queda."
  [technique.text.ja]
  name = "トリックフォール"
  description = "相手の足元に罠を開き\n落ちる隙にボールを奪う！"
  [technique.text.zh_hans]
