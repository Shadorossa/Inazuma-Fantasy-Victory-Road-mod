# Inazuma Fantasy: the pictures of the advent calendar's big update card (NEW atlases). The game loads them by name from
# the card's row, always from this folder: content\base_tables\gamedata\post\advent_calendar_config.toml.
# Same canvases as the retail card, 964 x 252, and its detail window, 628 x 240.
# GENERATED by research/scripts/inazuma_fantasy_advent_card.py from the owner's key art (git-ignored, in
# research/build/owner_art/): rerun it, do not edit by hand.
schema = "VRFW.image/1"

[[texture]]
atlas = "#/menu/220_img/calendar_img/inazuma_fantasy_advent_card.g4tx"
name = "inazuma_fantasy_advent_card"
size = [964, 252]
png = "advent_card/inazuma_fantasy_advent_card.png"

[[texture]]
atlas = "#/menu/220_img/calendar_img/inazuma_fantasy_advent_detail.g4tx"
name = "inazuma_fantasy_advent_detail"
size = [628, 240]
png = "advent_card/inazuma_fantasy_advent_detail.png"
