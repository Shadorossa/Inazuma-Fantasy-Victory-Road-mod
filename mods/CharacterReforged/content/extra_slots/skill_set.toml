# The skill set in a match: the AURA and MIX slots beside the 6 special moves (the framework's plates slot).
schema = "VRFW.extra_slot/1"

[[VRFW.ExtraSlot]]
name = "skill_set"
kind = "plates"
states = [9, 14, 16]                 # open play, duel, zone
summon_states = [9, 14, 16]
plate_states = [9, 14, 16]
lend_slot = "auto"
start_timeout_s = 15
restore_delay_s = 1.0
cooldown_s = 15
disguise = true
preload = true
row_parity = true
aura_row = true

# The transformation cross: one entry per D-pad arrow while RB is held (keyboard: `I` `J` `K` `L`).
# An entry shows its transformation; once that form runs it shows the technique the form grants.
# The first page of `pages` that has something for the player is the entry; an empty entry passes its arrow to the game.

# RB + up: the Mix-Max or the mode change, then the fusion's partner technique
[[VRFW.ExtraSlot.direct]]
pages = ["mix"]
pad = "RB+UP"
key = "I"
xinput = true
pass_when_empty = true

# RB + left: the armour of the keshin (summoned first when it is not out), then the technique kept under the armour
[[VRFW.ExtraSlot.direct]]
pages = ["armour"]
pad = "RB+LEFT"
key = "J"
xinput = true
pass_when_empty = true

# RB + right: the group keshin he takes part in (first: shown once the team carries its components), else the keshin or totem inherited through the Mix-Max
[[VRFW.ExtraSlot.direct]]
pages = ["group", "inherited"]
pad = "RB+RIGHT"
key = "L"
xinput = true
pass_when_empty = true

# RB + down: the keshin or totem, then its own technique
[[VRFW.ExtraSlot.direct]]
pages = ["aura"]
pad = "RB+DOWN"
key = "K"
xinput = true
pass_when_empty = true

# the rival (CPU) uses his aura / mix slot through the same plate decision: open play, while no aura of his runs
[VRFW.ExtraSlot.cpu]
chance = 0.3
interval_s = [3.0, 6.0]
states = [9]
idle_only = true

[VRFW.ExtraSlot.source]
board_slot = 8
team_aura = true
board_aura_types = [0, 3, 2, 6, 5, 7]
compatible = true
write_aura_row = true
types = [0, 3, 5, 7]
mix_types = [2, 6]
mix_table = "MixSlot"
team_commands = ["aura", "mix"]
skill_list = true
default_table = "MovesetDefault"
# the user's players' match move list leaves out the auras of their technique list; rivals keep theirs
list_auras_out = true
# an empty position of the technique list takes, in the match only, the move on the board slot of the same position
list_board_fill = true

# around the running keshin: plate 0 its armour, its own move on plate 1 while the mix slot is idle
[VRFW.ExtraSlot.spirit]
armour = true
# RB + left without the keshin out: the press summons it and the armour goes on as soon as it is out
armour_direct = true
own_move = true
inherit = true
inherit_grace_s = 3.0
move_hold_s = 4.0
zone_retry_s = 2.0

# the base's own command names (graft hiper_btn)
[VRFW.ExtraSlot.commands]
plates = "CMND_CHARACTERREFORGED_PLATES"
label = "CMND_CHARACTERREFORGED_PLATE_LABEL"
swap_gauge = "CMND_CHARACTERREFORGED_SWAP_GAUGE"
fusion_stack = "CMND_CHARACTERREFORGED_FUSION_STACK"
fusion_partner = "CMND_CHARACTERREFORGED_FUSION_PARTNER"

# Duel auras are the rule [VRFW.DuelAura] of another mod; without it an entry's press in a duel is the duel's command.
