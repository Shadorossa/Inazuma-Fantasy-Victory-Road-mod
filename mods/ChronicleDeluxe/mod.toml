id = "ChronicleDeluxe"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml).
name = "Chronicle Deluxe"
version = "0.2.2"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "More Chronicle mode: new matches on the IE1 Chronicle board and three chains from the original IE1 and IE2 (Sonny's Premium Route, Mary Times Coach's Route and Suzette's Mother's Route), with their rivals, chests and S / A / B ranks. Every Chronicle team has a Chronicle battle and a Heroica battle up to Lv 200, with the levels, moves and auras of its own game. Matches drop move manuals, boots, auras and the rival's crest and kit, and the free match offers Lv 50, 99 and 200 difficulties."
priority = 0
tags = ["Teams", "Gameplay"]
updated = "2026-11-06"
# Own names: prefix ChronicleDeluxe (ChronicleDeluxe.X for any TOML key or Lua function of its own); content ids
# ChronicleDeluxe.<name>. Exported: the gacha pool kizuna_coin_gacha ([exports] keys; other mods add cards to it).
# Optional integrations (every use gated by if_mod / if_not_mod or a nil check; the mod runs without them):
#   ClassicEquipment (team gear in the rival drops), HissatsuLevelUp (grade books in the drops and chain prizes),
#   InazumaFantasy (unused kits in its general store), BetterUI (team line-up button), BetterMenu (cleared gauge under
#   the Competition strip: writes BetterMenu.Competition.strip_listeners; to be replaced by a BetterMenu export).
prefix = "ChronicleDeluxe"
folder = "ChronicleDeluxe"
# Mostly data (content\, text\); a few hook scripts of the VRFW board scripts live in assets\lua\ and scripts\. Layout:
#   content\teams\70_route_nodes\      the Chronicle side nodes, chain boards and the gacha node ([[VRFW.RouteNode]])
#   content\teams\10_ie1 ... 16_ares   the rival teams of the nodes and chains; 90_rules\ the free-match, heroic, story-aura and drop rules
#   content\defaults\                  match difficulties (INAZUMA / ZONA LETAL / BATALLA LEGENDARIA) and match ranks (S / A / B)
#   content\items\                     the drop-list sections, the key item «Sello del Maestro» and unused kit items
#   content\images\, content\screen_art\   own atlases for the chain board, ranks, class orbs and the gacha banner
#   config.toml                        tunables of the Heroica (level curve, sync, ramp), the drops and the extra kits
#   text\                              the «Mods» screen texts and the texts of the rules, challenges and menus (9 languages)
# Generated files are marked in their own headers; hand-maintained chain files are never overwritten by the builders.
requires = ["VRFW>=0.2.2"]
optional = ["BetterMenu", "BetterUI", "CharacterReforged", "ClassicEquipment", "HissatsuLevelUp", "InaRogue", "InazumaFantasy"]
# Native declarations of the free-match shuffle (content/game/free_match_shuffle.toml) need these.
permissions = ["call", "memory", "command"]
conflicts = []

# the gacha pool other mods may add cards to: [[VRFW.GachaAdd]] pool = "ChronicleDeluxe.kizuna_coin_gacha" in their
# content\gacha\*.toml (content/gacha/kizuna_coin_gacha.toml, VRFW docs/framework/gacha.md)
[exports]
functions = []
keys = ["kizuna_coin_gacha"]
