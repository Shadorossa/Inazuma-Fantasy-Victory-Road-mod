# Technique Cut-in Skip settings, read at each press.

[cutin_skip]
# Event name prefixes it applies to: techniques (ev60_ to ev63_) and Keshin, Armed, Miximax and transformation cut-ins (ev80_ to ev85_).
events = ["ev60_", "ev61_", "ev62_", "ev63_", "ev80_", "ev81_", "ev82_", "ev83_", "ev84_", "ev85_"]
# Prefixes it never applies to: the menus' technique preview slot.
not_events = ["ev60_9999"]
min_seconds = 0.25
