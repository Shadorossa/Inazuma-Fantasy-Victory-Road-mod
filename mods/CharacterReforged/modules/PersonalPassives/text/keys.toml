[ja.new]
mod_name = "固有パッシブ"
mod_description = "カスタムパッシブが選手ごとの固有パッシブになります。自分で装備するものではなく、Modがキャラクターごとに決めたその選手だけのパッシブで、スロットには常に表示され、変更はできず、試合ではそれが使われます。風・森・火・山・無の汎用の属性パッシブも追加され、その属性の自分の技が15%強くなります。パッシブは再利用できるブロックで作られ、Modがキャラクターごとに編集でき、ほかのModがスピリットに与えるパッシブも同じ仕組みで動きます。Character Reforgedが必要です。"
