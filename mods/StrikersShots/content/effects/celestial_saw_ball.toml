# «Sierra celestial» (Celestial Saw, whs02910; wind shot, cut-in ev60_02910): while the ball flies to the goal it
# wears the cut-in's shot (c0040, held at frame 399 from the aura's first frame): a flat cyan-white whirl of wind, a
# saw ~3 m across lying level round the ball, spinning on. x1.
# The object is ev6291cs00 (effect/event/ev60/ev6291cs00/), built by research/scripts/celestial_saw_ball_fx.py from
# ev60029100.
# Mod «Strikers Shots»: visuals only. The effect objects are generated on the author's PC from the game's own cut-in
# effects by research/scripts/*_ball_fx.py (never committed: research/mods/StrikersShots/README.md).
# The trigger copies the wind special-shot aura's row (like = "ega0075b"). Flight:
# content\techniques\celestial_saw_trajectory.toml.
# whs94180198519 is the row key of Inazuma Fantasy's Sierra celestial² (InazumaFantasy.celestial_saw_cuts): `when`
# takes game ids only. It derives from that move's name. Without Inazuma Fantasy no shot has it and it never matches.
schema = "VRFW.effect/1"

[[effect]]
name = "celestial_saw"
from = "ega0075b"
object = "effect/event/ev60/ev6291cs00/ev6291cs00.objbin"

[[shot_aura]]
name = "celestial_saw"
spawn_fade = true
when = { techniques = ["whs02910", "whs94180198519"] }
aura = "celestial_saw"
like = "ega0075b"
