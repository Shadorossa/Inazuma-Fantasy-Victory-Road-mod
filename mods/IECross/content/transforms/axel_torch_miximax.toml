schema = "VRFW.transform/2"
if_mod = "all_miximaxed"                 # All Miximaxed (CharacterReforged › AuraOverhaul option): optional, mod.toml `optional`
# Axel Blaze x Torch, the ideal miximax of Inazuma Eleven Cross: its look is this mod's red-haired Axel Blaze
# (content\characters\10_ie1\ievrcross_characters.toml, axel_blaze_cross), carried by All Miximaxed's generic miximax
# command (wmm_evt). Without that mod this file is not read and the character is only a normal recruitable player.

[[transform]]
name = "axel_x_torch"
kind = "miximax"
command = "wmm_evt"
source = { partner = "c02020900" }       # Torch
users = { characters = ["c01000100"] }   # Axel Blaze
look = { character = "IECross.axel_blaze_cross" }
