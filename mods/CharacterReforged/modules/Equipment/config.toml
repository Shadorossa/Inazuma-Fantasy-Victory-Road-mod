
[stats]
map = { tiro = "kick", regate = "control", "técnica" = "technique", bloqueo = "pressure", parada = "intelligence", aguante = "physical", velocidad = "agility" }
luck_key = "suerte"

[scale]

[drops]
kinds = ["gloves"]

[[mod_shops]]
why = "Inazuma Fantasy's training shop"
mod = "InazumaFantasy"
shop = "InazumaFantasy.training_shop"
rule = "research/mods/InazumaFantasy/_general_store.toml"
rows = "research/mods/InazumaFantasy/content/shops/training_shop.toml"

[shape]
trade_tiers = ["big"]
three_from_rank = 0.5
main_share = 1.5
swap_ratio = 0.75
fill_weight = 0.4

[penalty]
original_rank = { small = 0.34, big = 0.67 }

[names]
team_stem_min = 3
team_series = { go = "04", cs = "05", galaxy = "06" }
ja_kind_words = ["シューズ", "グローブ", "ミサンガ", "ペンダント", "ブレスレット", "ネックレス"]

# per language: the retail name of one kind -> the name of the other (regular expressions, Python syntax)
swap.es = [
    { from_kind = "boots", to_kind = "gloves", pattern = "^(Botas|Zapatillas|Deportivas|Sandalias|Tacos) ", replace = "Guantes " },
]
swap.en = [
    { from_kind = "boots", to_kind = "gloves", pattern = " (Boots|Shoes|Sneakers|Sandals|Spikes)$", replace = " Gloves" },
]
swap.fr = [
    { from_kind = "boots", to_kind = "gloves", pattern = "^(Crampons|Chaussures|Baskets|Sandales) ", replace = "Gants " },
]
swap.de = [
    { from_kind = "boots", to_kind = "gloves", pattern = "-?(Schuhe|Stiefel|Sandalen)$", replace = "-Handschuhe" },
]
swap.it = [
    { from_kind = "boots", to_kind = "gloves", pattern = "^(Scarpini|Scarpe|Sandali) ", replace = "Guanti " },
]
swap.pt = [
    { from_kind = "boots", to_kind = "gloves", pattern = "^(Chuteiras|Sapatos|Ténis|Tênis|Sandálias) ", replace = "Luvas " },
]
swap.ja = [
    { from_kind = "boots", to_kind = "gloves", pattern = "シューズ$", replace = "グローブ" },
]
swap.zh_hans = [
    { from_kind = "boots", to_kind = "gloves", pattern = "(球鞋|之鞋|鞋)$", replace = "手套" },
]
swap.zh_hant = [
    { from_kind = "boots", to_kind = "gloves", pattern = "(釘鞋|球鞋|之鞋|鞋)$", replace = "手套" },
]

# the name of an item of each kind around a stem of research/data/equipment_classic_names.toml (unofficial names)
