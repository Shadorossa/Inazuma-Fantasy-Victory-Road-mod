# BetterUI match HUD layout: display-only moves / scales / hides of retail HUD layers (command cluster, guides, LB
# tactics ring, «Modo Comandante», area banners, zone time line, buff row). Wrappers of retail globals only; engine
# calls only inside callbacks. Must run after any patch that replaces OnInit / OnSetupLayer / PostStep unchained.
name = "hud_layout"
order = 910
module = "lua_bridge"
mod = "BetterUI"
requires = []
conflicts = []
wraps = ["OnInit", "OnSetupLayer", "OnOpenLayer", "PostStep", "Step", "UpdateAnimeMoveOffsetCmdBase", "OnStartOpponentSkillSelect", "SetupBaseCmdInfo", "ResetBaseCmdInfo", "SetupAreaTitle", "SetupZoneExecChara", "SetDashButtonGuideStatus",
         "SetDashAttackButtonGuideStatus", "SetCursorSpeedUpButtonGuideStatus", "SetRunAuraSlotButtonGuideStatus",
         "SetAttachButtonGuideStatus", "UpdateZoneLimitTimer",
         "UpdateFocusCountDownTimer", "UpdateSkillDecideCountDownTimer"]
description = "BetterUI: match HUD guides moved / scaled, dash guides hidden, LB ring mirrored left, buff row centred"

[[files]]
stem = "soccer_command_action_menu"

  [[files.ops]]
  type = "append_block"
  source = "hud_layout_cmd.lua"
  marker = "hud_layout"

[[files]]
stem = "soccer_battle_command_action_menu"

