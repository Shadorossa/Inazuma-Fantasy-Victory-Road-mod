# The Battle Bay «Torneo» as native data (schema VRFW.game/1, docs/internal/native.md).
schema = "VRFW.game/1"

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_TOURNAMENT_INFO"
handler = "BattleBayDeluxe.TournamentInfo"
needs = ["session"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_TOURNAMENT_ARM"
handler = "BattleBayDeluxe.TournamentArm"
needs = ["session"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_TOURNAMENT_DISARM"
handler = "BattleBayDeluxe.TournamentDisarm"
needs = ["session"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_TOURNAMENT_SYNC"
handler = "BattleBayDeluxe.TournamentSync"
needs = ["session"]

[[VRFW.Command]]
# page (-1 = the first) -> the overlay's view (scripts/lib/tourney_view.lua)
name = "CMND_BATTLEBAYDELUXE_TOURNAMENT_VIEW"
handler = "BattleBayDeluxe.TournamentView"
needs = ["session"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_TOURNAMENT_CAMPAIGN_INFO"
handler = "BattleBayDeluxe.TournamentCampaignInfo"
needs = ["session"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_TOURNAMENT_ABANDON"
handler = "BattleBayDeluxe.TournamentAbandon"
needs = ["session"]

[[VRFW.Command]]
# -> true: an ended run (champion / out) shown once, forgotten (its blob went when it ended)
name = "CMND_BATTLEBAYDELUXE_TOURNAMENT_CLOSE"
handler = "BattleBayDeluxe.TournamentClose"
needs = ["session"]

[[VRFW.Command]]
# -> table { event = "step" | "over" | "none" }: after an elimination, the next remaining round simulated and saved
name = "CMND_BATTLEBAYDELUXE_TOURNAMENT_STEP"
handler = "BattleBayDeluxe.TournamentStep"
needs = ["session"]

[[VRFW.Command]]
# -> table { ok, why, event, gf, ga }: the League hub's «Simular»: the player's next league match simulated and saved
name = "CMND_BATTLEBAYDELUXE_TOURNAMENT_SIM"
handler = "BattleBayDeluxe.TournamentSim"
needs = ["session"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_TOURNAMENT_START"
handler = "BattleBayDeluxe.TournamentStart"
needs = ["session"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_TOURNAMENT_PREPARE"
handler = "BattleBayDeluxe.TournamentPrepare"
# a league home match reads the player team's enjoy row (its own stadium)
needs = ["session", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_TOURNAMENT_UNLOAD"
handler = "BattleBayDeluxe.TournamentUnload"
needs = ["session"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_TOURNAMENT_STILL_IN"
handler = "BattleBayDeluxe.TournamentStillIn"
needs = ["session"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_TOURNAMENT_PICK"
handler = "BattleBayDeluxe.TournamentPick"
needs = ["session"]

[[VRFW.Struct]]
name = "LeagueTeamRecord"
size = 0x30
fields = { formation = { at = 0x18, type = "u32" }, kit = { at = 0x1C, type = "u32" }, emblem = { at = 0x20, type = "u32" } }

[[VRFW.Command]]
# -> table { ok, why, kind ("copy" / "own" / "draft"), team, formation, level, emblem, members = { { slot, param } … } }
name = "CMND_BATTLEBAYDELUXE_LEAGUE_SQUAD"
handler = "BattleBayDeluxe.LeagueSquad"
needs = ["session", "Team.FindConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "LeagueTeamRecord"]

[[VRFW.Command]]
# formation, "position:param,…" (dock positions 0-18 of the team's players) -> table { ok, why, changed }
name = "CMND_BATTLEBAYDELUXE_LEAGUE_SQUAD_SET"
handler = "BattleBayDeluxe.LeagueSquadSet"
needs = ["session", "Team.FindConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "LeagueTeamRecord"]
