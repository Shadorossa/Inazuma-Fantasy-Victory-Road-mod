#                                       content\models\props\tiger_fang + content\characters\tiger_fang_model.toml the tiger (ev63_86020),
#                                       made by research/scripts/tiger_fang_model_build.py (_deploy.toml); content\shops\own_skills.toml its manual
# LegendaryAd's thirty skills (formerly the mod Hissatsu Revamp, merged here; same keys whs9xxxx / who9xxxx / whd9xxxx /
# whk9xxxx, so learned skills stay), written by research/scripts/hissatsu_revamp_build.py from the download; names in
# the nine languages: _hissatsu_revamp_names.toml (developer file):
#   content\techniques\<name>.toml      one file per skill, each a clone of a retail skill
#   assets\event\, assets\event_cfg\    their events (packs, cameras, light files, evt / eff / snd lists), native;
#                                       content\base_tables\event\, event_cfg\ the light / command deltas of four of them
#   content\models\effects|props|items\ + assets\models\...   effect objects, ball auras, skill models, native
#   content\base_tables\gamedata\character\   the skill models' chara_base / chara_model rows
#   content\base_tables\gamedata\skill\, content\base_tables\effect\   four own ball colours (colour rows 10-13)
#   content\effects\auras.toml          aura statuses (recolour copies of retail auras)
#   content\telops\any\, en\            the name banners; text\rows\skill_text.toml the pinned names of four of them
#   content\shops\own_skills.toml       their manuals in the Special Moves shop, tab of their skill type
# content\gacha\chronicle_deluxe_kizuna_coin.toml in Chronicle Deluxe's board gacha (1.8.0;
#                                       nothing without Chronicle Deluxe); content\base_tables\gamedata\soccer\soccer_drop_config.toml:
# his character in that gacha's drop-rate list (if_mod ChronicleDeluxe)
# the IE3 / Galaxy formations moved to Better QoL (BetterQoL\content\formations\series_formations.toml)
# Graft (research/grafts): inazuma_fantasy_general_store (the Mercado entries, market_menu: its shops first, a retail
# shop whose every row is hidden left out).
# lua_early: the graft is a merge-path patch of market_menu; early, the later wrappers of that script stay on top of it.
lua_early = true
# 2.3: the «Rival del día» row shows a «?» crest and «?» player cards (content\images\menu\102_team\daily_rival_unknown.toml,
# assets\images\teams\emblems\daily_rival_unknown.png), no BetterMenu pitch players for it, and beating the day's
# rival pays config.toml [daily_legendary_rival] reward Puntos de pasión once per day (shown in its guide line).
# 2.2: the «Rival del día» row hides the day's team in the list (own name, no crest, blank player slots); the stand-in
# happens when the row is chosen, so only the VS screen and the match show it.
# 2.1 (VRFW 3.8: [VRFW.RivalLevel], per-team free-match classes): the Daily Legendary Rival, first row of the free-match
# section: one rival a day for everyone (UTC day, VRFW.rng), BATALLA LEGENDARIA only, Nv. 250 (scripts\daily_legendary_rival.lua,
# content\teams\daily_legendary_rival.toml, assets\lua\soccer_vs_cpu_list_menu\280_daily_legendary_rival.lua).
# 1.32.2 (VRFW 2.475.74: MatchExp to_level_cap / win_only): a win against Punishment at Nv. 50 gives every player of the
# match result the EXP to the level cap (content\match_exp\punishment_exp.toml). Removed in 2.34: a win there pays the game's EXP.
# 1.30.0: the free-match section's classes are INAZUMA Nv. 50, ZONA LETAL Nv. 99 and Nv. 200 (rows 6 / 7 / 9), as Chronicle Deluxe's.
# 1.29.0: the free-match section lists only Punishment and Crossed Japan; the Leyenda Viva and Llama Eterna teams are removed.
# 1.27.0 (VRFW 2.274.0: section pages): the section on page 2 of
# (content\teams\free_match_section.toml) with Leyenda Viva, Llama Eterna, Punishment (ported from the earlier IF)
# and Crossed Japan, classes 7 / 8 / 9 at Nv. 50 / 125 / 200, listed from the start.
# 1.6.0: the crests the game's Batalla heroica gives (first clear, difficulty 4) are no longer sold in the General Store;
# with Chronicle Deluxe, every crest its battles give is sold only while that mod is off (_general_store.toml [sources]).
# 1.5.0 (VRFW 2.4.142: [[VRFW.MatchDropRemove]] AllSources): no Piedra de la victoria from any match prize,
# drop or other grant (content\items\currencies.toml).
# 1.4.3 (VRFW 2.4.147: [[VRFW.ShopRedirect]]): the emptied shops' menu entries open the General Store.
# 1.4.2 (VRFW 2.4.146: [[VRFW.ShopTab]], [[edit]] hide_unknown_items): one move shop with a tab per move type;
# the titles in the General Store. 1.4.1 (VRFW 2.4.141: [[edit]] hide_spirits): the player spirit rows hidden.
# 1.3.3 (VRFW 2.4.133: [[VRFW.MatchDropExtra]]): every match pays Puntos de pasión at its end.
# 1.16.0 (VRFW 2.140.0: [[VRFW.DropFilter]] Sources = ["chests"], Exclude = "unused_shop_currencies"): no chest gives a
# shop currency no shop charges any more (content\items\currencies.toml).
requires = ["VRFW>=0.2.4"]
optional = ["BattleBayDeluxe", "BetterMenu", "BetterQoL", "CharacterReforged", "ChronicleDeluxe", "ClassicRecruitment"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
