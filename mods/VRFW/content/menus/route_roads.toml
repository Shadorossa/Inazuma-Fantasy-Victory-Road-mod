schema = "VRFW.menu/2"

[[object]]
name = "vrfw_route_road"
from = "cmn01_10_new_icon"
priority = 50
add = [{ block = "CMenuRenderComponent", parameter = "m_drawType", values = [1] }]

[[object]]
name = "vrfw_route_map"
from = "vsroute01_01_route_map"
copy = [{ parameter = "NullLayerNameAllIndex", match = { 3 = 0xEE90FDDF }, values = { 3 = 0x36F99309 } }]   # vsroute00_05_town_map_piece -> vrfw_route_road

[[patch]]
menu = "vs_route_town_menu"
layer = "vsroute00_01_01_route_map"
object = "vrfw_route_map"

# the pieces' row flags (attached to the map, opened with it)
[[patch]]
menu = "vs_route_town_menu"
add_layer = { name = "vrfw_route_road", object = "vrfw_route_road", count = 64, align = [0, 0], scale = 1, after = "vsroute00_01_02_post_effect", groups = [{ group = "vs_route_town_menu", flags = [0, 1, 2, 0, 0, 0], after = "vsroute00_01_02_post_effect" }] }
