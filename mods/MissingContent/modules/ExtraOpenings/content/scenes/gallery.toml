schema = "VRFW.gallery/1"
# Extra Openings' gallery (docs/framework/types/gallery.md): the «Inazuma Eleven» tab of the scene archive (club room)
# and the two Nintendo DS openings, shown in that tab and offered in the framework's «Opening» row. Each opening plays its
# USM (assets\data\dx11\movie\) with the song of the game's text language (content\sounds\sounds.toml); languages
# without a song get DefaultLanguage's. ArchiveKey / OpeningKey / TemplateMovie / TemplateEvent keep the ids, movie rows
# and event rows the mod had before the gallery type (a saved «Opening» choice stays valid). Thumbnails:
# assets\data\dx11\menu\220_img\theater_img\<ArchiveKey>.g4tx.

# Shared by name: another mod's videos with Tab = "inazuma_eleven" join this tab.
