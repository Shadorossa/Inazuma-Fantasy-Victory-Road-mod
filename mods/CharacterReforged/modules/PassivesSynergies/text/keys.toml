mod_description = "每名球员都有一个无法更换的专属被动（可用选项「专属被动」关闭），另有通用的属性被动，可强化他同属性的必杀技。队伍协同改为要求某支队伍或某个群体，而不是指定角色，新协同带有专属图标；面板会显示还缺哪些人。"
