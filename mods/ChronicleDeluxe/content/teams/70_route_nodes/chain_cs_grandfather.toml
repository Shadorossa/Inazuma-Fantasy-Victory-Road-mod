    Win = "tm_cro_legend_GO2_10"       # Canes Escarlata, the match before this lock

  [[VRFW.Chain.Tile]]
  Id = "c22"
  Kind = "chest"
  Pos = [5, 3]                         # 3DS cell 22
  Links = ["c19"]
