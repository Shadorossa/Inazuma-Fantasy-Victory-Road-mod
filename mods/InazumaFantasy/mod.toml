id = "InazumaFantasy"
# name / description: the English fallback; the screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml).
name = "Inazuma Fantasy"
version = "0.2.4"
author = "Fantasy Team"
author_steam = "76561199013321372"
description = "Inazuma Fantasy. The Market gets its own shops, priced in Passion Points that every match pays: a general store, a training shop and two special move shops, with a padlock on what is not unlocked yet. It adds Fantasy Idol cards, the Inazuma Fantasy title screen, a free match section with two mod teams and a daily legendary rival. New special moves, including 30 by LegendaryAd and God Strike, and an Arion military outfit are sold in the shops."
priority = 0
tags = ["Gameplay"]
updated = "2026-11-06"
prefix = "InazumaFantasy"
folder = "InazumaFantasy"
# A new mod. The earlier Inazuma Fantasy (id inazuma_fantasy) is kept apart in research/mods/_aside/; this
# id is new so that its saved data, its grafts and the other mods' `if_mod = "inazuma_fantasy"` rows stay with it.
#   content\base_tables\gamedata\post\post_notice_config.toml  the notices of «Información»: the first one shows the
#                                       mod's banner (content\images\menu\220_img\banner_img, GENERATED:
#                                       research/scripts/inazuma_fantasy_notice_banner.py), the compensation one is out
#   content\base_tables\gamedata\post\advent_calendar_config.toml  the advent calendar gets a big card on 05/11 with the
#                                       mod's art, the retail cards stay (content\images\menu\220_img\calendar_img,
#                                       GENERATED: research/scripts/inazuma_fantasy_advent_card.py), loaded with the
#                                       menu by content\menus\advent_calendar_menu.toml
#   _general_store.toml                 the shops' rule (developer file, not installed)
#   content\shops\general_store.toml, training_shop.toml, technique_shop.toml
