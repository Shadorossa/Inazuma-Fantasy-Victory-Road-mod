# cells = { name_text = 0x99F4F169, desc_text = 0xCC62233B, linked_skill = 0x944CA8F2, aura_chara = 0xA6BB68CC, order = 108 }
# charas = []
# ```

# Devoramentes: its keshin shot is Golpe del olvido (content/techniques/oblivion_strike.toml).
[[aura_command]]
key = "wks_fantasy_me000010"
from = "wks02010"
manual = true
cells = { name_text = 0xABA6C2A6, desc_text = 0xFE3010F4, aura_chara = 0x66DD9C45, order = 109 }
charas = []

# This warrior spirit is off for this version, and removing the comment marks brings it back.
