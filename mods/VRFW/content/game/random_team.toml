schema = "VRFW.game/2"

# Random team (schema VRFW.random_team/1, content\random_teams\*.toml; run time scripts\random_team.lua).

[[VRFW.Struct]]
name = "RandomTeamRecord"
game = "TeamRecord"
fields = { Level = { at = 0x4, type = "u16" }, NameText = { at = 0x14, type = "u32" }, Formation = { at = 0x18, type = "u32" }, Uniform = { at = 0x1C, type = "u32" }, Emblem = { at = 0x20, type = "u32" } }

# team_config container: record array +0x48 (stride 0x50), count +0x50.
[[VRFW.Struct]]
name = "RandomTeamConfig"
game = "TeamConfig"
fields = { Records = { at = 0x48, type = "ptr" }, RecordCount = { at = 0x50, type = "i32" } }

[[VRFW.Struct]]
name = "RandomTeamMember"
game = "MemberRow"
fields = { Skill = { at = 0x28, type = "u32" }, LevelOffset = { at = 0x44, type = "i16" }, Step = { at = 0x46, type = "i8" } }

[[VRFW.Command]]
name = "CMND_VRFW_RANDOM_TEAM_BUILD"
handler = "RandomTeam.Build"
needs = ["Team.FindConfig", "RandomTeamRecord", "RandomTeamMember"]

[[VRFW.Command]]
name = "CMND_VRFW_RANDOM_TEAM_PREVIEW"
handler = "RandomTeam.Preview"
needs = ["Team.FindConfig", "RandomTeamRecord", "RandomTeamMember"]

[[VRFW.Command]]
name = "CMND_VRFW_RANDOM_TEAM_MEMBER"
handler = "RandomTeam.Member"

[[VRFW.Command]]
name = "CMND_VRFW_RANDOM_TEAM_LOOK"
handler = "RandomTeam.Look"

[[VRFW.Command]]
name = "CMND_VRFW_RANDOM_TEAM_LOOK_OF"
handler = "RandomTeam.LookOf"

[[VRFW.Command]]
name = "CMND_VRFW_RANDOM_TEAM_INFO"      # (rule) -> ok, version, slot teams, stage rows
handler = "RandomTeam.Info"

[[VRFW.Command]]
name = "CMND_VRFW_RANDOM_TEAM_RESTORE"
handler = "RandomTeam.Restore"
needs = ["Team.FindConfig", "RandomTeamRecord", "RandomTeamMember"]

[[VRFW.Command]]
name = "CMND_VRFW_TEAM_LINEUP"
handler = "TeamLineup.Set"
needs = ["Team.FindConfig", "RandomTeamRecord", "RandomTeamMember"]

# (team id) -> the team's kit (uniform id of its record; 0 = none): the pose row screen dresses a row's players in it
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_KIT"
handler = "TeamLineup.Kit"
needs = ["Team.FindConfig", "RandomTeamRecord"]

[[VRFW.Command]]
name = "CMND_VRFW_TEAM_LEVEL"
handler = "TeamLineup.Level"
needs = ["Team.FindConfig", "RandomTeamRecord", "RandomTeamMember"]

# (team id, 0 = every team) -> true, rows: the level offsets CMND_VRFW_TEAM_LEVEL wrote back to the data's
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_LEVEL_RESTORE"
handler = "TeamLineup.LevelRestore"
needs = ["RandomTeamMember"]

[[VRFW.Command]]
name = "CMND_VRFW_TEAM_ROSTER"
handler = "TeamLineup.Roster"
needs = ["Team.FindConfig", "RandomTeamRecord", "RandomTeamMember"]

# (team id, 0 = every team) -> true, rows: the data's cards back in the rows CMND_VRFW_TEAM_ROSTER wrote
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_ROSTER_RESTORE"
handler = "TeamLineup.RosterRestore"
needs = ["Team.FindConfig", "RandomTeamRecord", "RandomTeamMember"]

[[VRFW.Command]]
name = "CMND_VRFW_TEAM_STAND_IN"
handler = "TeamLineup.StandIn"
needs = ["Team.FindConfig", "RandomTeamRecord", "RandomTeamMember", "RandomTeamConfig"]

# (slot team id, 0 = every one) -> true, teams: the slot team's rows, slice and record back
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_STAND_IN_RESTORE"
handler = "TeamLineup.StandInRestore"
needs = ["Team.FindConfig", "RandomTeamRecord", "RandomTeamMember"]

[[VRFW.Command]]
name = "CMND_VRFW_TEAM_STAND_IN_FORMATION"
handler = "TeamLineup.StandInFormation"
needs = ["RandomTeamRecord"]

[[VRFW.Command]]
name = "CMND_VRFW_TEAM_STAND_IN_LOOK"
handler = "TeamLineup.StandInLook"
needs = ["RandomTeamRecord", "RandomTeamMember"]

# (team id, base level (0 = the team record's), level…) -> true, rows | false, why: the member rows in roster slots 0..
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_MEMBER_LEVELS"
handler = "TeamLineup.MemberLevels"
needs = ["Team.FindConfig", "RandomTeamRecord", "RandomTeamMember", "RandomTeamConfig"]

[[VRFW.Command]]
name = "CMND_VRFW_TEAM_LOOK"
handler = "TeamLineup.Look"
needs = ["Team.FindConfig", "RandomTeamRecord", "RandomTeamConfig"]

[[VRFW.Command]]
name = "CMND_VRFW_TEAM_LOOK_SET"
handler = "TeamLineup.LookSet"
needs = ["Team.FindConfig", "RandomTeamRecord"]

[[VRFW.Command]]
name = "CMND_VRFW_TEAM_MEMBER_MOVES"
handler = "TeamLineup.MemberMoves"
needs = ["Team.FindConfig", "RandomTeamRecord", "RandomTeamMember"]

# (team id, roster slot, loadout id, move1..6, level1..6) -> true | false, why: the member plays that set; loadout 0 = his own back
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_MEMBER_SET_MOVES"
handler = "TeamLineup.MemberSetMoves"
needs = ["Team.FindConfig", "RandomTeamRecord", "RandomTeamMember"]

[[VRFW.State]]
key = "VRFW.team_lineup.match_teams"

# u64 StartMatchRequest(scene, request): the generic «start this match» of every mode (as level_sync.toml).
[[VRFW.Hook]]
name = "TeamLineup.MatchRequest"
kind = "function"
pattern = "48 89 5C 24 18 48 89 74 24 20 55 57 41 56 48 8D 6C 24 90 48 81 EC 70 01 00 00 48 8B 05 ?? ?? ?? ?? 48 33 C4 48 89 45 60 8B 42 6C"
rva = 0x17C9400
steal = 14
arguments = ["ptr", "ptr"]
returns = "u64"

[[VRFW.Hook.answer]]
phase = "pre"
value = "[args[2] + 0xA4]:u32"
write = "[state(VRFW.team_lineup.match_teams)]:u32"

[[VRFW.Hook.answer]]
phase = "pre"
value = "[args[2] + 0xA8]:u32"
write = "[state(VRFW.team_lineup.match_teams) + 4]:u32"

[[VRFW.Command]]
name = "CMND_VRFW_MATCH_MEMBER"
handler = "TeamLineup.MatchMember"
needs = ["Team.FindConfig", "RandomTeamRecord", "RandomTeamMember"]
