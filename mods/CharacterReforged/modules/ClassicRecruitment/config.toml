# Classic Recruitment's defaults; the loader's [mods.ClassicRecruitment] overrides them key by key.

[office]
requirements = false

[album]
currency = "tk_hr000008"
# the currency's icon atlas (sprite = the currency's name), shown on the album rows
icon_atlas = "#/menu/200_icon/02_icon_item/icon_item10.g4tx"
value_file = "content/contact_maps/office_terms.toml"
base = 30
per_value = 8
per_level = 0.5
level_cap = 99
# factor per card rarity of the album row; a rarity not listed = 1
[album.rarity_factor]
"5" = 1.5
"6" = 2
"7" = 2.5

[match_drops.friendship]
win = 12
draw = 6
loss = 0
per_goal = 2
per_goal_margin = 2
