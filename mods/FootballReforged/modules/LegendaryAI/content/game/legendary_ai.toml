schema = "VRFW.game/2"

# ------------------------------------------------------------------------------------------------ globals

# The match info block [[g_gameRoot]+0x6A58] (+0x2C29 the user's team)
[[VRFW.Global]]
name = "legendary_ai_match_info"
base = "game_root"
chain = ["ROOT_MATCH"]

# [g_focusMgr]: the focus battle manager (+0xB08 the duel's result kind: 6 = a power charge / power block)
[[VRFW.Global]]
name = "legendary_duel"
game = "Duel.Manager"

# ------------------------------------------------------------------------------------------------ structs

# The match info block (legendary_ai_match_info): UserTeam = the user's team.
[[VRFW.Struct]]
name = "LegendaryAIMatchInfo"
game = "MatchInfo"

# The focus duel manager (legendary_duel): ResultKind = the duel's result (6 = a power charge or power block).
[[VRFW.Struct]]
name = "LegendaryDuel"
game = "DuelManager"

# The contact request the foul chance reads (its first argument): Kind and Offender.
[[VRFW.Struct]]
name = "LegendaryFoulRequest"
game = "FoulRequest"

# ------------------------------------------------------------------------------------------------ the foul chance

# The game's Match.FoulRate: the chance that a contact is a foul.
[[VRFW.Hook]]
name = "LegendaryAI.FoulRate"
game = "Match.FoulRate"
kind = "function"
arguments = ["ptr"]
returns = "f32"
post_when = [{ value = "ret", not = 0 }]

# ------------------------------------------------------------------------------------------------ the AI difficulty

[[VRFW.State]]
key = "LegendaryAI.ai_difficulty"
value = 3
