schema = "VRFW.game/2"

# void Match.EndPrizes(u8) 0x16A7A90: the end-of-match result builder.
[[VRFW.Hook]]
name = "MatchExp.Result"
game = "Match.EndPrizes"
kind = "function"
arguments = ["u8"]
apply = "script"

# The match's result block (Match.EndPrizes's entries and total).
[[VRFW.Global]]
name = "MatchExpResultBlock"
base = "game_root"
chain = ["Game.RootMatchResult"]

# The match info: +4 the game id, +0x15 the difficulty row, +0x2C26 / +0x2C27 the scores, +0x2C29 the user's side.
[[VRFW.Global]]
name = "MatchExpInfo"
base = "game_root"
chain = ["Game.RootMatch"]

# The two match teams: +0x1E0 = team 0 (team 1 at +0x4A8), members at +0x80 ..
[[VRFW.Global]]
name = "MatchExpParty"
base = "game_root"
chain = ["Game.RootParty"]

[[VRFW.Global]]
name = "MatchExpFlags"
base = "game_root"
chain = ["Game.RootFlags"]

[[VRFW.Command]]
name = "CMND_VRFW_TROPHY_INFO"
handler = "Trophy.details"
needs = ["MatchExpInfo"]
