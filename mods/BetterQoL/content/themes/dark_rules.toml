schema = "VRFW.theme_rules/1"
theme = "dark"
# the club stats panel (its own atlas inside the art folder)
include = ["dx11/menu/220_img/betterqol_club_stats"]

# club stats panel: rows take the card colour, bands / selection / focus the accent, panel the background
[[sprite]]
match = "betterqol_club_stats_row*"
class = "surface"
file = "betterqol_club_stats/"
[[sprite]]
match = "betterqol_club_stats_album_row*"
class = "surface"
file = "betterqol_club_stats/"
# the album row's status bar: its blue and red mean owned and not owned
[[sprite]]
match = "betterqol_club_stats_album_*_bar"
class = "keep"
file = "betterqol_club_stats/"
[[sprite]]
match = "betterqol_club_stats_panel"
class = "bg"
file = "betterqol_club_stats/"
[[sprite]]
match = "betterqol_club_stats_head"
class = "accent"
file = "betterqol_club_stats/"
[[sprite]]
match = "betterqol_club_stats_section_*"
class = "accent"
file = "betterqol_club_stats/"
[[sprite]]
match = "betterqol_club_stats_sel"
class = "accent"
file = "betterqol_club_stats/"
[[sprite]]
match = "betterqol_club_stats_focus*"
class = "accent"
file = "betterqol_club_stats/"
[[sprite]]
match = "betterqol_club_stats_facebox"
class = "panel"
file = "betterqol_club_stats/"
[[sprite]]
match = "betterqol_club_stats_sbar"
class = "accent"
file = "betterqol_club_stats/"
[[sprite]]
match = "betterqol_club_stats_sthumb"
class = "accent"
file = "betterqol_club_stats/"
[[sprite]]
match = "betterqol_club_stats_cursor"
class = "keep"
file = "betterqol_club_stats/"
# the passive card being edited (the retail card on a cyan rim): the card colour, the rim the accent
[[sprite]]
match = "betterqol_passive_card_sel"
class = "surface"
file = "better_qol_own/better_qol_soccer11_20"
