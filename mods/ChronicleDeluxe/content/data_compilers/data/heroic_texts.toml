# The words of the heroic battles' player rules, read by the data compiler builder heroic_battles (Settings text_templates).
# Build time: {g} = the series' short name, {name} = the required player, {p} = his places.
# Shown time (filled from each challenge's TextValues): <GAME> = the series' short name, <SERIES> = its full name, <VALUE> = the minimum of players, <VALUE2> = the per-season maximum.
languages = ["es", "en", "fr", "de", "it", "pt", "ja", "zh_hans", "zh_hant"]

# What a created kit's name gets after it when another kit already has that name ({g} = the series' short name).
[kit_name_suffix]
es = " ({g})"
en = " ({g})"
fr = " ({g})"
de = " ({g})"
it = " ({g})"
pt = " ({g})"
ja = "（{g}）"
zh_hans = "（{g}）"
zh_hant = "（{g}）"

# The formation places' abbreviations of the required player's text; `default` serves every other language.
[places.default]
gk = "GK"
df = "DF"
mf = "MF"
fw = "FW"

[places.es]
gk = "PO"
df = "DF"
mf = "MC"
fw = "DL"

