schema = "VRFW.text_key/1"
# Texts of «Signature Passives» (mod PersonalPassives): the «Mods» screen's name
# and description. The words of the passives' descriptions are the framework's (VRFW text\passive.toml).
default_lang = "en"

[en.new]
mod_name = "Personal Passives"
mod_description = "Each player has a Signature Passive of his own, set per character by the mods, instead of one you equip: the passive slot always shows it, cannot be changed, and matches use it. It also adds the generic elemental passives (Wind, Forest, Fire, Mountain, Void), which make a player's own moves of that element 15% stronger. Passives are built from reusable blocks that mods can edit per character, and the same system powers the passives other mods give to spirits. Needs Character Reforged."
