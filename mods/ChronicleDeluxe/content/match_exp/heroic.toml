schema = "VRFW.match_exp/1"
# Chronicle Deluxe: the EXP of the Batalla heroica and of this mod's chains. The mechanism is the VR-Framework's
# ([[VRFW.MatchExp]], docs/framework/match-exp.md); the Crónica and every other match keep the game's EXP.
#
# Each player of the squad (the manager row too, at his own level) rises
#   levels × the gap rate (his level − the rival team's level) × the rank rate
# levels, as the EXP of the levels he passes, and a player below the rival never goes above the rival's level from one
# match. The gap rates (Trails-like): far below the rival a big bonus, near it the normal rise, above it a steep
# falloff (×0.5 at +1, ×0.2 at +3, ×0.05 from +5 on). The rank rates: S ×1.25, A ×1.0, B ×0.75; a loss or a draw
# ×0.5. The bench keeps its share of the game's EXP (retail_share).

# The Batalla heroica (difficulty 4) of every Chronicle board piece: the game's pieces and the route nodes.
# The rivals scale up to Lv 200, so far below the rival a win rises up to 25 levels (rank A: 25 at 40+ levels below,
# 15 at 20, 10 at 10, 5 at 5, 2 at 2), never past the rival's level.
[[VRFW.MatchExp]]
name = "heroic"
games = ["fbtl_cro*", "evt_rn_*"]
difficulties = [4]
levels = 1.0
gap       = [-40,  -20,  -10,  -5,  -2,  0,   1,   2,   3,   4,   5]
gap_rates = [25.0, 15.0, 10.0, 5.0, 2.0, 1.0, 0.5, 0.3, 0.2, 0.1, 0.05]
rank_ids = ["S", "A", "B"]
rank_rates = [1.25, 1.0, 0.75]
no_rank_rate = 0.5
max_levels = 25.0
cap_at_rival = true

# The free-match class played at Lv 200 (the difficulty rows whose declared Level is 200, content\defaults# match_difficulty.toml): a win rises 30 levels, up to the rival's level (Lv 99 -> 200 in 4 wins). A loss or a draw
# keeps the game's EXP.
[[VRFW.MatchExp]]
name = "free_match_level_200"
games = ["*"]
difficulty_levels = [200]
levels = 30.0
max_levels = 30.0
cap_at_rival = true
retail_share = false
win_only = true

# The matches of this mod's chain boards, until the Destructores gate battle is won (piece 0x90185427 at difficulty 2,
# the win that gives the Master's Seal): after it, the chains give the game's EXP.
[[VRFW.MatchExp]]
name = "chains_before_destructores"
games = ["evt_ch_ie1_sonny_*", "evt_ch_ie2_marytimes_*", "evt_ch_ie2_rika_*"]
until_cleared_pieces = ["0x90185427"]
until_cleared_difficulty = 2
levels = 1.0
gap       = [-12, -8,  -4,  -2,  0,   1,   2,   3,   4,   5]
gap_rates = [3.0, 2.0, 1.5, 1.0, 1.0, 0.5, 0.3, 0.2, 0.1, 0.05]
rank_ids = ["S", "A", "B"]
rank_rates = [1.25, 1.0, 0.75]
no_rank_rate = 0.5
max_levels = 4.0
cap_at_rival = true
