[en.new]
mod_name = "BetterUI"
mod_description = "A cleaner match HUD and game menus: a compact translucent top bar, fewer markers and guides in matches, compact player cards and shop shortcuts (L2 / R2). Shirt numbers and AI roles can be set for the whole team. Rules, data and saves are untouched."
shop_switch = "Switch shop"
prematch_edit = "Edit"
prematch_data = "Data"
vs_preview = "Preview"
vs_basic_data = "Basic data"
duel_and_shot_counters = "Duel and AT / PP counters"
duel_and_shot_counters_help = "During special-move or rough-attack duels, each player's total; when shooting, the shot's total AT against the keeper's PP."
rival_gauges = "Rival gauges"
rival_gauges_help = "The rival's tension bar, kizuna % and hyper gauge show their real values, like yours. Off: hidden as in the original game."
skill_effects = "TECHNIQUE EFFECTS"
skill_effect_level = "Lv {n}"

[es.new]
mod_name = "BetterUI"
mod_description = "Un HUD de partido y unos menús del juego más limpios: barra superior compacta y translúcida, menos marcadores y guías en los partidos, cartas de jugador compactas y atajos de tienda (L2 / R2). Los números de camiseta y los roles de IA se ajustan para todo el equipo. No cambia reglas, datos ni partidas guardadas."
shop_switch = "Cambiar de tienda"
prematch_edit = "Editar"
prematch_data = "Datos"
vs_preview = "Previsualización"
vs_basic_data = "Datos básicos"
duel_and_shot_counters = "Contadores de duelos y AT / PP"
duel_and_shot_counters_help = "En los duelos de supertécnicas o ataque duro, el total de cada jugador; al tirar, el AT total del tiro frente a los PP del portero."
rival_gauges = "Indicadores del rival"
rival_gauges_help = "La barra de tensión, el % de vínculo y el indicador hiperdimensional del rival muestran sus valores reales, como los tuyos. Desactivado: ocultos como en el juego original."
skill_effects = "EFECTOS DE LA TÉCNICA"
skill_effect_level = "Nv {n}"

