# Declaration schema of the passives' buff icons (kind CharacterReforged.passive_icon/1, content\passive_icons\*.toml).
schema = "VRFW.decl_schema/1"
kind = "CharacterReforged.passive_icon/1"
folder = "content/passive_icons"
# v2 words, read beside the v1 ones until the switch: the type and its kind folder.
v2_type = "CharacterReforged.Passive.Icon"
v2_kind_folder = "Passives/Icons"
label = "Passive icons"
label_es = "Iconos de pasivas"
doc = "The buff icon each passive shows in the menus, and the icon for passives that improve one element's moves."
doc_es = "El icono de mejora que muestra cada pasiva en los menús, y el de las pasivas que mejoran las técnicas de un elemento."

[entry.PassiveIcon]
doc = "the buff icon of one passive"
passive = { type = "string", ref = "passive", required = true, doc = "the passive ([[VRFW.Passive]] name; <mod>.<name> for another mod's): its GamePassive block names the game passive the icon is drawn for" }
icon = { type = "string", required = true, doc = "the sprite drawn in the buff icon slot: a sprite name of the per-language icon_teambuff atlas, or of an own atlas a [[VRFW.SpriteRedirect]] serves for it" }
element = { type = "string", default = "", values = ["", "wind", "forest", "fire", "mountain", "void"], doc = "the element of the moves its effect improves (written by research/mods/CharacterReforged/_tools/own_passive_icons.py); the own passive card draws that element's icon ([[ElementIcon]])" }

[entry.ElementIcon]
doc = "the icon the own passive card draws for a passive whose effect improves the moves of one element"
element = { type = "string", required = true, values = ["wind", "forest", "fire", "mountain", "void"], doc = "the element" }
icon = { type = "string", required = true, doc = "the sprite: a sprite name of the per-language icon_teambuff atlas, or of an own atlas a [[VRFW.SpriteRedirect]] serves for it" }
