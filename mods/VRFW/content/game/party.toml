schema = "VRFW.game/2"

# Party / team sets (schema VRFW.game/2). The only framework detour is the party load event; mods name the game's party functions by profile name.

# ------------------------------------------------------------------------------------------------ party load

[[VRFW.Hook]]
name = "VRFW.PartyLoad"
game = "Party.Load"
kind = "function"
arguments = ["ptr", "ptr", "ptr", "ptr"]
returns = "u8"

[[VRFW.State]]
key = "vrfw.party.loads"
needs = ["VRFW.PartyLoad"]
