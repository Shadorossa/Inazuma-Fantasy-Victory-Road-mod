  cells = { "#5" = 4 }

  [[keyed.set]]
  key = 0x23DDDBCF                      # stat change preview
  cells = { "#5" = 4 }

  [[keyed.set]]
  key = 0x496DFB3D                      # stat change preview
  cells = { "#5" = 4 }

# 6 digit slots for the held-item counters (retail 5): a stack of up to 999999 (an item's max_stack) is drawn in full.

  [[keyed.set]]
  key = 0x80A0D941                      # num_shop_have01: the item cards and shop rows
  cells = { "#5" = 6, "#7" = -2 }

  [[keyed.set]]
