schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
option_duel_auras = "Open-duel auras"
option_duel_auras_help = "In a duel, an aura (keshin, totem, armour, Mix-Max...) never answers the rival's special move: the duel pauses, the aura plays and the duel goes on with the choice still open. Both teams, the CPU too. Applies after restarting the game."
option_technical_combo = "Technical Combo"
option_technical_combo_help = "The game's Technical Combo: winning focus battles with special moves raises the power of the next shot by up to 3 levels and lowers the tension cost of special moves. Off: no combo builds. Applies after restarting the game."
option_move_cooldown = "Special move cooldown"
option_move_cooldown_help = "On: a special move waits its recharge time before it can be used again, as in the game. Off: special moves can be used again right away, on both teams; they still cost tension and auras keep their recharge. Applies at once; a move already recharging finishes its time."
mod_name = "Football Reforged"
mod_description = "Match mechanics in modules you switch on or off in Mods: goalkeeper barrier, furor, home stadium, pressing, stoppage time and a legendary CPU. It also adds the Football 7, Inazuma Street and 5-a-side match formats, skill duels, auras in open duels and match challenges."
ruleset_football_7 = "7-a-side football (7 vs 7)"
ruleset_friendly_5v5_no_tactics_or_referee = "5-a-side friendly (no tactics or referee)"
ruleset_inazuma_street = "Inazuma Street (3 vs 3, no keepers or referee)"
ruleset_challenge_goals = "Challenge: 3 goals in 45 s"
ruleset_challenge_hold = "Challenge: keep the ball for 15 s"
ruleset_challenge_steal = "Challenge: steal the ball"

[es.new]
option_duel_auras = "Auras en duelos libres"
option_duel_auras_help = "En un duelo, un aura (keshin, tótem, armadura, Mix-Max...) nunca responde a la supertécnica del rival: el duelo se pausa, el aura se activa y el duelo sigue con la elección abierta. Para los dos equipos, también la CPU. Se aplica al reiniciar el juego."
option_technical_combo = "Combo técnico"
option_technical_combo_help = "El Combo técnico del juego: ganar batallas de concentración con supertécnicas sube la potencia del siguiente tiro hasta 3 niveles y baja el coste de tensión de las supertécnicas. Desactivado: no se acumula ningún combo. Se aplica al reiniciar el juego."
option_move_cooldown = "Enfriamiento de supertécnicas"
option_move_cooldown_help = "Activado: una supertécnica espera su tiempo de recarga antes de poder repetirse, como en el juego. Desactivado: las supertécnicas se pueden repetir al momento, en los dos equipos; siguen costando tensión y las auras mantienen su recarga. Se aplica al instante; una supertécnica que ya se esté recargando termina su tiempo."
mod_name = "Football Reforged"
mod_description = "Mecánicas de partido en módulos que activas o desactivas en Mods: barrera del portero, furor, estadio local, presión, tiempo añadido y una CPU legendaria. Añade además los formatos Fútbol 7, Inazuma Street y 5 contra 5, duelos de habilidad, auras en los duelos libres y retos de partido."
ruleset_football_7 = "Fútbol 7 (7 contra 7)"
ruleset_friendly_5v5_no_tactics_or_referee = "Pachanga 5 contra 5 (sin supertácticas ni árbitro)"
ruleset_inazuma_street = "Inazuma Street (3 contra 3, sin porteros ni árbitro)"
ruleset_challenge_goals = "Desafío: 3 goles en 45 s"
ruleset_challenge_hold = "Desafío: conserva el balón 15 s"
ruleset_challenge_steal = "Desafío: roba el balón"

[fr.new]
option_duel_auras = "Auras en duels libres"
option_duel_auras_help = "En duel, une aura (keshin, totem, armure, Mix-Max...) ne répond jamais à la supertechnique adverse : le duel se met en pause, l'aura se déclenche et le duel reprend avec le choix encore ouvert. Pour les deux équipes, le CPU aussi. S'applique au redémarrage du jeu."
option_technical_combo = "Combo technique"
option_technical_combo_help = "Le Combo technique du jeu : gagner des duels de concentration avec des supertechniques augmente la puissance du tir suivant jusqu'à 3 niveaux et réduit le coût en tension des supertechniques. Désactivé : aucun combo ne se forme. S'applique au redémarrage du jeu."
option_move_cooldown = "Recharge des techniques spéciales"
option_move_cooldown_help = "Activé : une technique spéciale attend son délai de recharge avant d'être réutilisée, comme dans le jeu. Désactivé : les techniques spéciales peuvent être réutilisées aussitôt, dans les deux équipes ; elles coûtent toujours de la tension et les auras gardent leur recharge. S'applique immédiatement ; une technique déjà en recharge termine son délai."
mod_name = "Football Reforged"
mod_description = "Des mécaniques de match en modules que tu actives ou désactives dans Mods : barrière du gardien, furor, stade à domicile, pressing, temps additionnel et une CPU légendaire. Elle ajoute aussi les formats de match Football 7, Inazuma Street et 5 contre 5, des duels d'habileté, des auras dans les duels libres et des défis de match."
ruleset_football_7 = "Football à 7 (7 contre 7)"
ruleset_friendly_5v5_no_tactics_or_referee = "Match amical à 5 (sans tactiques ni arbitre)"
ruleset_inazuma_street = "Inazuma Street (3 contre 3, sans gardiens ni arbitre)"
ruleset_challenge_goals = "Défi : 3 buts en 45 s"
ruleset_challenge_hold = "Défi : garde le ballon 15 s"
ruleset_challenge_steal = "Défi : vole le ballon"

[de.new]
option_duel_auras = "Auren in freien Duellen"
option_duel_auras_help = "Im Duell ist eine Aura (Keshin, Totem, Rüstung, Mix-Max...) nie die Antwort auf die Spezialtechnik des Gegners: Das Duell pausiert, die Aura wird ausgelöst und das Duell geht mit offener Wahl weiter. Für beide Teams, auch die CPU. Gilt nach einem Neustart des Spiels."
option_technical_combo = "Technik-Kombo"
option_technical_combo_help = "Die Technik-Kombo des Spiels: Fokus-Duelle mit Spezialtechniken zu gewinnen erhöht die Kraft des nächsten Schusses um bis zu 3 Stufen und senkt die Spannungskosten der Spezialtechniken. Aus: Es baut sich keine Kombo auf. Gilt nach einem Neustart des Spiels."
option_move_cooldown = "Abklingzeit für Spezialtechniken"
option_move_cooldown_help = "An: Eine Spezialtechnik wartet ihre Aufladezeit ab, bevor sie wieder eingesetzt werden kann, wie im Spiel. Aus: Spezialtechniken können sofort wieder eingesetzt werden, in beiden Teams; sie kosten weiterhin Spannung, und Auren behalten ihre Aufladezeit. Gilt sofort; eine Technik, die gerade auflädt, läuft noch zu Ende."
mod_name = "Football Reforged"
mod_description = "Spielmechaniken in Modulen, die du unter Mods ein- oder ausschaltest: Torwartbarriere, Furor, Heimstadion, Pressing, Nachspielzeit und eine legendäre CPU. Dazu kommen die Spielformate Fußball 7, Inazuma Street und 5 gegen 5, Fähigkeitsduelle, Auren in offenen Duellen und Spiel-Herausforderungen."
