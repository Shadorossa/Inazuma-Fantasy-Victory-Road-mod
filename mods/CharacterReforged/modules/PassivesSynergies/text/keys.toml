schema = "VRFW.text_key/1"
# The Mods screen's name, description and option row; passive and synergy texts are text\rows\.
default_lang = "en"

[en.new]
mod_name = "Passives & Synergies"
mod_description = "Each player has one passive of his own that cannot be swapped (switch it off with the «Own passives» option), plus generic elemental passives that make his moves of that element stronger. Team synergies ask for a team or a group instead of named characters, and new synergies come with their own icons; the panel shows who is still missing."
option_own_passives = "Own passives"
option_own_passives_help = "Each player gets his own passive in the custom passive slot, set per character by the mods. Off: the slot stays empty. Applies after restarting the game."
# the archetype tags (content\special_passives\signature_rules.toml)
