id = "Furor"
# name / description: the English fallback; the card shows the text keys mod_name / mod_description (text\keys.toml)
name = "Furor gauge"
version = "0.3.0"
author = "Fantasy Team"
description = "GO Strikers' furor gauge: a fire bar beside each crest fills as the match goes on, and when it is full, L3 / R starts a 24-second Fired up phase. Every player awakens to his position's look, moves hit harder and players run faster; the CPU uses it too."
priority = 0
tags = ["Gameplay"]
updated = "2026-11-09"
prefix = "Furor"
folder = "Furor"
# A module mod of Football Reforged (modules\Furor\).
requires = ["VRFW>=0.3.0", "FootballReforged>=0.3.0"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
permissions = ["command"]

[exports]
keys = ["Furor.gauge.start", "Furor.gauge.full", "Furor.cpu_driven", "Furor.gauge.rival.full", "Furor.gauge.user.full"]

[module]
of = "FootballReforged"
order = 20
