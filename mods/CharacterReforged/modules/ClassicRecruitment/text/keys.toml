schema = "VRFW.text_key/1"
# Classic Recruitment's texts: the Mods screen's name, description and option rows.
default_lang = "en"

[en.new]
mod_name = "Classic Recruitment"
mod_description = "One card per character, as in the classic games: players no longer drop as spirits, so you sign them in the Clubroom's Player album with Friendship Points earned in every match. Needs BetterQoL."
option_classic_recruitment = "Classic recruitment"
option_classic_recruitment_help = "Off: players are obtained the game's own way again. Spirits drop from matches, rewards and shops, duplicates are kept, the «Universo del jugador» gacha is open and the album signs no one. Your players and Friendship Points are kept. Applies after restarting the game."
option_remove_gacha = "Remove the gacha"
option_remove_gacha_help = "Removes the «Universo del jugador» gacha: its Chronicle menu row, the board's Tab shortcut and the hub map's point. Applies at once; the hub map's point changes after restarting the game."
option_player_spirit_menus = "Player spirit menus"
option_player_spirit_menus_help = "On: the places that show player spirits are visible again: the player spirit tabs of a match's reward list and the new spirit marks. Spirits still do not drop, so those tabs are empty. Applies at once."

[es.new]
mod_name = "Fichajes clásicos"
mod_description = "Una carta por personaje, como en los juegos clásicos: los jugadores ya no caen como espíritus, así que se fichan en el Álbum de jugadores de la Caseta con los Puntos de Amistad que ganas en cada partido. Necesita BetterQoL."
option_classic_recruitment = "Fichajes clásicos"
option_classic_recruitment_help = "Desactivado: los jugadores se consiguen otra vez como en el juego original. Los espíritus caen en partidos, recompensas y tiendas, los repetidos se conservan, el gacha «Universo del jugador» queda abierto y el álbum no ficha a nadie. Tus jugadores y Puntos de amistad se conservan. Se aplica al reiniciar el juego."
option_remove_gacha = "Quitar el gacha"
option_remove_gacha_help = "Quita el gacha «Universo del jugador»: su fila del menú de la Crónica, el atajo Tab del tablero y el punto del mapa central. Se aplica al momento; el punto del mapa central cambia al reiniciar el juego."
option_player_spirit_menus = "Menús de espíritus de jugadores"
option_player_spirit_menus_help = "Activado: vuelven a verse los sitios que muestran espíritus de jugadores: las pestañas de espíritus de la lista de recompensas de un partido y las marcas de espíritu nuevo. Los espíritus siguen sin caer, así que esas pestañas salen vacías. Se aplica al momento."

[fr.new]
mod_name = "Recrutement classique"
mod_description = "Une carte par personnage, comme dans les jeux classiques : les joueurs ne tombent plus sous forme d'esprits, on les recrute donc dans l'Album des joueurs du club-house avec les Points d'Amitié gagnés à chaque match. Nécessite BetterQoL."
option_classic_recruitment = "Recrutement classique"
option_classic_recruitment_help = "Désactivé : les joueurs s'obtiennent à nouveau comme dans le jeu d'origine. Les esprits tombent en match, en récompense et en boutique, les doublons sont conservés, le gacha « Univers du joueur » est ouvert et l'album ne recrute personne. Tes joueurs et tes Points d'amitié sont conservés. Appliqué au redémarrage du jeu."
option_remove_gacha = "Retirer le gacha"
option_remove_gacha_help = "Retire le gacha « Univers du joueur » : sa ligne du menu de la Chronique, le raccourci Tab du plateau et le point de la carte centrale. Appliqué immédiatement ; le point de la carte centrale change au redémarrage du jeu."
option_player_spirit_menus = "Menus des esprits de joueurs"
option_player_spirit_menus_help = "Activé : les endroits qui montrent les esprits de joueurs sont de nouveau visibles : les onglets d'esprits de la liste de récompenses d'un match et les marques de nouvel esprit. Les esprits ne tombent toujours pas, donc ces onglets sont vides. Appliqué immédiatement."

[de.new]
mod_name = "Klassische Verpflichtung"
mod_description = "Eine Karte pro Charakter, wie in den klassischen Spielen: Spieler fallen nicht mehr als Geister an, du verpflichtest sie im Spieleralbum des Clubraums mit Freundschaftspunkten, die jedes Spiel einbringt. Benötigt BetterQoL."
option_classic_recruitment = "Klassisches Anwerben"
option_classic_recruitment_help = "Aus: Spieler erhält man wieder wie im Originalspiel. Geister fallen in Spielen, Belohnungen und Läden, Duplikate bleiben erhalten, der Gacha «Universo del jugador» ist offen und das Album wirbt niemanden an. Deine Spieler und Freundschaftspunkte bleiben erhalten. Gilt nach einem Neustart des Spiels."
option_remove_gacha = "Gacha entfernen"
option_remove_gacha_help = "Entfernt den Gacha «Universo del jugador»: seine Zeile im Chronik-Menü, die Tab-Abkürzung des Spielbretts und den Punkt der Zentralkarte. Gilt sofort; der Punkt der Zentralkarte ändert sich nach einem Neustart des Spiels."
option_player_spirit_menus = "Menüs der Spielergeister"
option_player_spirit_menus_help = "An: Die Stellen, die Spielergeister zeigen, sind wieder sichtbar: die Geister-Reiter der Belohnungsliste eines Spiels und die Markierungen für neue Geister. Geister fallen weiterhin nicht, daher sind diese Reiter leer. Gilt sofort."

[it.new]
mod_name = "Ingaggi classici"
mod_description = "Una carta per personaggio, come nei giochi classici: i giocatori non cadono più come spiriti, quindi si ingaggiano nell'Album dei giocatori della sala del club con i Punti Carisma guadagnati in ogni partita. Richiede BetterQoL."
option_classic_recruitment = "Reclutamento classico"
option_classic_recruitment_help = "Disattivato: i giocatori si ottengono di nuovo come nel gioco originale. Gli spiriti si ottengono in partite, ricompense e negozi, i doppioni restano, il gacha «Universo del giocatore» è aperto e l'album non ingaggia nessuno. I tuoi giocatori e i Punti Carisma restano. Si applica al riavvio del gioco."
option_remove_gacha = "Rimuovi il gacha"
option_remove_gacha_help = "Rimuove il gacha «Universo del giocatore»: la sua riga del menu della Cronaca, la scorciatoia Tab del tabellone e il punto della mappa centrale. Si applica subito; il punto della mappa centrale cambia al riavvio del gioco."
option_player_spirit_menus = "Menu degli spiriti dei giocatori"
option_player_spirit_menus_help = "Attivato: tornano visibili i punti che mostrano gli spiriti dei giocatori: le schede degli spiriti nella lista delle ricompense di una partita e i segni di nuovo spirito. Gli spiriti continuano a non cadere, quindi quelle schede sono vuote. Si applica subito."

[pt.new]
mod_name = "Contratação clássica"
mod_description = "Uma carta por personagem, como nos jogos clássicos: os jogadores já não caem como espíritos, por isso contratam-se no Álbum de jogadores da sala do clube com os Pontos de Amizade ganhos em cada partida. Precisa de BetterQoL."
option_classic_recruitment = "Recrutamento clássico"
option_classic_recruitment_help = "Desativado: os jogadores obtêm-se de novo como no jogo original. Os espíritos caem em jogos, recompensas e lojas, os repetidos mantêm-se, o gacha «Universo do jogador» fica aberto e o álbum não contrata ninguém. Os teus jogadores e Pontos de amizade mantêm-se. Aplica-se ao reiniciar o jogo."
option_remove_gacha = "Remover o gacha"
option_remove_gacha_help = "Remove o gacha «Universo do jogador»: a sua linha do menu da Crónica, o atalho Tab do tabuleiro e o ponto do mapa central. Aplica-se de imediato; o ponto do mapa central muda ao reiniciar o jogo."
option_player_spirit_menus = "Menus de espíritos de jogadores"
option_player_spirit_menus_help = "Ativado: voltam a ver-se os sítios que mostram espíritos de jogadores: os separadores de espíritos da lista de recompensas de um jogo e as marcas de espírito novo. Os espíritos continuam sem cair, por isso esses separadores ficam vazios. Aplica-se de imediato."

[ja.new]
mod_name = "クラシック勧誘"
mod_description = "昔のシリーズのように、キャラクター1人につきカード1枚。選手はスピリットとしてドロップしなくなり、毎試合もらえるフレンドシップポイントを使って、クラブルームの選手アルバムで獲得します。BetterQoLが必要です。"
option_classic_recruitment = "クラシックスカウト"
option_classic_recruitment_help = "オフ：選手の入手方法が元のゲームと同じに戻ります。試合・報酬・ショップでスピリットが手に入り、重複も残り、「選手ユニバース」のガチャが開き、アルバムではスカウトできません。選手と友情ポイントはそのまま残ります。ゲームの再起動後に反映。"
option_remove_gacha = "ガチャを削除"
option_remove_gacha_help = "「選手ユニバース」のガチャを削除します：クロニクルメニューの項目、ボードのTabショートカット、ハブマップのポイント。すぐに反映されます。ハブマップのポイントはゲームの再起動後に変わります。"
option_player_spirit_menus = "選手スピリットのメニュー"
option_player_spirit_menus_help = "オン：選手スピリットを表示する場所が再び見えるようになります。試合の報酬リストのスピリットタブと、新しいスピリットのマークです。スピリットは引き続き手に入らないため、タブは空です。すぐに反映されます。"

[zh_hans.new]
mod_name = "经典招募"
mod_description = "如同经典作品，每个角色只有一张卡。球员不再以灵魂形式掉落，需要用每场比赛获得的友情点数，在社团活动室的球员图鉴中签约。需要 BetterQoL。"
option_classic_recruitment = "经典招募"
option_classic_recruitment_help = "关闭：球员的获得方式恢复为原版游戏。比赛、奖励和商店会掉落灵魂，重复球员会保留，「球员宇宙」扭蛋开放，图鉴无法签约。你的球员和友情点数会保留。重启游戏后生效。"
option_remove_gacha = "移除扭蛋"
option_remove_gacha_help = "移除「球员宇宙」扭蛋：编年史菜单中的一行、棋盘的Tab快捷键和中心地图上的地点。立即生效；中心地图上的地点在重启游戏后改变。"
option_player_spirit_menus = "球员灵魂菜单"
option_player_spirit_menus_help = "开启：显示球员灵魂的地方重新可见：比赛奖励列表的灵魂分页和新灵魂标记。灵魂仍然不会掉落，所以这些分页是空的。立即生效。"

[zh_hant.new]
mod_name = "經典招募"
mod_description = "如同經典作品，每個角色只有一張卡。球員不再以靈魂形式掉落，需要用每場比賽獲得的友情點數，在社團活動室的球員圖鑑中簽約。需要 BetterQoL。"
option_classic_recruitment = "經典招募"
option_classic_recruitment_help = "關閉：球員的獲得方式恢復為原版遊戲。比賽、獎勵和商店會掉落靈魂，重複球員會保留，「球員宇宙」扭蛋開放，圖鑑無法簽約。你的球員和友情點數會保留。重啟遊戲後生效。"
option_remove_gacha = "移除扭蛋"
option_remove_gacha_help = "移除「球員宇宙」扭蛋：編年史選單中的一行、棋盤的Tab快捷鍵和中心地圖上的地點。立即生效；中心地圖上的地點在重啟遊戲後改變。"
option_player_spirit_menus = "球員靈魂選單"
option_player_spirit_menus_help = "開啟：顯示球員靈魂的地方重新可見：比賽獎勵列表的靈魂分頁和新靈魂標記。靈魂仍然不會掉落，所以這些分頁是空的。立即生效。"
