schema = "VRFW.shop/2"
# The Inazuma Eleven Cross stadium tickets (content/items/cross_stadiums.toml), sold where the retail stadium tickets are:
# * with Inazuma Fantasy (InazumaFantasy): its Tienda general (InazumaFantasy.general_store), in the tickets tab
#   with the retail stadium tickets it sells, priced by its rule (research/mods/InazumaFantasy/_general_store.toml
#   [price]): the retail Tienda Vs row below (35 tk_vi000001 = 105 + 35 tk_hr000008 = 35 Puntos de amistad) / 10 =
#   14 Puntos de pasión, the store's only currency.
# * without it: the retail Tienda Vs (0x9BE09172), the shop that sells the base ticket gd120030, at that retail row's
#   price (35 tk_vi000001 + 35 tk_hr000008, shop_config_3.00.22). With Inazuma Fantasy the Tienda Vs has every row
#   moved and leaves the Mercado, so these rows are not added there.

[[edit]]
target = "InazumaFantasy.general_store"   # Tienda general (Inazuma Fantasy)
if_mod = "InazumaFantasy"

  [[edit.entry]]
  item = "stadium_s91g001"        # Inazuma Big Ferry
  price = 14
  currency = "tk_bb000001"
  stock = 1

