[en.new]
second_keeper_kit = "Second keeper kit"
second_keeper_kit_help = "A goalkeeper who did not start the match wears the team's other keeper kit."
mod_name = "Missing Content"
mod_description = "Content the game ships without or never uses: lost keeper scenes, the effortless one-hand save, the hand-off scenes of the override chains and duel cut-ins, Chrono Stone end poses, 3DS supertactics, goal celebrations from GO Strikers 2013 and Chrono Stone, Harper's scarf, Japanese call-outs for silent special moves, and the Nintendo DS openings of Inazuma Eleven 1, 2 and 3 and the menu music of 2 and 3. Japanese technique voices from Voice Plus (Voci Editor) by Andrea Calvaruso — ko-fi.com/andreacalvaruso."
