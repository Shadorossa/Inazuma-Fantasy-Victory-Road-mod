# Texts of Missing Content (docs/internal/types/text.md): Mods screen name / description and the menu theme labels.
schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
second_keeper_kit = "Second keeper kit"
second_keeper_kit_help = "A goalkeeper who did not start the match wears the team's other keeper kit."
mod_name = "Missing Content"
mod_description = "Content the game ships without or never uses: lost keeper scenes and duel cut-ins, Chrono Stone end poses, Japanese call-outs from GO Strikers 2013 for silent special moves, and the Nintendo DS openings of Inazuma Eleven 1, 2 and 3 and the menu music of 2 and 3."
menu_music_ie23 = "Inazuma Eleven 2 / 3"
menu_music_tm_bus = "The Inazuma TM Bus"

