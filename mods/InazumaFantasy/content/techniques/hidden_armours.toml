# The armours of three of Victory Road's own warrior spirits are off while Inazuma Fantasy is active: Crystal Rabbit, Entertainer and Warborg.
# Their spirits are wks02020 Crystal Rabbit, wko02030 Entertainer and wkd02040 Warborg, and the game has no armour for any of them.
# An armour is this mod's own aura command plus its transform in addons/CharacterReforged/content/transforms, and a spirit without both has no armour anywhere.
# The three aura commands below are off, and removing the comment marks here and in the three transform files brings them back.
# ```
# The armour of the keshin Crystal Rabbit (wks02020).
# [[aura_command]]
# key = "was_fantasy_k002020"
# from = "was00220"
# cells = { name_text = 0xB7617564, desc_text = 0x37671E6C, aura_chara = 0x0466C92D, chara_param = 0x1D7E9729, order = 114 }
# charas = []
#
# The armour of the keshin Entertainer (wko02030).
# [[aura_command]]
# key = "was_fantasy_k002030"
# from = "was00220"
# cells = { name_text = 0xDA6E86C5, desc_text = 0x5A68EDCD, aura_chara = 0x1D7DF86C, chara_param = 0x970440F7, order = 117 }
# charas = []
