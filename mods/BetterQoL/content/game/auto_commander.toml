schema = "VRFW.game/2"

# [[g_gameRoot] + 0x6A58] = running match info (flags +0: 0x200000 = the game starts it in Commander mode)
[[VRFW.Global]]
name = "betterqol_match_info"
base = "game_root"
chain = ["ROOT_MATCH"]

# InitState: call RequestCoachMode at 0x143A1E2 (debug byte, zeroed req).
[[VRFW.Hook]]
name = "BetterQoL.CoachModeInit"
game = "Match.CoachModeInitFirst"
kind = "call"

# Second init: call RequestCoachMode at 0x143D6A4 (literal 0).
[[VRFW.Hook]]
name = "BetterQoL.CoachModeInit2"
game = "Match.CoachModeInitSecond"
kind = "call"

# bool CoachModeBlocked(u8* why): 15 bytes stolen, RIP operand relocated; answered while the table holds the match.
[[VRFW.Hook]]
name = "BetterQoL.CoachModeGate"
game = "Match.IsCoachModeBlocked"
kind = "function"

# why = 1 first, so the HUD guide still sees the game's answer
[[VRFW.Hook.answer]]
table = "BetterQoL.AutoCommanderWhy"
key = ["0"]
when = [
  { value = "ret", not = 0 },
  { value = "args[1]", not = 0 },
]
write = "[args[1]]:u8"

# 0 = not blocked
[[VRFW.Hook.answer]]
table = "BetterQoL.AutoCommander"
key = ["0"]
when = { value = "ret", not = 0 }
write = "ret"

[[VRFW.Hook]]
name = "BetterQoL.CoachAISet"
kind = "function"
pattern = "48 89 5C 24 20 57 48 83 EC 20 80 B9 E0 00 00 00 01 0F B6 FA 48 8B D9 0F 94 C0 3A C2 0F 84 ?? ?? ?? ?? 88 91 E0 00 00 00 E8"
rva = 0x14AE0F0
steal = 17
arguments = ["ptr", "u8"]

# Commander speed: GameTick multiplies the time scale by 2.0 in Commander mode («Modo Comandante veloz»).
[[VRFW.Patch]]
name = "BetterQoL.CommanderSpeedGate"
kind = "stub"
apply = "script"
pattern = "44 38 2D ?? ?? ?? ?? 0F 44 C8 41 84 CB 74 18 F3 0F 10 05 ?? ?? ?? ?? F3 0F 59 05 ?? ?? ?? ?? F3 0F 11 05"
rva = 0xF91BFB
offset = 0x0A
expect = "41 84 CB 74 18"
code = "48 B8 ?? ?? ?? ?? ?? ?? ?? ?? F3 0F 10 08 0F 57 D2 0F 2F CA 77 10 41 84 CB 74 14 B8 00 00 00 40 66 0F 6E C8 EB 04 84 C9 74 05 E9 ?? ?? ?? ?? E9 ?? ?? ?? ??"
tail = false
refs = [{ at = 43, to = 0x0F }, { at = 48, to = 0x27 }]
imm = [{ at = 2, width = "u64", value = 0 }]

# mulss xmm0, [rip + 2.0] -> mulss xmm0, xmm1
[[VRFW.Patch]]
name = "BetterQoL.CommanderSpeedFactor"
pattern = "44 38 2D ?? ?? ?? ?? 0F 44 C8 41 84 CB 74 18 F3 0F 10 05 ?? ?? ?? ?? F3 0F 59 05 ?? ?? ?? ?? F3 0F 11 05"
rva = 0xF91BFB
offset = 0x17
expect = "F3 0F 59 05 ?? ?? ?? ??"
bytes = "F3 0F 59 C1 90 90 90 90"
apply = "script"
