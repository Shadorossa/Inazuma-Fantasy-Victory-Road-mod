[de.new]
mod_name = "Signatur-Passive"
mod_description = "Jeder Spieler hat eine eigene persönliche Passivfähigkeit, pro Figur von den Mods festgelegt, statt einer, die du ausrüstest: Der Passiv-Slot zeigt sie immer an, sie lässt sich nicht ändern, und Spiele nutzen sie. Dazu kommen die allgemeinen Elementar-Passivfähigkeiten (Wind, Wald, Feuer, Berg, Leere), die die eigenen Techniken des Spielers dieses Elements um 15 % verstärken. Passivfähigkeiten bestehen aus wiederverwendbaren Bausteinen, die Mods pro Figur bearbeiten können, und dasselbe System trägt die Passivfähigkeiten, die andere Mods Geistern geben. Benötigt Character Reforged."
