schema = "VRFW.team/2"
# HAND-MAINTAINED. The Chrono Stone post-game «Cadena del Abuelo» (3DS scr_br_0015.cfg.bin, the owner's CS dump
# research/build/pachangas/taisen_cs.csv route 15; wiki «Grandfather's route», FB Frontier Stadium, opened by beating
# The Excellar). Its 5 rivals are all VR teams (the dump's vr_team, 16/16 players in VR): Armiños Invernales
# tm_cro_legend_GO2_06, Osos Dorados _07, Aves Acuáticas _08, Víboras Nocturnas _09, Canes Escarlata _10. Board: the 3DS
# cells on the CS honeycomb (chain-board.md: Pos = [2·(cell / 5) + 1, cell % 5 + 1] for cell % 5 ≤ 2, else
# [2·(cell / 5) + 2, cell % 5 − 2]), moved 4 columns left (an even shift keeps the honeycomb's half-row offsets), the
# 3DS links. Level: 200 (post-game chain). Save:
# chain.ChronicleDeluxe.cs_grandfather of owner VRFW = one character per tile in the declaration order below; never
# reorder released tiles, only append.
default_lang = "es"

# the Chronicle board node: LD of the CS final «Desesperdidos» (fbtl_cro05_240_010), drawn locked until the Crónica win
# against Criaturas de la Noche (fbtl_cro05_220_010, The Excellar: the 3DS unlock)
[[VRFW.RouteNode]]
Name = "cs_chain_grandfather"
Slot = 305
After = "fbtl_cro05_220_010"             # Criaturas de la Noche
AfterWon = [1]                           # its Crónica battle won
Beside = "fbtl_cro05_240_010"            # Desesperdidos: the road starts at its pad
Dir = "LD"
Pos = [-25.25, 36.75]
Team = "tm_cro_go2_2200"                 # only gives the piece a game (never played: the board launches the matches)
TemplateGame = "fbtl_cro05_240_010"
Difficulties = [4]                       # cleared when every match of the chain is won
Icon = "assets/images/teams/70_route_nodes/chain_cs_grandfather.png"   # Astero Black (VR c06039290)
Chain = "cs_grandfather"
  [VRFW.RouteNode.Title]
  es = "Cadena del Abuelo"
  en = "Grandfather's Chain"
  fr = "Chaîne du grand-père"
  de = "Großvaters Kette"
  it = "Catena del nonno"
  pt = "Cadeia do avô"
  ja = "おじいさんの連戦"
  zh_hans = "爷爷的连战"
  zh_hant = "爺爺的連戰"
  [VRFW.RouteNode.LockedTitle]
  es = "Requisito: gana a Criaturas de la Noche"
  en = "Requirement: beat Children of the Night"
  fr = "Condition : battez les Enfants de la nuit"
  de = "Bedingung: Besiege die Kinder der Nacht"
  it = "Requisito: batti i Figli della Notte"
  pt = "Requisito: vence as Criaturas da Noite"
  ja = "条件：ジ・エグゼラーに勝利"
  zh_hans = "条件：战胜制裁联盟"
  zh_hant = "條件：戰勝制裁聯盟"

[[VRFW.Chain]]
Name = "cs_grandfather"
TemplateGame = "fbtl_cro05_240_010"
