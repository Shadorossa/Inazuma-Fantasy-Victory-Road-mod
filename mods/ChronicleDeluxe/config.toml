# The equipment of the free-match rivals (docs/game/mods/rival-equipment.md).
[rival_equipment]
difficulty = "Class4"
play_mode = 1

# The score of a set for one player (higher = better).
[rival_equipment.weights]
position = 3.0            # an item made for his position
element = 1.5             # an item of his element
both = 1.0                # extra when both match (the +25 % affinity)
raise = 4.0               # × the item's raises weighted by his stats
item_passive = 1.0
set_stats = 6.0           # × the set bonus stats weighted by his stats
set_element = 2.0         # a set of his element
move_kind = 2.5
move_kind_cap = 2         # moves of that kind counted at most
element_power = 2.0       # an element effect of his element or of his moves'
family = 2.0              # a technique family he plays
generic_effect = 0.5      # any other effect (tension, speed, recast…)
repeat = 1.5

# A player without stats data: his position's stat weights (1.0 = an average stat)
[rival_equipment.position_stats]
GK = { physical = 1.25, intelligence = 1.2, pressure = 1.1, kick = 0.8 }
FW = { kick = 1.3, control = 1.15, agility = 1.05, pressure = 0.85 }
MF = { technique = 1.2, control = 1.15, intelligence = 1.1, physical = 0.9 }
DF = { pressure = 1.25, physical = 1.25, kick = 0.85 }

# Players Universe: normal pulls of a constellation before its rate-up orb (scripts\universe_orbs.lua).
[universe_orbs]
pulls_for_rate_up = 5

# Players Universe item prizes: read by scripts\universe_prizes.lua at each pull.
[universe_prizes.items]
