# Battle Bay Deluxe tournament (knockout, groups + knockout, league) on the Battle Bay campaign matches.
# bbt_top.lua and its bbt_top_*.lua parts form one chunk with shared locals; order 346 runs after bb_draft (345).
name = "bb_tournament"
mod = "BattleBayDeluxe"
order = 346
module = "lua_bridge"
requires = ["bb_draft"]
conflicts = []
wraps = ["OnInit", "OnDecideFocus", "OnBack", "OnFunction", "Step", "OnEnter", "OnSetupLayer", "SetupParam", "funcLuaMenuCommand", "funcLuaCommand", "SetupListItemTexture", "OpenWindow", "SetupWindowParams", "OnOpenLayer"]
description = "Battle Bay tournament mode on the campaign matches"

