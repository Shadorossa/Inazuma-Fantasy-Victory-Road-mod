# Stoppage Time: its settings (read by scripts\stoppage_time.lua at the start; restart the game after a change).

[stoppage_time]
halves = [1, 2, 3, 4]
rounding = "nearest"
min_minutes = 1
max_minutes = 5
blocked_modes = ["story"]
blocked_states = ["match.challenge.active", "match.training"]
skip_match_tags = ["pachanga"]
# true: one loader.log line per half (its events and its added time) and per play-on.
log = true

# GAME SECONDS each event of the half adds (the seconds of the scoreboard's clock).
[stoppage_time.seconds]
# a foul whistled (any card or none)
foul = 15
# a special move's cut-in of one of technique_groups (each cut-in stops play)
technique = 5
# a shot that reaches the keeper (his scene, a keeper move or a basic catch)
keeper_scene = 5
# a goal (its celebration and the kick-off)
goal = 30
# a player who comes on (the game's substitution scene, once per player)
substitution = 20

[stoppage_time.technique]
groups = ["shot", "dribble", "defense"]

[play_on]
# THE END OF THE HALF, by the play, when the announced time is used up (both teams, human and CPU).
enabled = true
# OWN HALF: below this place the whistle blows at once.
own_half_until = 0.5
near_goal_from = 0.7
back_pass_margin = 0.05
max_overrun_seconds = 110
midfield_max_overrun_seconds = 45
wait_step_seconds = 30
wait_max_seconds = 90
shot_settle_seconds = 30
end_states = [12, 17]

[telop]
# the «+N» under the clock, from the half's regular end until the half ends.
enabled = true
# Screen px of 1080p, y down.
center_x = 960
# the plate's bottom (134) + half the text's height (14)
middle_y = 148
# the text's height (the half label's 28)
text_height = 28
# match states in which the half or the match ended: the text is cleared until the next half's regular end.
end_states = [2, 3, 6, 7, 8, 11, 22, 28]
