# ClassicCards spirit / summon menus: no fusion, no auto-fusion, sub-window options 3-4 and the rarity-up button refused
# (docs/game/characters/rarity-removal.md). Each point sits at its own retail line, apart from Inazuma Fantasy's edits.
name = "rar_menus"
mod = "ClassicCards"
order = 110
module = "lua_bridge"
requires = []
conflicts = []
wraps = []
description = "Rarity removal: spirit / summon menus"

[[files]]
stem = "soccer_spirit_menu"

  [[files.ops]]
  type = "insert_before"
  point = "soccer_spirit_menu.MixChara.RarMenus"
  text = '''
  if ClassicCards.rarity_up_disabled then -- ClassicCards rarity: no fusion
    funcLuaCommand(1917805374, 2086672038 --[[sy0003]])
    return
  end
'''
  crc = "none"

  [[files.ops]]
  type = "insert_after"
  point = "soccer_spirit_menu.OpenMixSameCharaConfirmDialog.RarMenus"
  text = '''
  if ClassicCards.rarity_up_disabled then -- ClassicCards rarity: no auto-fusion
    funcLuaCommand(1917805374, 2086672038 --[[sy0003]])
    return
  end
'''
  crc = "none"

  [[files.ops]]
  type = "append_block"
  text = '''

-- ClassicCards rarity: normal mode has no rarity-up (docs/game/rarity-removal.md). false = retail behaviour.
ClassicCards = ClassicCards or {}
ClassicCards.rarity_up_disabled = true
'''
  crc = "none"

[[files]]
stem = "soccer_summon_menu"

  # the rarity-up button: refused with the retail «not possible» sound (the retail else-branch of `if flag13`)
  [[files.ops]]
  type = "insert_after"
  point = "soccer_summon_menu.OnFunction.RarMenus"
  text = '''
    if ClassicCards.rarity_up_disabled then -- ClassicCards rarity: the rarity-up screen is closed
      funcLuaCommand(1917805374, 2086672038 --[[sy0003]])
      return
    end
'''
  crc = "none"

  # after the retail «both options off» check, right before the sub-window's option list is built
  [[files.ops]]
  type = "insert_after"
  point = "soccer_summon_menu.OpenSpiritSubWindow.RarMenus"
  text = '''
  if ClassicCards.rarity_up_disabled then -- ClassicCards rarity
    l8 = 0
    l9 = 0
  end
'''
  crc = "none"

  [[files.ops]]
  type = "insert_after"
  point = "soccer_summon_menu.CallBackSpirit.RarMenus"
  text = '''
  if ClassicCards.rarity_up_disabled and (a1 == 3 or a1 == 4) then -- ClassicCards rarity
    funcLuaCommand(1917805374, 2086672038 --[[sy0003]])
    a1 = -1
  end
'''
  crc = "none"

  [[files.ops]]
  type = "append_block"
  text = '''

-- ClassicCards rarity: normal mode has no rarity-up (docs/game/rarity-removal.md). false = retail behaviour.
ClassicCards = ClassicCards or {}
ClassicCards.rarity_up_disabled = true
'''
  crc = "none"
