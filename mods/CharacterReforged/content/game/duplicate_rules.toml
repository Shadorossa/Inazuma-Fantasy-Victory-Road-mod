schema = "VRFW.game/2"

# () -> 1 while the loaded save keeps one card per player, else 0 (scripts\duplicate_players.lua)
[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_ONE_CARD_PER_PLAYER"
handler = "CharacterReforged.OneCardPerPlayer"

# (rarity, the card's chara_param col 41) -> the rarity a copy saved at that rarity holds in the loaded save (scripts\duplicate_players.lua)
[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_COPY_RARITY"
handler = "CharacterReforged.CopyRarity"
