# ---- the player's slanted card:
# texture evt_cr_card_face. evt_cr_card_plate<NN> = the retail list card face of card frame NN
# (team00_01 icon_chr_base01_lNN, the game's own colour of the card) with its glow (icon_chr_gradation_l02), cut to the
# slanted card by card_plate_mask.png; frames 16..19 = No More Rarities' position looks (16 goalkeeper = the gold face,
# 17 midfielder = blue, 18 defender = green, 19 forward = the green face turned red). evt_cr_card_rim = the thin blue
# rim, evt_cr_card_face_mask = the portrait mask (the face quad's space), evt_cr_card_clear = a transparent cell (the
# portrait's side tint off). The masks and the rim: research/scripts/cr_passive_card_art.py. Mesh sizes: the rim and
# plate joints of content/menus/skill_table.toml (156 x 181).
