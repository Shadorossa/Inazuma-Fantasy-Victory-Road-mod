# Declaration schema of CharacterReforged.items/1 (content\equipment): fields read from the records the mods ship. `vrfw check` validates the files with it and the ModManager draws their forms from it.
schema = "VRFW.decl_schema/1"
kind = "CharacterReforged.items/1"
folder = "content/equipment"
# v2 words, read beside the v1 ones until the switch: the type and its kind folder.
v2_type = "CharacterReforged.Equipment.Item"
v2_kind_folder = "Equipment/Items"
label = "Equipment items"
label_es = "Objetos de equipamiento"

[entry.Item]
entry_table = "item"
item = { type = "string", ref = "item", required = true }
passive = { type = "table" }
element = { type = "string" }
alias = { type = "string" }
raise = { type = "strings" }
position = { type = "string" }
