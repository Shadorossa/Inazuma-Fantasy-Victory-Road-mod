schema = "VRFW.rule_binding/1"
# Base match-mode -> ruleset table of the match engine; a mod's own rules\matches.toml replaces it.
[modes]
free = "free_match"                 # VS CPU, friendlies, free matches (type 1: 11 vs 11)
free_small = "friendly_5v5"         # friendlies / free small matches (type 2: 5-a-side)
story = "story"                     # each row sets its own V-goal and duration
story_small = "story"
chronicle_story_team = "chronicle"  # Chronicle battle with the team its row names (story team against story team)
chronicle_story_team_small = "chronicle"
chronicle = "chronicle"             # Chronicle battle with the player's own team (heroic battles, gates, route nodes)
chronicle_small = "chronicle"
kizuna = "kizuna"                   # Kizuna town
kizuna_small = "kizuna"
victory_road = "victory_road"       # Victory Road
victory_road_small = "victory_road"
training = "training"               # training and dribble trials (types 3 and 4)
