id = "SynergiesReworked"
# Declarations of the
# VRFW synergy type only (VRFW.synergy/1, run time = VRFW scripts\synergy.lua, the panel drawing included),
# no DLL, no script, no graft.
# Layout:
#   content\synergies\reworked_synergies.toml   the pools ([[VRFW.SynergyPool]]) and the reworked synergies ([[VRFW.Synergy]])
# content\types\synergy.toml the declaration schema of VRFW.synergy/1 (vrfw check, the ModManager editor)
#   text\rows\synergy_hints.toml                the hints of the empty slots (menu_text rows, SynergiesReworked.Hint*)
# text\keys.toml the screen's name and description
# name / description: the English fallback; the screen shows the text keys mod_name / mod_description
# (text\keys.toml) in the game's language.
name = "Synergies Reworked"
prefix = "SynergiesReworked"
folder = "SynergiesReworked"
version = "0.2.4"
author = "Fantasy Team"
author_steam = "76561199013321372"
description = "Reworks some team synergies so they ask for players of a team or a group instead of a few named characters, for example any three female managers of a series or one player of each Raimon team. It also adds new synergies (Los cuatro magníficos, Japón en la sombra, Tablero de Ajedrez and more) with their own icons, and renames a few. The synergy panel shows who is still missing."
priority = 0
tags = ["Gameplay"]
updated = "2026-11-03"
# VRFW 2.2.215: the synergy type with nexus, pools as card sets (teams / series / role / gender), `slots` +
# `skip_nexus_team`, `slot_members` and the panel drawing (nexus icon, crests, minifaces). Works on the base game:
# Inazuma Fantasy and Character Reforged are not needed (the pools read the game's own characters).
# VRFW 2.57.0: an emptied row's face stays off (no player behind a crest); the shop's effects page without the
# rows' crests and minifaces.
requires = ["VRFW>=0.2.4"]
conflicts = []
permissions = []

[exports]
functions = []
keys = []
