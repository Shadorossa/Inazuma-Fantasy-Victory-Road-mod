# Career stats of the player plate and club stats: game data read and Lua commands (logic scripts\career.lua).
schema = "VRFW.game/2"

# ---------------------------------------------------------------- game functions

# ---------------------------------------------------------------- globals

# The match info block `mi` = [[g_gameRoot]+0x6A58].
[[VRFW.Global]]
name = "match_info"
base = "game_root"
chain = ["ROOT_MATCH"]

# The play data block [[g_gameRoot]+0x69C8] (+0x2CAC6F = the play-mode byte).
[[VRFW.Global]]
name = "play_data"
base = "game_root"
chain = ["ROOT_PLAY_DATA"]

[[VRFW.Global]]
name = "ball"
game = "Ball.Global"

# ---------------------------------------------------------------- Lua commands

# CMND_BETTERQOL_CAREER_MATCH(mode) -> state (0 idle, 1 tracking, 2 done).
[[VRFW.Command]]
name = "CMND_BETTERQOL_CAREER_MATCH"
handler = "BetterQoL.Career.Match"
needs = ["Match.ActorUnit", "match_info", "Match.SoccerActors.ViaSkillUsed", "ball"]

[[VRFW.Command]]
name = "CMND_BETTERQOL_CAREER"
handler = "BetterQoL.Career.Get"

# CMND_BETTERQOL_CAREER_EX(charaStHdl, group) -> ok, then the numbers of a group
[[VRFW.Command]]
name = "CMND_BETTERQOL_CAREER_EX"
handler = "BetterQoL.Career.Ex"

[[VRFW.Command]]
name = "CMND_BETTERQOL_CLUB_STATS"
handler = "BetterQoL.Career.Club"

# CMND_BETTERQOL_CLUB_STATS_ROW(i) -> chara_base, name, matches, wins, draws, losses, goals, assists, mvp, signed
[[VRFW.Command]]
name = "CMND_BETTERQOL_CLUB_STATS_ROW"
handler = "BetterQoL.Career.ClubRow"

# CMND_BETTERQOL_CLUB_HISTORY_ROW(i) -> number, day, mode name, rival team name, goals for, goals against, result (1 win 2 draw 3 loss), man of the match, scorers
[[VRFW.Command]]
name = "CMND_BETTERQOL_CLUB_HISTORY_ROW"
handler = "BetterQoL.Career.ClubHistoryRow"
