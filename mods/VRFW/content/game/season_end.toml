schema = "VRFW.game/2"

# No Victory Road season: no season runs, ends or is recorded.
[[VRFW.Hook]]
name = "SeasonEndState"
game = "Chronicle.SeasonState"
kind = "function"

[[VRFW.Hook.answer]]
phase = "post"
when = [
  { value = "mask(args[1], 0xFF)", in = [0, 1, 2] },
  { value = "ret", not = 0 },
]
value = "0"

# v7.2.1: u8 MainSeasonState(?, ?, i32 season) 0x179BF20, the Victory Road season.
[[VRFW.Hook]]
name = "NoMainSeason"
game = "Chronicle.MainSeasonState"
kind = "function"

[[VRFW.Hook.answer]]
phase = "post"
when = { value = "ret", not = 0 }
value = "0"

[[VRFW.Patch]]
name = "SeasonRunningFlagOff"
edit = "Chronicle.SeasonRunningFlagRead.False"

[[VRFW.Patch]]
name = "SeasonEndConvertSkip"
edit = "Chronicle.SeasonEndConvert.Skip"

[[VRFW.Patch]]
name = "SeasonRecordSkip"
edit = "Chronicle.SeasonRecordCollect.Skip"

[[VRFW.Patch]]
name = "SeasonFilterOff"
edit = "Card.BankFilterSeasonTest.Skip"

[[VRFW.Patch]]
name = "NoSeasonBitOnNewPlayer"
edit = "Party.NewRecordSeasonFlagRead.False"

[[VRFW.Patch]]
name = "NoSeasonBuildOnNewPlayer"
edit = "Party.NewRecordSeasonBuildTest.Skip"
