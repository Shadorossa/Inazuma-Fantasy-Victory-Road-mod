schema = "VRFW.friendly/1"
# New Recruitment › a pachanga of a Chronicle board zone: a 5v5 friendly
# with Football Reforged's 5-a-side ruleset (no special tactics, no referee) and the player's active pachanga team,
# against the pachanga's team (the caller's override teams.rival.team) at the zone's stadium (the caller's `stadium`),
# started from the board (VRFW match start service) and back to it. The save is never written during the match; the
# win is read by the module's script (match_end) and ticked on the list; nobody joins.
if_mod = "FootballReforged"

[[friendly]]
id = "new_recruitment_pachanga"
name = "New Recruitment pachanga"
ruleset = "friendly_5v5_no_tactics_or_referee"
team = "active_friendly"
kit_from_11 = true
pre_match = true
challenge = "none"
save = "sink"
return = "menus"
pass = "none"
tags = ["pachanga"]        # a casual street match: modules skip what a pachanga has not (e.g. added time)
before = [{ op = "fade_encounter", frames = 120 }]

# the same pachanga when no active pachanga team is set: the player's active match team (the VS team the other modes
# use) plays its five, untouched; the board's ClassicRecruitment.PachangaBoard.Play picks it through the match start
# service's `set` answer
[[friendly]]
id = "new_recruitment_pachanga_active_team"
name = "New Recruitment pachanga (active team)"
ruleset = "friendly_5v5_no_tactics_or_referee"
team = "current"
kit_from_11 = true
pre_match = true
challenge = "none"
save = "sink"
return = "menus"
pass = "none"
tags = ["pachanga"]        # a casual street match: modules skip what a pachanga has not (e.g. added time)
before = [{ op = "fade_encounter", frames = 120 }]
