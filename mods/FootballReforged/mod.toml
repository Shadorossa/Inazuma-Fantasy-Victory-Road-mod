id = "FootballReforged"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "Football Reforged"
version = "0.2.4"
author = "Fantasy Team"
author_steam = "76561199013321372"
description = "A base of match mechanics in modules: each module is a card on this mod's page in Mods (on / off, applies after a restart). Goalkeeper barrier: keepers resist shots while an orange part of their fatigue bar lasts. Furor: the GO Strikers tension gauge, a fire bar by each crest; full, L3 / R starts the Fired up phase. Both on by default. Match formats in the base: Football 7 (7 vs 7), Inazuma Street (3 vs 3, no keepers or referee) and the 5-a-side friendly without tactics or referee, rulebooks other mods and modes can pick."
priority = 0
tags = ["Gameplay"]
updated = "2026-11-05"
# This mod's own names (TOML keys [FootballReforged.X], Lua FootballReforged.X, commands CMND_FOOTBALLREFORGED_*, tables
# FootballReforged.*); never VRFW.
prefix = "FootballReforged"
folder = "FootballReforged"
# Its modules are embedded module mods, each a card on
# this mod's page in Mods (on / off in enabled.toml, applies after a restart; on by default as every new mod):
#   modules\GoalkeeperBarrier\   GoalkeeperBarrier (GoalkeeperBarrier.X): the goalkeeper's barrier
#   modules\Furor\               Furor (Furor.X): GO Strikers' furor gauge
#   modules\LegendaryAI\         LegendaryAI (LegendaryAI.X): the «Legendary» rival AI of every offline match
#                                (data on VRFW.MatchAI)
#   modules\Friendlies\          Friendlies (Friendlies.X): the type row of «Plantilla de equipo» and every dock's 5v5
#                                team (the mirror of its 11v11 team), the active pachanga team
#   modules\Challenges\          Challenges (Challenges.X): the match challenge rulesets, their defaults and formation,
#                                the office trial friendlies, triggers and rivals
#   modules\HomeStadium\         HomeStadium (HomeStadium.X): each player team's home stadium, picked in «Plantilla de
#                                equipo» among the owned stadiums, for its home matches
#   modules\Pressing\             Pressing (Pressing.X): without the ball L2 is a press button (2-4 AI teammates sprint
#                                at the carrier) instead of the focus field, for the user and the CPU
#   modules\DuelAuras\           DuelAuras (DuelAuras.X): in a duel an aura (keshin, totem, armour, Mix-Max, mode change)
#                                is never the answer to a special move: it activates and the choice stays open, both
#                                sides (the VR-Framework's [VRFW.DuelAura])
#   modules\StoppageTime\        StoppageTime (StoppageTime.X): added time at the end of every half from its events
#                                and play-on while a team attacks when it runs out
#   modules\SkillDuel\           SkillDuel (SkillDuel.X): a plain focus duel is won by reading the side: a contact on the
#                                defender wins for him, the stats only nudge his reach
# The own keeper's fatigue bar on the scoreboard empties left to right (anchored at its
# inner, crest, end), mirroring the rival's bar (retail, empties right to left): assets\menu\00_soccer\soccer00\soccer00_01_kp\
# soccer00_01_kp.g4mg, the retail mesh file with the mask UVs (set 1) of _keeper_hp_gauge01_s turned 180 degrees (same
# size as retail, 448 bytes).
#   content\params\pass_input.toml   your passes leave at once: a pass pressed while a pass flies to your
#                                player is kept until he has the ball (passPreBufferingInputTime, retail 0.2 s)
#   content\rules\football_7.toml, inazuma_street.toml, friendly_5v5_no_tactics_or_referee.toml   the rulebooks Football 7, Inazuma Street and
#                                the 5v5 friendly without tactics or referee
#   content\formations\formation_config.toml   if_form_street_3 / if_form_7_1231; GENERATED by
#                                research/scripts/if_match_formations_build.py
#   Their names: text keys FootballReforged.ruleset_<id> (text\keys.toml). The [[merged]] entry below keeps every
#   `requires` / enabled.toml entry of the old id match_formats working.
#   scripts\advantage_judgement.lua   a penalty shoot-out of any rulebook, in any mode, becomes the game's own Advantage
#                                Judgement (always on with this mod; content\game\advantage_judgement.toml)
#   options.toml, scripts\no_move_cooldown.lua, content\game\no_move_cooldown.toml   the option «no special move
#                                cooldown» (off by default, both teams): a move's own full recast never starts
permissions = ["memory", "hook"]
requires = ["VRFW>=0.2.4"]
conflicts = []

# The former module match_formats: always on with the base.
[[merged]]
id = "match_formats"
version = "1.0.1"
