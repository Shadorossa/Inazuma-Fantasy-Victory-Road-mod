schema = "VRFW.game/2"

# Flow toggles (schema VRFW.game/2). Nothing is installed unless a mod declares a toggle away from the game's rule (`apply = "script"`).

# ------------------------------------------------------------------------------------------------ prematch_editor

# Pre-kick-off team editor: opens only when match info flag 0x2000000 is set.
[[VRFW.Hook]]
name = "Flow.PrematchEditor"
game = "Menu.PrematchEditor"
apply = "script"
needs = ["Flow.IsNetworkSession", "Flow.MatchInfo"]

# bool IsNetworkSession(): a network session (online or local) is up.
[[VRFW.Function]]
name = "Flow.IsNetworkSession"
game = "Net.IsSession"
returns = "bool"

# Match info: Flags (0x2000000 = editor opens), MatchType, Observer.
[[VRFW.Struct]]
name = "Flow.MatchInfo"
game = "MatchInfo"

# ------------------------------------------------------------------------------------------------ match_exit

[[VRFW.Global]]
name = "flow_bright_fade"
game = "Render.BrightFade"

[[VRFW.Hook]]
name = "Flow.ExitCover"
game = "Render.BrightFadeLayer"
kind = "function"
apply = "script"

[[VRFW.Hook.answer]]
phase = "post"
when = [
  { value = "args[2]", equals = 1 },
  { value = "args[1]", in_table = "VRFW.Flow.ExitCover" },
]
each = { count = "8", max = 8 }
value = "if(i == 3, 1, if(i == 7, 1, 0))"
write = "[args[1] + 0x3C + i * 4]:f32"

# ------------------------------------------------------------------------------------------------ commands

# (name) -> value in force ("game" when no mod declares it, nil for an unknown toggle).
[[VRFW.Command]]
name = "CMND_VRFW_FLOW"
handler = "Flow.Cmd"

[[VRFW.Command]]
name = "CMND_VRFW_MATCH_EXIT_COVER"
handler = "Flow.ExitCover"
needs = ["flow_bright_fade"]
