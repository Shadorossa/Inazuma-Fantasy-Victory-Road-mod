[pt.new]
option_duel_auras = "Auras em duelos livres"
option_duel_auras_help = "Num duelo, uma aura (keshin, totem, armadura, Mix-Max...) nunca responde à supertécnica do rival: o duelo pausa, a aura ativa-se e o duelo continua com a escolha em aberto. Para as duas equipas, também o CPU. Aplica-se ao reiniciar o jogo."
option_technical_combo = "Combo técnico"
option_technical_combo_help = "O Combo técnico do jogo: vencer duelos de concentração com supertécnicas aumenta a potência do próximo remate até 3 níveis e reduz o custo de tensão das supertécnicas. Desligado: nenhum combo se acumula. Aplica-se ao reiniciar o jogo."
option_move_cooldown = "Recarga das supertécnicas"
option_move_cooldown_help = "Ativado: uma supertécnica espera o seu tempo de recarga antes de poder ser usada de novo, como no jogo. Desativado: as supertécnicas podem ser usadas de novo de imediato, nas duas equipas; continuam a custar tensão e as auras mantêm a sua recarga. Aplica-se de imediato; uma técnica já em recarga termina o seu tempo."
mod_name = "Football Reforged"
mod_description = "Mecânicas de jogo em módulos que ativas ou desativas em Mods: barreira do guarda-redes, furor, estádio da casa, pressão, tempo de compensação e uma CPU lendária. Acrescenta também os formatos Futebol 7, Inazuma Street e 5 contra 5, duelos de habilidade, auras nos duelos livres e desafios de partida."
