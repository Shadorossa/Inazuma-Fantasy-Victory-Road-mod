id = "StoppageTime"
# name / description: the English fallback; the card shows the text keys mod_name / mod_description (text\keys.toml)
name = "Stoppage Time"
version = "0.3.1"
author = "Fantasy Team"
description = "Added time at the end of every half, as in real football: fouls, special moves, keeper scenes, goals and substitutions add seconds, rounded to whole minutes (1 to 5). A «+N» banner shows when regular time ends, and the half ends on the play once the added time runs out."
priority = 0
type = "gameplay"
tags = ["Gameplay"]
updated = "2026-11-09"
# This mod's own names (Lua StoppageTime.X, command CMND_STOPPAGETIME_TELOP, layer stoppage_time_telop); never VRFW.
prefix = "StoppageTime"
folder = "StoppageTime"
# Added time from what happened in the half and play-on while attacking.
requires = ["VRFW>=0.3.0", "FootballReforged>=0.3.0"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
permissions = ["call", "command", "memory"]

[exports]
functions = []
keys = []
tables = []

[module]
of = "FootballReforged"
order = 130
