schema = "VRFW.theme_rules/1"
theme = "dark"

# its copy of the chronicle world map keeps its retail colours, as the game's own
[[sprite]]
match = "*"
class = "keep"
file = "chronicle_deluxe_own/chronicle_deluxe_vsroute01_0"

[[sprite]]
match = "chronicle_deluxe_class_orb_*"
class = "keep"
file = "chronicle_deluxe_own/chronicle_deluxe_vsroute01_21"

# its legendary-ball list rows' level circles and ball (its sprites in vsroute01_21) keep their colours
[[sprite]]
match = "chronicle_deluxe_legendary_ball_lv_base*"
class = "keep"
file = "vsroute01_21"

[[sprite]]
match = "chronicle_deluxe_legendary_ball"
class = "keep"
file = "vsroute01_21"
