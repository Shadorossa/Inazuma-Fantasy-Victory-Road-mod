id = "ClassicRecruitment"
# name / description: English fallback of the text keys mod_name / mod_description (text\keys.toml)
name = "Classic Recruitment"
version = "0.3.0"
author = "Fantasy Team"
description = "One card per character, as in the classic games: players no longer drop as spirits, so you sign them in the Clubroom's Player album with Friendship Points earned in every match. Needs BetterQoL."
priority = 0
tags = ["Characters", "Gameplay"]
updated = "2026-11-09"
prefix = "ClassicRecruitment"
folder = "ClassicRecruitment"
requires = ["VRFW>=0.3.0", "CharacterReforged>=0.3.0", "BetterQoL>=0.3.0"]
optional = ["BetterUI", "ClassicCards", "FootballReforged", "StoppageTime"]
conflicts = []
loader_modules = ["lua_bridge"]
# its scripts answer game Lua commands (content\game\friendly_zones.toml)
permissions = ["command"]

[layout]
script_folders = ["duplicate_rules", "team_planner", "friendly_zones"]

[module]
of = "CharacterReforged"
order = 75

[exports]
game_lua = []
