# Classic Equipment › the rules research/scripts/classic_equipment.py builds the module from (the generated files:
# content\items\, content\better_equipment\sets.toml, content\classic_equipment\, content\shops\, content\team_gear\,
# content\images\, assets\images\). Nothing here is read in the game.

[stats]
# the 3DS stat (go3ds_items.json key) -> the Victory Road stat, the functional mapping approved by the owner:
# Tiro -> Disparo, Regate -> Control, Técnica -> Técnica, Defensa (bloqueo) -> Presión, Atrapar (parada) -> Agilidad,
# Aguante -> Físico, Rapidez (velocidad) -> Inteligencia; Suerte -> Suerte (Character Reforged's 8th stat, apart)
map = { tiro = "kick", regate = "control", "técnica" = "technique", bloqueo = "pressure", parada = "intelligence", aguante = "physical", velocidad = "agility" }
luck_key = "suerte"

[scale]
# The values follow Better Equipment's budget (its rules.toml [budget]): at its display_s (70) the shown bonuses of
# every item add up to exactly 70, signed (raises minus the lowered stat; Suerte, content\classic_equipment\luck.toml,
# counts as a raise). How they are shaped: [shape]. An item the 3DS game gave no stats takes the most common raised
# pair of its kind, even.

[drops]
# Team items also drop in the matches against their team: an item whose retail counterpart (its Japanese stem) is the
# boots of a team's kit is declared in content\team_gear\classic_equipment.toml (generated); Chronicle Deluxe's rival
# drops put it in that team's boots slot, at the boots' rate (its config.toml [[drops.battle]] `boots`, `gear` on the
# free-match classes), weight as the boots. Only the kinds below (a team's gloves for its boots: an accessory named
# after a whole country is no team's gear); of the boots holding the item's stem, those whose stem starts with it when
# there are any. The other items are only sold (content\shops\).
kinds = ["gloves"]

[[mod_shops]]
# A mod whose own shops replace the retail ones in the Mercado: Inazuma Fantasy redirects the retail Mercado shops to
# its own and lists the equipment in its training shop. The classic items get rows there too (if_mod), in the tab of
# their kind, priced as that shop prices the item's equivalent, else by its price rule ([price] of `rule`, IF's
# convert); its [limits] (rows of a shop, of a tab) are checked. The retail rows stay (story shops keep them).
why = "Inazuma Fantasy's training shop"
mod = "InazumaFantasy"
shop = "InazumaFantasy.training_shop"
rule = "research/mods/InazumaFantasy/_general_store.toml"
rows = "research/mods/InazumaFantasy/content/shops/training_shop.toml"

[shape]
# How an item's shown bonuses are shaped; their absolute values add up to 70 (Better Equipment's rules.toml [shape],
# the same rule as its own items: raises, lowered stat, min_raise, max_raise):
#   trade   a penalty tier of `trade_tiers` (Better Equipment's tier, raised by the 3DS rank, [penalty]): two raises and
#           one lowered stat (60 + 10)
#   single  no trade and one raised 3DS stat: that stat +70
#   spread  no trade, more 3DS stats: three raises for a small tier or from `three_from_rank` on (the 3DS rank of the
#           item in its kind, 0 the weakest, 1 the strongest), else two; an item with Suerte keeps its own 3DS stats
# The main raise is a 3DS stat of the item (of those at least `swap_ratio` of its strongest, the one fewer classic
# items have as their main stat; a main stat already the main one of more than `main_share` x the average gives way to
# the rarest main stat). Each further raise keeps the 3DS stat of that rank while no more classic items raise it than
# the average, else it goes to the stat the classic items raise least so far (every stat gets good items). The values
# keep the 3DS proportion by rank; a rank the 3DS item lacks weighs `fill_weight` of the main raise. The lowered stat:
# Better Equipment's pair table, else the stat the classic items raise most.
trade_tiers = ["big"]
three_from_rank = 0.5
main_share = 1.5
swap_ratio = 0.75
fill_weight = 0.4

[penalty]
# Better Equipment's penalty tier of a classic item (no passive: by its sets), raised by its standing in its 3DS game:
# the rank of its 3DS raise total among the 3DS items of its kind (0 the weakest, 1 the strongest); from `small` on it
# trades at least small, from `big` on big (an endgame item: bigger plus, bigger minus; a starter item: no minus)
original_rank = { small = 0.34, big = 0.67 }

[names]
# the Japanese kind words a name ends with (its stem = the rest without a trailing の): a 3DS item whose stem names
# a retail item of another kind (a team's boots for its gloves) joins that item's Better Equipment sets and, for the
# languages the 3DS releases lack, takes that item's name with the kind word swapped (swap)
# a team stem this long or longer also matches a retail item whose stem holds it (ツキガミの -> ツキガミの一族)
team_stem_min = 3
# ... only retail boots of the series of the 3DS game (the two digits after eq_sh: 04 GO, 05 Chrono Stone, 06 Galaxy)
team_series = { go = "04", cs = "05", galaxy = "06" }
ja_kind_words = ["シューズ", "グローブ", "ミサンガ", "ペンダント", "ブレスレット", "ネックレス"]

# per language: the retail name of one kind -> the name of the other (regular expressions, Python syntax)
swap.es = [
    { from_kind = "boots", to_kind = "gloves", pattern = "^(Botas|Zapatillas|Deportivas|Sandalias|Tacos) ", replace = "Guantes " },
]
swap.en = [
    { from_kind = "boots", to_kind = "gloves", pattern = " (Boots|Shoes|Sneakers|Sandals|Spikes)$", replace = " Gloves" },
]
swap.fr = [
    { from_kind = "boots", to_kind = "gloves", pattern = "^(Crampons|Chaussures|Baskets|Sandales) ", replace = "Gants " },
]
swap.de = [
    { from_kind = "boots", to_kind = "gloves", pattern = "-?(Schuhe|Stiefel|Sandalen)$", replace = "-Handschuhe" },
]
swap.it = [
    { from_kind = "boots", to_kind = "gloves", pattern = "^(Scarpini|Scarpe|Sandali) ", replace = "Guanti " },
]
swap.pt = [
    { from_kind = "boots", to_kind = "gloves", pattern = "^(Chuteiras|Sapatos|Ténis|Tênis|Sandálias) ", replace = "Luvas " },
]
swap.ja = [
    { from_kind = "boots", to_kind = "gloves", pattern = "シューズ$", replace = "グローブ" },
]
swap.zh_hans = [
    { from_kind = "boots", to_kind = "gloves", pattern = "(球鞋|之鞋|鞋)$", replace = "手套" },
]
swap.zh_hant = [
    { from_kind = "boots", to_kind = "gloves", pattern = "(釘鞋|球鞋|之鞋|鞋)$", replace = "手套" },
]

# the name of an item of each kind around a stem of research/data/classic_equipment_names.toml (unofficial names)
[names.template.boots]
es = "Botas {x}"
en = "{x} Boots"
fr = "Crampons {x}"
de = "{x}-Schuhe"
it = "Scarpini {x}"
pt = "Chuteiras {x}"
zh_hans = "{x}球鞋"
zh_hant = "{x}球鞋"
[names.template.gloves]
es = "Guantes {x}"
en = "{x} Gloves"
fr = "Gants {x}"
de = "{x}-Handschuhe"
it = "Guanti {x}"
pt = "Luvas {x}"
zh_hans = "{x}手套"
zh_hant = "{x}手套"
[names.template.bracelet]
es = "Pulsera {x}"
en = "{x} Bracelet"
fr = "Bracelet {x}"
de = "{x}-Armband"
it = "Bracciale {x}"
pt = "Pulseira {x}"
zh_hans = "{x}手绳"
zh_hant = "{x}手鍊"
[names.template.pendant]
es = "Colgante {x}"
en = "{x} Pendant"
fr = "Pendentif {x}"
de = "{x}-Anhänger"
it = "Collanina {x}"
pt = "Pingente {x}"
zh_hans = "{x}吊坠"
zh_hant = "{x}吊墜"

