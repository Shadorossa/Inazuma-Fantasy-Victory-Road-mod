schema = "CharacterReforged.movesets/1"

[CharacterReforged.MovesetRules]
# moves per moveset
Moves = 4
# the original games in order of release
Games = ["IE1", "IE2", "IE3", "GO", "CS", "GX"]
Sources = ["game", "wiki"]
VictoryRoadSeries = ["VR", "Ares", "Orion"]
# special cards (chara_param rarity column, not 0) keep the set they have
KeepSpecialCards = true
SpecialCardsInheritBase = true
# learn level = source level × LevelScale; slots in ascending learn level, a story move or a tie at the level before + StoryLevelStep
LevelScale = 1.0
StoryLevelStep = 10
# learn level of the first slot (the starter move)
StarterLevel = 1
SagaGames = ["IE1", "IE2", "IE3"]
SagaSource = "IE3"
ModernSource = "GX"
# a move of this category goes only on keepers
KeeperCategory = 4
FillSeed = "CharacterReforged.movesets.fill"
# category of each missing slot, by position
FillCategoryByPosition = { GK = [4, 4, 4, 4], FW = [1, 1, 2, 3], MF = [2, 2, 1, 3], DF = [3, 3, 2, 1] }
# power limit of a fill move, lifted only when the element has none
FillPowerCap = 440
NameFamily = true
# when a name matches several Victory Road moves (element variants), the one of the character's element wins
PreferOwnElement = true
# the real skills and basic techniques (skill_config: element, colorIdx, consumeTp) never enter a moveset
GreyMove = { Element = 5, ColorIdx = 0, ConsumeTp = 40 }

[CharacterReforged.MovesetRules.VoiceOrder]
VoicedFirst = true
Power = 0.5
LearnOrder = 0.3
Level = 0.1
Random = 0.1
Seed = "CharacterReforged.movesets"

[CharacterReforged.MovesetRules.StartingGrades]
From = "research/mods/_aside/InazumaFantasy/characters/move_grades.toml"

# the hyper forms the board slots hold beside the 4 moves: slot 9 = keshin or totem; the mix table = miximax or change mode
[CharacterReforged.MovesetRules.Forms]
AuraTypes = [0, 3]
MixTypes = [2, 6]
KeshinType = 0
# an armour comes through its keshin (same digits in the key)
ArmourType = 1
# the learn level of a form taken from an armour's keshin
Level = 43
