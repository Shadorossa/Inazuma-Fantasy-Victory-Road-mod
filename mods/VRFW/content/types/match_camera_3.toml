# Declaration schema of VRFW.match_camera/3 (content\cameras): fields read from the records the mods ship. `vrfw check` validates the files with it and the ModManager draws their forms from it.
schema = "VRFW.decl_schema/1"
kind = "VRFW.match_camera/3"
folder = "content/cameras"
label = "Match camera presets (v3)"
label_es = "Preajustes de cámara de partido (v3)"
doc = "A match camera preset: its angle, distance and field of view."
doc_es = "Un preajuste de cámara de partido: su ángulo, distancia y campo de visión."

[entry.Preset]
entry_table = "preset"
name = { type = "name" }
kind = { type = "string" }
yaw = { type = "number" }
pitch = { type = "number" }
distance = { type = "number" }
fov = { type = "number" }
fixed_pitch = { type = "bool" }
option = { type = "string" }
anchor = { type = "string" }
fallback_half_width = { type = "number" }
frame_goal = { type = "bool" }
turn = { type = "number" }
goal_margin = { type = "number" }
max_turn = { type = "number" }
turn_rate = { type = "number" }
