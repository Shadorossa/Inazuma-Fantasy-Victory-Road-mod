# Battle Bay «Reto diario» (docs/game/modes/bb-daily-challenge.md): the «Campaña» row's window and the run's matches on
# the lent campaign block. Order 349: its OnInit sync runs before bb_tournament's (346).
name = "bb_daily_challenge"
mod = "BattleBayDeluxe"
order = 349
module = "lua_bridge"
requires = ["bb_tournament"]
conflicts = []
wraps = ["OnInit", "OnDecideFocus", "OnBack", "WaitExecOtherMenu", "Step"]
