mod_name = "Bessere Ausrüstung"
mod_description = "Jede Ausrüstung ist gleich viel wert: Ihre Boni, die Senkung mitgezählt, ergeben immer den stärksten Bonus der Ausrüstung des Spiels (40 im Grundspiel, mehr wenn ein Mod stärkere Gegenstände hinzufügt): manche erhöhen einen Wert, andere zwei oder drei, und Gegenstände mit starker Passiv-Fähigkeit senken einen, sodass sich Gegenstände durch ihr Profil unterscheiden, nicht durch ihre Stärke. Ein Spieler, dessen Position oder Element zum Gegenstand passt, erhält +15 % seiner Erhöhungen (+25 % bei beiden). 67 Sets geben Werte und Effekte für 2 bis 4 getragene Teile (ein Gegenstand kann in mehreren Sets sein; ein getragenes Teil zählt nur für eines). Thematische und benannte Gegenstände haben eine Passive: +5 % Kraft für ihre Familie von Spezialtechniken, die Techniken ihres Elements, Spannungskosten, Aufladezeit, Tempo, Spannung pro Duell, Parade oder Tor, Werte bei Rückstand oder Führung. Benötigt Character Reforged; eine Passive, die eine Technikfamilie nennt, gilt nur, solange der Mod aktiv ist, der diese Familie deklariert."
