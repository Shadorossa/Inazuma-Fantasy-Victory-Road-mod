schema = "VRFW.image/1"

[[texture]]
atlas = "#/menu/200_icon/better_ui_own/better_ui_icon_tactics.g4tx"
name = "better_ui_icon_tactics"
size = [356, 120]

[[recipe]]
name = "plate"
game = "#/menu/00_soccer/soccer08/soccer08_12/soccer08_12.g4tx"
sprite = "cmd_base_t01"

# the plate at one box's size: shape, shadow, alpha
[[recipe]]
name = "box"
from = "plate"
ops = [{ op = "resize", size = [116, 118] }]

# the plate at the whole row's width: the gradient
[[recipe]]
name = "row"
from = "plate"
ops = [{ op = "resize", size = [378, 118] }]

# the row's body seen through each box
[[recipe]]
name = "body_l"
from = "row"
ops = [{ op = "crop", box = [16, 26, 122, 92] }, { op = "opaque" }]

[[recipe]]
name = "body_m"
from = "row"
ops = [{ op = "crop", box = [136, 26, 242, 92] }, { op = "opaque" }]

[[recipe]]
name = "body_r"
from = "row"
ops = [{ op = "crop", box = [256, 26, 362, 92] }, { op = "opaque" }]

# the box plate with the row's colours in its body, the box plate's own alpha everywhere
[[recipe]]
name = "slice_l"
from = "box"
ops = [{ op = "paste", image = "body_l", at = [5, 26] }, { op = "alpha_from", image = "box" }]

[[recipe]]
name = "slice_m"
from = "box"
ops = [{ op = "paste", image = "body_m", at = [5, 26] }, { op = "alpha_from", image = "box" }]

[[recipe]]
name = "slice_r"
from = "box"
ops = [{ op = "paste", image = "body_r", at = [5, 26] }, { op = "alpha_from", image = "box" }]

[[sprite]]
atlas = "#/menu/200_icon/better_ui_own/better_ui_icon_tactics.g4tx"
name = "better_ui_tactic_row_l"
texture = "better_ui_icon_tactics"
x = 0
y = 0
recipe = "slice_l"
size = [116, 118]

[[sprite]]
atlas = "#/menu/200_icon/better_ui_own/better_ui_icon_tactics.g4tx"
name = "better_ui_tactic_row_m"
texture = "better_ui_icon_tactics"
x = 120
y = 0
recipe = "slice_m"
size = [116, 118]

[[sprite]]
atlas = "#/menu/200_icon/better_ui_own/better_ui_icon_tactics.g4tx"
name = "better_ui_tactic_row_r"
texture = "better_ui_icon_tactics"
x = 240
y = 0
recipe = "slice_r"
size = [116, 118]
