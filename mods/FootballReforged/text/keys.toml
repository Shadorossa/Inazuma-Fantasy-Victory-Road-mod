[zh_hans.new]
option_duel_auras = "自由对决中的灵气"
option_duel_auras_help = "对决中，灵气（化身、图腾、铠甲、混合最大化等）绝不会算作对对手必杀技的应对：对决暂停，灵气发动，对决继续且仍可选择。双方队伍都适用，包括电脑。重启游戏后生效。"
option_technical_combo = "技术连击"
option_technical_combo_help = "游戏的技术连击：用必杀技赢得专注对决，下一次射门的威力最多提升3级，必杀技的气势消耗降低。关闭：不会累积连击。重启游戏后生效。"
option_move_cooldown = "必杀技冷却"
option_move_cooldown_help = "开：必杀技与原版游戏一样，冷却结束后才能再次使用。关：双方队伍的必杀技都可以立即再次使用；仍会消耗气势，灵气的冷却保持不变。立即生效；已在冷却中的必杀技会走完剩余时间。"
mod_name = "Football Reforged"
mod_description = "以可在 Mods 中开关的模块形式提供比赛机制：守门员屏障、斗志、主场球场、逼抢、补时和传奇电脑。还新增足球7人制、闪电街头和5对5的比赛形式、技巧对决、自由对决中的灵气以及比赛挑战。"
ruleset_football_7 = "7人制足球（7对7）"
ruleset_friendly_5v5_no_tactics_or_referee = "5人制友谊赛（无战术、无裁判）"
ruleset_inazuma_street = "闪电街头（3对3，无门将、无裁判）"
ruleset_challenge_goals = "挑战：45秒内进3球"
