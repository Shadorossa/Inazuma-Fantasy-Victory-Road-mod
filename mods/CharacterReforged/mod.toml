#                                header
#   content\menus\player_header_host.toml + assets\lua\_all\character_reforged_header.lua   the header SLOT: the host
#                                CharacterReforged.header (other mods' [[entry]] = a piece drawn in the free strip of
#                                the row, left to right), CharacterReforged.Header (every menu VM with the plate functions)
#   content\menus\player_page_layout.toml (GENERATED by research/scripts/if_plate_row_build.py) + player_page_layers.toml
#   + player_page_view_forms.toml (only with Utilities), content\images\menu\player_page.toml, plate_form_badges.toml,
