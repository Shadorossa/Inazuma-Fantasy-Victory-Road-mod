# «Battle Bay Deluxe» settings; may also go in <game>\vrfw_loader\config.toml under [mods.BattleBayDeluxe].

[campaign]
progression = true
# 0 = a new draw every campaign and Draft; any other number = the same rivals and Draft offers every time (testing).
seed = 0

[campaign_fields]
# Special-conditions fields of the Campaña, one per match, none repeated within a run if enough fields are listed (soccer_studium_gimmick_config maps).
fields = [
  "s20g001",   # Starship Stadium (Silica)
  "s20g001b",  # Starship Stadium (Naiad)
  "s20g001c",  # Starship Stadium (Magmavis)
  "s20g001d",  # Starship Stadium (Fertilia)
  "s21g001",   # Grand Celesta Stadium
  "s34g001",   # Turbine Stadium
  "s35g001",   # Iceberg Stadium
  "s35g001b",  # Iceberg Stadium (second form)
  "s36g001",   # Raft Stadium
  "s37g001",   # Pinball Stadium
  "s38g001",   # Desert Stadium
]

[active_team]
# The «Active team» tile: the [[team]] of content\teams with this name (222_active_team.toml; placeholder players).
team = "active_team"
# Level sync of the active team's matches (players above it play with its stats).
level_sync = 40
# The Personal Teams tiles: the [[team]] of content\\teams with this name -> the team dock it plays (223_personal_docks.toml).
dock_tiles = { personal_dock_02 = 2, personal_dock_03 = 3, personal_dock_04 = 4, personal_dock_05 = 5, personal_dock_06 = 6, personal_dock_07 = 7, personal_dock_08 = 8, personal_dock_09 = 9, personal_dock_10 = 10, personal_dock_11 = 11, personal_dock_12 = 12 }

[difficulty]
# game_state keys another mod publishes with the game's difficulty index (0-3).
owner_states = ["LegendaryAI.ai_difficulty"]

[draft]
team = "draft"
# Card types (chara_param column 41) never offered: 5-7 Idol / Hero, 8 Diamond, 10 Prime.
special_rarities = [5, 6, 7, 8, 10]
# Text language whose character names merge the variants of one character (same name = one card).
name_language = "es"
# chara_param ids never offered (e.g. exclude = [0x12345678]).
exclude = []
# Where the Draft tile can be played: "campaign" (Campaign and Tournament) and "free_match" (the 1 vs 1 grid).
modes = ["campaign", "free_match"]
# Mouse hover selects and left click confirms on the Draft screen; false = keys / pad only.
mouse = true

[draft.pack]
# The «pack opening» of a place's 5 candidates.
intro = 0.25          # darken + the band opening
deal = 0.22           # one card flying in face down
deal_stagger = 0.07   # between two cards dealt
flip = 0.22           # one card turning
settle = 0.12         # the card's bounce back after the turn
flash = 0.30          # the white flash over a turned card
gap = 0.45            # from one card's turn to the next
suspense = 0.40
outro = 0.28          # the chosen card flying to its place
dim = 0.72            # darkness behind the band (0 = none, 1 = black)
scale = 1.6           # the cards' size on the band (1 = 154 x 116 px)
spacing = 330         # between two cards' centres, px of the 1920 x 1080 screen
# Retail sounds: pack opening, card dealt, card turned, best card turned.
se_open = "sy0000"
se_deal = "sy0009"
se_reveal = "sy0010"
se_best = "sy0080"

[draft.pitch]
# How the starters' cards fit the Draft's pitch (BattleBayDeluxe.draft_pitch_layout).
card_scale = 1.05         # the cards' size
card_width = 106.6        # the small card's width at scale 1
card_height = 96          # the small card's height at scale 1
card_gap = 8              # the least space between two cards
edge_margin = 6           # the least space between a card and the pitch's lines
same_row_distance = 30    # cards this close in height form one row
symmetry_tolerance = 40   # a row this close to symmetric is made symmetric

[tournament]
# Where the options' cursor starts: "knockout" or "groups" (groups of 4, round robin, the first 2 to a knockout).
format = "knockout"
# 4, 8, 16, 32 or 64 (groups: 8 to 64); only counts the Battle Bay pool fills are offered (no byes).
teams = 16
filter_minor = false
# Story matches: soccer_game_config keys matched with *.
filter_story_games = ["fbtl_st_*"]
# Seeds: the strongest teams kept apart (one per group).
seeded = true
goals = 1.3
strength_weight = 0.035
penalty_score = 0.75
penalty_kicks = 5
# Rulebook id of the player's knockout matches (content\rules\bbd_knockout.toml).
knockout_rules = "bbd_knockout"
# Rulebook id of the final; "" = the knockout rulebook.
final_rules = "bbd_final"
# Final stadiums, one drawn per tournament (soccer_game_option maps); [] = the Battle Bay's own stadium.
final_stadiums = [
  "s01g001",  # Football Frontier Stadium
  "s14g001",  # Legendary Football Frontier Stadium
  "s24g001",  # Fierce Football Frontier Stadium
  "s15g001",  # Titanic Stadium
  "s17g001",  # Saints' Way Stadium
  "s18g001",  # Zenith Stadium
  "s19g001",  # Ragnarok Stadium
  "s32g001",  # Lost Galaxy Stadium
  "s06g001",  # Astro Ray Stadium
  "s11g001",  # Zeus Stadium
  "s78g001",  # Odaiba Football Stadium
  "s84g001",  # Moscow Route Bay Main Stadium
  "s88g001",  # Victory Road Stadium
]
# 0 = a new draw every tournament; any other number = the same bracket and results (testing).
seed = 0
# Teams never drawn (team_config keys): every team wearing the same kit as one of these
exclude_same_kit_as = ["tm_prc_050200"]
# every team with the same emblem as one of these
exclude_same_emblem_as = ["tm_cro_original_0700"]
# these teams themselves
exclude_teams = []

[bracket_strips]
# Each team's bracket strip takes its emblem's colour.
names = ["red", "orange", "yellow", "green", "cyan", "blue", "purple", "pink", "black", "silver"]
# Each colour from its first to its last hue (degrees): the nearest listed hue names the emblem.
hues = [
  { name = "red", hue = 340 }, { name = "red", hue = 14 },
  { name = "orange", hue = 15 }, { name = "orange", hue = 39 },
  { name = "yellow", hue = 40 }, { name = "yellow", hue = 69 },
  { name = "green", hue = 70 }, { name = "green", hue = 164 },
  { name = "cyan", hue = 165 }, { name = "cyan", hue = 199 },
  { name = "blue", hue = 200 }, { name = "blue", hue = 254 },
  { name = "purple", hue = 255 }, { name = "purple", hue = 289 },
  { name = "pink", hue = 290 }, { name = "pink", hue = 339 },
]
# Too little colour (strength or coloured share below these): black when darker than dark_below, else silver
min_strength = 0.05
min_share = 0.15
dark = "black"
dark_below = 0.4
light = "silver"

[league]
# Round robin of every team (3 points a win, 1 a draw); pool, filter, simulation and exclusions from [tournament].
teams = 12
# true = every pair plays home and away
double = false
# Teams on one standings page (4 to 18)
rows_per_page = 12
# «Sin selecciones nacionales» start value (national sides: content\team_tags\national.toml)
no_national = false
name_language = "es"
# Simulated top scorers: a starter's share of his team's goals = kick stat x his position's weight
scorer_weight_forward = 1.0
scorer_weight_midfielder = 0.45

[net]
# «Sala privada»: both PCs play it as the Campaign match of this soccer game at this difficulty (0-3).
game = 0x8F85B173
difficulty = 1

[daily_challenge]
# Seed = the date (YYYYMMDD) + salt + version; change salt or version for other runs (every player needs the same values).
salt = "BattleBayDeluxe.DailyChallenge"
version = 1
# Matches of a run (1-3); a lost match is played again
matches = 3
# Difficulty of each match (1-4); a shorter list repeats its last value
difficulty = [2, 2, 3]
# Days whose result the save keeps
keep_days = 60

[daily_challenge.pool]
# Team table rows of this level whose key matches one of these globs, one per team name, in key order
level = 40
team_keys = ["bbcr_*_bb"]
