id = "ClassicCards"
# name / description: English fallback of the text keys mod_name / mod_description (text\keys.toml)
name = "Classic Cards"
version = "0.3.0"
author = "Fantasy Team"
description = "Every normal player is a 5★ Legend, as in the classic Inazuma Eleven games: no rarities, rarity-up or fusion. Cards are coloured by position, and special rarities such as Hero and Diamond keep their look by default."
priority = 0
tags = ["Characters", "Gameplay"]
updated = "2026-11-09"
prefix = "ClassicCards"
folder = "ClassicCards"
# Grafts (research/grafts, mod = ClassicCards): rar_dock, rar_menus, no_more_rarities_filter.
requires = ["VRFW>=0.3.0", "CharacterReforged>=0.3.0"]
optional = ["BetterQoL", "BetterUI"]
conflicts = []
loader_modules = ["lua_bridge"]
# patches of INCLUDE'd scripts (the filter includes)
loader_min = "1.7.0"

[layout]
script_folders = ["duplicate_rules", "team_planner"]

[module]
of = "CharacterReforged"
order = 70

# Lua functions other mods may call (assets\lua\_all\no_more_rarities_card_look.lua, no_more_rarities_header.lua)
[exports]
game_lua = ["ClassicCards.header_band_colour", "ClassicCards.header_shows_rarity", "ClassicCards.rarity_removal_applies",
  "ClassicCards.position_colour", "ClassicCards.position_look_of_type", "ClassicCards.normal_card_rarity",
  "ClassicCards.rarity_removed", "ClassicCards.shown_rarity"]
