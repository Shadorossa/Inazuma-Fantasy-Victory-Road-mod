# Settings of Player Training's scripts (kind VRFW.script/1, docs/framework/scripts.md §2). One [[script]] per entry
# point; every other .lua below scripts\ (lib\) is a library for `require`.
schema = "VRFW.script/1"

# The training commands, the stats in a match (lib\stat_effects.lua) and the rival match training
# (lib\rival_training.lua) share this VM. A training view loads its player once (not once per stat); the first load of
# a session also reads Character Reforged's card values and the slot's Suerte store, which went over the default
# budget (200000) once and switched the whole script off. Margin for that first load:
[[script]]
file = "player_training.lua"
budget = 1000000
memory_kb = 32768
