# Battle Bay Draft screen (campaign + free match), the squad viewer, the draft sync on the top menus and the
# owned AI difficulty. Globals only; nothing runs at chunk load except a pure-Lua footer declaration.
name = "bb_draft"
mod = "BattleBayDeluxe"
order = 345
module = "lua_bridge"
requires = []
conflicts = []
wraps = ["OnInit", "OnSetupLayer", "OnOpenLayer", "OnDecideFocus", "OnBack", "OnFunction", "OnCloseEndLayer", "Step", "SetupEmblemIcon", "UpdateFormation", "UpdateTacticsLayer", "UpdateButtonGuide", "OnChangeFocus", "GetSelectDifficultyIdx"]
description = "Battle Bay Draft screen, squad viewer and owned AI difficulty"

[[files]]
stem = "enjoy_team_select_menu_campaign"

  # first: the innermost OnDecideFocus wrapper
  [[files.ops]]
  type = "append_block"
  source = "bbd_difficulty_common.lua"
  marker = "bb_draft difficulty common"

  [[files.ops]]
  type = "append_block"
  source = "bbd_difficulty_campaign.lua"
  marker = "bb_draft difficulty campaign"

  [[files.ops]]
  type = "append_block"
  source = "bbd_campaign.lua"
  marker = "bb_draft"

  [[files.ops]]
  type = "append_block"
  source = "bbd_filters.lua"
  marker = "bb_draft filters"

  [[files.ops]]
  type = "append_block"
  source = "bbd_roster.lua"
  marker = "bb_draft roster"

  [[files.ops]]
  type = "append_block"
  source = "bbd_diff_cursor.lua"
  marker = "bb_draft difficulty cursor"

[[files]]
stem = "enjoy_team_select_menu_offline"

  [[files.ops]]
