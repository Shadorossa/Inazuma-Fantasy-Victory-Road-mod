schema = "VRFW.text/2"
table = "skill_text"
# Names of the warrior spirits of content/techniques/warrior_spirits.toml, short (variant 0) and long (variant 11).

[[row]]
id = 0xEC078783  # InazumaFantasy.keshin_k002011_name
kind = "noun"
de = "Victoria, Schatten des Triumphs"
en = "Victoria, Shadow of Triumph"
es = "Victoria, sombra del triunfo"
fr = "Victoria, ombre du triomphe"
it = "Victoria, ombra del trionfo"
ja = "勝利の影 ヴィクトリア"
pt = "Victoria, sombra do triunfo"
zh_hans = "胜利之影 维克多利亚"
zh_hant = "勝利之影 維克多里亞"

[[row]]
id = 0xEC078783  # InazumaFantasy.keshin_k002011_name, long form
kind = "noun"
variant = 11
de = "Victoria, Schatten des Triumphs"
en = "Victoria, Shadow of Triumph"
es = "Victoria, sombra del triunfo"
fr = "Victoria, ombre du triomphe"
it = "Victoria, ombra del trionfo"
ja = "勝利の影 ヴィクトリア"
pt = "Victoria, sombra do triunfo"
zh_hans = "胜利之影 维克多利亚"
zh_hant = "勝利之影 維克多里亞"

[[row]]
id = 0xB99155D1  # InazumaFantasy.keshin_k002011_desc
kind = "text"
de = "Als Windgeist schöpft die Göttin des Triumphs\\naus tiefen Bindungen, um verborgene Kräfte\\nzu erschließen."
en = "The Triumph Goddess, a spirit of wind.\\nDraws on deep bonds to tap into latent strength."
es = "Un espíritu del viento.\\nRecurre a un vínculo profundo para liberar\\nsu triunfante poder latente."
fr = "La déesse du triomphe, un esprit du vent.\\nPuise dans les liens profonds pour faire\\nsurgir sa force cachée."
it = "Spirito vento. Dea del Trionfo, sfrutta i legami\\nprofondi per sprigionare la sua forza nascosta."
ja = "[勝利/しょうり]を[祈/いの]る[女神/めがみ]のような　[風/かぜ]の[化身/けしん]。\\n[強/つよ]い[絆/きずな]を[源/みなもと]として　[秘/ひ]めた[力/ちから]を[解/と]き[放/はな]つ。"
pt = "A Deusa do Triunfo, um espírito de vento.\\nSua força advém dos vínculos entre as pessoas."
zh_hans = "宛如为胜利祈祷的女神化作的风之化身。\\n以牢不可破的纽带，解放潜藏之力。"
zh_hant = "宛如為勝利祈禱之女神的風之化身。\\n以強烈的紐帶為源，解放潛藏的力量。"

