  [technique.text.ja]
  name = "風神の舞（ハロウィン）"
  description = "目にも留まらぬ超スピードで乱舞！\n竜巻の渦に巻き込み　逃さない。"
  [technique.text.en]
  name = "Wind God's Dance (Halloween)"
  description = "A wild dance too fast for the naked eye to perceive!\nTrap the opposition in a violent vortex."
  [technique.text.es]
  name = "Danza del viento (Halloween)"
  description = "Baile salvaje a una velocidad cegadora que atrapa al rival\nen el vórtice de un huracán del que no escapará."
  [technique.text.fr]
  name = "Danse d'Éole (Halloween)"
  description = "Foncez à une vitesse aveuglante et\nemportez quiconque pénètre dans votre tourbillon !"
  [technique.text.de]
  name = "Tanz des Aeolus (Halloween)"
  description = "Ein blitzschneller, wilder Tanz!\nEs gibt kein Entkommen vor dem Sog des Tornados."
  [technique.text.it]
  name = "Turbine Supremo (Halloween)"
  description = "Una danza troppo veloce per l'occhio umano.\nAvvolge l'avversario in un\ntornado e non lo lascia scappare."
  [technique.text.pt]
  name = "Dança do Deus do Vento (Dia das Bruxas)"
  description = "A dança do tornado tem uma velocidade incrível!\nAdversários envolvidos por ela não têm escapatória."
  [technique.text.zh_hans]
  name = "风神凌舞（万圣节）"
  description = "以目不暇接的超高速在球场起舞！\n谁都无法逃离龙卷旋涡的吞噬。"
  [technique.text.zh_hant]
  name = "風神凌舞（萬聖節）"
  description = "以肉眼無法捕捉的超速狂亂起舞！\n龍捲風吞噬對手，任誰都休想逃離。"

