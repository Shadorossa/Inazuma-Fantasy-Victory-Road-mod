# gamedata\item\item_config.toml; not the inverted clown kit uni_u120001_20 nor the old Zeus kit uni_u912001), all free.
# With Inazuma Fantasy the Mercado BB is emptied (its rows move to its Tienda general), so there they go to the Tienda
