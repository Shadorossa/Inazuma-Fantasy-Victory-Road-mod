schema = "VRFW.game/2"

# (key, map crc | 0, members, uniform) -> accepted, why; no key = current scene and pending travel.
[[VRFW.Command]]
name = "CMND_VRFW_MENU_SCENE_TRAVEL"
handler = "MenuScene.Travel"

# bool MoveMainState::Update(state, machine): one frame of the field state of the rpg scene.
[[VRFW.Hook]]
name = "MenuScene.MoveMainUpdate"
game = "Scene.RpgMoveMainUpdate"
kind = "function"
apply = "script"
pre_when = { state = "VRFW.menu_scene.armed", equals = 1 }

# 1 while a menu scene's map is loading (set by the script): the detour calls the script only then.
[[VRFW.State]]
key = "VRFW.menu_scene.armed"

# The reservation manager: the map jump reservation (its status and the map it names).
[[VRFW.Global]]
name = "menu_scene_reserve_manager"
game = "Chronicle.ReserveManager"

# Player data block (holds the play-mode byte).
[[VRFW.Global]]
name = "menu_scene_play_data"
base = "game_root"
chain = ["ROOT_PLAY_DATA"]

# RPG root (holds the no-press-start flag).
[[VRFW.Global]]
name = "menu_scene_rpg"
game = "Route.Rpg"

[[VRFW.Hook]]
name = "MenuScene.CameraView"
game = "Camera.UpdateView"
kind = "function"
apply = "script"
arguments = ["ptr"]
pre_when = [
  { state = "VRFW.menu_scene.camera", equals = 1 },
  { value = "[args[1] + 0x70]:u32", in_table = "VRFW.MenuScene.Cameras" },
]

# 1 while a menu scene's shots drive a camera (set by the script).
[[VRFW.State]]
key = "VRFW.menu_scene.camera"

[[VRFW.Struct]]
name = "MenuScene.Camera"
size = 0x330
fields = { pos_x = { at = 0x30, type = "f32" }, pos_y = { at = 0x34, type = "f32" }, pos_z = { at = 0x38, type = "f32" }, target_x = { at = 0x2B0, type = "f32" }, target_y = { at = 0x2B4, type = "f32" }, target_z = { at = 0x2B8, type = "f32" }, fov = { at = 0x2E4, type = "f32" }, proj_dirty = { at = 0x30C, type = "u8" }, clip_near = { at = 0x2EC, type = "f32" }, clip_far = { at = 0x2F0, type = "f32" }, view_eye_x = { at = 0x290, type = "f32" }, view_eye_y = { at = 0x294, type = "f32" }, view_eye_z = { at = 0x298, type = "f32" }, view_axis_x = { at = 0x2A0, type = "f32" }, view_axis_y = { at = 0x2A4, type = "f32" }, view_axis_z = { at = 0x2A8, type = "f32" }, view_up_x = { at = 0x2C0, type = "f32" }, view_up_y = { at = 0x2C4, type = "f32" }, view_up_z = { at = 0x2C8, type = "f32" }, world_ver = { at = 0x304, type = "u32" }, view_ver = { at = 0x308, type = "u32" }, parent_ver = { at = 0x90, type = "ptr" } }

# The Kizuna town data block of the game root: the save's avatar (a character handle) at +0x15610.
[[VRFW.Global]]
name = "menu_scene_kizuna"
base = "game_root"
chain = ["Game.RootKizunaTown"]

[[VRFW.Struct]]
name = "MenuScene.Kizuna"
size = 0x15618
fields = { avatar = { at = 0x15610, type = "u32" } }

# Game reset (queues the end of the rpg scene and the title): the fail-safe when a scene's map never comes up.
[[VRFW.Function]]
name = "MenuScene.GameReset"
game = "Game.Reset"

[[VRFW.Struct]]
name = "MenuScene.ReserveManager"
size = 0x24
fields = { map_jump_status = { at = 0x10, type = "u32" }, map_jump_map = { at = 0x20, type = "u32" } }

# MoveMainState: 1 once its first frame set the field up.
[[VRFW.Struct]]
name = "MenuScene.MoveMainState"
size = 0x10
fields = { entered = { at = 0x9, type = "u8" } }

# The rpg state machine an Update gets: the next state an Update returning true goes to.
[[VRFW.Struct]]
name = "MenuScene.RpgMachine"
size = 0x16
fields = { next_state = { at = 0x15, type = "u8" } }

# The play-mode byte of the player data block (written only by the rpg InitState in the game).
[[VRFW.Struct]]
name = "MenuScene.PlayData"
size = 0x2CAC70
fields = { play_mode = { at = 0x2CAC6F, type = "u8" } }

# ---- commands (game Lua: lua/menu/<stem>/150_menu_scene.lua)

# (menu name) -> the scene key for that menu, "" when none (or the scene failed this session).
[[VRFW.Command]]
name = "CMND_VRFW_MENU_SCENE_FOR"
