id = "HissatsuLevelUp"
former_ids = ["true_hissatsu", "TrueHissatsu"]
# key_id: the mod's data is tied to its own id since 1.8.0 (docs/framework/merged-mods.md §5.2): saves, option values,
# the loader config's [mods.<id>] and every number of `true_hissatsu.<name>` are read from the old key id once / kept
key_id = "HissatsuLevelUp"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "Hissatsu Level Up"
version = "0.2.2"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Special moves level up the classic way: each player's move grows with the times he uses it in matches, and a banner says when it levels up. The last level needs the Ultimate Evolution Manual from the general shop, and a game item becomes the Technique Upgrade (+1 level). A player can no longer carry the same special move twice. From G5 on, some moves play the cut-in of their evolution."
priority = 0
tags = ["Techniques", "Gameplay"]
updated = "2026-11-01"
prefix = "HissatsuLevelUp"
folder = "HissatsuLevelUp"
# Split out of Inazuma Fantasy: IF's technique ranks by use (module skill_rank), the grade-up banner (graft sr_popup),
# the move-rank items and the one-copy-per-set rule. Standard mod layout (docs/framework/mod-layout.md):
#   config.toml                       [ranks] the use curve and the rules, [duplicates] the one-copy rule
#   content\hissatsu_level_up\grade_animations.toml  [[HissatsuLevelUp.GradeAnimation]]: from G5 a move plays its
#                                     evolution's cut-in (VRFW.cutin.by_grade; Mano celestial -> EV, Parada celestial
# > TURBO)
#   content\game\hissatsu_level_up.toml   the engine entries (hooks, functions, globals), the commands, the save import
#   content\items\rank_items.toml     the retail abl_000001 «Nuevas posibilidades» renamed «Mejora de supertécnica», THE
#                                     +1 item since 1.12.0 (the old own book abl_ub000001 is given by nothing; a save's
#                                     stock becomes abl_000001, graft sr_popup) + the Cuaderno de evolución
#                                     definitiva (Galaxy's 究極進化の書); content\shops\ their shop rows; their icons in
#                                     content\images\ (the book's: a recipe of the retail icon; the manual's PNG in
#                                     assets\images\)
#   scripts\hissatsu_level_up.lua (+ lib\) the run time: the store, the hooks, the commands, the exports
#   text\                             mod texts, the rank items' messages and the banner suffix (9 languages)
# Grafts: research/grafts/sr_popup (mod HissatsuLevelUp: the banner); research/grafts/move_rank_items:
# the key is Start (CMD_FUNC1) in both, with «<Start> Subir nivel» in the guide (as in Inazuma
#   Fantasy). Character Reforged's «Fantasy» skill table: a row action of its host (content\menus\
#   skill_table_rank_items.toml, Sí / No window); Victory Road's own board: Start on a move piece (the retail quick bean
#   equip stays on the other pieces), two presses through the board's telop, the guide entry through VRFW_FooterPrompts.
# Other mods' data read as rules: content\hissatsu_level_up\*.toml [HissatsuLevelUp.Rules] of any active mod (e.g.
# Inazuma Fantasy: no rank-up by use in INAROGUE), the cards' VRFW.MoveGrades (recruit grades) of any mod.
# HissatsuReforged: its base. Character Reforged is NOT required: True Hissatsu owns its rules in both views (the
# retail board: Board.CanEquip hook; Character Reforged's «Fantasy» skill table, when that mod is on: the data it
# reads, content/skill_set/hissatsu_level_up.toml, and the row action its host calls; the [[host]] is declared here
# too so the entry stays valid while Character Reforged is off).
# VRFW 2.475.84: the match move level (lib/match_move_level.lua) the opponents' grade at a match install reads.
requires = ["VRFW>=0.2.2", "HissatsuReforged>=0.2.2"]
optional = ["CharacterReforged"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
permissions = ["memory", "call", "command", "hook"]

# What other mods call:
#   CanPlace(hdl, slot, item) -> ok, reason   may item go on board slot `slot` (0..8) of card `hdl`? (one copy per set)
#   Uses(hdl, skill) -> uses, grade, next     Grade(hdl, skill) -> grade (0..5)
#   Items() -> raise item id, last-grade item id, use cap, last grade
#   StoreBlob(slot) -> text | nil             StoreBlobWrite(slot, text) -> ok, why (the per-slot store, blob skill_uses.json)
[exports]
functions = ["CanPlace", "Uses", "Grade", "Items", "StoreBlob", "StoreBlobWrite"]
# [HissatsuLevelUp.Rules] in any mod's content\hissatsu_level_up\*.toml (schema HissatsuLevelUp.rules/1; that mod lists
# "hissatsu_level_up" in its [layout] script_folders): later mods win key by key
keys = ["Rules"]
# the menu-VM functions other mods' screens call by name: Character Reforged's skill table host calls
# HissatsuLevelUp.SkillTableRankItem(phase, ctx) (graft move_rank_items, rank_items_skill_table.lua)
game_lua = ["HissatsuLevelUp.SkillTableRankItem"]

# content\skill_set\ is read by Character Reforged (its place rules as data): the layout lint accepts it
[layout]
script_folders = ["skill_set", "hissatsu_level_up"]

# A MODULE of Hissatsu Reforged: shipped in HissatsuReforged\modules\HissatsuLevelUp\; the Mods screen, the ModManager
# and `vrfw list` show it inside Hissatsu Reforged's entry («Módulos y ajustes»: on / off) instead of as a mod of its
# own; switching Hissatsu Reforged off switches it off too. Its name there: its mod_name (text\keys.toml).
[module]
of = "HissatsuReforged"
order = 20
