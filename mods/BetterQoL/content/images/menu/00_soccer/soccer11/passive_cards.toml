schema = "VRFW.image/1"

[[texture]]
atlas = "#/menu/00_soccer/better_qol_own/better_qol_soccer11_20.g4tx"
name = "better_qol_soccer11_20"
size = [72, 92]

[[sprite]]
atlas = "#/menu/00_soccer/better_qol_own/better_qol_soccer11_20.g4tx"
name = "betterqol_passive_card_sel"
texture = "better_qol_soccer11_20"
x = 0
y = 0
size = [72, 92]
recipe = "sel"

# ---- the retail card itself, and its silhouette with the alpha stretched to full (its peak is below 255) ------------
[[recipe]]
name = "card"
game = "#/menu/00_soccer/soccer11/soccer11_20/soccer11_20.g4tx"
sprite = "passive_base01"
ops = [{ op = "resize", size = [66, 86] }]

[[recipe]]
name = "shape"
game = "#/menu/00_soccer/soccer11/soccer11_20/soccer11_20.g4tx"
sprite = "passive_base01"
ops = [{ op = "resize", size = [72, 92] }, { op = "alpha_normalize" }]

# ---- the edited slot: a cyan silhouette with the retail card on it, 3 px smaller = a cyan rim round the card ---------
[[recipe]]
name = "rim"
from = "shape"
ops = [{ op = "fill", rgb = [0, 200, 255] }]

[[recipe]]
name = "sel"
canvas = [72, 92]
ops = [{ op = "paste", image = "rim", at = [0, 0] }, { op = "paste", image = "card", at = [3, 3] }]
