# Declaration schema of the board groups (content\board_groups\*.toml, docs/framework/route-board.md §9):
schema = "VRFW.decl_schema/1"
kind = "VRFW.board_group/1"
folder = "content/board_groups"
# v2 words, read beside the v1 ones until the switch: the type, its kind folder and its format version.
v2_type = "VRFW.BoardGroup"
v2_kind_folder = "BoardGroups"
v2_version = 1
label = "Board node groups"
label_es = "Grupos de nodos del tablero"
doc = "Chronicle board nodes that a hide switch hides at once (only not drawn and not focusable; their data stays)."
doc_es = "Nodos del tablero de la Crónica que un interruptor oculta a la vez (solo dejan de dibujarse y de poder seleccionarse; sus datos se mantienen)."

[entry.BoardGroup]
doc = "Chronicle board nodes a hide switch hides at once (visual only: not drawn, not focusable; their data and save state stay)"
name = { type = "name", required = true, doc = "key <mod>.<name> (a-z 0-9 _)" }
nodes = { type = "strings", required = true, doc = "the [[VRFW.RouteNode]] Names of the nodes (any mod's)" }
hideable = { type = "bool", default = true, doc = "the hide switch hides these nodes" }
chain = { type = "string", doc = "a shared chain id (a-z 0-9 _, no mod prefix): the ModManager «Cadenas» section shows every group of every mod with this id as ONE chain of board nodes; the first mod in load order declares it (its title), the others add their nodes. No effect in game" }
title = { type = "string", ref = "text_key", doc = "with chain: the text row id of the chain's title (the declaring mod's text rows)" }
hidden = { type = "when", doc = "conditions under which these nodes are always hidden (not drawn, not focusable), asked each time a board opens: e.g. { option = \"<mod>.<row>\", equals = 1 }; the hide switch does not show them" }
when = { type = "when", doc = "conditions on the declaring mod's config: all must hold, else the declaration is left out" }
