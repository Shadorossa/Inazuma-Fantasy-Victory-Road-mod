id = "VRFW"
name = "VRFW"
icon = "#/menu/200_icon/16_icon_list_tab/icon_list_tab.g4tx:icon_list_tab_sixth01"
version = "0.3.0"
author = "Fantasy Team"
description = "The framework the other mods are built on: it lets mods add characters, teams, special moves, texts in 9 languages, save data, match rules, game modes, audio and menus, and it provides the Mods screen with its options. Needed by the mods that use it."
# the base loads first: the mods that use it load after it (and win their conflicts)
priority = -10
tags = ["Framework"]
updated = "2026-11-09"
# No plugin key: the framework's code is linked into the ModLoader (winmm.dll) and runs for the mod with this id.
requires_api = "2"
provides = [
    "VRFW.rarity",
    "VRFW.character",
    "VRFW.look",
    "VRFW.team",
    "VRFW.anim",
    "VRFW.technique",
    "VRFW.item",
    "VRFW.fx",
    "VRFW.model",
    "VRFW.table",
    "VRFW.mode",
    "VRFW.transform",
    "VRFW.system",
    "VRFW.theme",
    "VRFW.image",
    "VRFW.menu",
    "VRFW.telop",
    "VRFW.text",
    "VRFW.save",
    "VRFW.audio",
    "VRFW.match",
    "rarity_engine=1.0.0",
    "character_engine=1.5.0",
    "look_engine=1.0.0",
    "team_engine=1.0.0",
    "anim_engine=1.1.0",
    "technique_engine=2.1.0",
    "item_engine=1.0.0",
    "fx_engine=1.0.0",
    "model_engine=1.0.0",
    "table_engine=1.0.0",
    "mode_engine=1.0.0",
    "transform_engine=1.1.0",
    "system_engine=1.0.0",
    "armed_voice",
    "voice_packs",
    "match_rules",
    "theme_engine=1.0.0",
    "image_engine=1.0.0",
    "menu_engine=1.0.0",
    "telop_engine=1.2.0",
    "text_engine=1.1.0",
    "save_engine=1.3.0",
    "audio_engine=1.3.0",
    "match_engine=1.2.1",
    "mod_options=1.0.0",
    "mods_menu=1.3.0",
    "changelog=1.0.1",
]
# Lua patch roots, one per topic under assets\lua\; run in this order.
lua_roots = ["assets/lua/option", "assets/lua/sound", "assets/lua/mods_screen", "assets/lua/changelog", "assets/lua/save", "assets/lua/mode", "assets/lua/menu", "assets/lua/archetype", "assets/lua/synergy", "assets/lua/anim"]
loader_modules = ["lua_bridge"]
# loader_min: the framework needs ModLoader 2.0.0 (an older loader would load this folder as data only).
loader_min = "2.0.0"
# Native access used by content\game: byte patches, functions, hooks, commands and state keys.
permissions = ["patch", "memory", "call", "command", "state", "hook"]
# content\ folders the framework's scripts and run times read in every mod (not types, no declaration schema)
# word that names this mod's byte edits in the game profile (research/scripts/profile_extract.py)
profile_edit_word = "Unsigned"

[layout]
script_folders = ["archetypes", "camera_drives", "community_links", "contact_maps", "editor", "random_teams", "redeem_codes", "screen_art", "story_start", "talk_templates"]

[[VRFW.DebugSwitch]]
Flag = "reveal_all"
Config = "debug.reveal_all"

[[VRFW.DebugSwitch]]
Flag = "all_chains"
Config = "debug.all_chains"

[[VRFW.DebugSwitch]]
Flag = "free_gacha"
Config = "debug.free_gacha"

[[VRFW.ModTag]]
Id = "new_hissatsu"
Text = "VRFW.tag_new_hissatsu"
Short = "VRFW.tag_new_hissatsu_short"
Order = 10
# a new special move
[[VRFW.ModTag.Detect]]
Dir = "techniques"
Tables = ["technique"]

[[VRFW.ModTag]]
Id = "edited_hissatsu"
Text = "VRFW.tag_edited_hissatsu"
Short = "VRFW.tag_edited_hissatsu_short"
Order = 20
# an edit that sets anything but the visual keys (numbers, element, users, names, gameplay effects…)
[[VRFW.ModTag.Detect]]
Dir = "techniques"
Tables = ["edit"]
Outside = ["trajectory", "goal_event", "ground_trail", "color", "ball", "effect_variant", "event", "fail_event", "telop", "icon", "effect_flags"]
Ignore = ["technique", "default_lang", "name"]
# a removed move, a changed keshin / armed command, an override, a passive of a move
[[VRFW.ModTag.Detect]]
Dir = "techniques"
Tables = ["remove", "aura", "aura_command", "aura_change", "override", "passive"]

[[VRFW.ModTag]]
Id = "hissatsu_vfx"
Text = "VRFW.tag_hissatsu_vfx"
Short = "VRFW.tag_hissatsu_vfx_short"
Order = 30
# an edit that only sets visual keys (flight, colours, effects, events, banner)
[[VRFW.ModTag.Detect]]
Dir = "techniques"
Tables = ["edit"]
Only = ["trajectory", "goal_event", "ground_trail", "color", "ball", "effect_variant", "event", "fail_event", "telop", "icon", "effect_flags"]
Ignore = ["technique", "default_lang", "name"]
# the scenes of the moves: cutscene environment, keeper scenes, hand-offs
[[VRFW.ModTag.Detect]]
Dir = "techniques"
Tables = ["event_env", "keeper_scene", "handoff"]
# effects (fx type) and special-move banners (telop type)
[[VRFW.ModTag.Detect]]
Dir = "effects"
[[VRFW.ModTag.Detect]]
Dir = "telop"
[[VRFW.ModTag.Detect]]
Dir = "telops"
