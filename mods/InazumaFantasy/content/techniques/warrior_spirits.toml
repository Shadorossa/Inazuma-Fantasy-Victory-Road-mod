# charas = []
# ```

# The game's default group sends k002011 to k002010's packs; this event ships the own packs of k002011 and me000010.
[[event_env]]
event = "ev80_00020"
tag_words = { set = { k002011 = "k002011", me000010 = "me000010" } }

# The armour of wks_fantasy_k002011 (no player owns it: CharacterReforged lets every bearer arm it).
[[aura_command]]
key = "was_fantasy_k002011"
from = "was00220"
cells = { name_text = 0xEC078783, desc_text = 0xB99155D1, aura_chara = 0x584CAA78, chara_param = 0x448719CB, order = 111 }
charas = []

# The armour of the keshin Niké (wks02060, no retail armour: CharacterReforged lets every bearer arm it).
# Surtur's armour (was00100): cut-in ev81_00040, where Niké plays Surtur's motion (_tools/nike_armour_cutin_build.py).
[[aura_command]]
key = "was_fantasy_k002060"
from = "was00100"
cells = { name_text = 0xD30DB060, desc_text = 0x530BDB68, aura_chara = 0x600A0C29, chara_param = 0x404B71CE, order = 112 }
charas = []

# ev81_00040 ships no pack of Niké: the mod's own (k002060), with Surtur's armour sound.
[[event_env]]
event = "ev81_00040"
tag_words = { set = { k002060 = "k002060" } }
snd_tag_words = { set = { k002060 = "k000100" } }

