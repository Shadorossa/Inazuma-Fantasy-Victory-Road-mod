# BetterQoL's in-match cut-in skip (graft block research/grafts/util_prematch_skip/cs_event.lua, docs/game/match/cutin-skip.md):
#   CMD_BETTERQOL_CUTIN_SKIP  a press (state 0) of the rows MENU_CTRL gives CMD_ENTER: pad 27, the game's own confirm
#                             button, and keyboard 39. The event start activates one of the three event controllers by
#                             the event's type (0xF614F0), so the command is in all three. None of them has CMD_ENTER.
schema = "VRFW.input/1"

[[command]]
ctrl = "EVENT_CTRL_VISUAL"
name = "CMD_BETTERQOL_CUTIN_SKIP"
pad = [0, 27]

[[command]]
ctrl = "EVENT_CTRL_VISUAL"
name = "CMD_BETTERQOL_CUTIN_SKIP"
keyboard = [0, 39]

[[command]]
ctrl = "EVENT_CTRL_TALK"
name = "CMD_BETTERQOL_CUTIN_SKIP"
pad = [0, 27]

[[command]]
ctrl = "EVENT_CTRL_TALK"
name = "CMD_BETTERQOL_CUTIN_SKIP"
keyboard = [0, 39]

[[command]]
ctrl = "EVENT_CTRL_RPG_FUNC"
name = "CMD_BETTERQOL_CUTIN_SKIP"
pad = [0, 27]

[[command]]
ctrl = "EVENT_CTRL_RPG_FUNC"
name = "CMD_BETTERQOL_CUTIN_SKIP"
keyboard = [0, 39]
