# Story-complete start (data: VRFW content\story_start\, built by
# research/mods/VRFW/_tools/story_start_build.py). A VRFW feature: built into
# mod VRFW (`menu_assemble.py build --mod VRFW`, packed by framework_pack.py), the commands
# (CMND_VRFW_STORY_START_*, CMND_VRFW_STORY_SET_PHASE; the 1.x CMND_VRFW_STORY_* aliases are gone) are answered by
# winmm.dll's save part (save_engine story_start), so no ModLoader module is named here. Always on with the slot
# service.
#   vrfw_save_slot_menu   the question after "Nueva partida" on an empty slot is part of the slot screen itself
#                        (graft save_slots, StoryAsk in vrfw_save_slot_menu.lua, text row vrfw_slot_story_ask)
#   title_menu_inc       title_menu_2 OnInit of that slot applies the post-story state once (ss_title_apply.lua; its
#                        data from VRFW.story.data(): the framework's content\story_start\*.toml, generated by
#                        research/mods/VRFW/_tools/story_start_build.py, served by scripts\story_start.lua), then autosaves
#   title_menu_2         host handler (ss_title2.lua): runs the apply from OnInit after the slot service's COMMIT
name = "story_start"
mod = "VRFW"
order = 150
requires = ["save_slots"]
conflicts = []
wraps = []
description = "New game with the Victory Road story already completed (one-time apply on the title)"

[[files]]
stem = "title_menu_inc"

  [[files.ops]]
  type = "append_block"
  source = "ss_title_apply.lua"
  marker = "story_start apply"

# title_menu_2 ships as lua_patches: mm_entry redefines OnInit after the chunk, which drops the include's __newindex
# wrapper above; the framework's title_menu_2 host runs the apply from a `before` OnInit handler (priority -900).
[[hooks]]
stem = "title_menu_2"
source = "ss_title2.lua"
