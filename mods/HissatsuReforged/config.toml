
[critical]
base_chance = 0
# on a critical hit the move's power × this (after every other power rule)
multiplier = 1.5
# the highest critical chance in percent, whatever adds up (other mods' passives included)
cap = 50
archetype_build = 0
# the skill table category of the keepers' moves (keeper_levels / keeper_per_rank apply to them)
keeper_move_category = 4

archetype_chance = 5
# ps10055: more points while level or behind on goals (retail: +7 % when level or behind)
archetype_level_or_behind_chance = 7
# ps10057: the critical multiplier + this % per rank (retail: castle wall pierce +1 % per rank)
power_per_rank = 1
# ps10059: tension units its team gets back on each of its critical hits (retail: tension needed for a breach -3.6 %)
crit_tension = 3.6
# ps10113 (keepers): its keepers' chance × (1 + this % × rank) (retail: keeper save rate +4 % per rank)
keeper_per_rank = 4

rank_up_seconds = 15
rank_down_on_crit = 4
levels = [0, 25, 50, 75, 100]
keeper_levels = [0, 25, 50, 75, 100]

[ranks]
thresholds = [10, 25, 50, 120]
mode = "uses"
recast_per_grade = 0.025
# the «<move> sube a Nv.N» banner in the match when a move levels up (text HissatsuReforged.RankUpSuffix)
popup = true
# one log line per counted use (loader.log)
log_uses = true
# The move-rank items (item keys = the item's key string, crc32 = its id; "" = none).
raise_item = "abl_000001"
last_grade_item = "abl_ue000001"
last_grade_item_only = true

[duplicates]
block = true
