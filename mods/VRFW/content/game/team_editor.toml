schema = "VRFW.game/2"

# Team editor (docs/framework/team-editor.md; menu side assets/lua/menu/_all/81_team_editor.lua, logic
# scripts\team_editor.lua). A team set's kit as every consumer reads it: TeamInfo +0x290 (CMND_GET_TEAM_SET_INFO
# field 7, the dock's 3D players, face icons, the match team record); +0x294 is the owned kit item (field 12), which
# the dock's kit icon reads first. The retail field 5 write does not reach +0x290 for a team set.

# the party (team sets): [[g_gameRoot] + Game.RootParty]
[[VRFW.Global]]
name = "TeamEditorParty"
base = "game_root"
chain = ["Game.RootParty"]

# TeamInfo of (party, set, team)
[[VRFW.Struct]]
name = "TeamEditorTeamInfo"
game = "TeamInfo"
fields = { Uniform = { at = 0x290, type = "u32" }, UniformItem = { at = 0x294, type = "u32" } }

# (set, team, uniform) -> ok, the set's uniform now: the uniform written, the owned kit item cleared (the icon then
# shows the uniform). Used inside a save session only (the session's restore puts both back).
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_SET_KIT"
handler = "TeamEditor.SetKit"
needs = ["Team.SetStruct", "TeamEditorParty", "TeamEditorTeamInfo"]

# (chara handle, share 0..1) -> ok, the EXP inside his level now: the character's EXP bar at that share of his current
# level (record + 8, never a level-up): a mode's progress shown on the team screen's temporary players
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_MEMBER_EXP"
handler = "TeamEditor.MemberExp"

# (set, team [, uniform [, src_team]]) -> ok, the team's uniform now: read (no uniform) or write a team's kit (teams 0..2
# of a set; the rules: scripts	eam_editor.lua TeamEditor.Uniform). The shared kit command of the modes that dress a
# team (pachangas, rogue runs); BetterQoL's CMND_BETTERQOL_TEAM_UNIFORM / CMND_EVT_TEAM_UNIFORM are its former names.
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_UNIFORM"
handler = "TeamEditor.Uniform"
needs = ["Team.SetStruct", "TeamEditorParty", "TeamEditorTeamInfo"]

# Shared state keys of the team screens: declared here without a value, written by any mod (VRFW.state.set).
# The uniform a team without a kit may take now (0 / none = none); team_editor.lua reads it.
[[VRFW.State]]
key = "vrfw.team_uniform.kitless"

# The team dock page a mod mounts now (-1 / none = the retail dock); lib/team_dock.lua (TeamDock.page) reads it.
[[VRFW.State]]
key = "vrfw.team_dock.page"
