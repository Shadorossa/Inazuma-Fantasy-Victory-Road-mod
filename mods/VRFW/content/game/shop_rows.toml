schema = "VRFW.game/2"

# Locked shop rows.

[[VRFW.Hook]]
name = "ShopRows.Condition"
game = "Shop.RowCondition"
apply = "script"
post_when = { value = "[regs.r14]:u32", not_in_table = "ShopRows.Skip" }

# u64 ListViewFill(layerItem, args*, row**), pre hook.
[[VRFW.Hook]]
name = "ShopRows.Fill"
game = "Shop.RowFill"
apply = "script"

# --- commands ---

[[VRFW.Command]]
name = "CMND_VRFW_SHOP_LOCK_SHOPS"
handler = "ShopRows.Shops"

# (inst) -> locked, row id, kind, a, b: the row a shop list layer instance shows.
[[VRFW.Command]]
name = "CMND_VRFW_SHOP_LOCKED"
handler = "ShopRows.Locked"

# (item) -> locked, kind, a, b: whether a row selling this item is locked.
[[VRFW.Command]]
name = "CMND_VRFW_SHOP_LOCKED_ITEM"
handler = "ShopRows.LockedItem"

# (shop id) -> whether rows of this shop are listed as locked.
[[VRFW.Command]]
name = "CMND_VRFW_SHOP_LOCK_ON"
handler = "ShopRows.On"

# (kind, a, b, language code) -> form, name, number, text id: what a locked row waits for, named from the game's tables.
[[VRFW.Command]]
name = "CMND_VRFW_SHOP_LOCK_SOURCE"
handler = "ShopRows.Source"
