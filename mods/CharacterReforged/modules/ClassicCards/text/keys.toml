schema = "VRFW.text_key/1"
# Texts of «No More Rarities»: the «Mods»
# screen's name and description. A language missing here falls back to English. The one-card-per-character limit is the
# module New Recruitment's (its text\keys.toml).
default_lang = "en"

[en.new]
mod_name = "Classic Cards"
mod_description = "Every normal player is a 5★ Legend, as in the classic Inazuma Eleven games: no 1★-4★ rarities, rarity bonuses, rarity-up or fusion, and saves are converted to 5★ cards. Normal cards are coloured by position: goalkeeper gold, defender green, midfielder blue, forward red. Only the basic rarities lose their rarity look: Hero and Diamond cards keep theirs."


[es.new]
mod_name = "Cartas clásicas"
mod_description = "Todo jugador normal es una Leyenda 5★, como en los Inazuma Eleven clásicos: sin rarezas 1★-4★, bonus de rareza, subida de rareza ni fusión, y las partidas se convierten a cartas 5★. Las cartas normales se colorean por posición: portero dorado, defensa verde, centrocampista azul, delantero rojo. Solo las rarezas básicas pierden su aspecto: las cartas Héroe y Diamante mantienen el suyo."


[fr.new]
mod_name = "Cartes classiques"
mod_description = "Chaque joueur normal est une Légende 5★, comme dans les Inazuma Eleven classiques : plus de raretés 1★-4★, de bonus de rareté, de montée de rareté ni de fusion, et les sauvegardes sont converties en cartes 5★. Les cartes normales sont colorées selon le poste : gardien or, défenseur vert, milieu bleu, attaquant rouge. Seules les raretés basiques perdent leur aspect : les cartes Héros et Diamant gardent le leur."


[de.new]
mod_name = "Klassische Karten"
mod_description = "Jeder normale Spieler ist eine 5★-Legende, wie in den klassischen Inazuma-Eleven-Spielen: keine Seltenheiten 1★-4★, keine Seltenheitsboni, kein Aufstufen und keine Fusion, und Spielstände werden auf 5★-Karten umgestellt. Normale Karten sind nach Position gefärbt: Torwart gold, Verteidiger grün, Mittelfeld blau, Stürmer rot. Nur die einfachen Seltenheiten verlieren ihr Aussehen: Helden- und Diamantkarten behalten ihres."


[it.new]
mod_name = "Carte classiche"
mod_description = "Ogni giocatore normale è una Leggenda 5★, come negli Inazuma Eleven classici: niente rarità 1★-4★, bonus di rarità, aumento di rarità né fusione, e i salvataggi vengono convertiti in carte 5★. Le carte normali sono colorate per ruolo: portiere oro, difensore verde, centrocampista blu, attaccante rosso. Solo le rarità base perdono il loro aspetto: le carte Eroe e Diamante mantengono il proprio."


[pt.new]
mod_name = "Cartas clássicas"
mod_description = "Todo jogador normal é uma Lenda 5★, como nos Inazuma Eleven clássicos: sem raridades 1★-4★, bónus de raridade, subida de raridade nem fusão, e os saves são convertidos em cartas 5★. As cartas normais são coloridas por posição: guarda-redes dourado, defesa verde, médio azul, avançado vermelho. Só as raridades básicas perdem o aspeto: as cartas Herói e Diamante mantêm o seu."


[ja.new]
mod_name = "クラシックカード"
mod_description = "昔のイナズマイレブンのように、通常の選手はすべて★5レジェンド。★1～★4のレアリティ、レアリティによる能力ボーナス、レアリティアップ・合成はなく、セーブも★5のカードに変換されます。通常のカードは選手のポジションで色分け：GKは金、DFは緑、MFは青、FWは赤。見た目のレアリティがなくなるのは基本のものだけで、ヒーローとダイヤモンドのカードはそのままです。"


[zh_hans.new]
mod_name = "经典卡牌"
mod_description = "像经典的闪电十一人一样，所有普通球员都是★5传奇：没有★1～★4稀有度、稀有度加成、稀有度升级或合成，存档也会转换为★5卡。普通卡按位置着色：守门员金色、后卫绿色、中场蓝色、前锋红色。只有基础稀有度移除外观，英雄卡和钻石卡保持原样。"


[zh_hant.new]
mod_name = "經典卡牌"
mod_description = "像經典的閃電十一人一樣，所有普通球員都是★5傳奇：沒有★1～★4稀有度、稀有度加成、稀有度升級或合成，存檔也會轉換為★5卡。普通卡按位置著色：守門員金色、後衛綠色、中場藍色、前鋒紅色。只有基礎稀有度移除外觀，英雄卡和鑽石卡保持原樣。"
