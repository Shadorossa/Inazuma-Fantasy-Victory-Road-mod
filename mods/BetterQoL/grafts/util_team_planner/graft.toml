# Team planner («Planificador de equipo») of the mod BetterQoL (docs/game/ui/team-planner.md; script
# research/mods/BetterQoL/scripts/team_planner.lua answers CMND_BETTERQOL_TP_*). In a team dock squad, A on an empty slot
# offers «Añadir del banco» (the game's bank) and «Planificar equipo» (the same game bank listing every character of
# the game and the mods, the ones not owned semi-transparent); an owned pick is placed in the slot, one not owned is a
# GHOST card in the slot (never a card, never playable). A squad with ghosts cannot become the active team and the dock is not left while the
# active squad has one; a ghost whose character the save gets is replaced by the real card when the dock opens.
# HOOK files (docs/framework/lua-hosts.md §7): VRFW_Host handlers on the VR-Framework's hosts of the three stems
# (research/mods/VRFW/assets/lua/menu/<stem>/000_host.lua), never merged with other grafts, no promoted locals (the
# retail locals through VRFW_Host.hosts.<stem>.L). Their text is generated: edit util_tp_*.src.lua / util_tp_common.lua
# and run gen_hooks.py. The bank's plan list: BetterQoL's script (hook BetterQoL.TpBankSort, content/game/team_planner.toml).
name = "util_team_planner"
mod = "BetterQoL"
order = 345
module = "lua_bridge"
requires = []
conflicts = []
wraps = []
description = "Team planner: ghost cards in the team dock's squads, the game's bank listing every character, automatic assignment (BetterQoL)"

[[hooks]]
stem = "team_dock_formation_menu"
source = "util_tp_formation.lua"

[[hooks]]
stem = "soccer_team_dock_menu"
source = "util_tp_dock.lua"

[[hooks]]
stem = "chara_bank_menu"
source = "util_tp_bank.lua"
