#   evt_ph_peg_pill, assets\gamedata\menu\obj\evt_soccer11_0* / evt_ph_*, text\rows\player_page.toml
#                                the paged player page:
# PERFIL + 3D model, ATRIBUTOS, the Hyper
#                                page, the radar copies, the
#                                Hyper card layers; Lua research/grafts/plate_pages* / plate_model / plate_no_view /
#                                plate_hiper_* (mod = CharacterReforged)
#   content\menus\player_page_host.toml + assets\lua\_all\character_reforged_page.lua   the page's SLOTS: hosts
#                                CharacterReforged.page_stat / page_luck_bonus / page_stat_max / page_stat_gain
#                                (other mods' [[entry]] action = { command = "CMND_..." }: a stat, a Suerte bonus, a
#                                gauge's top, a form's gains), CharacterReforged.Page (Stat, LuckBonus, StatTop, GainsRaw,
#                                MixOf)

#   scripts\duplicate_players.lua + lib\duplicate_players\   the duplicate-players hook: on the VR-Framework's
#                                slot copy («X: duplicar») the pass of merge_pass.lua runs with the POLICY other mods
#                                declare as data ([CharacterReforged.DuplicateRules.<name>] in their
#                                content\duplicate_rules\*.toml, schema CharacterReforged.duplicate_rules/1: keys in
#                                lib\duplicate_players\rules.lua); no rule = nothing done. Report: blob duplicate_players.txt.
#                                With a rule's apply_on_load = true (No More Rarities, New Recruitment) also on the save engine's slot load
#                                (a player slot, before the game reads it): a durable copy of the save first, once per
#                                save (global blob save-backup-slot<N>-<stamp>-before-duplicate-rules.bin, marker
#                                duplicate_players_backup.txt), report blob duplicate_players_load.txt; left to Inazuma
#                                Fantasy's load repair while that one is on
#   scripts\new_card_rarity.lua + content\game\new_card_rarity.toml   the rule's normal_card_rarity at the one writer of
#                                a live player's rarity (Chara.SetRarity): a club card joins at it, whatever path adds it
#   scripts\save_tools.lua        the functions of its VR-Framework save adjust actions (Options › «Ajustar save»,
#                                declared in content\save_adjust\character_reforged.toml)
#  and «Igualar la rareza» on the CURRENT save, the same pass with the
#                                duplicate rules' policy split in two (text\rows\save_tools.toml); «Quitar auras de
#                                despertar y vínculo» (lib\purge_moves.lua) and «Quitar equipaciones de visitante»
#                                (lib\purge_kits.lua)
#   content\techniques\unobtainable_auras.toml  the VR-Framework rule [[VRFW.Unobtainable]] AuraTypes 4 / 5 / 7: the
#                                awakening and bond transformation auras leave every learn list and the shops (team
#                                loadouts keep them: opponents only); scripts\lib\unobtainable_moves.lua reads the
#                                same rule (the skill table refuses them, scripts\skill_set.lua; the save adjust)
#   content\skill_tabs\unobtainable_tabs.toml  the «Habilidades» list without its tabs 104 / 105 and the team aura
#                                screen without rows of aura types 4 / 5 / 7
#   content\items\hidden_away_kits.toml  [[hide]] of the 5 «E. visitante» kits the game's shops sell (out of the shops)
#   scripts\scripts.toml          the script caps (the hook holds a whole save)
#   scripts\player_sets.lua + content\game\player_sets.toml   player sets: named builds of one player (6 moves, aura,
#                                mix slot, equipment, custom passive, passives, role, kit), 5 per player and save slot
#                                (blob ss_player_sets.json, imported once from Inazuma Fantasy's), saved / loaded /
#                                renamed / deleted / exported to .vrmod from the skill table's save-icon button
#                                (grafts ss2_menus, pset_preview; config.toml [player_sets]; icons
#                                content\images\menu\200_icon\15_icon_common\player_set_icons.toml)
#   content\skill_tabs\armour_tab.toml  the «Habilidades» list without its «Armadura» tab:
# armours are worn through the keshin (the board's armed slot)
#   scripts\board_role.lua + content\game\board_role.toml   the coach / manager role of the skill table's role medal
#                                slot: CMND_CHARACTERREFORGED_GET_ROLE / _SET_ROLE (the board's badge equip / unequip)
#   scripts\player_page_capture.lua + content\game\player_page_capture.toml   the player page's 3D model in a match:
#                                config.toml [player_page] for graft plate_model and a loader.log report of the engine's
#                                capture state (CMND_CHARACTERREFORGED_PAGE_CAPTURE_CONFIG / _REPORT)
#   scripts\armour_slot.lua + content\game\armour_slot.toml   the skill board's keshin armour slot without the armour
#                                item: OFF unless an active mod declares
#                                [CharacterReforged.SkillBoard] armour_without_item = true (All Keshin Armed does)
#   scripts\partner_lock.lua + content\game\partner_lock.toml + content\menus\partner_badge.toml   partner locks: a card
#                                used as the partner of another card's pair ([CharacterReforged.PartnerLock.<system>] in
#                                any mod's content\pairing\*.toml; the system's mod sends its pairs with PartnerLockSet)
#                                is never placed from the player bank into a team (filters on the place commands) and
#                                wears the system's plate on his bank card
#   modules\<Module>\           the embedded module mods, shipped in this folder:
# AuraOverhaul (All Keshin Armed, All Miximaxed, Custom Change Mode and Souls Rework
#                                in one mod), SpiritStaminaPoints,
#                                TeamKeshinSummons, ClassicCards, ClassicRecruitment, ClassicTraining, PersonalPassives,
#                                TransformationItems (since 1.11.0), BetterEquipment (since 1.43.0). Each keeps its own mod.toml
#                                (id, prefix, saves, options, grafts) and is switched on / off on this mod's «Mods» page
#                                (enabled.toml; applies after a restart); a module that is off loads nothing

# What the aura mods call.
[exports]
functions = ["PairRules", "PairCheck", "PairValidity", "Card", "BoardItems", "BoardSlotOf", "BoardPlace", "CanPlace", "AddPlaceRule", "RemovePlaceRule", "SkillSetRules", "MixGet", "MixSet", "SlotOf", "StatsReady", "HasStats", "StatCard", "StatAt", "Libertad", "DerivedLuck", "CharaStat", "LevelCap", "StatCurve", "LevelFactor", "StatTotalMax", "Moveset", "DuplicatePolicy", "EraKitOf", "MixAddsStats", "PartnerLockSet", "BoardRoleState", "BoardRoleSetWithoutMatches", "BoardRoleCodes"]
# [CharacterReforged.PairRules.<system>] and [CharacterReforged.Create.<system>] in any mod's content\pairing\*.toml (schema
# CharacterReforged.pairing/1); [CharacterReforged.DuplicateRules.<name>] in any mod's content\duplicate_rules\*.toml
# (schema CharacterReforged.duplicate_rules/1: the duplicate-players hook; DuplicatePolicy() = the merged policy);
# [CharacterReforged.SkillBoard] armour_without_item in any mod's content\skill_board\*.toml (schema
# CharacterReforged.skill_board/1: the board's armour slot without the item, scripts\armour_slot.lua; off by default,
# All Keshin Armed switches it on)
# [CharacterReforged.EraKit] in any mod's content\era_kits\*.toml (schema CharacterReforged.era_kit/1): how
# scripts\era_kits.lua derives the ídolos' era kits (native table CharacterReforged.EraKit; EraKitOf(card) = the kit)
# [CharacterReforged.PlaceRules.<name>] in any mod's content\skill_set\*.toml (schema CharacterReforged.skill_set/1):
# a mod's placement rule for the skill set (scripts\skill_set.lua; Hissatsu Level Up's one copy per set)
keys = ["PairRules", "Create", "DuplicateRules", "SkillBoard", "EraKit", "PartnerLock", "PlaceRules"]
# its native tables other mods' answers may read as "CharacterReforged/<name>" (the cards with per-character
# values: Inazuma Fantasy's trained-points modifier)
tables = ["CharacterReforged.StatRow", "CharacterReforged.EraKit"]
# game_lua: CharacterReforged.Header = the player header's slot (assets\lua\_all\character_reforged_header.lua): SLOT,
# Items(). A mod hangs a piece there as data: [[entry]] host = "CharacterReforged.header",
# action = { lua = "<Prefix>.<fn>" } (f(phase, ctx), content\menus\player_header_host.toml); its layers attach to the
# header object evt_soccer11_04pp_pp ([[object_set]]). Stamina Points' max PE is one. BandColour(layer, inst, hdl) =
# the player page's slanted header band: the band colours of the host CharacterReforged.header_band (No More Rarities'
# position colour), else RarityBand = the retail rarity look.
# ShowsRarity(hdl) = the row's rarity title: the rules of the host CharacterReforged.header_rarity (No More Rarities:
# only Ídolo and mod-declared rarities), else the retail title.
# CharacterReforged.SkillTable = the skill table's extension point (graft skill_table_host, the screen
# evt_skill_slot_menu): its entries' helpers (Chara, MoveName, Confirm, Message, Sound, Refresh), L = the screen chunk's
# locals by name, Env(globals) = an _ENV over them; the script is also the VRFW_Host host «evt_skill_slot_menu».
# CharacterReforged.Page = the player page's slots (assets\lua\_all\character_reforged_page.lua): Stat(hdl, idx),
# LuckBonus(hdl), StatTop(hdl, idx), GainsRaw(hdl), Providers(host), MixOf(card), ModeChangePartner(card).
# A mod adds a value as data: [[entry]] host = "CharacterReforged.page_stat" | ".page_luck_bonus" | ".page_stat_max" |
# ".page_stat_gain" | ".mode_change_partner" (the partner of the equipped «Modo cambio»: Custom Change Mode, Inazuma Fantasy),
# action = { command = "CMND_<PREFIX>_..." } (content\menus\player_page_host.toml): Player Training (gauge tops,
# committed Suerte), Inazuma Fantasy (its stat command, the miximax gains). Pages: the VR-Framework's registry
# (VRFW_PlayerPages.Add).
# CharacterReforged.Parts = what its modules hand to its pages (assets of the module: PassiveDisplay, CardLook,
# TrainingMode); nil fields = that module is off
game_lua = ["CharacterReforged.Header", "CharacterReforged.SkillTable", "CharacterReforged.Page", "CharacterReforged.Parts"]

# its own content/ folder read only by its scripts (the pairing rules every mod may declare): vrfw check's layout lint
# accepts it
[layout]
script_folders = ["pairing", "skill_set", "movesets"]
