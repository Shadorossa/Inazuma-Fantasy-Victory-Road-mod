passive = { type = "string", required = true, ref = "passive", doc = "the passive's key (ps10001, a mod passive's key from a content\\techniques\\*.toml [[passive]] row)" }
unlock = { type = "string", default = "board", values = ["board", "always"], words = "unlock", doc = "board: once the custom passive piece of his board is open; always: from level 1" }

# ------------------------------------------------------------------------------------------------ shared data

[move_kinds]
shoot = { category = 1 }
long_shoot = { category = 1, flag = 4 }
chain_shoot = { category = 1, flag = 8 }
dribble = { category = 2 }
block = { category = 3 }
shoot_block = { category = 3, flag = 16 }
catch = { category = 4, flag = 1 }
punch = { category = 4, flag = 2 }

# how an Outcome reads the argument of its event
[outcomes]
succeeds = ["won", "saved"]
fails = ["lost", "beaten"]

# the plays of a TensionGain block's `plays`: the gain kinds of Tension.GainRequest (request +0x10, the tension_gain argument)
# focus_lost: FocusBattle_ExecResult 0x150D3F0, the request of the losing side (+0xAA1)
# (the winner's request there: kind 2 for a power action won by the ball side, 3 for one won by the other side and for result kinds 2 / 3)
[tension_plays]
focus_lost = [4]

# the passive level of a player (value_by_level): the first level whose player level he has reached.
[levels]
from_player_level = [1, 8, 15, 22, 29, 36, 43, 50, 57, 64, 71, 78, 85, 92]

# the card's main_position numbers (chara_position)
[positions]
gk = 1
fw = 2
mf = 3
df = 4

# KeeperShotPower side shooter: the battle's shot is the last shoot move of the other team within this many seconds
[keeper_duel]
shot_window_s = 8

[points]

[unit_moves]
first = 0x30
stride = 0x1C
count = 6
kind = 8
id_kind3 = 4

[refresh]
live_states = [9, 14, 15, 16]
aura_command = 22

# the character's gender numbers (chara_base) of the Trait key `gender`
[genders]
male = 1
female = 2

# the aura bits of a match unit (VRFW.players.aura_flags) per AuraActive kind
[aura_bits]
keshin = 1
armour = 2
miximax = 4
totem = 8
mode_change = 0x40

# the element wheel Rival `matchup` reads: the `[[element]]` rows (id, name, beats) of this framework file
[matchup]
wheel = "content/rules/catalog/ai_knobs.toml"
