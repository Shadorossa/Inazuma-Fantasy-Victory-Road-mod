id = "CharacterReforged"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "Character Reforged"
version = "0.2.2"
author = "Shadorossa"
author_steam = "76561199013321372"
# player page 3D model: a shown card the VR-Framework dresses in his own clothes (VRFW_PlateMember.Kit -> 0,
# "own") wears them, as his miniface (graft plate_model).
# «Quitar equipaciones ocultas» and the duplicate passes use the VR-Framework's save_tree / save_kits libraries.
description = "The shared base of the character mods. Every character gets his own stats, growth and moveset, the level cap rises to 200 (up to 999 in the config), and the skill board becomes an expanded table with 6 special moves, an aura slot and a mix slot. It also adds a paged player page with the 3D model, stat gauges and a Hyper page, the custom pairing screen, and lets Idol and Diamond cards wear the kit of their moment. Works with the VR-Framework alone."
priority = 0
tags = ["Gameplay", "Characters"]
updated = "2026-11-05"
# Comment links to existing docs
# module Signature Passives 1.14.0: the own passives of the 9 design docs (IE1 to IEVR), with
# tension gain, stamina recovery, shots blocked, fouls suffered, chain shots, set pieces and «the only <trait>».
# module Signature Passives 1.13.0: the own passive of every IE1 character from the design doc,
#built from blocks; archetype tags, team groups and caps.
# module Aura Points 1.1.5 (one rule «nothing pays with the hyper gauge»: the gauge hidden and its
# gains off; mode change, kizuna trans and awakening power start free while it holds; the rival on the same points)
# This mod's own names (TOML keys [CharacterReforged.X], Lua CharacterReforged.X, commands CMND_CHARACTERREFORGED_*); never VRFW.
prefix = "CharacterReforged"
folder = "CharacterReforged"
# The aura mods split out
# of Inazuma Fantasy share their code here and `require` this mod (its «plugins»). Engine-generic mechanisms (the
# transform engine's look, the fusion store, the transform run time) stay in the VR-Framework. Standard mod layout.
# content\transforms\aura_stack.toml [rules] stack = keshin, aura, miximax, armour: the
# Mix-Max starts while a keshin, an armour, a totem or an awakening power is out (under the armour: the armour keeps
# its look and time, the fusion adds its stats and partner moves and ends with it; VRFW 2.357.0)
# module Aura Reworked 1.10.0: the totem's skill carousel inside the cut-in of its own
# move (a screen of its own, VRFW.ui.open_menu of VRFW 2.151.0), replacing the reel under the scoreboard
# content\transforms\aura_stack.toml [rules] stack = keshin, aura, miximax: the Mix-Max
# starts while the keshin or the totem is out and the spirit is summoned over a running Mix-Max (VRFW 2.149.0)
# option «Cooldown entre auras» (options.toml aura_cooldown: off / 5 / 10 / 15 / 20 / 30 s,
# default 10; content\transforms\aura_cooldown.toml [rules] team_aura_cooldown_option of VRFW 2.105.0)
# option «Máx. auras por equipo» (options.toml team_aura_max, default 3; content\transforms\team_limit.toml
# [rules] team_aura_max_option of VRFW 2.8.44)
# the «Piedra Alius» moved to its own mod Transformation Items (TransformationItems)
# the duel aura rule ([VRFW.DuelAura], an aura is never a duel's choice) moved to Football
# Reforged's module Duel Auras (DuelAuras), always on; the skill set's RB+B in a duel needs it (without it the press is
# the duel's command, as in retail)
# Transformation Items (TransformationItems) is one of its embedded modules
# (modules\TransformationItems\)
# the skill table's custom passive button is back, [ save ][ custom passive ][ Entrenar ]
# (CMND_CHARACTERREFORGED_SIX_SENSE, scripts\board_slots.lua; read only with the module Signature Passives, which
# was Special Players)
# content\sounds\voice_fill.toml - every voice bank a card plays gets the technique / aura
# shouts and in-match lines the other banks of the same character have and it lacks
# the voice fill groups a character by its Japanese and English names, an adult bank
# only takes adult banks' cues and a youth bank youth banks' (chara_base age group), and a technique's other keys come
# from the bank's own cue of it (God Hand whk00010 -> whk00480, whk01710; VRFW 2.44.0)
requires = ["VRFW>=0.2.2"]
# optional: mods it works with when they are on (BetterQoL view forms, passive slots and role medal rules;
# BetterUI's compact bank card)
optional = ["BetterQoL", "BetterUI"]
conflicts = []
# hook / state: the per-character stats (content\game\stats.toml: GetCharaParamStatus, the specialty type, the
# run speed; scripts\stats.lua's state keys); memory: the card records / board slots it reads (and the board branch it keeps on branch 1); call: the game's board placement (content\game\board.toml); command: the create entry's and the skill set's
# commands; hook: its native tables (MixSlot, MovesetDefault: the match side of the new set)
permissions = ["memory", "call", "command", "hook", "state"]
# lua_bridge: its Lua grafts (the skill table: ss2_menus, ss2_dock, ss2_pc_rows, pset_preview, cr_bank_skill_table,
# board_entry,
# skill_table_host + skill_table_host_hooks (its extension point), skill_table_role_slot (the role medal slot above
# the player card; the custom passive and role buttons removed); the match plates: hiper_btn; the player page:
# plate_pages, plate_pages_dock, plate_pages_bank, plate_pages_skill_host, plate_model, plate_no_view,
# plate_hiper_common, plate_hiper_plate, plate_hiper_bank);
# loader 1.7.0: patches of INCLUDE\'d scripts
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
# lua_early: its merge-path patches (ss2_dock on team_dock_formation_menu, ss2_menus, hiper_btn,
# the board) redefine whole retail functions with promoted locals. They must run BEFORE the VR-Framework's host
# patches: run after them, ss2_dock dropped every dispatcher of the team dock's
# Formación (UpdateViewChara3DModel, PostStep, OnFunction, ...), so no other mod's handler ran there (Utilities'
# «Cambiar forma» in «Ver apariencia», the framework's outfit model). Early, the hosts sit on top of these functions
# and serve their promoted locals (VRFW 2.4.11).
# lua_early alone did not help where another lua_early mod loads first (Utilities, before this mod in
# load order): ss2_menus' patch of ability_list_menu redefined OnSetupLayer / OnChangeFocus / OnFunction /
# UpdateSkillDetailWindow / Step and dropped Utilities' «RS Previsualizar» wrappers; the board patch dropped
# Utilities' combo partner hooks. Both now only wrap (ss2_menus reads no chunk local of ability_list_menu; the
# board's create entry is a hook file). Still merge-path: hiper_btn.
# ss2_dock is a hook file. No edit of
# the popup «PERSONAJE» any more (no OnDecideFocus copy, no «Mover» filter, no greying edit); the team dock's «Tabla de
# habilidades» becomes the skill table where the retail branch opens the board (CharacterReforged.
# InstallBoardOpenRedirect, assets\lua\_all\character_reforged_skill_table_entry.lua). «Mover» is BetterUI's now.
lua_early = true
# Layout:
