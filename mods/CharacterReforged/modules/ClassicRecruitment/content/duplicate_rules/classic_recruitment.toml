schema = "CharacterReforged.duplicate_rules/1"
if_mod = "ClassicRecruitment.classic_recruitment"             # The rows of options.toml: classic_recruitment off or spirit_section on = this file is not read and duplicates are allowed.
if_not_mod = "ClassicRecruitment.spirit_section"

[CharacterReforged.DuplicateRules.classic_recruitment]
# one copy per chara_param id and rarity (a normal card, its Ídolo / Diamante cards and its miximax form are different players)
one_card_per = "card"
# the copy kept: the first criterion that tells two copies apart; the others merge into it and leave the club
keep_first = ["in_a_fusion", "highest_level", "most_experience", "most_special_move_uses", "in_a_team", "oldest", "lowest_handle"]
# element spirits given back per released copy
element_spirits_per_released_card = 3
# a copy saved at one of these rarities (ids of game_rarities.toml) of a card of another rarity is no duplicate: the Fabled copy the Fabled exchange gives of a normal card
raised_copy_rarities = ["fabled"]
# duplicates a save already holds are kept on load; a duplicated save and the save tool «Quitar jugadores duplicados» still merge them
apply_on_load = false
