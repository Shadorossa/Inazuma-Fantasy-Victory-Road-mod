schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Stoppage Time"
mod_description = "Added time at the end of every half, as in real football: fouls, special moves, keeper scenes, goals and substitutions add seconds, rounded to whole minutes (1 to 5). A «+N» banner shows when regular time ends, and the half ends on the play once the added time runs out."

[es.new]
mod_name = "Tiempo añadido"
mod_description = "Tiempo añadido al final de cada parte, como en el fútbol real: las faltas, supertécnicas, paradas del portero, goles y cambios suman segundos, redondeados a minutos enteros (de 1 a 5). Un rótulo «+N» aparece al acabar el tiempo reglamentario, y la parte termina con la jugada cuando se agota el añadido."

[fr.new]
mod_name = "Temps additionnel"
mod_description = "Du temps additionnel à la fin de chaque mi-temps, comme au vrai football : fautes, supertechniques, scènes de gardien, buts et remplacements ajoutent des secondes, arrondies à des minutes entières (de 1 à 5). Un bandeau « +N » s'affiche à la fin du temps réglementaire, et la mi-temps s'arrête sur l'action une fois le temps additionnel écoulé."

[de.new]
mod_name = "Nachspielzeit"
mod_description = "Nachspielzeit am Ende jeder Halbzeit, wie im echten Fußball: Fouls, Spezialtechniken, Torwartszenen, Tore und Wechsel addieren Sekunden, auf ganze Minuten gerundet (1 bis 5). Ein «+N»-Banner erscheint am Ende der regulären Spielzeit, und die Halbzeit endet mit der Aktion, sobald die Nachspielzeit abgelaufen ist."

[it.new]
mod_name = "Recupero"
mod_description = "Tempo di recupero alla fine di ogni tempo, come nel calcio vero: falli, supertecniche, scene del portiere, gol e sostituzioni aggiungono secondi, arrotondati a minuti interi (da 1 a 5). Un banner «+N» appare al termine del tempo regolamentare, e il tempo finisce con l'azione quando il recupero è esaurito."

[pt.new]
mod_name = "Tempo de compensação"
mod_description = "Tempo de compensação no fim de cada parte, como no futebol a sério: faltas, supertécnicas, cenas de guarda-redes, golos e substituições somam segundos, arredondados a minutos inteiros (de 1 a 5). Aparece um letreiro «+N» no fim do tempo regulamentar, e a parte termina com a jogada quando o tempo extra se esgota."

[ja.new]
mod_name = "アディショナルタイム"
mod_description = "本物のサッカーのように、各ハーフの終わりにアディショナルタイムが入ります。ファウル、必殺技、キーパーの場面、ゴール、選手交代で秒数が加算され、1〜5分の整数分に丸められます。通常時間が終わると「+N」の表示が出て、アディショナルタイムが尽きるとプレーの流れで終了します。"

[zh_hans.new]
mod_name = "补时"
mod_description = "如同真实足球，每个半场结束时会有补时：犯规、必杀技、守门员场面、进球和换人都会累加秒数，并取整为1至5分钟。常规时间结束时会显示「+N」提示，补时用完后，半场会随着当前这一回合结束。"

[zh_hant.new]
mod_name = "補時"
mod_description = "如同真實足球，每個半場結束時會有補時：犯規、必殺技、守門員場面、進球和換人都會累加秒數，並取整為1至5分鐘。常規時間結束時會顯示「+N」提示，補時用完後，半場會隨著目前這一回合結束。"
