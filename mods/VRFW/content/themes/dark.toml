schema = "VRFW.theme/1"
# Built-in matte dark theme. Each [[accent]] is one value of the interface theme option (`value` = stored option value, `text` = label key).

[theme]
id = "dark"
name = { ja = "ダーク", en = "Dark", es = "Oscuro", fr = "Sombre", de = "Dunkel", it = "Scuro", pt = "Escuro", zh_hans = "深色", zh_hant = "深色" }
# Every menu folder (keys relative to data/); the longer matching prefix wins between include and exclude.
include = [
    "dx11/menu",
    # the framework's save slot cards (a UI atlas inside the excluded art folder)
    "dx11/menu/220_img/evt_slot",
    # the «Inazuma Post» button of the title / main menu (its glow plate; the rest of title00 is the title art)
    "dx11/menu/50_title/title00/title00_10", "dx11/menu/50_title/title00/title00_10_demo01",
    "dx11/menu/50_title/title00/title00_12",
    # (mods add the folders of their own atlases in their rules files: content/themes/*.toml, VRFW.theme_rules/1)
]
# Atlases mods add inside these folders (not game files) are recoloured too, even where `exclude` covers the folder:
# only their panel-like sprites change (cards, plates, windows, bands); pictures, icons, glows and line art stay.
# A mod leaves one of its atlases as it is with an `exclude` in its rules file.
mod_atlases = ["dx11/menu/220_img"]
# Kept in their colours: icons (items, elements, crests), art and faces, maps, the gallery, the match tension gauge, minimap and portrait gauges and the title
# background. Sprites inside covered folders that must keep their colours are named in the [[sprite]] rules below.
exclude = [
    "dx11/menu/200_icon", "dx11/menu/220_img", "dx11/menu/210_minimap", "dx11/menu/13_map", "dx11/menu/90_map",
    "dx11/menu/112_gallery", "dx11/menu/50_title/title00",
    # the match's TENSIÓN gauge (bar, track, label plate): kept as the game draws it
    "dx11/menu/00_soccer/soccer08/soccer08_03",
    # the Kizuna power gauge (plate, % digits, label) and the hyperdimensional power gauge (frame, bar, icon, rings)
    "dx11/menu/00_soccer/soccer08/soccer08_04", "dx11/menu/00_soccer/soccer08/soccer08_26",
    # the match minimap (pitch background of the full and half minimap): kept as the game draws it
    "dx11/menu/00_soccer/soccer00/soccer00_03", "dx11/menu/00_soccer/soccer00/soccer00_03b",
    # the match HUD gauges under the player portrait (stamina / PE bar, its tag, fill and gloss): kept as the game draws them
    "dx11/menu/02_btl/btl06/btl06_13",
    # technique name banners, event telops and cut-in pictures: never themed, the game's and every mod's (these
    # exclusions are longer than the `mod_atlases` folder, so the telops a mod serves there keep their colours too)
    "dx11/menu/220_img/telop_waza", "dx11/menu/220_img/ev_telop", "dx11/menu/220_img/telop_stadium",
    "dx11/menu/220_img/udon_cut_img",
]

[palette]
bg = "#141414"
panel = "#1C1C1C"
card = "#242424"
card_sel = "#2A2D31"
border = "#333333"
text = "#E6E6E6"
text2 = "#9A9A9A"
key = "#2E2E2E"

[[accent]]
id = "blue"
value = 1
text = "ui_theme_dark_blue"
name = { ja = "ブルー", en = "blue", es = "azul", fr = "bleu", de = "blau", it = "blu", pt = "azul", zh_hans = "蓝", zh_hant = "藍" }
accent = "#3B6EA8"
accent_hi = "#7FA7D9"
accent_dark = "#284A72"

[[accent]]
id = "teal"
value = 2
text = "ui_theme_dark_teal"
name = { ja = "ティール", en = "teal", es = "verde azulado", fr = "bleu canard", de = "Petrol", it = "verde acqua", pt = "verde-azulado", zh_hans = "青绿", zh_hant = "青綠" }
accent = "#2E8B84"
accent_hi = "#6FC4BA"
accent_dark = "#1F5E59"

[[accent]]
id = "amber"
value = 3
text = "ui_theme_dark_amber"
name = { ja = "アンバー", en = "amber", es = "ámbar", fr = "ambre", de = "Bernstein", it = "ambra", pt = "âmbar", zh_hans = "琥珀", zh_hant = "琥珀" }
accent = "#B07F35"
accent_hi = "#DDB46E"
accent_dark = "#7A5726"

