
[team_templates]
# Team templates of the Team dock (11 to 999); the game's 11 docks hold 11 of them, the others are stored with the save.
count = 999
# Log a check of every dock after each template swap.
verify = false
# Game modes that keep the game's 11 docks only (story mode uses the teams for its own squads).
blocked_modes = ["story"]

[team_name]
# max_length: characters the name keyboard accepts, 1..31 (retail 12); the save keeps 128 UTF-8 bytes per name.
max_length = 24
# room: header width in 1920x1080 px (retail text box 436).
room = 436
style = "fs_teamdock_name01"
fit_styles = ["fs2_32_b_lc_2d0_002", "fs2_28_b_lc_2d0_002_sclw"]

[passives]
# max_slots: configurable passive slots, 3..5 (clamped).
max_slots = 5
# unlock: "all" = every slot of a configurable player works in matches; "configured" = only configured slots.
unlock = "all"
# always_unlocked: a slot holding the character's own passive works even if its board piece is closed.
always_unlocked = true
# build_rarities / build_slots: rarities (Hero 5-7, Diamond 8) whose slots keep the board's build passives.
build_rarities = [5, 6, 7, 8]
build_slots = [4, 5]
# log_first: log the first N slot replacements (0 = none).
log_first = 20
# allow_duplicates: the same passive may be chosen in several slots of a player.
allow_duplicates = true
# enabled = false: retail passives.
enabled = true

[role_medal]
matches_required = 0
# The same for a player created as coach or manager.
matches_required_created_role = 0

[original_names]
team_skip_langs = ["ja"]
# true = the team window reopens after each change.
picker_reopen = false
# Log every text load / table switch.
log = true

[original_names.team_grid]
# Team grid: tiles per row, rows per page, pitch (px), centre (1920x1080 px, y down).
cols = 8
rows = 3
pitch_x = 210
pitch_y = 236
cx = 960
cy = 520

[original_names.grid]
# Player grid: tiles per row, rows per page, pitch and face size (px), centre (1920x1080 px, y down).
cols = 8
rows = 4
pitch_x = 196
pitch_y = 180
tile = 132
cx = 960
cy = 560
# Colour of a player who keeps his dub name (1 = normal).
grey = 0.38
# Show the current name under each tile.
names = true

[team_planner]
# Team planner: plan any character into a Team dock slot; unowned ones show as ghost cards.
enabled = true
# Rarity unowned characters are drawn at (0 Normal .. 4 Legendary).
display_rarity = 4
# Owned copies that replace a ghost: card rarities, or "any".
owned_rarities = [4]
# chara_param col-41 values of a character's normal card.
card_values = [0, 1, 2, 3, 4]
# Alpha of unowned cards (1 = opaque).
ghost_alpha = 0.45

[route_map_speed]
# Cursor speed multiplier while R2 is held (the Players' Universe screen doubles its own: 20 to 40).
factor = 2.0
# Keyboard keys that count as R2 ([] = pad only).
keys = ["E"]
# Log each R2 hold on the map.
log = true

[auto_commander]
# Auto Commander mode.
always_games = ["fbtl_bb_stadium_00"]
# Match difficulty contexts/names (match_difficulty.toml) that start in Commander mode only against a beaten rival.
beaten_only_contexts = ["free_match"]
beaten_only_difficulties = ["Heroica", "HeroicaPlus"]
# Game modes where the beaten-only rule never applies.
never_modes = ["story"]
speed_min = 1.0
speed_max = 4.0

[tech_preview]
# Technique preview: plays a move's cut-in with a squad player.
lineup = 11
# Skill category (1 shoot, 2 dribble, 3 block, 4 catch) -> position (1 GK, 2 FW, 3 MF, 4 DF).
positions = { "1" = 2, "2" = 3, "3" = 4, "4" = 1 }
# Prefer a player whose card learns the move.
prefer_learners = true
# Plays only while one of need_any_menu is open and none of off_with_menus.
need_any_menu = ["team_dock_common_top_menu", "soccer_top_menu"]
off_with_menus = ["chronicle_mode_top_menu", "team_dock_menu_rpg_battle"]
# Menus hidden while the cut-in plays; header layers hidden in bar_menus.
hide_menus = ["ability_list_menu", "sub_window", "item_filter_menu", "ability_learning_board_menu", "personal_plate_menu", "team_dock_formation_menu", "soccer_formation_menu", "soccer_team_dock_menu", "team_dock_common_top_menu", "soccer_top_menu"]
bar_menus = ["team_dock_common_top_menu", "soccer_top_menu", "soccer_team_dock_menu"]
bar_layers = ["mainmenu90_01_header", "mainmenu90_03_header_rank", "mainmenu90_31_doc_item", "mainmenu90_05_content_guide_line01", "mainmenu90_06_content_guide_line03", "mainmenu01_06_base_button_guide"]
# Menu and layer that hold the performer's model.
carrier_menu = "chara_model_only_view_menu"
carrier_layer = "rpg99_99_chara_model_only_view"
# Backdrop craft object behind the cut-in; "" = none.
backdrop = "bg10000"
# Prompt offset on the card (menu px, x right / y up).
hint_x = 0
hint_y = 0
# Fades (s), longest wait for the model (frames) and for the cut-in (s).
fade_s = 0.3
bgm_fade_s = 0.5
model_wait_frames = 300
max_seconds = 120
# true = B ends the cut-in.
back_skips = true
# One log line per move a card asks about.
log_queries = false

# Form indicator of «Ver apariencia» (1920x1080 px): badge_x = right edge, badge_y = vertical centre.
[view_forms]
badge_x = 1720
badge_y = 230
badge_scale = 1
# Draw priority of the tiles; the key glyph draws one above.
badge_priority = 690
# Tile side and gap (px at scale 1).
tile_size = 52
tile_gap = 6
# Key glyph scale and nudge inside the light tile (px; key_dy < 0 = up).
key_scale = 0.9
key_dx = 0
key_dy = 0

[album]
display_rarity = 4
game_level_cap = 99
# Tab icon of the «Especiales» page (icon_list_tab.g4tx sprite; "_off" twin when unfocused).
special_icon = "icon_list_tab_title01"
# Teams with fewer players get no own page and join the game's «Other teams» page.
team_page_min_players = 11

[club_stats]
# Newest matches kept in the club stats history page (each one ~100 bytes of the slot's career.json).
history_max = 200

[match_clock]
# Game clock rate at normal match speed (game_param soccerElapsedTimeRate_Normal); seconds per minute scale from it.
game_rate = 14.1

[prematch_skip]
# Seconds X must be held in a pre-match event to skip to kick-off, 0..10 (0 = no prompt).
hold = 1.0

[away_kit]
keep = ["uni_u041401_20"]   # Revolucionarios' own kit, a match prize

[item_type_order]
tables = ["item/item_consume", "item/item_important"]
groups = [
    # Coleccionables
    { name = "currencies", category = 220, sub_categories = [26, 49, 28, 25] },
    { name = "element tokens", category = 220, sub_categories = [47, 46, 48] },
    { name = "training badges", category = 220, sub_categories = [0] },          # «Insignia de …»
    { name = "stat beans", category = 210 },                                     # by stat (sub_category 131 … 137)
    { name = "books", category = 220, sub_categories = [45] },                   # notebook pages, quotes, diaries
    { name = "plants", category = 220, sub_categories = [27] },                  # Flor de Inazuma, Hierba de Mano celestial
    # Consumibles
    { name = "boxes", category = 10, sub_categories = [18, 17, 19] },            # victory boxes by rarity, then the choice boxes
    { name = "upgrade items", category = 10, sub_categories = [38, 14] },        # move upgrade, diamond seed
    { name = "exp orbs", category = 10, sub_categories = [138] },
    { name = "battle items", category = 70 },
    { name = "spirits", category = 0 },
]
