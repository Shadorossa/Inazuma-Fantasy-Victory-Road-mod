schema = "VRFW.game/2"

# Match modifiers, the equipment commands and the classic items' Suerte (logic: scripts\equipment.lua).

[[VRFW.MatchStat]]
name = "Equipment.Bonus"
order = 30
stat = "clamp(args[4] + lookup_or(Equipment.StatAdd, lookup_or(Equipment.StatAdd, 0, owner(args[2]), i), args[2], i), 1, 9999)"

[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_ITEM_PAGE"
handler = "Equipment.ItemPage"

# the 8 stat points of the worn items' affinity and sets, as Equipment.Bonus adds them in the match
[[VRFW.Command]]
name = "CMND_EQUIPMENT_STAT_BONUS"
handler = "Equipment.StatBonus"

# the item card's «Conjunto» page: the item's set, its pieces in order and its bonus tiers (nil = in no set)
[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_ITEM_SET"
handler = "Equipment.ItemSet"

[[VRFW.MatchStat]]
name = "Equipment.RivalBonus"
order = 30
owned = false
npc = true
stat = "clamp(args[4] + lookup_or(Equipment.RivalAdd, 0, args[3], i), 1, 9999)"

[[VRFW.Global]]
name = "match_equipment_info"
base = "game_root"
chain = ["Game.RootMatch"]

[[VRFW.Global]]
name = "match_equipment_play_data"
base = "game_root"
chain = ["Game.RootPlayData"]

[[VRFW.CommandFilter]]
name = "Equipment.RivalEquipHandle"
command = 0x07AB2BC2
handler = "Equipment.RivalEquipHandle"

[[VRFW.CommandFilter]]
name = "Equipment.RivalInventoryField"
command = 0x9EAD709F
handler = "Equipment.RivalInventoryField"

[[VRFW.CommandFilter]]
name = "Equipment.EquipOptimal"
command = 0x8E2B81D9
handler = "Equipment.EquipOptimal"
needs = ["Equipment.HasFreeCopy", "Equipment.CharaCanEquip", "Equipment.InventoryUsable",
  "Equipment.EquipStats", "Equipment.EquipToSlot", "Equipment.CharaEquipRole",
  "Equipment.EquipInvHdl", "equipment_items"]

[[VRFW.Function]]
name = "Equipment.HasFreeCopy"
game = "Item.HasFreeCopy"

[[VRFW.Function]]
name = "Equipment.CharaCanEquip"
game = "Item.CharaCanEquip"

[[VRFW.Function]]
name = "Equipment.InventoryUsable"
game = "Item.InventoryUsable"

[[VRFW.Function]]
name = "Equipment.EquipStats"
game = "Item.EquipStats"

[[VRFW.Function]]
name = "Equipment.EquipToSlot"
game = "Item.EquipToSlot"

[[VRFW.Function]]
name = "Equipment.CharaEquipRole"
game = "Item.CharaEquipRole"

[[VRFW.Function]]
name = "Equipment.EquipInvHdl"
game = "Item.GetEquipInvHdl"

# [g_gameRoot] + Game.RootItems = the inventory the optimizer walks
[[VRFW.Global]]
name = "equipment_items"
base = "game_root"
chain = ["Game.RootItems"]

# The «Family» tab of the shop's filter window (assets\lua\item_filter_menu\300_shop_families.lua).
[[VRFW.Command]]
name = "CMND_EQUIPMENT_SHOP_FAMILIES"
handler = "Equipment.ShopFamilies"

