schema = "VRFW.technique/3"
# The 15 Inazuma Eleven Cross special moves: 4 converted from Cross (own animation, camera, lights, voices, effects)
# and 8 retail events cloned with Cross's effects. Own events in content\base_tables\event_cfg +
# assets\data\common\event\ev6x\ev6x_95NNN (research/scripts/cross_waza_build.py -> technique_create_build.py, which
# deploy here: _split.toml), own texts, manuals (their item rows; catalog numbers from the item type's allocator, VRFW
# 13002-13013 were past the 8192-bit flag array): content\base_tables\gamedata\item\item_config.toml). Fixed keys
# (skill id = crc32 of the key): saves hold them. "none": a text written in some languages replaces only those (no
# default-language fallback)
# whs95000-whs95030, whs95100, whs95110, whs95140, who95100, who95120, whd95100, whd95120 are the IEVRCROSS mod's versions
# (events in assets\event + assets\event_cfg, stats as that mod has them): docs/game/mods/iecross-missing-from-ievrcross.md.
default_lang = "none"

