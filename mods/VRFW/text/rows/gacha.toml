
schema = "VRFW.text/2"
table = "menu_text"

# every card of the pool is already in the club (nothing can be drawn); crc32("vrfw_gacha_pool_empty")
[[row]]
id = "vrfw_gacha_pool_empty"
es = "Ya tienes a todos los jugadores de este gacha."
en = "You already have every player of this gacha."
fr = "Tu as déjà tous les joueurs de ce gacha."
de = "Du hast schon alle Spieler dieses Gachas."
it = "Hai già tutti i giocatori di questo gacha."
pt = "Já tens todos os jogadores deste gacha."
ja = "このガチャの選手はすべて仲間になっています。"
zh_hans = "这个扭蛋的球员已全部入队。"
zh_hant = "這個扭蛋的球員已全部入隊。"

# the draw's cost is missing (the pool's cost_item); crc32("vrfw_gacha_no_cost")
[[row]]
id = "vrfw_gacha_no_cost"
es = "No tienes suficientes objetos para usar este gacha."
en = "You don't have enough items to use this gacha."
fr = "Tu n'as pas assez d'objets pour utiliser ce gacha."
de = "Du hast nicht genug Gegenstände für dieses Gacha."
it = "Non hai abbastanza oggetti per usare questo gacha."
pt = "Não tens objetos suficientes para usar este gacha."
ja = "このガチャを回すためのアイテムが足りません。"
zh_hans = "道具不足，无法使用这个扭蛋。"
zh_hant = "道具不足，無法使用這個扭蛋。"

# a gacha node's command row when its pool names none (GachaPool `command`); crc32("vrfw_gacha_command")
[[row]]
id = "vrfw_gacha_command"
es = "Girar el gacha"
en = "Spin the gacha"
fr = "Lancer le gacha"
de = "Gacha drehen"
it = "Gira il gacha"
pt = "Girar o gacha"
ja = "ガチャを回す"
zh_hans = "转扭蛋"
zh_hant = "轉扭蛋"

[[row]]
id = "vrfw_gacha_obtained"
es = "¡Has obtenido a %s!"
en = "You obtained %s!"
fr = "Tu as obtenu %s !"
de = "Du hast %s erhalten!"
it = "Hai ottenuto %s!"
pt = "Obtiveste %s!"
ja = "%sを獲得した！"
zh_hans = "获得了%s！"
zh_hant = "獲得了%s！"

[[row]]
id = "vrfw_gacha_fewer_left"
es = "Solo se han podido sacar %d jugadores: pagas solo por ellos."
en = "Only %d players could be drawn: you pay only for them."
fr = "Seuls %d joueurs ont pu être tirés : tu ne paies que pour eux."
de = "Nur %d Spieler konnten gezogen werden: Du zahlst nur für sie."
it = "Si sono potuti ottenere solo %d giocatori: paghi solo per loro."
pt = "Só foi possível obter %d jogadores: pagas apenas por eles."
ja = "獲得できる選手は%d人だけでした。その分だけ消費します。"
zh_hans = "只抽到了%d名球员，只需支付他们的费用。"
zh_hant = "只抽到了%d名球員，只需支付他們的費用。"
