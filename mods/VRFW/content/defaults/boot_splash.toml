# The first-start window (crates/vr-loader/src/boot_splash): shown while the early phase really builds.

# Milliseconds of real building before the window appears: a cached start never shows it.
threshold_ms = 1500
default_weight = 100
default_word = "data"
fallback_language = "en"

# Each type's typical first-start time in ms: the bar gives it that share. Edit freely, no rebuild needed.
# From `[core] timing: early phase` of a full build. Two are lowered for commits made after that log:
# rule was 169279 (duel clip import 163 s, now ~7 s, VRFW 3.138); sound was 99019 (118 s -> 30 s, VRFW 3.139).
[weights]
rule = 13000
image = 151990
telop = 128588
sound = 25000
technique = 40422
team = 18640
model = 11028
effect = 9238
item = 8549
character = 6780
base_table = 4602
text = 3702
theme = 3489
menu = 1778
script = 1577
param = 1369
scene = 1289
mods_screen = 1192
transform = 1162
celebration = 1019
formation = 665
anim = 648
game_shader = 500
card_filter = 406
table = 393
flag = 286
font = 284
trigger = 275
look = 233
kit_twin = 159
stadium = 142
input = 138
option = 77
shop = 66
changelog = 34
mode = 6
friendly = 4
rarity = 4

# Type -> the player word of [text.<language>.words]; a type not named here uses default_word.
