schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Furor gauge"
mod_description = "GO Strikers' furor gauge: a fire bar beside each crest fills as the match goes on, and when it is full, L3 / R starts a 24-second Fired up phase. Every player awakens to his position's look, moves hit harder and players run faster; the CPU uses it too."
phase_banner = "Fired up phase active"

[es.new]
mod_name = "Barra de furor"
mod_description = "La barra de furor de GO Strikers: una barra de fuego junto a cada escudo se llena a medida que avanza el partido y, llena, L3 / R inicia durante 24 segundos la fase de furor. Cada jugador despierta con el aspecto de su posición, las técnicas pegan más fuerte y se corre más rápido; la CPU también lo usa."
phase_banner = "Fase de furor activa"

[fr.new]
mod_name = "Jauge de fureur"
mod_description = "La jauge de furor de GO Strikers : une barre de feu à côté de chaque écusson se remplit au fil du match et, une fois pleine, L3 / R lance une phase de furor de 24 secondes. Chaque joueur s'éveille avec l'apparence de son poste, les techniques frappent plus fort et on court plus vite ; la CPU l'utilise aussi."
phase_banner = "Phase de fureur active"

[de.new]
mod_name = "Furor-Leiste"
mod_description = "Die Furor-Leiste aus GO Strikers: Ein Feuerbalken neben jedem Wappen füllt sich im Lauf des Spiels, und ist er voll, startet L3 / R eine 24 Sekunden lange Furor-Phase. Jeder Spieler erwacht im Look seiner Position, Techniken treffen härter und alle laufen schneller; auch die CPU nutzt sie."
phase_banner = "Furor-Phase aktiv"

[it.new]
mod_name = "Barra del furore"
mod_description = "La barra del furore di GO Strikers: una barra di fuoco accanto a ogni stemma si riempie col procedere della partita e, quando è piena, L3 / R avvia per 24 secondi la fase di furore. Ogni giocatore si risveglia con l'aspetto del suo ruolo, le tecniche colpiscono più forte e si corre più veloci; la CPU la usa a sua volta."
phase_banner = "Fase di furore attiva"

[pt.new]
mod_name = "Barra de furor"
mod_description = "A barra de furor de GO Strikers: uma barra de fogo junto a cada emblema enche-se ao longo da partida e, cheia, L3 / R inicia durante 24 segundos a fase de furor. Cada jogador desperta com o aspeto da sua posição, as técnicas batem mais forte e corre-se mais depressa; a CPU também a usa."
phase_banner = "Fase de furor ativa"

[ja.new]
mod_name = "フューラーゲージ"
mod_description = "GO ストライカーズのフューローゲージ。各チームのエンブレムの横にある炎のバーが試合の進行で溜まり、満タンになると L3 / R で24秒間のフューローが始まります。全選手がポジションごとの覚醒姿になり、必殺技が強くなり、走るのも速くなります。CPUも使います。"
phase_banner = "ヒーロータイム発動中"

[zh_hans.new]
mod_name = "怒火槽"
mod_description = "《闪电十一人GO 强袭者》的斗志槽：每个队徽旁的火焰条会随比赛推进而填满，满了之后按 L3 / R 即可进入持续24秒的斗志状态。所有球员会换上对应位置的觉醒外观，必杀技更强，跑得更快；电脑也会使用。"
phase_banner = "怒火时刻发动中"

[zh_hant.new]
mod_name = "怒火槽"
mod_description = "《閃電十一人GO 強襲者》的鬥志槽：每個隊徽旁的火焰條會隨比賽推進而填滿，滿了之後按 L3 / R 即可進入持續24秒的鬥志狀態。所有球員會換上對應位置的覺醒外觀，必殺技更強，跑得更快；電腦也會使用。"
phase_banner = "怒火時刻發動中"
