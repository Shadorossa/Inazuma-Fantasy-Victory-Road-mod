schema = "VRFW.menu/2"

# Team dock half rows (VRFW.team_dock.half_rows, docs/framework/team-dock.md): the layout the service places at run time.
# LEFT on the list reaches the service, which steps from the right cell of a pair to the left one.
[[patch]]
menu = "soccer_team_dock_menu"
add_commands = [
    { layer = "team01_02_list_item", input = "CMD_LEFT", command = "CMD_FUNCTION", arg = "team_dock_half_row_left", flag = 1 },
]

# The list gets one row instance per slot joint (retail 8), so every row mods add is drawn; retail shows min(instances, rows).
[[patch]]
menu = "soccer_team_dock_menu"
layer = "team01_02_list_item"
count = 11

# One slot joint per list instance that no animation drives; slots 10 and 11 hang from the last retail row joint.
[[layout]]
file = "common/menu/102_team/team01/team01_01/team01_01.g4pkm"
joint = "_atc_half_row_slot01"
parent = "_atc_list01"
translate = [0.0, 0.0]

