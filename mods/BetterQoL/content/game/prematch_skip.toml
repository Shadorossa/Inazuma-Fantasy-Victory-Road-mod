schema = "VRFW.game/2"

# Pre-match X skip (graft betterqol_prematch_skip).

[[VRFW.Hook]]
name = "BrightFadeLayer"
game = "Render.BrightFadeLayer"
kind = "function"

# Held: layer 1's start and target colours (8 floats from obj + 0x3C) = (0, 0, 0, 1), (0, 0, 0, 1).
[[VRFW.Hook.answer]]
phase = "post"
when = [
  { value = "args[2]", equals = 1 },
  { value = "args[1]", in_table = "BetterQoL.XSkipCover" },
]
each = { count = "8", max = 8 }
value = "if(i == 3, 1, if(i == 7, 1, 0))"
write = "[args[1] + 0x3C + i * 4]:f32"

# CMND_BETTERQOL_XSKIP_COVER(on) -> 1 when done (1 = hold, 0 = release); 0 to a hold while the hook is off.
[[VRFW.Command]]
name = "CMND_BETTERQOL_XSKIP_COVER"
handler = "BetterQoL.XSkipCover"
needs = ["Render.BrightFade"]

# 14381FE  48 8B 05 ??
[[VRFW.Hook]]
name = "PrematchSecondEntrance"
game = "Event.PrematchSecondEntrance"
kind = "mid"

[[VRFW.Command]]
name = "CMND_BETTERQOL_XSKIP_JUMP"
handler = "BetterQoL.XSkipJump"
needs = ["Event.Manager", "Event.Seek", "Audio.StopEventSounds", "Event.TimelineSeek"]

# Seconds X must be held ([prematch_skip] hold; 0 = no prompt).
[[VRFW.Command]]
name = "CMND_BETTERQOL_XSKIP_HOLD"
handler = "BetterQoL.SkipHold"

