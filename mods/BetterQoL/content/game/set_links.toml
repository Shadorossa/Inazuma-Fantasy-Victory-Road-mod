# The player set links kept before team loadouts: read once and moved into VRFW.team_loadout (scripts\set_links.lua, assets\lua\_all\betterqol_team_loadout.lua).
schema = "VRFW.game/2"

# -> the links as "n:h=s,h=s;n:..." (template number, charaStHdl, set index); "" when none
[[VRFW.Command]]
name = "CMND_BETTERQOL_SET_LINKS_TO_MOVE"
handler = "BetterQoL.SetLinks.ToMove"

# -> true once the links file is set aside
[[VRFW.Command]]
name = "CMND_BETTERQOL_SET_LINKS_MOVED"
handler = "BetterQoL.SetLinks.Moved"
