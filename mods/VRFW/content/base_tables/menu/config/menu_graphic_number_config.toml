schema = "VRFW.base_table/1"
# VRFW: 4 digit slots for the stat numbers of soccer11_06_p1_formation_status_graph_param_num (retail 3, centred, so a
# value of 3 digits or fewer is drawn as before). With DispMaxValue 9999 (content\menus\stat_number_digits.toml) the
# stats show up to 9999; the number fit (content\number_fit\stat_numbers.toml) keeps them at the width of 3 digits.
# Keyed by the number's id (column #0): the row positions differ per game build.

[[keyed]]
list = "MENU_GRAPHIC_NUMBER"
key_columns = ["#0"]

  [[keyed.set]]
  key = 0x9BBCA40C                      # stat value (blue)
  cells = { "#5" = 4 }

  [[keyed.set]]
  key = 0x02B5F5B6                      # stat value (white)
  cells = { "#5" = 4 }

  [[keyed.set]]
  key = 0x219B6596                      # stat change preview
  cells = { "#5" = 4 }

  [[keyed.set]]
  key = 0x4B2B4564                      # stat change preview
  cells = { "#5" = 4 }

  [[keyed.set]]
  key = 0x23DDDBCF                      # stat change preview
  cells = { "#5" = 4 }

  [[keyed.set]]
  key = 0x496DFB3D                      # stat change preview
  cells = { "#5" = 4 }

# 6 digit slots for the held-item counters (retail 5): a stack of up to 999999 (an item's max_stack) is drawn in full.
# Digits are laid out by the value's own length, so shorter values keep their right edge. Spacing (#7) tightened (retail
# 0, -1, -1, +1) so that 6 digits fit the room the layouts reserve for 5, left of the bag icon.
# DispMaxValue per layer: content\menus\item_count_digits.toml.

  [[keyed.set]]
  key = 0x80A0D941                      # num_shop_have01: the item cards and shop rows
  cells = { "#5" = 6, "#7" = -2 }

  [[keyed.set]]
  key = 0xC6C6E593                      # num_have01: quantity window, gift lists, route info window
  cells = { "#5" = 6, "#7" = -2 }

  [[keyed.set]]
  key = 0x6D29755E                      # bag list row
  cells = { "#5" = 6, "#7" = -2 }

  [[keyed.set]]
  key = 0x06B07E66                      # the shop's currency pill
  cells = { "#5" = 6, "#7" = -1 }
