[zh_hant.new]
mod_name = "氣場改造"
mod_description = "把四項氣場改造整合進一個模組，每項都能在設定中開關。Souls Rework：圖騰在比賽中升級並轉動技能輪盤。Custom Change Mode：任何球員都能擁有切換為你任意角色的專屬「模式切換」，按RB+B切換。All Miximaxed：像《時空之石》一樣讓任意兩名球員混合最大化。All Keshin Armed：每名球員都能使用帶鎧甲的化身。"
part_souls_rework = "Totems level up during the match"
part_souls_rework_help = "雙方球隊的圖騰像GO銀河的靈魂一樣在比賽中升級，並用專屬技能轉動技能輪盤。重新啟動遊戲後生效。"
souls_top_level = "圖騰: 開場即滿級"
souls_top_level_help = "每個圖騰從比賽開始就是5級：沒有等級系統。"
souls_reel = "圖騰: 顯示技能輪盤"
souls_reel_help = "圖騰使用專屬技能時，在過場動畫中於畫面上方顯示技能輪播。關閉：技能照常生效，不顯示輪播。"
part_custom_change_mode = "Own change mode for every player"
part_custom_change_mode_help = "任何球員都能擁有切換為你任意角色的專屬「模式切換」，按RB+B切換（兩次切換間隔60秒）。重新啟動遊戲後生效。"
change_aura = "切換模式: 切換時顯示綠色氣場"
change_aura_help = "建立的切換持續期間，球員身披綠色氣場。"
part_all_miximaxed = "Miximax between any two players"
part_all_miximaxed_help = "像時空之石一樣讓任意兩名球員混合最大化（技能盤上的「建立混合最大化」）。重新啟動遊戲後生效。"
miximax_stats = "混合最大: 獲得對方能力"
miximax_stats_help = "混合最大化期間，球員獲得對方部分能力（時空之石）。"
part_all_keshin_armed = "Every keshin with its armour"
part_all_keshin_armed_help = "每個化身都有其武裝，所有球員可用（技能盤上化身棋子的武裝槽）。重新啟動遊戲後生效。"
