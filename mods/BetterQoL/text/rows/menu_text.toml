# Team template texts (graft team_templates; read with CMND_TEXT_GET(crc32(id))).
schema = "VRFW.text/2"

[[row]]
id = "better_qol_template_refused_busy"
es = "Se está guardando la partida. Inténtalo de nuevo en un momento."
en = "The game is being saved. Try again in a moment."
fr = "La partie est en cours de sauvegarde. Réessaie dans un instant."
de = "Das Spiel wird gerade gespeichert. Versuche es gleich noch einmal."
it = "Salvataggio in corso. Riprova tra un momento."
pt = "O jogo está sendo salvo. Tente novamente em instantes."
ja = "セーブ中です。しばらくしてからもう一度お試しください。"
zh_hans = "正在保存游戏，请稍后再试。"
zh_hant = "正在儲存遊戲，請稍後再試。"

[[row]]
id = "better_qol_template_refused_error"
es = "No se pudo abrir la plantilla. Los equipos no han cambiado (detalles en loader.log)."
en = "The template could not be opened. Your teams did not change (details in loader.log)."
fr = "Impossible d'ouvrir ce modèle d'équipe. Tes équipes n'ont pas changé (détails dans loader.log)."
de = "Die Teamvorlage konnte nicht geöffnet werden. Deine Teams sind unverändert (Details in loader.log)."
it = "Impossibile aprire il modello di squadra. Le squadre non sono cambiate (dettagli in loader.log)."
pt = "Não foi possível abrir o modelo de equipe. Suas equipes não mudaram (detalhes em loader.log)."
ja = "チームテンプレートを開けませんでした。チームは変更されていません（詳細は loader.log）。"
zh_hans = "无法打开队伍模板。队伍未改变（详见 loader.log）。"
zh_hant = "無法開啟隊伍範本。隊伍未改變（詳見 loader.log）。"

