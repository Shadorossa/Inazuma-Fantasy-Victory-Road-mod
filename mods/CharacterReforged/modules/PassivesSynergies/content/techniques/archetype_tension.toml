# A Tension archetype passive: the tension the team earns when it loses a focus duel, +12 %
# (the effect: content\special_passives\archetype_tension.toml). Built like the game's ps10063
# (category 9 = Tension archetype, team target, the Tension buff icon 19, build icon 3); the
# timing 951 leaves the effect to the passive engine.
[[passive_effect_def]]
key = "passives_synergies_tension_on_loss_effect"
info = [9, 0, 0]
entries = [
  ["EXEC_TIMING_DATA", 951],
  ["TARGET_DATA", 4],
  ["EXEC_DATA", 1, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A],
  ["EFFECT_DATA_LIST_BEG", 1],
  ["EFFECT_DATA", 0x713C7D84, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A],
  ["EFFECT_DATA_LIST_END"],
  ["GRAND_TOTAL_INFO", 0xB9A3562D, 101, 150],
  ["GRAND_TOTAL_INFO_BUFF_ICON_DATA_LIST_BEG", 1],
  ["GRAND_TOTAL_INFO_BUFF_ICON_DATA", 19],
  ["GRAND_TOTAL_INFO_BUFF_ICON_DATA_LIST_END"],
  ["GRAND_TOTAL_INFO_BUILD_TYPE_ICON_DATA_LIST_BEG", 1],
  ["GRAND_TOTAL_INFO_BUILD_TYPE_ICON_DATA", 3],
