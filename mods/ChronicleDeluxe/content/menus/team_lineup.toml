schema = "VRFW.menu/2"

# the pitch: the retail formation field without the attach rows of the VS screen's card layers
[[object]]
name = "chronicle_deluxe_lineup_pitch"
from = "vsroute02_06_enemy_formation_base"
remove_block = ["CMenuAttachLocator"]

[[object]]
name = "chronicle_deluxe_lineup_card"
from = "team00_01_chara_card_for_vsroute"
if_not_mod = "BetterUI"
keep_name = true
remove_block = ["MenuCollisionSetting", "CMenuAttachLocator"]

[[object]]
name = "chronicle_deluxe_lineup_card"
from = "team00_01_chara_card_for_vsroute"
if_mod = "BetterUI"
keep_name = true
remove_block = ["MenuCollisionSetting", "CMenuAttachLocator"]
set = [
    { parameter = "SkeletonAnime", match = { 1 = "common/menu/102_team/team00/team00_01/team00_01.g4pkm" }, values = { 1 = "common/menu/102_team/team00/team00_01/team00_01_bui_fc.g4pkm" } },
    { parameter = "AttachEffect", match = { 1 = 0x151AA0C6, 2 = 0x5A709C12, 3 = 1, 4 = 0.996999979019165 }, values = { 2 = 0x45893ACA } },
    { parameter = "AttachEffect", match = { 1 = 0x8C13F17C, 2 = 0x5A709C12, 3 = 1, 4 = 0.996999979019165 }, values = { 2 = 0xDC806B70 } },
    { parameter = "AttachEffect", match = { 1 = 0xDDFA2FB6, 2 = 0x5A709C12, 3 = 1, 4 = 0.996999979019165 }, values = { 2 = 0x45893ACA } },
    { parameter = "AttachEffect", match = { 1 = 0x33F44E9A, 2 = 0x5A709C12, 3 = 1, 4 = 0.996999979019165 }, values = { 2 = 0xDC806B70 } },
]

[[patch]]
menu = "vs_route_town_command_select_menu"
add_layer = { name = "chronicle_deluxe_lineup_pitch", object = "chronicle_deluxe_lineup_pitch", count = 1, after = "vsroute01_18_legend_telop", groups = [{ group = "vs_route_town_command_select_menu", flags = [0, 0, 0, 0, 1, 0], after = "vsroute01_18_legend_telop" }] }

[[patch]]
menu = "vs_route_town_command_select_menu"
add_layer = { name = "chronicle_deluxe_lineup_card", object = "chronicle_deluxe_lineup_card", count = 11, after = "chronicle_deluxe_lineup_pitch", groups = [{ group = "vs_route_town_command_select_menu", flags = [0, 0, 0, 0, 1, 0], after = "chronicle_deluxe_lineup_pitch" }] }

[[patch]]
menu = "vs_route_town_command_select_menu"
add_layer = { name = "chronicle_deluxe_lineup_text", object = "vrfw_mp_label", count = 2, after = "chronicle_deluxe_lineup_card", groups = [{ group = "vs_route_town_command_select_menu", flags = [0, 0, 0, 0, 1, 0], after = "chronicle_deluxe_lineup_card" }] }

[[patch]]
menu = "vs_route_town_command_select_menu"
add_layer = { name = "chronicle_deluxe_lineup_mark", object = "cmn01_10_new_icon", count = 11, after = "chronicle_deluxe_lineup_text", groups = [{ group = "vs_route_town_command_select_menu", flags = [0, 0, 0, 0, 1, 0], after = "chronicle_deluxe_lineup_text" }] }

[[patch]]
menu = "vs_route_town_command_select_menu"
resources = ["#/menu/200_icon/100_num/num_menu02.g4tx", { path = "ega1400a_1", kind = 1 }, { path = "ega1400a_2", kind = 1 },
       { path = "ega1450a_1", kind = 1 }, { path = "ega1450a_3", kind = 1 }]

# Y on the battle list: the team dock
[[patch]]
menu = "vs_route_town_command_select_menu"
add_commands = [
    { layer = "vsroute01_16_sub_list", input = "CMD_FUNC3", command = "CMD_FUNCTION", arg = 1238658383, flag = 1 },
]
