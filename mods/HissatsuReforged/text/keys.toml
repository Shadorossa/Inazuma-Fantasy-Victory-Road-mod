[fr.new]
mod_name = "Hissatsu Reforged"
mod_description = "Rééquilibre 683 supertechniques avec une nouvelle puissance, un nouveau coût de tension et un nouveau temps de recharge. Les supertechniques à deux propriétés affichent les deux icônes dans toutes les listes, et peuvent infliger des coups critiques. Les supertechniques montent de niveau à la manière classique : chaque technique progresse avec le nombre de fois que le joueur l'utilise en match, et un message annonce la montée. Le dernier niveau demande le Livre d'évolution ultime de la boutique générale, et un joueur ne peut plus porter deux fois la même supertechnique."
