# The game's default group sends k002011 to k002010's packs; this event ships k002011's own.
[[event_env]]
event = "ev80_00020"
tag_words = { set = { k002011 = "k002011" } }

# The armour of wks_fantasy_k002011 (no player owns it: CharacterReforged lets every bearer arm it).
