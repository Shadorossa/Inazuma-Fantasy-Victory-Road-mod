schema = "VRFW.option/2"
# Rows of the Mods options screen (schema VRFW.option/2).

# The boot logos and notices; off goes from language setup straight to the opening movie; applies at next start.
[[option]]
id = "boot_screens"
visual = true
type = "toggle"
label = "boot_screens"
help = "boot_screens_help"
default = false
# child of "Custom style"; when that is off the retail boot sequence plays
parent = "mod_options.custom_style"
order = 125
