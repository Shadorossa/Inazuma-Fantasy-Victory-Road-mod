[es.new]
mod_name = "Reforma de auras"
mod_description = "Cuatro reformas de auras en un solo mod, cada una se activa o desactiva en sus ajustes. Souls Rework: los tótems suben de nivel durante el partido y giran una ruleta de habilidades. Custom Change Mode: cualquier jugador tiene su propio «Modo cambio» a cualquiera de tus personajes, y cambia con RB+B. All Miximaxed: un miximax entre dos jugadores cualesquiera, como en Chrono Stone. All Keshin Armed: todos los espíritus guerreros con su armadura, para todos los jugadores."
