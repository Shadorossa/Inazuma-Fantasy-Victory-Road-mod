mod_description = "自定义被动技能变为每名球员的专属被动技能：由模组按角色设定，而不是由你装备；被动栏位始终显示它、无法更换，比赛中会使用它。还新增通用属性被动（风、林、火、山、虚），使球员该属性的自身技能强15%。被动由可复用的模块构成，模组可按角色编辑，其他模组赋予灵魂的被动也由同一套系统驱动。需要Character Reforged。"
