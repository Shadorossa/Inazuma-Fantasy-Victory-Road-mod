#                                       sold in the General Store (content\shops\arion_sherwind_uniform.toml)
#                                       and shows him with his military cap (its [[VRFW.ItemTransform]] to
#                                       content\characters\arion_military_cap.toml: head c90400081 + cap exmesh i90400081,
