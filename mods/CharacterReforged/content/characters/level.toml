schema = "VRFW.character/2"
# The level cap: config.toml [level] cap (MaxConfig), 99..999; EXP above 99 = Base + Linear·k + Square·k², k = level − 99.
[VRFW.Level]
Max = 200
MaxConfig = "level.cap"
Exp = { Base = 124072, Linear = 3700, Square = 20 }   # EXP of level 99 + k
StoryCap = "max"
RarityExpRate = 1.0
Npc = true                # opponents / NPCs / match copies above the game's cap too
BeansLevel = 99           # bean cap per slot = 2 x min(Lv, 99) - 18 = 180
