# Declaration schema of BetterEquipment.affinity/1 (content\better_equipment): fields read from the records the mods ship. `vrfw check` validates the files with it and the ModManager draws their forms from it.
schema = "VRFW.decl_schema/1"
kind = "BetterEquipment.affinity/1"
folder = "content/better_equipment"
label = "Equipment affinity"
label_es = "Afinidad de equipamiento"

[entry.Item]
entry_table = "item"
item = { type = "string", ref = "item", required = true }
position = { type = "string", required = true }
raises = { type = "table", required = true }
element = { type = "string" }
