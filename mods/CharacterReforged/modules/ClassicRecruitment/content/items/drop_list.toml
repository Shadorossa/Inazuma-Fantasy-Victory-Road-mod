schema = "VRFW.item/2"
# No normal player spirit from any source (match drops, rewards, shops, packs); a reserved slot keeps the game's.
[VRFW.DropList]
HideTabs = [1, 2, 3, 4]

[VRFW.DropList.Spirits]
ExcludeAll = true
AllSources = true
Rarities = [0, 1, 2, 3, 4]
ExceptReservedSlots = true

# With the gacha on (option remove_gacha off), the pulls of the Players Universe screen are given.
[[VRFW.DropList.Spirits.AllowGrant]]
Menus = ["players_universe_menu"]
When = { option = "remove_gacha", equals = 0, default = 1 }
