# BetterUI: match HUD and menu cleanups (rival meters, buff icons, Esc guide, zone HUD, area title).
name = "better_ui_hud"
order = 900
module = "lua_bridge"
mod = "BetterUI"
requires = []
conflicts = []
wraps = []
description = "Match HUD cleanups and the Mods screen raised for the compact header"

# The VRFW Mods screen raised for the compact header (VRFW.mods_screen.set_top_offset, read by its OnInit).
[[foreign_patches]]
stem = "vrfw_mods_menu"
source = "mods_menu_layout.lua"
require = ["vrfw_mods_menu_stub"]

[[files]]
stem = "soccer_menu"

  [[files.ops]]
  type = "bytecode_child"
  source = "soccer_menu.lua"
  marker = "better_ui soccer_menu"
  generator = "research/mods/BetterUI/_tools/betterui_generators.py:better_ui_snippet"
  generator_arguments = { part = "better_ui_soccer_menu.lua", scope = "BetterUI" }
  vars = { "@TAG@" = "soccer_menu" }

