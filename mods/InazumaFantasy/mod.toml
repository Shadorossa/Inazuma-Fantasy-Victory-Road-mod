id = "InazumaFantasy"
# name / description: English fallback of the text keys mod_name / mod_description (text\keys.toml)
name = "Inazuma Fantasy"
version = "0.3.0"
author = "Fantasy Team"
description = "The Market gets its own shops priced in Passion Points that every match pays: a general store, a training shop and two special move shops. It adds Fantasy Idol cards, the Inazuma Fantasy title screen, a free match section with two mod teams and a daily legendary rival, and sells new special moves, including 30 by LegendaryAd and God Strike, and an Arion military outfit."
priority = 0
tags = ["Gameplay"]
updated = "2026-11-09"
prefix = "InazumaFantasy"
folder = "InazumaFantasy"
requires = ["VRFW>=0.3.0"]
optional = ["BattleBayDeluxe", "BetterMenu", "BetterQoL", "CharacterReforged", "ClassicRecruitment"]
conflicts = []
# native access of content\game: [[VRFW.Command]] (the Daily Legendary Rival commands)
permissions = ["command"]
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
# its graft patches market_menu's merge path; early, the later wrappers of that script stay on top of it
lua_early = true
