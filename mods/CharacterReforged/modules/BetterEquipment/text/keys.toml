mod_description = "所有装备价值相同：加成总和（降低的部分也计入）始终等于游戏装备中的最高加成（基础游戏为40，有模组加入更强装备时更高）：有的提升一项能力值，有的提升两到三项，被动效果强的道具会降低一项，因此道具的区别在于类型而非强弱。位置或属性与道具相符的球员，其提升效果+15 %（两者都相符时+25 %）。67个套装在穿戴2到4件时给予能力值和效果（一件道具可属于多个套装；穿戴的一件只计入其中一个）。主题道具和命名道具拥有一项被动：其必杀技系列威力+5 %、其属性的必杀技、气势消耗、冷却、移动速度、每次对决、扑救或进球获得的气势、落后或领先时的能力值。需要Character Reforged；指定必杀技系列的被动仅在定义该系列的模组启用时生效。"
