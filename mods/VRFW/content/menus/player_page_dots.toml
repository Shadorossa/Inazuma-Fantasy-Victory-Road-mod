schema = "VRFW.menu/2"

[[object]]
name = "vrfw_pp_dots"
from = "soccer11_05_formation_status_base"
remove = [
    { parameter = "NullLayerName" },
    { parameter = "_touch_arw01_l" },
    { parameter = "_touch_arw01_r" },
]

# the copies' attach rows on the retail status base: NullLayerName [vrfw_pp_dots0 / 1, _pos_base01, vrfw_pp_dots, 0 / 1]
[[object_set]]
object = "soccer11_05_formation_status_base"
add = [
    { block = "CMenuAttachLocator", parameter = "NullLayerName", values = [0x1F2FA1D9, 0x5A709C12, 0xFA48C7C5, 0] },
    { block = "CMenuAttachLocator", parameter = "NullLayerName", values = [0x6828914F, 0x5A709C12, 0xFA48C7C5, 1] },
]

[[patch]]
menu = "personal_plate_menu"
add_layer = { name = "vrfw_pp_dots", object = "vrfw_pp_dots", count = 2, align = ["right", "middle"], scale = 0.20000000298023224, after = "soccer11_05_formation_status_base", groups = [{ group = "personal_plate_menu", flags = [0, 0, 0, 0, 1, 0], after = "soccer11_05_formation_status_base" }] }

[[patch]]
menu = "personal_plate_menu_for_datafile"
add_layer = { name = "vrfw_pp_dots", object = "vrfw_pp_dots", count = 2, align = ["right", "middle"], scale = 0.20000000298023224, after = "soccer11_05_formation_status_base", groups = [{ group = "personal_plate_menu", flags = [0, 0, 0, 0, 1, 0], after = "soccer11_05_formation_status_base" }] }
