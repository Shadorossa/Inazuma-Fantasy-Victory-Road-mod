# Declaration schema of ClassicEquipment.luck/1 (content\classic_equipment): fields read from the records the mods ship. `vrfw check` validates the files with it and the ModManager draws their forms from it.
schema = "VRFW.decl_schema/1"
kind = "ClassicEquipment.luck/1"
folder = "content/classic_equipment"
label = "Equipment luck"
label_es = "Suerte del equipamiento"
doc = "The luck value each equipment item gives."
doc_es = "El valor de suerte que da cada objeto de equipamiento."

[entry.Item]
entry_table = "item"
item = { type = "string", ref = "item", required = true }
luck = { type = "number", required = true }
