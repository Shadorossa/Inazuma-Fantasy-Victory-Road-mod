# «Cambiar forma» key: a rebindable [[action]] (default pad RS / keyboard G) that cycles the shown character's forms.
schema = "VRFW.input/1"

[[action]]
id = "BetterQoL.ViewForms.Cycle"
command = "CMD_BETTERQOL_VIEW_FORMS"
ctrl = ["MENU_CTRL", "MENU_CTRL_WITH_ANALOG_MOVE_FOCUS", "MENU_CTRL_SEPARATE_CROSS_KEY"]
category = "basic"
label = "betterqol_view_forms_action"
pad = "RS"
keyboard = "G"
screens = ["personal_plate_menu", "team_dock_formation_menu"]
