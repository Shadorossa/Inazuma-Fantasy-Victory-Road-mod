schema = "VRFW.character/2"
# Inazuma Eleven Cross characters of the IEVRCROSS mod that IECross did not have: Axel Blaze with his red Cross hair,
# and David Samford and Nathan Swift in the Pumpkin Devil kit (pumpkin mask). Its Tyron Rock was the game's Tyron in the
# Shin Zeus kit (same head, face and card): left out, the kit is sold (content\items\cross_kits.toml).
# Own ids (pinned): character crc32(internal name), card crc32("IECross.<name>#card"), model
# crc32("IECross.<name>.look"). Heads: content\models\characters\ (the mod's files, chr\_face\90_CROSS\);
# kits: content\looks\cross_new_kits.toml. Names, voice and moves are the template's; element and positions
# are the Cross card's; each card is a copy of the template's first card. Recruited at the Office on the template's page (its office row cloned).
default_lang = "en"

[[character]]
name = "axel_blaze_cross"                        # Axel Blaze (Cross)
based_on = "c01000100"
order = 76

  [character.base]
  id = 0x77011C7E
  name = "c90000170"
  team_3 = 0x1E5DC7AA

  [character.new_model]
  id = 0x2CE900BB
  from = 0x185FFC67                                       # model of c01000100
  order = 84
  [character.new_model.cells]
  clothes = 0x9D2BBD10
  shoes = 0x9035CD57
  head_mesh_path = "_face/90_CROSS/c90000250/c90000250.g4md"

  [[character.cards]]
  id = 0xE95788DB
  from = 0x288C9454                                       # Axel Blaze's first card (c01000100)
  order = 81
  element = "fire"
  position = "fw"
  sub_position = "mf"
  growth_pattern = 1

  [character.recruit]
  beside = "c01000100"

