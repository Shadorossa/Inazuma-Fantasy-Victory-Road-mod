[es.new]
mod_name = "Pasivas y sinergias"
mod_description = "Cada jugador tiene una pasiva propia que no se puede cambiar (se desactiva con la opción «Pasivas propias»), además de pasivas elementales genéricas que refuerzan sus supertécnicas de ese elemento. Las sinergias de equipo piden un equipo o un grupo en vez de personajes concretos, y las nuevas traen sus propios iconos; el panel muestra quién falta."
option_own_passives = "Pasivas propias"
option_own_passives_help = "Cada jugador lleva su pasiva propia en el espacio de pasiva personalizada, definida por personaje en los mods. Desactivado: el espacio queda vacío. Se aplica al reiniciar el juego."
