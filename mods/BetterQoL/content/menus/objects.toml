# row per instance of the layer util_tb_pager (menus\10_win\sub_window.toml): trace name, window node _pos_base01 (the
# panel's top centre, the node the list rows attach to too), layer, instance. The sub window's script
# (lua\sub_window_group\150_team_bank_pager.lua) turns the traces on, only in the bank window.
