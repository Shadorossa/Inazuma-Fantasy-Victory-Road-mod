  [character.text.es]
  name = "Tsunoda Keigo"
  short = "Keigo"
  description = "El Shitennou del Este. Su regate, perfeccionado en la bulliciosa ciudad,\n¡le ha dado una habilidad excepcional para mantener la posesión del balón!"

  [character.text.en]
  name = "Tsunoda Keigo"
  short = "Keigo"
  description = "The Shitennou of the East. His dribbling, honed in the bustling city,\nhas given him an exceptional ability to keep possession of the ball!"

  [character.text.fr]
  name = "Tsunoda Keigo"
  short = "Keigo"
  description = "Le Shitennou de l'Est. Son dribble, affiné dans la ville animée,\nlui a donné une capacité exceptionnelle à conserver la possession du ballon !"

  [character.text.de]
  name = "Tsunoda Keigo"
  short = "Keigo"
  description = "Der Shitennou des Ostens. Sein Dribbling, verfeinert in der geschäftigen Stadt,\nverleiht ihm eine außergewöhnliche Fähigkeit, den Ballbesitz zu behalten!"

  [character.text.it]
  name = "Tsunoda Keigo"
  short = "Keigo"
  description = "Lo Shitennou dell'Est. Il suo dribbling, affinato nella città frenetica,\ngli ha dato una capacità eccezionale di mantenere il possesso del pallone!"

  [character.text.pt]
  name = "Tsunoda Keigo"
  short = "Keigo"
  description = "O Shitennou do Leste. Seu drible, aprimorado na cidade movimentada,\nlhe deu uma habilidade excepcional de manter a posse de bola!"

