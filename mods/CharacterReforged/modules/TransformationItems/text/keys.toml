# Texts of Transformation Items: the mod's name and description on the Mods screen.
# «Transformation Items» is not translated. A language missing here falls back to English.
schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Transformation Items"
mod_description = "Items that change a player's look while he wears them. The Alius Crystal lets a player who took the Alius stone (the Dark Emperors, Royal Academy Redux and the Alius Academy players, classic version) equip it and take his Alius look, with that version's stats and moves; take it off and he is back to normal. It unlocks once you beat the Dark Emperors in the Chronicle."

[es.new]
mod_name = "Objetos de transformación"
mod_description = "Objetos que cambian la apariencia de un jugador mientras los lleva. La Piedra Alius deja que un jugador que tomó la piedra Alius (Emperadores Oscuros, Royal Academy Redux y los jugadores de la Academia Alius, versión clásica) se la equipe y tome su apariencia Alius, con las estadísticas y técnicas de esa versión; al quitársela vuelve a ser él. Se puede equipar tras ganar a los Emperadores Oscuros en la Crónica."

[fr.new]
mod_name = "Objets de transformation"
mod_description = "Des objets qui changent l'apparence d'un joueur tant qu'il les porte. Le Cristal Alius permet à un joueur qui a pris la pierre Alius (les Empereurs Noirs, Royal Academy Redux et les joueurs de l'Académie Alius, version classique) de l'équiper et de prendre son apparence Alius, avec les statistiques et techniques de cette version ; une fois retiré, il redevient normal. Il se débloque en battant les Empereurs Noirs dans la Chronique."

[de.new]
mod_name = "Verwandlungsgegenstände"
mod_description = "Gegenstände, die das Aussehen eines Spielers ändern, solange er sie trägt. Der Alius-Stein lässt einen Spieler, der den Alius-Stein nahm (Dark Emperors, Royal Academy Redux und die Spieler der Alius-Akademie, klassische Version), ihn ausrüsten und seine Alius-Gestalt annehmen, mit den Werten und Techniken dieser Version; legt er ihn ab, ist er wieder normal. Er wird freigeschaltet, sobald die Dark Emperors im Chronik-Modus besiegt sind."

[it.new]
mod_name = "Oggetti di trasformazione"
mod_description = "Oggetti che cambiano l'aspetto di un giocatore finché li indossa. La Pietra Alius permette a un giocatore che ha preso la pietra Alius (i Dark Emperors, Royal Academy Redux e i giocatori dell'Accademia Alius, versione classica) di equipaggiarla e di assumere il suo aspetto Alius, con le statistiche e le tecniche di quella versione; se la toglie torna normale. Si sblocca dopo aver battuto i Dark Emperors nella Cronaca."

[pt.new]
mod_name = "Objetos de transformação"
mod_description = "Itens que mudam o aspeto de um jogador enquanto os usa. A Pedra Alius permite que um jogador que tomou a pedra Alius (os Dark Emperors, Royal Academy Redux e os jogadores da Academia Alius, versão clássica) a equipe e tome o seu aspeto Alius, com os atributos e técnicas dessa versão; ao tirá-la volta ao normal. Desbloqueia depois de venceres os Dark Emperors na Crónica."

[ja.new]
mod_name = "変身アイテム"
mod_description = "装備している間、選手の見た目を変えるアイテム。エイリアストーンは、エイリア石を手にした選手（ダークエンペラーズ、真・帝国学園、エイリア学園の選手、クラシック版）が装備するとエイリアの姿になり、そのバージョンの能力値と技が使えます。外せば元に戻ります。クロニクルでダークエンペラーズを倒すと装備できるようになります。"

[zh_hans.new]
mod_name = "变身道具"
mod_description = "装备期间会改变球员外观的道具。宇宙晶石让曾使用外星石的球员（暗黑帝王、真·帝国、外星学园的球员，经典版）装备后变为外星形态，并使用该版本的能力值和技能；卸下即恢复原样。在编年史中战胜暗黑帝王后即可装备。"

[zh_hant.new]
mod_name = "變身道具"
mod_description = "裝備期間會改變球員外觀的道具。宇宙晶石讓曾使用外星石的球員（暗黑帝王、真·帝國、外星學園的球員，經典版）裝備後變為外星形態，並使用該版本的能力值和技能；卸下即恢復原樣。在編年史中戰勝暗黑帝王後即可裝備。"
