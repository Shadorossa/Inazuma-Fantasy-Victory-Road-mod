schema = "VRFW.technique/3"
default_lang = "none"

# A «Crítico» archetype passive: a critical shot of the team keeps 15 % more power after it beats a field player's block
# (the effect: content\special_passives\critical_build.toml). Built like the game's ps10053 (category 6 = the build 0
# passives, team target, the buff icon 4, build icon 0); the timing 951 leaves the effect to the passive engine.
[[passive_effect_def]]
key = "hissatsu_reforged_critical_break_through_effect"
info = [6, 0, 0]
entries = [
  ["EXEC_TIMING_DATA", 951],
  ["TARGET_DATA", 4],
  ["EXEC_DATA", 1, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A],
  ["EFFECT_DATA_LIST_BEG", 1],
  ["EFFECT_DATA", 0x713C7D84, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A],
  ["EFFECT_DATA_LIST_END"],
  ["GRAND_TOTAL_INFO", 0xCCF9CDC7, 101, 30],
  ["GRAND_TOTAL_INFO_BUFF_ICON_DATA_LIST_BEG", 1],
  ["GRAND_TOTAL_INFO_BUFF_ICON_DATA", 4],
  ["GRAND_TOTAL_INFO_BUFF_ICON_DATA_LIST_END"],
  ["GRAND_TOTAL_INFO_BUILD_TYPE_ICON_DATA_LIST_BEG", 1],
  ["GRAND_TOTAL_INFO_BUILD_TYPE_ICON_DATA", 0],
  ["GRAND_TOTAL_INFO_BUILD_TYPE_ICON_DATA_LIST_END"],
]

# effects: the definition above (crc32 of its key) and the value the texts show as <VALUE>
[[passive]]
key = "hissatsu_reforged_critical_break_through"
from = "ps10053"
cells = { desc_text = 0x0611075C }
effects = [[0x3FBD6C3E, 15, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A, 0xC4DC849A]]

