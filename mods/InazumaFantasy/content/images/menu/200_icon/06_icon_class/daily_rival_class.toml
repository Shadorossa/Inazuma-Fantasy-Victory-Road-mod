# Inazuma Fantasy: the class title «BATALLA LEGENDARIA+» of the «Rival del día» row's class card (Nv. 250), drawn by
# the row's Banner in content/teams/free_match_section.toml. Made at boot from the player's own files:
# the retail Chronicle title gtxt_class28 of each language file, hue-turned, with the «+» of the retail
# «BATALLA HEROICA+» (gtxt_class26 of the es file: same glyph, size and height, right after the text), fitted onto the
# class card as Chronicle Deluxe's BATALLA LEGENDARIA. The «+» outline is cut with daily_rival_class/legendary_plus_mask.png
# (an alpha shape). Numbers measured by research/scripts/if_legendary_battle_plus.py (re-run it after a game update
# that changes these sprites). A texture of its own in the class title atlas: 512 x 160 per language, 1024 x 320 in the
# default (Japanese) file. The same title as text: InazumaFantasy.daily_rival_class.
schema = "VRFW.image/1"

[[texture]]
atlas = "#/menu/200_icon/06_icon_class/<LG>/icon_class.g4tx"
name = "if_legendary_battle_plus_tex"
size = [1024, 320]
lang = ""

[[texture]]
atlas = "#/menu/200_icon/06_icon_class/<LG>/icon_class.g4tx"
name = "if_legendary_battle_plus_tex"
size = [512, 160]
lang = ["en", "es", "fr", "de", "it", "pt", "zh_hans", "zh_hant"]

# the «+» of BATALLA HEROICA+ (gtxt_class26, es file), its outline cut by the mask
[[recipe]]
name = "if_legendary_plus_mask"
png = "daily_rival_class/legendary_plus_mask.png"

[[recipe]]
name = "if_legendary_plus"
game = "#/menu/200_icon/06_icon_class/es/icon_class.g4tx"
sprite = "gtxt_class26"
ops = [{ op = "crop", box = [600, 48, 663, 113] }, { op = "alpha_from", image = "if_legendary_plus_mask" }]

[[recipe]]
name = "if_legendary_plus_default"
from = "if_legendary_plus"
ops = [{ op = "resize", size = [126, 130] }]

# gtxt_class28 of the default file: full width, «+» at x 567 (680-wide space)
[[recipe]]
name = "if_legendary_battle_plus_default_src"
game = "#/menu/200_icon/06_icon_class/icon_class.g4tx"
sprite = "gtxt_class28"
ops = [{ op = "resize", size = [1360, 304] }]

[[recipe]]
name = "if_legendary_battle_plus_default_title"
canvas = [1360, 304]
ops = [
  { op = "paste", image = "if_legendary_battle_plus_default_src", at = [0, 0] },
  { op = "hue", turns = -0.17 },
  { op = "paste", image = "if_legendary_plus_default", at = [1134, 96] },
  { op = "resize", size = [809, 234] },
]

[[recipe]]
name = "if_legendary_battle_plus_default"
canvas = [1024, 320]
ops = [{ op = "paste", image = "if_legendary_battle_plus_default_title", at = [107, 27] }]

[[sprite]]
atlas = "#/menu/200_icon/06_icon_class/<LG>/icon_class.g4tx"
name = "if_legendary_battle_plus"
texture = "if_legendary_battle_plus_tex"
x = 0
y = 0
recipe = "if_legendary_battle_plus_default"
lang = ""

