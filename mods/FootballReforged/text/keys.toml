[ja.new]
option_duel_auras = "自由デュエルのオーラ"
option_duel_auras_help = "デュエルでは、オーラ（化身・トーテム・アームド・ミキシマックスなど）は相手の必殺技への応戦にならない。デュエルが一時停止してオーラが発動し、選択できる状態のままデュエルが続く。両チーム、CPUも対象。ゲームの再起動後に反映。"
option_technical_combo = "テクニカルコンボ"
option_technical_combo_help = "ゲームのテクニカルコンボ：必殺技でフォーカスバトルに勝つと次のシュートの威力が最大3段階上がり、必殺技のテンション消費が減ります。オフ：コンボはたまりません。ゲームの再起動後に反映されます。"
option_move_cooldown = "必殺技の再使用時間"
option_move_cooldown_help = "オン：必殺技はゲーム通り、再使用時間が終わるまで再び使えません。オフ：両チームとも、必殺技をすぐに再使用できます。テンションの消費はそのままで、オーラの再使用時間も残ります。すぐに適用されます。再使用待ちの必殺技は残り時間が終わるまで待ちます。"
mod_name = "Football Reforged"
mod_description = "試合の仕組みをモジュールで追加します。モジュールはModsでオン・オフできます：ゴールキーパーのバリア、フューロー、ホームスタジアム、プレッシング、アディショナルタイム、伝説のCPU。さらに、フットボール7、イナズマストリート、5対5の試合形式、スキルデュエル、フリーデュエルでのオーラ、試合チャレンジも加わります。"
ruleset_football_7 = "7人制サッカー（7対7）"
ruleset_friendly_5v5_no_tactics_or_referee = "5人制（必殺タクティクス・審判なし）"
ruleset_inazuma_street = "イナズマストリート（3対3、GK・審判なし）"
