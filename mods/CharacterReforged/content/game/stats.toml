schema = "VRFW.game/2"

# ------------------------------------------------------------------------------------------------ functions

# ------------------------------------------------------------------------------------------------ globals

[[VRFW.Global]]
name = "character_reforged_move_speed_base"
game = "Chara.MoveSpeedBase"

[[VRFW.State]]
key = "CharacterReforged.stats.ready"

[[VRFW.State]]
key = "CharacterReforged.stats.post99"

[[VRFW.State]]
key = "CharacterReforged.stats.speed_on"

[[VRFW.State]]
key = "CharacterReforged.stats.speed_npc"

[[VRFW.State]]
key = "CharacterReforged.stats.speed_pct"       # the band in percent (0..20; [stats] agility_speed)

[[VRFW.State]]
key = "CharacterReforged.stats.speed_base"      # the address of charaMoveSpeedBase

# The Lv 99 value of a stored value: layout v1 = itself, v2 = round(v / factor) (0..9999)
[[VRFW.Formula]]
name = "CharacterReforged.V99"
parameters = ["P", "I"]
value = "if(lookup(CharacterReforged.StatRow:v2, P) == 1, clamp(round(lookup(CharacterReforged.StatVal, P, I) / lookup(CharacterReforged.StatRow:f, P)), 0, 9999), lookup(CharacterReforged.StatVal, P, I))"

[[VRFW.Formula]]
name = "CharacterReforged.Post99"
parameters = ["G", "V", "L"]
value = "if(V <= 0, V, let(top, lookup(CharacterReforged.StatConst:max, 1), let(u, (L - 99) / (top - 99), let(vmax, round(V * (1 + G * lookup(CharacterReforged.StatConst:s, 1))), clamp(round(V + (vmax - V) * if(u > 1, u, 1 - pow(1 - u, lookup(CharacterReforged.StatConst:shape, 1)))), 0, 9999)))))"

[[VRFW.Formula]]
name = "CharacterReforged.StatAt"
parameters = ["P", "I", "L"]
value = """
let(v, lookup(CharacterReforged.StatVal, P, I),
let(v99, CharacterReforged.V99(P, I),
let(lv1, round(v99 * lookup(CharacterReforged.StatRow:ratio, P)),
let(base, round(lv1 + (v99 - lv1) * pow(clamp((max(L, 1) - 1) / 98, 0, 1), lookup(CharacterReforged.StatRow:p, P))),
let(cap, lookup(CharacterReforged.StatConst:max, 1),
let(at, if(lookup(CharacterReforged.StatRow:v2, P) == 1,
           if((L <= 99) + (lookup(CharacterReforged.StatConst:post, 1) == 0), if(L <= 99, base, v99),
              clamp(round(v99 + (v99 + (v - v99) * lookup(CharacterReforged.StatConst:s, 1) - v99) * pow((L - 99) / (cap - 99), lookup(CharacterReforged.StatRow:q, P))), 0, 9999)),
           if((L > 99) * lookup(CharacterReforged.StatConst:post, 1), CharacterReforged.Post99(lookup(CharacterReforged.StatRow:gain, P), v99, L), base)),
let(m, lookup(CharacterReforged.StatRow:m, P),
    if(m == 1, at, clamp(round(at * m), 0, 9999)))))))))
"""

[[VRFW.Formula]]
name = "CharacterReforged.Specialty"
parameters = ["P", "L"]
value = """
let(kc, CharacterReforged.StatAt(P, 0, L), let(cr, CharacterReforged.StatAt(P, 1, L), let(tc, CharacterReforged.StatAt(P, 2, L), let(pr, CharacterReforged.StatAt(P, 3, L),
let(ps, CharacterReforged.StatAt(P, 4, L), let(it, CharacterReforged.StatAt(P, 5, L), let(ag, CharacterReforged.StatAt(P, 6, L),
let(third, f32(0.3333333432674408),
let(a, f32((it + tc + cr) * third), let(b, f32((it + ps + pr) * third), let(c, f32((cr + kc) * 0.5), let(d, f32((ag + ps) * 0.5),
let(b1, max(a, 0), let(i1, if(b > b1, 1, 0), let(b2, max(b, b1), let(i2, if(c > b2, 2, i1), let(b3, max(c, b2),
let(i3, if(d > b3, 3, i2),
    if(i3 == 0, 3, if(i3 == 1, 4, if(i3 == 2, 2, 1)))))))))))))))))))))
"""

[[VRFW.Formula]]
name = "CharacterReforged.SpeedOf"
parameters = ["P"]
value = "let(b, f32(clamp(int(state(CharacterReforged.stats.speed_pct)), 0, 20) / 100), let(pc, f32(min(lookup(CharacterReforged.StatRow:agi, P), 1000) / 1000), f32([state(CharacterReforged.stats.speed_base)]:f32 * f32(1 + f32(b * f32(2 * pc - 1))))))"

# ------------------------------------------------------------------------------------------------ hooks

[[VRFW.Hook]]
name = "CharacterReforged.CharaParamStatus"
game = "Chara.GetParamStatus"
kind = "function"

# a card without values above Lv 99 while the cap is raised: the game computes Lv 99 (grown after it)
[[VRFW.Hook.answer]]
phase = "pre"
when = [{ state = "CharacterReforged.stats.post99", equals = 1 }, { value = ["xform_param([args[4] + 0x24]:u32, [args[3]]:u32)"], not_in_table = "CharacterReforged.StatRow" }]
value = "min(args[2], 99)"
write = "args[2]"

# a card with per-character values: out[i] = floor(f32(curve × opts->mult[i]))
[[VRFW.Hook.answer]]
each = { count = "8", max = 8 }
when = { value = ["xform_param([args[4] + 0x24]:u32, [args[3]]:u32)"], in_table = "CharacterReforged.StatRow" }
value = "floor(f32(CharacterReforged.StatAt(xform_param([args[4] + 0x24]:u32, [args[3]]:u32), i, args[2]) * [args[4] + i * 4]:f32))"
write = "[args[1] + i * 4]:i32"

[[VRFW.Hook.answer]]
each = { count = "7", max = 7 }
when = [{ state = "CharacterReforged.stats.post99", equals = 1 }, { value = ["xform_param([args[4] + 0x24]:u32, [args[3]]:u32)"], not_in_table = "CharacterReforged.StatRow" }]
value = "let(L, int(mask(regs.rdx, 0xFFFF)), if(L > 99, CharacterReforged.Post99(lookup(CharacterReforged.StatConst:gain, 1), [args[1] + i * 4]:i32, L), [args[1] + i * 4]:i32))"
write = "[args[1] + i * 4]:i32"

# u8 CharaParam_GetSpecialtyType(const u32* paramId, u16 level) 0xE7BE20
[[VRFW.Hook]]
name = "CharacterReforged.SpecialtyType"
game = "Chara.GetSpecialtyType"
kind = "function"

# a card with per-character values: the engine's scores on the curve values (the game's code does not run)
[[VRFW.Hook.answer]]
phase = "pre"
when = { value = ["[args[1]]:u32"], in_table = "CharacterReforged.StatRow" }
value = "CharacterReforged.Specialty([args[1]]:u32, args[2])"
write = "ret"

# a card without values above Lv 99: the type is a ratio of the stats, the Lv 99 answer holds
[[VRFW.Hook.answer]]
phase = "pre"
when = [{ state = "CharacterReforged.stats.post99", equals = 1 }, { value = ["[args[1]]:u32"], not_in_table = "CharacterReforged.StatRow" }]
value = "min(args[2], 99)"
write = "args[2]"

# ------------------------------------------------------------------------------------------------ the match copy

# the run speed from the Agilidad percentile (after the other mods' modifiers: trained points, coaches; orders < 100)
[[VRFW.MatchStat]]
name = "CharacterReforged.AgilitySpeed"
order = 100
when = [{ state = "CharacterReforged.stats.speed_on", equals = 1 }, { value = ["args[3]"], in_table = "CharacterReforged.StatRow" }]
speed = "CharacterReforged.SpeedOf(args[3])"

[[VRFW.MatchStat]]
name = "CharacterReforged.AgilitySpeedNpc"
order = 100
owned = false
npc = true
when = [{ state = "CharacterReforged.stats.speed_on", equals = 1 }, { state = "CharacterReforged.stats.speed_npc", equals = 1 }, { value = ["args[3]"], in_table = "CharacterReforged.StatRow" }]
speed = "CharacterReforged.SpeedOf(args[3])"

# ------------------------------------------------------------------------------------------------ commands

[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_CHARA_STAT"
handler = "CharacterReforged.CharaStat"
needs = ["Board.FindCharaRecord", "Chara.HumanGetLevel", "character_reforged_chara_containers"]
