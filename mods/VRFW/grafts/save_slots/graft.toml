# Save slots (research/mods/_aside/InazumaFantasy/_tools/slot_build.py): the slot screen before EMPEZAR
# (include/menu/title_menu_inc: one patch in StartItemSelectMenuCoroutine + vrfw_title_slot_block) and the new menu
# vrfw_save_slot_menu (src/vrfw_save_slot_menu.lua; the legacy build padded it to the installed size, not needed here).
# A VRFW base service: built into mod VRFW (`menu_assemble.py build --mod
# VRFW`, packed by framework_pack.py under save\lua\ + the screen script menus\scripts\); the slot commands
# (CMND_VRFW_SLOT_*; 1.x CMND_VRFW_SLOT_* / GET_SLOT / SET_SLOT as aliases) are answered by VRFW.dll's save part (save_engine 1.3.0),
# so no ModLoader module is named here. Generic: the reserved 4th card shows a slot a mod reserved (its content from
# the owner's VRFW.save_slots_reserved provider); other mods extend the screen through VRFW.save_slots.HOOKS / VRFW.save_slots.API (a Lua patch of the
# stem vrfw_save_slot_menu, e.g. a mod's reserved-slot card). The player slots and their pages come from the layout
# ([save.slots] count); the story-complete start's question is the screen's own (graft story_start applies it).
name = "save_slots"
order = 100
mod = "VRFW"
requires = []
conflicts = []
wraps = []
description = "Save slots: slot screen before EMPEZAR"

[[files]]
stem = "title_menu_inc"

  [[files.ops]]
  type = "insert_before"
  point = "title_menu_inc.StartItemSelectMenuCoroutine.SaveSlots"
  text = '''
  if not VRFW.save_slots.before_game_start(n6) then -- EVT save slots: slot screen; false = cancelled, stay on EMPEZAR
    l2 = nil
    return
  end
'''
  crc = "none"

  [[files.ops]]
  type = "append_block"
  source = "save_slots_inc_1.lua"

[[files]]
path = "common/script/lua/menu/vrfw_save_slot_menu.lua.bin"

  [[files.ops]]
  type = "new_file"
  source = "vrfw_save_slot_menu.lua"
  vars = { "@MENU_FILE@" = "vrfw_save_slot_menu" }   # --@lib vrfw_menu_kit.lua#StartCo

# title_menu_2 ships as lua_patches; mm_entry's patch redefines OnInit after the chunk, which drops the include's
# __newindex OnInit wrapper (no COMMIT: the switch fence stayed on, "Guardando..." forever). The commit is a handler of the framework's title_menu_2 host: a `before`
# handler of OnInit with priority -1000, so COMMIT runs before every other handler and before the OnInit of the
# merge-path patches under the host.
[[hooks]]
stem = "title_menu_2"
source = "save_slots_title2.lua"

# The slot screen's fingerprint in the framework's own Lua root: the screen's VM is identified with any set of mods
# (not only through another mod's patch of the screen). The file marks the VM; OnInit logs how it was identified.
[[hooks]]
stem = "vrfw_save_slot_menu"
source = "save_slots_screen_ident.lua"
require = ["vrfw_save_slots_on_sub_window"]
