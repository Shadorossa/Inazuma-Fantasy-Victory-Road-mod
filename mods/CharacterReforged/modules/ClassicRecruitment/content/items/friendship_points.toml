schema = "VRFW.item/2"
default_lang = "en"

[[edit]]
target = "tk_hr000008"
max_stack = 999999                          # retail 99999
  [edit.text.es]
  name = "Puntos de amistad"
  [edit.text.en]
  name = "Friendship Points"
  [edit.text.fr]
  name = "Points d'amitié"
  [edit.text.de]
  name = "Freundschaftspunkte"
  [edit.text.it]
  name = "Punti Carisma"
  [edit.text.pt]
  name = "Pontos de amizade"
  [edit.text.ja]
  name = "友情ポイント"
  [edit.text.zh_hans]
  name = "友情点数"
  [edit.text.zh_hant]
  name = "友情點數"

# a goal's drop of them is held and paid at the end of the match
[VRFW.EndOfMatchRewards]
HeldDrops = ["tk_hr000008"]

# every match pays them at its end (config.toml [match_drops.friendship] overrides these defaults)
[[VRFW.MatchDropExtra]]
Item = "tk_hr000008"
Win = 12
Draw = 6
Loss = 0
PerGoal = 2
PerGoalMargin = 2                           # a win by 3 goals: +6
MarginMax = 5                               # no more than +10 (no farming of weak rivals)
Config = "match_drops.friendship"
  [VRFW.MatchDropExtra.Difficulty]          # the multiplier by the played difficulty (declared Ids)
  Cronica = 1.0
  RouteOpen = 1.25
  RareItems = 1.5
  Heroica = 1.75
  HeroicaPlus = 2.0
  Legendaria = 2.5
  Class1 = 1.0                              # free match Lv 50
  Class2 = 1.5                              # Lv 99
  Class3 = 2.0
  Class4 = 2.5                              # Lv 200
