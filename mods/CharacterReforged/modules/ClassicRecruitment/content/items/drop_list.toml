schema = "VRFW.item/2"
if_mod = "ClassicRecruitment.classic_recruitment"    # The row of options.toml: off = this file is not read.
# No normal player spirit from any source (match drops, rewards, shops, packs); a reserved slot keeps the game's.
[VRFW.DropList]
HideTabs = [1, 2, 3, 4]

[VRFW.DropList.Spirits]
ExcludeAll = true
AllSources = true
Rarities = [0, 1, 2, 3, 4]
ExceptReservedSlots = true

# The pulls of the Players Universe screen are given; the option players_universe off closes every way into that screen.
[[VRFW.DropList.Spirits.AllowGrant]]
Menus = ["players_universe_menu"]
