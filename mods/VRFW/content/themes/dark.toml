[fonts]
enabled = true
# Colour token of the style name -> palette key (k = grey ink, b = blue ink; w white stays).
# A style name or a token of its own wins over the colour letter: `fs_flavor_balloon01` is the tooltip text on the dark detail
# balloons, `fs_30_y_cc_2d0_001_sclw` the team screen's stadium / formation values, `fs_32_y_cc_2d1_001` the career page switch's shown label, `g` the mint select-button numbers.
map = { k = "text", b = "accent_hi", g = "accent_hi", balloon01 = "text", fs_30_y_cc_2d0_001_sclw = "accent_hi", fs_32_y_cc_2d1_001 = "accent_hi" }
keep_styles = []
# Text over light art (speech balloons) keeps its retail ink.
keep_tokens = ["balloon", "talk01", "sentence02"]
# Every other style stays readable on the dark rows (WCAG contrast against `card`).
min_contrast = 4.5
contrast_against = "card"
# below that contrast: blue / teal value text (names, prices, counters, tab labels) -> the gold accent text
# (accent_hi, #DDB46E in amber); grey labels -> near-white `text`
accent_text = "accent_hi"
accent_text_hue = [90.0, 260.0]
neutral_text = "text"

# The game's bitmap numbers are tinted by the number config table (one sprite prefix serves several tints, `tint` picks
# one): the formation panel's big digits (steel blue) and the match intro's team level (white) take the accent text colour.
[numbers]
file = "data/common/menu/config/menu_graphic_number_config_"
[[numbers.rule]]
match = "num_tech01_*"
tint = [64, 115, 156]
color = "accent_hi"
[[numbers.rule]]
match = "num_lv_vs01_*"
tint = [255, 255, 255]
color = "accent_hi"

[fade]
# Colour of the game's white fade transitions while the theme is served (palette / accent key). Only fades that move
# (content/game/theme.toml): a layer the game sets to rest at white keeps its colour.
white = "bg"
