id = "StrikersTitles"
# name / description: the English fallback; the screen shows the text keys mod_name / mod_description in the game's language (text\keys.toml)
# since 1.2.0 (1.1.0, / "Strikers Telops" before): the
# same name in every language.
name = "Strikers Titles"
version = "0.2.4"
author = "Fantasy Team"
author_steam = "76561199013321372"
# (mod.toml has no credits key: the credit goes in the description)
description = "Special-move name banners: the Spanish ones of the Inazuma Eleven GO Strikers 2013 fan translation on the game's own techniques and keshin, plus banners for techniques added by mods (Spanish, Japanese and English). Strikers titles by @IEGOStrikersESP (https://x.com/IEGOStrikersESP), @ShinAngelico, @adridebolsillo."
priority = 0
tags = ["Visual"]
updated = "2026-11-03"
# This mod's own names (TOML keys [[StrikersTitles.X]], Lua StrikersTitles.X, any later text, command or key); never VRFW.
prefix = "StrikersTitles"
folder = "StrikersTitles"
# Published with the permission of the three credited accounts (README.md). The patch's own pictures are
# generated on the author's PC and stay out of git.
# Data only, standard mod layout (docs/framework/mod-layout.md, 1.2.0): content\telops\es\<id>.png + ONE list
# content\telops\es\strikers_telops.toml (telop type, schema VRFW.telop_list/2: [defaults] = the layout they
# share, one [[telop]] per telop), all GENERATED by research/scripts/strikers_telops_to_mod.py on the author's PC, never
# committed (README.md); and content\telops\<lang>\inazuma_fantasy\<id>.png + .toml (es / ja / en, VRFW.telop/2,
# the game's layout), Inazuma Fantasy's own banners, tracked by git, moved here. text\keys.toml: the mod's
# name and description. Works on the retail moves, without Inazuma Fantasy. `requires` also makes it load after the
# framework.
requires = ["VRFW>=0.2.4"]
conflicts = []

# (Opciones de mods) offers these languages while this mod is on (docs/framework/content-languages.md)
[content.languages]
telops = ["es", "ja", "en"]

# UI only: left out of the mod set two players must share in a private online room, and of
# (VR-Framework net service, docs/game/modes/bb-online-ownnet.md §5)
[VRFW.Mod]
AffectsMatch = false
