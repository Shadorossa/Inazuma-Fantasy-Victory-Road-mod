# BetterUI › its rows in Opciones › «Opciones de mods» and on the Mods screen's «Ajustes» (format:, parent rows §3.8).
# Values: <data dir>\mod_options\BetterUI.json. Every other BetterUI feature is always on; only the match readouts
# can be hidden. One group row «BetterUI modules» and its child rows; Desactivado on the group = both readouts hidden
# (their own values are kept, shown greyed). Read live (once per readout): no
# restart.

# «BetterUI modules»: the group (only shown while one of its rows is on the tab)
[[option]]
id = "modules"                                # row key BetterUI.modules
type = "toggle"
label = "modules"                             # text\keys.toml, 9 languages
help = "modules_help"
default = 1
group = true
order = 410

# «Duel counter»: during the cut-ins of a special-move or power-action duel, each player's total (scripts\duel_readout.lua)
[[option]]
id = "duel_readout"                           # row key BetterUI.duel_readout
type = "toggle"
label = "duel_readout"
help = "duel_readout_help"
default = 1
parent = "BetterUI.modules"
order = 100

# «AT / PP counter»: the game's own shot readout, total AT of the shot vs the keeper's PP (graft clean_hud_shot_readout)
[[option]]
id = "shot_readout"                           # row key BetterUI.shot_readout
type = "toggle"
label = "shot_readout"
help = "shot_readout_help"
default = 1
parent = "BetterUI.modules"
order = 200
