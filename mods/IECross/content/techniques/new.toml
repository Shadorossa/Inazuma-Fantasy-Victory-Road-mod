  description = "邪気を帯びた衝撃波に　悪魔の顔が見える。\n身の毛もよだつ　恐怖の回し蹴り。"
  [technique.text.en]
  name = "Diabolical Cut (Halloween)"
  description = "Execute a hair-raising roundhouse kick that sends\nout a diabolical shockwave."
  [technique.text.es]
  name = "Corte diabólico (Halloween)"
  description = "Una onda de choque oscura con rostro demoníaco.\nEspeluznante patada giratoria."
  [technique.text.fr]
  name = "Barrière endiablée (Halloween)"
  description = "Terrifiant coup de pied circulaire formant une onde\nde choc maléfique imprégnée du visage d'un démon."
  [technique.text.de]
  name = "Gruselfratze (Halloween)"
  description = "Eine fürchterliche Schockwelle, die das Gesicht\neines Dämons trägt. Dieser Drehtritt lässt alle\nHaare zu Berge stehen."
  [technique.text.it]
  name = "Calcio delle Tenebre (Halloween)"
  description = "Un calcio rotante che fa venire i brividi.\nL'onda d'urto intrisa di malvagità\nrivela un volto demoniaco."
  [technique.text.pt]
  name = "Corte Diabólico (Dia das Bruxas)"
