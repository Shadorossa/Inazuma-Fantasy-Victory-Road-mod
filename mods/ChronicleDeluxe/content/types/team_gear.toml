# Declaration schema of ChronicleDeluxe.team_gear/1 (content\team_gear): fields read from the records the mods ship. `vrfw check` validates the files with it and the ModManager draws their forms from it.
# A mod's items a rival team drops with its own boots (read by research/mods/ChronicleDeluxe/_tools/chronicle_deluxe_drops_build.py).
schema = "VRFW.decl_schema/1"
kind = "ChronicleDeluxe.team_gear/1"
folder = "content/team_gear"
label = "Team gear"
label_es = "Equipo de los equipos"

[entry.Gear]
entry_table = "gear"
item = { type = "string", ref = "item", required = true }
boots = { type = "string", required = true }
