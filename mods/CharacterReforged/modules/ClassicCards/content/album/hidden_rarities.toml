schema = "BetterQoL.album/1"
# No More Rarities › BetterQoL's «Álbum de jugadores»: the special cards whose rarity this
# module's config removes are not listed (rows, «Especiales», counts). The values are those of config.toml
# [removed_rarities] tiers; Ídolo = rarities 5-7, Diamante = 8. The basic rarities (0-4) are the album's normal cards.
# Read only when BetterQoL is enabled.

[[hide_rarities]]
config = "removed_rarities.tiers"
when = [
  { values = ["basic_idol", "all"], rarities = [5, 6, 7] },    # Ídolo
  { values = ["basic_diamond", "all"], rarities = [8] },       # Diamante
]
