schema = "VRFW.technique/3"
# A move first shipped by a former mod merged into Hissatsu Revamp, kept as that mod built it: a retail move
# cloned (`base`: its skill_config row, voice, banner margins, manual, event env row) with the download's numbers; its
# event is the base's event renamed with a recoloured effect object (assets\event\ + content\base_tables\event\,
# event_cfg\ + content\models\effects\). Fixed key (skill id = crc32(key), the download's id: a save that learned the
# move keeps it). Names and descriptions: text\rows\skill_text.toml (the download's text ids, pinned below).

[[technique]]
name = "abyss_strike"            # Golpe del abismo
key = "whs90208"
base = "whs02080"                # Golpe cataclismo (mountain shot, 70-440, 70 TP)
order = 1
name_text = 0x6B5E606A
desc_text = 0x3EC8B238
event = "ev60_90208"             # ev60_02080 renamed, effect object ev60902080
power_min = 100
power_max = 640
tp = 100
element = "void"
# colour row 10 (content\base_tables\gamedata\skill\skill_config.toml): the ball auras rw90208a / b / c
cells = { colorIdx = 10 }
