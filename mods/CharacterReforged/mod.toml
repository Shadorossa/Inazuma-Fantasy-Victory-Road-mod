#                                slot accepts; other mods veto); content\skill_set\*.toml its data;
#                                content\game\skill_set.toml CMND_CHARACTERREFORGED_CAN_PLACE / _PLACE_RULES (other
#                                mods' place rules as data: [CharacterReforged.PlaceRules.<name>])
#   scripts\mix_slots.lua        the new set over the retail data: the per-save MIX slot store (blob hiper_slots.json,
#                                imported once from Inazuma Fantasy), native tables MixSlot / MovesetDefault, the
#                                overflow log, the branch rule (branch 1 while the set is on); THE projection
#                                CharacterReforged.ProjectSkillSet (read only: list auras shown in the aura / mix slot,
