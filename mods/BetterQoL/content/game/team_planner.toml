schema = "VRFW.game/1"

# Team planner: ghost cards in the dock's squads (graft betterqol_team_planner; logic scripts\team_planner.lua).

# () -> on (bool: the planner works in this slot), ghost alpha, display rarity
[[VRFW.Command]]
name = "CMND_BETTERQOL_TP_INFO"
handler = "BetterQoL.TeamPlanner.Info"

# (set, type) -> "slot:param,…" of the squad on the mounted team-bank page, display rarity
[[VRFW.Command]]
name = "CMND_BETTERQOL_TP_LIST"
handler = "BetterQoL.TeamPlanner.List"

# (set, type, slot, param) -> ok; param 0 removes the slot's plan
[[VRFW.Command]]
name = "CMND_BETTERQOL_TP_SET"
handler = "BetterQoL.TeamPlanner.Set"

[[VRFW.Command]]
name = "CMND_BETTERQOL_TP_MOVE"
handler = "BetterQoL.TeamPlanner.Move"

# (param) -> "h,h,…" the owned copies of that card the rule accepts, best first
[[VRFW.Command]]
name = "CMND_BETTERQOL_TP_CANDIDATES"
handler = "BetterQoL.TeamPlanner.Candidates"

# (set, type, slot, handle) -> ok: the menu placed a real copy in the ghost's slot (the plan is removed)
[[VRFW.Command]]
name = "CMND_BETTERQOL_TP_ASSIGNED"
handler = "BetterQoL.TeamPlanner.Assigned"

# () -> "set:type,…" the squads of the mounted page that hold plans
[[VRFW.Command]]
name = "CMND_BETTERQOL_TP_PENDING"
handler = "BetterQoL.TeamPlanner.Pending"

# (on) -> on: the bank opened by «Planificar equipo» also lists every character not owned (their number); off: 0
[[VRFW.Command]]
name = "CMND_BETTERQOL_TP_BANK_PLAN"
handler = "BetterQoL.TeamPlanner.BankPlan"

# (row) -> the card param of that row of the plan bank's list when it is a character not owned, else 0
[[VRFW.Command]]
name = "CMND_BETTERQOL_TP_BANK_ENTRY"
handler = "BetterQoL.TeamPlanner.BankEntry"

# ---------------------------------------------------------------- the plan bank's list

# 1 while the bank opened by «Planificar equipo» is open
[[VRFW.State]]
key = "BetterQoL.tp_bank_plan"

[[VRFW.Function]]
name = "BetterQoL.TpBankFilter"
game = "Card.BankFilter"

[[VRFW.Hook]]
name = "BetterQoL.TpBankSort"
game = "Card.BankListSort"
kind = "function"
arguments = ["ptr", "u32", "u8"]
pre_when = [{ state = "BetterQoL.tp_bank_plan", equals = 1 }]
post_when = [{ state = "BetterQoL.tp_bank_plan", equals = 1 }]
