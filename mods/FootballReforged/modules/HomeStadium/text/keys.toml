schema = "VRFW.text_key/1"
# Texts of «Home Stadium» (mod HomeStadium, a module of Football Reforged) (format:): the
# «Mods» screen's name and description and the team dock row (menu_text, id crc32("HomeStadium.<name>"): row,
# row_help, none, select_hint (the selector's hint line) are read by assets\lua\soccer_team_dock_menu\300_home_stadium.lua). A language missing here falls back
# to English. The help line fits the help bar on one line (about 75 characters).
default_lang = "en"

[en.new]
mod_name = "Home Stadium"
mod_description = "Each of your teams gets a home stadium. Pick it in Team Dock › «Home stadium» among the stadiums you own (bought or unlocked); the choice is saved for that team. The team plays its home friendlies there when the match has no stadium of its own. Competition, Chronicle and Battle Bay keep their own stadiums."
row = "Home stadium"
row_help = "Pick this team's home stadium among the stadiums you own."
none = "No home stadium"
select_hint = "<CMD_ENTER> Accept      <CMD_BACK> Back"

[es.new]
mod_name = "Estadio local"
mod_description = "Cada uno de tus equipos tiene un estadio local. Elígelo en Plantilla de equipo › «Estadio local» entre los estadios que tienes (comprados o desbloqueados); la elección se guarda para ese equipo. El equipo juega allí sus amistosos en casa cuando el partido no tiene estadio propio. Competición, Crónica y Bahía Batalla mantienen sus estadios."
row = "Estadio local"
row_help = "Elige el estadio local de este equipo entre los estadios que tienes."
none = "Sin estadio local"
select_hint = "<CMD_ENTER> Aceptar      <CMD_BACK> Volver"

[fr.new]
mod_name = "Stade à domicile"
mod_description = "Chacune de tes équipes a un stade à domicile. Choisis-le dans Effectif › « Stade à domicile » parmi les stades que tu possèdes (achetés ou débloqués) ; le choix est enregistré pour cette équipe. L'équipe y joue ses matchs amicaux à domicile quand le match n'a pas de stade propre. Compétition, Chronique et Battle Bay gardent leurs stades."
row = "Stade à domicile"
row_help = "Choisis le stade à domicile de cette équipe parmi tes stades."
none = "Aucun stade à domicile"
select_hint = "<CMD_ENTER> Valider      <CMD_BACK> Retour"

[de.new]
mod_name = "Heimstadion"
mod_description = "Jedes deiner Teams bekommt ein Heimstadion. Wähle es unter Teamaufstellung › „Heimstadion“ aus den Stadien, die du besitzt (gekauft oder freigeschaltet); die Wahl wird für dieses Team gespeichert. Das Team spielt dort seine Heim-Freundschaftsspiele, wenn das Spiel kein eigenes Stadion hat. Wettbewerb, Chronik und Battle Bay behalten ihre Stadien."
row = "Heimstadion"
row_help = "Wähle das Heimstadion dieses Teams aus deinen Stadien."
none = "Kein Heimstadion"
select_hint = "<CMD_ENTER> Bestätigen      <CMD_BACK> Zurück"

[it.new]
mod_name = "Stadio di casa"
mod_description = "Ognuna delle tue squadre ha uno stadio di casa. Sceglilo in Rosa della squadra › «Stadio di casa» tra gli stadi che possiedi (acquistati o sbloccati); la scelta viene salvata per quella squadra. La squadra vi gioca le amichevoli in casa quando la partita non ha uno stadio proprio. Competizione, Cronaca e Battle Bay mantengono i loro stadi."
row = "Stadio di casa"
row_help = "Scegli lo stadio di casa di questa squadra tra quelli che possiedi."
none = "Nessuno stadio di casa"
select_hint = "<CMD_ENTER> Conferma      <CMD_BACK> Indietro"

[pt.new]
mod_name = "Estádio da casa"
mod_description = "Cada uma das tuas equipas tem um estádio da casa. Escolhe-o em Plantel da equipa › «Estádio da casa» entre os estádios que tens (comprados ou desbloqueados); a escolha fica guardada para essa equipa. A equipa joga lá os seus amigáveis em casa quando o jogo não tem estádio próprio. Competição, Crónica e Battle Bay mantêm os seus estádios."
row = "Estádio da casa"
row_help = "Escolhe o estádio da casa desta equipa entre os estádios que tens."
none = "Sem estádio da casa"
select_hint = "<CMD_ENTER> Aceitar      <CMD_BACK> Voltar"

[ja.new]
mod_name = "ホームスタジアム"
mod_description = "チームごとにホームスタジアムを設定できる。チーム編成›「ホームスタジアム」で、所有しているスタジアム（購入・解放済み）から選ぶと、そのチームに保存される。スタジアムが決まっていない親善試合のホーム戦は、そのスタジアムで行う。大会・クロニクル・Battle Bayは従来どおりのスタジアムを使う。"
row = "ホームスタジアム"
row_help = "このチームのホームスタジアムを、所有するスタジアムから選ぶ。"
none = "ホームスタジアムなし"
select_hint = "<CMD_ENTER> 決定      <CMD_BACK> 戻る"

[zh_hans.new]
mod_name = "主场球场"
mod_description = "你的每支队伍都有一个主场球场。在队伍阵容›「主场球场」中，从你拥有的球场（已购买或已解锁）里选择，所选球场会为该队保存。没有指定球场的友谊赛，主场比赛会在那里进行。赛事、编年史和Battle Bay沿用各自的球场。"
row = "主场球场"
row_help = "从你拥有的球场中为这支队伍选择主场球场。"
none = "无主场球场"
select_hint = "<CMD_ENTER> 确定      <CMD_BACK> 返回"

[zh_hant.new]
mod_name = "主場球場"
mod_description = "你的每支隊伍都有一個主場球場。在隊伍陣容›「主場球場」中，從你擁有的球場（已購買或已解鎖）裡選擇，所選球場會為該隊儲存。沒有指定球場的友誼賽，主場比賽會在那裡進行。賽事、編年史和Battle Bay沿用各自的球場。"
row = "主場球場"
row_help = "從你擁有的球場中為這支隊伍選擇主場球場。"
none = "無主場球場"
select_hint = "<CMD_ENTER> 確定      <CMD_BACK> 返回"
