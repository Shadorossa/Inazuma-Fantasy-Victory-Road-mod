schema = "VRFW.game/2"

# The match equipment (scripts\lib\match_equipment.lua): the passive engine gives the rival players the equipment a mod
# declares for their match (content\match_equipment\*.toml). These are the two blocks the library reads.

# The match info block [[g_gameRoot]+Game.RootMatch] (MatchInfo.Game, MatchInfo.Difficulty).
[[VRFW.Global]]
name = "match_equipment_info"
base = "game_root"
chain = ["Game.RootMatch"]

# The play data block [[g_gameRoot]+Game.RootPlayData] (Game.PlayMode).
[[VRFW.Global]]
name = "match_equipment_play_data"
base = "game_root"
chain = ["Game.RootPlayData"]
