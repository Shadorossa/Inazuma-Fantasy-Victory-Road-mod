schema = "VRFW.game/2"

# Shop list refresh.

[[VRFW.Hook]]
name = "ShopList.Update"
kind = "vtable"
pattern = "48 8D 05 ?? ?? ?? ?? 48 89 07 33 D2 41 B8 00 1E 00 00 48 8D 8F E8 01 00 00 E8"
rip = { disp_off = 3, next_ip_off = 7 }
slot = 9
arguments = ["ptr"]
apply = "script"

# u64 UpdateItem(this, item layer, index, force): pre; force is cleared for an instance that still shows its row.
[[VRFW.Hook]]
name = "ShopList.UpdateItem"
kind = "vtable"
pattern = "48 8D 05 ?? ?? ?? ?? 48 89 07 33 D2 41 B8 00 1E 00 00 48 8D 8F E8 01 00 00 E8"
rip = { disp_off = 3, next_ip_off = 7 }
slot = 65
arguments = ["ptr", "ptr", "u32", "u8"]
returns = "u64"
apply = "script"
# only a forced refill reaches the script (an unforced one is left as the game does it)
pre_when = { value = "mask(args[4], 0xFF)", not = 0 }
