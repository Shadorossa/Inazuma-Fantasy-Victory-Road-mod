schema = "VRFW.game/2"
if_mod = "all_keshin_armed"                 # the part's switch (Mods options; docs/framework/merged-mods.md)
# Aura Reworked › All Keshin Armed › what scripts\keshin_moves.lua reads of the game for the rule «only the keshin's
# own move while it is out»: the soccer actors (the summon machine: the aura out, its state) and
# their units (the aura bits). Read only, nothing written.

# A soccer actor ([g_soccerActors] + index x 0x570): its handle, team and the summon machine (the aura out, state 2 =
# out)
[[VRFW.Struct]]
name = "KmActor"
size = 0x570
fields = { hdl = { at = 0x94, type = "u32" }, team = { at = 0xD0, type = "u8" }, summon_skill = { at = 0x358, type = "u32" }, summon_state = { at = 0x374, type = "u8" } }
