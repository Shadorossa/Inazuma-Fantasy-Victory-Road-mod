# The story-cleared provider of the VRFW mode engine: the global VRFW.story_provider (sp_provider.lua) in the VMs of the mode
# hosts, so `[mode.unlock] story_cleared` asks CMND_VRFW_STORY_START_GET (the VRFW's save part):
#   title_menu_2          title rows / lower buttons
#   soccer_top_menu       "Game Modes"
#   vrfw_save_slot_menu    the slot screen (the framework's own script: graft save_slots, new_file; order after it)
# A VRFW graft: the clause works with no other mod installed.
# Built by `menu_assemble.py build --mod VRFW` (framework_pack.py: the save part's Lua root). Only a definition:
# nothing runs at chunk load.
name = "story_provider"
mod = "VRFW"
order = 140
module = ""
requires = ["save_slots"]
conflicts = []
wraps = []
description = "Answers the mode engine's «story cleared» unlock clause from the saved story (CMND_VRFW_STORY_START_GET)"

[[files]]
path = "common/script/lua/menu/vrfw_save_slot_menu.lua.bin"

  [[files.ops]]
  type = "append_block"
  source = "sp_provider.lua"
  marker = "story_provider slot screen"

[[files]]
stem = "title_menu_2"

  [[files.ops]]
  type = "append_block"
  source = "sp_provider.lua"
  marker = "story_provider title"

[[files]]
stem = "soccer_top_menu"

  [[files.ops]]
  type = "append_block"
  source = "sp_provider.lua"
  marker = "story_provider modes hub"
