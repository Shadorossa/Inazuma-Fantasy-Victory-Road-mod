id = "PassivesSynergies"
# name / description: English fallback of the text keys mod_name / mod_description (text\keys.toml)
name = "Passives & Synergies"
icon = "#/menu/200_icon/16_icon_list_tab/icon_list_tab.g4tx:icon_list_tab_synergy01"
version = "0.3.0"
author = "Fantasy Team"
description = "Each player has one passive of his own that cannot be swapped (switch it off with the «Own passives» option), plus generic elemental passives that make his moves of that element stronger. Team synergies ask for a team or a group instead of named characters, and new synergies come with their own icons; the panel shows who is still missing."
priority = 0
tags = ["Characters", "Gameplay"]
updated = "2026-11-09"
prefix = "PassivesSynergies"
folder = "PassivesSynergies"
# Generators: research/mods/CharacterReforged/modules/PassivesSynergies/_tools/signature_passives_from_doc.py, research/mods/CharacterReforged/modules/PassivesSynergies/_tools/signature_passive_icons.py
requires = ["VRFW>=0.3.0", "CharacterReforged>=0.3.0"]
optional = ["BetterQoL", "HissatsuReforged", "IECross", "InazumaFantasy"]
conflicts = []
permissions = ["memory", "call", "command", "hook"]
# graft signature_passives_board: hook files on ability_learning_board_menu and equip_six_sense_menu
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"

[module]
of = "CharacterReforged"
order = 60

[exports]
functions = ["OwnPassiveOfCard"]

# content folders read only by its scripts
[layout]
script_folders = ["passive_blocks", "special_passives", "passive_config"]
