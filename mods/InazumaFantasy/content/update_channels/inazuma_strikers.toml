# Inazuma Strikers has its own update channel: a channel's mod list can never grow, so a new mod gets a new channel.
# Its index lives on its own branch of the same repository (docs/framework/auto-update.md, "A mod added later").
# The declaration stays in Inazuma Fantasy: a launcher accepts it only inside a folder its installed channel ships, and lists it before Inazuma Strikers is installed.
[[VRFW.UpdateChannel]]
id = "InazumaStrikers"
title = "Inazuma Strikers"
raw_url = "https://raw.githubusercontent.com/Shadorossa/Inazuma-Fantasy-Victory-Road-mod/"
index_ref = "inazuma-strikers"
public_key = "311b04b838548b75bb1c281dedd058d02215f3498a588a83022d245f4165691f"
baseline = "inazuma_strikers_baseline.signed"
loader = false
mods = [
    "InazumaStrikers",
]
