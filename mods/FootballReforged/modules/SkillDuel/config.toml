# Skill Duel: its settings (read by scripts/skill_duel.lua; restart the game after a change).

[skill_duel]
# THE DEFENDER'S REACH: how far his hand tip is from his centre (metres, arms at rest; a side-step stretches the arm
# on that side, as in the game). The game sets it from DF / AT (1.98 m for the weakest defender, 2.51 m at DF = AT,
# 4.37 m for the strongest). Here it is placed in this band instead:
#   reach_min_m / reach_max_m        the weakest / strongest defender's reach
#   hand_scale_min / hand_scale_max  his hand size (1 = the model's hand; the game's is 1.1 to 1.4)
# The hand alone is 1.8 m x the hand size, so reach_min_m below that gives the hand alone.
reach_min_m = 1.8
reach_max_m = 3.6
hand_scale_min = 1.0
hand_scale_max = 1.4
# HOW MUCH THE STATS MOVE IT: 0 = every duel at the middle of the band (2.7 m, hand 1.2), 1 = the whole band.
# 1 (the default): DF / AT 1/3 or less 1.80 m (hand 1.00), 1/2 2.03 m (1.05), DF = AT 2.70 m (1.20), 1.5 3.15 m (1.30),
# 2 or more 3.60 m (1.40). Past those two ratios the game's curve is clamped: a bigger gap changes nothing.
# For more than this, widen the band above around 2.7 m / 1.2, so an even duel stays the same.
stat_weight = 1.0

# THE CONTACT: when the attacker's path crosses the defender's body, arm or hand (he read the side), the defender
# wins. A stronger attacker may slip through: contact_slip_per_point % per point of AT - DF, at most
# contact_slip_max_percent % (never when DF >= AT). 0 = a contact never lets the attacker through.
# Past the hand the attacker wins, as in the game. A special move against a special move keeps the game's power duel.
contact_slip_per_point = 0.2
contact_slip_max_percent = 0

# true: one loader.log line per new DF / AT pair (the reach the duel gets) and per duel result the contact rule changes.
log = true
