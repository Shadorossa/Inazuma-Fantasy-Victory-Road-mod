schema = "VRFW.editor/1"
# Names and descriptions of this mod's config.toml settings, shown in ModManager > Parametros del juego. Read only by ModManager.

[[Shape]]
Id = "settings"
For = "config"
  [[Shape.Field]]
  Key = "skill_duel"
  Type = "table"
  Label = { es = "Duelo de técnicas", en = "Skill duel" }
  Help = { es = "Alcance del defensa y reglas de contacto en los duelos de técnica.", en = "The defender's reach and contact rules in technique duels." }
  [[Shape.Field]]
  Key = "skill_duel.reach_min_m"
  Type = "float"
  Label = { es = "Alcance mínimo (m)", en = "Minimum reach (m)" }
  Help = { es = "Alcance de la mano del defensa más débil, en metros.", en = "Hand reach of the weakest defender, in metres." }
  [[Shape.Field]]
  Key = "skill_duel.reach_max_m"
  Type = "float"
  Label = { es = "Alcance máximo (m)", en = "Maximum reach (m)" }
  Help = { es = "Alcance de la mano del defensa más fuerte, en metros.", en = "Hand reach of the strongest defender, in metres." }
  [[Shape.Field]]
  Key = "skill_duel.hand_scale_min"
  Type = "float"
  Label = { es = "Tamaño mínimo de la mano", en = "Minimum hand size" }
  Help = { es = "Escala de la mano del defensa más débil.", en = "Hand scale of the weakest defender." }
  [[Shape.Field]]
  Key = "skill_duel.hand_scale_max"
  Type = "float"
  Label = { es = "Tamaño máximo de la mano", en = "Maximum hand size" }
  Help = { es = "Escala de la mano del defensa más fuerte.", en = "Hand scale of the strongest defender." }
  [[Shape.Field]]
  Key = "skill_duel.stat_weight"
  Type = "float"
  Label = { es = "Peso de las estadísticas", en = "Stat weight" }
  Help = { es = "0 = todos los duelos a mitad de rango; 1 = las estadísticas usan todo el rango.", en = "0 = every duel at mid range; 1 = stats use the whole range." }
  [[Shape.Field]]
  Key = "skill_duel.contact_slip_per_point"
  Type = "float"
  Label = { es = "Escape por punto de ventaja", en = "Slip per advantage point" }
  Help = { es = "Probabilidad de que un atacante más fuerte se escape del contacto, por punto de diferencia.", en = "Chance a stronger attacker slips through contact, per point of difference." }
  [[Shape.Field]]
  Key = "skill_duel.contact_slip_max_percent"
  Type = "int"
  Label = { es = "Escape máximo (%)", en = "Maximum slip (%)" }
  Help = { es = "Tope de la probabilidad de escapar del contacto; 0 = el contacto siempre gana el defensa.", en = "Cap of the chance to slip through contact; 0 = contact always favours the defender." }
  [[Shape.Field]]
  Key = "skill_duel.log"
  Type = "bool"
  Label = { es = "Registrar duelos (depuración)", en = "Log duels (debug)" }
  Help = { es = "Escribe en el registro cada pareja y resultado de duelo (depuración).", en = "Writes each duel pair and result to the log (debug)." }
