    { from = "tres keshin", to = "tres Espíritus Guerreros" },
    { from = "cuatro keshin", to = "cuatro Espíritus Guerreros" },
    { from = "cinco keshin", to = "cinco Espíritus Guerreros" },
    { from = "demás keshin", to = "demás Espíritus Guerreros" },
    { from = "experto en keshin", to = "experto en Espíritus Guerreros" },
    { from = "expertos en keshin", to = "expertos en Espíritus Guerreros" },
    { from = "invocador de keshin", to = "invocador de Espíritus Guerreros" },
    { from = "invocadores de keshin", to = "invocadores de Espíritus Guerreros" },
    { from = "invocadora de keshin", to = "invocadora de Espíritus Guerreros" },
    { from = "batalla de keshin", to = "batalla de Espíritus Guerreros" },
    { from = "usan keshin", to = "usan Espíritus Guerreros" },
    { from = "partido con keshin", to = "partido con Espíritus Guerreros" },
    { from = "keshin usados", to = "Espíritus Guerreros usados" },
    { from = "tiro keshin", to = "tiro de Espíritu Guerrero" },
