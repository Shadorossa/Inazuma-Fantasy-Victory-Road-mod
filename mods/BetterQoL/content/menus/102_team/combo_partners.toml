# Combo partner picker (graft betterqol_combo_partners), declared over the player's own game files.
schema = "VRFW.menu/2"

[[object]]
name = "betterqol_cp_card"
from = "team00_01_chara_card_for_soccer"
free = true
remove_block = ["MenuCollisionSetting"]

# 1. the partner list on the retail skill board
[[patch]]
menu = "ability_learning_board_menu"
add_layer = { name = "betterqol_pc_listbg", object = "betterqol_pc_listbg", count = 1, align = ["left", "middle"], scale = 0.20000000298023224, after = "team13_18_unlimited_skill_telop", groups = [{ group = "ability_learning_board_menu", after = "team13_18_unlimited_skill_telop" }] }

[[patch]]
menu = "ability_learning_board_menu"
add_layer = { name = "betterqol_pc_list", object = "betterqol_pc_list", count = 1, align = ["left", "middle"], scale = 0.20000000298023224, after = "betterqol_pc_listbg", groups = [{ group = "ability_learning_board_menu", after = "betterqol_pc_listbg" }] }

[[patch]]
menu = "ability_learning_board_menu"
add_layer = { name = "betterqol_pc_row", object = "betterqol_pc_row", count = 6, align = ["left", "middle"], scale = 0.20000000298023224, after = "betterqol_pc_list", groups = [{ group = "ability_learning_board_menu", after = "betterqol_pc_list" }] }

[[patch]]
menu = "ability_learning_board_menu"
resources = [
    "#/menu/20_cmn/cmn02/cmn02_01/cmn02_01.g4tx",
    "#/menu/102_team/team08/team08_01/team08_01.g4tx",
    "#/menu/00_soccer/soccer11/soccer11_20/soccer11_20.g4tx",
    "#/menu/200_icon/15_icon_common/icon_common.g4tx",
]

# 2. the confirm popup's cards (icon_common: the «?» portrait of a random partner; icon_common2 <LG>: position badges)
[[patch]]
menu = "general_window"
add_layer = { name = "betterqol_cp_card", object = "betterqol_cp_card", count = 4, after = "team00_01_p5_avatar_unlock_basara_ring_for_chara_card", groups = [{ group = "general_window", flags = [0, 0, 0, 0, 1, 0], after = "team00_01_p5_avatar_unlock_basara_ring_for_chara_card" }] }

[[patch]]
menu = "general_window"
resources = [
    "#/menu/200_icon/15_icon_common/icon_common.g4tx",
    "#/menu/200_icon/15_icon_common2/<LG>/icon_common2.g4tx",
]
