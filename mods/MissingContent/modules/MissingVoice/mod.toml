id = "MissingVoice"
# name / description: the English fallback; the screen shows the text keys mod_name / mod_description in the game's language (text\keys.toml)
name = "Missing Voice"
version = "0.2.4"
author = "Fantasy Team"
author_steam = "76561199013321372"
description = "Japanese voice lines for special moves whose user is silent in the game, taken from that same player in Inazuma Eleven GO Strikers 2013. Personal use only: never released."
priority = 0
tags = ["Audio"]
updated = "2026-11-04"
# This mod's own names (TOML keys [[MissingContent.X]], Lua MissingContent.X, any later text, command or key); never VRFW.
prefix = "MissingContent"
folder = "MissingVoice"
# PERSONAL USE ONLY: Level-5 audio from the user's own disc, never published (research/scripts/release_exclude.py
# PERSONAL_MODS + L5_DERIVED["MissingVoice"]). Data only, standard mod layout (docs/framework/mod-layout.md):
# content\sounds\missing_voice.toml declares the cues ([[voice]], docs/framework/types/sound.md); the WAVs of
# assets\sounds\voice\ja\ are GENERATED by research/scripts/missing_voice_build.py (_build.toml) on the author's PC and
# never committed. docs/game/mods/missing-voice.md: sources and coverage. VRFW 2.44 for the voice fill by age group.
requires = ["VRFW>=0.2.4", "MissingContent>=0.2.4"]
conflicts = []

# UI only: left out of the mod set two players must share in a private online room, and of
# (VR-Framework net service, docs/game/modes/bb-online-ownnet.md §5)
[VRFW.Mod]
AffectsMatch = false

# A MODULE of Missing Content: shown inside Missing Content's entry on the Mods screen; switching
# Missing Content off switches it off too. On by default. Its id, prefix, keys and saves are the ones
# it had as a mod of its own.
[module]
of = "MissingContent"
order = 100
