# Texts of Extra Openings (format of the text engine: docs/framework/types/text.md); new texts get the id
# crc32("ExtraOpenings.<name>"): the mod's name and description on the «Mods» screen and the label of its DS menu theme
# in the «Música del menú» row (content/sounds/sounds.toml [[VRFW.MenuMusic]] Text: menu_music_ie23, the same in every
# language). A language missing here falls back to English. The openings' titles (scene archive and «Opening» row) are
# the videos' own Title in content/scenes/gallery.toml.
schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Extra Openings"
mod_description = "More title openings: the Nintendo DS openings of Inazuma Eleven 2 and 3, remastered in HD and sung in the game's language where the DS games had it. Choose them in Mod options, row «Opening»; they play after the logos and in the title screen's loop, and both are also in the scene archive. Also the DS games' menu theme as menu music, in the row «Menu music»."
menu_music_ie23 = "Inazuma Eleven 2 / 3"
menu_music_tm_bus = "The Inazuma TM Bus"

[es.new]
mod_name = "Openings extra"
mod_description = "Más openings para el título: los openings de Nintendo DS de Inazuma Eleven 2 y 3, remasterizados en HD y cantados en el idioma del juego cuando los juegos de DS lo tenían. Elígelos en Opciones de mods, fila «Opening»; suenan tras los logos y en el bucle de la pantalla de título, y los dos están también en el archivo de escenas. También el tema del menú de los juegos de DS como música de menú, en la fila «Música del menú»."
menu_music_ie23 = "Inazuma Eleven 2 / 3"
menu_music_tm_bus = "The Inazuma TM Bus"

[fr.new]
mod_name = "Génériques en plus"
mod_description = "Plus de génériques d'ouverture : ceux d'Inazuma Eleven 2 et 3 sur Nintendo DS, remasterisés en HD et chantés dans la langue du jeu quand les jeux DS l'avaient. Choisis-les dans les Options des mods, ligne « Opening » ; ils passent après les logos et dans la boucle de l'écran-titre, et les deux sont aussi dans l'archive des scènes. Le thème de menu des jeux DS sert aussi de musique de menu, ligne « Musique du menu »."
menu_music_ie23 = "Inazuma Eleven 2 / 3"
menu_music_tm_bus = "The Inazuma TM Bus"

[de.new]
mod_name = "Zusätzliche Openings"
mod_description = "Mehr Titel-Openings: die Nintendo-DS-Openings von Inazuma Eleven 2 und 3, in HD remastert und in der Sprache des Spiels gesungen, wo die DS-Spiele sie hatten. Wähle sie in den Mod-Optionen, Zeile «Opening»; sie laufen nach den Logos und in der Schleife des Titelbildschirms, und beide sind auch im Szenenarchiv. Dazu das Menü-Thema der DS-Spiele als Menümusik, in der Zeile «Menümusik»."
menu_music_ie23 = "Inazuma Eleven 2 / 3"
menu_music_tm_bus = "The Inazuma TM Bus"

[it.new]
mod_name = "Opening extra"
mod_description = "Più opening per il titolo: gli opening per Nintendo DS di Inazuma Eleven 2 e 3, rimasterizzati in HD e cantati nella lingua del gioco quando i giochi DS l'avevano. Sceglili nelle Opzioni delle mod, riga «Opening»; partono dopo i loghi e nel ciclo della schermata del titolo, ed entrambi sono anche nell'archivio delle scene. Anche il tema del menu dei giochi DS come musica dei menu, nella riga «Musica del menu»."
menu_music_ie23 = "Inazuma Eleven 2 / 3"
menu_music_tm_bus = "The Inazuma TM Bus"

[pt.new]
mod_name = "Aberturas extra"
mod_description = "Mais aberturas para o título: as aberturas de Nintendo DS de Inazuma Eleven 2 e 3, remasterizadas em HD e cantadas no idioma do jogo quando os jogos DS o tinham. Escolha-as nas Opções de mods, linha «Opening»; tocam depois dos logos e no ciclo da tela de título, e as duas também estão no arquivo de cenas. Também o tema de menu dos jogos DS como música de menu, na linha «Música do menu»."
menu_music_ie23 = "Inazuma Eleven 2 / 3"
menu_music_tm_bus = "The Inazuma TM Bus"

[ja.new]
mod_name = "追加オープニング"
mod_description = "タイトルのオープニングを追加：ニンテンドーDS版イナズマイレブン2・3のオープニングをHDリマスターで、DS版にあった言語ではゲームの言語で歌う。MODオプションの「Opening」の行で選ぶと、ロゴの後とタイトル画面のループで流れ、どちらもシーンアーカイブにも入っている。さらにDS版のメニュー曲を、「メニューBGM」の行でメニューのBGMにできる。"
menu_music_ie23 = "Inazuma Eleven 2 / 3"
menu_music_tm_bus = "The Inazuma TM Bus"

[zh_hans.new]
mod_name = "额外片头"
mod_description = "更多标题片头：任天堂DS版闪电十一人2和3的片头，HD重制，在DS版有该语言时以游戏语言演唱。在模组选项的「Opening」一行中选择；它们在标志之后和标题画面循环中播放，两者也收录在场景档案中。另含DS版的菜单曲，可在「菜单音乐」一行用作菜单音乐。"
menu_music_ie23 = "Inazuma Eleven 2 / 3"
menu_music_tm_bus = "The Inazuma TM Bus"

[zh_hant.new]
mod_name = "額外片頭"
mod_description = "更多標題片頭：任天堂DS版閃電十一人2和3的片頭，HD重製，在DS版有該語言時以遊戲語言演唱。在模組選項的「Opening」一行中選擇；它們在標誌之後和標題畫面循環中播放，兩者也收錄在場景檔案中。另含DS版的選單曲，可在「選單音樂」一行用作選單音樂。"
menu_music_ie23 = "Inazuma Eleven 2 / 3"
menu_music_tm_bus = "The Inazuma TM Bus"
