# The Battle Bay «Reto diario» as native data (schema VRFW.game/1, docs/internal/native.md), handled by
# scripts\daily_challenge.lua (required by campaign.lua: one VM).
schema = "VRFW.game/1"

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_DAILY_INFO"
handler = "BattleBayDeluxe.DailyInfo"
needs = ["session", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_DAILY_PREPARE"
handler = "BattleBayDeluxe.DailyPrepare"
needs = ["session", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_DAILY_UNLOAD"
handler = "BattleBayDeluxe.DailyUnload"
needs = ["session"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_DAILY_SYNC"
handler = "BattleBayDeluxe.DailySync"
needs = ["session", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
# -> true while a run match holds the block (the campaign end window sends the player back to the top menu)
name = "CMND_BATTLEBAYDELUXE_DAILY_LOADED"
handler = "BattleBayDeluxe.DailyLoaded"
