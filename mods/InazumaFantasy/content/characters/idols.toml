schema = "VRFW.character/2"
# Inazuma Fantasy's Idol cards. Each one replaces a game Idol card of the same player in place (same card id): the
# card moves to the Idol's own character (`adopt`), which holds its look, voice, series and description.
# Card fields: Inazuma Fantasy's values; the fields it left as its template's are written where the replaced card differs.
# The replaced card keeps its game rarity (5 / 6 / 7): the game's office rows, Players Universe and Diamante recipes name it.
# Mark Evans and Axel Blaze have two game Idol cards each: rarity 6 = their youth moment (Mark at the end of IE3, Axel's
# IE2 return), rarity 7 = their adult self of Inazuma Japón Legendario (Chrono Stone, team 0x4A347229).
# Hidetoshi Nakata and Tom Skipper have no game Idol card: their Idols are new cards (last blocks).
default_lang = "en"

