schema = "VRFW.game/2"

# Technique name search of the ability list (Habilidades), run by scripts\ability_search.lua for
# assets\lua\ability_list_menu\900_technique_search.lua: rows the search does not match leave each build of the list.

# CMenuListViewAbility::BuildItems(view): builds the rows of the tab shown (with the game's filter applied).
[[VRFW.Hook]]
name = "BetterQoL.AbilityListBuild"
game = "Transform.AbilityListBuildItems"
kind = "function"

# -> live: a new search
[[VRFW.Command]]
name = "CMND_BETTERQOL_ABILITY_SEARCH_START"
handler = "BetterQoL.AbilitySearchStart"

# -> live: no search
[[VRFW.Command]]
name = "CMND_BETTERQOL_ABILITY_SEARCH_STOP"
handler = "BetterQoL.AbilitySearchStop"

# -> serial, "item,item,…": the rows of the last build not judged yet, as one text
[[VRFW.Command]]
name = "CMND_BETTERQOL_ABILITY_SEARCH_PENDING"
handler = "BetterQoL.AbilitySearchPending"

# "item,item,…" -> n: those pending rows match, the other pending rows do not; n = the rows judged
[[VRFW.Command]]
name = "CMND_BETTERQOL_ABILITY_SEARCH_DECIDE"
handler = "BetterQoL.AbilitySearchDecide"
