# The first-start window (crates/vrfw-loader/src/boot_splash: shown while the early phase really builds) and VRFWLauncher.exe (crates/vrfw-launcher-app).

threshold_ms = 1500
default_weight = 100
default_word = "data"
fallback_language = "en"

# Each type's typical first-start time in ms: the bar gives it that share.
[weights]
rule = 13000
image = 151990
telop = 128588
sound = 25000
technique = 40422
team = 18640
model = 11028
effect = 9238
item = 8549
character = 6780
base_table = 4602
text = 3702
theme = 3489
menu = 1778
script = 1577
param = 1369
scene = 1289
mods_screen = 1192
transform = 1162
celebration = 1019
formation = 665
anim = 648
game_shader = 500
card_filter = 406
table = 393
flag = 286
font = 284
trigger = 275
look = 233
kit_twin = 159
stadium = 142
input = 138
option = 77
shop = 66
changelog = 34
mode = 6
friendly = 4
rarity = 4

# VRFWLauncher.exe's update worker (docs/framework/auto-update.md).
[launcher]
connect_timeout_ms = 8000
receive_timeout_ms = 30000
max_manifest_bytes = 16777216
# Files an update downloads at once. The launcher halves it by itself when the server asks to slow down.
download_workers = 8
# Ask the server for HTTP/2, so those files share one connection.
download_http2 = true
# Times one file is asked for before the update fails, and the wait before the second time (it doubles each time).
download_attempts = 5
download_retry_wait_ms = 1000
# No wait between attempts is longer, whatever the server asks for.
download_longest_retry_wait_ms = 60000
max_logged_paths = 50
# Tools that write the cache: Clear cache refuses while one runs.
cache_build_processes = ["vrfw-prebuild.exe"]
# Seconds a Steam console depot download may take to start (Steam's log or the depot folder) before the Game version
# page says Steam has not started it yet.
depot_start_wait_s = 60

# How Steam's launch reaches the anti-cheat launcher exe (docs/tools/vrfw-launcher.md): the bootstrapper's ini names it
# with this key; a game build whose ini names none starts the fallback file.
[launcher.eac]
bootstrapper_ini = "GameBootstrapper.ini"
launcher_key = "ApplicationPath"
fallback_launcher = "EACLauncher.exe"

# VRFWLauncher.exe, the launcher that opens before the game (docs/tools/vrfw-launcher.md).
[launcher.external]
exe = "VRFWLauncher.exe"
launch_option = '"{exe}" %command%'
settings_file = 'launcher\settings.toml'
log_file = 'launcher\launcher.log'
# The copies of Steam's localconfig.vdf made before Apply writes the launch option, in the loader data dir.
steam_backup_dir = 'launcher\steam_backups'
# Its background picture, in the framework's mod folder (cover fit).
background = 'assets\launcher\background.png'

