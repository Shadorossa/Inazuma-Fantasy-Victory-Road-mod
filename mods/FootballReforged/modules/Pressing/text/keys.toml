schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Team pressing"
mod_description = "Without the ball, L2 becomes a press button: hold it and 2 to 4 of your teammates nearest to the ball carrier sprint at him, never the keeper. Release it or win the ball back and they play as before. The CPU presses with the same rules."
press_hud_label = "Press!"

[es.new]
mod_name = "Presión de equipo"
mod_description = "Sin balón, L2 pasa a ser un botón de presión: mantenlo y de 2 a 4 compañeros, los más cercanos al rival con el balón, esprintan hacia él, nunca el portero. Suéltalo o recupera el balón y vuelven a jugar como antes. La CPU presiona con las mismas reglas."
press_hud_label = "¡Presión!"

[fr.new]
mod_name = "Pressing d'équipe"
mod_description = "Sans le ballon, L2 devient un bouton de pressing : maintiens-le et 2 à 4 coéquipiers, les plus proches du porteur du ballon, sprintent vers lui, jamais le gardien. Relâche-le ou récupère le ballon et ils rejouent comme avant. La CPU presse avec les mêmes règles."
press_hud_label = "Pressing !"

[de.new]
mod_name = "Team-Pressing"
mod_description = "Ohne Ball wird L2 zur Pressing-Taste: Halte sie gedrückt, und 2 bis 4 deiner Mitspieler, die dem Ballführenden am nächsten sind, sprinten auf ihn zu, nie der Torwart. Lass los oder erobere den Ball zurück, und sie spielen wie zuvor. Die CPU presst nach denselben Regeln."
press_hud_label = "Pressing!"

[it.new]
mod_name = "Pressing di squadra"
mod_description = "Senza palla, L2 diventa un tasto pressing: tienilo premuto e da 2 a 4 compagni, i più vicini a chi ha la palla, scattano su di lui, mai il portiere. Rilascialo o riconquista la palla e tornano a giocare come prima. La CPU pressa con le stesse regole."
press_hud_label = "Pressing!"

[pt.new]
mod_name = "Pressão de equipa"
mod_description = "Sem bola, L2 passa a ser um botão de pressão: mantém-no premido e 2 a 4 colegas, os mais próximos de quem tem a bola, correm para ele, nunca o guarda-redes. Larga-o ou recupera a bola e voltam a jogar como antes. A CPU pressiona com as mesmas regras."
press_hud_label = "Pressão!"

[ja.new]
mod_name = "チームプレス"
mod_description = "ボールを持っていないとき、L2 がプレスボタンになります。押し続けると、ボール保持者に最も近い味方2〜4人（キーパーは除く）が全力で詰め寄ります。離すかボールを奪い返すと、元のプレーに戻ります。CPUも同じルールでプレスをかけます。"
press_hud_label = "プレス！"

[zh_hans.new]
mod_name = "团队逼抢"
mod_description = "没有球时，L2 变成逼抢键：按住后，离持球者最近的2至4名队友（守门员除外）会冲刺逼上去。松开或抢回球后，他们恢复原来的踢法。电脑也按同样的规则逼抢。"
press_hud_label = "全体逼抢！"

[zh_hant.new]
mod_name = "團隊逼搶"
mod_description = "沒有球時，L2 變成逼搶鍵：按住後，離持球者最近的2至4名隊友（守門員除外）會衝刺逼上去。鬆開或搶回球後，他們恢復原來的踢法。電腦也按同樣的規則逼搶。"
press_hud_label = "全體逼搶！"
