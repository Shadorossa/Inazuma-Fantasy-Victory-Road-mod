schema = "VRFW.editor/1"
# Names and descriptions of this mod's config.toml settings, shown in ModManager > Parametros del juego. Read only by ModManager.

[[Shape]]
Id = "settings"
For = "config"
  [[Shape.Field]]
  Key = "team_banks"
  Type = "table"
  Label = { es = "Bancos de equipo", en = "Team banks" }
  Help = { es = "Páginas de equipos de la Plantilla de equipo.", en = "Team pages of the Team dock." }
  [[Shape.Field]]
  Key = "team_banks.pages"
  Type = "int"
  Label = { es = "Páginas de equipos", en = "Team pages" }
  Help = { es = "Número de páginas de la Plantilla de equipo (2 a 32); cada una guarda los 11 equipos del juego.", en = "Number of Team dock pages (2 to 32); each holds the game's 11 teams." }
  [[Shape.Field]]
  Key = "team_banks.new_page"
  Type = "string"
  Label = { es = "Página nueva empieza", en = "New page starts as" }
  Help = { es = "Cómo empieza una página usada por primera vez: empty = cada plantilla como una sin usar (sin nombre ni jugadores); copy = copia completa de la actual.", en = "How a page used for the first time starts: empty = every dock like an unused one (no name, no players); copy = a full copy of the current page." }
  [[Shape.Field]]
  Key = "team_banks.verify"
  Type = "bool"
  Label = { es = "Comprobar al cambiar de página (depuración)", en = "Check on page change (debug)" }
  Help = { es = "Escribe en el registro una comprobación de cada equipo tras cada cambio de página.", en = "Writes a check of every team to the log after each page change." }
  [[Shape.Field]]
  Key = "team_banks.blocked_modes"
  Type = "list"
  Of = "string"
  Label = { es = "Modos sin cambio de página", en = "Modes without page change" }
  Help = { es = "Modos de juego en los que no se cambia de página (el modo historia usa los equipos para sus plantillas).", en = "Game modes where pages cannot be changed (story mode uses the teams for its own squads)." }
  [[Shape.Field]]
  Key = "team_name"
  Type = "table"
  Label = { es = "Nombre del equipo", en = "Team name" }
  Help = { es = "Nombre del equipo en la Plantilla de equipo.", en = "Team name in the Team dock." }
  [[Shape.Field]]
  Key = "team_name.max_length"
  Type = "int"
  Label = { es = "Longitud máxima del nombre", en = "Max name length" }
  Help = { es = "Caracteres que acepta el teclado de nombre (1 a 31; el juego permite 12).", en = "Characters the name keyboard accepts (1 to 31; the game allows 12)." }
  [[Shape.Field]]
  Key = "team_name.room"
  Type = "int"
  Label = { es = "Ancho del nombre (px)", en = "Name width (px)" }
  Help = { es = "Ancho disponible para el nombre en la cabecera del equipo; un nombre más largo se dibuja más pequeño.", en = "Width the name may take in the team header; a longer name is drawn smaller." }
  [[Shape.Field]]
  Key = "team_name.style"
  Type = "string"
  Label = { es = "Estilo del nombre", en = "Name style" }
  Help = { es = "Estilo de texto del nombre en la cabecera.", en = "Text style of the name in the header." }
  [[Shape.Field]]
  Key = "team_name.fit_styles"
  Type = "list"
  Of = "string"
  Label = { es = "Estilos de ajuste", en = "Fit styles" }
  Help = { es = "Estilos de texto más pequeños que se prueban si el nombre no cabe.", en = "Smaller text styles tried when the name does not fit." }
  [[Shape.Field]]
  Key = "passives"
  Type = "table"
  Label = { es = "Pasivas", en = "Passives" }
  Help = { es = "Configuración de pasivas de los jugadores.", en = "Player passive setup." }
  [[Shape.Field]]
  Key = "passives.max_slots"
  Type = "int"
  Label = { es = "Huecos de pasiva configurables", en = "Configurable passive slots" }
  Help = { es = "Cuántos de los 5 huecos de pasiva de un jugador se pueden configurar (3 a 5).", en = "How many of a player's 5 passive slots can be configured (3 to 5)." }
  [[Shape.Field]]
  Key = "passives.unlock"
  Type = "string"
  Label = { es = "Desbloqueo de pasivas", en = "Passive unlock" }
  Help = { es = "all = todos los huecos de un jugador configurable funcionan en partido; configured = solo los configurados.", en = "all = every slot of a configurable player works in matches; configured = only the configured ones." }
  [[Shape.Field]]
  Key = "passives.always_unlocked"
  Type = "bool"
  Label = { es = "Pasiva propia siempre activa", en = "Own passive always active" }
  Help = { es = "Un hueco con la pasiva propia del personaje funciona aunque su casilla del tablero esté cerrada.", en = "A slot holding a character's own passive works even if its board piece is closed." }
