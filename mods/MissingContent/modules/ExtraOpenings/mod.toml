id = "ExtraOpenings"
# name / description: the English fallback; the screen shows the text keys mod_name / mod_description in the game's language (text\keys.toml)
name = "Extra Openings"
version = "0.2.2"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "More title openings: the Nintendo DS openings of Inazuma Eleven 2 and 3, remastered in HD and sung in the game's language where the DS games had it. Choose them in Mod options, row «Opening»; they play after the logos and in the title screen's loop, and both are also in the scene archive. Also the DS games' menu theme as menu music, in the row «Menu music»."
priority = 0
tags = ["Visual", "Audio"]
updated = "2026-11-04"
# This mod's own names (TOML keys [[MissingContent.X]], Lua MissingContent.X; older texts / commands / keys EXOP_ /
# exop_); never VRFW.
prefix = "MissingContent"
folder = "ExtraOpenings"
# The DS openings of Inazuma Fantasy, moved out of IF (IF split, docs/refactor/if-mod-split-map.md row
# if_videoteca; docs/release/extra_openings.md). Data only: no plugin, no Lua, no options of its own. Ids, keys and
# names are the ones IF used. Standard mod layout (docs/framework/mod-layout.md):
#   content\scenes\gallery.toml        the «Inazuma Eleven» tab and the two openings (kind VRFW.gallery/1, VRFW 3.4:
#                                      docs/framework/types/gallery.md): the framework makes their archive rows, movie
#                                      rows, event rows, titles and «Opening» row values
#   content\sounds\sounds.toml + assets\sounds\music\
#                                      the songs per language (if_op_ie2_{ja,es}, if_op_ie3_{ja,es,en,it}), the VR
#                                      opening preview cuts (if_op_vr_*) and the DS menu theme exop_menu_ie23 with its
#                                      [[VRFW.MenuMusic]] (research/scripts/ds_menu_music_build.py)
#   assets\data\dx11\movie\             the two VP9 USMs (if_op_ie2.usm, if_op_ie3.usm), game-shaped (served by path)
#   assets\data\dx11\menu\220_img\theater_img\  the archive thumbnails (research/scripts/videoteca_build.py thumbs)
#   text\keys.toml                     the mod's name / description and the menu theme label (9 languages)
# README.md, _deploy.toml and _split.toml are developer files, never installed.
# Works without Inazuma Fantasy; IF does not require this mod.
requires = ["VRFW>=0.2.2", "MissingContent>=0.2.2"]
conflicts = []

# UI only: left out of the mod set two players must share in a private online room, and of
# (VR-Framework net service, docs/game/modes/bb-online-ownnet.md §5)
[VRFW.Mod]
AffectsMatch = false

# A MODULE of Missing Content: shown inside Missing Content's entry on the Mods screen; switching
# Missing Content off switches it off too. On by default. Its id, prefix, keys and saves are the ones
# it had as a mod of its own.
[module]
of = "MissingContent"
order = 300
