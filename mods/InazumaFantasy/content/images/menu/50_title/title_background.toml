# The press-start key art: this mod's background of the title screen and the save slot list, one value of the
# framework's «Title background» row and the default one while this mod is on (docs/framework/title-background.md).
schema = "VRFW.image/1"

[[VRFW.TitleBackground]]
Name = "key_art"
Text = "title_background_key_art"
Order = 30
Default = true

# ---- the press-start key art (title_menu layer title00_01_title_top_st) ---------------------------------------------

# the whole picture is the background; the two character sprites, the green light and the sun flare are emptied
[[sprite]]
atlas = "#/menu/50_title/title00/title00_01_st/title00_01_st.g4tx"
name = "bg_sky01_st"
recipe = "key_art"

[[sprite]]
atlas = "#/menu/50_title/title00/title00_01_st/title00_01_st.g4tx"
name = "bg_chr02_st"
recipe = "no_left_character"

[[sprite]]
atlas = "#/menu/50_title/title00/title00_01_st/title00_01_st.g4tx"
name = "bg_chr01_st"
recipe = "no_right_character"

[[sprite]]
atlas = "#/menu/50_title/title00/title00_01_st/title00_01_st.g4tx"
name = "bg_green_eff01_st"
recipe = "no_green_light"

[[sprite]]
atlas = "#/menu/50_title/title00/title00_01_st/title00_01_st.g4tx"
name = "bg_lens_flare01_st"
recipe = "no_flare"

[[texture]]
atlas = "#/menu/50_title/title00/title00_01_st/title00_01_st.g4tx"
