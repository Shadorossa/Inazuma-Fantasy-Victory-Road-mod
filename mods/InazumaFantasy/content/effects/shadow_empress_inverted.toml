schema = "VRFW.effect/1"
# The inverted keshin shot (content/techniques/shadow_empress_inverted.toml): Shadow Empress's effect objects and status
# tints as copies in the white keshin's colours: saturation down to 0.15, so the violet and magenta glows turn pale
# white with a faint trace of the retail violet (the keshin's kept scarf colour). Brightness stays, so the additive
# streaks keep their shape and never turn black.

[[recolor]]
object = "ev60100900"
copy = "ev60800900"
textures = "all"
materials = "all"
vertex_colors = "all"
particles = true
saturation = 0.15

[[recolor]]
object = "ev60100901"
copy = "ev60800901"
textures = "all"
materials = "all"
vertex_colors = "all"
particles = true
saturation = 0.15

[[recolor]]
object = "ev60100902"
copy = "ev60800902"
textures = "all"
materials = "all"
vertex_colors = "all"
particles = true
saturation = 0.15

# The tints on the keshin, the shadow empresses and the ball.
[[recolor]]
aura = "body_aura_empress_shadow"
copy = "body_aura_empress_shadow_80090"
saturation = 0.15

[[recolor]]
aura = "body_aura_empress_shadow_2"
copy = "body_aura_empress_shadow_2_80090"
saturation = 0.15

[[recolor]]
aura = "ball_aura_empress_shadow"
copy = "ball_aura_empress_shadow_80090"
saturation = 0.15

# The mirrored cut-in loads the copies instead of the retail objects.
[[event_command]]
event = "ev60_90090"
command = "CMD_799A1EBA"                 # LOAD_ACTOR_RESOURCE
args = ["ev60100900"]
set = ["ev60100900", "common/effect/event/ev60/ev60800900/ev60800900.objbin"]

