schema = "VRFW.theme_rules/1"
theme = "dark"
# the match HUD's PE / PEG / SP numbers, slash and bars under the portrait: kept as drawn
exclude = ["dx11/menu/02_btl/character_reforged_points_hud"]

[[sprite]]
match = "cr_pp_card_blue"
class = "surface"
file = "character_reforged_own/character_reforged_soccer11_20"

[[sprite]]
match = "cr_pair_panel"
class = "surface"
file = "102_team/team11/character_reforged_page/character_reforged_page"

# the bank cards' corner badges (white or light tiles a mod's atlas adds, read as panels otherwise): kept as drawn
[[sprite]]
match = "character_reforged_status_*"
class = "keep"
