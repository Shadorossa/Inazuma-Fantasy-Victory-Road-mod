[en.new]
mod_name = "Hissatsu Reforged"
mod_description = "Rebalances 683 special moves with new power, tension cost and recast time. Moves with two properties show both icons in every list, and special moves can now land critical hits. Special moves level up the classic way: each move grows with the times a player uses it in matches, and a banner says when it levels up. The last level needs the Ultimate Evolution Manual from the general shop, and a player can no longer carry the same special move twice."
option_power_changes = "Power changes"
option_power_changes_help = "On: the mod's new power for special moves. Off: every move keeps the game's power. Applies after restarting the game."
