schema = "VRFW.text_key/1"
# Texts of «Synergies Reworked» (format: docs/framework/types/text.md): the «Mods»
# screen's name and description. The hints of the synergy panel are the menu_text rows of text\rows\synergy_hints.toml.
# A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Synergies Reworked"
mod_description = "Reworks some team synergies so they ask for players of a team or a group instead of a few named characters, for example any three female managers of a series or one player of each Raimon team. It also adds new synergies (Los cuatro magníficos, Japón en la sombra, Tablero de Ajedrez and more) with their own icons, and renames a few. The synergy panel shows who is still missing."

[es.new]
mod_name = "Synergies Reworked"
mod_description = "Cambia algunas sinergias de equipo para que pidan jugadores de un equipo o un grupo en vez de unos personajes concretos, por ejemplo tres gerentes cualesquiera de una serie o un jugador de cada equipo de Raimon. También añade sinergias nuevas (Los cuatro magníficos, Japón en la sombra, Tablero de Ajedrez y más) con sus propios iconos, y renombra algunas. El panel de sinergias muestra quién falta todavía."

[fr.new]
mod_name = "Synergies Reworked"
mod_description = "Modifie certaines synergies d'équipe pour qu'elles demandent des joueurs d'une équipe ou d'un groupe au lieu de quelques personnages précis, par exemple trois managers quelconques d'une série ou un joueur de chaque équipe de Raimon. Il ajoute aussi de nouvelles synergies (Los cuatro magníficos, Japón en la sombra, Tablero de Ajedrez et d'autres) avec leurs propres icônes, et en renomme quelques-unes. Le panneau des synergies montre qui manque encore."

[de.new]
mod_name = "Synergies Reworked"
mod_description = "Ändert einige Team-Synergien, sodass sie Spieler eines Teams oder einer Gruppe verlangen statt einiger bestimmter Figuren, zum Beispiel drei beliebige Managerinnen einer Serie oder je einen Spieler der Raimon-Teams. Dazu kommen neue Synergien (Los cuatro magníficos, Japón en la sombra, Tablero de Ajedrez und weitere) mit eigenen Symbolen; einige werden umbenannt. Das Synergie-Panel zeigt, wer noch fehlt."

[it.new]
mod_name = "Synergies Reworked"
mod_description = "Modifica alcune sinergie di squadra perché richiedano giocatori di una squadra o di un gruppo invece di alcuni personaggi precisi, per esempio tre manager qualsiasi di una serie o un giocatore di ciascuna squadra Raimon. Aggiunge anche nuove sinergie (Los cuatro magníficos, Japón en la sombra, Tablero de Ajedrez e altre) con icone proprie, e ne rinomina alcune. Il pannello delle sinergie mostra chi manca ancora."

[pt.new]
mod_name = "Synergies Reworked"
mod_description = "Altera algumas sinergias de equipa para pedirem jogadores de uma equipa ou de um grupo em vez de alguns personagens concretos, por exemplo três gerentes quaisquer de uma série ou um jogador de cada equipa do Raimon. Também acrescenta sinergias novas (Los cuatro magníficos, Japón en la sombra, Tablero de Ajedrez e mais) com ícones próprios, e renomeia algumas. O painel de sinergias mostra quem ainda falta."

[ja.new]
mod_name = "Synergies Reworked"
mod_description = "ゲームのチームシナジーの一部が、決まったキャラクターではなくチームやグループの選手を条件にするようになります。たとえばシリーズの女子マネージャー3人や、雷門の各チームから1人ずつ。専用アイコンの新シナジー（Los cuatro magníficos、Japón en la sombra、Tablero de Ajedrezなど）も追加され、一部は名前が変わります。シナジーパネルには、まだ足りない選手が表示されます。"

[zh_hans.new]
mod_name = "Synergies Reworked"
mod_description = "改动部分球队协同效果，使其要求某支球队或某个群体的球员，而不是几名指定角色，例如某系列任意三名女经理，或雷门各队各一名球员。还新增了带专属图标的协同（Los cuatro magníficos、Japón en la sombra、Tablero de Ajedrez 等），并重命名了部分协同。协同面板会显示还缺谁。"

[zh_hant.new]
mod_name = "Synergies Reworked"
mod_description = "改動部分球隊協同效果，使其要求某支球隊或某個群體的球員，而不是幾名指定角色，例如某系列任意三名女經理，或雷門各隊各一名球員。還新增了帶專屬圖示的協同（Los cuatro magníficos、Japón en la sombra、Tablero de Ajedrez 等），並重命名了部分協同。協同面板會顯示還缺誰。"
