schema = "VRFW.menu/2"

[[object]]
name = "vrfw_model_card"
from = "shop01_01_list_base"
remove_block = ["CMenuListViewShop", "CMenuSoundCmdProperty", "MenuCollisionSetting", "CAnalogInputComponent"]
set = [
    { parameter = "m_useObjectNum", match = { 1 = 4 }, values = { 1 = 1 } },
    { parameter = "m_isRotateSelf", match = { 1 = 1 }, values = { 1 = 0 } },
]

[[object]]
name = "vrfw_model_card_backdrop"
from = "mainmenu90_00_background_draw_type_before"
set = [
    { parameter = "m_drawPriority", match = { 1 = 450 }, values = { 1 = 200 } },
]

[[object]]
name = "vrfw_model_card_ground"
from = "cmn01_10_new_icon"
set = [{ parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 210 } }]
add = [{ block = "CMenuRenderComponent", parameter = "m_drawType", values = [1] }]
