[zh_hant.new]
option_duel_auras = "自由對決中的靈氣"
option_duel_auras_help = "對決中，靈氣（化身、圖騰、鎧甲、混合最大化等）絕不會算作對對手必殺技的應對：對決暫停，靈氣發動，對決繼續且仍可選擇。雙方隊伍都適用，包括電腦。重啟遊戲後生效。"
option_technical_combo = "技術連擊"
option_technical_combo_help = "遊戲的技術連擊：用必殺技贏得專注對決，下一次射門的威力最多提升3級，必殺技的氣勢消耗降低。關閉：不會累積連擊。重新啟動遊戲後生效。"
option_move_cooldown = "必殺技冷卻"
option_move_cooldown_help = "開：必殺技與原版遊戲一樣，冷卻結束後才能再次使用。關：雙方隊伍的必殺技都可以立即再次使用；仍會消耗氣勢，靈氣的冷卻維持不變。立即生效；已在冷卻中的必殺技會走完剩餘時間。"
mod_name = "Football Reforged"
mod_description = "以可在 Mods 中開關的模組形式提供比賽機制：守門員屏障、鬥志、主場球場、逼搶、補時和傳奇電腦。還新增足球7人制、閃電街頭和5對5的比賽形式、技巧對決、自由對決中的靈氣以及比賽挑戰。"
