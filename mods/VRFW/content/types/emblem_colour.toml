# Declares `VRFW.EmblemColour` rows for content\emblem_colours\*.toml (read by scripts\lib\game_catalogue.lua; generated by research/scripts/emblem_colours.py).
schema = "VRFW.decl_schema/1"
kind = "VRFW.emblem_colour/1"
folder = "content/emblem_colours"
label = "Emblem colours"
label_es = "Colores de emblemas"
doc = "The measured colour of one emblem picture."
doc_es = "El color medido de la imagen de un emblema."

[entry.EmblemColour]
doc = "the measured colour of one emblem picture; a later mod's row of the same emblem wins"
emblem = { type = "string", ref = "emblem", required = true, doc = "the emblem's texture key (em010001)" }
hue = { type = "int", min = 0, max = 359, doc = "the dominant hue in degrees (missing = no clear colour)" }
strength = { type = "number", min = 0, max = 1, default = 0.0, doc = "weight of the dominant hue per opaque pixel (saturation x value)" }
share = { type = "number", min = 0, max = 1, default = 0.0, doc = "share of opaque pixels that are coloured" }
value = { type = "number", min = 0, max = 1, default = 0.0, doc = "mean brightness of the opaque pixels" }
