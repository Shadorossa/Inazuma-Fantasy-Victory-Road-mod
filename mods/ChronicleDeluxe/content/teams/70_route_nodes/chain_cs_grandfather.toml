  Links = ["m11"]
  Team = "tm_cro_legend_GO2_07"        # Osos Dorados / Gold Bear (3DS Lv 99)
  Level = 200

  [[VRFW.Chain.Tile]]
  Id = "m11"
  Kind = "match"
  Pos = [1, 2]                         # 3DS cell 11
  Links = ["c13"]
