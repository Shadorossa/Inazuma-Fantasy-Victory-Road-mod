[fr.new]
mod_name = "Character Reforged"
mod_description = "La base des mods de personnages. Chaque personnage a ses propres statistiques et techniques, le niveau maximum passe à 200 et le tableau de compétences devient une table élargie avec 6 supertechniques, un emplacement d'aura et un de mélange. Elle ajoute aussi une fiche joueur en pages avec modèle 3D et jauges de statistiques, un entraînement des statistiques avec points libres, le miximax entre deux joueurs quelconques et tous les keshin avec leur armure, et des options de transformations par objets, de keshin et totems à points au lieu du temps et d'une jauge d'endurance pour chaque joueur. Chaque joueur a aussi un passif propre, les synergies d'équipe demandent une équipe ou un groupe, et chaque équipement a la même puissance totale, avec affinité de poste et d'élément, 71 ensembles et 167 objets classiques de GO, Chrono Stone et Galaxy."
