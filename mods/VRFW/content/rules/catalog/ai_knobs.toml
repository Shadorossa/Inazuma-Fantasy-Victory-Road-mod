# ------------------------------------------------------------------------------------------------ per-team behaviours

[[team]]
name = "StatPercent"
kind = "number"
min = -50.0
max = 200.0
hook = "stats"
summary = "percent added to every stat of the side's players on the pitch (match stats, from their base)"

[[team]]
name = "TensionPerSecond"
kind = "number"
min = 0.0
max = 50.0
hook = "tension"
summary = "tension points (HUD units) the side gains every second of play"

[[team]]
name = "KeeperTpReserve"
kind = "number"
min = 0.0
max = 300.0
hook = "keeper_reserve"
summary = "tension kept for the side's keeper (the game keeps 20 for one side only)"

[[team]]
name = "StrategyLevel"
kind = "number"
min = 1.0
max = 9.0
hook = "strategy_level"
summary = "the AI level the side's strategy and player tactic gates read (enableLv of strategy_ai_config / tactics_ai_config, 1-4 in retail): the side plays every strategy up to that level; its class loads keep the match row's level"

[[team]]
name = "ZoneShootNow"
kind = "table"
keys = ["replan_s", "elapsed_s", "direct", "watch_s"]
min = 0.0
max = 30.0
hook = "zone"
summary = "in the side's own shoot zone: the shot lock is lifted every frame, the team re-plans every `replan_s` seconds, its strategy conditions read the zone as at least `elapsed_s` seconds old (the shot / chain strategies gated by the zone's age hold at once) and, with `direct` = 1, a direct shot as needed; `watch_s` > 0 logs each of its zone decisions (start, pass, shot, ball lost, end) and a carrier that holds the ball `watch_s` seconds without one"

[[team]]
name = "ZoneAct"
kind = "table"
keys = ["limit_s", "retry_s"]
min = 0.0
max = 1.0
hook = "zone"
summary = "the side's carrier in his shot zone area acts at once: in play the zone intention is set, in the zone the game's shot decision is kicked (the chain partner if it has one, else the goal; a plain kick without a move); after `limit_s` real seconds (at most 1) with no zone the same kick goes without one; a refused kick is asked again after `retry_s`. The clock waits in a duel, a scramble, a cut-in, a dead ball and a shot in flight"

[[team]]
name = "FocusHurry"
kind = "table"
keys = ["scale", "force_at"]
min = 0.0
max = 10.0
hook = "conditions"
summary = "as the duel's attacker the side's strategy conditions read the duel's elapsed time rate x `scale`, and 1 (the time is up) from `force_at`: it breaks through or passes out before the time runs out"

[[team]]
name = "StaminaResource"
kind = "text"
hook = "stamina"
summary = "the match resource that is a player's stamina (a `<mod>.<key>` of a mod's match_resources, e.g. Stamina Points' PE)"

[[team]]
name = "SprintByStamina"
kind = "table"
keys = ["above", "below", "rate", "attack_rate", "calm_after_s", "calm_mult", "calm_support_mult"]
min = 0.0
max = 30.0
hook = "stamina"
summary = "per player: sprint rate `rate` (dash attack `attack_rate`) while his stamina ratio is above `above`, 0 below `below`, in between linear (full stamina without StaminaResource); once the side has held the ball `calm_after_s` seconds (0 = off) the carrier's rates x `calm_mult` and his teammates' x `calm_support_mult` (default calm_mult)"

[[team]]
name = "SubstituteAtStamina"
kind = "number"
min = 0.0
max = 1.0
hook = "substitution"
summary = "at a dead ball the side substitutes its outfield player whose stamina ratio is below this (the most tired one)"

[[team]]
name = "BestMoveChance"
kind = "number"
min = 0.0
max = 1.0
hook = "move_choice"
summary = "chance that a move choice takes the best move of the slots (power, element, tension) instead of the game's pick"

[[team]]
name = "KickoffPress"
kind = "bool"
hook = "team_ai_pass"
summary = "the side's AI presses right after a kick-off: the game's press pause (noPressKickoffAfterTime, one countdown for both teams) reads 0 during this side's AI passes only"

[[team]]
name = "ElementCounter"
kind = "bool"
hook = "move_choice"
summary = "a move choice always takes a move whose element beats the other side's (its committed move, else the one it is expected to use) when one is usable"

[[team]]
name = "MoveCostWeight"
kind = "number"
min = 0.0
max = 2.0
hook = "move_choice"
summary = "best move = power / cost ^ weight (0 = the strongest, 1 = the most power per tension point)"

[[team]]
name = "PowerAware"
kind = "table"
keys = ["margin", "save_tension", "force", "strongest_shot_when_stopped", "keeper_free_save", "keeper", "blocks", "shots", "duels"]
min = 0.0
max = 10.0
hook = "move_choice"
summary = "the side computes the power of every option of both players (stats, move power with the mod rules, element wheel, the shot's power in flight, [power]) and picks the cheapest one that wins: its power >= the other side's x `margin`; in a duel the best chance of the [power] duel table. Keeper (`keeper` = 1): against the shot in flight. Shot block (`blocks` = 1): a counter shot that returns the shot, else a block move that stops it or weakens it enough for its keeper. Shot (`shots` = 1): a shot the other keeper cannot stop with his best affordable option. Duel (`duels` = 1): against the other side's committed move, else his strongest affordable one. `save_tension` = 1: no move when no option wins. `force` = 1: a picked keeper / block / shot move skips the game's use-rate roll. `strongest_shot_when_stopped` = 1 (off unless set): when the keeper stops every shot, the affordable move nearest to beating him (its power / his answer) instead of `save_tension`. `keeper_free_save` = 1: the keeper reads the rolls made at the kick: a «parada» (critical catch) saves without a move, a «brecha» (force-win shot) cannot be stopped: no move in both"

[[team]]
name = "LearnUserMoves"
kind = "bool"
hook = "learning"
summary = "the side remembers the elements of the moves the other side used this match, per category, and expects the most used one"

[[team]]
name = "AuraElementCounter"
kind = "bool"
hook = "aura_choice"
summary = "an aura choice takes the aura whose element beats most of the other side's players on the pitch"

[[team]]
name = "AuraPlan"
kind = "table"
keys = ["decide_s", "keeper_priority", "keeper_threat_m", "threat_calm_s", "keeper_min_gauge", "keep_slot_m", "free_slot_wait_s", "drop_near_m", "drop_far_m", "drop_gap_s", "carrier_shot_m", "carrier_free_slot_chance", "summon_later_s", "armour_delay_s", "armour_min_gauge", "armour_near_m", "armour_shot_m", "armour_idle_s", "armour_rest_gauge"]
min = 0.0
max = 120.0
hook = "aura_choice"
summary = "the side plays under the team's cap of running auras: at every threat (the other carrier within `keeper_threat_m` of its goal, or its shoot zone) the keeper's aura goes first at chance `keeper_priority`, with a slot freed from the outfield player farthest from the ball (keshin, totem or armour); the last slot stays for the keeper with the ball within `keep_slot_m` of its goal; a carrier within `carrier_shot_m` of the goal takes the slot of a player `drop_far_m` from the ball at chance `carrier_free_slot_chance`; a spirit becomes its armour (the human's plate) only after `armour_delay_s`, with the gauge at `armour_min_gauge` and play near; an armour with no play near for `armour_idle_s` and the gauge under `armour_rest_gauge` comes off and its spirit returns within `summon_later_s`"

[[team]]
name = "AuraGaugeResource"
kind = "text"
hook = "aura_choice"
summary = "the match resource with one value per player and aura that AuraPlan reads as the aura's gauge (no such resource = no gauge conditions)"

[[team]]
name = "KeeperBarSource"
kind = "text"
hook = "conditions"
summary = "what the condition opponent_keeper_bar_above reads: keeper_hp (the scoreboard keeper bar) or a match resource key"

[[team]]
name = "PassLaneCut"
kind = "table"
keys = ["receivers", "at", "seconds", "range_m"]
min = 0.0
max = 60.0
hook = "pass_lane_cut"
summary = "when the other side presses a pass command, its `receivers` teammates nearest to the passer (within `range_m`) are the likely receivers: for each lane the nearest free player of this side moves to the point `at` (0-1) along it for `seconds`"

[[team]]
name = "OffsideTrap"
kind = "table"
keys = ["defenders", "level_m", "step_m", "step_s", "reaction_s", "miss", "min_distance_m", "box_m", "lane_m", "range_m", "cooldown_s", "zone_fraction"]
min = 0.0
max = 60.0
hook = "offside_trap"
summary = "without the ball, in play, with the match's offside rule on: up to `defenders` defenders of this side (not the keeper, not the player nearest to the carrier, within `range_m` of the line) hold one flat line `level_m` behind the other side's most advanced attacker; when that side presses a pass command or the lane from its carrier to that attacker opens (nobody of this side within `lane_m`), after `reaction_s` and unless the read misses (`miss`, 0-1), the line steps up `step_m` for `step_s` (then no new step for `cooldown_s`). Off while the carrier is within `min_distance_m` of the line or `box_m` of the goal line. `zone_fraction` > 0: only while the carrier is between the halfway line and that fraction of the pitch length into this side's half (0.25 = the quarter next to the halfway line), never deeper"

[[team]]
name = "LowBlock"
kind = "table"
keys = ["after_lost_s", "forward_drop_m", "top_m", "compact_m", "mark", "mark_m", "lane_bias", "range_m", "press", "recover_m", "recover_mult", "max_markers", "mark_zone_m", "mark_forwards"]
min = 0.0
max = 100.0
key_ranges = { forward_drop_m = [-60.0, 60.0], top_m = [-60.0, 60.0] }
hook = "low_block"
summary = "without the ball, in play, once `after_lost_s` have passed since this side lost it (its counter-press): its outfield players with no other job (not a PressCarrier chaser, an OffsideTrap line defender, a ZoneWallGuards guard or a BoxLine spot) mark the other side's players goal side (`mark_m` away, turned `lane_bias` 0-1 toward the ball, within `range_m`; `mark` 0 = no marking): at most `max_markers` (default all), the passing options nearest to the carrier first, each only within `mark_zone_m` of his marker (0 = `range_m`), a pair kept while within 1.5 x that zone or for Shape `hold_s`; the marker is the man's ManMarking pair, else the nearest player (forwards only with `mark_forwards`, default 1) and never stand further up than the caps: forwards `forward_drop_m` behind the halfway line, the others `top_m` behind it (both may be negative: that far past it, a high block), everyone at most `compact_m` in front of the side's last outfield player (without Shape a player without a marking job beyond his cap drops to it; with Shape the caps bound its lines). A player farther than `recover_m` from his spot runs at `recover_mult` (move_speed). `press` >= 1: during the block PressCarrier chases with the `press` nearest players of any role"

[[team]]
name = "BoxLine"
kind = "table"
keys = ["near_m", "keeper_pair", "keeper_m", "pair_gap_m", "line_m", "gap_m", "min_ball_m", "width_m"]
min = 0.0
max = 60.0
hook = "low_block"
summary = "without the ball, in play, the carrier within `near_m` of this side's goal line: `keeper_pair` defenders stand by the keeper on the line from the goal centre to the ball (`keeper_m` out, `pair_gap_m` apart), the other defenders one flat line `line_m` from the goal line (at least `min_ball_m` behind the ball), `gap_m` apart, centred between the ball and the goal and inside `width_m` of the goal centre"

[[team]]
name = "ShotChainRead"
kind = "table"
keys = ["range_m", "chain_m", "blockers", "from_m", "spacing_m", "hold_s"]
min = 0.0
max = 60.0
hook = "shot_chain_read"
summary = "a kick of the other side (KickDispatch) read as the start of a shot chain: a pass whose target is within `range_m` of this side's goal, or a shot / loose kick passing within `chain_m` of a teammate there; `blockers` players (BoxLine's keeper pair first, then the nearest) take spots on the line from that point to the goal centre (`from_m` from it, then `spacing_m` apart) until the ball's arrival time plus `hold_s`"

[[team]]
name = "PassRead"
kind = "table"
keys = ["players", "reaction_s", "range_m", "run_speed_mps", "hold_s", "sprint", "min_flight_s", "lob_vertical_mps", "defenders", "midfielders", "forwards"]
min = 0.0
max = 60.0
hook = "pass_read"
summary = "a pass of the other side (KickDispatch, after PassSpeed) read at the kick from the game's ball motion request (its target is the landing point, its flight time the arrival): the side's `players` (default 2) players of the chosen roles (`defenders` / `midfielders` default 1, `forwards` default 0) within `range_m` (default 30) run at once (after `reaction_s`, default 0) to the first point of the ball's path they reach before the ball (estimated with `run_speed_mps`, default 7), else to the landing point; a lob (vertical speed above `lob_vertical_mps`, default 6) only at its landing point. AI move orders (sprint with `sprint`, default 1) until the ball gets there plus `hold_s` (default 0.2); passes shorter than `min_flight_s` (default 0.3) are left to the game"

[[team]]
name = "ThroughBallCover"
kind = "table"
keys = ["lead_m", "chasers", "goal_side_m", "range_m", "drop", "line_min_m", "runner_cover_m", "pressure_m", "free_gap_m"]
min = 0.0
max = 60.0
hook = "pass_read"
summary = "through balls of the other side: a pass whose landing point is `lead_m` (default 4) deeper than its receiver, or behind the side's last outfield player, sends `chasers` (default 2) players within `range_m` (default 40) at the kick: the first to his PassRead point, the others `goal_side_m` (default 3) apart goal side of the landing point; `drop` 1 (default): the other defenders higher than that point run back goal side of it (never closer than `line_min_m`, default 6, to the goal line). Out of possession, with Shape and no offside / box line: the back line stands at least `runner_cover_m` (default 2) goal side of the other side's deepest outfield player and, while nobody of the side is within `pressure_m` (default 6) of the carrier, at least `free_gap_m` (default 18) behind the ball"

[[team]]
name = "LooseBallRead"
kind = "table"
keys = ["players", "range_m", "run_speed_mps", "hold_s", "sprint", "min_flight_s", "rebound_mps", "rebound_every_s"]
min = 0.0
max = 60.0
hook = "pass_read"
summary = "a kick with no teammate receiver (a clearance, a loose kick; KickDispatch) of either side: the side's `players` (default 1) nearest outfield players within `range_m` (default 40) run at once to the game's landing point (the request's target) until its flight time plus `hold_s` (default 0.3; sprint with `sprint`, default 1); kicks shorter than `min_flight_s` (default 0.3) and kicks into a goal mouth are left to the game. A loose ball no kick explains (a rebound, a deflection) moving faster than `rebound_mps` (default 3; 0 = off): every `rebound_every_s` (default 0.1) the `players` runners that meet it soonest on its straight path (`run_speed_mps`, default 7) run to that point. Log `match ai: team T loose ball read: …` / `team T rebound read: …`"

[[team]]
name = "PassPredict"
kind = "table"
keys = ["receivers", "at", "every_s", "seconds", "range_m", "facing_weight", "open_weight", "distance_weight", "min_speed_mps"]
min = 0.0
max = 60.0
hook = "pass_lane_cut"
summary = "in play while the other side holds the ball, before any pass: every `every_s` (default 0.15) the carrier's teammates within `range_m` (default 30) are scored by his heading (his run, `facing_weight`, default 1; under `min_speed_mps`, default 0.5, no heading), how open the lane is (the nearest player of this side to it, up to 10 m, `open_weight`, default 1) and the distance (`distance_weight`, default 0.5); for the `receivers` (default 2) best the nearest free player of this side (not the one nearest to the carrier) moves to the point `at` (default 0.5) along the lane for `seconds` (default 0.5), like PassLaneCut. Log `match ai: team T pass predict: …` when the likely receivers change"

[[team]]
name = "StickRead"
kind = "table"
keys = ["react_s", "error", "noise_deg", "decide_s", "min_stick", "pass_weight", "duel_min", "duel_shift_m", "duel_cover", "attack_read", "learn_speed_mps", "learn_samples", "learn_agreement"]
min = 0.0
max = 90.0
hook = "stick_read"
summary = "the side reads the other side's real move stick (the `[stick] axes` commands, through the axis service) as it was `react_s` ago (default 0.2 s), turned into a pitch direction it learns from that side's carrier runs (at least `learn_speed_mps`, default 3, with the stick past `min_stick`, default 0.5; ready after `learn_samples`, default 20, when `learn_agreement`, default 0.8, of them agree). Every `decide_s` (default 0.35) it rolls a new read: missed with the chance `error` (default 0.15), else off by up to `noise_deg` (default 10). Uses: PassPredict aims at the receivers the stick points to (`pass_weight`, default 0.7, over the run); in focus duels (stick sideways at least `duel_min`, default 0.35) its defender covers the side the carrier's stick goes to (`duel_cover`, default 1: a move to the other side is mirrored, a straight one shifts `duel_shift_m`, default 0.8) and FocusAttackRead takes the side the defender's stick goes to (`attack_read`, default 1). Log `match ai: team T stick read: …`, `duel stick cover …`, `pass predict: … + stick read`"

[[team]]
name = "HumanHabits"
