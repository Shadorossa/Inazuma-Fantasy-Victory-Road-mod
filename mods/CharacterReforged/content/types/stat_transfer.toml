# Declaration schema of CharacterReforged.stat_transfer/1 (content\stat_transfer): fields read from the records the mods ship. `vrfw check` validates the files with it and the ModManager draws their forms from it.
schema = "VRFW.decl_schema/1"
kind = "CharacterReforged.stat_transfer/1"
folder = "content/stat_transfer"
# v2 words, read beside the v1 ones until the switch: the type and its kind folder.
v2_type = "CharacterReforged.Character.StatTransfer"
v2_kind_folder = "Characters/StatTransfers"
label = "Stat transfer"
label_es = "Transferencia de estadísticas"

[entry.StatTransfer]
single = true
favoured = { type = "number" }
other = { type = "number" }
ideal_favoured = { type = "number" }
ideal_other = { type = "number" }
stamina_resource = { type = "string" }
favoured_by = { type = "table" }
