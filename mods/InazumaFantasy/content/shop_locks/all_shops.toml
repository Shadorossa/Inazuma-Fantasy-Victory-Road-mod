schema = "VRFW.shop_lock/1"
# Every shop lists its not-yet-sold rows as locked; the text below names the one global flag without a match of its own.

[[VRFW.ShopLock]]
name = "all_shops"
all_shops = true

# GetGlobalBitFlag(0x2CB86A25): the story's ending
[[VRFW.ShopLockText]]
name = "story_complete"
flags = ["0x2CB86A25"]
text = "InazumaFantasy.shop_lock_story_complete"
