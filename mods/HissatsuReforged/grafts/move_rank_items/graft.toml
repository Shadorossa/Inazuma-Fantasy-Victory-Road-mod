# Hissatsu Reforged's move-rank items used from the skill views (docs/game/mechanics/move-rank-items.md; owner 2026-10-14:
# «el libro y el cuaderno, usables en ambas vistas, de HissatsuReforged»). The Libro de mejora de supertécnica (+1 level, up
# to the second-to-last) or the Cuaderno de evolución definitiva (second-to-last -> last level), whichever applies to
# the move's grade; ids, caps and rules are Hissatsu Reforged's script (CMND_HISSATSUREFORGED_RANK_ITEMS / _RANK_ITEM), texts
# its text\rows\rank_items.toml. HOOK files only (graft [[hooks]], shipped as is; GENERATED by gen_hooks.py from the
# *.src.lua sources + rank_items_core.src.lua):
#   * vrfw_skill_slot_menu (Character Reforged's «Fantasy» skill table): the function HissatsuReforged.skill_table_rank_item of
#     the row action this mod declares on that screen's host (content\menus\skill_table_rank_items.toml, host
#     CharacterReforged.skill_table.row_action, Character Reforged's graft skill_table_host): CMD_FUNC1 (Start) on a
#     move row, Sí / No window, the rows redrawn;
#   * ability_learning_board_menu (Victory Road's own board): Start (CMD_FUNC1) on a move piece (the retail quick bean
#     equip, the screen's OpenBeansSetMenu, is withheld there; elsewhere it stays), two presses through the board's
#     telop (the native board keeps its input: no window over it), the guide entry «<Start> Subir nivel» over the
#     retail Start entry through VRFW.footer_prompts (Replaces, Attach). Owner 2026-10-14: Start in both views, as in
#     Inazuma Fantasy.
# Until 2026-10-14 this was a text block built into the skill table script by Character Reforged (mod =
# CharacterReforged, rebuilt by Inazuma Fantasy), which put Hissatsu Reforged's code in the screen's mod; now the screen
# only offers the place and Hissatsu Reforged owns the use. Without Hissatsu Reforged nothing is declared or loaded.
name = "move_rank_items"
mod = "HissatsuReforged"
order = 220
module = "lua_bridge"
requires = []
conflicts = []
wraps = []
description = "Hissatsu Reforged: the move-rank items used from the Fantasy skill table and from Victory Road's board"

[[hooks]]
stem = "vrfw_skill_slot_menu"
source = "rank_items_skill_table.lua"
require = ["CharacterReforgedSkillTableOpenOriginalBoard", "CharacterReforgedSkillTablePickCoroutine"]

[[hooks]]
stem = "ability_learning_board_menu"
source = "rank_items_board.lua"
