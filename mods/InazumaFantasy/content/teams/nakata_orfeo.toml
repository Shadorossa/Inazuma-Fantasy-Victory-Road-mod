schema = "VRFW.team/2"
# Orfeo (IE3) fields Hidetoshi Nakata's basic card (content\characters\nakata_hidetoshi.toml) in slot 8, shirt 7, the
# number the game's squad leaves free. Giacomo Yani, slot 8 until now, goes to the bench (slot 15) with his row and his
# shirt. A row without moves plays the card's own learn list.
# A team `based_on` this one is copied before the edits, and Battle Bay Deluxe's has its own roster, so each copy of
# Orfeo that plays in the game's place gets the same change, only while its mod is active.

# tm_cro_ie3_1100: the game's Orfeo; tm_cro_ie3_1120: the same roster, the game's row of difficulty 10.
[[edit]]
target = "tm_cro_ie3_1100"           # Orfeo
  [[edit.member]]
  slot = 8
  card = 0xFFF7C4EE                  # InazumaFantasy.nakata_hidetoshi
  number = 7
  [[edit.member]]
  slot = 15
  card = 0x8D990445                  # Giacomo Yani
  number = 8

[[edit]]
target = "tm_cro_ie3_1120"           # Orfeo (difficulty 10 row)
  [[edit.member]]
  slot = 8
  card = 0xFFF7C4EE                  # InazumaFantasy.nakata_hidetoshi
  number = 7
  [[edit.member]]
  slot = 15
  card = 0x8D990445                  # Giacomo Yani
  number = 8

# Battle Bay Deluxe's Orfeo: its members' move lists are all at level 1.
[[edit]]
target = "bbcr_ie3_1100_bb"
if_mod = "BattleBayDeluxe"
  [[edit.member]]
  slot = 8
  card = 0xFFF7C4EE                  # InazumaFantasy.nakata_hidetoshi
  number = 7
  moves = [0xA5F2EFEA, 0x31ABD82E, 0x427719AC, 0x5E233E68]  # Brave Shot, Circus Block, Gale Dash, Super Elastico
  levels = [1, 1, 1, 1]
  [[edit.member]]
  slot = 15
  card = 0x8D990445                  # Giacomo Yani
  number = 8

# Chronicle Deluxe's own Orfeo (fbtl_cro03_110_010) is that mod's team: it makes the same change itself, in
# ChronicleDeluxe/content/teams/12_ie3/0311_ie3_orfeo_nakata.toml.
