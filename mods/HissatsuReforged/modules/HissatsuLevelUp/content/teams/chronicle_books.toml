schema = "VRFW.team/2"
# The technique level-up books a Chronicle Deluxe rival drops (docs/framework/drops.md §1c): one more drop rarity (22)
# in the drops of the Chronicle board's match rows that Chronicle Deluxe gives its rival drops, by battle tier. Each
# row keeps its own rates and tables; the books' rate is lowered when the row's drops would pass 100 %.
# Rate = percent per drop roll (one roll per goal of the player's team, kept on a win). The books and their weights
# are the loot tables in content\base_tables\gamedata\item\win_treasure_lot_table_config.toml.

# Batalla de crónica (1) and the gate battle that stands in for it (2): Mejora de supertécnica, 1 %
[[VRFW.DropRaritySlot]]
Rows = "chronicle_board"
SetBy = "ChronicleDeluxe"
IfMod = "ChronicleDeluxe"
Difficulties = [1, 2]
Rarity = 22
Rate = 1.0
Table = "HissatsuLevelUp.chronicle_books.chronicle"

# Batalla heroica (4): Mejora de supertécnica 2 % and Cuaderno de evolución definitiva 0.5 % (2.5 % in all)
[[VRFW.DropRaritySlot]]
Rows = "chronicle_board"
SetBy = "ChronicleDeluxe"
IfMod = "ChronicleDeluxe"
Difficulties = [4]
Rarity = 22
Rate = 2.5
Table = "HissatsuLevelUp.chronicle_books.heroic"
