schema = "VRFW.game/2"

# ------------------------------------------------------------------------------------------------ functions

[[VRFW.Struct]]
name = "PassiveCharaRecord"
size = 0x1C0
fields = { build = { at = 0x49, type = "u8" }, diamond_build = { at = 0x4B, type = "u8" }, badge = { at = 0x1BC, type = "u32" } }

# [g_gameRoot] + Game.RootItems = the inventory InventoryRecord takes
[[VRFW.Global]]
name = "better_qol_inventory"
base = "game_root"
chain = ["Game.RootItems"]

[[VRFW.Global]]
name = "better_qol_team_sets"
base = "game_root"
chain = ["Game.RootParty"]

# [g_gameRoot] + Game.RootMatch = the match info (+0x2C29 the user's match team, 0 / 1)
[[VRFW.Global]]
name = "better_qol_match_info"
base = "game_root"
chain = ["Game.RootMatch"]

# ------------------------------------------------------------------------------------------------ slot readers

# u32* GetTeamPassiveId(u32* out, u32 charaHdl, u8 slot, u8 useCopy) 0xE80A70: the engine's single passive slot reader.
[[VRFW.Hook]]
name = "GetTeamPassiveId"
game = "Passive.TeamPassiveId"
kind = "function"

# first: a declared off mode ([[off_mode]]) is current: every slot reads 0; key = mode id, entry 0
[[VRFW.Hook.answer]]
table = "PassiveConfig.OffMode"
key = ["state(mode.current)"]
write = "[args[1]]:u32"

[[VRFW.Hook.answer]]
table = "PassiveConfig.Slots"
key = ["slot", "owner(args[2])", "args[3]"]
write = "[args[1]]:u32"

# else the character's own passive (chara_param cols 61-65): key (param, slot); not for coach / manager or build slots
[[VRFW.Hook.answer]]
table = "PassiveConfig.Own"
key = ["[record(args[2]) + 4]:u32", "args[3]"]
when = [
  { value = "[record(args[2]) + 0x1BC]:u32", equals = 0 },
  { value = ["[record(args[2]) + 0x10]:u32", "args[3]"], not_in_table = "PassiveConfig.OwnKept" },
]
write = "[args[1]]:u32"

# bool IsTeamPassiveUnlocked(u32 charaHdl, u8 slot, u8 useCopy) 0xE80C30.
[[VRFW.Hook]]
name = "IsTeamPassiveUnlocked"
game = "Passive.TeamPassiveUnlocked"
kind = "function"
returns = "bool"

# first: in a declared off mode no slot is unlocked (entry 0)
[[VRFW.Hook.answer]]
table = "PassiveConfig.OffMode"
key = ["state(mode.current)"]

[[VRFW.Hook.answer]]
table = "PassiveConfig.Unlock"
key = ["slot", "owner(args[1])", "args[2]"]

# [passives] unlock = "all": every non-empty slot of a configurable saved player works; key = save slot
[[VRFW.Hook.answer]]
table = "PassiveConfig.AllOpen"
key = ["slot"]
when = [
  { value = "owner(args[1])", not = 0 },
  { value = "[record(owner(args[1])) + 0x1BC]:u32", equals = 0 },
  { value = "[record(args[1]) + 0xEC + args[2] * 12]:u32", not = 0 },
]

# [passives] always_unlocked: a slot holding an own passive works (same conditions as the own passive above)
[[VRFW.Hook.answer]]
table = "PassiveConfig.OwnOpen"
key = ["[record(args[1]) + 4]:u32", "args[2]"]
when = [
  { value = "[record(args[1]) + 0x1BC]:u32", equals = 0 },
  { value = ["[record(args[1]) + 0x10]:u32", "args[2]"], not_in_table = "PassiveConfig.OwnKept" },
]

# ------------------------------------------------------------------------------------------------ what other readers see

# 1 while a declared off mode is current, else 0.
[[VRFW.State]]
key = "BetterQoL.passives_off"
formula = "lookup_or(PassiveConfig.OffMode, 1, state(mode.current)) == 0"

[[VRFW.CommandFilter]]
name = "PassiveConfig.CharaTeamPassiveInfo"
command = 0xF3483CE9
handler = "BetterQoL.PassiveConfig.PlateInfo"
needs = ["GetTeamPassiveId", "IsTeamPassiveUnlocked"]

[[VRFW.CommandFilter]]
name = "PassiveConfig.CanInherit"
command = 0x40A079E0
handler = "BetterQoL.PassiveConfig.CanInherit"
needs = ["GetTeamPassiveId"]

[[VRFW.CommandFilter]]
name = "PassiveConfig.InheritId"
command = 0xE1611D0F
handler = "BetterQoL.PassiveConfig.InheritId"
needs = ["GetTeamPassiveId"]

# 0xB5948BCF(hdl, slot): the retail clear menu clears the configured slot
[[VRFW.CommandFilter]]
name = "PassiveConfig.InheritClear"
command = 0xB5948BCF
handler = "BetterQoL.PassiveConfig.InheritClear"
needs = ["GetTeamPassiveId"]

# 0x4375DC93(hdl, 36): the archetype icon (archetype mode); the list's pseudo handles answer 0 for every field
[[VRFW.CommandFilter]]
name = "PassiveConfig.CharaBuild"
command = 0x4375DC93
handler = "BetterQoL.PassiveConfig.CharaStatus"
needs = ["GetTeamPassiveId"]

[[VRFW.CommandFilter]]
name = "PassiveConfig.CharaBuild2"
command = 0x2B16FA30
handler = "BetterQoL.PassiveConfig.CharaBuild"
needs = ["GetTeamPassiveId"]

[[VRFW.CommandFilter]]
name = "PassiveConfig.ParamBuild"
command = 0xF2048EB0
handler = "BetterQoL.PassiveConfig.ParamBuild"
needs = ["GetTeamPassiveId"]

[[VRFW.CommandFilter]]
name = "PassiveConfig.EffBuild"
command = 0x20E64C3F
handler = "BetterQoL.PassiveConfig.EffBuild"
needs = ["GetTeamPassiveId"]

# ------------------------------------------------------------------------------------------------ configurator commands

[[VRFW.Command]]
name = "CMND_BETTERQOL_PC_OFF"
handler = "BetterQoL.PassiveConfig.Off"
needs = ["GetTeamPassiveId"]

[[VRFW.Command]]
name = "CMND_BETTERQOL_PC_INFO"
handler = "BetterQoL.PassiveConfig.Info"
needs = ["GetTeamPassiveId"]

[[VRFW.Command]]
name = "CMND_BETTERQOL_PC_STATE"       # (hdl) -> "param=.. build=.. diamond_build=.. passives=s1,..,s5" (the hero style log)
handler = "BetterQoL.PassiveConfig.State"
needs = ["GetTeamPassiveId"]

[[VRFW.Command]]
name = "CMND_BETTERQOL_PC_SLOT"
handler = "BetterQoL.PassiveConfig.Slot"
needs = ["GetTeamPassiveId"]

[[VRFW.Command]]
name = "CMND_BETTERQOL_PC_LIST"        # (hdl, slot, category) -> count, category, current index
handler = "BetterQoL.PassiveConfig.List"
needs = ["GetTeamPassiveId"]

[[VRFW.Command]]
name = "CMND_BETTERQOL_PC_LIST_ID"     # (index) -> id
handler = "BetterQoL.PassiveConfig.ListId"
needs = ["GetTeamPassiveId"]

[[VRFW.Command]]
name = "CMND_BETTERQOL_PC_CAT_NEXT"    # (hdl, slot, category, dir) -> category
handler = "BetterQoL.PassiveConfig.CatNext"
needs = ["GetTeamPassiveId"]

[[VRFW.Command]]
name = "CMND_BETTERQOL_PC_SET"         # (hdl, slot, id) -> ok, code (0 ok, 1-7 SetError)
handler = "BetterQoL.PassiveConfig.Set"
needs = ["GetTeamPassiveId"]

[[VRFW.Command]]
name = "CMND_BETTERQOL_PC_RESET"       # (hdl) -> ok
handler = "BetterQoL.PassiveConfig.Reset"
needs = ["GetTeamPassiveId"]

[[VRFW.Command]]
name = "CMND_BETTERQOL_PC_SPECIAL"
handler = "BetterQoL.PassiveConfig.Special"
needs = ["GetTeamPassiveId"]

[[VRFW.Command]]
name = "CMND_BETTERQOL_PC_EFF_ICON"    # (effect) -> sprite crc (0 = retail icon)
handler = "BetterQoL.PassiveConfig.EffIcon"
needs = ["GetTeamPassiveId"]
