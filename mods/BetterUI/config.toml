
# No team editor between the VS screen and the walk-in in offline matches (scripts\prematch_editor.lua).
skip_prematch_editor = true

slanted_kizuna = true

# The card colour of each player position wherever cards are coloured by position (ClassicCards position looks).
[position_card_looks]
goalkeeper = "goalkeeper"
defender = "midfielder"
midfielder = "defender"
forward = "forward"

[formation_card_spread]
enabled = true
card_width = 154
card_height = 116
gap = 6               # space kept between two cards that had to move
smallest_scale = 0.8  # the smallest card size tried when moving is not enough
scale_step = 0.05     # the size steps tried from 1 down to smallest_scale
pitch_side = 300
pitch_top = 262       # the highest card centre (the far goal line is at 278)
pitch_bottom = -323   # the lowest card centre (the own goal line is at -381)

# The duel counter's plates (screen betterui_power_counter_menu; read once per opening).
[duel_counter]
# Where a plate's total sits on its ribbon, in the plate's own units (1 unit = 0.75 px on screen); both sides keep the same gap from their label, room for six digits.
left_number_x = 389
right_number_x = -310
# px on screen a move's name may take under the digits: the two totals are 431 px apart, so the two names never touch.
label_room = 420
# Frames between a bust's model being complete and its mesh showing (an empty capture cell draws white).
bust_settle_frames = 2
# px on screen from a plate's total to its «critical» tag (the tag's centre; both counters, duel and shot); the tag sits centred above the total.
tag_x = 0
tag_y = 40
