schema = "VRFW.rule/1"
# Ruleset of the 5 vs 5 friendlies without special tactics or referee (Football Reforged):
# the retail 5v5 friendly (the framework's friendly_5v5: 15', one period, 5 a
# side, no extra time or penalties) with the 4 special-tactics slots of both teams locked and no referee (no fouls,
# cards, penalties for fouls or offside). Picked by a friendly with `ruleset = "friendly_5v5_no_tactics_or_referee"`.
id = "friendly_5v5_no_tactics_or_referee"
name = "5-a-side friendly (no tactics or referee)"   # fallback; the game shows the text key FootballReforged.ruleset_friendly_5v5_no_tactics_or_referee
version = 1

[time]
half_minutes = 15
halves = 1

[teams]
players = 5

[play]
tactics = false            # no special tactics (the 4 tactics slots of both teams locked)
referee = false            # no referee: no fouls, cards, penalties for fouls or offside

[end]
extra_time = false
golden_goal = false
penalties = false
