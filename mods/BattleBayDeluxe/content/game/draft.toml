# The Draft's native access as data (schema VRFW.game/1, docs/internal/native.md), used by scripts\draft.lua.
schema = "VRFW.game/1"

# ---------------------------------------------------------------- functions
[[VRFW.Function]]
# FindCharaRecord(container, const u32* hdl) 0xD7F3E0 (vr_sys::sigs::BOARD_FIND_RECORD): the Draft tile's avatar.
name = "FindCharaRecord"
pattern = "40 53 48 83 EC 20 44 8B 0A 48 8B DA 45 85 C9 74 39 48 8B 01 41 8B D1 81 E2 FF 0F 00 00 4C 8B 40 40"
rva = 0xD7F3E0
arguments = ["ptr", "ptr"]
returns = "ptr"

[[VRFW.Function]]
name = "RosterRowsCode"
pattern = "45 0F B7 68 28 4D 89 73 D0 45 33 F6 66 44 89 6C 24 30 45 85 C9 0F 84 ?? ?? ?? ?? 41 0F 29 73 B8 66 0F 6F 35 ?? ?? ?? ?? 41 8B C1 4D 89 63 E0 48 89 44 24 50 4D 89 7B C8 49 0F BF C5 85 C0 0F 88 ?? ?? ?? ?? 41 3B 42 70 0F 8D ?? ?? ?? ?? 4C 6B F8 54 48 8B D0 4D 03 7A 68"
alt = ["41 0F B7 58 28 49 89 73 E0 33 F6 4D 89 73 D0 45 33 F6 66 89 5C 24 ?? 89 44 24 ?? 39 44 24 ?? 0F 86 ?? ?? ?? ?? 8B 54 24 ?? 41 0F 29 73 B8 66 0F 6F 35 ?? ?? ?? ?? 4D 89 6B D8 4D 89 7B C8 0F 1F 44 00 00 48 0F BF DB 85 DB 0F 88 ?? ?? ?? ?? 41 3B 59 70 0F 8D ?? ?? ?? ?? 4C 6B FB 54 48 8B C3 4D 03 79 68"]
rva = 0xE9AC9B

[[VRFW.Function]]
# Layout guard, never called: 0xE9AEB8 `mov r8d,[r15+20h]` = the member's chara_param id (MemberRow.param).
name = "RosterParamCode"
pattern = "45 8B 47 20 0F 1F 40 00 44 3B 40 04 74 0B 48 83 C0 0C"
alt = ["45 8B 47 20 66 0F 1F 44 00 00 44 3B 40 04 74 0B 48 83 C0 0C"]   # v7.2.1 0xEA47A6 (a longer nop)
rva = 0xE9AEB8

[[VRFW.Function]]
# Layout guard, never called: 0xE9AF13 `movzx eax,byte [r15+47h]` = the member's roster slot (MemberRow.slot).
name = "RosterSlotCode"
pattern = "41 0F B6 47 47 88 44 24 74 41 0F B6 47 49 66 89 44 24 76 41 8B 47 40 83 C8 40 4C 89 65 70"
alt = ["41 0F B6 47 47 88 45 DC 41 0F B6 47 49 66 89 45 DE 41 8B 47 40 83 C8 40 4C 89 AD 80 00 00 00"]   # v7.2.1 0xEA4803 (locals on rbp)
rva = 0xE9AF13

# ---------------------------------------------------------------- globals ([[g_gameRoot]+…])
[[VRFW.Global]]
# the Kizuna town object: +0x15610 the avatar's chara handle, +0x15614 its index (0 = the avatar)
name = "kizuna"
base = "game_root"
chain = ["Game.RootKizunaTown"]

[[VRFW.Global]]
name = "chara_containers"
base = "game_root"
chain = ["ROOT_CHARA_CONTAINERS"]

# ---------------------------------------------------------------- structs (BuildRoster 0xE9AC40 reads the same layout)
[[VRFW.Struct]]
name = "TeamRecord"
size = 0x30
fields = { formation = { at = 0x18, type = "u32" }, first = { at = 0x28, type = "u32" }, count = { at = 0x2C, type = "u32" } }

[[VRFW.Struct]]
name = "TeamConfig"
size = 0x78
fields = { members = { at = 0x68, type = "ptr" }, member_count = { at = 0x70, type = "i32" } }

[[VRFW.Struct]]
name = "MemberRow"
size = 0x54
fields = { param = { at = 0x20, type = "u32" }, uid = { at = 0x24, type = "u32" }, loadout = { at = 0x28, type = "u32" }, slot = { at = 0x47, type = "u8" } }

[[VRFW.Struct]]
name = "Kizuna"
size = 0x15618
fields = { avatar = { at = 0x15610, type = "u32" }, avatar_index = { at = 0x15614, type = "u8" } }

[[VRFW.Command]]
# -> ok, team, phase (0 none, 1 picking, 2 complete, 3 campaign), filled, total
name = "CMND_BATTLEBAYDELUXE_DRAFT_INFO"
handler = "BattleBayDeluxe.DraftInfo"
needs = ["Team.FindConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
# row (-1 = read), dir -> ok, scouts, gender, the pool fills a draft, its size
name = "CMND_BATTLEBAYDELUXE_DRAFT_FILTERS"
handler = "BattleBayDeluxe.DraftFilters"
needs = ["Team.FindConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
# filtered (1 = the panel's filters) -> ok, total: a new draft (placeholders written back first)
name = "CMND_BATTLEBAYDELUXE_DRAFT_BEGIN"
handler = "BattleBayDeluxe.DraftBegin"
needs = ["Team.FindConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
# -> ok, n: the number of places
name = "CMND_BATTLEBAYDELUXE_DRAFT_SLOTS"
handler = "BattleBayDeluxe.DraftSlots"
needs = ["Team.FindConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
# k -> ok, slot, pos, x, y, param or 0, placeholder (one place per call: the engine caps the answers)
name = "CMND_BATTLEBAYDELUXE_DRAFT_SLOT"
handler = "BattleBayDeluxe.DraftSlot"
needs = ["Team.FindConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
# k -> ok, k, slot, pos, n, (param, pos, team) x n: the offer of place k (stable until picked)
name = "CMND_BATTLEBAYDELUXE_DRAFT_CANDIDATES"
handler = "BattleBayDeluxe.DraftCandidates"
needs = ["Team.FindConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
# k, i -> ok, done, slot, param, filled: candidate i of place k taken, the rows written
name = "CMND_BATTLEBAYDELUXE_DRAFT_PICK"
handler = "BattleBayDeluxe.DraftPick"
needs = ["Team.FindConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
# -> true: placeholders back, no draft (a running draft campaign is kept)
name = "CMND_BATTLEBAYDELUXE_DRAFT_ABANDON"
handler = "BattleBayDeluxe.DraftAbandon"
needs = ["Team.FindConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_DRAFT_DECIDE"
handler = "BattleBayDeluxe.DraftDecide"
needs = ["GameDecide", "GridMenu", "GridSlot", "Team.FindConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_DRAFT_FORMATIONS"
handler = "BattleBayDeluxe.DraftFormations"
needs = ["Team.FindConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
# formation -> ok: the draft plays it (starter places move, picks stay on their slots)
name = "CMND_BATTLEBAYDELUXE_DRAFT_SET_FORMATION"
handler = "BattleBayDeluxe.DraftSetFormation"
needs = ["Team.FindConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_DRAFT_PACK"
handler = "BattleBayDeluxe.DraftPack"

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_DRAFT_MOUSE"
handler = "BattleBayDeluxe.DraftMouse"

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_DRAFT_PITCH"
handler = "BattleBayDeluxe.DraftPitch"

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_FORMATION_PLACE"
handler = "BattleBayDeluxe.FormationPlace"

# ---------------------------------------------------------------- what other readers see (game_state)
[[VRFW.State]]
key = "BattleBayDeluxe.draft.team"
fallback = 0
needs = ["Team.FindConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]

[[VRFW.State]]
# 0 none, 1 picking, 2 complete, 3 campaign
key = "BattleBayDeluxe.draft.phase"
fallback = 0
needs = ["Team.FindConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]
