# The «Active team» tile's native access as data.
schema = "VRFW.game/1"

[[VRFW.Global]]
# the party block (CGDDPartyStatus): +0x9F10 the VS team set in use, +0x9F13 the same in play mode 2
name = "active_team_party"
base = "game_root"
chain = ["Game.RootParty"]

[[VRFW.State]]
# the address of the native block the StartMatchRequest answers mark a tile request in (set by scripts\active_team.lua)
key = "BattleBayDeluxe.active_team.request_mark"

[[VRFW.State]]
# the address of the native block that holds the tile a request names (the answers below turn it into 0)
key = "BattleBayDeluxe.active_team.request_tile"

[[VRFW.Struct]]
name = "ActiveTeamRecord"
size = 0x30
fields = { uniform = { at = 0x1C, type = "u32" }, emblem = { at = 0x20, type = "u32" } }

# the Draft team carries the active team's kit and name; its crest stays its own.
[[VRFW.Hook]]
name = "TeamLookBuild"
kind = "function"
pattern = "48 89 5C 24 20 55 56 57 41 54 41 55 41 56 41 57 48 8D 6C 24 E9 48 81 EC A0 00 00 00 45 33 ED 33 C0 4C 89 29 0F 57 C0 4C 89 69 08 4C 8B F1"
rva = 0xEA5060
steal = 14
arguments = ["ptr", "ptr", "ptr", "u32", "ptr", "u8"]
returns = "ptr"

# the record's team id (+0) has a name in the table: that name as the match team set's name (out +0x60).
[[VRFW.Hook.answer]]
phase = "post"
when = [
  { value = "args[1]", not = 0 },
  { value = "args[2]", not = 0 },
  { value = "[args[2]]:u32", in_table = "BattleBayDeluxe.TeamName" },
]
value = "lookup(BattleBayDeluxe.TeamName, [args[2]]:u32)"
write = "[args[1] + 0x60]:u64"

[[VRFW.Hook]]
name = "StartMatchRequest"
game = "Match.StartRequest"
kind = "function"
# the script's handler writes the team set and the level sync of the match: it waits for a busy script VM

[[VRFW.Hook.answer]]
phase = "pre"
when = [
  { value = "[args[2] + 0xA0]:u8", equals = 1 },
  { value = "[args[2] + 0xA4]:u32", in_table = "BattleBayDeluxe.ActiveTeam" },
]
value = "args[2]"
write = "[state(BattleBayDeluxe.active_team.request_mark)]:u64"

[[VRFW.Hook.answer]]
phase = "pre"
value = "0"
write = "[state(BattleBayDeluxe.active_team.request_mark)]:u64"

[[VRFW.Hook.answer]]
phase = "pre"
when = [
  { value = "[args[2] + 0xA0]:u8", equals = 1 },
  { value = "[args[2] + 0xA4]:u32", in_table = "BattleBayDeluxe.ActiveTeam" },
]
value = "[args[2] + 0xA4]:u32"
write = "[state(BattleBayDeluxe.active_team.request_tile)]:u64"

[[VRFW.Hook.answer]]
phase = "pre"
when = [
  { value = "[args[2] + 0xA0]:u8", equals = 1 },
  { value = "[args[2] + 0xA4]:u32", in_table = "BattleBayDeluxe.ActiveTeam" },
]
value = "lookup(BattleBayDeluxe.ActiveSet, [args[2] + 0xA4]:u32)"
write = "[args[2] + 0xC0]:u8"

# the player's team of a Battle Bay request (+0xA0 = 1) is the Active team tile: 0 = the player's active team
[[VRFW.Hook.answer]]
phase = "pre"
when = [
  { value = "[args[2] + 0xA0]:u8", equals = 1 },
  { value = "[args[2] + 0xA4]:u32", in_table = "BattleBayDeluxe.ActiveTeam" },
]
value = "0"
write = "[args[2] + 0xA4]:u32"

# The Torneo's final is played in its drawn stadium.
[[VRFW.Hook.answer]]
phase = "pre"
when = [
  { value = "[args[2] + 0xA0]:u8", equals = 1 },
  { value = "0", in_table = "BattleBayDeluxe.FinalStadium" },
]
value = "lookup(BattleBayDeluxe.FinalStadium, 0)"
write = "[args[2] + 0x88]:u32"

# the active team set mirrored onto the tile.
[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_ACTIVE_TEAM_MIRROR"
handler = "BattleBayDeluxe.ActiveTeamMirror"
needs = ["Team.FindConfig", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow", "ActiveTeamRecord"]

# -> "team:dock,..." of the Personal Teams tiles.
[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_PERSONAL_DOCKS"
handler = "BattleBayDeluxe.PersonalDocks"

# (team, 1 = the tile's dock has 11 starters) -> ok
[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_PERSONAL_DOCK_READY"
handler = "BattleBayDeluxe.PersonalDockReady"

# the level sync of the active team's match stats.
[[VRFW.Hook]]
name = "MatchStatLevel"
game = "Match.BuildCharaLevelCall"
kind = "call"
arguments = ["ptr", "ptr"]
returns = "u16"

# no table entry = the game's level
[[VRFW.Hook.answer]]
phase = "post"
value = "min(ret, lookup(BattleBayDeluxe.LevelSync, 0))"
