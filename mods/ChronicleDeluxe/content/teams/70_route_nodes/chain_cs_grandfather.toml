    Item = 0x08E157E6             # ClassicEquipment.tezcat_bracelet (crc32 of the name); only with that module on
    if_mod = "ClassicEquipment"

  [[VRFW.Chain.Tile]]
  Id = "c19"
  Kind = "chest"
  Pos = [4, 2]                         # 3DS cell 19
    [[VRFW.Chain.Tile.Reward]]   # 3DS reward «Abuelo» (the player): this mod's character content/characters/grandfather.toml
    Player = "ChronicleDeluxe.grandfather"

