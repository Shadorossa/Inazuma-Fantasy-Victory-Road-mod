# Declaration schema of VRFW.extra_slot/1 (content\extra_slots): fields read from the records the mods ship. `vrfw check` validates the files with it and the ModManager draws their forms from it.
schema = "VRFW.decl_schema/1"
kind = "VRFW.extra_slot/1"
folder = "content/extra_slots"
# v2 words, read beside the v1 ones until the switch: the type, its kind folder and its format version.
v2_type = "VRFW.Character.ExtraSlot"
v2_kind_folder = "Characters/ExtraSlots"
v2_version = 1
label = "Extra slots"
label_es = "Ranuras extra"

[entry.ExtraSlotExtend]
slot = { type = "string", required = true }
source = { type = "table" }
rules = { type = "table" }
commands = { type = "table" }
swap = { type = "table" }
fusion = { type = "table" }
entry_cost = { type = "table" }

[entry.ExtraSlot]
name = { type = "name", required = true }
kind = { type = "string", required = true }
option = { type = "string", ref = "option" }
states = { type = "ints", required = true }
summon_states = { type = "ints" }
plate_states = { type = "ints", required = true }
lend_slot = { type = "string", required = true }
start_timeout_s = { type = "int", required = true }
restore_delay_s = { type = "number", required = true }
cooldown_s = { type = "int" }
disguise = { type = "bool", required = true }
preload = { type = "bool", required = true }
row_parity = { type = "bool" }
aura_row = { type = "bool" }
input = { type = "table" }
plate = { type = "records", fields = { key = { type = "string" }, pad = { type = "string" }, xinput = { type = "bool" } } }
select = { type = "table" }
select_pages = { type = "strings" }
select_peek_dx = { type = "int" }
select_peek_dy = { type = "int" }
direct = { type = "records", fields = { pages = { type = "strings", required = true }, pad = { type = "string" }, key = { type = "string" }, xinput = { type = "bool" }, pass_when_empty = { type = "bool" } } }
entry_cost = { type = "table" }
cpu = { type = "table" }
source = { type = "table", required = true }
spirit = { type = "table" }
commands = { type = "table", required = true }
fallback = { type = "bool" }
swap = { type = "table" }

[entry.DuelAura]
single = true
types = { type = "ints" }
