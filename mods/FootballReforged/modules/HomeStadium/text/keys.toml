schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Home Stadium"
mod_description = "Each of your teams gets a home stadium. Pick it in Team Dock among the stadiums you own, and that team plays its home friendlies there. Competition, Chronicle and Battle Bay keep their own stadiums."
row = "Home stadium"
row_help = "Pick this team's home stadium among the stadiums you own."
none = "No home stadium"
select_hint = "<CMD_ENTER> Accept      <CMD_BACK> Back"

[es.new]
mod_name = "Estadio local"
mod_description = "Cada uno de tus equipos tiene un estadio local. Elígelo en la Plantilla de equipo entre los estadios que tienes, y ese equipo juega allí sus amistosos en casa. Competición, Crónica y Bahía Batalla mantienen sus estadios."
row = "Estadio local"
row_help = "Elige el estadio local de este equipo entre los estadios que tienes."
none = "Sin estadio local"
select_hint = "<CMD_ENTER> Aceptar      <CMD_BACK> Volver"

[fr.new]
mod_name = "Stade à domicile"
mod_description = "Chacune de tes équipes a un stade à domicile. Choisis-le dans la Composition d'équipe parmi les stades que tu possèdes, et cette équipe y joue ses matchs amicaux à domicile. Compétition, Chronique et Baie Bataille gardent leurs propres stades."
row = "Stade à domicile"
row_help = "Choisis le stade à domicile de cette équipe parmi tes stades."
none = "Aucun stade à domicile"
select_hint = "<CMD_ENTER> Valider      <CMD_BACK> Retour"

[de.new]
mod_name = "Heimstadion"
mod_description = "Jedes deiner Teams bekommt ein Heimstadion. Wähle es in der Team-Bank unter den Stadien, die du besitzt, und dieses Team spielt dort seine Heim-Freundschaftsspiele. Wettbewerb, Chronik und Kampfbucht behalten ihre eigenen Stadien."
row = "Heimstadion"
row_help = "Wähle das Heimstadion dieses Teams aus deinen Stadien."
none = "Kein Heimstadion"
select_hint = "<CMD_ENTER> Bestätigen      <CMD_BACK> Zurück"

[it.new]
mod_name = "Stadio di casa"
mod_description = "Ognuna delle tue squadre ha uno stadio di casa. Sceglilo nello Slot Squadra tra gli stadi che possiedi, e quella squadra ci gioca le sue amichevoli in casa. Competizione, Cronaca e Baia Battaglia mantengono i loro stadi."
row = "Stadio di casa"
row_help = "Scegli lo stadio di casa di questa squadra tra quelli che possiedi."
none = "Nessuno stadio di casa"
select_hint = "<CMD_ENTER> Conferma      <CMD_BACK> Indietro"

[pt.new]
mod_name = "Estádio da casa"
mod_description = "Cada uma das tuas equipas tem um estádio da casa. Escolhe-o no Clube entre os estádios que tens, e essa equipa joga lá os seus amigáveis em casa. Competição, Crónica e Baía Batalha mantêm os seus estádios."
row = "Estádio da casa"
row_help = "Escolhe o estádio da casa desta equipa entre os estádios que tens."
none = "Sem estádio da casa"
select_hint = "<CMD_ENTER> Aceitar      <CMD_BACK> Voltar"

[ja.new]
mod_name = "ホームスタジアム"
mod_description = "自分の各チームにホームスタジアムを設定できます。チームドックで、所持しているスタジアムから選ぶと、そのチームのホームの練習試合がそこで行われます。大会・クロニクル・BBスタジアムでは、それぞれ専用のスタジアムのままです。"
row = "ホームスタジアム"
row_help = "このチームのホームスタジアムを、所有するスタジアムから選ぶ。"
none = "ホームスタジアムなし"
select_hint = "<CMD_ENTER> 決定      <CMD_BACK> 戻る"

[zh_hans.new]
mod_name = "主场球场"
mod_description = "每支队伍都可以拥有一座主场球场。在编组队伍中从你拥有的球场里选择，该队的主场友谊赛就会在那里进行。大会、编年史和BB体育场仍使用各自的球场。"
row = "主场球场"
row_help = "从你拥有的球场中为这支队伍选择主场球场。"
none = "无主场球场"
select_hint = "<CMD_ENTER> 确定      <CMD_BACK> 返回"

[zh_hant.new]
mod_name = "主場球場"
mod_description = "每支隊伍都可以擁有一座主場球場。在編組隊伍中從你擁有的球場裡選擇，該隊的主場友誼賽就會在那裡進行。大會、編年史和BB體育場仍使用各自的球場。"
row = "主場球場"
row_help = "從你擁有的球場中為這支隊伍選擇主場球場。"
none = "無主場球場"
select_hint = "<CMD_ENTER> 確定      <CMD_BACK> 返回"
