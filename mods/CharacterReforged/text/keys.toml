[de.new]
mod_name = "Character Reforged"
mod_description = "Die Basis der Charakter-Mods. Jeder Charakter bekommt eigene Werte und Techniken, das Maximallevel steigt auf 200, und das Fähigkeitsbrett wird zu einer erweiterten Tabelle mit 6 Spezialtechniken, einem Aura-Platz und einem Misch-Platz. Dazu kommen eine seitenweise Spielerseite mit 3D-Modell und Wertebalken, Wertetraining mit freien Punkten, Miximax zwischen zwei beliebigen Spielern und alle Keshin mit ihrer Rüstung, dazu Optionen für Gegenstands-Transformationen, Keshin und Totems mit Punkten statt Zeit und eine Ausdauerleiste für jeden Spieler."
create_refused_1 = "Dieser Spieler ist keine deiner Karten."
create_refused_2 = "Der Partner ist keine deiner Karten."
