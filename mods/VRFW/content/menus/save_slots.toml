# vrfw_save_slot_menu: 11 layers; base savedata_management_menu. The cards are a carousel (VRFW.layer_carousel): every band and
# window locator is the centre card's place and the screen script moves the instances. Band instances 0..5 are the cards,
# 6..11 the group chips, 12..35 the position marks; window instances 0..5 are the cards.
[[screen]]
name = "vrfw_save_slot_menu"
like = "language_option_menu"
base = "savedata_management_menu"
script = "assets/lua/screens/vrfw_save_slot_menu.lua"

# lists as in savedata_management_menu: res
[screen.rows]
layer = [
    { layer = "save01_01_list_attach_base", object = "vrfw_save01_01_slot_base" },
    { layer = "save01_02_list_item", object = "vrfw_save01_02_tab", count = 36 },
    { layer = "save01_03_detail_window_attach_base", object = "vrfw_save01_03_slot_base" },
    { layer = "save01_04_savedata_detail_window", object = "vrfw_save01_04_card", count = 6 },
    { layer = "mainmenu90_00_background" },
    { layer = "mainmenu90_01_header" },
    { layer = "mainmenu90_05_content_guide_line01" },
    { layer = "cmn05_01_cursor" },
    { layer = "mainmenu01_10_return_arrow_button_guide" },
    { layer = "mainmenu01_06_base_button_guide" },
    { layer = "mainmenu01_07_button_guide" },
]
commands = [
    { layer = "save01_02_list_item", input = "CMD_ENTER", command = "CMD_ENTER", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_BACK", command = "CMD_BACK", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_UP", command = "CMD_FUNCTION", arg = "vrfw_slot_previous", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_LEFT", command = "CMD_FUNCTION", arg = "vrfw_slot_previous", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_DOWN", command = "CMD_FUNCTION", arg = "vrfw_slot_next", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_RIGHT", command = "CMD_FUNCTION", arg = "vrfw_slot_next", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_FUNC1", command = "CMD_FUNCTION", arg = "vrfw_slot_rename", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_FUNC3", command = "CMD_FUNCTION", arg = "vrfw_slot_delete", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_FUNC4", command = "CMD_FUNCTION", arg = 0xCA3E2567, flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_MOUSE_RIGHT_CLICK", command = "CMD_BACK", flag = 1 },
]
group_base = [
    { layer = "mainmenu90_00_background", flags = [0, 1, 1, 0, 1, 0] },
    { layer = "mainmenu90_01_header", flags = [0, 1, 1, 0, 1, 0] },
    { layer = "cmn05_01_cursor", flags = [0, 0, 1, 0, 1, 0] },
    { layer = "save01_01_list_attach_base", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "save01_02_list_item", flags = [1, 1, 0, 0, 1, 0] },
    { layer = "mainmenu90_05_content_guide_line01", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "save01_03_detail_window_attach_base", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "save01_04_savedata_detail_window", flags = [0, 0, 0, 0, 1, 0] },
    { layer = "mainmenu01_10_return_arrow_button_guide", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "mainmenu01_06_base_button_guide", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "mainmenu01_07_button_guide", flags = [0, 1, 0, 0, 1, 0] },
]
group = [
    { group = "common", slice = [0, 3] },
    { group = "vrfw_save_slot_menu", flags = [1], slice = [3, 8] },
]
focus_base = [
    [0x3A06AC3D, 0, 0],  # button
]
focus_group = [
    { layer = "save01_02_list_item", flags = [0, 0, 0], slice = [0, 1] },
]
shift_base = []
shift = []

