schema = "VRFW.team/2"
if_mod = "InazumaFantasy"
# With Inazuma Fantasy, this mod's Orfeo (fbtl_cro03_110_010) fields that mod's Hidetoshi Nakata card in slot 8, shirt 7,
# as the game's Orfeo does there (InazumaFantasy/content/teams/nakata_orfeo.toml). The team and its rule are this mod's,
# so this mod writes the change, after 0310_ie3_story_teams.toml: no other mod edits these slots, in any load order.
# Nakata: his DS list at the DS learn levels + 81, level offset = his DS bonus (research/data/ie3ds/story_matches.json).
# Giacomo Yani goes to the bench (slot 15) with his row, his shirt and the moves of 0310, except the level offset a
# moved row loses.
[[loadout]]
id = "ChronicleDeluxe.nakata_orfeo"
moves = [0xA5F2EFEA, 0x31ABD82E, 0x5E233E68]  # Brave Shot, Circus Block, Super Elastico
levels = [82, 101, 141]

[[edit]]
target = "cro_ie3_story_fbtl_cro03_110_010"
  [[edit.member]]
  slot = 8
  card = 0xFFF7C4EE                  # InazumaFantasy.nakata_hidetoshi
  number = 7
  [[edit.member]]
  slot = 15
  card = 0x8D990445                  # Giacomo Yani
  number = 8

[[edit]]
target = "cro_ie3_story_fbtl_cro03_110_010"
  [[edit.member]]
  slot = 8
  patch = true
  level_offset = 16
  loadout = "ChronicleDeluxe.nakata_orfeo"
  [[edit.member]]
  slot = 15
  patch = true
  level_offset = 1
