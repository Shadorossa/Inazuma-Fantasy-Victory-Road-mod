# SoccerBattleGlobalParam.criticalCatchPercentage (i32 0..100, instance +0x38): the parada's base %.
[[VRFW.Global]]
name = "character_reforged_critical_catch"
rip = { pattern = "48 83 EC 28 F3 0F 10 25 ?? ?? ?? ?? 44 8B D1 0F 57 ED 0F 57 C9 85 C9 74 17 E8 92 78 FD FF F3 0F 58 C4 41 8B CA 0F 28 E0 E8 ?? ?? ?? ?? 0F 28 C8 8B 05 ?? ?? ?? ?? 0F 57 C0 F3 48 0F 2A C0", disp_off = 0x32, next_ip_off = 0x36, rva = 0x14FD230, target_rva = 0x1E78FB8 }

# The shot launch (v7.1.2 «ShotLaunchStep» 0x150EC60): case 3 of the kick dispatcher 0x1542700, once per shot.
[[VRFW.Hook]]
name = "CharacterReforged.TrainingShotLaunch"
