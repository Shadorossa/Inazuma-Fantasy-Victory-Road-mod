schema = "VRFW.game/2"

# Team momentum gauges (scripts\team_momentum.lua, docs/framework/team-momentum.md).

[[VRFW.Command]]
name = "CMND_VRFW_TEAM_MOMENTUM"
handler = "TeamMomentum.Get"

# (key, side) -> started: starts that team's phase when its gauge is full
[[VRFW.Command]]
name = "CMND_VRFW_TEAM_MOMENTUM_START"
handler = "TeamMomentum.Start"
