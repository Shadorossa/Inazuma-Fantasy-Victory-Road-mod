schema = "VRFW.game/2"

# Home Stadium: the commands the game Lua asks (assets\lua).

[[VRFW.Command]]
name = "CMND_HOMESTADIUM_LIST"
handler = "HomeStadium.List"

# (team set) -> the map crc of that team dock's home stadium, 0 = none
[[VRFW.Command]]
name = "CMND_HOMESTADIUM_GET"
handler = "HomeStadium.Get"

# (team set, map crc) -> ok: the team dock's home stadium (0 clears it), saved in the slot's mod data
[[VRFW.Command]]
name = "CMND_HOMESTADIUM_SET"
handler = "HomeStadium.Set"
