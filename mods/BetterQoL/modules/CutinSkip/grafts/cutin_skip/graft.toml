# Technique Cut-in Skip (BetterQoL's module CutinSkip, docs/game/match/cutin-skip.md): a fresh press ends the running
# technique cut-in. Module off = this patch of event_menu is not loaded. Wrapper only; nothing runs at chunk load.
name = "cutin_skip"
mod = "CutinSkip"
order = 300
module = "lua_bridge"
requires = []
conflicts = []
wraps = ["Step"]
description = "CutinSkip: a fresh press in event_menu's Step asks the module to end the running technique cut-in"

[[files]]
stem = "event_menu"

  [[files.ops]]
  type = "append_block"
  source = "event_menu.lua"
  marker = "cutinskip event"
