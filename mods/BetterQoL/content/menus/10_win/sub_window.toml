# Team bank pages (feature team_banks): L2 / R2 (Q / E) on the dock rows of the sub-window's dock list send
# CMD_FUNCTION 0x85B7BB15 with 0x7CAE15EE (previous) / 0x97825F76 (next), which the engine hands to the opener's ZL/ZR
# callback (EVT_TB_WinZLZR of research/grafts/team_banks).
schema = "VRFW.menu/2"

[[patch]]
menu = "sub_window"
add_commands = [
    { layer = "mainmenu90_31_doc_item", input = "CMD_FUNCL2", command = "CMD_FUNCTION", arg = 0x85B7BB15, arg2 = 0x7CAE15EE },
    { layer = "mainmenu90_31_doc_item", input = "CMD_FUNCR2", command = "CMD_FUNCTION", arg = 0x85B7BB15, arg2 = 0x97825F76 },
]

# The pager «L2 • • • R2» of the bank pages under the window's title: copies of the retail status base, the same parts
# as the player page's row (VRFW_Pager), opened only by the bank window's script (flags: opened by the script). 34 copies:
# the 2 glyphs + one dot for each of the 32 pages the bank pages allow (tb_store.lua MAX_BANKS).
[[object]]
name = "util_tb_pager"
from = "soccer11_05_formation_status_base"
remove = [
    { parameter = "NullLayerName" },
    { parameter = "_touch_arw01_l" },
    { parameter = "_touch_arw01_r" },
]

[[patch]]
menu = "sub_window"
add_layer = { name = "util_tb_pager", object = "util_tb_pager", count = 34, align = [0, 0], scale = 1, after = "win05_15_sub_list_locator_doc", groups = [{ group = "sub_window_group", flags = [0, 0, 0, 0, 1, 0], after = "win05_15_sub_list_locator_doc" }] }
resources = ["#/menu/00_soccer/soccer11/soccer11_05/<LG>/soccer11_05.g4tx"]
