schema = "VRFW.game/2"

[[VRFW.Function]]
name = "CharacterReforged.BoardPlaceByHandle"
game = "Board.PlaceByHandle"

# bool CanEquipOnBoard(u32 charaHdl, u32 invHdl, u8 needFree, u8 ?, u8 targetSlot) 0xE7D310
[[VRFW.Function]]
name = "CharacterReforged.BoardCanEquip"
game = "Board.CanEquip"

[[VRFW.Function]]
name = "CharacterReforged.BoardSkillPieces"
game = "Board.SkillPieces"

# the item on one board slot itself (the free aura slot of a board without an aura piece, scripts/board_slots.lua)
[[VRFW.Function]]
name = "CharacterReforged.BoardEquipSlot"
game = "Board.EquipSlot"

# The skill table's aura slot (board slot 8) commands (scripts\board_slots.lua).
[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_BOARD_PIECE"
handler = "CharacterReforged.BoardSlots.Piece"

[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_BOARD_PLACE"   # (charaStHdl, invHdl, boardSlot) -> status, effectiveInv
handler = "CharacterReforged.BoardSlots.Place"
needs = ["CharacterReforged.BoardCanEquip", "CharacterReforged.BoardPlaceByHandle", "CharacterReforged.BoardSkillPieces", "CharacterReforged.BoardEquipSlot"]

[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_BOARD_CLEAR"
handler = "CharacterReforged.BoardSlots.Clear"
needs = ["CharacterReforged.BoardPlaceByHandle", "CharacterReforged.BoardSkillPieces", "CharacterReforged.BoardEquipSlot"]

[[VRFW.Command]]
name = "CMND_CHARACTERREFORGED_SIX_SENSE"
handler = "CharacterReforged.BoardSlots.SixSense"
needs = ["CharacterReforged.BoardEquipSlot"]
