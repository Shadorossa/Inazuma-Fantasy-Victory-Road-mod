# ------------------------------------------------------------------------------------------------ the cost check

[[VRFW.Hook]]
name = "Ap_AuraCostCheck"
game = "Stamina.AuraCostCheck"
kind = "function"
order = 5

# 1. a keshin / armour / totem whose pool is empty this match
[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }]
value = "0 * lookup(CharacterReforged.PointsPair:empty, [args[1]]:u32, [unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32) * lookup(CharacterReforged.PointsTeam:cost, [actor([args[1]]:u32) + 0xD0]:u8)"

# 1. else its pool decides: allowed (the gauge is not looked at)
[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }]
value = "lookup(CharacterReforged.PointsAura:pool, [unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32) * lookup(CharacterReforged.PointsTeam:cost, [actor([args[1]]:u32) + 0xD0]:u8)"

# 2. CS: the keshin's own move under its armour
[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }]
value = "0 * lookup(CharacterReforged.PointsPair:own_blocked, [args[1]]:u32, [unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32)"

# 2. CS, group keshin: a participant's armour blocks its move for the whole group
[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }]
value = "0 * lookup(CharacterReforged.PointsPair:blocked, [args[1]]:u32, [unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32)"

# 3. the running pool's own move (that spirit's moves only): covered (1) or not (0)
[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }]
value = "lookup(CharacterReforged.PointsPair:peg_cover, [args[1]]:u32, [unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32)"

# 3. a partner of a running fusion keshin: its move
[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }]
value = "lookup(CharacterReforged.PointsPair:partner_cover, [args[1]]:u32, [unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32)"

# 4. CS keshin out, keshin_moves_cost = "peg" only: any other move costs its tension in PEG
[[VRFW.Hook.answer]]
when = [{ value = "[args[1] + 4]:u8", in = [0, 1, 2, 3, 4, 5] }, { value = "[unit([args[1]]:u32) + 0x42 + [args[1] + 4]:u8 * 0x1C]:u8", not = 8 }, { value = "[unit([args[1]]:u32) + 0x30 + [args[1] + 4]:u8 * 0x1C]:u32", not = 0 }]
value = "if(lookup(CharacterReforged.PointsPlayer:keshin_out_peg, [args[1]]:u32) > 0.001, if(lookup(CharacterReforged.PointsPlayer:keshin_out_peg, [args[1]]:u32) + 0.001 >= [unit([args[1]]:u32) + 0x2E0 + [args[1] + 4]:u8 * 0x18]:u32, 1, 0), 0)"

