schema = "VRFW.menu/2"

[[object]]
name = "vrfw_pc_plate"
from = "cmn01_10_new_icon"
set = [{ parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 1001 } }]

# the players' portraits: a copy of the retail list character card, shown as its portrait only (VRFW.face_icon.card)
[[object]]
name = "vrfw_pc_face"
from = "team00_01_chara_card_for_list"
remove_block = ["MenuCollisionSetting", "CMenuAttachLocator"]
priority = 1004

# ---- the screen -------------------------------------------------------------------------------------------------------
[[screen]]
name = "vrfw_pick_cards_menu"
like = "language_option_menu"
# input priority 240 as the pose row screen: above the menu it opens over, under the question / message windows
set = { priority = 240 }
base = "savedata_management_menu"
script = "assets/lua/screens/vrfw_pick_cards_menu.lua"

[screen.rows]
layer = [
    { layer = "save01_01_list_attach_base", object = "vrfw_pr_rows" },
    { layer = "save01_02_list_item", count = 1 },
    { layer = "mainmenu90_00_background" },
    { layer = "vrfw_pc_plate", object = "vrfw_pc_plate", count = 48, align = [1, 8], scale = 0.20000000298023224 },
    { layer = "vrfw_pc_face", object = "vrfw_pc_face", count = 3 },
    { layer = "vrfw_pc_text", object = "save01_02_list_item", count = 64, align = [1, 8], scale = 0.20000000298023224 },
    { layer = "mainmenu90_01_header" },
    { layer = "mainmenu90_05_content_guide_line01" },
    { layer = "cmn05_01_cursor" },
    { layer = "mainmenu01_10_return_arrow_button_guide" },
    { layer = "mainmenu01_06_base_button_guide" },
    { layer = "mainmenu01_07_button_guide" },
]
# arrows move (CMD_FUNCTION vrfw_pc_left / _right / _up / _down), Accept picks, Back / right click skip
commands = [
    { layer = "save01_02_list_item", input = "CMD_ENTER", command = "CMD_ENTER", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_BACK", command = "CMD_BACK", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_LEFT", command = "CMD_FUNCTION", arg = 0x51B9FFB9, flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_RIGHT", command = "CMD_FUNCTION", arg = 0x4535494E, flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_UP", command = "CMD_FUNCTION", arg = 0xB1F7A661, flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_DOWN", command = "CMD_FUNCTION", arg = 0x372188EA, flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_MOUSE_RIGHT_CLICK", command = "CMD_BACK", flag = 1 },
]
resources = [
    "#/menu/220_img/vrfw_plain/vrfw_plain.g4tx",
    "#/menu/102_team/team00/team00_01/<LG>/team00_01.g4tx",
    "#/menu/100_mainmenu/mainmenu90/mainmenu90_01/<LG>/mainmenu90_01.g4tx",
]
group_base = [
    { layer = "mainmenu90_00_background", flags = [0, 1, 1, 0, 1, 0] },
    { layer = "mainmenu90_01_header", flags = [0, 1, 1, 0, 1, 0] },
    { layer = "cmn05_01_cursor", flags = [0, 0, 1, 0, 1, 0] },
    { layer = "save01_01_list_attach_base", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "save01_02_list_item", flags = [1, 1, 0, 0, 1, 0] },
    { layer = "mainmenu90_05_content_guide_line01", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "mainmenu01_10_return_arrow_button_guide", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "mainmenu01_06_base_button_guide", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "mainmenu01_07_button_guide", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "vrfw_pc_plate", flags = [0, 0, 0, 0, 1, 0] },
    { layer = "vrfw_pc_face", flags = [0, 0, 0, 0, 1, 0] },
    { layer = "vrfw_pc_text", flags = [0, 0, 0, 0, 1, 0] },
]
group = [
    { group = "common", slice = [0, 3] },
    { group = "vrfw_pick_cards_menu", flags = [1], slice = [3, 12] },
]
focus_group = [
    { layer = "save01_02_list_item", flags = [0, 0, 0], slice = [0, 1] },
]
shift_base = []
shift = []
