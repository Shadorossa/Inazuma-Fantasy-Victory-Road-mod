id = "Challenges"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "Match challenges"
version = "0.2.4"
author = "Fantasy Team"
author_steam = "76561199013321372"
description = "Match challenges other mods can arm: score 3 goals in 45 s, keep the ball for 15 s, steal the ball. With the all-outfield 5v5 formation of the possession challenges and the office trial friendlies (5v5, 7v7, 3v3) a mod's office launches."
priority = 0
tags = ["Mode", "Gameplay"]
updated = "2026-11-03"
# This mod's own names: TOML keys Challenges.X, text keys Challenges.<key>; never VRFW. Ruleset, friendly, formation,
# trigger and team ids are global and kept stable.
prefix = "Challenges"
folder = "Challenges"
# Ids are stable: the office (Inazuma Fantasy's office_requires / office_fantasy grafts, the character engine's trial
# requirements) and the Chronicle side node of Chronicles Deluxe keep naming them. Standard mod layout:
#   content\rules\challenge_goals.toml, challenge_hold.toml, challenge_steal.toml   the challenge rulesets
#   content\defaults\challenge.toml        outfield_formation = evt_trial_form5_outfield (over the framework's defaults)
#   content\formations\evt_trial_form5_outfield.toml   the all-outfield 5v5 formation (0x892736BB)
#   content\friendlies\challenges.toml     office_trial, office_trial_football_7, office_trial_street
#   content\triggers\evt_trial.toml (+ .lua)   the match scripts of the office trial games evt_trial_01..04
#   content\teams\trial_rivals\            the trial rivals evt_trial_tm_01..04 and their home stadiums
#   text\keys.toml                         the mod's name / description and the rulesets' names, 9 languages
# The framework's match engine runs the challenges; the office that offers the trials (games evt_trial_NN, texts, HUD)
# stays Inazuma Fantasy's.
# The rulesets it plays (football_7, inazuma_street, friendly_5v5_no_tactics_or_referee) are Football Reforged's base.
# Friendlies is not required (team "active_friendly" is the framework's; without Friendlies the active team plays).
requires = ["VRFW>=0.2.4", "FootballReforged>=0.2.4"]
conflicts = []
loader_modules = []
permissions = []

[exports]
functions = []
keys = []
tables = []

# A MODULE of Football Reforged: shown inside Football Reforged's entry on the Mods
# screen; switching Football Reforged off switches it off too. On by default.
[module]
of = "FootballReforged"
order = 80
