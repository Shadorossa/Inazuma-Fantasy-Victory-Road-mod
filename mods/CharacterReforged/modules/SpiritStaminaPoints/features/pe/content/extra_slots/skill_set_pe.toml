# Aura Points › PE: its rules on Character Reforged's new skill set in a match.
# The base's plates slot CharacterReforged.skill_set runs the matches: RB+B on the mix slot starts the miximax. A miximax runs on PE
# (config.toml [pe] no_start_check / free_activation: the start neither needs nor spends the hyper gauge), but without
# this rule the plates asked the retail hyper gauge for its start (at least one bar). Same rule Inazuma Fantasy
# declared on its Hyper slot (start_free on its aura table's `waived`).
#   start_free   an aura of the table SpiritStaminaPoints.StaminaAura with `waived` set (the [pe] no_start_check kinds: the miximax
#                and its carriers) starts at any hyper gauge
# The table is named without `aura_points/`: an extension's tables are read from the extending mod (this one). The
# keshin / armour / totem pools are the mod Aura Points' rules on the same slot (start_gate_applies / start_refused).
# With the option «pe» off (this feature is not read) nothing of this applies: the miximax starts with the retail hyper gauge.
schema = "VRFW.extra_slot/1"

[[VRFW.ExtraSlotExtend]]
slot = "CharacterReforged.skill_set"

[VRFW.ExtraSlotExtend.rules]
start_free = [[{ table = "SpiritStaminaPoints.StaminaAura", key = ["skill"], field = "waived", is = "set" }]]
