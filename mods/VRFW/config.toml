
# ---------------------------------------------------------------- languages
[languages]
# the framework's one language source (VRFW::lang, docs/framework/languages.md).
order = ["ja", "en", "es", "fr", "de", "it", "pt", "zh_hans", "zh_hant"]
# a text missing in the asked language: the declaring file's default_lang, then `all`, then these
fallback = ["en", "es"]
# the language of a text when the caller gives none: "game" (the game's current language) or a language
default = "game"
# the language data is written in when a file names none (build-time picks, never the player's language)
source = "es"

# ---------------------------------------------------------------- limits
[limits]
shop_rows = 2048
# rows one shop tab lists (each open shop menu gets its own row buffer): 320..8192, 0 = the game's 320
shop_tab_rows = 1024

# ---------------------------------------------------------------- help screen
[help_entry]
# the Mods tab of the Help screen: tab icon type (icon_list_tab atlas) and title text key
mods_tab_icon = 9
mods_tab_title = "help_mods_tab"

# ---------------------------------------------------------------- dev
[dev]
hot_reload = false
# how often the watcher looks (ms, 200..60000); a change applies when it is stable for one more look
poll_ms = 1000

# ---------------------------------------------------------------- debug
[debug]
reveal_all = false
all_chains = false
capture_pause_probe = false
command_hooks = false
free_gacha = false
# how many of the cost item the free gacha keeps (the bag's room for the item caps it)
free_gacha_stock = 999

# ---------------------------------------------------------------- chara (chara\)
[character]
lang = "game"
stand_in_kits = [0xB0842F13, 0x9EDB7BFC]
stand_in_kit_team = "start_team_01"

[team]
lang = "game"

[technique]
report = true
goal_events = true
keeper_scenes = true

# ---------------------------------------------------------------- anim (anim\)
[anim]
report = true

# ---------------------------------------------------------------- items (items\)
[item]
lang = "game"

# ---------------------------------------------------------------- tables (tables\) [tables] (no developer keys)
# the table engine: the mods' generic row files rows\**\*.toml (schema VRFW.rows/1: add / set / delete / order).

# ---------------------------------------------------------------- modes (modes\)
[mode]
# the mode engine: the game modes the mods declare in modes\*.toml (schema VRFW.mode/1).
lang = "game"

[mode.switch]
# switch any declared mode off (or on) for this install: "<mod>.<name>" = false.

# ---------------------------------------------------------------- text (text\)
[text]
lang = "game"

# ---------------------------------------------------------------- save (save\)
[flag]
# per-mod save data tied to the save slot "on_save": slot data is written when the game saves the slot.
commit = "on_save"
# mods whose slot data is always written at once (the others follow `commit`)
immediate_mods = []
# worker period in ms (slot events, global / immediate writes)
flush_ms = 250
trash_keep = 30

[flag.storage]
location = "profile"
# absolute folder that overrides `location` ("" = none)
path = ""

[flag.slots]
enabled = true
# player slots, the locked one included (1..99): slot N is save file N; the slot screen shows them as one carousel
count = 10
# the vanilla save is read / duplicate only (never played or written)
lock = true
locked_slot = 1
# slots kept out of the player numbering besides the ones mods reserve themselves (vrfw_slots_reserve).
reserved = []
# copies of a slot's save file kept in <loader data dir>\backups\slot<N>\
backups_per_slot = 5
# refuse a game write that looks like a fresh profile over a slot with progress (the file is kept; logged ERROR)
reset_guard = true
snapshots_per_slot = 10
# open the slot screen once at boot (CMND_VRFW_SLOT_NEED_PROMPT)
ask_on_boot = false

# ---------------------------------------------------------------- system (system\)
[param]
params = true
# the mods' input.toml: new input commands, other buttons for existing ones (input_ctrl + key_assign)
input = true

# ---------------------------------------------------------------- audio (audio\)
[sound]
# the audio engine: the mods' audio.toml, voice packs, per-armour shouts

[sound.armed_voice]
enabled = true

[sound.output_guard]
enabled = false

[sound.queue_sheet]
# register the new banks (the [[bank]] of the audio.toml files and the ones the engine creates) in sound_queue_sheet
merge = true

[sound.build]
# build the [[voice]] / [[sfx]] / [[music]] of the mods' audio.toml at start (cache: vrfw_loader\cache\audio_engine)
enabled = true

# ---------------------------------------------------------------- match (match\)
[rule]
match_rules = true
# setup knobs of the rulesets (period, halves, players, ExRule…)
setup = true
# testing: a ruleset id applied to every offline full / small match without a Lua selection ("" = off)
test_ruleset = ""
challenges = true

[telop]
live_switch = true
live_reload = false
lang_values = ["es", "en", "fr", "de", "it", "pt", "ja", "zh_hans", "zh_hant"]

[theme]
background_build = true
# atlases encoded at once (0 = half the cores)
workers = 0
start_delay = 20
early_build_max = 64

[image]
bc7 = "fast"
# encoder threads (0 = every core)
threads = 0

[effect]
report = true

[model]
report = true

[option]
# the «Opciones de mods» tab of Opciones › Ajustes (graphics\ui\options\)

[option.tab]
# off: the mods' rows are only removed from the retail tabs and not shown anywhere
enabled = true

[mods_screen]
# the «Mods» screen and its title-menu button (graphics\ui\mods_menu\)

[mods_screen.screen]
enabled = true
# Serve the menu registry (menu_create_setting) with an own row vrfw_mods_menu?

[mods_screen.title_button]
# the «Mods» button: one more button at the end of the title's lower row, with or without other mods
enabled = true

[changelog]        # «Novedades de mods» (What's new) sheet
at_title = true
first_install = "latest"
max_pages = 10

[shop]
aura_cards = true
synergy_conditions = true

# ---------------------------------------------------------------- file picks
[files]
# The flow of a file pick: "dialog" is the system save or open dialog (the game's own list when it cannot open, as on a Steam Deck), "list" is always the game's list.
picker = "dialog"
