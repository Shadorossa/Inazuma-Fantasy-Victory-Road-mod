schema = "VRFW.game/2"

# u8 EquipSlot(u32 charaHdl, u32 invHdl, i32 slot, u8 native): every write of a board slot, game code and scripts.
[[VRFW.Hook]]
name = "CharacterReforged.MoveWriteEquipSlot"
game = "Board.EquipSlot"
kind = "function"

# u8 RemoveFromStack(ItemContainer*, u32* invHdl, u32 count) 0xD91650: every removal of copies from an inventory stack.
[[VRFW.Hook]]
name = "CharacterReforged.MoveWriteStackRemove"
kind = "function"
pattern = "48 89 6C 24 10 48 89 74 24 18 57 48 83 EC 20 8B 02 41 8B E8 C1 E8 0D 48 8B F2 83 E0 1F 83 F8 1F 0F 83"
steal = 15
arguments = ["ptr", "ptr", "u32"]
returns = "u8"

# CMND_SET_SKILL(charaStHdl, skill, list position): every write of a technique list position through the command.
[[VRFW.CommandFilter]]
name = "CharacterReforged.MoveWriteSetSkill"
command = "CMND_SET_SKILL"
handler = "CharacterReforged.MoveWriteSetSkill"
phase = "after"
