# ui_clean header_shift (BetterUI, flag header_short; docs/game/ui/ui-redesign.md §3.3): the content of 6 retail
# header menus moves up by the height the compact top bar saves (header scale 0.55 in BetterUI's files\data
# mainmenu90_01.g4pkm, team panel mainmenu90_31 0.64). The layers and the height are BetterUI's declarations
# (content\header_shift\menus.toml, [[VRFW.HeaderShift]]); each menu's hook file turns on the framework's
# VRFW_HeaderShift (docs/framework/header-shift.md). InaRogue's own INAROGUE menu does the same with its graft
# inarogue_header_shift.
# Was Inazuma Fantasy's until 2026-10-08 (docs/refactor/if-adaptation-after-e3.md §35); its `requires` on IF's grafts
# fichajes / shop_general / inarogue went with the split: as a clean_hud patch it runs after IF's (IF is lua_early).
# Header dock (Clean HUD 1.14.4, docs/game/ui/ui-redesign.md §3.3c): src hs_bar_dock.lua on the retail ability board
# (ability_learning_board_menu): the player switcher and the stock counter go into the compact bar; its vars are
# written by research/scripts/ui_clean_build.py --header-dock (checked by --check), never by hand.
name = "ui_clean_header_shift"
mod = "BetterUI"
order = 900
module = "lua_bridge"
requires = []
conflicts = []
wraps = []
description = "ui_clean: header menus content moved up"

[[hooks]]
stem = "soccer_top_menu"
source = "header_shift_hook.lua"

[[hooks]]
stem = "market_menu"
source = "header_shift_hook.lua"

[[hooks]]
stem = "setting_top_menu"
source = "header_shift_hook.lua"

[[hooks]]
stem = "play_guide_top_menu"
source = "header_shift_hook.lua"

[[hooks]]
stem = "chronicle_mode_top_menu"
source = "header_shift_hook.lua"

[[hooks]]
stem = "victory_road_top_menu"
source = "header_shift_hook.lua"

[[files]]
stem = "ability_learning_board_menu"

  [[files.ops]]
  type = "bytecode_child"
  source = "hs_bar_dock.lua"
  marker = "ui_clean header_dock"
  crc = "none"
  include = { "@UI_WRAP@" = "../_lib/evt_ui_wrap.lua" }
  vars = { "@TAG@" = "hs_skill_board", "@HD_LAYERS@" = "[4185841799] = { 346.8, 0.0, 0.55 }, [1070900890] = { 194.84, 19.57, 0.64 }", "@HD_CHECK@" = "91676902" }
