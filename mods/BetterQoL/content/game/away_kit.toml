schema = "VRFW.game/2"

# Home / Away kit: game data and commands used by graft away_kit (shown when module mask bit 19 is lit).

# [[g_gameRoot] + 0x69A8] = CGDDPartyStatus (team sets at +0x17B8)
[[VRFW.Global]]
name = "party"
base = "game_root"
chain = ["ROOT_PARTY"]

# TeamInfo (0x2D0 bytes): +0x290 uniformId (read by every consumer), +0x294 uniformInvHdl (owned kit item; picker only).
[[VRFW.Struct]]
name = "TeamInfo"
size = 0x2D0
fields = { uniform = { at = 0x290, type = "u32" }, uniform_item = { at = 0x294, type = "u32" } }

# set, team [, uniform [, src_team]] -> ok, uniformId (also called by other mods' Lua)
[[VRFW.Command]]
name = "CMND_BETTERQOL_TEAM_UNIFORM"
handler = "BetterQoL.TeamUniform"
needs = ["Team.SetStruct", "party", "TeamInfo"]

# uniform -> its away twin (or the kit of a twin), 0 = none
[[VRFW.Command]]
name = "CMND_BETTERQOL_AK_PAIR"
handler = "BetterQoL.AwayKitPair"
needs = ["Team.SetStruct", "party", "TeamInfo"]

# the kit picker's Lua tests mods / 524288 % 2: must never move
[[VRFW.ModuleMask]]
bit = 19
needs = ["CMND_BETTERQOL_TEAM_UNIFORM", "CMND_BETTERQOL_AK_PAIR"]
