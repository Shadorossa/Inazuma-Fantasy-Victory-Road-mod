schema = "VRFW.option/2"

[[option]]
id = "camera"
visual = true                                 # local only: not compared in online rooms
type = "toggle"
label = "camera_type"
help = "camera_type_help"
parent = "mod_options.game_settings"
off = { key = "better_qol_set_camera_side_off", text = "Original" }
on = { key = "better_qol_set_camera_side_on", text = "Side" }
default = 0
row_key = "better_qol_set_camera_side"
order = 105
category = "category_camera_interface"

# Visual style: 0 = retail look; every other value is a [[VRFW.ShaderPreset]] of content\shaders\visual_style.toml.
[[option]]
id = "visual_style"
visual = true
type = "list"
label = "visual_style"
help = "visual_style_help"
parent = "mod_options.custom_style"
values = [
    { value = 0, name = "vs_retail", text = "Original" },
    { value = 1, name = "vs_ie3", text = "IE3" },
    { value = 2, name = "vs_chrono", text = "Chrono Stone" },
    { value = 3, name = "vs_soft", text = "Soft" },
    { value = 4, name = "vs_ie3_contour", text = "IE3 + thick outline" },
    { value = 5, name = "vs_contour", text = "Thick outline" },
]
default = 2
order = 123
category = "category_visual"

# Technique level badges: «Stars» switches the +1/+2/+3 sprites to features\level_badges\ (read at start).
[[option]]
id = "level_badges"
visual = true
type = "list"
label = "level_badges"
help = "level_badges_help"
parent = "VRFW.telop.show_banners"
values = [
    { value = 0, name = "lb_retail", text = "+1 / +2 / +3" },
    { value = 1, name = "lb_stars", text = "Stars" },
]
default = 0
restart = true                                # the feature folder is read at the start
order = 114
category = "category_camera_interface"

# Auto Commander mode (config.toml [auto_commander]); read at each match init.
[[option]]
id = "auto_commander"
type = "toggle"
label = "auto_commander"
help = "auto_commander_help"
default = 0
parent = "mod_options.game_settings"
order = 103
category = "category_match"

# Game speed while your team plays in Commander mode under the auto commander; x1 = normal speed.
[[option]]
id = "auto_commander_speed"
type = "list"
label = "auto_commander_speed"
help = "auto_commander_speed_help"
parent = "mod_options.game_settings"
values = [
    { value = 1.0, text = "x1" },
    { value = 1.5, text = "x1.5" },
    { value = 2.0, text = "x2" },
    { value = 3.0, text = "x3" },
    { value = 4.0, text = "x4" },
]
default = 1.0
order = 103
category = "category_match"

# Real seconds per game minute at normal match speed, 2.0..15.0; 0 = retail rate.
[[option]]
id = "match_clock"
