schema = "VRFW.migration/1"
id = "VRFW.celebration_picks"
description = "Celebration picks saved under the old Cross celebration names keep their celebration"
phase = "game_save"
after = ["VRFW.no_compat_names"]

[[step]]
kind = "game_save_crc"
file = "{steam_save}/002AB8F4-USERDATALIVE*"
