[[row]]
id = 0x457A7269  # whk93113 description
kind = "text"
es = "Da la espalda al balón y dispersa toda\nsu fuerza con un aura punzante."
en = "Turn your back to the ball and scatter\nall its power with a piercing aura."
fr = "Tourne le dos au ballon et disperse\ntoute sa force d'une aura perçante."
de = "Dreh dem Ball den Rücken zu und zerstreue\nseine Kraft mit einer stechenden Aura."
it = "Volta le spalle al pallone e disperdi\ntutta la sua forza con un'aura pungente."
pt = "Vira as costas à bola e dispersa toda\na sua força com uma aura penetrante."
ja = "ボールに背を向け、鋭いオーラで\nその力をすべて散らす！"
zh_hans = "背对足球，以尖锐的灵气\n驱散其全部力量。"
zh_hant = "背對足球，以尖銳的靈氣\n驅散其全部力量。"
