# «Habilidades» (the retail move list, ability_list_menu) as in the owner's sketch (outputs/betterui_skills_sketch/sketch_final.png):
# tab bar at the top centre, a 16:9 thumbnail frame on the left, the move card on the right with the move's effects
# under it, a carousel of technique books along the bottom that keeps the focused book in the centre, a position bar
# and «N / M». Drawn by the graft better_ui_skill_screen. Layout joints: screen px, y up from the top left (1920 x 1080).
# * The retail list stays the input and focus source with its own rows, out of sight: its layout copy (team05_03_bui_sk)
#   puts its 11 row locators off the screen (row instance k on locator k: the graft reads a row's place from k);
#   the tab bar's attach layer is moved by the graft. Left / right move its cursor one row (the list's CMD_FCS_PAGE_* rows become
#   CMD_FCS_BACK / _NEXT); up / down keep moving it as in the retail game.
# * betterui_skill_book (the retail row item on its own layout copy: book 125 px centred on the origin, element icon
#   in its bottom-right corner; its name and plates hidden; no row cursor, no touch): the 9 carousel books, the
#   thumbnail's book and the effect rows' icons.
# * betterui_skill_label (VRFW vrfw_tile_label): «N / M», the RS glyph and the 9 carousel names (one size for all).
# * betterui_skill_art (the retail cmn01_10 quad): the screen's own sprites (atlas better_ui_skill_screen_art, made by
#   _tools/betterui_skill_screen_art.py): thumbnail frame, RS badge, glow and underline of the focused book, side
#   arrows, position track and thumb, effects header line, row separators, icon slots and «Nv N» chips.
# * Effects: title (yellow 28 px), 6 rows (white 24 px, left, 880 px box: the widest row, both columns; the graft wraps
#   a long text into lines and grows its row), their values (green 26 px, right) and the «Nv N» tags (yellow 22 px, right).
# * The card (team02_02_skill_detail_info) on its layout copy team02_02_bui_card: its plate and TENSIÓN row under the
#   thumbnail, as wide as it (614 px), the description and its side line in the right column (the graft's S.G places the
#   card: CARD_DX / CARD_DY). Joints in card px from the card's centre, y up.
schema = "VRFW.menu/2"

