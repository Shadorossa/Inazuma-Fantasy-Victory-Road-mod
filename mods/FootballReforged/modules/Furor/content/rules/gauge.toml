schema = "VRFW.behaviour/1"

# ---------------------------------------------------------------- level 1 (half gauge): special moves a little stronger

[[rule]]
id = "furor_level1_power_user"
on = "move_power"
[rule.when]
team = "user"
flag = "Furor.gauge.user.level1"
not_flag = "Furor.gauge.user.phase"
[rule.do]
power_mult = 1.03

[[rule]]
id = "furor_level1_power_rival"
on = "move_power"
[rule.when]
team = "rival"
flag = "Furor.gauge.rival.level1"
not_flag = "Furor.gauge.rival.phase"
[rule.do]
power_mult = 1.03

# ---------------------------------------------------------------- the phase («Fase de furor», Strikers' Hero Time)

# its special moves hit harder
[[rule]]
id = "furor_phase_power_user"
on = "move_power"
[rule.when]
team = "user"
flag = "Furor.gauge.user.phase"
[rule.do]
power_mult = 1.15

[[rule]]
id = "furor_phase_power_rival"
on = "move_power"
[rule.when]
team = "rival"
flag = "Furor.gauge.rival.phase"
[rule.do]
power_mult = 1.15

# its players run faster (Strikers: a Hero Time player counts as dashing)
[[rule]]
id = "furor_phase_speed_user"
on = "move_speed"
[rule.when]
team = "user"
flag = "Furor.gauge.user.phase"
[rule.do]
speed_mult = 1.08

[[rule]]
id = "furor_phase_speed_rival"
on = "move_speed"
[rule.when]
team = "rival"
flag = "Furor.gauge.rival.phase"
[rule.do]
speed_mult = 1.08

# its keeper faces weaker shots (the shot's power for that save battle)
[[rule]]
id = "furor_phase_keeper_user"
on = "keeper_duel"
[rule.when]
team = "user"
flag = "Furor.gauge.user.phase"
[rule.do]
power_mult = 0.9

[[rule]]
id = "furor_phase_keeper_rival"
on = "keeper_duel"
[rule.when]
team = "rival"
flag = "Furor.gauge.rival.phase"
[rule.do]
power_mult = 0.9

# the look by side: the rival's team burns orange, the user's team blue (the side the user plays on, home or away)
[[rule]]
id = "furor_awakening_look_rival"
on = "signal:Furor.gauge.phase"
[rule.when]
team = "rival"
[rule.do]
character_effect = { trigger = "furor_phase_fire", who = "team" }

[[rule]]
id = "furor_awakening_look_user"
on = "signal:Furor.gauge.phase"
[rule.when]
team = "user"
[rule.do]
character_effect = { trigger = "furor_phase_fire_ally", who = "team" }

[[rule]]
id = "furor_awakening_gk"
on = "signal:Furor.gauge.phase"
[rule.do]
set_stat = { stat = ["agility", "physical"], mult = 1.12, who = "team", position = "gk" }

[[rule]]
id = "furor_awakening_df"
on = "signal:Furor.gauge.phase"
[rule.do]
set_stat = { stat = ["pressure", "physical"], mult = 1.15, who = "team", position = "df" }

[[rule]]
id = "furor_awakening_mf"
on = "signal:Furor.gauge.phase"
[rule.do]
set_stat = { stat = ["control", "technique", "agility"], mult = 1.1, who = "team", position = "mf" }

[[rule]]
id = "furor_awakening_fw"
on = "signal:Furor.gauge.phase"
[rule.do]
set_stat = { stat = ["kick", "agility"], mult = 1.15, who = "team", position = "fw" }

[[rule]]
id = "furor_awakening_look_join_rival"
on = "signal:Furor.gauge.phase_join"
[rule.when]
team = "rival"
[rule.do]
character_effect = { trigger = "furor_phase_fire", who = "actor" }

[[rule]]
id = "furor_awakening_look_join_user"
on = "signal:Furor.gauge.phase_join"
[rule.when]
team = "user"
[rule.do]
character_effect = { trigger = "furor_phase_fire_ally", who = "actor" }

[[rule]]
id = "furor_awakening_gk_join"
on = "signal:Furor.gauge.phase_join"
[rule.do]
set_stat = { stat = ["agility", "physical"], mult = 1.12, who = "actor", position = "gk" }

[[rule]]
id = "furor_awakening_df_join"
on = "signal:Furor.gauge.phase_join"
[rule.do]
set_stat = { stat = ["pressure", "physical"], mult = 1.15, who = "actor", position = "df" }

[[rule]]
id = "furor_awakening_mf_join"
on = "signal:Furor.gauge.phase_join"
[rule.do]
set_stat = { stat = ["control", "technique", "agility"], mult = 1.1, who = "actor", position = "mf" }

[[rule]]
id = "furor_awakening_fw_join"
on = "signal:Furor.gauge.phase_join"
[rule.do]
set_stat = { stat = ["kick", "agility"], mult = 1.15, who = "actor", position = "fw" }

# the end: the look off on the whole team (a player who changed place keeps none), the stats back
[[rule]]
id = "furor_awakening_end"
on = "signal:Furor.gauge.phase_end"
[rule.do]
character_effect = { clear = true, trigger = "furor_phase_fire", who = "team" }
set_stat = { stat = ["kick", "control", "technique", "pressure", "physical", "agility"], restore = true, who = "team" }

[[rule]]
id = "furor_awakening_end_ally_look"
on = "signal:Furor.gauge.phase_end"
[rule.do]
character_effect = { clear = true, trigger = "furor_phase_fire_ally", who = "team" }

[[rule]]
id = "furor_cpu_start_trailing"
on = "possession"
[rule.when]
team = "rival"
flag = "Furor.gauge.rival.full"
not_flag = "Furor.cpu_driven"
score = "trailing"
chance = 0.6
[rule.do]
signal = "Furor.gauge.start"

[[rule]]
id = "furor_cpu_start_level"
on = "possession"
[rule.when]
team = "rival"
flag = "Furor.gauge.rival.full"
not_flag = "Furor.cpu_driven"
score = "level"
chance = 0.35
[rule.do]
signal = "Furor.gauge.start"

[[rule]]
id = "furor_cpu_start_leading"
on = "possession"
[rule.when]
team = "rival"
flag = "Furor.gauge.rival.full"
not_flag = "Furor.cpu_driven"
score = "leading"
chance = 0.15
[rule.do]
signal = "Furor.gauge.start"
