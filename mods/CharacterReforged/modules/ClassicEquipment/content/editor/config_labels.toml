schema = "VRFW.editor/1"
# Names and descriptions of this mod's config.toml settings, shown in ModManager > Parametros del juego. Read only by ModManager.

[[Shape]]
Id = "settings"
For = "config"
  [[Shape.Field]]
  Key = "stats"
  Type = "table"
  Label = { es = "Estadísticas", en = "Stats" }
  Help = { es = "Cómo se traducen las estadísticas del equipo clásico de 3DS.", en = "How classic 3DS equipment stats are translated." }
  [[Shape.Field]]
  Key = "stats.map"
  Type = "table"
  Label = { es = "Correspondencia de estadísticas", en = "Stat mapping" }
  Help = { es = "Estadística 3DS del objeto y la estadística de Victory Road que sube.", en = "3DS item stat and the Victory Road stat it raises." }
  [[Shape.Field]]
  Key = "stats.luck_key"
  Type = "string"
  Label = { es = "Clave de suerte", en = "Luck key" }
  Help = { es = "Nombre 3DS que cuenta como Suerte.", en = "The 3DS name that counts as Luck." }
  [[Shape.Field]]
  Key = "drops"
  Type = "table"
  Label = { es = "Botines", en = "Drops" }
  Help = { es = "Qué objetos clásicos se obtienen al ganar partidos.", en = "Which classic items drop after matches." }
  [[Shape.Field]]
  Key = "drops.kinds"
  Type = "list"
  Of = "string"
  Label = { es = "Tipos que se obtienen", en = "Dropped kinds" }
  Help = { es = "Tipos de objeto clásico que se obtienen en partidos contra su equipo.", en = "Classic item kinds dropped in matches against their team." }
  [[Shape.Field]]
  Key = "shape"
  Type = "table"
  Label = { es = "Forma de los bonos", en = "Bonus shape" }
  Help = { es = "Cómo se reparten los bonos visibles de cada objeto.", en = "How an item's shown bonuses are split." }
  [[Shape.Field]]
  Key = "shape.trade_tiers"
  Type = "list"
  Of = "string"
  Label = { es = "Niveles con intercambio", en = "Trade tiers" }
  Help = { es = "Niveles de objeto cuyos bonos pueden intercambiarse entre estadísticas.", en = "Item tiers whose bonuses may be traded between stats." }
  [[Shape.Field]]
  Key = "shape.three_from_rank"
  Type = "float"
  Label = { es = "Rango para tres bonos", en = "Rank for three bonuses" }
  Help = { es = "A partir de este rango del objeto (0 a 1) lleva tres bonos.", en = "From this item rank (0 to 1) it carries three bonuses." }
  [[Shape.Field]]
  Key = "shape.main_share"
  Type = "float"
  Label = { es = "Peso del bono principal", en = "Main bonus weight" }
  Help = { es = "Cuánto pesa el bono principal frente a los demás.", en = "How much the main bonus weighs against the others." }
  [[Shape.Field]]
  Key = "shape.swap_ratio"
  Type = "float"
  Label = { es = "Proporción de intercambio", en = "Swap ratio" }
  Help = { es = "Proporción entre la estadística quitada y la ganada al intercambiar.", en = "Ratio between the stat lowered and the one raised in a trade." }
  [[Shape.Field]]
  Key = "shape.fill_weight"
  Type = "float"
  Label = { es = "Peso de relleno", en = "Fill weight" }
  Help = { es = "Peso de los bonos secundarios al completar el total.", en = "Weight of secondary bonuses when filling the total." }
  [[Shape.Field]]
  Key = "penalty"
  Type = "table"
  Label = { es = "Penalización", en = "Penalty" }
  Help = { es = "Penalización de los objetos clásicos.", en = "Penalty of classic items." }
  [[Shape.Field]]
  Key = "penalty.original_rank"
  Type = "table"
  Label = { es = "Penalización por rango", en = "Penalty by rank" }
  Help = { es = "Penalización pequeña y grande según el rango original del objeto en su juego 3DS.", en = "Small and big penalty by the item's original rank in its 3DS game." }
  [[Shape.Field]]
  Key = "names"
  Type = "table"
  Label = { es = "Nombres", en = "Names" }
  Help = { es = "Cómo se nombran los objetos clásicos.", en = "How classic items are named." }
  [[Shape.Field]]
  Key = "names.team_stem_min"
  Type = "int"
  Label = { es = "Mínimo de letras de equipo", en = "Minimum team stem letters" }
  Help = { es = "Letras mínimas de la raíz japonesa para reconocer un objeto de equipo.", en = "Minimum letters of the Japanese stem to recognise a team item." }
  [[Shape.Field]]
  Key = "names.team_series"
  Type = "table"
  Label = { es = "Serie por juego", en = "Series per game" }
  Help = { es = "Serie de botas del juego original usada para cada juego 3DS.", en = "Boot series of the base game used for each 3DS game." }
