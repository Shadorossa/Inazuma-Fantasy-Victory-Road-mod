# Kit picker (equip_uniform_menu): CMD_FUNC3 on the kit list sends CMD_FUNCTION evt_away_kit (crc32 = 0xB9A5A0BD,
# UTIL_AK_KEY of the graft research/grafts/away_kit), which toggles the Local / Visitante preview. Menu engine format
# (VR-Framework menu type, schema VRFW.menu/2). the mod BetterQoL's (was the standalone mod away_kit).
schema = "VRFW.menu/2"

[[patch]]
menu = "equip_uniform_menu"
add_commands = [
    { layer = "team06_01_uniform_list", input = "CMD_FUNC3", command = "CMD_FUNCTION", arg = 0xB9A5A0BD },
]
