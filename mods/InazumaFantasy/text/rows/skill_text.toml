[[row]]
id = 0x4F045692  # whd92114 description
kind = "text"
es = "Llena el aire de partículas de energía que\nestallan a la vez y frenan el ataque rival."
en = "Fills the air with energy particles that\nburst at once and stop the rival's attack."
fr = "Remplit l'air de particules d'énergie qui\nexplosent ensemble et stoppent l'attaque."
de = "Füllt die Luft mit Energieteilchen, die\nzugleich explodieren und den Angriff stoppen."
it = "Riempie l'aria di particelle di energia che\nesplodono insieme e fermano l'attacco."
pt = "Enche o ar de partículas de energia que\nexplodem juntas e travam o ataque rival."
ja = "エネルギー粒子を空中に放ち\n一斉に爆発させて攻撃を止める！"
zh_hans = "让能量粒子充满空中，\n同时爆炸阻止对手进攻。"
zh_hant = "讓能量粒子充滿空中，\n同時爆炸阻止對手進攻。"

