# Battle Bay Deluxe tournament (knockout, groups + knockout, league) on the Battle Bay campaign matches.
# tournament_top.lua and its tournament_top_*.lua parts form one chunk with shared locals; order 346 runs after battlebaydeluxe_draft (345).
