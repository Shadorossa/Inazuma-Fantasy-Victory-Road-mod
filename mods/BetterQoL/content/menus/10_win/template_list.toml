schema = "VRFW.menu/2"

# The team dock's template list (R3 / N): the game's team list window with pages of templates.
# Opened by the graft team_templates, drawn by the mod's sub_window_group script 150_template_list.lua.

# L2 / R2 on a row of the team list call the opener's page callback.
[[patch]]
menu = "sub_window"
add_commands = [
    { layer = "mainmenu90_31_doc_item", input = "CMD_FUNCL2", command = "CMD_FUNCTION", arg = 0x85B7BB15, arg2 = 0x7CAE15EE },
    { layer = "mainmenu90_31_doc_item", input = "CMD_FUNCR2", command = "CMD_FUNCTION", arg = 0x85B7BB15, arg2 = 0x97825F76 },
]

# The list's page dots: the formation status base without its arrows.
[[object]]
name = "betterqol_template_list_pager"
from = "soccer11_05_formation_status_base"
remove = [
    { parameter = "NullLayerName" },
    { parameter = "_touch_arw01_l" },
    { parameter = "_touch_arw01_r" },
]

[[patch]]
menu = "sub_window"
add_layer = { name = "betterqol_template_list_pager", object = "betterqol_template_list_pager", count = 34, align = [0, 0], scale = 1, after = "win05_15_sub_list_locator_doc", groups = [{ group = "sub_window_group", flags = [0, 0, 0, 0, 1, 0], after = "win05_15_sub_list_locator_doc" }] }
resources = ["#/menu/00_soccer/soccer11/soccer11_05/<LG>/soccer11_05.g4tx"]

# Each copy of the page dots hangs from the window's _pos_base01: locator name, node, layer, copy.
[[object_set]]
object = "win05_15_sub_list_locator_doc"
