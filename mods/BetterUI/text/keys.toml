schema = "VRFW.text_key/1"
# Texts of BetterUI (mod BetterUI; «Clear View» 1.16.0-1.17.0, «Clean HUD» / «Interfaz limpia» before) (format of the
# VR-Framework texts: docs/framework/types/text.md). New texts get the id crc32("BetterUI.<name>"): the guide label
# «<L2><R2> Cambiar de tienda» of the shop shortcuts. Pre-match: the lineup buttons «Editar» / «Datos» (prematch_edit
# / prematch_data, asked by research/grafts/prematch_lineups with CMND_VRFW_TEXT_ID). (The pre-match «hold X» label
# prematch_skip moved to Utilities in 1.26.0.) The match readouts (1.22.0): the duel labels duel_dribble /
# duel_defense / duel_power_charge / duel_power_block (asked by assets\lua\screens\betterui_power_counter_menu.lua with
# CMND_VRFW_TEXT_ID) and the «Opciones de mods» rows of options.toml (modules, duel_readout, shot_readout and their
# help lines); every other feature is always on. The Chronicle VS screen (1.24.0): the two views of its player cards
# vs_preview / vs_basic_data, the label of the pill under the pitch (asked by assets\lua\_all\vs_basic_data.lua with
# CMND_VRFW_TEXT_ID). A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "BetterUI"
mod_description = "A cleaner match HUD and original game menus: a compact, translucent menu top bar, a lighter match HUD with fewer markers and guides, compact player cards on the formation, rival squad and bank screens, and shop shortcuts (L2 / R2 or Q / E). Shirt numbers and AI roles are set for the whole team from the Team Dock, and the cut-ins of special move duels show each player's total. No rules, data or saves are changed."
shop_switch = "Switch shop"
prematch_edit = "Edit"
prematch_data = "Data"
vs_preview = "Preview"
vs_basic_data = "Basic data"
duel_dribble = "Dribbling"
duel_defense = "Defending"
duel_power_charge = "Power Charge"
duel_power_block = "Power Block"
modules = "BetterUI modules"
modules_help = "Off: both BetterUI match readouts hidden. Your choices are kept."
duel_readout = "Duel counter"
duel_readout_help = "During the cut-ins of a special-move or rough-attack duel, each player's total."
shot_readout = "AT / PP counter"
shot_readout_help = "When shooting, the shot's total AT against the keeper's PP."

