  { op = "wait_gone", menu = "soccer_vs_cpu_list_menu", frames = 900 },
  { op = "close", menu = "shop_menu" },
  { op = "watchdog", frames = 900, key = "FOOTBALL_REFORGED_TRIAL_GO" }, # nobody started the match: everything back
]

