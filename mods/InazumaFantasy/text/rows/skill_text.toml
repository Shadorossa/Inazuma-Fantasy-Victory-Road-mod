[[row]]
id = 0xA1A26AEB  # whd92149 description
kind = "text"
es = "Rodéate de una barrera de sombras y crea\nmil reflejos oscuros que frenan al rival."
en = "Raise a barrier of shadows and create\na thousand dark reflections to stop the rival."
fr = "Dresse une barrière d'ombres et crée\nmille reflets obscurs contre l'adversaire."
de = "Errichte eine Schattenbarriere und erschaffe\ntausend dunkle Spiegelbilder gegen den Gegner."
it = "Erigi una barriera d'ombra e crea\nmille riflessi oscuri che fermano l'avversario."
pt = "Ergue uma barreira de sombras e cria\nmil reflexos escuros que travam o rival."
ja = "影の壁で身を包み\n無数の黒い分身で相手を止める！"
zh_hans = "以暗影屏障环绕自身，\n制造无数黑影阻挡对手。"
zh_hant = "以暗影屏障環繞自身，\n製造無數黑影阻擋對手。"

