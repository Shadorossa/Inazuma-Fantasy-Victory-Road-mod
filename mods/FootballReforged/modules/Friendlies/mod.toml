id = "Friendlies"
former_ids = ["Pachangas"]
key_id = "Friendlies"
# name / description: the English fallback; the «Mods» screen shows the text keys mod_name / mod_description in the
# game's language (text\keys.toml)
name = "5-a-side teams"
version = "0.2.2"
author = "Shadorossa"
author_steam = "76561199013321372"
description = "Team Dock's list starts with one row of two columns, «Match» and «5-a-side» (left / right pick one, confirm switches): every Team Dock's 5-a-side team mirrors its match team, with the same players, kit, emblem and name; its five are picked automatically by the 5v5 formation and can be swapped among those players, and the active team is one Team Dock for both formats: its 5-a-side team is the one the friendlies are played with."
priority = 0
tags = ["Teams", "Gameplay"]
updated = "2026-11-04"
# The team name length filter belongs to Utilities (graft util_team_name). The format row is one list row of two columns,
# «Partido» | «Pachanga» (left / right between them, down to the next row, up back to the last column;
# content\menus\friendlies_dock.toml adds the list's left key; the half plates keep the full rows' slant:
# content\images\...	eam01_02.toml cuts them from the game's own plates at build).
# This mod's own names (Lua Friendlies.X, commands CMND_FRIENDLIES_*); never VRFW. The grafts keep their EVT_PT_* game Lua
# globals.
prefix = "Friendlies"
folder = "Friendlies"
# Standard mod
# layout:
#   scripts\friendlies.lua                   the 5v5 templates: the active pachanga team (the active match dock's pair), the
#                                          mirror rule (the 5v5 team = the 11v11 team's players, CMND_FRIENDLIES_MIRROR;
#                                          blob pachanga.json), one team per place / move, the team bonuses swap
#   scripts\scripts.toml                   the scripts' instruction budget
#   content\game\friendlies.toml             commands CMND_FRIENDLIES_* (aliases CMND_FANTASY_PACHANGA_* / CMND_EVT_PACHANGA_*)
#   content\game\save_import.toml          Inazuma Fantasy's pachanga.json, copied once per save slot
#   content\menus\friendlies_bank.toml       the bank's 5v5 pitch layer evt_bank5_field (assets\gamedata\menu\obj\ and
#                                          assets\menu\100_mainmenu\mainmenu04\evt_bank5_field\)
#   content\menus\friendlies_dock.toml       the Team Dock list's LEFT key and its own row slot joints (the format
#                                          columns, graft pachanga_dock)
#   content\images\menu\102_team\team01\team01_02.toml   the format columns' half plates: recipes that cut the game's
#                                          own list row plates at build (end caps + a shorter middle; no game pixel)
#   text\rows\friendlies_dock.toml           the type row's texts (menu_text, 9 languages)
#   text\keys.toml                         the mod's name / description
# Grafts (research/grafts, mod = "Friendlies"): pachanga_dock (the format row and the 5v5 dock), pachanga_bank (the bank's
# 5v5 view), pachanga_equip (kit / emblem of the 5v5 team), pachanga_formation (the 5v5 formations), pachanga_plate (the
# player plate in the 5v5 dock). The 7v7 and 3v3 formats are not offered yet (enabled = false; the rulesets are in Football Reforged's base).
# BetterQoL is optional: its team bank pages reach the dock through VRFW_TeamDock, the mounted page is read through
# VRFW's TeamDock.page() (0 without it) and the 5v5 kit goes through VRFW's CMND_VRFW_TEAM_UNIFORM. InaRogue is optional: while its save is
# loaded (its export InaRogue.SaveSlot) the docks keep the retail 11v11 / 5v5 link.
requires = ["VRFW>=0.2.2", "FootballReforged>=0.2.2"]
optional = ["InaRogue"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
# lua_early: the team dock patch (graft pachanga_dock, soccer_team_dock_menu) promotes the
# script's locals and redefines whole retail functions (OnInit, OnSetupLayer, OnOpenLayer, OnChangeFocus, OnFunction,
# Step, MoveFocusInc, UpdateFormationInfo...). Run after another mod's wrappers of that script, it dropped them: with
# BetterUI loading below this mod, the dock lost BetterUI's whole layout (panel, header, rows; retail look). Early,
# every other mod's dock patch wraps on top of these functions whatever the load order.
lua_early = true
permissions = ["memory", "call", "command", "state", "hook"]

[exports]
functions = []
keys = []
tables = []

# A MODULE of Football Reforged: shown inside Football Reforged's entry on the Mods
# screen; switching Football Reforged off switches it off too. On by default.
[module]
of = "FootballReforged"
order = 70
