# The framework's online compatibility window (VRFW_OnlineCompat, docs/framework/online.md) in the Battle Bay top menu:
# the «Sala privada» shows it when the other player's mod list does not match (graft research/grafts/bb_net_room,
# BBN_Closed). The two layers are the framework's window objects (VRFW content\menus\match_panel.toml) under the names
# the window looks for; 28 plates (VRFW_MatchPanel.PLATES) and 59 labels (the table: title, 4 hints, 4 columns x 13
# rows, 2 buttons; VRFW_OnlineCompat.LabelsNeeded()). The window opens and closes them itself. The res are the retail
# options atlases of the window's default look.
schema = "VRFW.menu/2"

[[patch]]
menu = "bb_stadium_top_menu"
add_layer = { name = "vrfw_mp_plate", object = "vrfw_mp_plate", count = 28, align = [1, 8], scale = 0.2, groups = [{ group = "bb_stadium_top_menu", flags = [0, 0, 0, 0, 1, 0] }] }
resources = [
    "#/menu/108_option/option01/option01_23/option01_23.g4tx",
    "#/menu/108_option/option01/option01_02/option01_02.g4tx",
]

[[patch]]
menu = "bb_stadium_top_menu"
add_layer = { name = "vrfw_mp_label", object = "vrfw_mp_label", count = 59, after = "vrfw_mp_plate", groups = [{ group = "bb_stadium_top_menu", flags = [0, 0, 0, 0, 1, 0] }] }
