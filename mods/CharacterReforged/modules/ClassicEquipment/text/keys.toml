schema = "VRFW.text_key/1"
# Texts of «Classic Equipment»: the «Mods» screen's name and description and the new sets' names (the items' own names
# are in content\items\classic_items.toml). A language or key missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Classic Equipment"
mod_description = "167 pieces of equipment from Inazuma Eleven GO, Chrono Stone and Galaxy that Victory Road lacks: boots, keeper gloves, bracelets and pendants, with their original 3DS icons and the stats they raised there, balanced like every Better Equipment item. They join its sets plus four new ones (Paradise, Samurai, Three Kingdoms, Round Table) and are sold in the shop of their closest retail equivalent. Needs Better Equipment."
set_paradise = "Paradise"
set_samurai = "Samurai"
set_threekingdoms = "Three Kingdoms"
set_roundtable = "Round Table"

[es.new]
mod_name = "Equipamiento clásico"
mod_description = "167 objetos de equipamiento de Inazuma Eleven GO, Chrono Stone y Galaxy que Victory Road no tiene: botas, guantes de portero, pulseras y colgantes, con sus iconos originales de 3DS y las estadísticas que subían allí, equilibrados como todo objeto de Better Equipment. Se suman a sus conjuntos y a cuatro nuevos (Paraíso, Samurái, Tres Reinos, Mesa Redonda) y se venden en la tienda de su equivalente más cercano. Necesita Better Equipment."
set_paradise = "Paraíso"
set_samurai = "Samurái"
set_threekingdoms = "Tres Reinos"
set_roundtable = "Mesa Redonda"

[fr.new]
mod_name = "Équipement classique"
mod_description = "167 équipements d'Inazuma Eleven GO, Chrono Stone et Galaxy absents de Victory Road : crampons, gants de gardien, bracelets et pendentifs, avec leurs icônes 3DS d'origine et les statistiques qu'ils augmentaient, équilibrés comme tout objet de Better Equipment. Ils rejoignent ses ensembles et quatre nouveaux (Paradis, Samouraï, Trois Royaumes, Table Ronde) et sont vendus dans la boutique de leur équivalent le plus proche. Nécessite Better Equipment."
set_paradise = "Paradis"
set_samurai = "Samouraï"
set_threekingdoms = "Trois Royaumes"
set_roundtable = "Table ronde"

[de.new]
mod_name = "Klassische Ausrüstung"
mod_description = "167 Ausrüstungsgegenstände aus Inazuma Eleven GO, Chrono Stone und Galaxy, die Victory Road fehlen: Schuhe, Torwarthandschuhe, Armbänder und Anhänger, mit ihren originalen 3DS-Symbolen und den dort erhöhten Werten, ausgewogen wie jeder Gegenstand von Better Equipment. Sie gehören zu dessen Sets und zu vier neuen (Paradies, Samurai, Drei Reiche, Tafelrunde) und werden im Laden ihres nächsten Gegenstücks verkauft. Benötigt Better Equipment."
set_paradise = "Paradies"
set_samurai = "Samurai"
set_threekingdoms = "Drei Reiche"
set_roundtable = "Tafelrunde"

[it.new]
mod_name = "Equipaggiamento classico"
mod_description = "167 equipaggiamenti di Inazuma Eleven GO, Chrono Stone e Galaxy che Victory Road non ha: scarpe, guanti da portiere, bracciali e ciondoli, con le loro icone 3DS originali e le statistiche che aumentavano lì, bilanciati come ogni oggetto di Better Equipment. Si aggiungono ai suoi set e a quattro nuovi (Paradiso, Samurai, Tre Regni, Tavola Rotonda) e si vendono nel negozio del loro equivalente più vicino. Richiede Better Equipment."
set_paradise = "Paradiso"
set_samurai = "Samurai"
set_threekingdoms = "Tre Regni"
set_roundtable = "Tavola Rotonda"

[pt.new]
mod_name = "Equipamento clássico"
mod_description = "167 equipamentos de Inazuma Eleven GO, Chrono Stone e Galaxy que o Victory Road não tem: chuteiras, luvas de guarda-redes, pulseiras e pendentes, com os seus ícones originais da 3DS e os atributos que aumentavam lá, equilibrados como todo item do Better Equipment. Juntam-se aos seus conjuntos e a quatro novos (Paraíso, Samurai, Três Reinos, Távola Redonda) e vendem-se na loja do equivalente mais próximo. Precisa do Better Equipment."
set_paradise = "Paraíso"
set_samurai = "Samurai"
set_threekingdoms = "Três Reinos"
set_roundtable = "Távola Redonda"

[ja.new]
mod_name = "クラシック装備"
mod_description = "イナズマイレブンGO・クロノ・ストーン・ギャラクシーにあってヴィクトリーロードにない装備167個：シューズ、グローブ、ミサンガ、ペンダント。3DS版のアイコンとそのとき上がった能力をそのままに、Better Equipmentの装備と同じ強さに調整。Better Equipmentのセットと4つの新セット（パラダイス・サムライ・三国・円卓）に加わり、いちばん近い装備と同じ店で買えます。Better Equipmentが必要です。"
set_paradise = "楽園"
set_samurai = "侍"
set_threekingdoms = "三国志"
set_roundtable = "円卓"

[zh_hans.new]
mod_name = "经典装备"
mod_description = "闪电十一人GO、时空之石与银河中有而胜利之路中没有的167件装备：球鞋、守门员手套、手绳与吊坠，保留3DS原版图标和当时提升的能力，强度与Better Equipment的装备一致。它们加入其套装与四个新套装（乐园、武士、三国、圆桌），并在最接近的装备的商店出售。需要Better Equipment。"
set_paradise = "乐园"
set_samurai = "武士"
set_threekingdoms = "三国"
set_roundtable = "圆桌"

[zh_hant.new]
mod_name = "經典裝備"
mod_description = "閃電十一人GO、時空之石與銀河中有而勝利之路中沒有的167件裝備：球鞋、守門員手套、手繩與吊墜，保留3DS原版圖示和當時提升的能力，強度與Better Equipment的裝備一致。它們加入其套裝與四個新套裝（樂園、武士、三國、圓桌），並在最接近的裝備的商店出售。需要Better Equipment。"
set_paradise = "樂園"
set_samurai = "武士"
set_threekingdoms = "三國"
set_roundtable = "圓桌"
