# Option warrior_spirit_name: in Spanish texts (the game's and every mod's) «keshin» reads «Espíritu Guerrero», always with both capitals.
# The longest rule matching at a place wins; a plural determiner, «keshins» or a generic plural use take «Espíritus Guerreros»; an all-capitals word stays all capitals.
[[es.rewrite]]
if_mod = "BetterQoL.warrior_spirit_name"
ignore_case = true
rules = [
    { from = "keshins", to = "Espíritus Guerreros" },
    { from = "los keshin", to = "los Espíritus Guerreros" },
    { from = "sus keshin", to = "sus Espíritus Guerreros" },
    { from = "nuestros keshin", to = "nuestros Espíritus Guerreros" },
    { from = "vuestros keshin", to = "vuestros Espíritus Guerreros" },
