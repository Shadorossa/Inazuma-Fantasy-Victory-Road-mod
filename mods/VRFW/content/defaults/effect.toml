
[shot_aura]
# Trigger name of the plain shot.
shoot_trigger = "shoot"
# Ball trigger row copied by a pooled effect without one (a rule's `like` wins).
default_like = "ega0075e"
# Prefix of added ball triggers: <prefix><effect game name>; changing it changes every added trigger id.
trigger_prefix = "vrfw_shot_aura."

# Trigger lists of the character-effect controllers (eff_chr_trigger; the ball's list holds one row per own aura).
[trigger_lists]
# Most rows one list (a character's or the ball's) keeps when a controller is built.
max_rows = 201
pool_reserve = 0.05

[shot_aura.form_words]
keshin = "keshin"
armour = "armour"
armor = "armour"
armed = "armour"
miximax = "miximax"
aura = "aura"
none = "none"

# Defaults for a [[shot_aura]] `fit`: the aura replay (`replay` frames, 60 fps) is stretched to the remaining flight time.
[shot_aura.fit]
mode = "sustain"
min_rate = 0.15
max_rate = 2.0
lead = 0.0
intro = 12
outro = 0.25
outro_min = 6

[shot_aura.anchor]
default_anchor = "kick"
default_drift = 0.75
max_rate = 4.0
launch_speed = 5.0

[event_lists]
eff = "data/common/event_cfg/eff/%s_eff.cfg.bin"
evt = "data/common/event_cfg/evt/%s.cfg.bin"

# Defaults for a pooled [[event_effect]]: actor motions and locator when `attach.motions` / `attach.locator` are omitted.
[event_effect]
motions = ["in", "loop", "out"]
locator = "NONE"
# Effect object attach point when `attach.point` is omitted.
point = "point_eff"
