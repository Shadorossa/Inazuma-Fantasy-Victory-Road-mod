# BetterQoL: Local / Visitante kit picker of equip_uniform_menu_list (pairs from CMND_BETTERQOL_AK_PAIR); X switches a kit
# and its declared variant (CMND_VRFW_KIT_VARIANT).
name = "away_kit"
order = 100
mod = "BetterQoL"
module = "lua_bridge"
requires = []
conflicts = []
wraps = ["CheckTeamDockUniformEquip", "OnEnter", "OnFunction", "OnInit", "UpdateCharaModel", "UpdateItemEquipMenu"]
description = "BetterQoL: Local / Visitante kit picker"

[[files]]
stem = "equip_uniform_menu_list"

  [[files.ops]]
  type = "insert_before"
  point = "equip_uniform_menu_list.OnSetupLayer.AwayKit"
  text = '''
      -- EVT away_kit BEGIN
      team_set_info2 = BetterQoL.away_kit.focus_uniform(team_set_info2)
      -- EVT away_kit END
'''
  crc = "none"

  [[files.ops]]
  type = "insert_before"
  point = "equip_uniform_menu_list.UpdateButtonGuide.AwayKit"
  text = '''
  -- EVT away_kit BEGIN
  if BetterQoL.away_kit.ON then
    t5[#t5 + 1] = BetterQoL.away_kit.btn_text()
    t6[#t6 + 1] = BetterQoL.away_kit.BTN_ICON
    t7[#t7 + 1] = 18
    t8[#t8 + 1] = BetterQoL.away_kit.BTN_KEY
    local variant_text = BetterQoL.away_kit.variant_btn_text()
    if variant_text ~= nil then
      t5[#t5 + 1] = variant_text
      t6[#t6 + 1] = BetterQoL.away_kit.VAR_BTN_ICON
      t7[#t7 + 1] = 18
      t8[#t8 + 1] = BetterQoL.away_kit.VAR_BTN_KEY
    end
  end
  -- EVT away_kit END
'''
  crc = "none"

  [[files.ops]]
  type = "append_block"
  source = "away_kit_1.lua"
