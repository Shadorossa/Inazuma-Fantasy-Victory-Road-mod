#   content\shop_tabs\technique_shop*.toml  GENERATED: their moves tab split per move type (VRFW [[VRFW.ShopTab]])
#   content\shops\moved_rows.toml       GENERATED: the retail rows they replace, hidden (story shops untouched)
#   content\shop_redirects\emptied_shops.toml  GENERATED: the emptied retail shops open the General Store (VRFW redirect)
#   content\menus\market_menu.toml      GENERATED: the Mercado's bar count, one per shop
#   assets\menu\150_shop\...\shop01_20.g4pkm   GENERATED: research/scripts/inazuma_fantasy_market_bar.py
#   text\rows\shop_text.toml            GENERATED: the bars' names and the split tabs' titles
#   content\items\level_orbs.toml, scripts\level_orbs.lua, content\game\level_orbs.toml, config.toml [level_orbs.levels]
#                                       the level orbs (ex0001 .. ex0003); the use: research/grafts/inazuma_fantasy_level_orbs
#   _advent_calendar.toml, content\shops\advent_calendar.toml  the advent calendar's rewards: rule (developer file) and
#                                       GENERATED tables (research/scripts/inazuma_fantasy_advent_build.py)
#   content\items\currencies.toml       Puntos de pasión (tk_bb000001): retail item renamed, the match rule that pays
#                                       it (config.toml [match_drops.passion]); its icon in content\images\...\currencies*.
#                                       Puntos de amistad (tk_hr000008) are Character Reforged's ClassicRecruitment module's
