# The Campaign's rival draw as native data (schema VRFW.game/1, docs/internal/native.md), handled by
# scripts\campaign.lua (`VRFW.on("hook:Decide")` / `VRFW.on("hook:Decide:post")`).
schema = "VRFW.game/1"

# ---------------------------------------------------------------- functions
[[VRFW.Function]]
name = "GameDecide"
pattern = "48 89 5C 24 10 55 56 57 41 54 41 55 41 56 41 57 48 8D AC 24 70 FF FF FF 48 81 EC 90 01 00 00 0F 29 B4 24 80 01 00 00 48 8B 05 ?? ?? ?? ?? 48 33 C4 48 89 45 70 45 8B F8 44 89 7C 24 58 4C 8B EA 48 89 54 24 68 48 8B F1 8B 02 89 44 24 40 45 33 C0 48 8D 54 24 40 E8 ?? ?? ?? ??"
rva = 0x1073620
arguments = ["ptr", "ptr", "u32"]

[[VRFW.Function]]
# void* Menu::FindChildByHash(this, const u32* hash, u8) 0x533940: the grid layer's child (cursor slot at +0x154).
name = "FindChildByHash"
pattern = "48 89 5C 24 10 48 89 6C 24 18 48 89 74 24 20 57 41 54 41 55 41 56 41 57 48 83 EC 20 44 0F B7 61"
rva = 0x5354A0
arguments = ["ptr", "ptr", "u8"]
returns = "ptr"

[[VRFW.Function]]
# bool EvalCondition(const u8* cond) 0xDCB560 (the grid ctor's unlock-condition evaluator).
name = "EvalCondition"
pattern = "48 8B C1 C3 CC CC CC CC 48 81 EC 48 02 00 00 48 8B 05 ?? ?? ?? ?? 48 33 C4"
offset = 8
rva = 0xDD0EC8
arguments = ["ptr"]
returns = "bool"

# ---------------------------------------------------------------- globals ([[g_gameRoot]+…])
[[VRFW.Global]]
name = "campaign_code"
rip = { pattern = "81 F9 D9 80 09 14 0F 85 ?? ?? ?? ?? 4C 8B 2D ?? ?? ?? ?? 4C 89 6C 24 ?? 80 BE ?? ?? ?? ?? 00 0F 84 ?? ?? ?? ?? 4D 85 ED 0F 84 ?? ?? ?? ?? 48 8B 05 ?? ?? ?? ?? 48 8B 80 ?? ?? ?? ??", disp_off = 0x31, next_ip_off = 0x35, rva = 0x1073E64, target_rva = 0x21F62A0 }

[[VRFW.Global]]
# enjoy_mode_team_config in memory: rows +0x108 (stride 0x40), count +0x110
name = "enjoy"
base = "game_root"
chain = ["Game.RootEnjoyTeams"]

[[VRFW.Global]]
# the session block S: +0x2CA6EC player team, +0x2CA6F0 the 7 rivals, +0x2CA70C match index
name = "session"
base = "game_root"
chain = ["Game.RootPlayData"]

# ---------------------------------------------------------------- structs
[[VRFW.Struct]]
name = "EnjoyTable"
size = 0x118
fields = { rows = { at = 0x108, type = "ptr" }, count = { at = 0x110, type = "i32" } }

[[VRFW.Struct]]
# one enjoy row (stride 0x40): +0x10 = its unlock condition (null = none)
name = "EnjoyRow"
size = 0x40
fields = { team = { at = 0x0, type = "u32" }, leader = { at = 0x4, type = "u32" }, stadium = { at = 0xC, type = "u32" }, cond = { at = 0x10, type = "ptr" }, bgm = { at = 0x2C, type = "u32" } }

[[VRFW.Struct]]
name = "GridMenu"
size = 0x8C8
fields = { campaign = { at = 0x8A5, type = "u8", pattern = "80 BE ?? ?? ?? ?? 00 0F 85 ?? ?? ?? ?? 0F B6 86 ?? ?? ?? ?? 80 BE ?? ?? ?? ?? 00 0F 84", capture = "disp32@2", rva = 0x1073840, moves_with = "GridMenu.Campaign" }, player_one_decided = { at = 0x8B4, type = "u8", pattern = "80 BE ?? ?? ?? ?? 00 0F 85 ?? ?? ?? ?? 0F B6 86 ?? ?? ?? ?? 80 BE ?? ?? ?? ?? 00 0F 84", capture = "disp32@22", rva = 0x1073840, moves_with = "GridMenu.Campaign" } }

[[VRFW.Struct]]
# one grid slot record, addressed as menu + GridMenu.Slots + slot * 0x38 (scripts\lib\game.lua).
name = "GridSlot"
size = 0x38
fields = { team = { at = 0x4, type = "u32", pattern = "48 0F BF 88 ?? ?? ?? ?? 48 6B D9 38 8B 9C 33 ?? ?? ?? ?? 48 0F BF 86 ?? ?? ?? ?? 48 6B F8 38 8B BC 37", capture = "disp32@15", rva = 0x1073A82, relative_to = "GridMenu.Slots" }, unlocked = { at = 0x33, type = "u8", pattern = "81 F9 F6 71 54 06 0F 85 ?? ?? ?? ?? 49 6B D7 38 80 BC 32 ?? ?? ?? ?? 00 0F 84", capture = "disp32@19", rva = 0x107368B, relative_to = "GridMenu.Slots" } }

[[VRFW.Struct]]
# the grid layer's cursor slot, read from the same GameDecide code (`movsx rcx, word [rax+154h]`)
name = "GridChild"
size = 0x158
fields = { cursor = { at = 0x154, type = "i16", pattern = "48 0F BF 88 ?? ?? ?? ?? 48 6B D9 38 8B 9C 33 ?? ?? ?? ?? 48 0F BF 86 ?? ?? ?? ?? 48 6B F8 38 8B BC 37", capture = "disp32@4", rva = 0x1073A82 } }

[[VRFW.Struct]]
name = "Session"
size = 0x2CA710
fields = { game = { at = 0x2CA6E4, type = "u32" }, difficulty = { at = 0x2CA6E8, type = "u8" }, player = { at = 0x2CA6EC, type = "u32" }, rival1 = { at = 0x2CA6F0, type = "u32" }, match = { at = 0x2CA70C, type = "u8" } }

# ---------------------------------------------------------------- the hook (step H phase 2)
[[VRFW.Hook]]
# EnjoySelectTeamMenu vtable (.rdata 0x19F75D8, named by the ctor's `lea rax,[rip+vtable]`) slot 43 = Decide.
name = "Decide"
kind = "vtable"
pattern = "48 8B 05 ?? ?? ?? ?? 48 89 81 ?? ?? ?? ?? 48 8D 05 ?? ?? ?? ?? 48 89 01 48 81 C1 ?? ?? 00 00 B2 1C E8"
rva = 0x10755DB
rip = { disp_off = 0x11, next_ip_off = 0x15, target_rva = 0x19F75D8 }
slot = 43
expect_fn = "GameDecide"
arguments = ["ptr", "ptr", "u32", "u64"]
returns = "u64"
needs = ["campaign_code", "FindChildByHash", "enjoy", "session", "EnjoyTable", "EnjoyRow", "GridMenu", "GridSlot", "GridChild", "Session"]
# the pre-phase waits for a busy script VM: a skipped pre-phase is the game's own draw from the visible page only

[[VRFW.Command]]
# -> the difficulty index (0-3) an active mod owns, -1 = none (the player picks it)
name = "CMND_BATTLEBAYDELUXE_DIFFICULTY_OWNED"
handler = "BattleBayDeluxe.OwnedDifficulty"

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_DIFFICULTY_START"
handler = "BattleBayDeluxe.StartWithoutDifficulty"
needs = ["GameDecide", "campaign_code", "FindChildByHash", "enjoy", "session", "EnjoyTable", "EnjoyRow", "GridMenu", "GridSlot", "GridChild", "Session"]

[[VRFW.Command]]
# -> team, template a saved Campaña or running Torneo plays on a Personal Teams tile; nil when none
name = "CMND_BATTLEBAYDELUXE_TILE_RUN"
handler = "BattleBayDeluxe.TileRun"

[[VRFW.Command]]
# (team, team set, template) -> true: the Personal Teams tile plays that team set, kept for the saved run
name = "CMND_BATTLEBAYDELUXE_TILE_PLAYS"
handler = "BattleBayDeluxe.TilePlays"

[[VRFW.Command]]
name = "CMND_BATTLEBAYDELUXE_CAMPAIGN_SYNC"
handler = "BattleBayDeluxe.CampaignSync"
needs = ["session", "Team.FindConfig", "RosterRowsCode", "RosterParamCode", "RosterSlotCode", "TeamRecord", "TeamConfig", "MemberRow", "enjoy", "EnjoyTable", "EnjoyRow"]
