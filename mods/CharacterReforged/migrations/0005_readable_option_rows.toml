schema = "VRFW.migration/1"
id = "CharacterReforged.readable_option_rows"
description = "Character Reforged option rows and config keys get readable names: the saved values are kept"
phase = "data"
after = ["VRFW.no_compat_names", "CharacterReforged.totems_in_base"]

# option rows: stamina_points first, so a current value wins over an old pe row
[[step]]
kind = "rename_option_row"
from = "CharacterReforged.stamina_points"
to = "CharacterReforged.stamina"
if_target = "keep_target"

[[step]]
kind = "rename_option_row"
from = "CharacterReforged.peg"
to = "CharacterReforged.keshin_points"
if_target = "keep_target"

[[step]]
kind = "rename_option_row"
from = "CharacterReforged.sp"
to = "CharacterReforged.totem_points"
if_target = "keep_target"

[[step]]
kind = "rename_option_row"
from = "CharacterReforged.pe"
to = "CharacterReforged.stamina"
if_target = "keep_target"

# the player's [mods.CharacterReforged] overrides in the loader's config.toml
[[step]]
kind = "rename_save_key"
file = "{data}/config.toml"
from = "mods.CharacterReforged.pe"
to = "mods.CharacterReforged.stamina"
if_target = "keep_target"

[[step]]
kind = "rename_save_key"
