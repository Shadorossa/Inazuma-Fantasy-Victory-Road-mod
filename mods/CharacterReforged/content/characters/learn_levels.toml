# Move learn levels, read by the framework's learn-level service.
schema = "VRFW.character/2"

[VRFW.LearnLevels]
Enforce = true
UnusedSlots = [7, 8]
AuraSlots = [9]
# keshin and totem hold slot 9 over any other aura type, as in generator_rules.toml Forms.AuraTypes
AuraSlotPriority = [0, 3]
StarterAtFloor = true
FreeListSlots = [5, 6]
Tiers = [
    { Power = 200, Level = 1 },
    { Power = 300, Level = 5 },
    { Power = 360, Level = 12 },
    { Power = 440, Level = 22 },
    { Power = 540, Level = 32 },
    { Power = 640, Level = 42 },
    { Power = 720, Level = 52 },
    { Power = 800, Level = 62 },
    { Power = 880, Level = 75 },
]
