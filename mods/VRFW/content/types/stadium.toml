schema = "VRFW.table_map/1"

[[map]]
entry = "stadium"
table = "soccer/soccer_option_field_info"
mode = "append"
key = "map"
cells = "cells"
count = "stadiums"
[map.fields]
map = { type = "string", check = "key", required = true }
name = { text = "map_text", text_id = "map_name_{map}", text_field = "noun" }
picture = { type = "string", check = "key", default = "img_room_{map}" }
order = { type = "int" }
unlock_item = { type = "id" }
[map.refs]
unlock_item = "item"
[map.derive]
c1 = { lua = "stadium.lua:order" }
c2 = { lua = "stadium.lua:condition" }
c3 = "#/menu/220_img/stadium/{picture}.g4tx"
c4 = { crc32 = "{picture}_01" }
c5 = { crc32 = "{picture}_02" }
