schema = "VRFW.game/2"

# New Recruitment › the pachanga zones of the Chronicle board. Run time:
# scripts\pachangas.lua; game Lua side: assets\lua\vs_route_town_menu\new_recruitment_pachangas.lua.

# (node name) -> zone index, title text id, stadium map crc, pachanga count
[[VRFW.Command]]
name = "CMND_CLASSICRECRUITMENT_PACHANGA_ZONE"
handler = "ClassicRecruitment.PachangaZone"

# (zone index, i) -> key, rival team crc, team name, level, format, won, card count, cards…
[[VRFW.Command]]
name = "CMND_CLASSICRECRUITMENT_PACHANGA_GET"
handler = "ClassicRecruitment.PachangaGet"

# (key) -> true: the next match is that pachanga's
[[VRFW.Command]]
name = "CMND_CLASSICRECRUITMENT_PACHANGA_ARM"
handler = "ClassicRecruitment.PachangaArm"

# () -> key, won of the last armed pachanga's match (read once)
[[VRFW.Command]]
name = "CMND_CLASSICRECRUITMENT_PACHANGA_RESULT"
handler = "ClassicRecruitment.PachangaResult"

# (key) -> true when the pachanga was won in this save slot
[[VRFW.Command]]
name = "CMND_CLASSICRECRUITMENT_PACHANGA_WON"
handler = "ClassicRecruitment.PachangaWon"

# (key) -> true (save key won.<key>)
[[VRFW.Command]]
name = "CMND_CLASSICRECRUITMENT_PACHANGA_SET_WON"
handler = "ClassicRecruitment.PachangaSetWon"

# (zone index, i) -> the pose row screen's page: i = 0 the header, i >= 1 pachanga i (content\pose_rows\pachangas.toml)
[[VRFW.Command]]
name = "CMND_CLASSICRECRUITMENT_PACHANGA_MENU"
handler = "ClassicRecruitment.PachangaMenu"

# (team level) -> true: the base the pachangas' levels scale from (the board sets it when a zone's list opens)
[[VRFW.Command]]
name = "CMND_CLASSICRECRUITMENT_PACHANGA_BASE"
handler = "ClassicRecruitment.PachangaBase"

# (key) -> its level now, the friendly's match row level
[[VRFW.Command]]
name = "CMND_CLASSICRECRUITMENT_PACHANGA_LEVEL"
handler = "ClassicRecruitment.PachangaLevel"

# (card rarity, level, card) -> currency item id, count: the price of a signing from BetterQoL's album (scripts\album_price.lua,
# config.toml [album])
[[VRFW.Command]]
name = "CMND_CLASSICRECRUITMENT_ALBUM_PRICE"
handler = "ClassicRecruitment.AlbumPrice"

# (level, cards as text "rarity:card,rarity:card") -> { count per card }, icon atlas, icon sprite: the prices of one album
# page, shown at the right edge of its rows
[[VRFW.Command]]
name = "CMND_CLASSICRECRUITMENT_ALBUM_PRICES"
handler = "ClassicRecruitment.AlbumPrices"
