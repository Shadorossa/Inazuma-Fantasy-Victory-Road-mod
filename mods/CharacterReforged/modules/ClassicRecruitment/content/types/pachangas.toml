# New Recruitment › the declaration schema of the pachangas.
# The run time is this module's
# scripts\pachangas.lua; this file lists every key it reads, so `vrfw check` validates the files and the ModManager
# draws their forms from it («Cadenas» › «Pachangas»: a zone's board node and its pachangas). `ref` names what a value points at: a game index category (team, match, stadium, any:variant), a text
# row (text_key), a Chronicle board node (route_node) or another entry of this schema (entry:<Entry>).
schema = "VRFW.decl_schema/1"
kind = "ClassicRecruitment.pachangas/1"
folder = "content/pachangas"
label = "Pachangas"
label_es = "Pachangas"
doc = "Pachanga zones on the Chronicle board and their friendlies."
doc_es = "Zonas de pachangas en el tablero de la Crónica y sus amistosos."

[entry.PachangaZone]
doc = "a pachanga zone: one Chronicle board node whose list holds the zone's pachangas"
name = { type = "name", required = true, doc = "the zone's name (a-z 0-9 _); the pachangas name it in zone" }
game = { type = "string", values = ["ie1", "ie2", "ie3", "go", "cs", "galaxy"], doc = "the saga the zone belongs to" }
node = { type = "string", required = true, ref = "route_node", doc = "the [[VRFW.RouteNode]] Name of the zone's board node" }
title = { type = "string", ref = "text_key", doc = "the text row id of the zone's name (menu_text)" }
chronicle = { type = "string", ref = "match", doc = "the Chronicle match whose piece the zone's node hangs from" }
stadium = { type = "string", ref = "stadium", doc = "the map the zone's pachangas are played on" }

[entry.Pachanga]
doc = "a pachanga: a friendly against a team of the zone"
name = { type = "name", required = true, doc = "the pachanga's name (a-z 0-9 _)" }
zone = { type = "string", required = true, ref = "entry:PachangaZone", doc = "the zone whose list shows it" }
level_offset = { type = "int", default = 0, doc = "added to the pachanga's base level (scripts/pachangas.lua)" }
team = { type = "string", required = true, ref = "team", doc = "the rival team (a mod team key or a game team)" }
team_name = { type = "string", doc = "the team's name shown when its team has none" }
level = { type = "int", min = 1, max = 999, doc = "the rival players' level" }
format = { type = "string", values = ["5v5", "11v11"], default = "5v5", doc = "the match format" }
cards = { type = "ids", ref = "any:variant", doc = "the rival players' cards (chara_param keys), goalkeeper first" }

[entry.PachangaLevel]
single = true
doc = "how the pachanga levels scale (one per file; scripts/pachangas.lua)"
scale = { type = "string", default = "data" }
min = { type = "int", default = 1 }
max = { type = "int", default = 200 }
row_level = { type = "int", default = 0 }
