# Hissatsu Reforged's level-up banner (docs/game/mechanics/skill-rank-usage.md section 7.10): when a move levels up by use
# the mod re-opens the move's skill telop and SetupCommonSkillTelop appends the text HissatsuReforged.RankUpSuffix
# («sube a Nv.N», text\rows\rank_items.toml of the mod, {n} = the new level) to the move's name. The level comes from
# CMND_HISSATSUREFORGED_RANK_POPUP (scripts\hissatsu_level_up.lua; consumed once). Without the mod the command does not answer
# and the banner is retail. Was Inazuma Fantasy's (module skill_rank) until 2026-10-14. Nothing at chunk load.
# It also turns the save's old upgrade book stock (abl_ub000001) into the mod's raise item
# (abl_000001) once per save slot; the ids come from CMND_HISSATSUREFORGED_RETAIL_STOCK.
name = "sr_popup"
mod = "HissatsuReforged"
order = 100
module = "lua_bridge"
requires = []
conflicts = []
wraps = []
description = "Hissatsu Reforged: ' sube a Nv.N' suffix on the skill telop"

[[files]]
stem = "common_skill_telop"

  [[files.ops]]
  type = "insert_before"
  point = "common_skill_telop.SetupCommonSkillTelop.SrPopup"
  text = '''
    -- Hissatsu Reforged: level-up banner ("<name> sube a Nv.N"); retail text when nothing is pending / no mod
    local hissatsu_reforged_ok, hissatsu_reforged_grade = funcLuaCommand(3641528298 --[[CMND_HISSATSUREFORGED_RANK_POPUP]], n)
    if hissatsu_reforged_ok == true and type(ret) == "string" and type(hissatsu_reforged_grade) == "number" then
      local hissatsu_reforged_tok, hissatsu_reforged_sfx = pcall(funcLuaCommand, 4074371074 --[[CMND_TEXT_GET]], 386035608 --[[HissatsuReforged.RankUpSuffix]])
      if hissatsu_reforged_tok and type(hissatsu_reforged_sfx) == "string" and hissatsu_reforged_sfx ~= "" then
        ret = ret .. string.gsub(hissatsu_reforged_sfx, "{n}", tostring(hissatsu_reforged_grade + 1))
      end
    end
    -- The save's old upgrade book stock becomes the mod's raise item, once per save slot; the
    -- mod answers -1 with the two item ids
    do
      local hissatsu_reforged_rok, hissatsu_reforged_need, hissatsu_reforged_old, hissatsu_reforged_new = pcall(funcLuaCommand, 3708867843 --[[CMND_HISSATSUREFORGED_RETAIL_STOCK]], -1)
      if hissatsu_reforged_rok and hissatsu_reforged_need == true and type(hissatsu_reforged_old) == "number" and type(hissatsu_reforged_new) == "number" then
        local hissatsu_reforged_nok, hissatsu_reforged_num = pcall(funcLuaCommand, 2011560392 --[[CMND_GET_ITEM_NUM]], hissatsu_reforged_old, false)
        if hissatsu_reforged_nok and type(hissatsu_reforged_num) == "number" then
          if hissatsu_reforged_num > 0 then
            pcall(funcLuaCommand, 425598937 --[[CMND_DELETE_ITEM]], hissatsu_reforged_old, hissatsu_reforged_num)
            pcall(funcLuaCommand, 1897915498 --[[CMND_ADD_ITEM_ONLY]], hissatsu_reforged_new, hissatsu_reforged_num)
          end
          pcall(funcLuaCommand, 3708867843 --[[CMND_HISSATSUREFORGED_RETAIL_STOCK]], hissatsu_reforged_num)
        end
      end
    end
'''
  crc = "none"
