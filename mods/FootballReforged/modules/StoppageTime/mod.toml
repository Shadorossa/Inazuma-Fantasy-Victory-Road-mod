id = "StoppageTime"
# name / description: the English fallback; the card shows the text keys mod_name / mod_description (text\keys.toml)
name = "Stoppage Time"
version = "0.2.4"
author = "Fantasy Team"
author_steam = "76561199013321372"
description = "Added time at the end of every half, as in football: fouls, special moves, keeper scenes, goals and substitutions add seconds, rounded to whole minutes (1 to 5). A «+N» telop shows when the regular time ends and the clock keeps running. When the added time runs out, the half ends by the play: at once if the team with the ball is in its own half, near the rival goal once its shot resolves or it loses the ball."
priority = 0
tags = ["Gameplay"]
updated = "2026-11-05"
# This mod's own names (Lua StoppageTime.X, command CMND_STOPPAGETIME_TELOP, layer stoppage_time_telop); never VRFW.
prefix = "StoppageTime"
folder = "StoppageTime"
# Added time from what happened in the half and play-on while attacking.
# Standard mod layout:
#   config.toml                       [stoppage_time] the seconds of each event, the halves, the limits, the modes and
#                                     states it skips; [play_on] the zones, the limits, what ends the play;
#                                     [telop] the «+N» text's place and size, the states that end it
#   scripts\stoppage_time.lua         the run time: counts the half's events, sets the added time when the regular
#                                     time ends, decides the play-on and ends the half when the play ends
#   content\game\telop.toml           the command CMND_STOPPAGETIME_TELOP the «+N» layer asks; the game's menu lookup
#   content\menus\stoppage_time_telop.toml   the «+N» text: a layer of the scoreboard's screen, shown and hidden with it
#   assets\lua\_all\stoppage_time_telop.lua  writes the text when its layer opens and when the run time changes it
#   text\keys.toml                    the card's name / description and the telop's text, 9 languages
# The framework provides the mechanisms (VRFW period service: the trigger time_up, VRFW.match.period / set_added /
# end_period; the match triggers foul, goal, possession, cutin_start, keeper_scene, state_enter and the game event
# match:substitution); this module only declares the rules.
requires = ["VRFW>=0.2.4", "FootballReforged>=0.2.4"]
conflicts = []
loader_modules = ["lua_bridge"]
loader_min = "1.7.0"
permissions = ["call", "command", "memory"]

[exports]
functions = []
keys = []
tables = []

# A MODULE of Football Reforged: shown inside Football Reforged's entry on the Mods
# screen; switching Football Reforged off switches it off too. On by default.
[module]
of = "FootballReforged"
order = 130
