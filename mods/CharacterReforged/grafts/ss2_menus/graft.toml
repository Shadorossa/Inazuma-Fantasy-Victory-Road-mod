# The skill table vrfw_skill_slot_menu (retail equip_menu_select copy + feature blocks), the ability list pick block
# and the six-sense hand-back of ability_list_menu_on_bluebg (research/mods/CharacterReforged/_tools/ss2_build.py; docs/game/skill-slots.md).
name = "ss2_menus"
mod = "CharacterReforged"
order = 100
module = "lua_bridge"
requires = []
conflicts = []
wraps = ["CharacterReforgedSkillTableOpenOriginalBoard", "CharacterReforgedSkillTablePickCoroutine", "CreateEquipTypeTable", "GetEquipItemIdByLayerIdx", "GetEquipListItemInfo", "GetEquipType", "GetEquipTypeNum", "OnAfterReceiveFilterParam", "OnBack", "OnChangeFocus", "OnDecideFocus", "OnEnter", "OnFunction", "OnInit", "OnOpenLayer", "OnSetupLayer", "SendSkillIdToLua", "Step", "UpdateButtonGuide", "UpdateEquipCondition", "UpdateEquipItemInfo", "UpdateEquipListItem", "UpdateEquippedVisibleCheck", "UpdateListItem", "UpdateSkillDetailWindow"]
description = "Skill table vrfw_skill_slot_menu and the ability list picks"

[[files]]
path = "common/script/lua/menu/vrfw_skill_slot_menu.lua.bin"

  [[files.ops]]
  type = "new_file"
  source = "vrfw_skill_slot_menu.lua"
  # the feature blocks, filled in the order listed; the Hiper card is included by one of them
  [files.ops.include]
  "@BLOCK_SKILL_SLOTS@" = "blocks/skill_slots.lua"
  "@BLOCK_PLAYER_SET_ROLE@" = "blocks/player_set_role.lua"
  "@BLOCK_BOARD_ENTRY_POINTS@" = "blocks/board_entry_points.lua"
  "@BLOCK_CUSTOM_PASSIVE_PICKER@" = "blocks/custom_passive_picker.lua"
  "@BLOCK_HIPER_MIXIMAX@" = "blocks/hiper_miximax.lua"
  "@BLOCK_MIXIMAX_SCENE@" = "blocks/miximax_scene.lua"
  "@BLOCK_RESET_DELETE@" = "blocks/reset_delete.lua"
  "@BLOCK_COMPACT_DETAIL@" = "blocks/compact_detail.lua"
  "@BLOCK_TWO_HIPER_SLOTS@" = "blocks/two_hiper_slots.lua"
  "@BLOCK_MIXIMAX_SCENE_INPUT_GUARD@" = "blocks/miximax_scene_input_guard.lua"
  "@BLOCK_ROW_FOCUS_RESYNC@" = "blocks/row_focus_resync.lua"
  "@BLOCK_MOVE_PLATE_ROWS@" = "blocks/move_plate_rows.lua"
  "@BLOCK_REFORGED_PROJECTION@" = "blocks/reforged_projection.lua"
  "@BLOCK_BOARD_ONLY_MOVE_GUIDE@" = "blocks/board_only_move_guide.lua"
  "@BLOCK_REFORGED_SLOT_RULES@" = "blocks/reforged_slot_rules.lua"
  "@BLOCK_UNLIMITED_COPIES@" = "blocks/unlimited_copies.lua"
  "@BLOCK_FANTASY_SLOT_FALLBACKS@" = "blocks/fantasy_slot_fallbacks.lua"
  "@BLOCK_HIPER_ROW_RESET_DELETE@" = "blocks/hiper_row_reset_delete.lua"
  "@BLOCK_BOARD_CLOSE_GUARD@" = "blocks/board_close_guard.lua"
  "@HIPER_CARD@" = "../plate_hiper_plate/character_reforged_hiper_card.lua"

[[files]]
stem = "ability_list_menu"

  [[files.ops]]
  type = "append_block"
  source = "ss2_pick_1.lua"

[[files]]
stem = "ability_list_menu_on_bluebg"

  [[files.ops]]
  type = "append_block"
  source = "ss2_blue_1.lua"
  crc = "none"
