schema = "VRFW.game/2"

[[VRFW.Patch]]
name = "SlotDecide.CreatedRole"
game = "Board.RoleMedalSlotDecideRole"
width = "u32"
value = { config = "role_medal.matches_required_created_role", min = 0, max = 127 }

[[VRFW.Patch]]
name = "SlotDecide.Required"
game = "Board.RoleMedalSlotDecide"
width = "u32"
value = { config = "role_medal.matches_required", min = 0, max = 127 }

[[VRFW.Patch]]
name = "SlotState.Required"
game = "Board.RoleMedalSlotState"
width = "u32"
value = { config = "role_medal.matches_required", min = 0, max = 127 }

[[VRFW.Patch]]
name = "SlotState.CreatedRole"
game = "Board.RoleMedalSlotStateRole"
width = "u32"
value = { config = "role_medal.matches_required_created_role", min = 0, max = 127 }

# Badge slot handler, event 0xE9EE6361: rarity <= 4 and cmp ax, 30; jb -> open the badge piece (0x165ABB0)
[[VRFW.Patch]]
name = "PieceOpen.Required"
game = "Board.RoleMedalPieceOpen"
width = "u8"
value = { config = "role_medal.matches_required", min = 0, max = 127 }

# Slot light 0xFF14B0 (piece type 9): cmp ax, 10; jb (one threshold for everyone: the lower of the two)
[[VRFW.Patch]]
name = "SlotLight"
game = "Board.RoleMedalSlotLight"
width = "u8"
value = { min_of = [{ config = "role_medal.matches_required", min = 0, max = 127 }, { config = "role_medal.matches_required_created_role", min = 0, max = 127 }] }

# Board piece update 0xFF3680 (piece type 9): cmp word [rax+1E8h], 30; jae -> the badge piece is opened
[[VRFW.Patch]]
name = "PieceUpdate.Required"
game = "Board.RoleMedalPieceUpdate"
width = "u8"
value = { config = "role_medal.matches_required", min = 0, max = 127 }

[[VRFW.State]]
key = "BetterQoL.role_medal.matches_required"
value = { config = "role_medal.matches_required", min = 0, max = 127 }
fallback = 30
needs = ["SlotDecide.CreatedRole", "SlotDecide.Required", "SlotState.Required", "SlotState.CreatedRole", "PieceOpen.Required", "SlotLight", "PieceUpdate.Required"]

[[VRFW.State]]
key = "BetterQoL.role_medal.matches_required_created_role"
value = { config = "role_medal.matches_required_created_role", min = 0, max = 127 }
fallback = 10
needs = ["SlotDecide.CreatedRole", "SlotDecide.Required", "SlotState.Required", "SlotState.CreatedRole", "PieceOpen.Required", "SlotLight", "PieceUpdate.Required"]
