  Key = "passives.build_rarities"
  Type = "list"
  Of = "int"
  Label = { es = "Rarezas con pasivas de build", en = "Build passive rarities" }
  Help = { es = "Rarezas de carta cuyos huecos de build conservan las pasivas del tablero (Héroe 5-7, Diamante 8).", en = "Card rarities whose build slots keep the board's build passives (Hero 5-7, Diamond 8)." }
  [[Shape.Field]]
  Key = "passives.build_slots"
  Type = "list"
  Of = "int"
  Label = { es = "Huecos de build", en = "Build slots" }
  Help = { es = "Huecos (1 a 5) que conservan las pasivas de build en esas rarezas.", en = "Slots (1 to 5) that keep the build passives for those rarities." }
  [[Shape.Field]]
  Key = "passives.log_first"
  Type = "int"
  Label = { es = "Registrar los primeros cambios (depuración)", en = "Log first replacements (debug)" }
  Help = { es = "Registra los primeros N reemplazos de hueco (0 = ninguno).", en = "Logs the first N slot replacements (0 = none)." }
  [[Shape.Field]]
  Key = "passives.allow_duplicates"
  Type = "bool"
  Label = { es = "Permitir pasivas repetidas", en = "Allow duplicate passives" }
  Help = { es = "La misma pasiva puede elegirse en varios huecos de un jugador; cada copia se aplica.", en = "The same passive may be chosen in several slots of a player; each copy applies." }
  [[Shape.Field]]
  Key = "passives.enabled"
  Type = "bool"
  Label = { es = "Configurador de pasivas activo", en = "Passive setup enabled" }
  Help = { es = "Desactivado = pasivas originales, sin configurador.", en = "Off = original passives, no configurator." }
  [[Shape.Field]]
  Key = "role_medal"
  Type = "table"
  Label = { es = "Medalla de rol", en = "Role medal" }
  Help = { es = "Medalla de entrenador o mánager en el tablero de habilidades.", en = "Coach or manager medal on the ability board." }
  [[Shape.Field]]
  Key = "role_medal.matches_required"
  Type = "int"
  Label = { es = "Partidos para la medalla", en = "Matches for the medal" }
  Help = { es = "Partidos que necesita un jugador antes de que su hueco de insignia tome la medalla de entrenador o mánager.", en = "Matches a player needs before his badge slot takes the coach or manager medal." }
  [[Shape.Field]]
  Key = "role_medal.matches_required_created_role"
  Type = "int"
  Label = { es = "Partidos para la medalla (rol creado)", en = "Matches for the medal (created role)" }
  Help = { es = "Lo mismo para un jugador creado como entrenador o mánager.", en = "The same for a player created as coach or manager." }
  [[Shape.Field]]
  Key = "original_names"
  Type = "table"
  Label = { es = "Nombres originales", en = "Original names" }
