# The first-start window (crates/vr-loader/src/boot_splash): shown while the early phase really builds.

# Milliseconds of real building before the window appears: a cached start never shows it.
threshold_ms = 1500
default_weight = 100
default_word = "data"
fallback_language = "en"

# Each type's typical first-start time in ms: the bar gives it that share. Edit freely, no rebuild needed.
# From `[core] timing: early phase` of a full build. Two are lowered for commits made after that log:
# rule was 169279 (duel clip import 163 s, now ~7 s, VRFW 3.138); sound was 99019 (118 s -> 30 s, VRFW 3.139).
[weights]
rule = 13000
image = 151990
telop = 128588
sound = 25000
technique = 40422
team = 18640
model = 11028
effect = 9238
item = 8549
character = 6780
base_table = 4602
text = 3702
theme = 3489
menu = 1778
script = 1577
param = 1369
scene = 1289
mods_screen = 1192
transform = 1162
celebration = 1019
formation = 665
anim = 648
game_shader = 500
card_filter = 406
table = 393
flag = 286
font = 284
trigger = 275
look = 233
kit_twin = 159
stadium = 142
input = 138
option = 77
shop = 66
changelog = 34
mode = 6
friendly = 4
rarity = 4

# The launcher screen at each game start (docs/framework/auto-update.md). No network until the player presses Search.
# The URL authorises nothing: only the signing key embedded in winmm.dll does.
[launcher]
repo_url = "https://raw.githubusercontent.com/Shadorossa/Inazuma-Fantasy-Victory-Road-mod/"
index_ref = "main"
connect_timeout_ms = 8000
receive_timeout_ms = 30000
max_manifest_bytes = 16777216
max_logged_paths = 50
repaint_ms = 100

# Lengths in design pixels (window 800 wide), colours 0xRRGGBB.
[launcher.style]
margin = 28.0
bottom = 54.0
height = 34.0
gap = 14.0
primary_padding = 30.0
text_padding = 8.0
font_height = 17.0
status_height = 14.0
status_gap = 10.0
underline = 2.0
accent = 0xF2C14E
accent_text = 0x12161F
primary_idle_alpha = 0.55
text = 0xF2F5FA
status_text = 0xC9CEDA
band_height = 130.0
bar_height = 2.0
caret_size = 8.0
caret_gap = 8.0
row_height = 26.0
row_fill = 0x12161F
row_alpha = 0.78
row_focus_fill = 0xF2F5FA
row_focus_alpha = 0.16
list_gap = 2.0
list_rows = 5
mark_size = 5.0

