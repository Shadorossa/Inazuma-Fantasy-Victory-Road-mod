# Schema of the passive slot modes: a game state in which every player keeps only his own passive.
schema = "VRFW.decl_schema/1"
kind = "VRFW.passive_slots/1"
folder = "content/passive_slots"
# v2 words, read beside the v1 ones until the switch: the type, its kind folder and its format version.
v2_type = "VRFW.Passive.Slot"
v2_kind_folder = "Passives/Slots"
v2_version = 1
label = "Passive slot modes"
label_es = "Modos de ranuras de pasivas"
doc = "While a game state is on, the plates show no passives in the five slots (only the signature one, or none)."
doc_es = "Mientras un estado del juego está activo, las placas no muestran pasivas en las cinco ranuras (solo la propia, o ninguna)."

[entry.SignatureOnly]
doc = "while the game_state key `state` is 1, the plates show no passive in the 5 slots and the framework's key vrfw.passive.slots_off is 1"
name = { type = "name", required = true, doc = "key <mod>.<name> (a-z 0-9 _)" }
state = { type = "string", required = true, doc = "a game_state key (any mod's, e.g. one of its [[VRFW.State]]) that is 1 while the mode runs" }
when = { type = "when", doc = "conditions on the declaring mod's config: all must hold, else the declaration is left out" }

[entry.NoPassives]
doc = "while the game_state key `state` is 1, no player carries a passive (the 5 slots, the custom passive slot, script-driven passives) and the framework's key vrfw.passive.all_off is 1"
name = { type = "name", required = true, doc = "key <mod>.<name> (a-z 0-9 _)" }
state = { type = "string", required = true, doc = "a game_state key (any mod's, e.g. one of its [[VRFW.State]]) that is 1 while the mode runs" }
when = { type = "when", doc = "conditions on the declaring mod's config: all must hold, else the declaration is left out" }
