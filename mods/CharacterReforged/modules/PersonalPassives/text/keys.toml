[es.new]
mod_name = "Pasivas propias"
mod_description = "Cada jugador tiene una pasiva propia, definida por personaje en los mods, en lugar de una que equipas tú: el espacio de pasiva siempre la muestra, no se puede cambiar y los partidos la usan. Añade también las pasivas elementales genéricas (Viento, Bosque, Fuego, Montaña, Vacío), que dan un 15 % más de fuerza a las supertécnicas propias de ese elemento. Las pasivas se construyen con bloques reutilizables que los mods pueden editar por personaje, y el mismo sistema mueve las pasivas que otros mods dan a los espíritus. Necesita Character Reforged."
