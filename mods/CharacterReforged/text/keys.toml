[zh_hant.new]
mod_name = "Character Reforged"
mod_description = "角色類模組的共同基礎。每個角色都有專屬的能力值和招式，等級上限提升到200，技能板變為帶有6個必殺技、1個靈氣欄和1個混合欄的擴展表。還新增了帶3D模型和能力條的分頁球員介面、使用自由點數的能力訓練、任意兩名球員混合最大化和所有化身武裝，以及道具變身、化身與靈魂改用點數而非時間、每名球員的體力條等選項。此外，每名球員都有專屬被動，隊伍羈絆改為按隊伍或組別成立，所有裝備的總能力相同，並加入位置與屬性親和、71個套裝以及來自GO、時空之石和銀河的167件經典道具。"
