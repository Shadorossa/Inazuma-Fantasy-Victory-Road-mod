# Maps the `formation` type (formations/**/*.toml) to rows of the game's formation_config.
schema = "VRFW.table_map/1"

# [[formation]]: a new formation row.
[[map]]
entry = "formation"
table = "formation/formation"
mode = "append"
key = "name"
id_space = "formation"
pin = "id"
from = "based_on"
after = "after"
cells = "cells"
count = "new"
[map.fields]
places = { column = "placement_info", type = "list", slice = true }
title = { column = "noun_id", text = "item_text", text_id = "{mod}.{key}", text_field = "noun" }
description = { column = "desc_id", text = "item_text", text_id = "{mod}.{key}.description", text_field = "text" }
[map.refs]
based_on = "formation"
after = "formation"

[[map]]
entry = "edit"
table = "formation/formation"
mode = "edit"
key = "target"
cells = "cells"
count = "edited"
[map.fields]
places = { column = "placement_info", type = "list", slice = true }
title = { column = "noun_id", text = "item_text", text_id = "{mod}.{key}", text_field = "noun" }
description = { column = "desc_id", text = "item_text", text_id = "{mod}.{key}.description", text_field = "text" }
[map.refs]
target = "formation"

# [[remove]]: delete a formation (`target`) and its placement rows nobody else points at.
[[map]]
entry = "remove"
table = "formation/formation"
mode = "remove"
key = "target"
count = "removed"
[map.refs]
target = "formation"
