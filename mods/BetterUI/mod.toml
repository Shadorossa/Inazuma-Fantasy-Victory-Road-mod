id = "BetterUI"
# name / description: English fallback; the Mods screen shows text keys mod_name / mod_description (text\keys.toml)
name = "BetterUI"
icon = "#/menu/200_icon/16_icon_list_tab/icon_list_tab.g4tx:icon_list_tab_option03"
version = "0.3.0"
author = "Fantasy Team"
description = "A cleaner match HUD and game menus: a compact translucent top bar, fewer markers and guides in matches, compact player cards and shop shortcuts (L2 / R2). Shirt numbers and AI roles can be set for the whole team. Rules, data and saves are untouched."
priority = 0
tags = ["Visual", "Interface"]
updated = "2026-11-09"
requires = ["VRFW>=0.3.0"]
optional = ["BetterQoL", "CharacterReforged", "ClassicCards"]
conflicts = []
loader_modules = ["lua_bridge"]
# An installed copy of the modules this mod replaces (ModLoader module prematch, mod shop_shortcuts) is skipped.
provides = ["prematch", "shop_shortcuts=1.0.3"]
loader_min = "1.0.0"
prefix = "BetterUI"
folder = "BetterUI"
# command: content\game\commands.toml; hook / call / memory: the mid hooks of content\game\.
permissions = ["command", "hook", "call", "memory"]

[exports]
functions = ["TopBarOn", "ShopSwitching", "CardIsLayer", "CardIsCompact", "CardHideName", "CardKeepName", "CardHideLevel", "ShirtNumberOn", "ShirtNumberArm", "AddDockButton"]
keys = []
game_lua = ["BetterUI"]

# UI only: not part of the mod set two players must share online, nor of «gameplay mods enabled».
[VRFW.Mod]
AffectsMatch = false
