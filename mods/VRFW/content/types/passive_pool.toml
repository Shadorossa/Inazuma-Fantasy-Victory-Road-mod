schema = "VRFW.decl_schema/1"
kind = "VRFW.passive_pool/1"
folder = "content/passive_pools"
# v2 words, read beside the v1 ones until the switch: the type, its kind folder and its format version.
v2_type = "VRFW.Passive.Pool"
v2_kind_folder = "Passives/Pools"
v2_version = 1
label = "Passive pools"
label_es = "Reservas de pasivas"
doc = "A match resource the special passives use as a spirit pool."
doc_es = "Un recurso de partido que las pasivas especiales usan como reserva de espíritu."

[entry.PassivePool]
doc = "a match resource the special passives use as a spirit pool"
name = { type = "name", required = true, doc = "key <mod>.<name> (a-z 0-9 _)" }
resource = { type = "string", required = true, doc = "the match resource ([[VRFW.MatchResource]]) as <mod>.<name> or a role key, e.g. MyMod.points, VRFW.stamina" }
cost_flag = { type = "string", doc = "the rule flag prefix PoolCost writes: <cost_flag>.<player handle> = the percent of that player's pool costs (the resource's mod reads it); none = PoolCost does nothing on this pool" }
when = { type = "when", doc = "conditions on the declaring mod's config: all must hold, else the declaration is left out" }
