schema = "VRFW.text_key/1"
# Texts of «Hissatsu Reforged» (format: docs/framework/types/text.md): the «Mods» screen's name and description. A
# language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Hissatsu Reforged"
mod_description = "Rebalances the game's special moves: new minimum and maximum power, tension cost and recast time for 683 moves, while the power each grade adds stays the game's. A move with two properties (long shot and counter shot) shows both icons in every move list. Special moves can land a critical hit, and the Breach team build becomes the Critical build. The base of Hissatsu Effects and Hissatsu Level Up."
# technique families ([[VRFW.TechniqueFamily]], content\techniques\families.toml)
family_god_hand = "God Hand"
family_triangle = "Death Zone"
family_last_resort = "Last Resort"
family_penguin = "Emperor Penguin"
family_fire_tornado = "Fire Tornado"
family_triangle_z = "Triangle Z"
family_multiple = "Clone"
family_phoenix = "The Phoenix"
family_dragon = "Dragon Crash"
family_the_earth = "The Earth"
family_hundred_touch = "Wrath Shot"
family_twin_boost = "Twin Boost"
family_rebound = "Bouncing Bunny"
family_lightning_break = "Inazuma Break"
filter_tab_families = "Families"

[es.new]
mod_name = "Hissatsu Reforged"
mod_description = "Reequilibra las supertécnicas del juego: nueva potencia mínima y máxima, coste de tensión y tiempo de recarga de 683 supertécnicas, y la potencia que añade cada grado sigue siendo la del juego. Una supertécnica con dos propiedades (tiro largo y tiro de contraataque) muestra los dos iconos en todas las listas. Las supertécnicas pueden lograr un golpe crítico, y la configuración Brecha pasa a ser Crítico. Es la base de Hissatsu Effects y Hissatsu Level Up."
