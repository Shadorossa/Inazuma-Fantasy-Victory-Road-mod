
# Level cap: 99 = the game's own cap, 100..999 raises it, a higher value is clamped to 999.
[level]
cap = 200

# The per-character stats.
[stats]
lv1_ratio = 0.10                 # Lv 1 value / Lv 99 value (0..1)
curve_slow = 1.6                 # exponent of the Lv 1..99 curve per growth type (0.05..20)
curve_normal = 1.0
curve_fast = 0.6
lv200_factor_slow = 1.50         # Lv 200 value / Lv 99 value per growth type (1..10)
lv200_factor_normal = 1.35
lv200_factor_fast = 1.25
curve_post99 = 0.7
cap_scale = 0.5
agility_speed = 0.05
speed_npc = true                 # also roster rows without a saved character (opponents)

# card multipliers by rarity (chara_param col 41): "<rarity>" = factor (0.1..10); none = 1
[stats.rarity_mult]

[stats.past_cap]
gain_slow = 0.50
gain_normal = 0.35
gain_fast = 0.25
shape = 2.0

[player_sets]
export_area = "vrmod/characters"
sets_per_page = 5
pages = 4

# The player page's 3D model in a match (graft plate_model, scripts\player_page_capture.lua).
[player_page]
match_model = "auto"
match_camera = "vs"
capture_report = true
# match_live_pause: test only; the pause freeze flag is off while the capture page shows.
match_live_pause = false
match_quad_until_drawn = true
match_no_draw_polls = 24
match_lost_frames = 30

# Training rules (read at start; restart the game after a change).
[training]
rule = "trade"
# the lowest a drained stat can go, in % of its untrained base (0 = down to 1)
floor_percent = 0
# the highest trained base value of a stat
max_value = 9999
# card rarities that cannot be trained (no Libertad), e.g.
locked_rarities = []
budget_percent = 0

[stat_effects]
critical_catch_base_percent = 1
critical_catch_per_luck = 0.02
critical_catch_cap_percent = 25
# The critical chance of a special move, as in Inazuma Eleven GO Chrono Stone (docs/game/match/critical-chrono-stone.md):
# chance % = move_critical_base_percent + Suerte × move_critical_per_luck (1 % per 25 Suerte), at most move_critical_cap_percent from Suerte.
move_critical_base_percent = 0.0
move_critical_per_luck = 0.04
move_critical_cap_percent = 25.0
# 1.0 leaves the power of a critical hit to the mod that owns it (Hissatsu Reforged [critical] multiplier).
move_critical_power_multiplier = 1.0

[rival_training]
# "priority": each stat in list order takes all the Libertad left (up to max_value); "even": the Libertad split evenly
spread = "priority"
useful_floor = 85
# The keeper stats, highest priority first.
GK = ["agility", "physical", "pressure", "luck"]

[rival_training.useless]
GK = ["kick", "control", "technique", "intelligence"]   # shot and focus AT, focus and duel: the keeper saves
FW = ["pressure"]                                       # duel and wall DF
MF = []                                                 # plays both ways: every stat helps
DF = ["kick", "control"]                                # shot and focus AT

# The PEG / SP pools.
[points]
# The rival (CPU) team always plays by the same point systems as the player.
move_tension_free = true
cost_model = "cs"
cost_scale = 0.75
armour_boost = 1.05
armour_drain_per_s = 1.0
armour_drain_factor = 0.025
armour_goalkeeper_zone_multiplier = 0.5
# ATK of a keshin without one in the table
default_atk = 80
# "cs": the FIRST armour of a pool in the match restores this × max PEG (capped at max); later armours restore nothing
armour_first_refill = 0.30
# "cs": special moves under the armour (the keshin's move under the armour too) cost no PEG
armour_moves_free = true
keshin_moves_cost = "own"
# "cs": may the armoured player use his keshin's own move?
armour_keshin_move = false

# Transformation costs on the PE.
[stamina]
enabled = true
cost_model = "cs"
# every Chrono Stone PE cost × this (0.75 = 25 % cheaper): the PE charged at the end, the miximax PE multiplier
cost_scale = 0.75
# CS: while a keshin or an armour is out the player's PE does not drain (PE action costs 0) ...
stamina_free_while_out = true
end_stamina_factor = 0.3
end_stat_factor = 0.00133
end_armour_multiplier = 1.2
end_grace_ms = 500
end_follows_level = true
keshin_points_default = 200
chrono_stone_miximax_stamina_multiplier = 5.0
drain_log_s = 5.0
# the start does not spend the hyper gauge (the engine's pay is skipped).
free_activation = ["miximax", "mode_change", "kizuna_trans", "awakening_power"]
# the start does not need the hyper gauge at all (same kinds, same rule)
no_start_check = ["miximax", "mode_change", "kizuna_trans", "awakening_power"]
miximax_untimed = true
miximax_end_stamina = 0.0
miximax_stamina_multiplier = 1.25
miximax_armour_stamina_multiplier = 1.30
armour_stamina_multiplier = 1.05
# the battery out's clip when a trait rule names none ("" = none)
clip_gauge_end = ""
miximax_carriers = ["wmm_evt", "wmm_character_reforged_create"]

# Character traits.

# Perfect Cascade's androids and Mecha-Mark with Plasma Shadow (wkk00723 GK, wkd00722 DF, wko00721 AT, wks00720 SH)
[stamina.trait.android]
keshins = [0x0ABB2633, 0x8CEAA470, 0x7F240509, 0x7C37F77F]
gauge_drain = false
stamina_multiplier = 1.5
battery_out = "aura"
battery_keep_armour = true
battery_clip = "MissingContent.aura_end_kneel"
battery_hold = "CharacterReforged.battery_out"
battery_hold_after_ms = 3000

# the Football Museum's Soccer Robots SR-101X…SR-111X: battery out at 0 PE
[stamina.trait.robot]
battery_out = "always"
battery_clip = "MissingContent.aura_end_kneel"
battery_hold = "CharacterReforged.battery_out"
battery_hold_after_ms = 3000

# Tired locomotion.
[tired_motion]
enabled = true
run_below = 0.10
run_recover = 0.15
run_sets = ["CharacterReforged.tired_cs", "CharacterReforged.tired_vr"]
run_weights = [1.0, 1.0]
reroll = "episode"
idle_set = "CharacterReforged.tired_idle"
idle_at = 0.0
idle_every_s = [6.0, 14.0]
idle_for_s = [1.2, 2.4]
idle_speed = 0.0
idle_states = [9]
keepers = false
cpu = true

# The transformation cross of the match HUD (RB + D-pad; content\extra_slots\skill_set.toml declares its entries).
# Places in layout units of the 1920 x 1080 screen: x from the left edge, y from the top.
[transform_cross]
centre_x = 306          # centre of the ring on a 1920 x 1080 screen (x from the left, y from the top): beside the super-tactics widget
centre_y = 856
ring_size = 144         # width of the ring: 144 is the super-tactics widget's own size
dim_brightness = 0.4    # brightness of the icon of a greyed entry
plate_left = 403        # left end of the plates' band
plate_scale = 1.1       # a band that ends left of the stat strip
row_pitch = 52          # distance between two rows; the rows of the existing entries are centred on centre_y
text_scale = 0.8        # size of the type label and of the pill against the plate
name_scale = 0.85       # size of a name that fits; a longer name shrinks to name_room
name_room = 330         # width a name may take, in plate units
name_room_face = 218    # the same on a plate with a portrait at its right end
type_offset_x = 21      # the type label's left end from the input column, in plate units (x right, y up)
type_offset_y = 14
name_offset_x = 21      # the name's left end from the input column
name_offset_y = -8
pill_offset_x = 352     # the pill's right end from the input column
pill_offset_y = 13
directions = ["up", "left", "right", "down"]   # the arrow of each direct entry, in the order skill_set.toml declares them

[hud_hidden_layers]
hidden_layers = [
    "soccer08_26_hyperdimensional_power_gauge_base",
    "soccer08_26_p1_hyperdimensional_power_one_gauge",
    "soccer08_26_hyperdimensional_power_gauge_base_enemy",
    "soccer08_26_p1_hyperdimensional_power_one_gauge_enemy",
]

# Custom Change Mode
[mode_change]
# false: no change can be created or equipped, the stored ones stay in the save but do nothing
enabled = true

# Totems: levels, skill reel, level-up pop (read at the start; restart the game after a change).
[souls.spirit_points]
resource = "VRFW.spirit_points"
# the rule flag <start_flag>.<aura id> = the totem's SP at level 1: its SP bar starts there in matches and menus
start_flag = "CharacterReforged.sp_start"

[souls.stamina]
resource = "VRFW.stamina"

[souls.reel]
# seconds: fade in, spin (fast, slowing down), settle back onto the result, hold on it, fade out
open_s = 0.2
spin_s = 1.9
settle_s = 0.25
hold_s = 1.2
close_s = 0.25
loops = 3
settle_cards = 0.08
center_x = 960
center_y = 96
spacing = 214
card_width = 224
card_height = 60
side_scale = 0.8
side_alpha = 0.55
icon_size = 34
icon_gap = 10
name_size = 21
level_size = 15
diamond_size = 9
diamond_spacing = 13
line_gap = 5
# the cut-in that shows the carousel: the first one to start within this many seconds of the move's command
cutin_window_s = 3
element_colors = ["#0080BD", "#38A530", "#C03622", "#B07222", "#7520AD"]
neutral_color = "#8B8B8B"
miss_color = "#5C6070"
# the atlas of the cards' icons (the skill families' `icon` sprites); it is in the screen's res list
icon_atlas = "#/menu/200_icon/08_icon_teambuff/<LG>/icon_teambuff.g4tx"

[souls.level_pop]
# false: no pop
show = true
# the rival (CPU) team's level-ups pop too (their levels count only with [levels] cpu = true)
cpu = true
appear_s = 0.15
# how long it stays over the player at full size
hold_s = 4.0
out_s = 0.4
body_height = 28
tail_height = 8
lift = 10
text_scale = 0.45
# room left and right of the text inside the body
pad_x = 8
bubble_widths = [36, 40, 44, 49, 54, 60, 66, 73, 80, 88, 97, 107, 118]
# a character's width at text scale 1, used only when the game does not measure the text
char_width = 24
# moves the text up (+) or down (-) inside the body
text_offset_y = 0
# the text's colour markup around it ({text}; font_color tags: [CW] white ... [C] reset)
text_markup = "[CW]{text}[C]"
# how far it rises while it fades out
rise = 24

# How a totem gains level points (LP) and levels while it is out (Galaxy's real amounts are unknown).
[souls.levels]
# total LP to reach level 2, 3, 4, 5 (one value per level above 1; lower them to level up faster)
thresholds = [30, 80, 150, 240]
# LP per second of live play
per_second = 1.0
# LP when its player wins a focus duel
per_duel_won = 15.0
# LP when its player scores
per_goal = 30.0
# LP when its player uses the totem's own move
per_own_move = 10.0
time_scale = 1.0
# the rival (CPU) team's totems gain levels and roll the reel too, whenever the part is on (its rolls are never shown)
cpu = true
# the release button does nothing while a totem is out
no_release = true
# the soccer states of live play (the level points per second count only there)
live_states = [9, 14, 15, 16]

[souls.effects]
grant_flag = "VRFW.passive.grant"
# knock-down: a field clip played on the opponent (<mod>.<name>; "" = none, only the slow-down)
knockdown_clip = ""

# Players Universe character list: the box of the focused player's 3D model on the character card (1920 x 1080
# screen px, y down). The model fits inside it: head under the name bar, feet above the description box.
[players_universe]
model_box_x = 970
model_box_y = 235
model_box_w = 926
model_box_h = 575
