# Home Stadium: the stadium selector of «Plantilla de equipo» (soccer_team_dock_menu).
schema = "VRFW.menu/2"

[[patch]]
menu = "soccer_team_dock_menu"
add_layer = { name = "win05_40_sub_image_frame", object = "win05_40_sub_image_frame", count = 1, groups = [{ group = "soccer_team_dock_menu", flags = [0, 0, 0, 0, 1, 0] }] }

[[patch]]
menu = "soccer_team_dock_menu"
add_layer = { name = "home_stadium_sel_plate", object = "vrfw_mp_plate", count = 6, align = [1, 8], scale = 0.2, groups = [{ group = "soccer_team_dock_menu", flags = [0, 0, 0, 0, 1, 0] }] }
resources = [
    "#/menu/220_img/home_stadium_ui/home_stadium_ui.g4tx",
    "#/menu/10_win/win05/win05_02/win05_02.g4tx",
]

[[patch]]
menu = "soccer_team_dock_menu"
add_layer = { name = "home_stadium_sel_label", object = "vrfw_mp_label", count = 2, after = "home_stadium_sel_plate", groups = [{ group = "soccer_team_dock_menu", flags = [0, 0, 0, 0, 1, 0] }] }
