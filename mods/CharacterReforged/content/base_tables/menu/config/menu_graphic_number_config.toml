schema = "VRFW.base_table/1"
# 3 digit slots for the level numbers (cap above 99), keyed by the number's id (column #0).

[[keyed]]
list = "MENU_GRAPHIC_NUMBER"
key_columns = ["#0"]

  [[keyed.set]]
  key = 0x3356CF5A
  cells = { "#5" = 3 }

  [[keyed.set]]
  key = 0x4451FFCC
  cells = { "#5" = 3 }

  [[keyed.set]]
  key = 0xA68F3B61                      # field talk icon level (num_rpg_lv01_, _num_lv_dmy02)
  cells = { "#5" = 3 }
