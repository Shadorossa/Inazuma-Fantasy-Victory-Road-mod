schema = "VRFW.menu/2"

[[object]]
name = "betterqol_cst_back"
from = "cmn01_10_new_icon"
set = [
    { parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 1001 } },
]

[[object]]
name = "betterqol_cst_plate"
from = "cmn01_10_new_icon"
set = [
    { parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 1002 } },
]

[[object]]
name = "betterqol_cst_icon"
from = "cmn01_10_new_icon"
set = [
    { parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 1003 } },
]

[[object]]
name = "betterqol_cst_face"
from = "team16_03_synergy_chara_condition_list"
priority = 1004

[[object]]
name = "betterqol_cst_text"
from = "cmn03_01_cmd_back"
remove_block = ["MenuCollisionSetting", "MenuAnchorComponent"]
set = [
    { parameter = "m_drawPriority", match = { 1 = 301 }, values = { 1 = 1005 } },
]

[[screen]]
name = "betterqol_club_stats_menu"
like = "scene_archive_menu"
base = "scene_archive_menu"
script = "assets/lua/screens/betterqol_club_stats_menu.lua"

[screen.rows]
layer = [
    { layer = "save01_02_list_item", from = "savedata_management_menu", count = 1 },
    { layer = "mainmenu90_05_content_guide_line01" },
    { layer = "betterqol_cst_back", object = "betterqol_cst_back", count = 4, scale = 0.01 },
    { layer = "betterqol_cst_plate", object = "betterqol_cst_plate", count = 40, scale = 0.01 },
    { layer = "betterqol_cst_icon", object = "betterqol_cst_icon", count = 28, scale = 0.01 },
    { layer = "betterqol_cst_face", object = "betterqol_cst_face", count = 10, scale = 0.01 },
    { layer = "betterqol_cst_text", object = "betterqol_cst_text", count = 120, scale = 0.01 },
]
# the anchor takes every key: B / Esc / right click close, up / down move, L1 / R1 players / match history, Select (Tab) next sort column
commands = [
    { layer = "save01_02_list_item", input = "CMD_BACK", command = "CMD_BACK", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_MOUSE_RIGHT_CLICK", command = "CMD_BACK", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_UP", command = "CMD_FUNCTION", arg = "betterqol_cst_up", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_DOWN", command = "CMD_FUNCTION", arg = "betterqol_cst_down", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_FUNCL1", command = "CMD_FUNCTION", arg = "betterqol_cst_tab_prev", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_FUNCR1", command = "CMD_FUNCTION", arg = "betterqol_cst_tab_next", flag = 1 },
    { layer = "save01_02_list_item", input = "CMD_FUNC2", command = "CMD_FUNCTION", arg = "betterqol_cst_sort", flag = 1 },
]
resources = [
    "#/menu/220_img/betterqol_club_stats/betterqol_club_stats.g4tx",
    "#/menu/51_save/save01/save01_02/save01_02.g4tx",
    "#/menu/20_cmn/cmn05/cmn05_01/cmn05_01.g4tx",
]
group_base = [
    { layer = "save01_02_list_item", flags = [1, 1, 0, 0, 1, 0] },
    { layer = "mainmenu90_05_content_guide_line01", flags = [0, 1, 1, 0, 1, 0] },
    { layer = "betterqol_cst_back", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "betterqol_cst_plate", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "betterqol_cst_icon", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "betterqol_cst_face", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "betterqol_cst_text", flags = [0, 1, 0, 0, 1, 0] },
]
group = [
    { group = "betterqol_club_stats_menu", flags = [1], slice = [0, 7] },
]
focus_base = [[0x3A06AC3D, 0, 0]]
focus_group = [
    { layer = "save01_02_list_item", flags = [0, 0, 0], slice = [0, 1] },
]
shift_base = []
shift = []
