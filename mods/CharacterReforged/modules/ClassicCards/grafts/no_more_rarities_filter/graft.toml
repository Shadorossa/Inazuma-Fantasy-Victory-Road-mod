# ClassicCards: the «Rareza» tab of the filter windows lets the normal cards through a specific rarity set
# (docs/game/characters/rarity-removal.md §8). Each INCLUDE'd filter script wraps its menu table's filter-param functions.
name = "no_more_rarities_filter"
mod = "ClassicCards"
order = 120
module = "lua_bridge"
requires = []
conflicts = []
wraps = []
description = "ClassicCards: a specific rarity set always lets the normal cards (rarity 4) through"

[[files]]
stem = "chara_filter_menu_inc"

  [[files.ops]]
  type = "bytecode_child"
  source = "keep_normal_cards.lua"
  marker = "no_more_rarities chara"
  crc = "none"
  vars = { "@MENU@" = "CHARA_FILTER_MENU" }

[[files]]
stem = "spirit_filter_menu_inc"

  [[files.ops]]
  type = "bytecode_child"
  source = "keep_normal_cards.lua"
  marker = "no_more_rarities spirit"
  crc = "none"
  vars = { "@MENU@" = "SPIRIT_FILTER_MENU" }
