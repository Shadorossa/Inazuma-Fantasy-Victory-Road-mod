# The framework's own title logo. The picture is derived from Level-5 assets: never committed.
# A mod can serve its own logo (whole title00_03_02 / title02_01 files): [VRFW.TitleArt] own = true in its config.toml.
schema = "VRFW.image/1"
when = { config = "*.VRFW.TitleArt.own", equals = false, default = false }

# ---- the logo (title_menu layer title00_03_02_title_logo, title_menu_2 layer title02_01_title_logo_2) --------------

[[sprite]]
atlas = "#/menu/50_title/title00/title00_03_02/<LG>/title00_03_02.g4tx"
name = "logo02"
recipe = "logo"

[[sprite]]
atlas = "#/menu/50_title/title02/title02_01/<LG>/title02_01.g4tx"
name = "logo02"
recipe = "logo"

# ---- recipes -------------------------------------------------------------------------------------------------------

# the retail logos' drawing spans about (23..1575, 100..1136) of the 1600 x 1200 texture: same box, same centre
[[recipe]]
name = "logo_art"
png = "vrfw_title_art/vrfw_logo.png"
ops = [{ op = "alpha_crop" }, { op = "fit", box = [1552, 1036] }]

[[recipe]]
name = "logo"
canvas = [1600, 1200]
ops = [{ op = "paste", image = "logo_art", centre = [799.0, 618.0] }]
