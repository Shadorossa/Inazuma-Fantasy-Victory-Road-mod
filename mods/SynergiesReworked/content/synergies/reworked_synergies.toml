schema = "VRFW.synergy/1"

# Synergies Reworked › the reworked team synergies. The mechanism is the framework's:
# a synergy declared here replaces the game's condition rows of that game synergy (named
# characters) by a NEXUS + players of a POOL; its name, slot, icon and effects stay the game's. Who counts is the game's:
# the starters and the staff slots (3 managers, the coach).
# Pools are criteria over the game's data (belong teams, series, staff role, gender): never member lists.

# ------------------------------------------------------------------------------------------------ El linaje oscuro

# Every player of Royal Academy (every era: IE1, GO, Ares and VR share this belong team), Zeus, Royal
# Academy Redux, (Team K), Orfeo (Orpheus) and Eclipse de Orión: 164 characters with a card (v7.1.2 data).
# The order is the panel's crest order (Royal Academy (IE1) > Zeus (IE1) > Royal Redux > Team K >
# Orfeo > the Orión team); belong team keys and names checked in belong_team_config + team_text (v7.1.2).
[[VRFW.SynergyPool]]
name = "dark_lineage"
teams = [
    "0x699E68EC",   # Royal Academy (crest: the IE emblem)
    "0x9BAD3311",   # Zeus (crest: the IE emblem)
    "0xF1E3E365",   # Royal Academy Redux
    "0xB95A1DDD",   # (Team K, IE3; Spanish name of チームＫ, confirmed by)
    "0x0F3CD0F1",   # Orfeo
    "0x9E96B18A",   # Eclipse de Orión (Orion Eclipse: the only Orión team of this pool; the user's)
]

[[VRFW.Synergy]]
key = "sp04003"                                  # El linaje oscuro (retail: Ray Dark + Lucian Dark)
nexus = ["c11801020", "c11807230", "c11803050"]   # Ray Dark (IE1, Ares) or (his IE3 coach alias): counts as coach too
pool = "dark_lineage"
count = 2
rule = "min"
hint = "SynergiesReworked.HintDarkLineage"

# ------------------------------------------------------------------------------------------------ Líderes del Protocolo Omega

# NEXUS = one of the leaders Alfa (Alpha), Beta or Gamma (all their versions); slots 2 and 3 = two other
# players of the rosters of Protocolo Omega 1.0, 2.0 and 3.0 (the leaders count there too when they are not the nexus),
# distinct from the nexus and from each other. Leaders (chara_base v7.2.1): Alfa c05020500 + c05020500_5000; Beta c05020700
# + c05020700_5000 + c11905050; Gamma c05020800 + c05020800_5000. c05028300 is left out: it is another character named
# Gamma (own name and description text), a roster player of Protocolo Omega 3.0 only.
[[VRFW.SynergyPool]]
name = "omega_leaders"
charas = [
    "c05020500", "c05020500_5000",               # Alfa
    "c05020700", "c05020700_5000", "c11905050",  # Beta
    "c05020800", "c05020800_5000",               # Gamma
]

[[VRFW.SynergyPool]]
name = "omega_protocol"
teams = [
    "0x45B66234",   # Protocolo Omega (1.0)
    "0x3B24FCDA",   # Protocolo Omega 2.0
    "0x4C23CC4C",   # Protocolo Omega 3.0
]
# team pool: its empty rows draw the three teams' crests (no show_candidates: that switch is for person pools)

[[VRFW.Synergy]]
key = "sf05001"                                  # Líderes del Protocolo Omega (retail: Alfa + Beta + Gamma; Foco AT +10 % en campo propio, afinidad elemental +5 %)
nexus_pool = "omega_leaders"
pool = "omega_protocol"
count = 2
rule = "min"
distinct = "person"

