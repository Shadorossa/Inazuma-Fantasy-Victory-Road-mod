# Friendlies (module of Football Reforged): the Team Dock list («Plantilla de equipo», soccer_team_dock_menu) as used by
# the format columns of graft pachanga_dock.
schema = "VRFW.menu/2"

# The list gets a LEFT row. The retail list has none (only up / down / right); the graft reads it in OnFunction
# (friendlies_dock_left) to move from the «Pachanga» cell to the «Partido» cell of the list's first row. On every other
# row it does nothing, as before.
[[patch]]
menu = "soccer_team_dock_menu"
add_commands = [
    { layer = "team01_02_list_item", input = "CMD_LEFT", command = "CMD_FUNCTION", arg = "friendlies_dock_left", flag = 1 },
]

# One slot joint per list row that no animation drives. The rows hang from _atc_list01 .. _atc_list09 of the locator
# layout, and its «Open» animation keys those joints every frame (slide in, then the _smt_default_01 loop), so a node
# write on them never shows. Each new joint is a child of its _atc_listNN at (0, 0): the rows still slide in with the
# game's animation and sit where they always did, and the graft moves the new joints for the columns.
[[layout]]
file = "common/menu/102_team/team01/team01_01/team01_01.g4pkm"
joint = "_atc_friendlies_slot01"
parent = "_atc_list01"
translate = [0.0, 0.0]

[[layout]]
file = "common/menu/102_team/team01/team01_01/team01_01.g4pkm"
joint = "_atc_friendlies_slot02"
parent = "_atc_list02"
translate = [0.0, 0.0]

[[layout]]
file = "common/menu/102_team/team01/team01_01/team01_01.g4pkm"
joint = "_atc_friendlies_slot03"
parent = "_atc_list03"
