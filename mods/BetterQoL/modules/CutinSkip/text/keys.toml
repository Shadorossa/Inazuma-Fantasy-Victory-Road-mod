# Technique Cut-in Skip's card texts.
schema = "VRFW.text_key/1"
default_lang = "en"

[en.new]
mod_name = "Technique Cut-in Skip"
mod_description = "Press A / Enter to skip a special move's cut-in during a match; the match carries on with the same result. Keshin, Armed, Miximax and transformation cut-ins can be skipped too. It never works in network matches."

[es.new]
mod_name = "Saltar supertécnicas"
mod_description = "Pulsa A / Intro para saltar la animación de una supertécnica durante un partido; el partido sigue con el mismo resultado. También se saltan las animaciones de transformación, Keshin, Armadura y Miximax. Nunca funciona en partidos en red."

[fr.new]
mod_name = "Passer les techniques"
mod_description = "Appuie sur A / Entrée pour passer l'animation d'une supertechnique pendant un match ; le match continue avec le même résultat. Les animations de transformation, Keshin, Armure et Miximax se passent aussi. Cela ne marche jamais en match en réseau."

[de.new]
mod_name = "Techniken überspringen"
mod_description = "Drücke A / Enter, um die Zwischensequenz einer Spezialtechnik im Spiel zu überspringen; das Spiel geht mit demselben Ergebnis weiter. Auch die Sequenzen von Transformation, Keshin, Rüstung und Miximax lassen sich überspringen. Im Netzwerkspiel funktioniert es nie."

[it.new]
mod_name = "Salta le tecniche"
mod_description = "Premi A / Invio per saltare l'animazione di una supertecnica durante la partita; la partita prosegue con lo stesso risultato. Si saltano anche le animazioni di trasformazione, Keshin, Armatura e Miximax. Non funziona mai nelle partite in rete."

[pt.new]
mod_name = "Saltar supertécnicas"
mod_description = "Carrega em A / Enter para saltar a animação de uma supertécnica durante a partida; a partida continua com o mesmo resultado. Também se saltam as animações de transformação, Keshin, Armadura e Miximax. Nunca funciona em partidas em rede."

[ja.new]
mod_name = "必殺技演出スキップ"
mod_description = "試合中に A / Enter を押すと、必殺技のカットインをスキップできます。試合は同じ結果のまま進みます。変身・化身・アームド・ミキシマックスのカットインもスキップできます。ネットワーク対戦では使えません。"

[zh_hans.new]
mod_name = "跳过必杀技演出"
mod_description = "比赛中按 A / Enter 即可跳过必杀技的演出，比赛结果不变。变身、化身、铠甲和融合的演出也可以跳过。网络对战中不会生效。"

[zh_hant.new]
mod_name = "跳過必殺技演出"
mod_description = "比賽中按 A / Enter 即可跳過必殺技的演出，比賽結果不變。變身、化身、鎧甲和融合的演出也可以跳過。網路對戰中不會生效。"
