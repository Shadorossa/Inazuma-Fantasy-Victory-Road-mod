# The armours of Victory Road's own warrior spirits are off while Inazuma Fantasy is active, except the two armours of Victoria.
# Victory Road's own spirits are wks02010 Victoria, wks02020 Crystal Rabbit, wko02030 Entertainer, wkd02040 Warborg, wks02050 Robin and wks02060 Nike, and the game has no armour for any of them.
# An armour is this mod's own aura command plus its transform in addons/CharacterReforged/content/transforms, and a spirit without both has no armour anywhere.
# The five aura commands below are off, and removing the comment marks here and in the five transform files brings them back.
# was_fantasy_k002010 and was_fantasy_k002011 (Victoria) stay declared in warrior_spirits.toml.
# ```
# The armour of the keshin Crystal Rabbit (wks02020).
# [[aura_command]]
# key = "was_fantasy_k002020"
# from = "was00220"
# cells = { name_text = 0xB7617564, desc_text = 0x37671E6C, aura_chara = 0x0466C92D, chara_param = 0x1D7E9729, order = 114 }
# charas = []
