[es.new]
mod_name = "Character Reforged"
mod_description = "La base de los mods de personajes. Cada personaje tiene sus propias estadísticas y técnicas, el nivel máximo sube a 200 y el tablero de habilidades pasa a ser una tabla ampliada con 6 supertécnicas, un hueco de aura y uno de mezcla. Añade también una ficha de jugador por páginas con modelo 3D y barras de estadísticas, entrenamiento de estadísticas con puntos libres, miximax entre dos jugadores cualesquiera y todos los keshin con su armadura, y opciones de transformaciones con objetos, keshin y tótems por puntos en lugar de tiempo y una barra de aguante para cada jugador."
