# Player Training: the training's rules (read by scripts\player_training.lua at the start; restart the game after a
# change).
#  IF had no [training] section, so these are the values it ran with).
[training]
# "trade" (Libertad = free points; with none left, raising a stat lowers its counterpart one for one; by hand never below
# the base), "pool" (one pool: lowering any stat gives a point back) or "pairs" (Libertad first, then the position
# seesaws; only trained stats can be lowered)
rule = "trade"
# the lowest a drained stat can go, in % of its untrained base (0 = down to 1)
floor_percent = 0
# the highest trained base value of a stat
max_value = 9999
# card rarities that cannot be trained (no Libertad), e.g. [8, 10] for Diamante / Prime; empty = every card trains
locked_rarities = []
# As in IE3, every card reaches the same total at a level: Libertad = Budget(level) - the sum of the card's untrained
# base stats (Disparo .. Agilidad and Suerte, the stats the training spends on), never below 0. Budget(level) = the
# highest such sum of any card at that level (Character Reforged's stat curve over every card with per-character
# values), plus this percentage on top (0 = the strongest card has no Libertad; 10 = every card gets 10 % of that
# total more). 0..1000.
budget_percent = 0

# What Suerte (stat 8: the card's value at his level + the committed training delta) does in a match
# (scripts\lib\stat_effects.lua; docs/game/mechanics/stats-system.md §10). Same rules for both teams. Read once per match.
[stat_effects]
# «Parada» (critical catch, rolled at each shot for the defending keeper): the game's base criticalCatchPercentage
# (retail 10) is written before each shot as round(base + Suerte x per_luck), at most cap. The game then applies its
# own rules on top: the keeper's tension / HP conditions, the parada passives' multiplier and additive terms, the
# 0..100 clamp, a brecha rolled on the same shot cancels both. A whole number (the game stores it as an integer).
# Example: Suerte 150 -> 1 + 3 = 4 %.
critical_catch_base_percent = 1
critical_catch_per_luck = 0.02
critical_catch_cap_percent = 25
# The critical hit of special moves (the framework's critical stage, crit_check: the game has no per-move critical
# roll of its own). This mod answers base + Suerte x per_luck percentage points for the move's user, at most cap. Every
# mod answering crit_check adds its points (Hissatsu Reforged: its [critical] base_chance and archetype terms) and
# the lowest cap of all answers wins. Example: Suerte 150 -> 10 + 7.5 = 17.5 %.
move_critical_base_percent = 10.0
move_critical_per_luck = 0.05
move_critical_cap_percent = 50.0
# the power multiplier of a critical hit this mod answers (multiplied with the other answers: 1.0 leaves the power to
# them, e.g. Hissatsu Reforged's multiplier 1.5; set it above 1.0 when no other mod answers crit_check)
move_critical_power_multiplier = 1.0

# The rival players a mod declares trained to the full for a match (VRFW match training, e.g. Chronicle Deluxe's
# legendary free match: its goalkeepers; scripts\rival_training.lua). Same rules as [training]: the card's whole
# Libertad at the rule's level goes into the stats listed for his position, then each listed stat is raised by the
# trade rule until its counterpart (the position pair, scripts\lib\training_rules.lua) is at its floor. Read once.
[rival_training]
# "priority": each stat in list order takes all the Libertad left (up to max_value); "even": the Libertad split evenly
spread = "priority"
# A stat off the list that still helps the player's position is drained only down to this value; its pair gets that much
# less. One already below it keeps its own value. A stat [rival_training.useless] names goes down to [training]'s floor,
# all its points to its pair. 0 = every stat off the list down to that floor.
useful_floor = 85
# The keeper stats, highest priority first. Source: docs/game/mechanics/stats-system.md §1 «What each stat feeds»:
# Agilidad = keeper saves, PP, DF de foco (classic Catch); Físico = PP, DF de muro; Presión = DF de muro, PP; Suerte =
# the keeper's parada base % (§10.3). They are one stat of each GK pair (training_rules.lua PAIRS[1]), so the trade
# drains their counterparts: Técnica -> Agilidad, Inteligencia -> Físico, Control -> Presión, Disparo -> Suerte.
# Names: kick, control, technique, pressure, physical, intelligence, agility, luck. A position with no list is not
# trained.
GK = ["agility", "physical", "pressure", "luck"]

# The stats useless for each position in the field: they feed only what the position does not do
# (docs/game/mechanics/stats-system.md section 1). A stat here should not be in a stat list of that position.
[rival_training.useless]
GK = ["kick", "control", "technique", "intelligence"]   # shot and focus AT, focus and duel: the keeper saves
FW = ["pressure"]                                       # duel and wall DF
MF = []                                                 # plays both ways: every stat helps
DF = ["kick", "control"]                                # shot and focus AT
