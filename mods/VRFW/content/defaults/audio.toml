# Audio defaults (schema-less). A later mod's defaults\audio.toml key wins; arrays are replaced whole.

# Menu music slots: one song each, in the order the audio creator lists them.

[[menu_slot]]
key = "title"            # title_main, scene_archive_menu (bg00010)
target = "title"
text = "au_slot_title"

[[menu_slot]]
key = "main_menu"
target = "bg10000"
text = "au_slot_main"
menu_music = true

[[menu_slot]]
key = "victory_road"     # victory_road_top_menu
target = "0x38B0BE86"
text = "au_slot_victory_road"

[[menu_slot]]
key = "story"            # story_mode_top_menu
target = "bg10050"
text = "au_slot_story"

[[menu_slot]]
key = "chronicle"        # chronicle_mode_top_menu
target = "bg10020"
text = "au_slot_chronicle"

[[menu_slot]]
key = "kizuna"           # kizuna_town_top_menu
target = "bg10030"
text = "au_slot_kizuna"

[[menu_slot]]
key = "bb_stadium"       # bb_stadium_top_menu
target = "bg10040"
text = "au_slot_bb_stadium"

[[menu_slot]]
key = "results"          # result_menu, mission_result_menu
target = "bg40020"
text = "au_slot_results"
