[pt.new]
mod_name = "Character Reforged"
mod_description = "A base dos mods de personagens. Cada personagem tem as suas próprias estatísticas e técnicas, o nível máximo sobe para 200 e o quadro de habilidades passa a ser uma tabela alargada com 6 supertécnicas, um espaço de aura e um de mistura. Acrescenta também uma ficha de jogador por páginas com modelo 3D e barras de estatísticas, treino de estatísticas com pontos livres, miximax entre dois jogadores quaisquer e todos os keshin com a sua armadura, e opções de transformações com objetos, keshin e totens por pontos em vez de tempo e uma barra de resistência para cada jogador. Além disso, cada jogador tem uma passiva própria, as sinergias de equipa pedem uma equipa ou um grupo, e todo o equipamento tem o mesmo poder total, com afinidade de posição e elemento, 71 conjuntos e 167 objetos clássicos de GO, Chrono Stone e Galaxy."
