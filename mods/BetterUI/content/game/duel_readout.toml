schema = "VRFW.game/2"

# The resolver's result block (on its stack, rbp - 0x30 at the site).
[[VRFW.Struct]]
name = "ClashResultBlock"
size = 0x70
fields = { winner_side = { at = 0x00, type = "u8" }, winner_power = { at = 0x28, type = "i32" }, loser_power = { at = 0x48, type = "i32" }, kind = { at = 0x68, type = "u8" } }

[[VRFW.Struct]]
name = "FocusDuel"
size = 0xCA0
fields = { offense_side = { at = 0x906, type = "u8" }, power_action_side0 = { at = 0xC62, type = "u8" }, power_action_side1 = { at = 0xC92, type = "u8" }, move_side0 = { at = 0xC48, type = "u32" }, move_side1 = { at = 0xC78, type = "u32" }, chara_side0 = { at = 0xC44, type = "u32" }, chara_side1 = { at = 0xC74, type = "u32" } }

[[VRFW.Hook]]
name = "DuelClashResult"
game = "Duel.SkillClashResult"
kind = "mid"
needs = ["ClashResultBlock", "FocusDuel"]

[[VRFW.Command]]
name = "CMND_BETTERUI_DUEL_READOUT"
handler = "BetterUI.DuelReadout"

# CMND_BETTERUI_DUEL_AND_SHOT_COUNTERS_ON() -> true when the option duel_and_shot_counters is on.
[[VRFW.Command]]
name = "CMND_BETTERUI_DUEL_AND_SHOT_COUNTERS_ON"
handler = "BetterUI.DuelAndShotCountersOn"

# CMND_BETTERUI_DUEL_PLATE_LAYOUT() -> the tunables of config.toml [duel_counter] as a table, or nil when one is missing.
[[VRFW.Command]]
name = "CMND_BETTERUI_DUEL_PLATE_LAYOUT"
handler = "BetterUI.DuelPlateLayout"

# CMND_BETTERUI_SHOT_MOVES(shooter, keeper) -> the shot's move and the keeper's move of their last keeper battle (0 = none).
[[VRFW.Command]]
name = "CMND_BETTERUI_SHOT_MOVES"
handler = "BetterUI.ShotMoves"
