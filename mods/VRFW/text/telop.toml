schema = "VRFW.text_key/1"
# Texts of the telop_engine mod (text_engine plugin format). New texts get the id crc32("telop_engine.<name>").
# The custom-telops option row (options.toml label / help) uses these keys; `_off` / `_game` / `_lang_<code>` are its value texts. A missing language falls back to English.
default_lang = "en"

