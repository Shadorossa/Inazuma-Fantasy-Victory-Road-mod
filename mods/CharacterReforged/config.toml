mod = "InazumaFantasy"
shop = "InazumaFantasy.training_shop"
merge = "InazumaFantasy.shops"
rule = "research/mods/InazumaFantasy/content/shop_merges/shops.toml"

[equipment.shape]
trade_tiers = ["big"]
three_from_rank = 0.5
main_share = 1.5
swap_ratio = 0.75
fill_weight = 0.4

[equipment.penalty]
