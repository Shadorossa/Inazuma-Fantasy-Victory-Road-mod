schema = "VRFW.game/2"
# Player Training › what Suerte does in a match (scripts\lib\stat_effects.lua; values in config.toml [stat_effects]).
# Game build v7.2.1 (docs/game/mechanics/stats-system.md §10).

# The match info block ([[g_gameRoot] + Game.RootMatch]): the team blocks at +0x60 + team * 0x1130, 29 member rows of
# 0x80 each. The shot launch takes as the defending keeper the first row whose u8 +0xF1 is 0: its handle u32 +0xE4
# when its u32 +0xD8 is not 0. The script reads the keeper the same way.
[[VRFW.Global]]
name = "player_training_match_info"
base = "game_root"
chain = ["Game.RootMatch"]

# SoccerBattleGlobalParam.criticalCatchPercentage (i32 0..100, instance +0x38): the parada's base %. Read by the parada
# rate function 0x14FD230 (`mov eax, [rip+…]` at +0x30) and inlined in the shot launch 0x1532110.
[[VRFW.Global]]
name = "player_training_critical_catch"
rip = { pattern = "48 83 EC 28 F3 0F 10 25 ?? ?? ?? ?? 44 8B D1 0F 57 ED 0F 57 C9 85 C9 74 17 E8 92 78 FD FF F3 0F 58 C4 41 8B CA 0F 28 E0 E8 ?? ?? ?? ?? 0F 28 C8 8B 05 ?? ?? ?? ?? 0F 57 C0 F3 48 0F 2A C0", disp_off = 0x32, next_ip_off = 0x36, rva = 0x14FD230, target_rva = 0x1E78FB8 }

# The shot launch (v7.1.2 «ShotLaunchStep» 0x150EC60): case 3 of the kick dispatcher 0x1542700, once per shot. It
# rolls the brecha for the shooter and the parada for the defending keeper with criticalCatchPercentage. The script
# writes the keeper's parada base there before the roll (pre). Stolen: mov r11, rsp; push rbp; push r12; push r15;
# lea rbp, [r11-2B8h] (15 bytes, no RIP operand).
[[VRFW.Hook]]
name = "ClassicTraining.ShotLaunch"
kind = "function"
pattern = "4C 8B DC 55 41 54 41 57 49 8D AB 48 FD FF FF 48 81 EC A0 03 00 00 48 8B 05 ?? ?? ?? ?? 48 33 C4 48 89 85 50 02 00 00 49 89 5B 10 4C 8B F9"
rva = 0x1532110
steal = 15
arguments = ["ptr"]
wait_ms = 100
