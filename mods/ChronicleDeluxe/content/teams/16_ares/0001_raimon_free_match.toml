schema = "VRFW.team/2"
# Chronicle Deluxe: the two Raimon of the Ares tab of the free match, two different teams with their own names (the
# game's Chronicle line-ups are both named «Raimon»):
#   fm_raimon_ares      the line-up that faces Barcelona Orb (pltm_cro_ie7_01): «Raimon (Ares)», this mod's text
#   fm_raimon_island    the line-up of the Ares final (pltm_cro_ie7_13): named, crested and dressed as the island's
#                       school team «Isla Remota» (tm_cro_legend_ARES_11: team_text, crest em070012 伊, kit u071201)
# Only the free match plays them (content/teams/90_rules/free_match.toml [[VRFW.FreeMatchGame]]).
default_lang = "en"

[[team]]
name = "fm_raimon_ares"
based_on = "pltm_cro_ie7_01"            # Raimon, first Ares battle (against Barcelona Orb)
  [team.text.en]
  name = "Raimon (Ares)"
  [team.text.es]
  name = "Raimon (Ares)"
  [team.text.fr]
  name = "Raimon (Ares)"
  [team.text.de]
  name = "Raimon (Ares)"
  [team.text.it]
  name = "Raimon (Ares)"
  [team.text.pt]
  name = "Raimon (Ares)"
  [team.text.ja]
  name = "雷門（アレス）"
  [team.text.zh_hans]
  name = "雷门（Ares）"
  [team.text.zh_hant]
  name = "雷門（Ares）"

[[team]]
name = "fm_raimon_island"
based_on = "pltm_cro_ie7_12"            # Raimon, Ares final (against Academia Plenilunio) without Elliot Ember
kit = 0xB60475A5                        # Isla Remota's kit (uniform u071201)
emblem = 0xDAF974AB                     # em070012, Isla Remota's crest (伊)
name_text = 0xABD4DA8E                  # «Isla Remota» (team_text of tm_cro_legend_ARES_11)
