schema = "VRFW.game/2"

# Better Equipment › its match modifier and the equipment commands it follows.
# The logic is scripts\better_equipment.lua; this file only names what it uses in the game.

# The affinity and set stats of the user's players (+15 % / +25 % of an item's raises when the card's position / element
# match; the sets' stats for the pieces worn), added to the match copy: the native table BetterEquipment.StatAdd, key
# (saved character handle, stat 0..7), filled by the script at each save load and after each equip change. A copy is
# looked up by its own handle, then by its saved owner. After the trained points (10) and the run coach (20), before
# the run speed (100).
[[VRFW.MatchStat]]
name = "BetterEquipment.Bonus"
order = 30
stat = "clamp(args[4] + lookup_or(BetterEquipment.StatAdd, lookup_or(BetterEquipment.StatAdd, 0, owner(args[2]), i), args[2], i), 1, 9999)"

# the equipment changes (retail CMND_EQUIP_ITEM / CMND_REMOVE_EQUIP): the table is computed again after the game's handler
[[VRFW.CommandFilter]]
name = "BetterEquipment.AfterEquip"
command = 0x0AB6BEBD
phase = "after"
handler = "BetterEquipment.AfterEquip"

[[VRFW.CommandFilter]]
name = "BetterEquipment.AfterRemove"
command = 0x17F75F90
phase = "after"
handler = "BetterEquipment.AfterEquip"

# the item card's second page on Equipamiento (Character Reforged graft plate_pages): the item's passive, its set and
# the set's bonus tiers, and its affinity, as short text lines ("" = nothing to show)
[[VRFW.Command]]
name = "CMND_BETTEREQUIPMENT_ITEM_PAGE"   # (item id) -> text
aliases = ["CMND_CHARACTERREFORGED_ITEM_PAGE"]   # the name Character Reforged's pages ask
handler = "BetterEquipment.ItemPage"

# the item card's «Conjunto» page: the item's set, its pieces in order and its bonus tiers (nil = in no set)
[[VRFW.Command]]
name = "CMND_BETTEREQUIPMENT_ITEM_SET"    # (item id, charaHdl) -> { name, count, members, tiers = { { pieces, text } }, worn, also }
aliases = ["CMND_CHARACTERREFORGED_ITEM_SET"]   # the name Character Reforged's pages ask
handler = "BetterEquipment.ItemSet"

# The rival players a mod equips for a match (VRFW match equipment, content\match_equipment\*.toml): the worn items'
# own stats, affinity and set stats, added to the rival's roster rows (the NPC builder: args[3] = the chara_param id).
# The native table BetterEquipment.RivalAdd, key (chara_param id, stat 0..7), is filled by the script when the match
# is requested and holds nothing in any other match. Same place as the user's bonus (order 30).
[[VRFW.MatchStat]]
name = "BetterEquipment.RivalBonus"
order = 30
owned = false
npc = true
stat = "clamp(args[4] + lookup_or(BetterEquipment.RivalAdd, 0, args[3], i), 1, 9999)"

# the blocks the framework's match equipment library reads (VRFW scripts\lib\match_equipment.lua): the match info
# (MatchInfo.Game / MatchInfo.Difficulty) and the play data (Game.PlayMode)
[[VRFW.Global]]
name = "match_equipment_info"
base = "game_root"
chain = ["Game.RootMatch"]

[[VRFW.Global]]
name = "match_equipment_play_data"
base = "game_root"
chain = ["Game.RootPlayData"]

# The rival's match equipment in the match's team view (the retail personal plate): the slot's inventory handle
# (CMND_GET_CHARA_EQUIP_HDL 0x07AB2BC2 (chara, slot)) and the item of an inventory handle (0x9EAD709F (handle, 0)).
# A rival chara with match equipment gets pseudo handles of the script; every other call runs the game's handler.
[[VRFW.CommandFilter]]
name = "BetterEquipment.RivalEquipHandle"
command = 0x07AB2BC2
handler = "BetterEquipment.RivalEquipHandle"

[[VRFW.CommandFilter]]
name = "BetterEquipment.RivalInventoryField"
command = 0x9EAD709F
handler = "BetterEquipment.RivalInventoryField"

# «Equipar óptimo» on Equipamiento (retail CMND_EQUIP_OPTIMAL_ITEM 0x8E2B81D9 (chara)): the best combination of the 4
# slots for the player (scripts\better_equipment.lua BetterEquipment.EquipOptimal, weights in rules.toml [optimizer])
# instead of the game's pick. The candidates pass the game's own checks; the result is worn through the game's equip.
[[VRFW.CommandFilter]]
name = "BetterEquipment.EquipOptimal"
command = 0x8E2B81D9
handler = "BetterEquipment.EquipOptimal"
needs = ["BetterEquipment.HasFreeCopy", "BetterEquipment.CharaCanEquip", "BetterEquipment.InventoryUsable",
  "BetterEquipment.EquipStats", "BetterEquipment.EquipToSlot", "BetterEquipment.CharaEquipRole",
  "BetterEquipment.EquipInvHdl", "better_equipment_items"]

[[VRFW.Function]]
name = "BetterEquipment.HasFreeCopy"
game = "Item.HasFreeCopy"

[[VRFW.Function]]
name = "BetterEquipment.CharaCanEquip"
game = "Item.CharaCanEquip"

[[VRFW.Function]]
name = "BetterEquipment.InventoryUsable"
game = "Item.InventoryUsable"

[[VRFW.Function]]
name = "BetterEquipment.EquipStats"
game = "Item.EquipStats"

[[VRFW.Function]]
name = "BetterEquipment.EquipToSlot"
game = "Item.EquipToSlot"

[[VRFW.Function]]
name = "BetterEquipment.CharaEquipRole"
game = "Item.CharaEquipRole"

[[VRFW.Function]]
name = "BetterEquipment.EquipInvHdl"
game = "Item.GetEquipInvHdl"

# [g_gameRoot] + Game.RootItems = the inventory the optimizer walks
[[VRFW.Global]]
name = "better_equipment_items"
base = "game_root"
chain = ["Game.RootItems"]

# The «Family» tab of the shop's filter window (assets\lua\item_filter_menu\300_shop_families.lua). Both stubs read the
# script's block (scripts\better_equipment.lua): u32 tabs of an equipment window, u32 rows, one byte per row.
# (item 1, ...) -> n, value 1, label 1, ..., then value 1, count 1, its items, ... (no items: the retail tab)
[[VRFW.Command]]
name = "CMND_BETTEREQUIPMENT_SHOP_FAMILIES"
handler = "BetterEquipment.ShopFamilies"

# The tab list getter's answer for the equipment windows (masks 0x2000..0x10000): the stat group, then while the block
# says 2 tabs the series group (0), whose rows are text rows with their own list item type (1) the engine's equipment
# test ignores. Data appended by the script: group bytes 1 0, the block's address. Ends in its own ret.
[[VRFW.Patch]]
name = "BetterEquipment.ShopFamilyGroups"
kind = "stub"
apply = "script"
pattern = "48 3D 00 00 01 00 74 16 48 3D 00 00 02 00 75 62 C7 02 01 00 00 00 48 8D 05 ?? ?? ?? ?? C3 ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? B9 00 00 00 80"
offset = 0x1E
expect = "C7 02 01 00 00 00 48 8D 05 ?? ?? ?? ?? C3"
code = "48 8B 05 0E 00 00 00 8B 00 89 02 48 8D 05 01 00 00 00 C3"
tail = false

# The series group's row loop: on an equipment window (mask & 0x1E000) one row per byte of the block, in that order (the
# builder sorts by r9d); else the game's rows 1..9. rdi = the window. Data appended by the script: the block's address.
[[VRFW.Patch]]
name = "BetterEquipment.ShopFamilyRows"
kind = "stub"
apply = "script"
pattern = "33 ED 48 8B F9 89 A9 30 9F 01 00 ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? ?? 48 8B CF E8 ?? ?? ?? ?? 48 8D 15"
offset = 0xB
expect = "B3 01 0F 1F 40 00 66 0F 1F 84 00 00 00 00 00 44 0F B6 CB 48 8B CF 41 8B D1 E8 ?? ?? ?? ?? FE C3 80 FB 0A 72 EA"
code = "48 8B 87 50 9F 01 00 A9 00 E0 01 00 74 22 31 DB 48 8B 05 36 00 00 00 3B 58 04 73 2C 0F B6 54 18 08 41 89 D9 48 8B CF E8 ?? ?? ?? ?? FF C3 EB E0 B3 01 44 0F B6 CB 48 8B CF 41 8B D1 E8 ?? ?? ?? ?? FE C3 80 FB 0A 72 EA E9 ?? ?? ?? ??"
tail = false
refs = [{ at = 40, branch = 0x24 }, { at = 61, branch = 0x24 }, { at = 73, to = 0x30 }]
