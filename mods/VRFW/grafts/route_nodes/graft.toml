# VRFW [[VRFW.RouteNode]] (Chronicle board side nodes): the one shared board rule (rn_common.lua) for every mod's
# nodes, data from team_engine (CMND_VRFW_TEAM_ROUTE_NODE_* / CMND_VRFW_TEAM_ROUTE_ROAD_*; the roads' layer: framework menus/route_roads.toml).
# A framework graft: any mod's nodes are drawn by it,
# with no other mod needed.
# Board: lock a never-used node slot, open nodes whose prerequisites are won (OnInit silently, after a clear with the
# retail open effect), hide closed nodes, draw the shown nodes' roads (overlay sprites above the map tiles). Command menu:
# only the node's shown difficulties (VRFW.route_nodes.rows, called by graft route_board's VRFW.route_board_commands.rows hook point). The
# board scripts' hook points and their VRFW.host hosts are graft route_board's (order 190: its host call runs after
# this graft's and route_chains' files).
name = "route_nodes"
mod = "VRFW"
order = 160
module = ""
requires = []
conflicts = []
wraps = []
description = "Chronicle board: side nodes declared with [[VRFW.RouteNode]]"

[[files]]
stem = "vs_route_town_menu"

  [[files.ops]]
  type = "insert_before"
  point = "vs_route_town_menu.FinalizeMenu.RouteNodes"
  source = "rn_common.lua"

  # after the retail one-time lock set-up of a save (clear bit (0, 1)): the start's neighbours, node slots, open nodes
  [[files.ops]]
  type = "insert_before"
  point = "vs_route_town_menu.OnInit.RouteNodes"
  text = '''
  VRFW.route_nodes.open_start_neighbours() -- VRFW route_nodes
  VRFW.route_nodes.sync(false) -- VRFW route_nodes
'''
  crc = "none"

  # the roads (drawn at run time): each instance of the layer vrfw_route_road (framework menus
  # route_roads.toml) shows its node's road sprite while the node is shown; the map tiles stay the retail ones
  [[files.ops]]
  type = "insert_before"
  point = "vs_route_town_menu.OnSetupLayer.RouteNodes"
  text = '''
  elseif a1 == VRFW.route_nodes.ROAD_LAYER then -- VRFW route_nodes
    VRFW.route_nodes.road_setup(a2)
'''
  crc = "none"

  # Every instance again once the map is open (its layers exist).
  [[files.ops]]
  type = "insert_after"
  point = "vs_route_town_menu.SetupTownMap.RouteNodes"
  text = '''
  VRFW.route_nodes.roads() -- VRFW route_nodes
'''
  crc = "none"

  # Accept on a piece: a shown node is not refused for its locked difficulty 1 (Heroica-only nodes and chain "C" pieces
  # have no Chronicle difficulty: the retail "beat the previous square's route-unlock battle" message came up instead of their menu)
  [[files.ops]]
  type = "replace"
  point = "vs_route_town_menu.OnEnter.RouteNodes"
  text = '''
          local chronicle_lock_status = funcLuaCommand(3394595467 --[[CMND_GET_CHRONICLE_LOCK_STATUS]], ret3, 1) and not VRFW.route_nodes.enterable(ret3) -- VRFW route_nodes
'''
  crc = "none"

  # a closed node drawn locked (`LockedTitle`): Accept says what opens it instead of
  # the retail "beat the previous square's route-unlock battle" message
  [[files.ops]]
  type = "insert_before"
  point = "vs_route_town_menu.OnEnter.RouteNodesBefore"
  text = '''
            s = VRFW.route_nodes.locked_text(ret3, s) -- VRFW route_nodes
'''
  crc = "none"

  # Its board balloon shows that text (the piece's guideTextId otherwise).
  [[files.ops]]
  type = "replace"
  point = "vs_route_town_menu.UpdatePieceAtcBalloon.RouteNodes"
  text = '''
  local guide_text_id = VRFW.route_nodes.guide_text(a3, GetGuideTextId(a3)) -- VRFW route_nodes
'''
  crc = "none"

  # the caravan follows the nodes' roads (fork point, bends), not a straight line from beside (VRFW.route_nodes.path), and stops on
  # the road nearest to a road-less node (VRFW.route_nodes.off_road)
  [[files.ops]]
  type = "replace"
  point = "vs_route_town_menu.CheckCharaMoveTownMapPiece.RouteNodes"
  text = '''
  t9 = VRFW.route_nodes.off_road(VRFW.route_nodes.path(funcLuaMenuVSRouteTownCommand(111188339, n14, n11))) -- VRFW route_nodes
'''
  crc = "none"

  # the map scroll (the board cursor stays centred) follows the same rails as the caravan (VRFW.route_nodes.scroll_rail)
  [[files.ops]]
  type = "insert_before"
  point = "vs_route_town_menu.UpdateMapScroll.RouteNodes"
  text = '''
  VRFW.route_nodes.scroll_start(n15) -- VRFW route_nodes
'''
  crc = "none"

  [[files.ops]]
  type = "insert_before"
  point = "vs_route_town_menu.UpdateMapScroll.RouteNodesBefore"
  text = '''
  VRFW.route_nodes.scroll_end() -- VRFW route_nodes
'''
  crc = "none"

  [[files.ops]]
  type = "insert_after"
  point = "vs_route_town_menu.UpdateScrollPos.RouteNodes"
  text = '''
  a1, a2 = VRFW.route_nodes.scroll_rail(a1, a2) -- VRFW route_nodes
'''
  crc = "none"

  # the d-pad never moves to a closed node (the cursor reached the locked, hidden Ogre 2): the game's
  # d-pad handler (native) asks ScrollToPieceByDpad(next piece) along the static move graph; a hidden node is refused
  [[files.ops]]
  type = "insert_after"
  point = "vs_route_town_menu.ScrollToPieceByDpad.RouteNodes"
  text = '''
  if VRFW.route_nodes.hidden(a1) then -- VRFW route_nodes
    return
  end
'''
  crc = "none"

  # nor focused by the free cursor / a click (an empty forest spot LU of Raimon equipo B, the
  # closed Ogre 2 node, took the cursor and Accept gave the retail "beat the previous square's route-unlock battle"
  # message): the native piece hit test still knows the hidden piece and calls UpdatePieceFocus with it; a hidden node
  # is focused as empty map (-1, as the retail does off every piece), so it gets no balloon, no Accept, no caravan move
  [[files.ops]]
  type = "insert_after"
  point = "vs_route_town_menu.UpdatePieceFocus.RouteNodes"
  text = '''
  if VRFW.route_nodes.hidden(a2) then -- VRFW route_nodes
    a1 = -1
    a2 = -1
  end
'''
  crc = "none"

  # `PieceScale`: a node's piece (base and crest) drawn smaller / bigger; the other pieces back at 1 (VRFW.route_nodes.piece_scale)
  [[files.ops]]
  type = "insert_after"
  point = "vs_route_town_menu.UpdateTownMapPiece.RouteNodes"
  text = '''
  VRFW.route_nodes.piece_scale(a1, a2, a3) -- VRFW route_nodes
'''
  crc = "none"

  # closed nodes are not drawn
  [[files.ops]]
  type = "insert_before"
  point = "vs_route_town_menu.UpdatePlacementPiece.RouteNodes"
  text = '''
  if VRFW.route_nodes.hidden(a2) then -- VRFW route_nodes
    a2 = -1
    a4 = nil
    a5 = nil
    a6 = false
  end
'''
  crc = "none"

  # the retail open effect of new pieces: the roads of the route nodes among them show as they appear (their road
  # instance is made visible, VRFW.route_nodes.reveal)
  [[files.ops]]
  type = "insert_after"
  point = "vs_route_town_menu.WaitPieceOpenEffect.RouteNodes"
  text = '''
  VRFW.route_nodes.reveal_pieces(a1) -- VRFW route_nodes
'''
  crc = "none"

  # after a clear: nodes whose prerequisites are now won open (with the retail effect), roads follow
  [[files.ops]]
  type = "insert_before"
  point = "vs_route_town_menu.UpdateClearEffect.RouteNodes"
  text = '''
  if VRFW.route_nodes.sync(true) then -- VRFW route_nodes
    VRFW.route_nodes.roads()
  end
'''
  crc = "none"

[[files]]
stem = "vs_route_town_command_select_menu"

  # VRFW.route_nodes.by_slot / VRFW.route_nodes.rows for the piece's rows (route_board: t3 = VRFW.route_board_commands.rows(...)); the functions are
  # globals, defined before any call
  [[files.ops]]
  type = "insert_before"
  point = "vs_route_town_command_select_menu.FinalizeMenu.RouteNodes"
  source = "rn_common.lua"
