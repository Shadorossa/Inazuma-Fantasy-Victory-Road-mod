# Declaration schema of CharacterReforged.era_kit/1 (content\era_kits): fields read from the records the mods ship. `vrfw check` validates the files with it and the ModManager draws their forms from it.
schema = "VRFW.decl_schema/1"
kind = "CharacterReforged.era_kit/1"
folder = "content/era_kits"
# v2 words, read beside the v1 ones until the switch: the type and its kind folder.
v2_type = "CharacterReforged.Team.EraKit"
v2_kind_folder = "Teams/EraKits"
label = "Era kits"
label_es = "Equipaciones por época"
doc = "The kit each team wears in each era, and which card rarities use them."
doc_es = "La equipación que lleva cada equipo en cada época y qué rarezas de carta la usan."

[entry.EraKit]
single = true
card_rarities = { type = "ints" }
team_columns = { type = "strings" }
any_era = { type = "bool" }
era_order = { type = "strings" }
eras = { type = "table" }
team_kits = { type = "table" }
