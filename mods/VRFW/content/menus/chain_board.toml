schema = "VRFW.menu/2"

layout = [
    { file = "common/menu/51_save/save01/vrfw_chain_rows/vrfw_chain_rows.g4pkm", from = "common/menu/51_save/save01/save01_01/save01_01.g4pkm" },
    { file = "common/menu/51_save/save01/vrfw_chain_rows/vrfw_chain_rows.g4pkm", joint = "_system_line01", translate = [97.0, 2803.0, 0.0] },
    { file = "common/menu/51_save/save01/vrfw_chain_rows/vrfw_chain_rows.g4pkm", joint = "_text_time01", translate = [116.0, 2812.0, 0.0] },
    { file = "common/menu/51_save/save01/vrfw_chain_rows/vrfw_chain_rows.g4pkm", joint = "_pos_time01", translate = [377.0, 2822.0, 0.0] },
    { file = "common/menu/51_save/save01/vrfw_chain_rows/vrfw_chain_rows.g4pkm", joint = "_pos_top_list_atc01", translate = [0.0, 2696.0, 0.0] },
]

[[object]]
name = "vrfw_chain_rows"
from = "save01_01_list_attach_base"
remove = [
    { parameter = "NullLayerName", match = { 1 = 0x6735D333, 2 = 0x9E0634B0, 3 = 0xCDF9A8B9, 4 = 1 } },
    { parameter = "NullLayerName", match = { 1 = 0x1032E3A5, 2 = 0xE9010426, 3 = 0xCDF9A8B9, 4 = 2 } },
    { parameter = "NullLayerName", match = { 1 = 0x8E567606, 2 = 0x77659185, 3 = 0xCDF9A8B9, 4 = 3 } },
    { parameter = "NullLayerName", match = { 1 = 0xF9514690, 2 = 0x0062A113, 3 = 0xCDF9A8B9, 4 = 4 } },
    { parameter = "NullLayerName", match = { 1 = 0x6058172A, 2 = 0x996BF0A9, 3 = 0x1FA09B6B, 4 = 0 } },
]
set = [
    { parameter = "SkeletonAnime", match = { 1 = "common/menu/51_save/save01/save01_01/save01_01.g4pkm" }, values = { 1 = "common/menu/51_save/save01/vrfw_chain_rows/vrfw_chain_rows.g4pkm" } },
]

[[object]]
name = "vrfw_chain_back"
from = "cmn01_10_new_icon"
set = [{ parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 450 } }]

[[object]]
name = "vrfw_chain_helpwin"
from = "cmn01_10_new_icon"
set = [{ parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 460 } }]

[[object]]
name = "vrfw_chain_card"
from = "cmn01_10_new_icon"
set = [{ parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 459 } }]

[[object]]
name = "vrfw_chain_icon"
from = "cmn01_10_new_icon"
set = [{ parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 461 } }]

[[object]]
name = "vrfw_chain_bg"
from = "cmn01_10_new_icon"
set = [{ parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 451 } }]

[[object]]
name = "vrfw_chain_line"
from = "cmn01_10_new_icon"
set = [{ parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 453 } }]

# the tile plates are the mouse's hit areas: a MenuCollisionSetting on the quad node
[[object]]
name = "vrfw_chain_tile"
from = "cmn01_10_new_icon"
add_block = [{ block = "MenuCollisionSetting", values = [0], after = "CMenuAnimation" }]
set = [{ parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 455 } }]
add = [{ block = "MenuCollisionSetting", parameter = "_icon_new01", values = [0, 1, 1] }]

[[object]]
name = "vrfw_chain_emb"
from = "cmn01_10_new_icon"
set = [{ parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 457 } }]

[[object]]
name = "vrfw_chain_tag"
from = "cmn01_10_new_icon"
set = [{ parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 458 } }]

[[object]]
name = "vrfw_chain_ui"
from = "cmn01_10_new_icon"
set = [{ parameter = "m_drawPriority", match = { 1 = 999 }, values = { 1 = 459 } }]

# ---- the screen -------------------------------------------------------------------------------------------------------
[[screen]]
name = "vrfw_chain_board_menu"
like = "language_option_menu"
base = "savedata_management_menu"
script = "assets/lua/screens/vrfw_chain_board_menu.lua"

