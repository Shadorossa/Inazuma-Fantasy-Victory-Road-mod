schema = "VRFW.option/2"
# Classic Recruitment's rows on the Mods screen's «Ajustes» and in Options > «Mod options».

# Off = the game's own recruitment: the files gated on this row are not read and ClassicRecruitment.applies answers false.
[[option]]
id = "classic_recruitment"                     # row key ClassicRecruitment.classic_recruitment
type = "toggle"
label = "option_classic_recruitment"           # text\keys.toml, 9 languages
help = "option_classic_recruitment_help"
default = 1
order = 174
restart = true                                 # The gated files are read at the start.

# Read at run time by ClassicRecruitment.gacha_removed (Lua): off = the Players Universe gacha is closed; the hub map's function point table is built at start.
[[option]]
id = "players_universe"                        # row key ClassicRecruitment.players_universe
type = "toggle"
label = "option_players_universe"              # text\keys.toml, 9 languages
help = "option_players_universe_help"
default = 0
order = 175

# Read by ClassicRecruitment.spirits_hidden (Lua) and gates content\duplicate_rules\classic_recruitment.toml: off = spirits hidden and one card per player; drops and the album stay.
[[option]]
id = "spirit_section"                          # row key ClassicRecruitment.spirit_section
type = "toggle"
label = "option_spirit_section"                # text\keys.toml, 9 languages
help = "option_spirit_section_help"
default = 1
order = 176
restart = true                                 # The duplicate rule file is gated at the start; spirits_hidden reads the same start value.
