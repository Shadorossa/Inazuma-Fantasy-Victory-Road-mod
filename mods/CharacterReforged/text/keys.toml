[it.new]
mod_name = "Character Reforged"
mod_description = "La base dei mod dei personaggi. Ogni personaggio ha statistiche e tecniche proprie, il livello massimo sale a 200 e il tabellone delle abilità diventa una tabella ampliata con 6 supertecniche, uno slot aura e uno slot mix. Aggiunge anche una scheda giocatore a pagine con modello 3D e barre delle statistiche, un allenamento delle statistiche con punti liberi, il miximax tra due giocatori qualsiasi e tutti i keshin con la loro armatura, e opzioni per le trasformazioni tramite oggetti, keshin e totem a punti invece che a tempo e una barra di resistenza per ogni giocatore. Inoltre ogni giocatore ha una passiva propria, le sinergie di squadra chiedono una squadra o un gruppo, e ogni equipaggiamento ha la stessa potenza totale, con affinità di ruolo ed elemento, 71 set e 167 oggetti classici di GO, Chrono Stone e Galaxy."
