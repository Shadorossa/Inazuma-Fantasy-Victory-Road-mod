# The player page's part in the two character banks: their page table, the common block and the bank lineup hide.
# Sources: the files of research/grafts/plate_pages.
name = "plate_pages_bank"
mod = "CharacterReforged"
order = 975
module = "lua_bridge"
requires = ["plate_hiper_bank"]
conflicts = []
wraps = ["PostStep", "OnCloseLayer", "ChangeActiveUI", "OpenPersonalPlate", "ClosePersonalPlate",
         "SetNameSearchInputEnabled"]
description = "Player page: the pages in the two character banks"

[[files]]
stem = "chara_bank_menu"

  [[files.ops]]
  type = "replace"
  point = "chara_bank_menu.main.PlatePages"
  text = '''
local t2 = {1, 0, 2, 3, 5, 6, 8, 9} -- Character Reforged player page: Hiper page (index 4, type 5), BetterQoL career page (index 5, type 6), PERFIL (6, type 8), ATRIBUTOS (7, type 9)
'''
  crc = "none"

  [[files.ops]]
  type = "append_block"
  source = "../plate_pages/plate_pages_common.lua"
  marker = "plate_pages common"

  [[files.ops]]
  type = "append_block"
  source = "../plate_pages/plate_bank_lineup.lua"
  marker = "plate_pages bank"

[[files]]
stem = "chara_bank_menu_for_search"

  [[files.ops]]
  type = "replace"
  point = "chara_bank_menu_for_search.main.PlatePages"
  text = '''
local t3 = {1, 0, 2, 3, 5, 6, 8, 9} -- Character Reforged player page: Hiper page (index 4, type 5), BetterQoL career page (index 5, type 6), PERFIL (6, type 8), ATRIBUTOS (7, type 9)
'''
  crc = "none"

  [[files.ops]]
  type = "append_block"
  source = "../plate_pages/plate_pages_common.lua"
  marker = "plate_pages common"

  [[files.ops]]
  type = "append_block"
  source = "../plate_pages/plate_bank_lineup.lua"
  marker = "plate_pages bank"
