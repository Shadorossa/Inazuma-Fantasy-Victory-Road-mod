# Declaration schema of VRFW.behaviour/1 (content\rules): fields read from the records the mods ship. `vrfw check` validates the files with it and the ModManager draws their forms from it.
schema = "VRFW.decl_schema/1"
kind = "VRFW.behaviour/1"
folder = "content/rules"
# v2 words, read beside the v1 ones until the switch: the type, its kind folder and its format version.
v2_type = "VRFW.Rule.Behaviour"
v2_kind_folder = "Rules/Behaviours"
v2_version = 1
label = "Behaviour rules"
label_es = "Reglas de comportamiento"

[entry.Rule]
entry_table = "rule"
id = { type = "name", required = true }
on = { type = "string", required = true }
do = { type = "table", required = true }
when = { type = "table" }
priority = { type = "int" }
text = { type = "string" }
