id = "BattleBayDeluxe"
# English fallback; the Mods screen shows the text keys mod_name / mod_description (text\keys.toml).
name = "Battle Bay Deluxe"
version = "0.3.0"
author = "Fantasy Team"
description = "Adds the 221 Chronicle teams to the Battle Bay as teams to pick and rivals, with their original players, kits and special moves. Play with your active team, a Draft, a Tournament, a League, a daily challenge or a private 1v1 room."
priority = 0
tags = ["Teams", "Gameplay"]
updated = "2026-11-09"
prefix = "BattleBayDeluxe"
folder = "BattleBayDeluxe"
# Content types whose new ModManager records are saved in this mod.
owns = ["battle_bay", "teams", "team_tags", "level_sync"]
# Layout: docs/framework/mod-layout.md; contents: README.md.
requires = ["VRFW>=0.3.0", "VRFW.text", "VRFW.menu", "BetterUI>=0.3.0"]
optional = ["BetterQoL", "CharacterReforged", "LegendaryAI"]
conflicts = []
# Native access used by content\game (docs/internal/native.md).
permissions = ["memory", "call", "command", "state", "hook"]
# Carries the grafts' funcLuaCommand calls of CMND_BATTLEBAYDELUXE_* commands.
loader_modules = ["lua_bridge"]

# BattleBayDeluxe.Ratings(): team id -> rating from battlebaydeluxe_team_rating.cfg.bin ({} when no mod ships it).
[exports]
functions = ["Ratings"]
keys = []
