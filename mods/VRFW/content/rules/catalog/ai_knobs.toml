# ------------------------------------------------------------------------------------------------ passing

[passing]
commands = ["CMD_PASS_01"]
move_actions = [0]

# the move stick's analog commands (x, y) StickRead reads; the pair the user moved last is used
[stick]
axes = [["CMD_MOVE_X", "CMD_MOVE_Y"], ["CMD_MOVE_LX", "CMD_MOVE_LY"]]
# the stick-to-pitch turn read from kick-off before any run teaches it (degrees, from the log line `learned your stick's turn`; unset = learned in the first runs)
# seed_turn_deg = 0.0
# seed_mirror = false

[ai_move]
chase_action = 15
move_action = 0
sprint_dash_type = 1
sprint_action = 0
# the game's defence wall action (the executor table's id of CreateDefenseWall's caller, match-ai.md §9.7)
wall_action = 28

[[condition]]
name = "opponent_duel_side_bias_above"
min = 0.5
max = 1.0
summary = "the other side's duel side steps / angled breakthroughs go to one side (of its attack) more than Value of the time (LearnUserMoves)"

[[condition]]
name = "opponent_duel_pass_out_above"
min = 0.0
max = 1.0
summary = "the other side passes out of a duel more than Value of its duel actions (LearnUserMoves)"

[[condition]]
name = "opponent_passes_often"
min = 0.0
max = 1.0
summary = "more than Value of the other side's possessions end in a pass to a teammate (LearnUserMoves)"

[[condition]]
name = "opponent_dribbles_often"
min = 0.0
max = 1.0
summary = "more than Value of the other side's possessions end otherwise (carried on, lost, shot) (LearnUserMoves)"

[learning]
min_samples = 4

# ------------------------------------------------------------------------------------------------ power

[power]
counter_shot_power_rate = 0.5
counter_shot_tension_rate = 2.0
shot_block_basic_rate = 0.1
keeper_level_rate = 0.01
# skillBattleWinPercent: [stronger / weaker <= ratio, the stronger side's chance]; beyond the last row it always wins
duel_win_table = [[1.2, 0.5], [1.5, 0.6]]

# ------------------------------------------------------------------------------------------------ the element wheel

# Elements of the game (ids of the unit and move records); a beats b.
[elements]
advantage = 1.2
own_element = 1.2
# [own move category, the category the other side answers with]: 1 shot, 2 dribble, 3 block, 4 keeper
