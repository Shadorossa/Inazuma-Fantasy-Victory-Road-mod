#                                graft character_reforged_board), the refusal window's texts (text\keys.toml create_refused_*)
#   content\menus\skill_table.toml the skill table screen evt_skill_slot_menu (registry row, setting, objects, layouts)
#   assets\menu\                  its art (+ content\images\menu\102_team\team02\team02_02\plate_peg.toml: the PEG look of
