schema = "VRFW.text_key/1"
# Texts of «Strikers Shots» (format of the text engine:): the «Mods» screen's name and
# description, and the «Saltar la cinemática de gol especial» row of «Opciones de mods» (options.toml).
# The On / Off value names are mod_options' own. A language missing here falls back to English.
default_lang = "en"

[en.new]
mod_name = "Strikers Shots"
mod_description = "Shots at goal like a TV broadcast: while a shot of your team flies, the camera shows it from the touchline, then your camera comes back. Finished shot auras keep the look of the move's cut-in while the ball flies in a straight line to the goal. Scoring with a few special moves, such as Inazuma Break or Ultimate Eleven Assault, smashes the goal; an option in Mod options skips that scene. Visual only: no power, cost or block change."
skip_goal_scene = "Skip special goal scene"
skip_goal_scene_help = "On: goals scored with this mod's moves show the normal goal scene."

[es.new]
mod_name = "Strikers Shots"
mod_description = "Tiros a portería como en la tele: mientras vuela un tiro de tu equipo, la cámara lo muestra desde la banda y luego vuelve tu cámara. Las auras de tiro terminadas conservan el aspecto de la escena de la técnica mientras el balón vuela en línea recta a la portería. Marcar con algunas supertécnicas, como Ruptura Inazuma o Asalto de los Once Definitivos, destroza la portería; una opción de Opciones de mods salta esa escena. Solo visual: no cambia ni la potencia ni el coste ni el bloqueo."
skip_goal_scene = "Saltar la cinemática de gol especial"
skip_goal_scene_help = "Activado: los goles con técnicas de este mod muestran el gol normal."

[fr.new]
mod_name = "Strikers Shots"
mod_description = "Des tirs cadrés comme à la télé : pendant qu'un tir de votre équipe vole, la caméra le montre depuis la ligne de touche, puis votre caméra revient. Les auras de tir terminées gardent l'aspect de la scène de la technique pendant que le ballon file en ligne droite vers le but. Marquer avec quelques supertechniques, comme Inazuma Break ou Assaut des Onze Ultimes, fracasse le but ; une option de Options des mods saute cette scène. Visuel uniquement : ni puissance, ni coût, ni blocage ne changent."
skip_goal_scene = "Passer la scène de but spéciale"
skip_goal_scene_help = "Activé : les buts marqués avec ce mod montrent le but normal."

[de.new]
mod_name = "Strikers Shots"
mod_description = "Torschüsse wie im Fernsehen: Während ein Schuss deines Teams fliegt, zeigt die Kamera ihn von der Seitenlinie, danach kehrt deine Kamera zurück. Fertige Schussauren behalten das Aussehen der Szene der Technik, während der Ball geradlinig zum Tor fliegt. Ein Tor mit einigen Spezialtechniken, etwa Inazuma Break oder Ultimativer Elfer-Angriff, zerschmettert das Tor; eine Option in den Mod-Optionen überspringt diese Szene. Nur optisch: Stärke, Kosten und Block bleiben unverändert."
skip_goal_scene = "Spezial-Torszene überspringen"
skip_goal_scene_help = "An: Tore mit Techniken dieses Mods zeigen die normale Torszene."

[it.new]
mod_name = "Strikers Shots"
mod_description = "Tiri in porta come in TV: mentre vola un tiro della tua squadra, la telecamera lo mostra dalla linea laterale, poi torna la tua telecamera. Le aure di tiro finite mantengono l'aspetto della scena della tecnica mentre il pallone vola in linea retta verso la porta. Segnare con alcune supertecniche, come Inazuma Break o Assalto degli Undici Definitivi, manda in frantumi la porta; un'opzione in Opzioni mod salta quella scena. Solo visivo: potenza, costo e parata non cambiano."
skip_goal_scene = "Salta la scena del gol speciale"
skip_goal_scene_help = "Attivato: i gol con le tecniche di questa mod mostrano il gol normale."

[pt.new]
mod_name = "Strikers Shots"
mod_description = "Chutes a gol como na TV: enquanto voa um chute da sua equipa, a câmara mostra-o a partir da linha lateral e depois volta a sua câmara. As auras de chute terminadas mantêm o aspeto da cena da técnica enquanto a bola voa em linha reta para a baliza. Marcar com algumas supertécnicas, como Ruptura Inazuma ou Assalto dos Onze Definitivos, destrói a baliza; uma opção em Opções de mods salta essa cena. Só visual: a potência, o custo e o bloqueio não mudam."
skip_goal_scene = "Saltar a cena de golo especial"
skip_goal_scene_help = "Ativado: os golos com técnicas deste mod mostram o golo normal."

[ja.new]
mod_name = "Strikers Shots"
mod_description = "テレビ中継のようなシュート：自チームのシュートが飛んでいる間、カメラがサイドラインから映し、その後いつものカメラに戻ります。完成したシュートオーラは、ボールがゴールへ一直線に飛ぶ間もカットインの見た目を保ちます。イナズマブレイクや最強イレブン波動などの特殊ゴールを決めるとゴールが砕け、モッドオプションでその演出を飛ばせます。見た目だけで、威力・消費・ブロックは変わりません。"
skip_goal_scene = "特殊ゴール演出をスキップ"
skip_goal_scene_help = "オン：このMODの必殺技でのゴールは通常のゴール演出になります。"

[zh_hans.new]
mod_name = "Strikers Shots"
mod_description = "像电视转播一样的射门：本队的射门飞行时，镜头从边线拍摄，之后回到你的镜头。完成的射门光环会在球直线飞向球门时保持过场演出中的外观。用闪电爆破或最强十一人波动等部分必杀技进球会击碎球门，“模组选项”中可跳过该演出。仅为视觉效果：威力、消耗和阻挡都不变。"
skip_goal_scene = "跳过特殊进球演出"
skip_goal_scene_help = "开：用本模组必杀技的进球显示普通进球演出。"

[zh_hant.new]
mod_name = "Strikers Shots"
mod_description = "像電視轉播一樣的射門：本隊的射門飛行時，鏡頭從邊線拍攝，之後回到你的鏡頭。完成的射門光環會在球直線飛向球門時保持過場演出中的外觀。用閃電爆破或最強十一人波動等部分必殺技進球會擊碎球門，「模組選項」中可跳過該演出。僅為視覺效果：威力、消耗和阻擋都不變。"
skip_goal_scene = "跳過特殊進球演出"
skip_goal_scene_help = "開：用本模組必殺技的進球顯示普通進球演出。"
