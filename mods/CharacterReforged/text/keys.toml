[en.new]
mod_name = "Character Reforged"
mod_description = "The base of the character mods. Every character gets his own stats and moveset, the level cap rises to 200, and the skill board becomes an expanded table with 6 special moves, an aura slot and a mix slot. It also adds a paged player page with a 3D model and stat gauges, stat training with free points, a miximax between any two players and every keshin with its armour, and options for item transformations, keshin and totems on points instead of time and a stamina bar for every player. Each player also has an own passive, team synergies ask for a team or a group, and every equipment item has the same total power, with position and element affinity, 71 sets and 167 classic items from GO, Chrono Stone and Galaxy."
