# BetterUI › duel power counter: a screen of its own, betterui_power_counter_menu, a copy of soccer_shoot_catch_info_menu
# (the same plates, resources and registry row as the game's shot readout: layout soccer10_25 with BetterUI's smaller,
# raised banners). scripts\duel_readout.lua opens it when a cut-in of the duel starts and closes it when the cut-in ends.
# Script: assets\lua\screens\betterui_power_counter_menu.lua.
# Left plate = the player's side, right plate = the rival's, each with its player's 3D bust (the retail objects' capture
# component and portrait mesh). The plates' picture labels («TOTAL AT» / «PP») are hidden and
# replaced by a text label under the digits: the move's name, or «Dribbling» / «Defending» / «Power Charge» /
# «Power Block» (text keys of text\keys.toml) for a side without a move's name.
schema = "VRFW.menu/2"

# the label's layout: a copy of the corner button's with a text box wide enough for any name on one line (retail 368 px;
# the game squeezes a line wider than its box, and a layer's scale scales the box too)
[[layout]]
file = "common/menu/20_cmn/cmn03/evt_bui_power_counter_label/evt_bui_power_counter_label.g4pkm"
from = "common/menu/20_cmn/cmn03/cmn03_01/cmn03_01.g4pkm"

[[layout]]
file = "common/menu/20_cmn/cmn03/evt_bui_power_counter_label/evt_bui_power_counter_label.g4pkm"
joint = "_text_cmd_back01"
scale = [840.0, 76.0, 1.0]

# the label: the retail corner button's text node only (its plates hidden by the script), no collision and no anchor
# (placed by the script), drawn over the plates (310)
[[object]]
name = "betterui_power_counter_label"
from = "cmn03_01_cmd_back"
remove_block = ["MenuCollisionSetting", "MenuAnchorComponent"]
set = [
    { parameter = "SkeletonAnime", match = { 1 = "common/menu/20_cmn/cmn03/cmn03_01/cmn03_01.g4pkm" }, values = { 1 = "common/menu/20_cmn/cmn03/evt_bui_power_counter_label/evt_bui_power_counter_label.g4pkm" } },
    { parameter = "m_drawPriority", match = { 1 = 301 }, values = { 1 = 312 } },
]
add = [{ block = "gmdMenuObj", parameter = "Texture", values = ["#/menu/20_cmn/cmn03/cmn03_01/cmn03_01.g4tx"] }]

[[screen]]
name = "betterui_power_counter_menu"
like = "soccer_shoot_catch_info_menu"
base = "soccer_shoot_catch_info_menu"
script = "assets/lua/screens/betterui_power_counter_menu.lua"

[screen.rows]
layer = [
    { layer = "soccer10_25_at_kp_power_info_telop_self" },
    { layer = "soccer10_25_at_kp_power_info_telop_enemy" },
    { layer = "betterui_power_counter_label", object = "betterui_power_counter_label", count = 2 },
]
group_base = [
    { layer = "soccer10_25_at_kp_power_info_telop_self", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "soccer10_25_at_kp_power_info_telop_enemy", flags = [0, 1, 0, 0, 1, 0] },
    { layer = "betterui_power_counter_label", flags = [0, 0, 0, 0, 1, 0] },
]
group = [
    { group = "betterui_power_counter_menu", flags = [1], slice = [0, 3] },
]
