schema = "VRFW.match_camera/1"

# Touchline camera written into the chase rows (58-61) and the camera-distance rows (0-3 / 12-15).
[[preset]]
name = "side"
kind = "chase_rows"
yaw = 90.0            # 90 = the usual touchline, 270 = the other one
pitch = 28.0          # degrees above the horizontal
distance = 40.0       # metres from the look point (retail 32)
fov = 35.0            # vertical field of view (retail 45)
# false = the in-play updater (0x153A120) sweeps the pitch with the ball's depth; true holds it at `pitch`.
fixed_pitch = false
option = "horizontal"
